<!doctype html><html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@500;600;700;800&display=swap">
<style>
*{box-sizing:border-box;margin:0}body{background:#ddd6cb;font-family:Inter,sans-serif;padding:34px;width:2470px}
h1{font-size:26px;margin-bottom:4px;color:#1a2540}.sub{color:#555;font-size:15px;margin-bottom:24px}
.g{display:grid;grid-template-columns:repeat(5,420px);gap:40px 50px}
figure{margin:0}figcaption{font:700 16px Inter;margin-top:12px;color:#1a2540}figcaption small{display:block;font:500 13.5px/1.45 Inter;color:#555;margin-top:3px}
.c{width:420px;height:592px;position:relative;overflow:hidden;background:#f4e6d1;box-shadow:0 26px 40px -22px rgba(0,0,0,.5);display:flex;flex-direction:column;align-items:center}
.qr{background:#fff;display:block}.qr svg{display:block;width:100%;height:100%}
.ct{font:700 11px Inter;letter-spacing:.3em;text-transform:uppercase;display:flex;align-items:center;gap:12px;color:#8a1b1b}
.ab{position:absolute;inset:0;pointer-events:none}
</style></head><body>
<h1>Carte « Plat en test » · crème · gentleman</h1><p class="sub">A6. Cadre or (A à C) avec 3 hauts différents, puis le cadre de l'affiche Free Oyster (D en rouge, E en or).</p>
<div class="g" id="g"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script><script src="../studio/qr-drevici.js"></script>
<script>
const QR=()=>qrDrevici('https://drevici.beltab.app/qr/plat-test/serveur-elodie-1',400,{});
const anchor=c=>`<svg viewBox="0 0 340 362" width="22" height="24"><g transform="translate(0,362) scale(.1,-.1)" fill="${c}"><path d="M1585 3280 c-59 -23 -143 -94 -167 -141 -50 -100 -53 -114 -52 -204 0 -81 3 -96 33 -155 43 -85 72 -115 154 -156 l67 -34 0 -106 0 -106 -189 4 c-163 3 -192 5 -208 21 -23 20 -72 23 -95 5 -53 -44 -66 -139 -25 -199 33 -49 62 -56 119 -30 42 19 65 21 222 21 l176 0 0 -654 0 -655 -22 -15 c-29 -20 -107 -21 -202 -1 -180 37 -350 164 -451 335 -47 81 -98 204 -88 214 4 3 22 6 40 6 35 0 73 15 73 28 0 4 -18 30 -41 57 -70 86 -87 108 -145 185 -64 86 -94 120 -105 120 -22 0 -119 -450 -105 -485 9 -24 31 -18 77 20 28 24 45 33 52 26 6 -6 18 -41 28 -78 52 -201 128 -340 259 -473 114 -116 190 -163 380 -236 168 -64 207 -84 246 -126 32 -34 84 -122 84 -142 0 -6 4 -17 9 -25 8 -12 12 -12 25 -2 9 8 16 22 16 33 0 30 38 96 78 135 36 34 123 83 150 83 21 0 224 82 262 105 19 12 55 34 80 48 64 36 191 160 245 240 54 81 105 188 130 272 10 33 25 84 34 112 l16 53 35 -24 c48 -33 76 -40 84 -21 11 31 -38 346 -66 423 -31 83 -43 76 -183 -113 -33 -44 -79 -104 -103 -134 -40 -50 -42 -54 -25 -67 10 -7 39 -14 66 -14 26 0 47 -2 47 -5 0 -23 -51 -145 -88 -209 -88 -153 -253 -286 -410 -330 -88 -24 -241 -34 -253 -15 -10 15 -11 993 -2 1207 l5 122 169 0 c130 0 178 -4 208 -16 54 -21 99 -15 123 17 43 58 40 140 -8 190 -33 35 -70 37 -133 9 -37 -17 -65 -20 -207 -20 l-164 0 1 101 1 100 37 22 c20 12 49 29 64 37 37 18 92 87 117 146 30 69 37 176 16 249 -34 119 -134 224 -241 252 -73 19 -190 16 -250 -7z m238 -188 c102 -69 104 -238 4 -312 -33 -25 -51 -30 -94 -30 -30 0 -66 6 -81 14 -62 32 -112 113 -112 178 1 72 66 160 128 174 15 3 32 7 37 9 25 6 83 -10 118 -33z"/></g></svg>`;

const N='#1a2540',R='#8a1b1b',GO='#b8913f';
const rule=(c,w,h=1.5)=>`<span style="display:inline-block;width:${w}px;height:${h}px;background:${c}"></span>`;
// trait effilé comme sur l'affiche (pointe vers l'extérieur ou vers le centre)
const spindle=(c,w,flip)=>`<svg width="${w}" height="8" viewBox="0 0 ${w} 8" style="${flip?'transform:scaleX(-1)':''}"><path d="M0 4 L${w-26} 3.2 Q${w-8} 1 ${w} 4 Q${w-8} 7 ${w-26} 4.8Z" fill="${c}"/></svg>`;
// cadre de l'affiche : coins rentrants (encoche arrondie)
function notched(c,x,y,w,h,r,sw){const P=`M${x+r} ${y} H${x+w-r} A${r} ${r} 0 0 0 ${x+w} ${y+r} V${y+h-r} A${r} ${r} 0 0 0 ${x+w-r} ${y+h} H${x+r} A${r} ${r} 0 0 0 ${x} ${y+h-r} V${y+r} A${r} ${r} 0 0 0 ${x+r} ${y}Z`;
 return `<svg class="ab" viewBox="0 0 420 592"><path d="${P}" fill="none" stroke="${c}" stroke-width="${sw}"/></svg>`;}
const goldFrame=`<div class="ab" style="inset:12px;border:2.5px solid ${GO}"></div><div class="ab" style="inset:19px;border:1px solid ${GO}"></div>`;
const posterFrame=c=>`<div class="ab" style="inset:9px;border:6px solid ${N};border-radius:16px"></div>${notched(c,24,24,372,544,18,3.5)}`;
const posterGold=`<div class="ab" style="inset:9px;border:6px solid ${N};border-radius:16px"></div>${notched(GO,24,24,372,544,18,2.5)}${notched(GO,30,30,360,532,14,1)}`;
const HEAD={
 traits:`<div class="ct" style="margin-top:48px">${rule(R,46)}En cuisine${rule(R,46)}</div>`,
 ancre:`<div class="ct" style="margin-top:46px;gap:10px">${rule(N,70)}${anchor(R)}${rule(N,70)}</div>`,
 ancreTexte:`<div style="margin-top:38px">${anchor(R)}</div><div class="ct" style="margin-top:6px">${rule(R,40)}En cuisine${rule(R,40)}</div>`,
 affiche:`<div style="margin-top:44px;display:flex;align-items:center;gap:8px">${spindle(N,110,1)}${anchor(R)}${spindle(N,110)}</div>`};
const TTL=(shadow)=>`<div style="font:50px/1 Anton;color:${N};margin-top:8px;letter-spacing:.01em;${shadow?`text-shadow:2.5px 2.5px 0 ${R}`:''}">LE PLAT EN TEST</div>`;
const UNDER=`<div style="display:flex;align-items:center;gap:6px;margin-top:8px">${spindle(R,90,1)}<svg width="16" height="8"><path d="M0 4 L8 0 L16 4 L8 8Z" fill="${N}"/></svg>${spindle(R,90)}</div>`;
const SUB=(m=6)=>`<div style="font:italic 700 18px 'Playfair Display',serif;color:${R};margin-top:${m}px">Le chef cuisine, vous goûtez</div>`;
const BODY=(ring=R)=>`<img src="mascotte-gentleman.png" style="height:${ring===R?224:218}px;margin-top:6px;position:relative;z-index:1">
 <div style="position:relative;margin-top:-8px;padding:9px;background:#fff;border:3px solid ${N};border-radius:12px;box-shadow:0 0 0 3px #f4e6d1,0 0 0 5px ${ring}"><div class="qr" style="width:124px;height:124px">${QR()}</div></div>
 <div style="margin-top:-3px;position:relative;background:${R};color:#fff;font:15px/1 Anton;letter-spacing:.14em;padding:7px 20px;clip-path:polygon(0 0,100% 0,94% 50%,100% 100%,0 100%,6% 50%)">SCANNEZ</div>`;
const C=[
 ['A · Cadre or · « En cuisine » et deux traits','Plus d\'ancres : juste le texte entre deux traits rouges.',goldFrame+HEAD.traits+TTL()+SUB()+BODY()],
 ['B · Cadre or · l\'ancre seule au milieu','Pas de texte en haut : l\'ancre entre deux traits, comme l\'affiche.',goldFrame+HEAD.ancre+TTL()+SUB()+BODY()],
 ['C · Cadre or · une ancre, puis « En cuisine »','Une seule ancre au-dessus du texte.',goldFrame+HEAD.ancreTexte+TTL()+SUB()+BODY()],
 ['D · Le cadre de l\'affiche, en rouge','Coins rentrants, traits effilés, titre avec l\'ombre rouge comme FREE OYSTER.',posterFrame(R)+HEAD.affiche+TTL(1)+UNDER+SUB(6)+BODY()],
 ['E · Le cadre de l\'affiche, en or','Le même, avec le double filet or à la place du rouge.',posterGold+HEAD.affiche+TTL(1)+UNDER+SUB(6)+BODY(GO)]];
document.getElementById('g').innerHTML=C.map(([t,d,h])=>`<figure><div class="c">${h}</div><figcaption>${t}<small>${d}</small></figcaption></figure>`).join('');
</script></body></html>
