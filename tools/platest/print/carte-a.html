<!doctype html><html lang="fr"><head><meta charset="utf-8">

<style>

@page{size:61mm 91mm;margin:0}
*{box-sizing:border-box;margin:0}html,body{width:610px;height:910px;overflow:hidden;background:#f4e6d1}
body{zoom:var(--z,1)}
.c{position:relative;width:610px;height:910px;background:#f4e6d1;display:flex;flex-direction:column;align-items:center}

.ct{font:700 13.5px Inter;letter-spacing:.32em;text-transform:uppercase;display:flex;align-items:center;gap:14px;color:#8a1b1b;padding-left:.32em}
.guide .trim{position:absolute;inset:30px;outline:1px dashed #0a0}
