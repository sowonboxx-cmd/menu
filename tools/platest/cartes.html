<!doctype html><html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600;1,700&family=Inter:wght@500;600;700;800&display=swap">
<style>
:root{--navy:#14213d;--n2:#1a2540;--red:#8a1b1b;--cream:#f4e6d1;--gold:#c9a24f;--gold2:#e7cf8f}
*{box-sizing:border-box;margin:0}body{background:#ddd6cb;font-family:Inter,sans-serif;padding:34px;width:1560px}
h1{font-size:26px;margin-bottom:4px;color:#1a2540}.sub{color:#555;font-size:15px;margin-bottom:24px}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:40px 34px}
figure{margin:0}figcaption{font:700 16px Inter;margin-top:12px;color:#1a2540}figcaption small{display:block;font:500 13.5px/1.45 Inter;color:#555;margin-top:3px}
.c{width:420px;height:592px;position:relative;overflow:hidden;box-shadow:0 26px 40px -22px rgba(0,0,0,.5);display:flex;flex-direction:column;align-items:center}
.qr{background:#fff;display:block}.qr svg{display:block;width:100%;height:100%}
.ct{font:700 10.5px Inter;letter-spacing:.28em;text-transform:uppercase}
.pf{font-family:'Playfair Display',serif}
</style></head><body>
<h1>Carte « Plat en test » · 6 propositions</h1><p class="sub">Format carte de table (A6, 10,5 × 14,8 cm). Le Gentleman en chef qui porte la cloche (brouillon), le QR mis en valeur, sans adresse.</p>
<div class="g" id="g"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script><script src="../studio/qr-drevici.js"></script>
<script>
const QR=(s,c)=>qrDrevici('https://drevici.beltab.app/qr/plat-test/serveur-elodie-1',400,c?{color:c}:{});
const CHEF='gentleman-chef.png';
const anchor=c=>`<svg viewBox="0 0 340 362" width="22" height="24"><g transform="translate(0,362) scale(.1,-.1)" fill="${c}"><path d="M1585 3280 c-59 -23 -143 -94 -167 -141 -50 -100 -53 -114 -52 -204 0 -81 3 -96 33 -155 43 -85 72 -115 154 -156 l67 -34 0 -106 0 -106 -189 4 c-163 3 -192 5 -208 21 -23 20 -72 23 -95 5 -53 -44 -66 -139 -25 -199 33 -49 62 -56 119 -30 42 19 65 21 222 21 l176 0 0 -654 0 -655 -22 -15 c-29 -20 -107 -21 -202 -1 -180 37 -350 164 -451 335 -47 81 -98 204 -88 214 4 3 22 6 40 6 35 0 73 15 73 28 0 4 -18 30 -41 57 -70 86 -87 108 -145 185 -64 86 -94 120 -105 120 -22 0 -119 -450 -105 -485 9 -24 31 -18 77 20 28 24 45 33 52 26 6 -6 18 -41 28 -78 52 -201 128 -340 259 -473 114 -116 190 -163 380 -236 168 -64 207 -84 246 -126 32 -34 84 -122 84 -142 0 -6 4 -17 9 -25 8 -12 12 -12 25 -2 9 8 16 22 16 33 0 30 38 96 78 135 36 34 123 83 150 83 21 0 224 82 262 105 19 12 55 34 80 48 64 36 191 160 245 240 54 81 105 188 130 272 10 33 25 84 34 112 l16 53 35 -24 c48 -33 76 -40 84 -21 11 31 -38 346 -66 423 -31 83 -43 76 -183 -113 -33 -44 -79 -104 -103 -134 -40 -50 -42 -54 -25 -67 10 -7 39 -14 66 -14 26 0 47 -2 47 -5 0 -23 -51 -145 -88 -209 -88 -153 -253 -286 -410 -330 -88 -24 -241 -34 -253 -15 -10 15 -11 993 -2 1207 l5 122 169 0 c130 0 178 -4 208 -16 54 -21 99 -15 123 17 43 58 40 140 -8 190 -33 35 -70 37 -133 9 -37 -17 -65 -20 -207 -20 l-164 0 1 101 1 100 37 22 c20 12 49 29 64 37 37 18 92 87 117 146 30 69 37 176 16 249 -34 119 -134 224 -241 252 -73 19 -190 16 -250 -7z m238 -188 c102 -69 104 -238 4 -312 -33 -25 -51 -30 -94 -30 -30 0 -66 6 -81 14 -62 32 -112 113 -112 178 1 72 66 160 128 174 15 3 32 7 37 9 25 6 83 -10 118 -33z"/></g></svg>`;
const rule=(c,w=60)=>`<span style="display:inline-block;width:${w}px;height:1px;background:${c};vertical-align:middle"></span>`;
// cadre à coins (équerres) autour du QR
const brackets=(c,s=8)=>['top:0;left:0;border-width:2px 0 0 2px','top:0;right:0;border-width:2px 2px 0 0','bottom:0;left:0;border-width:0 0 2px 2px','bottom:0;right:0;border-width:0 2px 2px 0'].map(p=>`<i style="position:absolute;width:${s*2}px;height:${s*2}px;border:0 solid ${c};${p}"></i>`).join('');
const cloche=(c,f)=>`<svg viewBox="0 0 200 120" width="100%"><path d="M18 100 Q20 30 100 24 Q180 30 182 100Z" fill="${f}" stroke="${c}" stroke-width="3"/><rect x="92" y="10" width="16" height="14" rx="5" fill="${f}" stroke="${c}" stroke-width="3"/><rect x="6" y="100" width="188" height="9" rx="4.5" fill="${c}"/><path d="M40 88 Q44 50 90 38" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".7"/></svg>`;
const C=[
['1 · Navy & or','Fond bleu nuit, double filet doré, le QR dans un médaillon doré au centre. Le plus « palace ».',
`<div class="c" style="background:var(--navy);color:var(--gold2)"><div style="position:absolute;inset:12px;border:1.5px solid var(--gold)"></div><div style="position:absolute;inset:18px;border:.75px solid var(--gold)"></div>
<div style="margin-top:44px">${anchor('#c9a24f')}</div><div class="ct" style="margin-top:8px;color:var(--gold)">${rule('#c9a24f',30)}&nbsp; En cuisine &nbsp;${rule('#c9a24f',30)}</div>
<div class="pf" style="font-size:40px;font-weight:700;color:#fff;margin-top:10px;line-height:1">Le plat en test</div><div class="pf" style="font-style:italic;font-size:17px;color:var(--gold2);margin-top:6px">une création du chef, à partager</div>
<div style="display:flex;align-items:flex-end;gap:4px;margin-top:auto"><img src="${CHEF}" style="height:230px;filter:drop-shadow(0 0 1px #f4e6d1)"><div style="padding:7px;background:linear-gradient(135deg,#e7cf8f,#a9802f);border-radius:14px;margin-bottom:20px"><div class="qr" style="width:170px;height:170px;border-radius:8px;padding:7px">${QR()}</div></div></div>
<div class="ct" style="margin:16px 0 46px;color:var(--gold2);letter-spacing:.3em">Scannez · Découvrez</div></div>`],
['2 · Le menu du palace','Crème, cadre bleu et filet rouge comme l\'affiche. Le QR dans un cartouche, avec le ruban « Scannez ».',
`<div class="c" style="background:var(--cream)"><div style="position:absolute;inset:10px;border:5px solid var(--n2);border-radius:14px"></div><div style="position:absolute;inset:22px;border:2px solid var(--red);border-radius:4px"></div>
<div style="margin-top:42px;display:flex;align-items:center;gap:8px">${rule('#1a2540',70)}${anchor('#9F2E1F')}${rule('#1a2540',70)}</div>
<div style="font:46px/1 Anton;color:var(--n2);margin-top:6px">LE PLAT EN TEST</div><div class="pf" style="font-style:italic;font-weight:700;font-size:17px;color:var(--red);margin-top:4px">Le chef cuisine, vous goûtez</div>
<img src="${CHEF}" style="height:180px;margin-top:10px">
<div style="position:relative;margin-top:6px;padding:10px 12px 12px;background:#fff;border:3px solid var(--n2);border-radius:12px;box-shadow:0 0 0 3px #fff,0 0 0 5px var(--red)"><div class="qr" style="width:118px;height:118px">${QR()}</div></div>
<div style="margin-top:-2px;background:var(--red);color:#fff;font:15px/1 Anton;letter-spacing:.12em;padding:7px 18px;clip-path:polygon(0 0,100% 0,94% 50%,100% 100%,0 100%,6% 50%)">SCANNEZ</div></div>`],
['3 · Soulevez la cloche','Sans personnage : une grande cloche dorée qui se soulève et laisse voir le QR. L\'effet surprise.',
`<div class="c" style="background:var(--cream)"><div style="position:absolute;inset:14px;border:1px solid var(--n2)"></div>
<div class="ct" style="margin-top:46px;color:var(--red)">Chut… le chef teste</div>
<div class="pf" style="font-size:42px;font-weight:800;color:var(--n2);margin-top:8px;line-height:1">Le plat mystère</div>
<div style="position:relative;width:300px;margin-top:50px"><div style="transform:rotate(-14deg) translate(-30px,-8px);width:280px">${cloche('#1a2540','#e7cf8f')}</div>
<div style="width:300px;height:15px;background:var(--n2);border-radius:8px;margin-top:-4px"></div>
<div class="qr" style="position:absolute;left:66px;top:112px;width:168px;height:168px;padding:6px;border-radius:6px;box-shadow:0 10px 18px -10px rgba(0,0,0,.45)">${QR()}</div></div>
<div style="margin-top:auto;margin-bottom:52px" class="pf"><span style="font-style:italic;font-size:18px;font-weight:700;color:var(--n2)">Soulevez la cloche</span> <span style="font-size:18px;color:var(--red)">→ scannez</span></div></div>`],
['4 · Ticket de dégustation','Haut bleu, bas crème, séparés par une ligne perforée. Le QR dans des équerres dorées, et le serveur nommé (pour sa commission).',
`<div class="c" style="background:var(--cream)"><div style="width:100%;height:300px;background:var(--n2);display:flex;flex-direction:column;align-items:center;color:#fff">
<div class="ct" style="margin-top:30px;color:var(--gold2)">Ticket de dégustation · n° 07</div><div style="font:44px/1 Anton;margin-top:8px">LE PLAT EN TEST</div>
<img src="${CHEF}" style="height:190px;margin-top:10px;filter:brightness(1.05)"></div>
<div style="width:100%;border-top:3px dashed #c9b99d;position:relative"><i style="position:absolute;left:-14px;top:-15px;width:28px;height:28px;border-radius:50%;background:#ddd6cb"></i><i style="position:absolute;right:-14px;top:-15px;width:28px;height:28px;border-radius:50%;background:#ddd6cb"></i></div>
<div style="display:flex;gap:18px;align-items:center;margin:auto 0"><div style="position:relative;padding:11px">${brackets('#c9a24f',10)}<div class="qr" style="width:170px;height:170px">${QR()}</div></div>
<div><div class="pf" style="font-size:22px;font-weight:800;color:var(--n2);line-height:1.1">À partager,<br>à prix test.</div><div style="font:600 13px Inter;color:var(--red);margin-top:8px">Scannez pour le découvrir</div><div style="font:500 11.5px Inter;color:#6d675d;margin-top:10px">Votre serveur · Élodie</div></div></div></div>`],
['5 · Minimal luxe','Crème et beaucoup d\'air. Un grand titre fin, le chef en petit, le QR dans un fin cadre doré. Le plus élégant.',
`<div class="c" style="background:#f7efe2"><div style="position:absolute;inset:16px;border:.75px solid var(--gold)"></div>
<div class="ct" style="margin-top:54px;color:#9a7a33">Drevici · Cuisine</div>
<div class="pf" style="font-size:50px;font-weight:600;color:var(--n2);line-height:1;margin-top:16px;text-align:center">Le plat<br><i>en test</i></div>
<div style="margin-top:16px">${rule('#c9a24f',40)}&nbsp;${anchor('#c9a24f')}&nbsp;${rule('#c9a24f',40)}</div>
<div style="display:flex;align-items:flex-end;gap:14px;margin-top:auto"><img src="${CHEF}" style="height:200px"><div style="border:1px solid var(--gold);padding:10px;margin-bottom:12px"><div class="qr" style="width:150px;height:150px">${QR()}</div></div></div>
<div class="pf" style="font-style:italic;font-size:16px;color:#6d675d;margin:16px 0 50px">scannez, le chef vous dit tout</div></div>`],
['6 · Médaillon','Le QR au centre, dans un grand médaillon rond à picots comme le logo Drevici. Le chef pointe le médaillon.',
`<div class="c" style="background:var(--cream)"><div style="position:absolute;inset:12px;border:4px solid var(--n2);border-radius:18px"></div>
<div style="font:42px/1 Anton;color:var(--n2);margin-top:42px">LE PLAT EN TEST</div><div class="pf" style="font-style:italic;font-weight:700;font-size:16px;color:var(--red);margin-top:4px">signé le chef Gentleman</div>
<div style="position:relative;width:250px;height:250px;margin-top:26px;margin-left:110px"><svg viewBox="0 0 250 250" width="250" height="250" style="position:absolute;inset:0">${[...Array(48)].map((_,i)=>{const a=i/48*Math.PI*2,b=(i+.5)/48*Math.PI*2;return `<path d="M${125+117*Math.cos(a)} ${125+117*Math.sin(a)}L${125+125*Math.cos(b-.065)} ${125+125*Math.sin(b-.065)}L${125+117*Math.cos(b+.065)} ${125+117*Math.sin(b+.065)}Z" fill="#1a2540"/>`}).join('')}<circle cx="125" cy="125" r="118" fill="#1a2540"/><circle cx="125" cy="125" r="104" fill="none" stroke="#fff" stroke-width="3"/><circle cx="125" cy="125" r="96" fill="none" stroke="#8a1b1b" stroke-width="3"/></svg>
<div class="qr" style="position:absolute;left:64px;top:64px;width:122px;height:122px;border-radius:8px;padding:5px">${QR()}</div></div>
<img src="${CHEF}" style="position:absolute;left:22px;bottom:30px;height:200px">
<div class="ct" style="position:absolute;bottom:40px;right:38px;color:var(--n2);letter-spacing:.2em">Scannez →</div></div>`]];
document.getElementById('g').innerHTML=C.map(([t,d,h])=>`<figure>${h}<figcaption>${t}<small>${d}</small></figcaption></figure>`).join('');
</script></body></html>
