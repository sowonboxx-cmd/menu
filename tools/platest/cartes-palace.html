<!doctype html><html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600;1,700&family=Inter:wght@500;600;700;800&display=swap">
<style>
*{box-sizing:border-box;margin:0}body{background:#ddd6cb;font-family:Inter,sans-serif;padding:34px;width:2010px}
h1{font-size:26px;margin-bottom:4px;color:#1a2540}.sub{color:#555;font-size:15px;margin-bottom:24px}
.g{display:grid;grid-template-columns:repeat(4,420px);gap:40px 50px}
figure{margin:0}figcaption{font:700 16px Inter;margin-top:12px;color:#1a2540}figcaption small{display:block;font:500 13.5px/1.45 Inter;color:#555;margin-top:3px}
.c{width:420px;height:592px;position:relative;overflow:hidden;box-shadow:0 26px 40px -22px rgba(0,0,0,.5);display:flex;flex-direction:column;align-items:center}
.qr{background:#fff;display:block}.qr svg{display:block;width:100%;height:100%}
.ct{font:700 11px Inter;letter-spacing:.3em;text-transform:uppercase;display:flex;align-items:center;gap:12px}
.pf{font-family:'Playfair Display',serif}
</style></head><body>
<h1>Carte « Plat en test » · le Menu du palace, 4 couleurs × 2 mascottes</h1><p class="sub">Format A6 (10,5 × 14,8 cm). « En cuisine », « Le chef cuisine, vous goûtez », la mascotte au centre au-dessus du QR, le ruban « Scannez ». Ligne du haut : le chef à la toque · ligne du bas : le gentleman au haut-de-forme.</p>
<div class="g" id="g"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script><script src="../studio/qr-drevici.js"></script>
<script>
const QR=()=>qrDrevici('https://drevici.beltab.app/qr/plat-test/serveur-elodie-1',400,{});
const anchor=c=>`<svg viewBox="0 0 340 362" width="22" height="24"><g transform="translate(0,362) scale(.1,-.1)" fill="${c}"><path d="M1585 3280 c-59 -23 -143 -94 -167 -141 -50 -100 -53 -114 -52 -204 0 -81 3 -96 33 -155 43 -85 72 -115 154 -156 l67 -34 0 -106 0 -106 -189 4 c-163 3 -192 5 -208 21 -23 20 -72 23 -95 5 -53 -44 -66 -139 -25 -199 33 -49 62 -56 119 -30 42 19 65 21 222 21 l176 0 0 -654 0 -655 -22 -15 c-29 -20 -107 -21 -202 -1 -180 37 -350 164 -451 335 -47 81 -98 204 -88 214 4 3 22 6 40 6 35 0 73 15 73 28 0 4 -18 30 -41 57 -70 86 -87 108 -145 185 -64 86 -94 120 -105 120 -22 0 -119 -450 -105 -485 9 -24 31 -18 77 20 28 24 45 33 52 26 6 -6 18 -41 28 -78 52 -201 128 -340 259 -473 114 -116 190 -163 380 -236 168 -64 207 -84 246 -126 32 -34 84 -122 84 -142 0 -6 4 -17 9 -25 8 -12 12 -12 25 -2 9 8 16 22 16 33 0 30 38 96 78 135 36 34 123 83 150 83 21 0 224 82 262 105 19 12 55 34 80 48 64 36 191 160 245 240 54 81 105 188 130 272 10 33 25 84 34 112 l16 53 35 -24 c48 -33 76 -40 84 -21 11 31 -38 346 -66 423 -31 83 -43 76 -183 -113 -33 -44 -79 -104 -103 -134 -40 -50 -42 -54 -25 -67 10 -7 39 -14 66 -14 26 0 47 -2 47 -5 0 -23 -51 -145 -88 -209 -88 -153 -253 -286 -410 -330 -88 -24 -241 -34 -253 -15 -10 15 -11 993 -2 1207 l5 122 169 0 c130 0 178 -4 208 -16 54 -21 99 -15 123 17 43 58 40 140 -8 190 -33 35 -70 37 -133 9 -37 -17 -65 -20 -207 -20 l-164 0 1 101 1 100 37 22 c20 12 49 29 64 37 37 18 92 87 117 146 30 69 37 176 16 249 -34 119 -134 224 -241 252 -73 19 -190 16 -250 -7z m238 -188 c102 -69 104 -238 4 -312 -33 -25 -51 -30 -94 -30 -30 0 -66 6 -81 14 -62 32 -112 113 -112 178 1 72 66 160 128 174 15 3 32 7 37 9 25 6 83 -10 118 -33z"/></g></svg>`;

const rule=(c,w)=>`<span style="display:inline-block;width:${w}px;height:1.5px;background:${c}"></span>`;
const T={
 creme:{n:'Crème',d:'Le palace d\'origine : crème, cadre bleu, filet rouge.',bg:'#f4e6d1',fr:'#1a2540',fil:'#8a1b1b',ttl:'#1a2540',sub:'#8a1b1b',ct:'#8a1b1b',qb:'#1a2540',ring:'#8a1b1b',rb:'#8a1b1b',rt:'#fff',dark:0},
 fonce:{n:'Foncée',d:'Le même palace en négatif : fond bleu nuit, cadre crème, filet rouge.',bg:'#141d33',fr:'#f4e6d1',fil:'#c2412f',ttl:'#f4e6d1',sub:'#e8836f',ct:'#e8836f',qb:'#f4e6d1',ring:'#c2412f',rb:'#c2412f',rt:'#fff',dark:1},
 bleu:{n:'Bleue',d:'Le bleu Drevici, cadre blanc, filet rouge : celle qui se voit le plus sur la table.',bg:'#253968',fr:'#fff',fil:'#d4473a',ttl:'#fff',sub:'#f4e6d1',ct:'#f4e6d1',qb:'#fff',ring:'#d4473a',rb:'#d4473a',rt:'#fff',dark:1},
 or:{n:'Navy & or',d:'Le palace habillé du n° 1 : bleu nuit, double filet doré, ruban or.',bg:'#14213d',fr:'#c9a24f',fil:'#c9a24f',ttl:'#f3e3b8',sub:'#c9a24f',ct:'#c9a24f',qb:'#c9a24f',ring:'#e7cf8f',rb:'linear-gradient(90deg,#a9802f,#e7cf8f,#a9802f)',rt:'#14213d',dark:1,gold:1}};
function card(k,m){const t=T[k];const img=`mascotte-${m}${t.dark?'-contour':''}.png`;
 const frame=t.gold?`<div style="position:absolute;inset:12px;border:1.5px solid ${t.fr}"></div><div style="position:absolute;inset:18px;border:.75px solid ${t.fil}"></div>`
  :`<div style="position:absolute;inset:10px;border:5px solid ${t.fr};border-radius:14px"></div><div style="position:absolute;inset:22px;border:2px solid ${t.fil};border-radius:4px"></div>`;
 return `<div class="c" style="background:${t.bg}">${frame}
 <div class="ct" style="margin-top:44px;color:${t.ct}">${rule(t.ct,34)}${anchor(t.ct)}En cuisine${anchor(t.ct)}${rule(t.ct,34)}</div>
 <div style="font:48px/1 Anton;color:${t.ttl};margin-top:10px;letter-spacing:.01em">LE PLAT EN TEST</div>
 <div class="pf" style="font-style:italic;font-weight:700;font-size:18px;color:${t.sub};margin-top:6px">Le chef cuisine, vous goûtez</div>
 <img src="${img}" style="height:${t.dark?236:230}px;margin-top:${t.dark?6:10}px;position:relative;z-index:1">
 <div style="position:relative;margin-top:-8px;padding:9px;background:#fff;border:3px solid ${t.qb};border-radius:12px;box-shadow:0 0 0 3px ${t.bg},0 0 0 5px ${t.ring}"><div class="qr" style="width:124px;height:124px">${QR()}</div></div>
 <div style="margin-top:-3px;position:relative;background:${t.rb};color:${t.rt};font:15px/1 Anton;letter-spacing:.14em;padding:7px 20px;clip-path:polygon(0 0,100% 0,94% 50%,100% 100%,0 100%,6% 50%)">SCANNEZ</div></div>`;}
const L=[];['toque','gentleman'].forEach((m,j)=>Object.keys(T).forEach((k,i)=>L.push(`<figure>${card(k,m)}<figcaption>${String.fromCharCode(65+i)}${j+1} · ${T[k].n} · ${m==='toque'?'chef à la toque':'gentleman'}<small>${T[k].d}</small></figcaption></figure>`)));
document.getElementById('g').innerHTML=L.join('');
</script></body></html>
