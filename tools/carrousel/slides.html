<!doctype html><html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;0,900;1,600;1,700;1,800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Une diapositive Instagram 3:4 = 1080 × 1440 */
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1440px;overflow:hidden;background:#f4e6d1}
.s{position:relative;width:1080px;height:1440px;overflow:hidden;font-family:Inter,sans-serif}
.img{background-size:cover;background-position:center}
.ab{position:absolute}.fit{white-space:nowrap}
</style></head><body><div id="s" class="s"></div>
<script>
const Q=new URLSearchParams(location.search), D=Q.get('d')||'A', N=+(Q.get('s')||1);
const NAVY='#253968',INK='#0d255c',GOLD='#d09d39',RED='#9f2e1f',CREAM='#f4e6d1';
// Texte du carrousel : une idée par image, court
const S=[
 {k:'Ostréiculteurs à Surzur',t:'DREVICI OYSTER',x:'Une famille, une rivière, des huîtres.',img:'main-huitre',pos:'62% 55%'},
 {k:'Notre rivière',t:'La rivière de Penerf',x:'Une ria bretonne, entre la terre et la pleine mer. Le berceau de nos huîtres.',img:'penerf-pieux',pos:'50% 40%'},
 {k:'Notre méthode',t:'Brassées par les marées',x:'Peu d\'huîtres par panier, suspendues dans le courant. Une coquille plus belle, une chair plus charnue.',img:'seapa',pos:'38% 50%'},
 {k:'Notre maison',t:'Une affaire de famille',x:'Captage naturel, gestes d\'ici, pratiques durables.',img:'equipe-bateau',pos:'50% 45%'},
 {k:'À marée basse',t:'Au parc, à la main',x:'Chaque panier est retourné, trié, surveillé. Au rythme de la marée.',img:'tracteur',pos:'42% 50%'},
 {k:'Le métier',t:'Patience et marées',x:'Il faut des années pour faire une belle huître. On ne presse rien.',img:'parc',pos:'50% 62%'},
 {k:'À Surzur',t:'Face à la rivière',x:'À la belle saison, nos huîtres au coucher du soleil, au bord de l\'eau.',img:'degustation',pos:'50% 55%'},
 {k:'De Penerf à Paris',t:'Du parc à l\'assiette',x:'Sorties de l\'eau, mises en bourriche, servies chez nous à Paris.',img:'panier-bourriches',pos:'40% 50%'},
 {k:'Nos écaillers',t:'Ouvertes à la minute',x:'Ouvertes devant vous, à la main, au moment de les servir.',img:'equipe-bar',pos:'50% 40%'},
 {k:'Paris 17e',t:'8 rue Biot',x:'Nos huîtres de Penerf, à Paris. Réservez votre table, lien en bio.',img:'biot-aquarelle',pos:'50% 55%'},
 {k:'À table',t:'Fines de Penerf',x:'Une mignonnette, un citron, et rien d\'autre.',img:'biot-fenetre',pos:'40% 70%'},
 {k:'On vous attend',t:'Rue Biot',x:'Ouvert midi et soir. Réservation en ligne, lien en bio.',img:'biot-photo',pos:'50% 60%'}];
const s=S[N-1], TOT=S.length, num=`${String(N).padStart(2,'0')} / ${TOT}`, cover=N===1;
const anchor=c=>`<svg viewBox="0 0 340 362" width="30" height="32"><g transform="translate(0,362) scale(.1,-.1)" fill="${c}"><path d="M1585 3280 c-59 -23 -143 -94 -167 -141 -50 -100 -53 -114 -52 -204 0 -81 3 -96 33 -155 43 -85 72 -115 154 -156 l67 -34 0 -106 0 -106 -189 4 c-163 3 -192 5 -208 21 -23 20 -72 23 -95 5 -53 -44 -66 -139 -25 -199 33 -49 62 -56 119 -30 42 19 65 21 222 21 l176 0 0 -654 0 -655 -22 -15 c-29 -20 -107 -21 -202 -1 -180 37 -350 164 -451 335 -47 81 -98 204 -88 214 4 3 22 6 40 6 35 0 73 15 73 28 0 4 -18 30 -41 57 -70 86 -87 108 -145 185 -64 86 -94 120 -105 120 -22 0 -119 -450 -105 -485 9 -24 31 -18 77 20 28 24 45 33 52 26 6 -6 18 -41 28 -78 52 -201 128 -340 259 -473 114 -116 190 -163 380 -236 168 -64 207 -84 246 -126 32 -34 84 -122 84 -142 0 -6 4 -17 9 -25 8 -12 12 -12 25 -2 9 8 16 22 16 33 0 30 38 96 78 135 36 34 123 83 150 83 21 0 224 82 262 105 19 12 55 34 80 48 64 36 191 160 245 240 54 81 105 188 130 272 10 33 25 84 34 112 l16 53 35 -24 c48 -33 76 -40 84 -21 11 31 -38 346 -66 423 -31 83 -43 76 -183 -113 -33 -44 -79 -104 -103 -134 -40 -50 -42 -54 -25 -67 10 -7 39 -14 66 -14 26 0 47 -2 47 -5 0 -23 -51 -145 -88 -209 -88 -153 -253 -286 -410 -330 -88 -24 -241 -34 -253 -15 -10 15 -11 993 -2 1207 l5 122 169 0 c130 0 178 -4 208 -16 54 -21 99 -15 123 17 43 58 40 140 -8 190 -33 35 -70 37 -133 9 -37 -17 -65 -20 -207 -20 l-164 0 1 101 1 100 37 22 c20 12 49 29 64 37 37 18 92 87 117 146 30 69 37 176 16 249 -34 119 -134 224 -241 252 -73 19 -190 16 -250 -7z m238 -188 c102 -69 104 -238 4 -312 -33 -25 -51 -30 -94 -30 -30 0 -66 6 -81 14 -62 32 -112 113 -112 178 1 72 66 160 128 174 15 3 32 7 37 9 25 6 83 -10 118 -33z"/></g></svg>`;

const rule=(c,w,h=3)=>`<span style="display:inline-block;width:${w}px;height:${h}px;background:${c};flex:none"></span>`;
const bg=(im,pos)=>`background-image:url(img/${im}.jpg);background-position:${pos}`;
const el=document.getElementById('s');
// ── A : le palace (crème / bleu / or) ──
function palace(th){
  el.style.background=th.bg;
  const frame=th.gold?`<div class="ab" style="inset:34px;border:7px solid ${th.fr}"></div><div class="ab" style="inset:50px;border:2.5px solid ${th.fr}"></div>`
    :`<div class="ab" style="inset:34px;border:12px solid ${th.fr};border-radius:36px"></div><div class="ab" style="inset:66px;border:4px solid ${th.fil};border-radius:10px"></div>`;
  const ih=cover?780:730;
  el.innerHTML=frame+`<div class="ab img" style="left:100px;right:100px;top:100px;height:${ih}px;border-radius:${th.gold?6:24}px;${bg(s.img,s.pos)}"></div>
  <div class="ab" style="left:100px;right:100px;top:${100+ih+40}px;text-align:center">
    <div style="display:flex;align-items:center;justify-content:center;gap:18px;font:700 25px Inter;letter-spacing:.28em;text-transform:uppercase;color:${th.kick}">${rule(th.kick,54)}${s.k}${rule(th.kick,54)}</div>
    <div class="fit" data-max="${cover?118:92}" style="font:${cover?900:800} 92px/1.05 'Playfair Display',serif;color:${th.ttl};margin-top:16px;${cover?'letter-spacing:.03em':''}">${s.t}</div>
    <div style="font:${cover?'italic 700 46px':'500 38px'}/1.36 ${cover?"'Playfair Display',serif":'Inter'};color:${cover?th.kick:th.txt};margin:18px auto 0;max-width:800px">${s.x}</div></div>
  <div class="ab" style="left:0;right:0;bottom:${th.gold?78:88}px;display:flex;justify-content:center">${anchor(GOLD)}</div>
  <div class="ab" style="right:104px;bottom:${th.gold?84:94}px;font:600 22px Inter;color:${th.num};letter-spacing:.1em">${num}</div>`;
}
// ── B : pleine image (dégradé bleu / bandeau crème / ruban rouge) ──
function plein(th){
  const top=`<div class="ab" style="left:80px;top:74px;font:600 22px Inter;letter-spacing:.3em;text-transform:uppercase;color:#fff;text-shadow:0 1px 12px rgba(0,0,0,.4)">${cover?'':'Drevici Oyster'}</div>
  <div class="ab" style="right:80px;top:74px;font:600 22px Inter;letter-spacing:.12em;color:#fff;text-shadow:0 1px 12px rgba(0,0,0,.4)">${num}</div>`;
  if(th==='band'){ // carte postale : photo en haut, bandeau crème en bas
    el.style.background=CREAM;
    el.innerHTML=`<div class="ab img" style="left:0;right:0;top:0;height:${cover?930:960}px;${bg(s.img,s.pos)}"></div>${top}
    <div class="ab" style="left:0;right:0;top:${cover?930:960}px;height:8px;background:${RED}"></div>
    <div class="ab" style="left:80px;right:80px;top:${cover?990:1010}px">
      <div style="display:flex;align-items:center;gap:16px;font:700 25px Inter;letter-spacing:.28em;text-transform:uppercase;color:${RED}">${rule(RED,46)}${s.k}</div>
      <div class="fit" data-max="${cover?124:96}" style="font:italic 800 96px/1.04 'Playfair Display',serif;color:${INK};margin-top:14px">${s.t}</div>
      <div style="font:500 38px/1.38 Inter;color:#2d2a25;margin-top:16px">${s.x}</div></div>`;
    return; }
  const ruban=th==='ruban';
  el.innerHTML=`<div class="ab img" style="inset:0;${bg(s.img,s.pos)}"></div>
  <div class="ab" style="left:0;right:0;bottom:0;height:${cover?780:720}px;background:linear-gradient(180deg,rgba(13,37,92,0) 0%,rgba(13,37,92,.8) 40%,rgba(13,37,92,.97) 100%)"></div>${top}
  <div class="ab" style="left:80px;right:80px;bottom:${cover?150:110}px;color:#fff">
    ${ruban?`<div style="display:inline-block;background:${RED};color:#fff;font:700 25px Inter;letter-spacing:.24em;text-transform:uppercase;padding:12px 26px 12px 22px;clip-path:polygon(0 0,100% 0,96% 50%,100% 100%,0 100%)">${s.k}</div>`
      :`<div style="display:flex;align-items:center;gap:16px;font:700 25px Inter;letter-spacing:.28em;text-transform:uppercase;color:${GOLD}">${rule(GOLD,46)}${s.k}</div>`}
    <div class="fit" data-max="${cover?132:100}" style="font:${ruban?'800':'italic 800'} 100px/1.02 'Playfair Display',serif;margin-top:20px;${cover?'letter-spacing:.02em':''}">${s.t}</div>
    <div style="font:500 40px/1.38 Inter;color:${CREAM};margin-top:22px;max-width:900px">${s.x}</div></div>
  ${cover?`<img class="ab" src="img/DreviciOyster-BZH_LogoTexte_Blanc.svg" style="left:80px;bottom:64px;height:58px">`:''}`;
}
({A:()=>palace({bg:CREAM,fr:NAVY,fil:RED,kick:RED,ttl:INK,txt:'#3d3a34',num:NAVY}),
  A2:()=>palace({bg:NAVY,fr:CREAM,fil:GOLD,kick:GOLD,ttl:'#fff',txt:CREAM,num:CREAM}),
  A3:()=>palace({bg:CREAM,fr:'#b8913f',gold:1,kick:RED,ttl:INK,txt:'#3d3a34',num:NAVY}),
  B:()=>plein(''),B2:()=>plein('band'),B3:()=>plein('ruban')}[D])();
// Titres sur une seule ligne : on réduit la taille jusqu'à ce que ça tienne
document.fonts.ready.then(()=>{document.querySelectorAll('.fit').forEach(t=>{let f=+t.dataset.max;t.style.fontSize=f+'px';const w=t.parentElement.clientWidth;while(t.scrollWidth>w&&f>40){f-=2;t.style.fontSize=f+'px';}});document.body.dataset.ready=1;});
</script></body></html>
