<!doctype html><html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600;1,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Une diapositive Instagram 3:4 = 1080 × 1440 */
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1440px;overflow:hidden;background:#f4e6d1}
.s{position:relative;width:1080px;height:1440px;overflow:hidden;font-family:Inter,sans-serif}
.img{background-size:cover;background-position:center}
.ab{position:absolute}
</style></head><body><div id="s" class="s"></div>
<script>
const Q=new URLSearchParams(location.search), D=Q.get('d')||'A', N=+(Q.get('s')||1);
const NAVY='#253968',INK='#0d255c',GOLD='#d09d39',RED='#9f2e1f',RED2='#cd3232',CREAM='#f4e6d1';
// Le texte du carrousel (court) : une idée par image
const S=[
 {k:'Ostréiculteurs à Surzur',t:'Drevici Oyster',x:'Une famille, une rivière,<br>des huîtres.',img:'main-huitre',pos:'60% 55%'},
 {k:'Notre rivière',t:'La rivière de Penerf',x:'Une ria bretonne, entre la terre et la pleine mer. Le berceau de nos huîtres.',img:'penerf-pieux',pos:'50% 40%'},
 {k:'Notre méthode',t:'Brassées par les marées',x:'Peu d\'huîtres par panier, suspendues dans le courant : une coquille plus belle, une chair plus charnue.',img:'seapa',pos:'40% 50%'}];
const s=S[N-1], TOT=6, num=`${String(N).padStart(2,'0')} / ${String(TOT).padStart(2,'0')}`;
const anchor=c=>`<svg viewBox="0 0 340 362" width="30" height="32"><g transform="translate(0,362) scale(.1,-.1)" fill="${c}"><path d="M1585 3280 c-59 -23 -143 -94 -167 -141 -50 -100 -53 -114 -52 -204 0 -81 3 -96 33 -155 43 -85 72 -115 154 -156 l67 -34 0 -106 0 -106 -189 4 c-163 3 -192 5 -208 21 -23 20 -72 23 -95 5 -53 -44 -66 -139 -25 -199 33 -49 62 -56 119 -30 42 19 65 21 222 21 l176 0 0 -654 0 -655 -22 -15 c-29 -20 -107 -21 -202 -1 -180 37 -350 164 -451 335 -47 81 -98 204 -88 214 4 3 22 6 40 6 35 0 73 15 73 28 0 4 -18 30 -41 57 -70 86 -87 108 -145 185 -64 86 -94 120 -105 120 -22 0 -119 -450 -105 -485 9 -24 31 -18 77 20 28 24 45 33 52 26 6 -6 18 -41 28 -78 52 -201 128 -340 259 -473 114 -116 190 -163 380 -236 168 -64 207 -84 246 -126 32 -34 84 -122 84 -142 0 -6 4 -17 9 -25 8 -12 12 -12 25 -2 9 8 16 22 16 33 0 30 38 96 78 135 36 34 123 83 150 83 21 0 224 82 262 105 19 12 55 34 80 48 64 36 191 160 245 240 54 81 105 188 130 272 10 33 25 84 34 112 l16 53 35 -24 c48 -33 76 -40 84 -21 11 31 -38 346 -66 423 -31 83 -43 76 -183 -113 -33 -44 -79 -104 -103 -134 -40 -50 -42 -54 -25 -67 10 -7 39 -14 66 -14 26 0 47 -2 47 -5 0 -23 -51 -145 -88 -209 -88 -153 -253 -286 -410 -330 -88 -24 -241 -34 -253 -15 -10 15 -11 993 -2 1207 l5 122 169 0 c130 0 178 -4 208 -16 54 -21 99 -15 123 17 43 58 40 140 -8 190 -33 35 -70 37 -133 9 -37 -17 -65 -20 -207 -20 l-164 0 1 101 1 100 37 22 c20 12 49 29 64 37 37 18 92 87 117 146 30 69 37 176 16 249 -34 119 -134 224 -241 252 -73 19 -190 16 -250 -7z m238 -188 c102 -69 104 -238 4 -312 -33 -25 -51 -30 -94 -30 -30 0 -66 6 -81 14 -62 32 -112 113 -112 178 1 72 66 160 128 174 15 3 32 7 37 9 25 6 83 -10 118 -33z"/></g></svg>`;
const rule=(c,w,h=2)=>`<span style="display:inline-block;width:${w}px;height:${h}px;background:${c}"></span>`;
const bg=(im,pos)=>`background-image:url(img/${im}.jpg);background-position:${pos}`;
const el=document.getElementById('s');
if(D==='A'){ // Le palace crème : cadre bleu, filet rouge, image en vignette
  el.style.background=CREAM;
  el.innerHTML=`<div class="ab" style="inset:34px;border:12px solid ${NAVY};border-radius:36px"></div><div class="ab" style="inset:66px;border:4px solid ${RED};border-radius:10px"></div>
  <div class="ab img" style="left:104px;right:104px;top:104px;height:${N===1?820:760}px;border-radius:24px;${bg(s.img,s.pos)}"></div>
  <div class="ab" style="left:104px;right:104px;top:${N===1?962:902}px;text-align:center">
    <div style="display:flex;align-items:center;justify-content:center;gap:18px;font:700 22px Inter;letter-spacing:.3em;text-transform:uppercase;color:${RED}">${rule(RED,60)}${s.k}${rule(RED,60)}</div>
    <div style="font:${N===1?'800 104px':'700 78px'}/1.02 'Playfair Display',serif;color:${INK};margin-top:18px">${s.t}</div>
    <div style="font:${N===1?'italic 600 40px':'500 31px'}/1.4 ${N===1?"'Playfair Display',serif":'Inter'};color:${N===1?RED:'#3d3a34'};margin:22px auto 0;max-width:760px">${s.x}</div></div>
  <div class="ab" style="left:0;right:0;bottom:92px;display:flex;justify-content:center">${anchor(GOLD)}</div>
  <div class="ab" style="right:104px;bottom:96px;font:600 20px Inter;color:${NAVY};letter-spacing:.1em">${num}</div>`;
}
if(D==='B'){ // Pleine image : la photo en grand, le texte sur un dégradé bleu nuit
  el.innerHTML=`<div class="ab img" style="inset:0;${bg(s.img,s.pos)}"></div>
  <div class="ab" style="left:0;right:0;bottom:0;height:${N===1?760:700}px;background:linear-gradient(180deg,rgba(13,37,92,0) 0%,rgba(13,37,92,.78) 42%,rgba(13,37,92,.96) 100%)"></div>
  <div class="ab" style="left:84px;top:78px;font:600 21px Inter;letter-spacing:.32em;text-transform:uppercase;color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.35)">${N===1?'':'Drevici Oyster'}</div>
  <div class="ab" style="right:84px;top:78px;font:600 21px Inter;letter-spacing:.12em;color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.35)">${num}</div>
  <div class="ab" style="left:84px;right:84px;bottom:${N===1?150:120}px;color:#fff">
    <div style="display:flex;align-items:center;gap:16px;font:700 22px Inter;letter-spacing:.3em;text-transform:uppercase;color:${GOLD}">${rule(GOLD,46)}${s.k}</div>
    <div style="font:${N===1?'italic 700 128px':'italic 700 92px'}/1 'Playfair Display',serif;margin-top:20px">${s.t}</div>
    <div style="font:${N===1?'500 40px':'400 33px'}/1.42 Inter;color:${CREAM};margin-top:26px;max-width:860px">${s.x}</div></div>
  ${N===1?`<img class="ab" src="img/DreviciOyster-BZH_LogoTexte_Blanc.svg" style="left:84px;bottom:66px;height:48px;opacity:.95">`:''}`;
}
if(D==='C'){ // Carnet de bord : papier crème, coordonnées, titre d'affiche, photo cadrée
  const coord={1:'47°34′ N · 2°37′ O · SURZUR',2:'47°31′ N · 2°37′ O · RIVIÈRE DE PENERF',3:'47°31′ N · 2°37′ O · LE PARC'}[N];
  el.style.background='#f6efe2';
  el.innerHTML=`<div class="ab" style="left:72px;right:72px;top:74px;display:flex;justify-content:space-between;font:600 21px 'IBM Plex Mono',monospace;color:${NAVY};letter-spacing:.06em"><span>N° ${String(N).padStart(2,'0')}</span><span>${coord}</span></div>
  <div class="ab" style="left:72px;right:72px;top:118px;height:3px;background:${NAVY}"></div><div class="ab" style="left:72px;right:72px;top:127px;height:1px;background:${NAVY}"></div>
  <div class="ab" style="left:72px;right:72px;top:170px">
    <div style="font:${N===1?'150px':'104px'}/.95 Anton,sans-serif;color:${INK};text-transform:uppercase;letter-spacing:.005em;text-shadow:5px 5px 0 ${RED2}33">${s.t}</div>
    <div style="font:italic 700 34px 'Playfair Display',serif;color:${RED};margin-top:18px">${s.k}</div></div>
  <div class="ab img" style="left:72px;right:72px;top:${N===1?560:470}px;height:${N===1?640:620}px;${bg(s.img,s.pos)};box-shadow:0 0 0 14px #fff,0 0 0 16px #d9cdb8"></div>
  <div class="ab" style="left:72px;right:300px;bottom:${N===1?90:96}px;font:${N===1?'500 34px':'500 30px'}/1.45 Inter;color:#2d2a25">${s.x}</div>
  <img class="ab" src="img/DreviciOyster-BZH_LogoRond_SansFond.svg" style="right:72px;bottom:70px;width:170px">`;
}
</script></body></html>
