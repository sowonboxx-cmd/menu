<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Concepts waouh</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&family=Anton&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Noto+Serif+JP:wght@500;700&display=swap">
<style>
:root{--bg:#121110;--bg2:#1d1b19;--ink:#f3ece2;--mut:#8f877c;--acc:#e2482b;--line:#2b2825;--ttl:'Cormorant Garamond',serif;--tw:500;--plate:#1b1917}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:radial-gradient(ellipse at 50% 55%,var(--bg2) 0%,var(--bg) 64%);color:var(--ink);font-family:Inter,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.nav{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;padding:26px 44px;font-size:13px;z-index:5}
.logo{font:700 15px Inter;letter-spacing:.3em}.logo i{display:inline-block;width:9px;height:9px;background:var(--acc);margin-right:12px;vertical-align:1px;border-radius:var(--dot,0)}
.links{margin:0 auto;display:flex;gap:30px;color:var(--mut)}.links b{color:var(--ink);font-weight:600}
.cart{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:999px;padding:9px 16px}.cart em{font-style:normal;background:var(--acc);color:var(--onacc,#fff);border-radius:999px;font-size:11px;font-weight:700;padding:2px 7px}
.vis{position:absolute;left:50%;top:52%;width:580px;height:580px;margin:-290px 0 0 -290px}
.vis .glow{position:absolute;inset:-60px;border-radius:50%;background:radial-gradient(circle,var(--glow,rgba(255,255,255,.04)),transparent 65%)}
.vis svg.main{position:relative;width:100%;height:100%;display:block;filter:drop-shadow(0 24px 30px rgba(0,0,0,var(--sh,.5)))}
.info{position:absolute;left:44px;top:50%;transform:translateY(-46%);width:340px}
.num{font:500 12px 'IBM Plex Mono',monospace;color:var(--mut);letter-spacing:.08em}.num b{color:var(--ink);font-weight:500}
.kick{font:700 11px Inter;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin-top:28px}
.name{font:var(--tw) 56px/1 var(--ttl);margin-top:10px;text-transform:var(--tt,none);letter-spacing:var(--tls,0)}
.it{font:italic 500 18px 'Cormorant Garamond',serif;color:var(--mut);margin-top:8px}
.desc{font-size:14px;line-height:1.65;color:var(--desc,#bdb4a8);margin-top:16px}
.buy{display:flex;align-items:center;gap:18px;margin-top:24px}.price{font:600 30px var(--ttl)}
.add{background:var(--acc);color:var(--onacc,#fff);border-radius:999px;padding:13px 22px;font-weight:700;font-size:14px;box-shadow:0 10px 30px var(--accsh,rgba(226,72,43,.3))}
.meta{display:flex;gap:18px;margin-top:20px;font:500 11px 'IBM Plex Mono',monospace;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
.extra{margin-top:18px}
.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{border:1px solid var(--line);border-radius:999px;padding:8px 13px;font-size:12.5px;font-weight:600;color:var(--mut)}.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.step{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px}.step:first-child{border-top:0}.step i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:700 11px Inter;background:var(--line);color:var(--mut);flex:none}.step.ok i{background:var(--acc);color:var(--onacc,#fff)}.step b{font-weight:600}.step span{margin-left:auto;color:var(--mut);font-size:12.5px}
.list{position:absolute;right:44px;top:50%;transform:translateY(-50%);width:236px}
.li{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:14px;color:var(--mut);font-size:13px;width:100%;text-align:left}
.li .th{width:42px;height:42px;flex:none;border-radius:50%;overflow:hidden;background:var(--thb,#1d1b19);display:grid;place-items:center}.li .th svg{width:118%;height:118%}
.li b{display:block;color:inherit;font-weight:600}.li small{font:500 11px 'IBM Plex Mono',monospace}
.li.on{background:var(--onbg,#1f1c1a);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.hint{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);font:500 11px 'IBM Plex Mono',monospace;color:var(--mut);letter-spacing:.12em;text-transform:uppercase}
.lbl{position:absolute;inset:0;pointer-events:none}.lbl svg{position:absolute;inset:0;width:100%;height:100%}
.tag{position:absolute;font:500 11px 'IBM Plex Mono',monospace;color:var(--mut);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}.tag b{display:block;color:var(--ink);font:600 14px Inter;text-transform:none;letter-spacing:0;margin-top:2px}
.badge{position:absolute;font:700 12px Inter;background:var(--acc);color:var(--onacc,#fff);border-radius:999px;padding:8px 14px;letter-spacing:.04em}
@media(max-width:700px){
 .nav{padding:18px}.links{display:none}.cart{margin-left:auto;padding:7px 12px}
 .vis{width:350px;height:350px;margin:0;left:50%;top:84px;transform:translateX(-50%)}
 .info{left:20px;right:20px;width:auto;top:450px;transform:none;text-align:center}.num,.meta,.buy .price{display:none}.kick{margin-top:0}.name{font-size:40px}.it{font-size:16px}.desc{font-size:13.5px;margin-top:8px}
 .extra{margin-top:12px}.chips{justify-content:center}.step{text-align:left;padding:7px 0}
 .buy{position:fixed;left:18px;right:18px;bottom:22px;margin:0}.add{flex:1;padding:16px;font-size:15px}
 .list{left:0;right:0;top:auto;bottom:94px;width:auto;transform:none;display:flex;gap:6px;overflow:hidden;padding:0 16px}
 .li{flex-direction:column;gap:5px;padding:6px;min-width:74px;text-align:center;font-size:11px}.li small{display:none}.li .th{width:52px;height:52px}
 .hint,.lbl .tag.hm{display:none}
 body.fx .desc{display:none}
}
</style></head><body>
<div class="nav"><span class="logo"><i></i><span id="brand"></span></span><span class="links"><b>Carte</b><span id="l2">Commander</span><span>La maison</span></span><span class="cart">Panier <em>2</em></span></div>
<div class="vis"><div class="glow"></div><div id="art"></div></div>
<div class="lbl" id="lbl"></div>
<div class="info"><div class="num" id="num"></div><div class="kick" id="kick"></div><div class="name" id="name"></div><div class="it" id="it"></div><div class="desc" id="desc"></div><div class="extra" id="extra"></div>
  <div class="buy"><span class="price" id="price"></span><button class="add" id="add"></button></div><div class="meta" id="meta"></div></div>
<div class="list" id="list"></div><div class="hint" id="hint"></div>
<script>
const Q=new URLSearchParams(location.search),C=Q.get('c')||'ramen',FX=Q.get('fx')==='1',MOB=matchMedia('(max-width:700px)').matches;
function rnd(seed){let s=seed%2147483646+1;return()=>(s=(s*16807)%2147483647)/2147483647;}
const inCircle=(r,n,R,rmin=0)=>Array.from({length:n},()=>{const a=r()*6.283,d=Math.sqrt(r()*(1-(rmin/R)**2)+(rmin/R)**2)*R;return [300+Math.cos(a)*d,300+Math.sin(a)*d,r()];});
const inWedge=(r,n,a0,a1,r0,r1)=>Array.from({length:n},()=>{const a=a0+(a1-a0)*r(),d=r0+(r1-r0)*Math.sqrt(r());return [300+Math.cos(a)*d,300+Math.sin(a)*d,r()];});
const S=x=>`<svg class="main" viewBox="0 0 600 600">${x}</svg>`;
const rot=(x,y,a,inner)=>`<g transform="rotate(${a} ${x} ${y})">${inner}</g>`;

/* ═════════ RAMEN : bol vu de dessus ═════════ */
function ramen(t,seed){const r=rnd(seed),el=[];
  el.push(`<defs><radialGradient id="bw${seed}" cx=".45" cy=".4"><stop offset=".86" stop-color="#232120"/><stop offset=".93" stop-color="#3a3532"/><stop offset="1" stop-color="#161413"/></radialGradient>
  <radialGradient id="br${seed}" cx=".45" cy=".42"><stop offset="0" stop-color="${t.broth[0]}"/><stop offset="1" stop-color="${t.broth[1]}"/></radialGradient><clipPath id="cl${seed}"><circle cx="300" cy="300" r="248"/></clipPath></defs>
  <circle cx="300" cy="300" r="292" fill="url(#bw${seed})"/><circle cx="300" cy="300" r="292" fill="none" stroke="#4a443f" stroke-width="2"/><circle cx="300" cy="300" r="250" fill="url(#br${seed})"/>`);
  const g=[];
  // gouttes de gras à la surface
  inCircle(r,40,240).forEach(([x,y,k])=>g.push(`<ellipse cx="${x}" cy="${y}" rx="${4+k*9}" ry="${3+k*7}" fill="#fff" opacity="${.06+k*.1}"/>`));
  if(t.oil)inCircle(r,26,235).forEach(([x,y,k])=>g.push(`<ellipse cx="${x}" cy="${y}" rx="${8+k*22}" ry="${6+k*16}" fill="#d9381e" opacity="${.35+k*.3}"/>`));
  // nouilles
  for(let i=0;i<20;i++){const y=150+i*14+r()*8,x0=90+r()*30;let d=`M${x0} ${y}`;for(let x=x0;x<330;x+=24)d+=` q12 ${r()>.5?9:-9} 24 0`;g.push(`<path d="${d}" fill="none" stroke="${t.noodle||'#f0d58a'}" stroke-width="7" stroke-linecap="round" opacity=".95"/><path d="${d}" fill="none" stroke="#fff6d6" stroke-width="2" opacity=".35" transform="translate(-1 -2)"/>`);}
  el.push(`<g clip-path="url(#cl${seed})">${g.join('')}</g>`);
  // nori
  if(t.nori!==false)el.push(rot(150,150,-28,`<rect x="80" y="70" width="88" height="150" rx="4" fill="#1b2619"/><rect x="80" y="70" width="88" height="150" rx="4" fill="none" stroke="#2b3a27" stroke-width="3"/>`));
  // chashu
  (t.chashu||[]).forEach(([x,y,a])=>el.push(rot(x,y,a,`<ellipse cx="${x}" cy="${y}" rx="66" ry="52" fill="#e3a993"/><ellipse cx="${x}" cy="${y}" rx="66" ry="52" fill="none" stroke="#8c4630" stroke-width="7"/><path d="M${x-40} ${y-12} q30 -16 62 4 M${x-30} ${y+16} q24 -8 48 6" stroke="#f6e1d6" stroke-width="6" fill="none" stroke-linecap="round"/><ellipse cx="${x+18}" cy="${y-6}" rx="14" ry="9" fill="#c9785f" opacity=".6"/>`)));
  // oeuf mollet
  (t.egg||[]).forEach(([x,y,a])=>el.push(rot(x,y,a,`<ellipse cx="${x}" cy="${y}" rx="52" ry="40" fill="#a8693a"/><ellipse cx="${x}" cy="${y}" rx="46" ry="35" fill="#fdf7ea"/><ellipse cx="${x+4}" cy="${y}" rx="27" ry="21" fill="#f08a1c"/><ellipse cx="${x+4}" cy="${y}" rx="18" ry="13" fill="#f7a733"/><ellipse cx="${x-4}" cy="${y-6}" rx="7" ry="4" fill="#fff" opacity=".6"/>`)));
  if(t.naruto)el.push(`<circle cx="238" cy="452" r="34" fill="#fbf6f0"/><circle cx="238" cy="452" r="34" fill="none" stroke="#e8dcd0" stroke-width="5" stroke-dasharray="6 5"/><path d="M238 452 m0 -4 a4 4 0 1 1 -4 4 a10 10 0 1 1 10 10 a16 16 0 1 1 -16 -16" fill="none" stroke="#e5647f" stroke-width="5"/>`);
  if(t.corn)inWedge(r,40,3.6,4.3,120,220).forEach(([x,y])=>el.push(`<rect x="${x-7}" y="${y-6}" width="14" height="12" rx="4" fill="#f6c434" stroke="#d9a21a" stroke-width="1.5"/>`));
  if(t.menma)for(let i=0;i<7;i++){const x=440+i*9,y=410+(i%2)*6;el.push(rot(x,y,-40+i*4,`<rect x="${x-6}" y="${y-30}" width="12" height="60" rx="3" fill="#c99a52"/><rect x="${x-2}" y="${y-28}" width="3" height="56" fill="#e6c180" opacity=".7"/>`));}
  if(t.tofu)(t.tofu).forEach(([x,y])=>el.push(`<rect x="${x-24}" y="${y-24}" width="48" height="48" rx="6" fill="#f3ead2"/><rect x="${x-24}" y="${y-24}" width="48" height="10" rx="4" fill="#d9b66e"/>`));
  if(t.mince)inWedge(r,90,4.6,5.6,60,200).forEach(([x,y,k])=>el.push(`<circle cx="${x}" cy="${y}" r="${4+k*4}" fill="#7a3b22"/>`));
  // ciboule
  inCircle(r,t.scal||34,180,20).forEach(([x,y,k])=>el.push(`<circle cx="${x}" cy="${y}" r="${6+k*3}" fill="none" stroke="${k>.5?'#5fae3b':'#9fd36a'}" stroke-width="3.5"/>`));
  inCircle(r,60,200).forEach(([x,y])=>el.push(`<ellipse cx="${x}" cy="${y}" rx="2.4" ry="1.4" fill="#f4ecd9" opacity=".9"/>`));
  return S(el.join(''));}

/* ═════════ POKE : bol, secteurs d'ingrédients ═════════ */
function poke(t,seed){const r=rnd(seed),el=[];
  el.push(`<circle cx="300" cy="300" r="292" fill="#e9e3d8"/><circle cx="300" cy="300" r="292" fill="none" stroke="#d3cbbd" stroke-width="3"/><circle cx="300" cy="300" r="262" fill="#f3efe7"/><circle cx="300" cy="300" r="250" fill="${t.base==='quinoa'?'#e7d9b4':'#fbf8f1'}"/>`);
  inCircle(r,320,246).forEach(([x,y,k])=>el.push(t.base==='quinoa'?`<circle cx="${x}" cy="${y}" r="3" fill="${k>.5?'#d1bd8a':'#c9a97a'}"/>`:`<ellipse cx="${x}" cy="${y}" rx="6" ry="3" fill="#ebe5d8" transform="rotate(${k*180} ${x} ${y})"/>`));
  const N=t.sec.length,step=6.283/N;
  const F={
   saumon:(x,y,k)=>rot(x,y,k*90,`<rect x="${x-17}" y="${y-15}" width="34" height="30" rx="6" fill="#f2875a"/><path d="M${x-12} ${y-8} l24 6 M${x-12} ${y+2} l24 6" stroke="#fde3d3" stroke-width="3"/>`),
   thon:(x,y,k)=>rot(x,y,k*90,`<rect x="${x-17}" y="${y-15}" width="34" height="30" rx="6" fill="#b3263b"/><rect x="${x-13}" y="${y-11}" width="14" height="8" rx="3" fill="#d2465b" opacity=".7"/>`),
   crevette:(x,y,k)=>rot(x,y,k*360,`<path d="M${x-20} ${y} a20 20 0 1 1 20 20" fill="none" stroke="#f39b7a" stroke-width="13" stroke-linecap="round"/><path d="M${x-20} ${y} a20 20 0 1 1 20 20" fill="none" stroke="#fde1d3" stroke-width="13" stroke-dasharray="3 8"/>`),
   tofu:(x,y,k)=>rot(x,y,k*90,`<rect x="${x-17}" y="${y-17}" width="34" height="34" rx="5" fill="#f4ebd3"/><rect x="${x-17}" y="${y-17}" width="34" height="9" rx="4" fill="#d6ad5f"/>`),
   avocat:(x,y,k)=>rot(x,y,k*60,[0,1,2,3,4].map(i=>`<path d="M${x-40+i*15} ${y+10} q8 -46 16 0 z" fill="#a9c962" stroke="#5c8a2f" stroke-width="3"/>`).join('')),
   edamame:(x,y,k)=>rot(x,y,k*180,`<ellipse cx="${x}" cy="${y}" rx="11" ry="8" fill="#7fb546"/><ellipse cx="${x-3}" cy="${y-3}" rx="4" ry="2.5" fill="#b2db7b"/>`),
   mangue:(x,y,k)=>rot(x,y,k*90,`<rect x="${x-14}" y="${y-13}" width="28" height="26" rx="6" fill="#f7b733"/><rect x="${x-10}" y="${y-9}" width="10" height="7" rx="3" fill="#fcd776"/>`),
   concombre:(x,y)=>`<circle cx="${x}" cy="${y}" r="17" fill="#3f7d34"/><circle cx="${x}" cy="${y}" r="14" fill="#d8edb4"/><circle cx="${x}" cy="${y}" r="6" fill="#bcdc8c"/>`,
   chou:(x,y,k)=>`<path d="M${x-20} ${y} q10 -12 20 0 t20 0" stroke="#7d3a8c" stroke-width="5" fill="none" transform="rotate(${k*180} ${x} ${y})" stroke-linecap="round"/>`,
   wakame:(x,y,k)=>`<path d="M${x-18} ${y} q6 -14 12 0 t12 0 t12 0" stroke="#2f8a3c" stroke-width="5" fill="none" transform="rotate(${k*180} ${x} ${y})" stroke-linecap="round"/>`,
   radis:(x,y)=>`<circle cx="${x}" cy="${y}" r="15" fill="#e14f6a"/><circle cx="${x}" cy="${y}" r="12" fill="#fbeef0"/>`,
   mais:(x,y)=>`<rect x="${x-7}" y="${y-6}" width="14" height="12" rx="4" fill="#f6c434" stroke="#d9a21a" stroke-width="1.5"/>`};
  const dens={saumon:9,thon:9,crevette:6,tofu:8,avocat:2,edamame:20,mangue:10,concombre:7,chou:20,wakame:16,radis:7,mais:30};
  t.sec.forEach((s,i)=>{if(FX&&t.missing===i){const a=i*step-1.57;el.push(`<path d="M300 300 L${300+Math.cos(a)*240} ${300+Math.sin(a)*240} A240 240 0 0 1 ${300+Math.cos(a+step)*240} ${300+Math.sin(a+step)*240} Z" fill="none" stroke="#c9bfa9" stroke-width="3" stroke-dasharray="10 9"/>`);return;}
    inWedge(r,dens[s],i*step-1.57+.12,(i+1)*step-1.57-.12,s==='avocat'?150:90,s==='avocat'?170:225).forEach(([x,y,k])=>el.push(F[s](x,y,k)));});
  el.push(`<circle cx="300" cy="300" r="64" fill="#f7f2e8"/>`);inCircle(r,40,58).forEach(([x,y,k])=>el.push(`<ellipse cx="${x}" cy="${y}" rx="3" ry="1.8" fill="${k>.5?'#2b2622':'#f3e9cf'}"/>`));
  el.push(`<path d="M250 290 q12 -14 24 0 t24 0 t24 0 t24 0" stroke="#7a4524" stroke-width="5" fill="none" stroke-linecap="round" opacity=".85"/>`);
  return S(el.join(''));}

/* ═════════ BURGER : vu de côté, couches ═════════ */
const LAY={
 bunB:(y,w)=>({h:62,s:`<path d="M${300-w/2} ${y-62} h${w} v30 q0 32 -40 32 h${-(w-80)} q-40 0 -40 -32z" fill="#d48a3a"/><rect x="${300-w/2}" y="${y-62}" width="${w}" height="14" fill="#f2c88a"/>`}),
 patty:(y,w)=>({h:70,s:`<rect x="${300-w/2-14}" y="${y-70}" width="${w+28}" height="70" rx="30" fill="#4d2b19"/>${Array.from({length:26},(_,i)=>`<circle cx="${300-w/2+i*(w/25)}" cy="${y-35+((i*37)%30)-15}" r="${3+i%3}" fill="#2f190e"/>`).join('')}<rect x="${300-w/2}" y="${y-64}" width="${w}" height="8" rx="4" fill="#7a4a2c" opacity=".7"/>`}),
 veg:(y,w)=>({h:66,s:`<rect x="${300-w/2-10}" y="${y-66}" width="${w+20}" height="66" rx="28" fill="#6f7a35"/>${Array.from({length:22},(_,i)=>`<circle cx="${300-w/2+i*(w/21)}" cy="${y-33+((i*29)%26)-13}" r="4" fill="${i%2?'#e36b3c':'#a9c46a'}"/>`).join('')}`}),
 chicken:(y,w)=>({h:74,s:`<path d="M${300-w/2-20} ${y-36} q0 -40 40 -38 h${w-40} q44 0 40 38 q4 38 -40 36 h${-(w-40)} q-40 2 -40 -36z" fill="#d79a45"/>${Array.from({length:30},(_,i)=>`<circle cx="${300-w/2-10+i*(w+20)/29}" cy="${y-37+((i*41)%54)-27}" r="5" fill="#b8742a"/>`).join('')}`}),
 cheese:(y,w)=>({h:16,s:`<path d="M${300-w/2-22} ${y-16} h${w+44} v10 l-20 0 l-10 26 l-12 -26 h-80 l-14 34 l-14 -34 h${-(w-150)} l-10 22 l-12 -22 h-20z" fill="#f5be2c"/><rect x="${300-w/2-22}" y="${y-16}" width="${w+44}" height="5" fill="#fbd96a"/>`}),
 lettuce:(y,w)=>({h:24,s:`<path d="M${300-w/2-30} ${y-10} ${Array.from({length:16},(_,i)=>`q${(w+60)/32} ${i%2?18:-18} ${(w+60)/16} 0`).join(' ')} v-14 h${-(w+60)} z" fill="#69bd4a"/><path d="M${300-w/2-30} ${y-18} h${w+60}" stroke="#a5dd7c" stroke-width="4"/>`}),
 tomato:(y,w)=>({h:28,s:`<rect x="${300-w/2+10}" y="${y-28}" width="${w-20}" height="28" rx="12" fill="#d93a2b"/>${[0,1,2,3,4].map(i=>`<ellipse cx="${300-w/2+50+i*(w-100)/4}" cy="${y-14}" rx="14" ry="6" fill="#f17a5c"/>`).join('')}`}),
 onion:(y,w)=>({h:16,s:[0,1,2,3].map(i=>`<ellipse cx="${300-w/2+60+i*(w-120)/3}" cy="${y-8}" rx="42" ry="8" fill="none" stroke="#a45db2" stroke-width="6"/>`).join('')}),

const K=CON[C],T=K.theme;Object.entries(T).forEach(([k,v])=>document.documentElement.style.setProperty('--'+k,v));

if(C==='patisserie'||C==='glacier')document.getElementById('l2').textContent='Commander';
const $=id=>document.getElementById(id),eur=n=>String(n).replace('.',',')+(n%1?'0':'')+' €';
const I=+(Q.get('i')||0),x=K.items[I];
$('list').innerHTML=K.items.map((it,i)=>{let s=K.draw(it,i);if(typeof s==='object')s=s.svg;return `<button class="li ${i===I?'on':''}"><span class="th">${s}</span><span><b>${it.n}</b><small>${eur(it.p)}</small></span></button>`;}).join('');
$('num').innerHTML=`<b>${String(I+1).padStart(2,'0')}</b> / ${String(K.items.length).padStart(2,'0')}`;$('kick').textContent=x.k;$('name').textContent=x.n;$('it').textContent=x.it;$('desc').textContent=x.d;$('price').textContent=eur(x.p);
$('add').textContent=MOB?`Ajouter · ${eur(x.p)}`:'Ajouter au panier';$('meta').innerHTML=x.m.map(m=>`<span>${m}</span>`).join('');
let art=K.draw(x,I);
function labels(lab){const box=document.querySelector('.vis').getBoundingClientRect(),L=$('lbl');let svg='',tags='';
  lab.forEach(([a,b,fx,fy])=>{const px=box.left+box.width*fx,py=box.top+box.height*fy,right=true,tx=right?box.right+(MOB?-4:14):box.left-(MOB?-4:36);
   svg+=`<path d="M${px} ${py} L${tx} ${py}" stroke="var(--mut)" stroke-width="1" fill="none"/><circle cx="${px}" cy="${py}" r="4" fill="var(--ink)"/>`;
   tags+=`<div class="tag" style="top:${py-18}px;${right?`left:${tx+10}px`:`right:${innerWidth-tx+10}px;text-align:right`}">${a}<b>${b}</b></div>`;});
  L.innerHTML=`<svg>${svg}</svg>`+tags;}
if(FX){document.body.classList.add('fx');
 if(K.fx==='labels'&&!MOB)setTimeout(()=>labels(x.lab),60);

   L.innerHTML=`<svg>${s}</svg>`+tg;},60);}
 if(K.fx==='compose'){const st=['Base','Protéine','Légumes','Fruits','Sauce'],v=[x.m[0],x.n,'4 sur 5','Mangue','En attente'];
