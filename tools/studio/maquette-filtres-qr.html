<!doctype html><html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@500;600;700;800&display=swap">
<style>
:root{--bg:#f6f1e7;--ink:#0d255c;--navy:#253968;--red:#9f2e1f;--mut:#6b7385;--paper:#fbfaf6;--soft:#efe8da}
*{box-sizing:border-box;margin:0}body{background:#ddd6cb;font-family:Inter,sans-serif;color:var(--ink);padding:30px;width:1700px}
h1.t{font-size:24px}.sub{color:#555;font-size:14px;margin:4px 0 24px}
.v{margin-bottom:44px}.v>h2{font:800 17px Inter;margin-bottom:12px}.v>h2 small{font-weight:500;color:#555;font-size:13.5px;margin-left:8px}
.row{display:flex;gap:30px;align-items:flex-start}
.desk{width:1160px;background:var(--bg);border-radius:18px;padding:26px 28px 6px}
.mob{width:390px;background:var(--bg);border-radius:34px;padding:22px 16px 6px;flex:none}
.hd{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.back{width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:20px;flex:none}
.hd h1{font:700 30px/1 'Playfair Display',serif}.hd p{font-size:13px;color:var(--mut);margin-top:4px}
.act{margin-left:auto;display:flex;gap:8px}
.b{border-radius:999px;padding:10px 16px;font:700 13px Inter;white-space:nowrap;background:#fff}
.b.p{background:var(--ink);color:#fff}
.mob .hd h1{font-size:25px}.mob .hd p{display:none}.mob .b{padding:9px 13px;font-size:12.5px}
.camp{background:#fff;border-radius:20px;padding:6px 16px 4px;margin-top:6px}
.camp .ch{display:flex;align-items:center;gap:10px;padding:12px 0 9px;border-bottom:3px solid var(--red)}.camp .ch b{font:700 23px 'Playfair Display',serif;color:var(--red)}
.camp .ch small{margin-left:auto;font-size:12px;color:var(--mut)}
.camp .r{display:flex;padding:11px 0;border-top:1px solid #f0ebe0;font-size:14px;font-weight:700}.camp .r:first-of-type{border:0}.camp .r span{margin-left:auto;color:var(--mut);font-weight:600}
.scroll{display:flex;gap:6px;overflow:hidden;white-space:nowrap}
/* A · segmenté */
.seg{display:inline-flex;background:#fff;border-radius:999px;padding:4px;gap:2px;max-width:100%;overflow:hidden}
.seg i{font-style:normal;padding:9px 15px;border-radius:999px;font:700 13px Inter;color:var(--mut);white-space:nowrap}.seg i.on{background:var(--ink);color:#fff}
.txt{display:flex;gap:18px;margin:14px 4px 6px;font:600 13px Inter;color:var(--mut);white-space:nowrap;overflow:hidden}.txt i{font-style:normal;padding-bottom:4px}.txt i.on{color:var(--ink);box-shadow:inset 0 -2px 0 var(--red)}
/* B · onglets */
.tabs{display:flex;align-items:flex-end;gap:24px;box-shadow:inset 0 -1px 0 #e0d8c8;margin-bottom:14px;white-space:nowrap;overflow:hidden}
.tabs i{font-style:normal;font:700 14.5px Inter;color:var(--mut);padding:0 0 11px}.tabs i.on{color:var(--ink);box-shadow:inset 0 -3px 0 var(--red)}
.sel{display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:9px 14px;font:700 13px Inter;white-space:nowrap}.sel small{font-weight:600;color:var(--mut)}.sel:after{content:'';width:7px;height:7px;border:solid var(--ink);border-width:0 2px 2px 0;transform:rotate(45deg) translateY(-2px);margin-left:2px}
/* C · panneau */
.panel{background:#fff;border-radius:20px;padding:6px 16px}
.pr{display:flex;align-items:center;gap:14px;padding:10px 0}.pr+.pr{border-top:1px solid #f0ebe0}
.pr label{width:84px;flex:none;font:800 10.5px Inter;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.pr .scroll i{font-style:normal;padding:8px 13px;border-radius:999px;background:var(--paper);font:700 13px Inter}.pr .scroll i.on{background:var(--ink);color:#fff}
.pr .scroll{min-width:0;max-width:100%}.mob .pr{flex-direction:column;align-items:stretch;gap:8px}.mob .pr label{width:auto}
/* D · menus */
.bar{display:flex;gap:8px;align-items:stretch}
.dd{background:#fff;border-radius:14px;padding:9px 38px 10px 14px;position:relative;min-width:210px}.dd small{display:block;font:700 11px Inter;color:var(--mut)}.dd b{display:block;font:700 15px Inter;margin-top:2px}
.dd:after{content:'';position:absolute;right:16px;top:50%;width:8px;height:8px;border:solid var(--ink);border-width:0 2px 2px 0;transform:translateY(-70%) rotate(45deg)}
.cnt{margin-left:auto;align-self:center;font:600 13px Inter;color:var(--mut)}
.mob .bar{flex-wrap:wrap}.mob .dd{min-width:0;flex:1}
</style></head><body>
<h1 class="t">Scans QR · le haut de page, 4 propositions</h1><p class="sub">Sans icône. Même contenu partout : titre, Guide, nouveau QR, filtre par campagne et par support. Ordinateur à gauche, téléphone à droite.</p>
<div id="out"></div>
<script>
const C=['Toutes','Free Oyster','Plat en test','Plateau de fruits de mer','Menu','Club','Halloween'],S=['Tous','Affiche','Carte table','Serveur','Chevalet','Flyer'];
const HD=m=>`<div class="hd"><span class="back">‹</span><div><h1>Scans QR</h1><p>Par campagne · touchez un QR pour le détail</p></div><div class="act"><span class="b">Guide</span><span class="b p">${m?'+ QR':'+ Nouveau QR'}</span></div></div>`;
const CAMP=`<div class="camp"><div class="ch"><b>Plat en test</b><small>3 QR · 7 jours</small></div><div class="r">Élodie<span>11 scans · 0 · 0 €</span></div><div class="r">Vincent<span>14 scans · 1 · 2 €</span></div></div>`;
const V={
 A:['A · Sélecteur arrondi','les campagnes dans une seule barre blanche, les supports en texte souligné de rouge',
  m=>HD(m)+`<div class="seg">${C.map((c,i)=>`<i class="${i==2?'on':''}">${c}</i>`).join('')}</div><div class="txt">${S.map((s,i)=>`<i class="${i==0?'on':''}">${s}</i>`).join('')}</div>`+CAMP],
 B:['B · Onglets','les campagnes en onglets soulignés de rouge (comme les titres), le support dans un menu',
  m=>HD(m)+`<div class="tabs">${C.map((c,i)=>`<i class="${i==2?'on':''}">${c}</i>`).join('')}</div><div style="display:flex;gap:8px;margin-bottom:6px"><span class="sel"><small>Support</small>Tous</span></div>`+CAMP],
 C:['C · Panneau de filtres','tout est regroupé dans un bloc blanc, une ligne par filtre',
  m=>HD(m)+`<div class="panel"><div class="pr"><label>Campagne</label><div class="scroll">${C.map((c,i)=>`<i class="${i==2?'on':''}">${c}</i>`).join('')}</div></div><div class="pr"><label>Support</label><div class="scroll">${S.map((s,i)=>`<i class="${i==0?'on':''}">${s}</i>`).join('')}</div></div></div>`+CAMP],
 D:['D · Deux menus','le plus épuré : deux menus déroulants et le nombre de QR',
  m=>HD(m)+`<div class="bar"><div class="dd"><small>Campagne</small><b>Plat en test</b></div><div class="dd"><small>Support</small><b>Tous</b></div>${m?'':'<span class="cnt">3 QR · 42 scans cette semaine</span>'}</div>`+CAMP]};
document.getElementById('out').innerHTML=Object.values(V).map(([t,d,f])=>`<div class="v"><h2>${t}<small>${d}</small></h2><div class="row"><div class="desk">${f(0)}</div><div class="mob">${f(1)}</div></div></div>`).join('');
</script></body></html>
