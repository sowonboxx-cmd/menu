<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap">
<style>body{margin:0;background:#f4e6d1;font-family:Inter;padding:30px;width:1540px}h1{font-size:26px;margin:0 0 6px;color:#1a2540}p{margin:0 0 22px;color:#555}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:26px}.c{background:#fff;border-radius:18px;padding:18px}.c svg{width:100%;height:auto;display:block}.z{margin-top:12px;border-radius:12px;overflow:hidden;height:170px;display:flex;align-items:center;justify-content:center;background:#fff}.z svg{width:520px!important;flex:none}
.c b{display:block;margin-top:12px;font-size:16px;color:#1a2540}.c small{color:#666;font-size:13px}</style></head>
<body><h1>L'huître au centre · épaisseur du trait</h1><p>Même QR (style losanges). En dessous de chaque QR, un zoom sur l'huître.</p><div class="g" id="g"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script><script src="qr-drevici.js"></script>
<script>
const U='https://drevici.beltab.app/qr/free-oyster/affiche-biot-1';
const V=[[0,.12,'A · Actuel','Trait d\'origine, fin.'],[30,.1,'B · Un peu plus épais','Trait renforcé, huître un peu plus grande.'],[55,.09,'C · Épais','Bien blanche, se voit de loin.'],[85,.08,'D · Très épais','Presque pleine, style tampon.']];
document.getElementById('g').innerHTML=V.map(([st,pd,t,d])=>{const q=qrDrevici(U,600,{oyStroke:st,oyPad:pd});return `<div class="c" data-st="${st}">${q}<div class="z">${q}</div><b>${t}</b><small>${d}</small></div>`}).join('');
</script></body></html>
