<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap">
<style>body{margin:0;background:#f4e6d1;font-family:Inter;padding:30px;width:1540px}h1{font-size:26px;margin:0 0 6px;color:#1a2540}p{margin:0 0 22px;color:#555}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:26px}.c{background:#fff;border-radius:18px;padding:18px}.c svg{width:100%;height:auto;display:block}.c b{display:block;margin-top:12px;font-size:16px;color:#1a2540}.c small{color:#666;font-size:13px;line-height:1.4;display:block;margin-top:3px}</style></head>
<body><h1>QR Drevici · styles</h1><p>Même lien, même huître au centre. Tous testés au lecteur de QR.</p><div class="g" id="g"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script><script src="qr-drevici.js"></script>
<script>
const U='https://drevici.beltab.app/qr/free-oyster/affiche-biot-1';
const S=[['losange','feuille','A · Losanges','Celui de ton affiche. Fin et graphique.'],['rond','rond','B · Perles','Des points ronds comme des perles, yeux ronds.'],['liquide','feuille','C · Liquide','Gros blocs qui fusionnent, très solide de loin.'],['barres','rond','D · Barres','Pilules verticales, look « code-barre », très mode.'],['etoile','feuille','E · Étoiles','Petites étoiles à 4 branches, effet scintillant.'],['goutte','feuille','F · Gouttes','Chaque point est une goutte tournée vers l’huître.'],['croix','carre','G · Croix','Petites croix, style brodé / marin.'],['pixel','carre','H · Pixels espacés','Gros carrés séparés, rétro 8-bit.']];
document.getElementById('g').innerHTML=S.map(([s,e,t,d])=>`<div class="c" data-s="${s}">${qrDrevici(U,600,{style:s,eye:e})}<b>${t}</b><small>${d}</small></div>`).join('');
</script></body></html>
