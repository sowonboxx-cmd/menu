<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>2-metro</title><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;0,900;1,600;1,700&family=Inter:wght@400;500;600;700;800&family=Anton&family=Caveat:wght@600;700&family=Alfa+Slab+One&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100mm;height:330mm;overflow:hidden}
body{font-family:Inter,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
@page{size:100mm 330mm;margin:0}
.p{position:relative;width:100mm;height:330mm;overflow:hidden;display:flex;flex-direction:column;align-items:center}
.qr{display:block;width:100%;height:auto}
.qrc{background:#fff;padding:2.2mm;border-radius:3mm}
.masc{display:block;height:100%;width:auto;object-fit:contain}
.mid{flex:1;display:flex;align-items:center;justify-content:center;gap:4mm;width:100%;min-height:0}
.strip .mid{flex-direction:column;gap:3mm}

.p{background:#f3ece0;background-image:linear-gradient(#e6dccb 1px,transparent 1px),linear-gradient(90deg,#e6dccb 1px,transparent 1px);background-size:12.5mm 6.25mm}
.plaque{margin-top:10mm;background:#1d2a4d;color:#fff;border:1.4mm solid #fff;outline:.8mm solid #1d2a4d;border-radius:2mm;padding:3mm 5mm;text-align:center;box-shadow:0 2mm 4mm rgba(0,0,0,.15)}
.plaque b{display:block;font:400 13mm/1 Anton;letter-spacing:.03em}
.plaque small{display:block;font:600 2.8mm/1 Inter;letter-spacing:.3em;text-transform:uppercase;color:#c9d2e6;margin-top:1.5mm}
.mid{padding:4mm 8mm}
.mascw{height:92mm}
.q{width:62mm;text-align:center}
.q .tag{display:inline-block;background:#b3261e;color:#fff;font:400 5.4mm/1 Anton;letter-spacing:.06em;padding:2mm 4mm;border-radius:1.5mm;margin-bottom:3mm}
.q .qrc{border:1mm solid #1d2a4d}
.pied{width:100%;background:#1d2a4d;color:#fff;text-align:center;padding:5mm 4mm 6mm}
.pied img{height:24.0mm}
.pied p{font:600 3mm/1.3 Inter;letter-spacing:.12em;text-transform:uppercase;color:#c9d2e6;margin-top:2mm}
</style></head><body><div class="p  strip"><div class="plaque"><b>FREE OYSTER</b><small>Correspondance · une huître offerte</small></div><div class="mid"><div class="mascw"><img class="masc" src="../mascotte-pointe.png"></div><div class="q"><div class="tag">DON'T SCAN !</div><div class="qrc"><img class="qr" src="../qr.svg"></div></div></div><div class="pied"><img src="../logo-blanc-or.svg"><p>8, rue Biot, 75017 Paris</p></div></div></body></html>
