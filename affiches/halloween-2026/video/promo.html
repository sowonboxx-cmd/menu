<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@600;700;800&family=Playfair+Display:ital,wght@0,800;0,900;1,900&display=block" rel="stylesheet">
<style>
/* Story 1080 × 1920 · 8 s · chaque scène pilotée par la variable de temps (frame par frame) */
*{margin:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0c0a12}
#v{position:relative;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(120% 70% at 50% 10%,#2a1a3a 0,#0c0a12 62%);color:#f5efe6;font-family:Inter}
.sc{position:absolute;inset:0;opacity:0}
.bat{position:absolute;fill:#07050c;filter:drop-shadow(0 0 3px #fb923c) drop-shadow(0 0 30px rgba(249,115,22,.6))}
.moon{position:absolute;left:50%;top:44%;width:1250px;height:1250px;margin:-625px 0 0 -625px;border-radius:50%;background:radial-gradient(circle at 40% 38%,#fff3d6,#f6c98a 45%,#e08a3a 68%,transparent 70%);box-shadow:0 0 200px 60px rgba(249,115,22,.35)}
.logo{position:absolute;left:50%;top:44%;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;box-shadow:0 0 0 14px #f97316,0 0 120px 30px rgba(249,115,22,.55)}
.pres{position:absolute;left:0;right:0;top:1330px;text-align:center;font:800 46px Inter;letter-spacing:.3em;color:#fdba74}
.t1{position:absolute;left:0;right:0;text-align:center;font:400 250px/1 Anton;letter-spacing:.01em}
.t1.a{top:470px;color:#f5efe6;text-shadow:12px 12px 0 #f97316}
.t1.b{top:770px;color:#f97316;text-shadow:12px 12px 0 #3a1407}
.date{position:absolute;left:50%;top:1110px;transform:translateX(-50%);white-space:nowrap;background:#f97316;color:#1b1222;font:400 62px Anton;letter-spacing:.06em;padding:18px 44px;border-radius:999px}
.only{position:absolute;left:0;right:0;top:1260px;text-align:center;font:700 44px Inter;color:#d6cfe0}
.cap{position:absolute;left:0;right:0;text-align:center;font:400 110px/1 Anton;letter-spacing:.02em}
.cap small{display:block;font:700 42px Inter;letter-spacing:0;color:#d6cfe0;margin-top:22px}
.door{position:absolute;width:300px;height:510px}
.lot{position:absolute;width:440px;height:520px;border-radius:44px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 4px rgba(253,186,116,.35);text-align:center;padding-top:30px}
.lot img{height:300px;max-width:390px;object-fit:contain;filter:drop-shadow(0 0 40px rgba(249,115,22,.45))}
.lot b{display:block;font:400 58px/1.05 Anton;color:#f5efe6;margin-top:16px}.lot small{display:block;font:700 34px Inter;color:#fdba74;margin-top:8px}
.shot{display:inline-block;width:150px;height:210px;position:relative;margin-top:50px;margin-bottom:40px}
.shot:before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(255,255,255,.3),rgba(255,255,255,.08));clip-path:polygon(0 0,100% 0,88% 100%,12% 100%)}
.shot:after{content:"";position:absolute;left:12%;right:12%;bottom:5%;height:60%;background:linear-gradient(#a3e635,#4d7c0f);clip-path:polygon(0 0,100% 0,94% 100%,6% 100%);box-shadow:0 0 60px rgba(163,230,53,.7)}
.tlmg{position:absolute;left:50%;top:330px;transform:translateX(-50%);white-space:nowrap;background:#f97316;color:#1b1222;font:400 96px Anton;letter-spacing:.04em;padding:20px 60px;border-radius:999px;box-shadow:0 0 80px rgba(249,115,22,.6)}
.masc{position:absolute;left:50%;width:640px;margin-left:-320px;filter:drop-shadow(0 0 60px rgba(249,115,22,.35))}
.brand{position:absolute;left:0;right:0;text-align:center}
.brand b{display:block;font:800 92px 'Playfair Display';color:#f5efe6}.brand i{display:block;font:italic 900 52px 'Playfair Display';color:#d6cfe0;margin-top:6px}.brand em{color:#f97316}
.cta{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;font:400 120px Anton;color:#f97316;text-shadow:8px 8px 0 #3a1407}
.flash{position:absolute;inset:0;background:#fdba74;opacity:0}
.grain{position:absolute;inset:0;background:radial-gradient(130% 80% at 50% 50%,transparent 55%,rgba(0,0,0,.65));pointer-events:none}
</style></head><body><div id="v">
<svg width="0" height="0" style="position:absolute"><defs><symbol id="bat" viewBox="0 0 200 90"><path d="M100 30c-4-10-8-14-8-14s-1 8 0 13c-10-2-20 3-26 12-3-8-12-14-22-12 4 5 5 11 3 16-8-4-19-3-27 4-6 5-10 12-12 19 9-5 20-6 29-2 6 3 10 8 12 14 4-7 11-11 19-11 6 0 11 3 15 8 3-8 9-14 17-14s14 6 17 14c4-5 9-8 15-8 8 0 15 4 19 11 2-6 6-11 12-14 9-4 20-3 29 2-2-7-6-14-12-19-8-7-19-8-27-4-2-5-1-11 3-16-10-2-19 4-22 12-6-9-16-14-26-12 1-5 0-13 0-13s-4 4-8 14z"/></symbol></defs></svg>

<!-- 1 · chauves-souris + logo -->
<div class="sc" id="s1"><div class="moon" id="moon"></div><img class="logo" id="logo" src="logo.png"><div class="pres" id="pres">PRÉSENTE</div></div>
<!-- 2 · titre -->
<div class="sc" id="s2"><div class="t1 a" id="ta">TRICK OR</div><div class="t1 b" id="tb">HUÎTRE</div><div class="date" id="date">HALLOWEEN · 31 OCT → 7 NOV</div><div class="only" id="only">Un jeu, juste pour Halloween 🎃</div></div>
<!-- 3 · le jeu : on toque à une porte -->
<div class="sc" id="s3"><div class="cap" style="top:300px" id="c3">SCANNE, TOQUE<small>Choisis une porte… si t'oses</small></div><div id="doors"></div></div>
<!-- 4 · les lots -->
<div class="sc" id="s4"><div class="tlmg" id="tl">TOUT LE MONDE GAGNE</div><div id="lots"></div></div>
<!-- 5 · fin -->
<div class="sc" id="s5"><img class="masc" id="m5" src="mascotte.webp" style="top:230px"><div class="cta" id="cta" style="top:1250px">SCANNE SI T'OSES</div><div class="brand" style="top:1450px"><b>DREVICI OYSTER</b><i>8 Rue Biot, 75017 <em>Paris</em></i></div></div>
<div id="bats"></div>
<div class="flash" id="flash"></div><div class="grain"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const BAT=(id)=>`<svg class="bat" id="${id}" viewBox="0 0 200 90"><use href="#bat"/></svg>`;
// chauves-souris (intro, et vague devant les lots)
const B=[[-120,1100,1300,-8],[640,-60,640,14],[60,1280,420,-20],[720,1380,240,6],[380,520,320,10],[-60,300,260,-14],[860,900,300,18],[300,1600,360,-6]];
$('bats').innerHTML=B.map((_,i)=>BAT('b'+i)).join('')+B.map((_,i)=>BAT('w'+i)).join('');
const doorSVG=k=>`<svg viewBox="0 0 100 170" class="door" id="d${k}" style="left:${[55,390,725][k]}px;top:760px;overflow:visible"><path d="M6 168V64C6 32 28 12 50 2C72 12 94 32 94 64V168Z" fill="#2b1d3d"/><path d="M16 168V66C16 40 34 24 50 14C66 24 84 40 84 66V168Z" fill="#fde68a"/>${k===1?'<image href="mascotte.webp" x="14" y="56" width="72" height="112" preserveAspectRatio="xMidYMax meet"/>':''}<g id="leaf${k}" style="transform-origin:16px 0"><path d="M16 168V66C16 40 34 24 50 14C66 24 84 40 84 66V168Z" fill="#4a2c1c"/><path d="M50 14V168" stroke="#2b1a10" stroke-width="2"/><circle cx="42" cy="104" r="3" fill="#fdba74"/><circle cx="58" cy="104" r="3" fill="#fdba74"/><text x="50" y="62" text-anchor="middle" font-family="Anton" font-size="18" fill="#fdba74">${['I','II','III'][k]}</text></g><path d="M16 168V66C16 40 34 24 50 14C66 24 84 40 84 66V168" fill="none" stroke="#f97316" stroke-width="3"/></svg>`;
$('doors').innerHTML=[0,1,2].map(doorSVG).join('')+`<div id="tap" style="position:absolute;left:520px;top:1100px;width:90px;height:90px;border-radius:50%;border:8px solid #fff;background:rgba(255,255,255,.3);opacity:0"></div>`;
const LOTS=[['plateau.webp','PLATEAU DE 6','1 sur 50'],['trio.webp','3 HUÎTRES','1 sur 10'],['tshirt.webp','T-SHIRT','1 sur 100'],['','UN SHOT','tous les autres']];
$('lots').innerHTML=LOTS.map(([im,n,c],i)=>`<div class="lot" id="l${i}" style="left:${[90,550,90,550][i]}px;top:${[560,560,1130,1130][i]}px">${im?`<img src="${im}">`:'<span class="shot"></span>'}<b>${n}</b><small>${c}</small></div>`).join('');

// ─ outils d'animation ─
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), lin=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3), eb=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);}, ei=x=>x*x*x;
const set=(id,css)=>{const e=$(id);for(const k in css)e.style[k]=css[k];};
const vis=(id,t,a,b,fi=.18,fo=.18)=>{const o=Math.min(lin(t,a,a+fi),1-lin(t,b-fo,b));$(id).style.opacity=t<a||t>b?0:o;};

function draw(t){
  // scènes : 1 [0–1.9] · 2 [1.7–3.4] · 3 [3.2–5.3] · 4 [5.2–7.0] · 5 [6.9–8.5]
  vis('s1',t,0,1.95,.05,.25); vis('s2',t,1.75,3.45,.15,.2); vis('s3',t,3.25,5.35,.15,.15); vis('s4',t,5.25,7.0,.1,.15); vis('s5',t,6.9,8.5,.2,.01);
  // 1 · la lune se lève, les chauves-souris foncent, le logo apparaît derrière
  const m=eo(lin(t,0,.9)); set('moon',{transform:`scale(${.35+.65*m})`,opacity:.95*m});
  B.forEach(([x,y,w,r],i)=>{const p=lin(t,.15+i*.07,1.35+i*.07);const e=$('b'+i);
    e.style.cssText+=`;left:${x}px;top:${y}px;width:${w}px;height:${w*.45}px;opacity:${p>0&&p<1?Math.min(1,p*5,(1-p)*4):0};transform:translate(${(-30+120*ei(p))}%,${(40-180*ei(p))}%) scale(${.15+3.4*ei(p)}) rotate(${r+20*p}deg)`;});
  const lg=lin(t,.85,1.35); set('logo',{opacity:lg,transform:`scale(${.6+.4*eb(lg)})`});
  set('pres',{opacity:lin(t,1.1,1.4),transform:`translateY(${30*(1-eo(lin(t,1.1,1.4)))}px)`});
  // 2 · titre qui claque
  const a=lin(t,1.8,2.1),b=lin(t,1.95,2.25);
  set('ta',{transform:`scale(${2.2-1.2*eo(a)})`,opacity:a});set('tb',{transform:`scale(${2.2-1.2*eo(b)})`,opacity:b});
  set('date',{opacity:lin(t,2.3,2.55),transform:`translateX(-50%) scale(${.8+.2*eb(lin(t,2.3,2.6))})`});
  set('only',{opacity:lin(t,2.6,2.85)});
  // 3 · les portes, une brille, on toque, elle s'ouvre
  set('c3',{opacity:lin(t,3.3,3.55),transform:`translateY(${40*(1-eo(lin(t,3.3,3.6)))}px)`});
  [0,1,2].forEach(k=>{const p=lin(t,3.35+k*.08,3.7+k*.08);set('d'+k,{transform:`translateY(${120*(1-eo(p))}px)`,opacity:k!==1&&t>4.25?1-.65*lin(t,4.25,4.5):p});});
  const glow=t<4.2?Math.max(0,Math.sin((t-3.6)*6)):1;
  $('d1').style.filter=`drop-shadow(0 0 ${20+60*glow}px rgba(249,115,22,${.4+.5*glow}))`;
  const tp=lin(t,3.95,4.25); set('tap',{opacity:tp>0&&tp<1?1-tp:0,transform:`scale(${.6+tp})`});
  const kn=t>3.95&&t<4.3?Math.sin((t-3.95)*55)*6:0; $('d1').style.transform+=` translateX(${kn}px)`;
  $('leaf1').style.transform=`scaleX(${1-.88*eo(lin(t,4.35,4.95))})`;
  // la porte crache les chauves-souris (vague) → lots
  B.forEach(([x,y,w,r],i)=>{const p=lin(t,4.75+i*.04,5.65+i*.04);const e=$('w'+i);const ang=(-150+i*17)*Math.PI/180,dist=700+i*60;
    e.style.cssText+=`;left:540px;top:1000px;width:${w}px;height:${w*.45}px;margin:${-w*.225}px 0 0 ${-w/2}px;opacity:${p>0&&p<1?Math.min(1,p*6,(1-p)*3):0};transform:translate(${Math.cos(ang)*dist*p}px,${Math.sin(ang)*dist*p}px) scale(${.1+3*p}) rotate(${r}deg)`;});
  $('flash').style.opacity=t>5.15&&t<5.45?.55*(1-lin(t,5.15,5.45)):0;
  // 4 · tout le monde gagne + les 4 lots
  set('tl',{opacity:lin(t,5.3,5.5),transform:`translateX(-50%) scale(${.7+.3*eb(lin(t,5.3,5.6))})`});
  [0,1,2,3].forEach(i=>{const p=lin(t,5.5+i*.16,5.85+i*.16);set('l'+i,{opacity:p,transform:`scale(${.5+.5*eb(p)}) rotate(${(i%2?3:-3)*(1-p)}deg)`});});
  // 5 · fin
  set('m5',{opacity:lin(t,6.95,7.3),transform:`translateY(${80*(1-eo(lin(t,6.95,7.4)))}px)`});
  set('cta',{opacity:lin(t,7.2,7.4),transform:`translateX(-50%) scale(${1.6-.6*eo(lin(t,7.2,7.45))})`});
}
window.draw=draw; draw(0);
</script></body></html>
