let dragTabSrc=null;
function onDragTab(e,ti){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT') { e.preventDefault(); return; } dragTabSrc=ti; e.currentTarget.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; }
function onDropTab(e,ti){
  e.preventDefault(); e.currentTarget.classList.remove('drag-over');
  if(dragTabSrc===null||dragTabSrc===ti) return;
  const tabs=DATA.tabs;
  const [moved]=tabs.splice(dragTabSrc,1);
  tabs.splice(ti,0,moved);
  dragTabSrc=null;
  currentTabId=DATA.tabs[0]?.id;
  renderAll(); renderAdminTabDd(); renderAdminSection('__reorder');
  showToast('Ordre mis à jour');
}

// Touch drag for mobile reorder
(function(){
  let touchSrc=null, touchEl=null, ghost=null, listEl=null;
  document.addEventListener('touchstart',e=>{
    const handle=e.target.closest('.drag-handle');
    if(!handle) return;
    const card=handle.closest('[data-ti]');
    if(!card) return;
    touchSrc=parseInt(card.dataset.ti);
    touchEl=card;
    listEl=card.parentElement;
    ghost=card.cloneNode(true);
    ghost.style.cssText='position:fixed;opacity:.6;pointer-events:none;z-index:9999;width:'+card.offsetWidth+'px;background:#e8edf5;border-radius:8px;';
    document.body.appendChild(ghost);
    card.style.opacity='.3';
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(touchSrc===null) return;
    e.preventDefault();
    const t=e.touches[0];
    ghost.style.left=(t.clientX-80)+'px';
    ghost.style.top=(t.clientY-20)+'px';
    // find target
    const els=Array.from(listEl.querySelectorAll('[data-ti]'));
    els.forEach(el=>{
      const r=el.getBoundingClientRect();
      if(t.clientY>r.top&&t.clientY<r.bottom&&el!==touchEl){
        el.style.borderTop='3px solid #10285E';
      } else {
        el.style.borderTop='';
      }
    });
  },{passive:false});
  document.addEventListener('touchend',e=>{
    if(touchSrc===null) return;
    const t=e.changedTouches[0];
    const els=Array.from(listEl.querySelectorAll('[data-ti]'));
    let targetTi=null;
    els.forEach(el=>{
      el.style.borderTop='';
      const r=el.getBoundingClientRect();
      if(t.clientY>r.top&&t.clientY<r.bottom&&el!==touchEl){
        targetTi=parseInt(el.dataset.ti);
      }
    });
    if(ghost) ghost.remove();
    if(touchEl) touchEl.style.opacity='';
    if(targetTi!==null && targetTi!==touchSrc){
      const tabs=DATA.tabs;
      const [moved]=tabs.splice(touchSrc,1);
      tabs.splice(targetTi,0,moved);
      currentTabId=DATA.tabs[0]?.id;
      renderAll(); renderAdminTabDd(); renderAdminSection('__reorder');
      showToast('Ordre mis à jour');
    }
    touchSrc=null; touchEl=null; ghost=null;
  });
})();

function restoreAdminOpenSections(states){
  const body=document.getElementById('adminBody');

  const secs=body.querySelectorAll('.admin-section.collapsible');
  secs.forEach((s,i)=>{

function renderAdminSection(tid, _skipScroll){
  const body=document.getElementById('adminBody');
  // BUG FIX: every admin section (dish editing, colors, schedule, etc.)
  // used to render and stay fully usable — locally — for anyone who
  // reached this panel via ?admin=1, even with no real session. Only
  // the "Publier" button itself checked for a session. Now nothing
  // renders except the login form until there's an actual Supabase
  // session — matching how admin.html (reservations) already works.
  if(!supaSession){
    adminCurrentTab='__global';
    body.innerHTML=ghSectionHtml();
    return;
  }
  const prevStates=getAdminOpenSections();
  const prevScroll=body?body.scrollTop:0;
  adminCurrentTab=tid;
  if(tid==='__global'){
    body.innerHTML=renderAdminGlobal()+adminSaveBar();
  } else if(tid==='__social'){
    body.innerHTML=renderSocialSection()+adminSaveBar();
  } else if(tid==='__reorder'){
    body.innerHTML=renderTabReorder();
  } else if(tid==='__print'){
    body.innerHTML=`<div class="admin-section"><div class="admin-sect-body">${renderPrintBody()}</div></div>`;
  } else if(tid==='__cover'){
    body.innerHTML=renderAdminHomeCover();
  } else {
    const ti=DATA.tabs.findIndex(tb=>tb.id===tid);
    if(ti<0){body.innerHTML='';return;}
    body.innerHTML=renderAdminTab(ti);
  }
  restoreAdminOpenSections(prevStates);
  if(!_skipScroll) body.scrollTop=prevScroll;
  // bind inputs
  body.querySelectorAll('.ai[data-bind]').forEach(input=>input.addEventListener('input',()=>applyBind(input)));
  body.querySelectorAll('.ai[data-bind]').forEach(input=>input.addEventListener('change',()=>applyBind(input)));
  if(document.getElementById('pdfPreviewFrame')) setTimeout(()=>{ if(typeof updatePdfPreview==='function') updatePdfPreview(); }, 100);
}

function applyBind(input){
  const path=input.dataset.bind.split('.');
  let obj=DATA;
  for(let i=0;i<path.length-1;i++) obj=obj[path[i]];
  const key=path[path.length-1];
  if(input.type==='checkbox') obj[key]=input.checked; else obj[key]=input.value;
  renderAll();
}

function deepSet(obj,path,val){
  const parts=path.split('.');
  for(let i=0;i<parts.length-1;i++) obj=obj[parts[i]];
  obj[parts[parts.length-1]]=val;
}

let dragPinSrc=null;
// Desktop drag
function onDragPin(e,pi){ dragPinSrc=pi; e.currentTarget.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; }
function onDragPinEnd(e){ e.currentTarget.classList.remove('dragging'); document.querySelectorAll('.admin-card').forEach(el=>el.classList.remove('drag-over')); dragPinSrc=null; }
function onDragPinOver(e,pi){ if(dragPinSrc===null||dragPinSrc===pi)return; e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
function onDropPin(e,pi){
  e.preventDefault();
  document.querySelectorAll('.admin-card').forEach(el=>el.classList.remove('drag-over'));
  if(dragPinSrc===null||dragPinSrc===pi)return;
  const pins=DATA.pinnedDishes||[];
  const [moved]=pins.splice(dragPinSrc,1);
  pins.splice(pi,0,moved);
  DATA.pinnedDishes=pins;
  dragPinSrc=null;
  renderAll();
  renderAdminSection(adminCurrentTab);
}
// Touch drag for mobile pins
(function(){
  let touchPinSrc=null, touchPinY=0, touchPinEl=null;
  document.addEventListener('touchstart',function(e){
    const handle=e.target.closest('.admin-card[data-pinidx]');
    if(!handle) return;
    touchPinSrc=parseInt(handle.dataset.pinidx);
    touchPinEl=handle;
    touchPinY=e.touches[0].clientY;
    handle.classList.add('dragging');
  },{passive:true});
  document.addEventListener('touchmove',function(e){
    if(touchPinSrc===null||!touchPinEl) return;
    e.preventDefault();
    const y=e.touches[0].clientY;
    const els=document.querySelectorAll('.admin-card[data-pinidx]');
    els.forEach(el=>{
      const r=el.getBoundingClientRect();
      if(y>r.top&&y<r.bottom&&parseInt(el.dataset.pinidx)!==touchPinSrc){
        els.forEach(x=>x.classList.remove('drag-over'));
        el.classList.add('drag-over');
      }
    });
  },{passive:false});
  document.addEventListener('touchend',function(e){
    if(touchPinSrc===null) return;
    const over=document.querySelector('.admin-card[data-pinidx].drag-over');
    if(over){
      const tgt=parseInt(over.dataset.pinidx);
      const pins=DATA.pinnedDishes||[];
      const [moved]=pins.splice(touchPinSrc,1);
      pins.splice(tgt,0,moved);
      DATA.pinnedDishes=pins;
      renderAll();
      renderAdminSection(adminCurrentTab);
    }
    document.querySelectorAll('.admin-card[data-pinidx]').forEach(el=>{el.classList.remove('dragging');el.classList.remove('drag-over');});
    touchPinSrc=null; touchPinEl=null;
  });
})();

function togglePin(tabId,ci,di){
  const tb=DATA.tabs.find(t=>t.id===tabId);
  const dish=tb&&tb.cards[ci]&&tb.cards[ci].dishes&&tb.cards[ci].dishes[di];
  if(!dish) return;
  ensureDishPid(dish);
  const pins=DATA.pinnedDishes||[];
  const idx=pins.findIndex(p=>p.tabId===tabId&&p.pid===dish._pid);
  if(idx>=0){ pins.splice(idx,1); }
  else if(pins.length<4){ pins.push({tabId,pid:dish._pid}); }
  else { showToast('Maximum 4 plats à la une'); return; }
  DATA.pinnedDishes=pins;
  renderAll();
  renderAdminSection(adminCurrentTab);
}

// BUG FIX: tab ids used to be random timestamps ("tab_1782264697487"), which
// meant a tab's shareable URL (#tab_...) never matched its actual name.
// New tabs now get a slug derived from their name instead.
function slugifyTabId(label){
  const base=(label||'').toString().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'') // strip accents (é→e, etc.)
    .replace(/[^a-z0-9]+/g,'-')
    .replace(/^-+|-+$/g,'');
  return base||'tab';
}
function uniqueTabId(baseSlug, excludeTab){
  let slug=baseSlug, n=2;
  while(DATA.tabs.some(tb=>tb!==excludeTab && tb.id===slug)){ slug=baseSlug+'-'+n; n++; }
  return slug;
}
// One-time migration: any tab still carrying an old-style "tab_<timestamp>"
// id gets a proper name-based slug, with every reference to it (pins,
// current tab, last-visited tab) updated to match.
function migrateTabIds(){
  (DATA.tabs||[]).forEach(tab=>{
    if(!/^tab_\d+$/.test(tab.id)) return;
    const oldId=tab.id;
    const name=(tab.label&&(tab.label.fr||tab.label.en||Object.values(tab.label)[0]))||oldId;
    const newId=uniqueTabId(slugifyTabId(name), tab);
    tab.id=newId;
    (DATA.pinnedDishes||[]).forEach(p=>{ if(p.tabId===oldId) p.tabId=newId; });
    if(currentTabId===oldId) currentTabId=newId;
    if(sessionStorage.getItem('lastTabId')===oldId) sessionStorage.setItem('lastTabId',newId);
  });
}

// Detect client slug from URL: /menu/monrestaurant → 'monrestaurant'

// BUG FIX / ARCHITECTURE CHANGE: this used to be a GitHub personal
// access token stored in localStorage, checked synchronously everywhere
// via getToken(). Supabase Auth sessions are checked asynchronously, so
// `supaSession` is a module-level cache of the current session — set
// once at init (see checkAdminSession(), called right after the first
// render so it never delays or blanks the first paint) and refreshed on
// login/logout. Everywhere the old code did `if(!getToken())`, it now
// checks `!supaSession`.
let supaSession = null;
async function checkAdminSession(){
  if(!supabaseClient) return;
  const { data } = await supabaseClient.auth.getSession();
  supaSession = data.session || null;
  document.body.classList.toggle('is-admin', !!supaSession);
}
async function adminSignIn(email, password){
  if(!supabaseClient) return { error: { message: 'Configuration Supabase manquante' } };
  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if(!error){ supaSession = data.session; document.body.classList.add('is-admin'); }
  return { error };
}
async function adminSignOut(){
  if(supabaseClient) await supabaseClient.auth.signOut();
  supaSession = null;
  document.body.classList.remove('is-admin');
  openAdmin();
}

// ── Load the menu from Supabase (public read, no login needed) ──
async function loadFromSupabase(){
  if(!supabaseClient) return;
  try{
    const { data: row, error } = await supabaseClient
      .from('menu_data')
      .select('data')
      .eq('client_slug', CLIENT_SLUG)
      .maybeSingle();
    if(error) throw error;
    if(!row){ console.log('menu_data absent — premier lancement'); migrateTabIds(); migratePins(); return; }
    const json = row.data;
    // BUG FIX (architecture): the old GitHub version restored fields one
    // by one from a hand-maintained whitelist (see pitfall #16/#9) —
    // easy to forget a new field and have it silently fail to persist.
    // Since Supabase stores the whole DATA object as a single JSON blob
    // (exactly what publishToSupabase() writes), a straight merge covers
    // every field automatically, with no whitelist to maintain.
    Object.assign(DATA, json);
    if(Array.isArray(DATA.tabs) && DATA.tabs.length>0) DATA.tabs[0].isHome=true;
    if(Array.isArray(DATA.specials)) DATA.specials=DATA.specials.filter(s=>s.id!=='midi'&&s.id!=='soir');
    // The old "Accueil" tab (photo/video + pinned dishes) has been
    // retired — replaced by the full-screen "Page d'accueil" cover.
    // There's no more admin UI to manage it, so force it off regardless
    // of what an earlier session had saved, rather than silently
    // reviving a tab the person can no longer see or turn off.
    if(DATA.homeTab) DATA.homeTab.active=false;
    DATA.tabs=DATA.tabs.filter(t=>t.id!=='__home');
    // The "Page d'accueil" cover is now a mandatory default — there's no
    // more admin toggle for it, so force it on regardless of an earlier
    // session's saved value (e.g. from before this checkbox was removed).
    if(!DATA.homeCover) DATA.homeCover={};
    DATA.homeCover.active=true;
    migrateTabIds();
    { const hashTid=tabIdFromHash();
      currentTabId=(hashTid && DATA.tabs.some(tb=>tb.id===hashTid && tb.visible!==false)) ? hashTid : (DATA.tabs[0]?.id||'');
    }
    migratePins();
    console.log('✓ Chargé depuis Supabase — tabs:'+DATA.tabs.length+', specials actifs:'+DATA.specials.filter(s=>s.active).length+', intro:'+DATA.intro.active);
  }catch(e){
    console.warn('Supabase load failed:', e.message);
    if(supaSession) showToast('⚠️ Chargement impossible : '+e.message+' — données locales affichées');
  }
}

function buildTplHTML(id, titre, desc, extra, photo, format, textPos, textColor, overlayOpacity, opts){

  const fontDef = SOC_FONTS.find(f=>f.id===fontId)||SOC_FONTS[0];
  const fontCss = fontDef.css;
  // Sizes in em relative to 16px base; frame is ~300px preview so scale down
  const titleSz = ((opts.titleSize||36)/16).toFixed(2) + 'em';
  const descSz  = ((opts.descSize||18)/16).toFixed(2) + 'em';
  const titleW  = opts.titleBold!==false ? '700' : '400';
  const descW   = opts.descBold ? '700' : '400';
  const showBadge    = opts.showBadge !== false;
  const showLogo     = opts.showLogo !== false;
  const showHashtags = opts.showHashtags !== false;
  // Text position → CSS
  const posMap = {
    'top-left':     'top:0;left:0;align-items:flex-start;justify-content:flex-start;text-align:left',
    'top-center':   'top:0;left:0;right:0;align-items:flex-start;justify-content:center;text-align:center',
    'top-right':    'top:0;right:0;align-items:flex-start;justify-content:flex-end;text-align:right',
    'center':       'top:0;left:0;right:0;bottom:0;align-items:center;justify-content:center;text-align:center',
    'bottom-left':  'bottom:0;left:0;align-items:flex-end;justify-content:flex-start;text-align:left',
    'bottom-center':'bottom:0;left:0;right:0;align-items:flex-end;justify-content:center;text-align:center',
    'bottom-right': 'bottom:0;right:0;align-items:flex-end;justify-content:flex-end;text-align:right',
  };
  const posCSS = posMap[textPos] || posMap['bottom-left'];
  // Gradient overlay based on position
  const isTop = textPos.startsWith('top');
  const isBot = textPos.startsWith('bottom');
  const gradDir = isTop ? 'to bottom' : isBot ? 'to top' : 'to top';
  const overlayCSS = overlayOpacity > 0
    ? `linear-gradient(${gradDir}, rgba(0,0,0,${overlayOpacity/100}) 0%, rgba(0,0,0,0) 60%)`
    : 'none';
  const restName = getRestaurantName() || 'Mon Restaurant';
  const logoUrl = getRestaurantLogo() || '';
  const hs = getScheduleSummary();
  const fs = isStory ? '1.4' : '1'; // scale factor for story

  if(id === 'arrivage'){
    return `<div class="st-wrap st-bg-navy" style="padding:${isStory?'8%':'6%'};justify-content:space-between">
      <div style="display:flex;justify-content:center;padding-bottom:${isStory?'6%':'4%'}">
        <img class="st-logo" src="${logoUrl}" style="max-height:${isStory?'48px':'36px'}" onerror="this.style.display='none'">
      </div>
      ${photo?`<div style="position:relative;border-radius:10px;overflow:hidden;aspect-ratio:1;width:100%;max-height:${isStory?'45%':'50%'}"><img src="${photo}" style="width:100%;height:100%;object-fit:cover"><div style="position:absolute;inset:0;background:linear-gradient(to top,rgba(13,43,77,.6),transparent)"></div></div>`:'<div style="flex:1;background:rgba(255,255,255,.06);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:3em;opacity:.4">🍽️</div>'}
      <div style="padding-top:${isStory?'6%':'4%'}">
        <div class="st-badge" style="font-size:${isStory?'.65em':'.55em'};padding:3px 10px;border-radius:4px;margin-bottom:8px">ARRIVAGE DU JOUR</div>
        <div class="st-divider" style="margin-bottom:10px"></div>
        <div class="st-title st-gold" style="font-size:${isStory?'1.8em':'1.5em'};margin-bottom:8px">${titre||'Notre Sélection du Jour'}</div>
        <div class="st-sub" style="font-size:${isStory?'.75em':'.65em'};margin-bottom:12px">${desc||'Fraîches · Sélectionnées avec soin'}</div>
        <div class="st-hashtags" style="font-size:${isStory?'.6em':'.52em'}">#${restName.toLowerCase().replace(/[^a-z]/g,'')} #restaurant</div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding-top:${isStory?'4%':'3%'};border-top:1px solid rgba(255,255,255,.15);margin-top:${isStory?'4%':'3%'}">
        <div style="font-size:${isStory?'.6em':'.52em'};color:rgba(255,255,255,.5);font-family:'Open Sans',sans-serif">${hs}</div>
      </div>

  }

  if(id === 'plat'){

      ${photo?`<img class="st-photo" src="${photo}">
        <div style="position:absolute;inset:0;background:${overlayCSS};pointer-events:none"></div>`
        :'<div style="position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,rgba(198,162,74,.15),transparent 70%)"></div>'}
      <div style="position:absolute;inset:0;display:flex;flex-direction:column;padding:${isStory?'8%':'6%'}">
        <div style="display:flex;justify-content:flex-end">
          ${showLogo?`<img class="st-logo-sm" src="${logoUrl}" style="max-height:${isStory?'28px':'22px'}" onerror="this.style.display='none'">`:''}
        </div>
        <div style="flex:1;display:flex;flex-direction:column;justify-content:${textPos.startsWith('top')?'flex-start':textPos==='center'?'center':'flex-end'};align-items:${textPos.endsWith('right')?'flex-end':textPos.endsWith('center')||textPos==='center'?'center':'flex-start'}">
          <div>
            ${showBadge?`<div class="st-badge" style="font-size:${isStory?'.6em':'.52em'};padding:2px 8px;border-radius:3px;margin-bottom:10px">À LA CARTE</div>`:''}
            ${titre?`<div style="font-family:${fontCss};font-size:${isStory?'2em':'1.6em'};font-weight:${titleW};color:${textColor};margin-bottom:8px;line-height:1.1">${titre}</div>`:''}
            ${desc?`<div style="font-family:${fontCss};font-size:${isStory?'.75em':'.65em'};font-weight:${descW};color:${textColor};opacity:.88;margin-bottom:${extra?'12px':'0'}">${desc}</div>`:''}
            ${extra?`<div style="font-family:'Cormorant Garamond',serif;font-size:${isStory?'2em':'1.6em'};font-weight:700;color:#C6A24A;margin-bottom:8px">${extra}</div>`:''}
            ${showHashtags?`<div class="st-divider" style="margin-bottom:8px"></div><div class="st-hashtags" style="font-size:${isStory?'.6em':'.52em'}">#${restName.toLowerCase().replace(/[^a-z]/g,'')} #restaurant</div>`:''}

  if(id === 'libre'){
    const jContent=`${textPos.startsWith('top')?'flex-start':textPos==='center'?'center':'flex-end'}`;
    const aContent=`${textPos.endsWith('right')?'flex-end':textPos.endsWith('center')||textPos==='center'?'center':'flex-start'}`;
    return `<div class="st-wrap" style="position:relative;background:#111;justify-content:flex-end">
      ${photo?`<img class="st-photo" src="${photo}"><div style="position:absolute;inset:0;background:${overlayCSS};pointer-events:none"></div>`:''}
      ${showLogo?`<div style="position:absolute;top:${isStory?'6%':'5%'};right:${isStory?'6%':'5%'}"><img src="${logoUrl}" style="max-height:${isStory?'28px':'22px'};object-fit:contain" onerror="this.style.display='none'"></div>`:''}
      <div style="position:absolute;inset:0;padding:${isStory?'8%':'6%'};display:flex;flex-direction:column;justify-content:${jContent};align-items:${aContent}">
        ${titre?`<div style="font-family:${fontCss};font-weight:${titleW};font-size:${isStory?'2.2em':'1.8em'};color:${textColor};line-height:1.1;margin-bottom:10px">${titre}</div>`:''}
        ${desc?`<div style="font-family:${fontCss};font-weight:${descW};font-size:${isStory?'.9em':'.75em'};color:${textColor};opacity:.88;line-height:1.4">${desc}</div>`:''}
      </div>
    </div>`;
  }

  if(id === 'event'){
    return `<div class="st-wrap st-bg-red" style="padding:${isStory?'8%':'6%'};justify-content:space-between;align-items:center;text-align:center">
      <div>
        <img class="st-logo" src="${logoUrl}" style="max-height:${isStory?'44px':'32px'};margin:0 auto" onerror="this.style.display='none'">
      </div>
      <div>
        <div style="font-family:'Open Sans',sans-serif;font-size:${isStory?'.65em':'.55em'};letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.7);margin-bottom:12px">ÉVÉNEMENT</div>
        <div class="st-title" style="font-size:${isStory?'2em':'1.7em'};margin-bottom:16px">${titre||'Soirée Spéciale'}</div>
        ${extra?`<div class="st-badge" style="font-size:${isStory?'.75em':'.65em'};padding:6px 16px;border-radius:20px;margin-bottom:14px">${extra}</div>`:''}
        <div class="st-divider" style="margin:0 auto 14px"></div>
        <div class="st-sub" style="font-size:${isStory?'.75em':'.65em'}">${desc||'Une soirée unique au cœur de Paris'}</div>
      </div>
      <div style="text-align:center">
        <div style="font-size:${isStory?'.6em':'.52em'};color:rgba(255,255,255,.6);font-family:'Open Sans',sans-serif;margin-bottom:4px">${restName}</div>
        <div class="st-hashtags" style="font-size:${isStory?'.58em':'.5em'}">#${restName.toLowerCase().replace(/[^a-z]/g,'')} #evenement</div>

  return `<div class="st-wrap st-bg-navy" style="padding:${isStory?'8%':'6%'};justify-content:center;align-items:center;text-align:center">

      <img class="st-logo" src="${logoUrl}" style="max-height:${isStory?'52px':'40px'};margin:0 auto ${isStory?'10%':'8%'}" onerror="this.style.display='none'">
      <div class="st-divider" style="margin:0 auto ${isStory?'8%':'6%'}"></div>
      <div class="st-title" style="font-size:${isStory?'1.7em':'1.4em'};margin-bottom:${isStory?'6%':'5%'}">${titre||'Information importante'}</div>
      <div class="st-sub" style="font-size:${isStory?'.8em':'.68em'};margin-bottom:${isStory?'8%':'6%'}">${desc||'Nous vous informons de...'}</div>
      <div class="st-divider" style="margin:0 auto ${isStory?'6%':'5%'}"></div>
      <div style="font-size:${isStory?'.62em':'.54em'};color:rgba(255,255,255,.5);font-family:'Open Sans',sans-serif;line-height:1.6">${hs}<br>${restName}</div>

function getScheduleSummary(){
  const sch = DATA.schedule||[];
  const open = sch.filter(d=>(d.services||[]).length>0||(d.open!=null));
  if(!open.length) return '';
  const names = open.map(d=>d.day.substring(0,3)).join(' · ');
  const firstSvc = (open[0].services||[])[0] || open[0];
  if(!firstSvc||firstSvc.open==null) return '';
  return `${names} · ${firstSvc.open}h – ${firstSvc.close>12?firstSvc.close-24||firstSvc.close:firstSvc.close}h`;
}

function buildCaption(){
  const s = socState;
  const restName = getRestaurantName() || 'Mon Restaurant';
  const hs = getScheduleSummary();
  const hashtags = '#'+restName.toLowerCase().replace(/[^a-z]/g,'')+' #restaurant';

  if(!s.titre && !s.desc) return '← Remplissez le titre et la description pour générer la caption.';

  if(s.tplId === 'arrivage'){
    return `✨ ${s.titre||'Arrivage du jour'}

${s.desc||''}

Sélectionné avec soin et livré frais le jour même.

📍 ${restName} · Paris
🕐 ${hs||'Voir nos horaires'}
📩 Réservation via le lien en bio

${hashtags}`;
  }
  if(s.tplId === 'plat'){
    return `✨ ${s.titre||'À la carte'}${s.extra?' — '+s.extra:''}

${s.desc||''}

Découvrez notre sélection du moment, préparée avec des produits frais.

📍 ${restName} · Paris
🕐 ${hs||'Voir nos horaires'}
🔗 Réservez via le lien en bio

${hashtags}`;
  }
  if(s.tplId === 'event'){
    const extraLine = s.extra ? '\u{1F4C5} '+s.extra+'\n' : '';
    return `\u{1F389} ${s.titre||'\u00C9v\u00E9nement'}\n${extraLine}\n${s.desc||''}\n\nR\u00E9servez vite votre table \u2014 places limit\u00E9es !\n\n\u{1F4CD} ${restName} \u00B7 Paris\n\u{1F517} Lien en bio\n\n${hashtags} #evenement #soireeparis`;
  }
  return `ℹ️ ${s.titre||'Information'}

${s.desc||''}

Merci de votre compréhension. Nous avons hâte de vous retrouver !

📍 ${restName} · Paris
🕐 ${hs||'Voir nos horaires'}

${hashtags}

—
By @TensaiAgency · @Willichiban`;
}

function socPickDish(val){
  if(!val){ socState.selectedDish=null; renderAdminSection('__social'); return; }
  try {
    const d = JSON.parse(decodeURIComponent(val));
    socState.selectedDish = d;
    socState.titre = d.name || '';
    socState.desc = d.desc || '';
    socState.caption = d.caption || '';
    // Use first gallery image if available, else main img
    const gallery = d.gallery ? d.gallery.filter(Boolean) : [];
    socState.photo = gallery[0] || d.img || '';
    socState.galleryIdx = 0;
    renderAdminSection('__social');
  } catch(e){}
}

function socPickTpl(id){
  socState.tplId = id;
  socState.extra = '';
  renderAdminSection('__social');
}

function socLoadFile(input){
  if(!input.files||!input.files[0]) return;
  compressImageFile(input.files[0], {ratio:9/16, maxDim:1080}).then(dataUrl => {
    socState.photo = dataUrl;
    renderSocPreview();
  }).catch(e => showToast('⚠️ '+e.message));
}

function renderSocPreview(){
  const frame = document.getElementById('socFrame');
  const cap   = document.getElementById('socCaption');
  if(frame){
    frame.className = 'soc-frame ratio-'+(socState.format==='story'?'916':'34');
    frame.innerHTML = buildTplHTML(socState.tplId, socState.titre, socState.desc, socState.extra, socState.photo, socState.format, socState.textPos, socState.textColor, socState.overlayOpacity, socState);
  }
  if(cap) cap.textContent = buildCaption();
}

function downloadSocImg(fmt){
  const s = socState;
  const prevFmt = s.format;
  s.format = fmt;

  const size = fmt==='story' ? {w:1080,h:1920} : {w:1080,h:1350};

  // Render at preview size (matches the visible frame) then scale up
  // Preview frame is ~800px wide max, we render at that width and scale to 1080
  const renderW = fmt==='story' ? 405 : 400; // 9:16 → 405×720, 1:1 → 400×400
  const renderH = fmt==='story' ? 720 : 400;
  const scaleF  = size.w / renderW; // ~2.7x → produces 1080px output

  const div = document.createElement('div');
  div.style.cssText = `position:fixed;left:-9999px;top:0;width:${renderW}px;height:${renderH}px;overflow:hidden;z-index:-1;font-size:16px`;
  div.innerHTML = buildTplHTML(s.tplId, s.titre, s.desc, s.extra, s.photo, fmt, s.textPos, s.textColor, s.overlayOpacity, s);
  document.body.appendChild(div);

  if(typeof html2canvas !== 'undefined'){
    showToast('Export en cours…');
    // Pre-load images as blob to bypass CORS, then render
    async function loadImgAsBlob(url){
      try {
        const r=await fetch(url,{mode:'cors'}); const b=await r.blob();
        return URL.createObjectURL(b);
      } catch(e){ return url; }
    }
    const imgEl=div.querySelector('img[src]:not([src=""])');
    const imgSrc=imgEl?.src||'';
    (imgSrc ? loadImgAsBlob(imgSrc) : Promise.resolve('')).then(blobUrl=>{
      if(blobUrl&&imgEl) imgEl.src=blobUrl;
      return html2canvas(div, {
        width: renderW,
        height: renderH,
        scale: scaleF,
        useCORS: true,
        allowTaint: true,
        logging: false,
        onclone: (cloneDoc)=>{
          // ensure fonts are loaded in clone
          const s=cloneDoc.createElement('link');
          s.href='https://fonts.googleapis.com/css2?family=Open+Sans+Condensed:wght@300;700&family=Playfair+Display:ital,wght@0,400;0,700&family=Jost:wght@400;700&display=swap';
          s.rel='stylesheet'; cloneDoc.head.appendChild(s);
        }
      });
    }).then(canvas=>{
      const a = document.createElement('a');
      a.href = canvas.toDataURL('image/png');
      a.download = `${CLIENT_SLUG}-${s.tplId}-${fmt}.png`;
      a.click();
      document.body.removeChild(div);
      s.format = prevFmt;
      showToast('Image exportée !');
    }).catch((e)=>{ console.error(e); document.body.removeChild(div); s.format=prevFmt; showToast('Erreur export — vérifiez les images CORS'); });
  } else {
    document.body.removeChild(div);
    s.format = prevFmt;
    showToast('⚠ html2canvas non chargé');
  }
}

function exportTabCSV(tabId){
  const tab = tabId === '__all'
    ? null
    : DATA.tabs.find(tb => tb.id === tabId);
  const tabs = tab ? [tab] : DATA.tabs;
  const rows = [['Onglet','Carte','Nom','Description','Prix','Informations alimentaires']];
  tabs.forEach(tb => {
    tb.cards.forEach(card => {
      const cardLabel = t(card.label) || '';
      const tabLabel  = t(tb.label)  || '';
      if(card.dishes){
        card.dishes.forEach(d => {
          rows.push([
            tabLabel, cardLabel,
            t(d.name)||'', t(d.desc)||'', d.price||'',
            badgeLabels(d).join(', ')
          ]);
        });
      } else if(card.type==='variants'){
        (card.variants||[]).forEach(v => {
          rows.push([tabLabel, cardLabel, t(v.name)||'', '', v.price||'','']);
        });
      } else if(card.type==='bevs'){
        (card.items||[]).forEach(item => {
          const sizes = (item.sizes||[]).map(s=>bevSizeLabel(s)+' '+s.price+'€').join(' / ');
          rows.push([tabLabel, cardLabel, t(item.name)||'', t(item.desc)||'', sizes||item.price||'', '']);
        });
      }
    });
  });
  const csv = rows.map(r => r.map(v => '"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
  const bom  = '﻿';
  const blob = new Blob([bom+csv], {type:'text/csv;charset=utf-8;'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  const name = tab ? t(tab.label).toLowerCase().replace(/\s+/g,'-') : 'menu-complet';
  a.href=url; a.download='menu-'+name+'.csv'; a.click();
  URL.revokeObjectURL(url);
  showToast('CSV exporté — '+rows.length+' lignes');
}

  return {
    template: d.template || 'maritime',          // 'classic' | 'maritime'
    titleColor: d.titleColor || '#10285E',
    accentColor: d.accentColor || '#C6A24A',
    showLogo: d.showLogo !== false,
    showIcons: d.showIcons !== false,
    bgColor: d.bgColor || '#FFFDF8',
    logoData: d.logoData || '',
    footerAddress: d.footerAddress || (DATA.address ? [DATA.address.street,DATA.address.zip,DATA.address.city].filter(Boolean).join(', ') : '') || '',
    footerPhone: d.footerPhone || (DATA.address&&DATA.address.phone) || '',
    footerShowDate: d.footerShowDate !== false,
    format: d.format || 'a4',                    // 'a4' | 'gbiz'

  };
}
function setPdfCfg(key, val){
  if(!DATA.pdfStyle) DATA.pdfStyle = {};

// Build the inner menu HTML (shared by preview + export)
function buildPdfMenuHTML(cfg){
  const restName = getRestaurantName() || 'Menu';
  // Logo: PDF-specific upload > restaurant logo already stored > nothing
  const logoUrl = (DATA.pdfStyle && DATA.pdfStyle.logoData) || getRestaurantLogo() || '';
  let h = '';

  // Header
  const icData = DATA.icones||{};
  const showMainIc = cfg.showIcons!==false && icData.main && !cfg.showLogo;
  const showSecIc  = cfg.showIcons!==false && !!icData.secondary;
  h += `<div class="pdf-header">`;
  if(cfg.showLogo && logoUrl) h += `<img src="${logoUrl}" class="pdf-logo" onerror="this.style.display='none'">`;
  else if(cfg.showLogo && !logoUrl) h += `<div class="pdf-logo-text">${getRestaurantName()||''}</div>`;
  h += `<h1 class="pdf-title">${restName}</h1>`;
  if(DATA.heroActive && DATA.hero) h += `<div class="pdf-sub">${t(DATA.hero)}</div>`;
  if(showMainIc) h += `<img src="${icData.main}" style="width:48px;height:48px;object-fit:contain;margin:10px auto 0;display:block" onerror="this.style.display='none'">`;
  if(cfg.template === 'maritime') h += `<div class="pdf-deco-divider">${PDF_SVG.waves}</div>`;
  h += `</div>`;

  // Tabs / sections
  DATA.tabs.filter(tb=>tb.id!=='__home' && tb.visible!==false).forEach(tb=>{
    h += `<div class="pdf-section">`;
    h += `<h2 class="pdf-cat">`;
    if(showSecIc) h += `<img src="${icData.secondary}" style="width:16px;height:16px;object-fit:contain;vertical-align:middle;margin-right:6px" onerror="this.remove()">`;
    else if(cfg.template === 'maritime') h += `<span class="pdf-cat-icon">${PDF_SVG.oyster}</span>`;
    h += `${t(tb.label)}</h2>`;
    tb.cards.forEach(card=>{
      if(t(card.label) && tb.cards.length>1) h += `<h3 class="pdf-subcat">${t(card.label)}</h3>`;
      const rows = [];
      if(card.dishes){
        card.dishes.filter(d=>!d.hidden).forEach(d=>{
          rows.push(`<div class="pdf-dish"><div class="pdf-dish-line"><span class="pdf-dish-name">${t(d.name)||''}</span><span class="pdf-dots"></span><span class="pdf-dish-price">${d.price||''}</span></div>${t(d.desc)?`<div class="pdf-dish-desc">${t(d.desc)}</div>`:''}</div>`);
        });
      } else if(card.type==='variants'){
        (card.variants||[]).filter(v=>!v.hidden).forEach(v=>{
          rows.push(`<div class="pdf-dish"><div class="pdf-dish-line"><span class="pdf-dish-name">${t(v.name)||''}</span><span class="pdf-dots"></span><span class="pdf-dish-price">${v.price||''}</span></div></div>`);
        });
      } else if(card.type==='bevs'){
        (card.items||[]).filter(item=>!item.hidden).forEach(item=>{
          const sizes=(item.sizes||[]).map(s=>bevSizeLabel(s)+' — '+s.price+'€').join(' · ');
          rows.push(`<div class="pdf-dish"><div class="pdf-dish-line"><span class="pdf-dish-name">${t(item.name)||''}</span><span class="pdf-dots"></span><span class="pdf-dish-price">${sizes||item.price||''}</span></div>${t(item.desc)?`<div class="pdf-dish-desc">${t(item.desc)}</div>`:''}</div>`);
        });
      }
      h += rows.join('');
    });
    h += `</div>`;
  });

  // Footer
  const footerBits = [];
  if(cfg.footerAddress) footerBits.push(cfg.footerAddress);
  if(cfg.footerPhone) footerBits.push(cfg.footerPhone);
  if(cfg.footerShowDate){
    const now = new Date();
    footerBits.push('Mis à jour le ' + now.toLocaleDateString('fr-FR'));
  }
  if(footerBits.length || cfg.template==='maritime'){
    h += `<div class="pdf-footer">`;
    if(cfg.template === 'maritime') h += `<div class="pdf-deco-anchor">${PDF_SVG.anchor}</div>`;
    if(footerBits.length) h += `<div class="pdf-footer-text">${footerBits.join('  ·  ')}</div>`;
    h += `</div>`;
  }
  return h;
}

// CSS for a given config + format
function buildPdfCSS(cfg){
  const isGbiz = cfg.format === 'gbiz';
  const isA5 = !isGbiz && cfg.paperSize === 'a5';
  // A4 ~ 794px wide @96dpi; Google Business 3064x5447 → we render preview at scaled width.
  // A5 is exactly half of A4 (cut along the long edge) — scaling every
  // A4 dimension down by the same ratio keeps proportions (and the
  // design itself) identical, just smaller, rather than needing a
  // separate set of hand-tuned numbers to keep in sync.
  const A5_SCALE = 0.72;
  const scale = isGbiz ? 1 : (isA5 ? A5_SCALE : 1);
  const px = v => Math.round(v*scale*100)/100;
  const pageW = isGbiz ? 612 : px(700);   // preview px width (gbiz is portrait 9:16-ish)
  const pad = isGbiz ? 70 : px(40);
  const maritime = cfg.template === 'maritime';
  return `
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Open+Sans:wght@300;400;600&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  /* BUG FIX: without this, browsers print backgrounds/colors differently
     from what's shown on screen by default (usually to save ink) — this
     is exactly what made the live preview and the actual printed/PDF
     output look different (background color, accent yellow, etc.). This
     forces the print output to reproduce colors exactly as configured,
     so the two always match — one standard recipe, no per-client tweaking. */

// Live preview into the admin iframe
function updatePdfPreview(){
  const frame = document.getElementById('pdfPreviewFrame');
  if(!frame) return;
  const cfg = pdfCfg();
  const css = buildPdfCSS(cfg);
  const menu = buildPdfMenuHTML(cfg);
  const isGbiz = cfg.format === 'gbiz';
  // For A4: overlay page-break guides every ~1040px (A4 ratio at 700px width)
  const doc = `<!DOCTYPE html><html><head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans+Condensed:wght@300;700&family=Lovelo:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet"><meta charset="UTF-8"><style>${css}
    body{background:#e8e8e8;padding:16px 0;margin:0}
    .pdf-page{box-shadow:0 2px 12px rgba(0,0,0,.15)}
    ${!isGbiz?`.pdf-page{position:relative}`:''}
  </style></head><body><div class="pdf-page" id="pdfPageEl">${menu}</div>
  <script>
    // Draw page-break guide lines for A4 so user sees where pages cut
    (function(){
      var isGbiz=${isGbiz};
      if(isGbiz) return;
      var page=document.getElementById('pdfPageEl');
      var w=page.offsetWidth;
      var pageH=Math.round(w*297/210); // A4 ratio
      var total=page.offsetHeight;
      var n=Math.floor(total/pageH);
      for(var i=1;i<=n;i++){
        var line=document.createElement('div');
        line.style.cssText='position:absolute;left:0;right:0;top:'+(i*pageH)+'px;border-top:2px dashed #d33;z-index:99;pointer-events:none';
        var lbl=document.createElement('div');

        lbl.style.cssText='position:absolute;right:6px;top:'+(i*pageH+2)+'px;font:10px sans-serif;color:#d33;background:#fff;padding:1px 5px;z-index:100';
        page.appendChild(line);page.appendChild(lbl);
      }
    })();
  <\/script>
  </body></html>`;
  frame.srcdoc = doc;
}

function exportA4Print(cfg){
  const css = buildPdfCSS(cfg);
  const menu = buildPdfMenuHTML(cfg);
  const restName = getRestaurantName() || 'Menu';
  const doc = `<!DOCTYPE html><html><head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans+Condensed:wght@300;700&family=Lovelo:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet"><meta charset="UTF-8"><title>${restName}</title><style>${css}</style></head><body><div class="pdf-page">${menu}</div></body></html>`;
  // BUG FIX: this used to open a blank window and fill it via
  // document.write() — increasingly restricted by modern browsers
  // (Safari in particular), which can silently leave the new tab blank
  // or refuse the popup outright. A Blob URL opened directly gives the
  // new tab a real, complete document from the start — no write-after-
  // open step for the browser to interfere with.
  const blob = new Blob([doc], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const win = window.open(url, '_blank');
  if(!win){ showToast('⚠️ Le navigateur a bloqué la fenêtre — autorise les pop-ups pour ce site'); return; }
  setTimeout(()=>{ win.print(); URL.revokeObjectURL(url); }, 600);
}

function exportGbizImage(cfg){
  if(typeof html2canvas === 'undefined'){ showToast('⚠ html2canvas non chargé'); return; }
  showToast('Génération image en cours…');
  // Render off-screen at preview width, then scale to 3064px wide
  const css = buildPdfCSS(cfg);
  const menu = buildPdfMenuHTML(cfg);
  const holder = document.createElement('div');
  holder.style.cssText = 'position:fixed;left:-99999px;top:0;';
  holder.innerHTML = `<style>${css}</style><div class="pdf-page" id="gbizPage">${menu}</div>`;
  document.body.appendChild(holder);
  const pageEl = holder.querySelector('#gbizPage');
  const previewW = pageEl.offsetWidth || 612;
  const TARGET_W = 3064;
  const scale = TARGET_W / previewW;
  setTimeout(()=>{
    html2canvas(pageEl, { scale: scale, useCORS: true, backgroundColor: cfg.template==='maritime'?'#fdfbf6':'#ffffff', logging:false })
      .then(canvas => {
        document.body.removeChild(holder);
        const link = document.createElement('a');
        link.download = (getRestaurantName()||'menu').replace(/\s+/g,'-').toLowerCase() + '-google-business.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
        showToast('Image Google Business téléchargée');
      })
      .catch(err => {
        document.body.removeChild(holder);
        console.error(err);
        showToast('⚠ Erreur génération image');
      });
  }, 400);
}

async function publishToSupabase(){
  if(!supaSession){ showToast('⚠️ Connecte-toi pour publier'); renderAdminSection('__global'); return; }
  // NOTE: this used to target a second, redundant "Publier" button
  // (🚀, inside the collapsible "Connexion admin" section) — removed
  // since every admin tab already ends with its own adminSaveBar()
  // "Publier" button; the loading state now lives on that one instead.
  const btn=document.getElementById('mainPublishBtn');
  if(btn){ btn.textContent='⏳ Publication…'; btn.disabled=true; }
  try{
    // Deep-clone DATA so we publish a clean snapshot, same as before.
    const clean=JSON.parse(JSON.stringify(DATA));
    // Same oversized-payload guard as the old GitHub version — a menu
    // bloated with embedded base64 photos is still worth catching early
    // with a clear message rather than a cryptic network error.
    const MAX_PAYLOAD_MB = 20;
    const approxBytes=new TextEncoder().encode(JSON.stringify(clean)).length;
    if(approxBytes > MAX_PAYLOAD_MB*1024*1024){
      throw new Error('Menu trop volumineux ('+(approxBytes/1024/1024).toFixed(1)+' Mo) — remplacez certaines photos par des URLs externes au lieu d\'uploads pour réduire la taille');
    }
    // BUG FIX (architecture): the old GitHub version needed a fresh SHA
    // before every write, with retry-on-conflict logic (see pitfall
    // about SHA races). Postgres upsert handles create-or-update
    // atomically — no SHA, no conflict retries needed at all.
    const { error }=await supabaseClient
      .from('menu_data')
      .upsert({ client_slug: CLIENT_SLUG, data: clean, updated_at: new Date().toISOString() }, { onConflict: 'client_slug' });
    if(error) throw error;
    showToast('✅ Publié !');
  }catch(e){
    console.error('Publish error:',e);
    showToast('❌ '+e.message);
  }finally{
    if(btn){ btn.textContent='Publier'; btn.disabled=false; }
  }
}

// BUG FIX: these four functions used to read/write
// localStorage.getItem/setItem('restaurant_name' / 'restaurant_logo')
// directly — completely disconnected from DATA.restaurantName /
// DATA.restaurantLogo, which are the fields actually restored from and
// published to menu.json (see loadFromGitHub()). That meant a name or
// logo set in the admin only ever lived in that one browser's
// localStorage: never published, never seen by a real customer, and
// silently reverting to a hardcoded fallback for anyone else — including
// the same admin in a different browser or incognito window. This is
// also why the name could appear in different casing between "admin"
// and "public": they were really two entirely separate values, not a
// styling difference.
function getRestaurantName(){ return DATA.restaurantName||'Mon Restaurant'; }
function getRestaurantLogo(){ return DATA.restaurantLogo||''; }
function setRestaurantName(v){ DATA.restaurantName=v; applyRestaurantBranding(); }
function setRestaurantLogo(v){ DATA.restaurantLogo=v; applyRestaurantBranding(); }
function applyRestaurantBranding(){
  applyBrandColors();
  // BUG FIX: setRestoFont() only ever set this CSS var live, in-session,
  // when the admin dropdown fired onchange. Nothing re-applied it from
  // DATA.restoFont on a fresh load, so the font change appeared to "work"
  // only in that same browser tab and was lost on any other device/reload
  // even though DATA.restoFont was saved correctly. Re-apply it here since
  // this runs on every renderAll() and at init.
  if(DATA.restoFont) document.documentElement.style.setProperty('--restoFont', "'"+DATA.restoFont+"'");
  // BUG FIX (part 2): setting the CSS var alone means nothing if a
  // regular visitor's browser never actually downloaded that font's
  // file — only the admin's own tab did, at the moment they picked it
  // (see setRestoFont/setCoverHeadlineFont). Anyone else just silently
  // fell back to a generic font. Load both chosen fonts here too, on
  // every visit, not only when explicitly picked in this session.
  [DATA.restoFont, DATA.homeCover&&DATA.homeCover.headlineFont].forEach(font=>{
    if(font && !document.querySelector('link[data-font="'+font+'"]')){
      const l=document.createElement('link');
      l.rel='stylesheet';
      l.dataset.font=font;
      l.href='https://fonts.googleapis.com/css2?family='+encodeURIComponent(font)+':wght@400;700&display=swap';
      document.head.appendChild(l);
    }
  });
  const name=getRestaurantName();
  const logoEl=document.querySelector('.logo-img');
  const textEl=document.getElementById('logoText');
  // The menu's own header always shows the restaurant name as styled
  // text (in the chosen font) — never the uploaded logo image. That
  // logo is still used elsewhere (PDF export, social templates), just
  // not here.
  if(logoEl) logoEl.style.display='none';
  if(textEl){ textEl.style.display='block'; textEl.textContent=name||'Mon Restaurant'; }
  document.title=(name||'Menu')+' — Menu';
}

function applyBrandColors(){
  const bc=DATA.brandColors||{};
  const root=document.documentElement;
  if(bc.primary) root.style.setProperty('--navy',bc.primary);
  if(bc.accent)  root.style.setProperty('--gold',bc.accent);
  if(bc.bg)      root.style.setProperty('--bg',bc.bg);
  if(bc.tabInactive) root.style.setProperty('--tabInactiveColor',bc.tabInactive);
  // Keep the browser/status-bar tint (iOS/Android) in sync with the header
  // color so it never falls back to showing --bg above the header. Read
  // the resolved --navy value (not just bc.primary) so this also self-heals
  // if --navy was set some other way.
  const themeMeta=document.getElementById('themeColorMeta');
  if(themeMeta){
    const primary=bc.primary||getComputedStyle(root).getPropertyValue('--navy').trim();
    if(primary) themeMeta.setAttribute('content',primary);
  }
}

function resetBrandColors(){
  DATA.brandColors={primary:'#10285E',accent:'#C6A24A',bg:'#F7F5F0',subtitle:'#E6E6E6',tabInactive:'#B3B3B3'};
  applyBrandColors();
  renderAdminSection(adminCurrentTab);
}

// Shared list of selectable Google Fonts — used by both the dropdown
// and the "view all fonts" gallery below, so there's only one place to
// add/remove a font. Trimmed the most generic/overlapping sans-serifs
// (many look near-identical at a glance) in favor of more distinctive,
// characterful options — scripts, display faces, slab serifs — so the
// gallery is actually useful for telling fonts apart quickly.
const FONT_LIST = ["Jost", "Montserrat", "Oswald", "Raleway", "Poppins", "Merriweather", "Playfair Display", "Libre Baskerville", "Josefin Sans", "Quicksand", "Inter", "Cormorant Garamond", "EB Garamond", "Spectral", "Source Serif Pro", "Bitter", "Dancing Script", "Pacifico", "Lobster", "Satisfy", "Abril Fatface", "Bebas Neue", "Anton", "Righteous", "Cinzel", "Teko", "Fraunces", "DM Serif Display", "Prata", "Marcellus", "Bodoni Moda", "Yeseva One", "Italiana", "Cinzel Decorative", "Great Vibes", "Tangerine", "Sacramento", "Yellowtail", "Grand Hotel", "Kaushan Script", "Caveat", "Amatic SC", "Permanent Marker", "Fredoka", "Comfortaa", "Baloo 2", "Alfa Slab One", "Passion One", "Bungee", "Monoton", "Fjalla One"];
// Picking a font from a native <select> means comparing them one at a
// time from memory — hard to judge 50 options that way. This opens a
// popup that loads every font at once and shows the restaurant's own
// name (or "Restaurant" as a fallback) set in each of them side by
// side, so they can actually be compared at a glance.
function showFontGallery(target){
  target=target||'resto';
  // Google Fonts supports combining every family into one request —
  // load them all in a single <link> rather than 50 separate ones.
  if(!document.querySelector('link[data-font-gallery]')){
    const l=document.createElement('link');
    l.rel='stylesheet';
    l.dataset.fontGallery='1';
    l.href='https://fonts.googleapis.com/css2?'+FONT_LIST.map(f=>'family='+encodeURIComponent(f)+':wght@400;700').join('&')+'&display=swap';
    document.head.appendChild(l);
  }
  const sampleText = (DATA.restaurantName||'Restaurant');
  const setterFn = target==='cover' ? 'setCoverHeadlineFont' : 'setRestoFont';
  const rows = FONT_LIST.map(f=>`<div class="font-gallery-row" onclick="${setterFn}('${f.replace(/'/g,"\\'")}');closeFontGallery()">
    <div class="font-gallery-name">${f}</div>
    <div class="font-gallery-sample" style="font-family:'${f}',serif">${escapeHtmlLocal(sampleText)}</div>
  </div>`).join('');
  const modal=document.createElement('div');
  modal.className='font-gallery-overlay';
  modal.id='fontGalleryOverlay';
  modal.innerHTML=`<div class="font-gallery-card">
    <div class="font-gallery-hdr"><span>Choisir une police</span><button type="button" class="lb-close" style="position:static;color:var(--text)" onclick="closeFontGallery()">✕</button></div>
    <div class="font-gallery-list">${rows}</div>
  </div>`;
  modal.addEventListener('click', e=>{ if(e.target===modal) closeFontGallery(); });
  document.body.appendChild(modal);
  document.body.style.overflow='hidden';
}
function closeFontGallery(){
  const el=document.getElementById('fontGalleryOverlay');
  if(el) el.remove();
  document.body.style.overflow='';
}
function setRestoFont(font){
  DATA.restoFont = font;
  document.documentElement.style.setProperty('--restoFont', "'"+font+"'");
  // Load font from Google if not already loaded
  if(font && !document.querySelector('link[data-font="'+font+'"]')){
    const l=document.createElement('link');
    l.rel='stylesheet';
    l.dataset.font=font;
    l.href='https://fonts.googleapis.com/css2?family='+encodeURIComponent(font)+':wght@400;700&display=swap';
    document.head.appendChild(l);
  }
  // Update preview
  const box=document.getElementById('fontPreviewBox');
  if(box) box.querySelectorAll('div').forEach(el=>el.style.fontFamily="'"+font+"',serif");
  renderAll();
}
// Independent from the site-wide font (setRestoFont/DATA.restoFont) —
// this one only affects the cover's own headline text, which stays the
// same regardless of whether Photo or Vidéo is picked as the background
// media (it's not tied to either mode).
function setCoverHeadlineFont(font){
  if(!DATA.homeCover) DATA.homeCover={};
  DATA.homeCover.headlineFont=font;
  if(font && !document.querySelector('link[data-font="'+font+'"]')){
    const l=document.createElement('link');
    l.rel='stylesheet';
    l.dataset.font=font;
    l.href='https://fonts.googleapis.com/css2?family='+encodeURIComponent(font)+':wght@400;700&display=swap';
    document.head.appendChild(l);
  }
  renderAll();
  renderAdminSection('__cover');
  scheduleCoverAutoSave();
}

function fetchCityFromZip(zip){
  if(!zip||zip.length!==5) return;
  fetch('https://geo.api.gouv.fr/communes?codePostal='+zip+'&fields=nom&limit=1')
    .then(r=>r.json())
    .then(data=>{
      if(data&&data.length){
        if(!DATA.address) DATA.address={};
        DATA.address.city=data[0].nom;
        const cityEl=document.getElementById('cityInput');
        if(cityEl) cityEl.value=data[0].nom;
        renderAll();
      }
    })
    .catch(()=>{}); // if no internet, user types manually
}

function entityGalleryHtml(ti,ci,idx,kind,gallery){
  gallery=gallery||[];
  const base=`DATA.tabs[${ti}].cards[${ci}].${kind}[${idx}]`;
  let h='<div class="af"><label class="al" style="font-size:11px;font-weight:600;color:var(--text2)">Galerie réseaux sociaux (1–4 photos)</label>';
  // Thumbnail strip — clickable previews of filled slots
  const filled=gallery.filter(Boolean);
  if(filled.length){
    h+='<div style="display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap">';
    for(let gi=0;gi<4;gi++){
      const img=gallery[gi]||'';
      if(img){
        h+=`<div style="position:relative;width:60px;height:60px;border-radius:8px;overflow:hidden;border:2px solid var(--gold)">
          <img src="${img}" style="width:100%;height:100%;object-fit:cover">
          <span style="position:absolute;top:1px;left:3px;font-size:9px;color:#fff;font-weight:700;text-shadow:0 1px 3px #000">${gi+1}</span>
        </div>`;
      }
    }
    h+='</div>';
  }
  // Upload slots
  h+='<div style="display:flex;flex-direction:column;gap:8px">';
  for(let gi=0;gi<4;gi++){
    const val=gallery[gi]||'';
    const cb=`if(!${base}.gallery)${base}.gallery=[];${base}.gallery[${gi}]=this.value;renderAll()`;
    h+=`<div style="display:flex;align-items:flex-start;gap:6px">
      <span style="font-size:10px;color:var(--text3);min-width:14px;text-align:center;padding-top:10px;flex:none">${gi+1}</span>`
      +imgFieldHtml(val,cb,`Photo ${gi+1} — URL ou upload`,9/16)
      +(val?`<button onclick="${base}.gallery[${gi}]='';renderAll();renderAdminSection(DATA.tabs[${ti}].id)" style="padding:4px 8px;font-size:11px;border:1px solid #fca5a5;border-radius:4px;color:#c62828;background:#fff;cursor:pointer;white-space:nowrap;align-self:center;flex:none">✕</button>`:'')
      +`</div>`;
  }
  h+='</div></div>';
  return h;
}

function imgFieldHtml(val, onchangeJs, placeholder, ratio=1){
  const previewStyle = val ? '' : 'display:none';
  // oninput = the SAME inline save+render that name/price use, then a clean preview sync call
  const handler = onchangeJs + ';syncImgPreview(this)';
  return `<div class="af"><div class="ai-img-wrap"><input class="ai" value="${val||''}" placeholder="${placeholder||'Image URL'}" oninput="${handler}"><label class="ai-upload-btn" title="Uploader une image"><input type="file" accept="image/*" style="display:none" onchange="uploadImgFile(this,${ratio===null?'null':ratio})"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 16 12 12 8 16"></polyline><line x1="12" y1="12" x2="12" y2="21"></line><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"></path></svg></label></div><img class="ai-img-preview" src="${val||''}" style="${previewStyle};width:100%;max-width:120px;aspect-ratio:1;object-fit:cover;border-radius:6px;margin-top:6px;border:1px solid var(--border)" onerror="this.style.display='none'"></div>`;
}

function syncImgPreview(input){
  const wrap = input.closest('.ai-img-wrap');
  if(!wrap) return;
  const preview = wrap.parentElement.querySelector('.ai-img-preview');
  if(!preview) return;
  const v = input.value.trim();
  if(v){ preview.src = v; preview.style.display = 'block'; }
  else { preview.style.display = 'none'; }
}

// Shared guard: warns instead of silently bloating menu.json (and eventually breaking
// GitHub publish) when someone uploads a very large photo. Images end up embedded as
// base64 directly inside menu.json, so size adds up fast across dishes/galleries.
// BUG FIX / FEATURE: photos used to be stored exactly as uploaded (any
// size, any format) — a raw smartphone photo (often 5-15 Mo) got
// embedded as-is into DATA, which gets published straight into
// Supabase's menu_data column. That bloats every page load (every
// visitor downloads every photo, full size, regardless of the tiny
// thumbnail it's actually displayed at) and eats storage. Every upload
// now goes through automatic compression instead: cropped to the right
// ratio for its context, resized to a sane display size, and
// re-encoded as WEBP — all in the browser, before it ever gets stored.
// No manual "please compress your photo first" step needed anymore.
const MAX_RAW_UPLOAD_BYTES = 25*1024*1024; // 25 Mo — just a sanity cap on the *source* file (before compression), not the stored result
function compressImageFile(file, {ratio=null, maxDim=1000, quality=0.8}={}){
  return new Promise((resolve, reject) => {
    if(!file) return reject(new Error('Aucun fichier'));
    if(file.size > MAX_RAW_UPLOAD_BYTES){
      reject(new Error('Fichier trop lourd ('+Math.round(file.size/1024/1024)+' Mo) — 25 Mo max en entrée'));
      return;
    }
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Erreur de lecture du fichier'));
    reader.onload = e => {
      const img = new Image();
      img.onerror = () => reject(new Error('Image illisible'));
      img.onload = () => {
        // 1. Crop to the target ratio (e.g. 1:1 for dishes, 9:16 for
        // social photos) — "cover" style, centered. No ratio => keep the
        // photo's own proportions untouched (logos, decorative icons).
        let sx=0, sy=0, sw=img.width, sh=img.height;
        if(ratio){
          const target = ratio;
          const current = img.width / img.height;
          if(current > target){ sw = img.height*target; sx = (img.width-sw)/2; }
          else if(current < target){ sh = img.width/target; sy = (img.height-sh)/2; }
        }
        // 2. Resize down to a sane display size — never worth storing a
        // 4000px photo for a menu thumbnail or a story background.
        let outW = sw, outH = sh;
        if(Math.max(outW, outH) > maxDim){
          const scale = maxDim / Math.max(outW, outH);
          outW = Math.round(outW*scale); outH = Math.round(outH*scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = outW; canvas.height = outH;
        canvas.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, outW, outH);
        // 3. Re-encode as WEBP — ~25-35% lighter than JPEG at the same
        // visual quality.
        resolve(canvas.toDataURL('image/webp', quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
function readImageFileSafe(file, onOk, opts){
  if(!file) return;
  compressImageFile(file, opts).then(onOk).catch(e => showToast('⚠️ '+e.message));
}
function uploadImgFile(fileInput, ratio){
  const file = fileInput.files[0];
  readImageFileSafe(file, dataUrl => {
    const wrap = fileInput.closest('.ai-img-wrap');
    const inp = wrap && wrap.querySelector('.ai');
    if(!inp) return;
    inp.value = dataUrl;
    inp.dispatchEvent(new Event('input'));
  }, {ratio});
}

function toggleAdminSection(el){
  const sec=el.closest('.admin-section');
  if(sec) sec.classList.toggle('collapsed');
  if(sec && !sec.classList.contains('collapsed') && sec.querySelector('#pdfPreviewFrame')){
    setTimeout(()=>{ if(typeof updatePdfPreview==='function') updatePdfPreview(); }, 100);
  }
}
function openFirstAdminSection(){
  const body=document.getElementById('adminBody');
  if(!body) return;
  const all=body.querySelectorAll('.admin-section.collapsible');
  all.forEach((s,i)=>{ if(i===0) s.classList.remove('collapsed'); else s.classList.add('collapsed'); });
}

// ═══════════════════════════════════════════
// BUG FIX: renderAll() used to run ONLY after loadFromGitHub() resolved.
// For a visitor with no saved token that's near-instant (loadFromGitHub
// returns immediately), but for the site owner's own browser (which has
// a token saved for publishing), it triggers a real network fetch first —
// so the page sat completely blank for that round trip, then the entire
// menu popped in all at once, reading as an unpleasant "reload flash".
// Render immediately from whatever DATA is already embedded in this
// page (always correct as of the last full deploy) so there's never a
// blank moment, then let the GitHub check reconcile in the background —
// this only visibly changes anything if newer edits were published from
// elsewhere since this file was last deployed.
applyRestaurantBranding();
renderAll();
{ const dBtn=document.getElementById('calAdminBtnDesktop'); if(dBtn) dBtn.href=RESA_ADMIN_URL;
  const mBtn=document.getElementById('calAdminBtnMobile'); if(mBtn) mBtn.href=RESA_ADMIN_URL; }
// BUG FIX: the "Lecture / Modifier / Réglages" bar (.mode-links-bar) was
// never actually gated by admin status — its visibility was controlled
// purely by a responsive CSS media query (hidden on desktop, always
// shown on mobile), with no check anywhere for whether an admin session
// existed. That meant any regular visitor on a phone saw the admin
// controls, even in a fresh private/incognito window. Toggle a body
// class based on the real Supabase session, and require it in the CSS
// rule that reveals this bar on mobile (see .mode-links-bar in the
// stylesheet) — now it only ever appears for an actual admin.
//
// ARCHITECTURE NOTE: since the admin buttons only show once `is-admin`
// is set, and that now depends on an actual Supabase session (not a
// token you could just paste into an always-visible field), there needs
// to be a way to log in for the very first time. Same convention as the
// reservations admin sticky button: opening this page with `?admin=1`
// reveals the entry point regardless of session state, where a login
// form (email/password, same restaurant_admins account used for
// reservations) is presented. Once logged in, the session persists
// normally and the plain URL (no query param) is enough from then on.
(async function initAdminAccess(){
  const wantsAdminEntry = new URLSearchParams(location.search).get('admin')==='1';
  await checkAdminSession(); // sets supaSession + toggles is-admin if a session exists
  if(wantsAdminEntry) document.body.classList.add('admin-entry-visible');
})();
// BUG FIX: the reconciliation re-render below used to run unconditionally,
// even when the fetched data was byte-for-byte identical to what's already
// embedded (the common case, especially in the owner's own browser, which
// is the only one that ever runs this fetch at all). A full re-render
// recreates every DOM node — including every <img> — so even with no
// visible content change, images briefly flicker as they're torn down and
// recreated. Home/the first tab usually carries the largest photo, so
// that's exactly where this one-time blink was most visible. Only
// re-render now if the data genuinely differs.
const _preFetchSnapshot=JSON.stringify(DATA);
loadFromSupabase().then(()=>{
  if(JSON.stringify(DATA)!==_preFetchSnapshot){
    view=DATA.defaultView||'grid';
    applyRestaurantBranding();
    renderAll();
  }
});
