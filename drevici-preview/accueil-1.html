<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Drevici Oyster · Maison ostréicole</title><meta name="robots" content="noindex"><meta name="theme-color" content="#2b3550">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0b1530}body{font-family:Jost,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.lp{position:fixed;top:0;left:0;right:0;height:100vh;height:100lvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;overflow:hidden}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dim{position:absolute;inset:0;background:rgba(5,12,30,var(--dim,.55))}
.in{position:relative;width:100%;display:flex;flex-direction:column;align-items:center}
.k{font-size:16px;letter-spacing:.28em;text-transform:uppercase;color:#ffc61a;font-weight:600;text-shadow:0 0 22px rgba(0,0,0,.85),0 0 8px rgba(0,0,0,.7),0 1px 2px rgba(0,0,0,.6)}
.name{font-family:'Playfair Display',serif;font-weight:700;letter-spacing:.04em;font-size:34px;margin:4px 0 8px;text-shadow:0 0 30px rgba(0,0,0,.6)}
.tag{font-size:15.5px;font-weight:500;color:#fff;letter-spacing:.04em;text-shadow:0 0 22px rgba(0,0,0,.85),0 0 8px rgba(0,0,0,.7),0 1px 2px rgba(0,0,0,.6)}
.tag .pc{display:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:34px;width:min(540px,100%)}
.ch{border:1.5px solid rgba(255,255,255,.85);border-radius:14px;padding:18px 10px;background:rgba(0,0,0,.18);transition:background .2s}
.ch:hover{background:rgba(0,0,0,.32)}
.ch b{display:block;font-family:'Playfair Display',serif;font-size:26px;margin-bottom:6px}
.ch small{display:block;font-size:13px;font-weight:500;color:#fff;text-shadow:0 0 10px rgba(0,0,0,.7)}
.hint{font-size:14px;font-weight:500;color:#fff;margin-top:16px;text-shadow:0 0 22px rgba(0,0,0,.85),0 0 8px rgba(0,0,0,.7),0 1px 2px rgba(0,0,0,.6)}
@media(min-width:900px){.name{font-size:52px}.ch{padding:24px 12px}.ch b{font-size:30px}.k{font-size:19px}.tag{font-size:18px}.tag .pc{display:inline}.ch small{font-size:14px}.hint{font-size:15px}}
.sl{opacity:.8;filter:drop-shadow(0 0 14px rgba(0,0,0,.7));display:block}.sl{width:112px;height:112px;margin-bottom:18px}@media(min-width:900px){.sl{width:135px;height:135px}}
@media(max-width:899px){.sl{position:absolute;top:calc(env(safe-area-inset-top) + 64px);left:50%;transform:translateX(-50%);margin:0}}
</style></head><body>
<!-- Accueil des deux établissements (brouillon sur la preview). Tous les textes, le fond et l'assombrissement
     deviendront réglables dans l'admin (« Accueil des deux établissements »). -->
<main class="lp" style="--dim:.55">
  <img class="bg" src="media/accueil-fond.jpg" alt="">
  <div class="dim"></div>
  <img class="sl" src="media/accueil-logo.png" alt="Drevici Oyster">
  <div class="in">
    <div class="k">Maison ostréicole</div>
    <h1 class="name">DREVICI OYSTER</h1>
    <div class="tag"><span class="pc">Producteurs-ostréiculteurs · </span>De la mer à votre assiette</div>
    <nav class="two">
      <a class="ch" href="https://drevici.beltab.app/"><b>Paris</b><small>8 rue Biot, 75017 Paris</small></a>
      <a class="ch" href="https://drevici-surzur.beltab.app/"><b>Surzur</b><small>Pentes, 56450 Surzur</small></a>
    </nav>
  </div>
</main>
</body></html>
