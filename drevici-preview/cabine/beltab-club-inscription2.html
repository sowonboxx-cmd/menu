<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Club · inscription v5 coupes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Cormorant+Garamond:ital,wght@1,600&display=swap">
<style>
*{box-sizing:border-box}body{margin:0;background:#e9e5dc;font-family:Inter,sans-serif;color:#16181d;padding:28px;-webkit-font-smoothing:antialiased}
h1{margin:0 0 4px;font-size:26px;letter-spacing:-.02em}.sub{margin:0 0 22px;color:#666;font-size:14px;max-width:1300px}
.g{display:grid;grid-template-columns:repeat(3,390px);gap:30px 28px;align-items:start}
.lab b{font-size:16px}.lab span{display:block;color:#666;font-size:12.5px;margin:3px 0 10px;line-height:1.4;min-height:52px}
.sheet{background:#f5f1ea;border-radius:26px;padding:12px 22px 22px;box-shadow:0 20px 40px -18px rgba(0,0,0,.35);overflow:hidden;position:relative}
.grab{width:42px;height:5px;border-radius:9px;background:#d4cec3;margin:0 auto 12px;position:relative;z-index:2}
.kick{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#b8945a;font-weight:700}
.ttl{display:block;font-family:'Playfair Display',serif;font-size:22px;color:#10285e;line-height:1.15;margin-top:4px}
/* champs plus lisibles */
.f{display:block;background:#fff;border-radius:13px;padding:8px 13px;margin:0 0 8px;box-shadow:inset 0 0 0 1px #e2dbcd}
.f small{display:block;font-size:11.5px;font-weight:700;color:#10285e;letter-spacing:.02em}
.f input{border:0;outline:0;width:100%;font-size:16px;padding:2px 0;background:none;color:#16181d;font-family:inherit}
.f input::placeholder{color:#a3a7b0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ck{display:flex;gap:8px;font-size:12px;color:#444;margin:8px 2px 12px;line-height:1.35;align-items:flex-start}.ck input{margin-top:1px;accent-color:#10285e}
.cta{width:100%;border:0;background:#10285e;color:#fff;border-radius:999px;padding:15px;font-weight:600;font-size:15.5px;font-family:inherit}
.note{font-size:10.5px;color:#8a8f99;text-align:center;margin:10px 0 0;line-height:1.4}
.masc-free{display:block;height:100%;width:auto}
/* entêtes */
.h1{display:flex;gap:10px;align-items:center;margin:-4px 0 12px}.h1 img{height:132px;flex:none;margin:-6px -6px -10px -10px}
.h2{display:flex;gap:14px;align-items:center;margin-bottom:14px}.h2 .tile{width:84px;height:84px;border-radius:20px;flex:none;background:radial-gradient(120% 140% at 85% 10%,#2a4a8f 0%,#10285e 45%,#0a1838 100%);display:flex;justify-content:center;align-items:flex-end;overflow:hidden;box-shadow:0 8px 16px -8px rgba(16,40,94,.6),inset 0 0 0 1px rgba(240,217,168,.5)}.h2 .tile img{height:92%;margin-bottom:3%}
.h3{margin:-12px -22px 14px;padding:22px 22px 18px;background:radial-gradient(120% 140% at 85% 10%,#2a4a8f 0%,#10285e 45%,#0a1838 100%);position:relative;min-height:150px;border-bottom:2px solid #c9a24f}
.h3 .kick{color:#f0d9a8}.h3 .ttl{color:#fff;font-size:23px}.h3 img{position:absolute;right:14px;bottom:0;height:150px;opacity:.9}
.h3 .grab{background:rgba(255,255,255,.35);margin-top:-10px}
.h6{display:flex;gap:12px;align-items:center;margin-bottom:14px;padding:12px;border-radius:18px;background:linear-gradient(125deg,#d4b06a 0%,#ecd39a 30%,#dcbd7c 50%,#f0dba8 68%,#cfa962 100%);box-shadow:inset 0 0 0 1px rgba(80,55,15,.3)}
.h6 img{height:96px;flex:none;mix-blend-mode:multiply}.h6 .kick{color:#6b4b14}.h6 .ttl{color:#2b1f0b}
.next{display:inline-block;margin-top:6px;font-size:11px;font-weight:700;letter-spacing:.06em;color:#6b4b14;background:rgba(255,255,255,.45);border-radius:999px;padding:3px 9px}
/* cartes */
.cw{position:relative;width:100%;aspect-ratio:440/277}
.card{position:absolute;left:0;top:0;width:440px;height:277px;border-radius:18px;overflow:hidden;transform-origin:0 0;box-shadow:0 18px 32px -14px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.18);isolation:isolate;text-align:left}
.card>*{position:absolute}
.card:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.16) 45%,transparent 60%);pointer-events:none;z-index:9}
.wm1{font-family:'Playfair Display',serif;font-weight:800;font-size:22px;letter-spacing:.09em;white-space:nowrap}
.wm2{font-family:'Playfair Display',serif;font-weight:800;font-size:17px;letter-spacing:.09em;line-height:1.45}
.bzh{font-size:9px;font-weight:700;letter-spacing:.45em}.kind{font-size:9px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;white-space:nowrap}
.name{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:20px;letter-spacing:.14em;white-space:nowrap}
.code{font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:12.5px;letter-spacing:.22em;white-space:nowrap}
.no{text-align:right;font-size:7.5px;letter-spacing:.2em;font-weight:700;text-transform:uppercase;line-height:1.4}.no b{display:block;font-family:'IBM Plex Mono',monospace;font-size:15px;letter-spacing:.12em}
.chip{width:42px;height:32px;border-radius:7px;background:linear-gradient(135deg,#f7e3a6,#c9a24f 45%,#f1d78f 70%,#a8822f);box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.emb{text-shadow:0 1px 0 rgba(255,255,255,.3),0 -1px 0 rgba(0,0,0,.35)}.gl{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600}
.masc{height:94%;bottom:4%}
.navy{background:radial-gradient(120% 140% at 85% 10%,#2a4a8f 0%,#10285e 45%,#0a1838 100%);color:#fff}.gold{background:#d9b878;color:#2b1f0b}.noir{background:linear-gradient(160deg,#1c1c1e,#0b0b0c 70%);color:#e9c982}
/* carte seule (4) */
.one{margin:0 auto 14px;width:86%}
/* 3 cartes qui tournent (5) */
.deck{position:relative;height:178px;margin:0 0 12px}
.deck .slot{position:absolute;left:50%;top:10px;width:240px;aspect-ratio:440/277;transition:transform .9s cubic-bezier(.45,.05,.25,1),opacity .9s,filter .9s}
.deck .slot.pf{transform:translateX(-50%) translateY(8px) scale(1.12);z-index:3}
.deck .slot.pr{transform:translateX(calc(-50% + 70px)) rotate(7deg) scale(.86);z-index:2;filter:brightness(.8)}
.deck .slot.pl{transform:translateX(calc(-50% - 70px)) rotate(-7deg) scale(.86);z-index:1;filter:brightness(.8)}
.capt{text-align:center;font-size:12px;color:#6b7080;margin:-2px 0 12px}.capt b{color:#10285e}
.clink{position:relative;display:inline-block;font-size:34px;line-height:1;margin-bottom:4px;animation:clink 3s ease-in-out infinite;transform-origin:50% 90%}
.clink i{position:absolute;left:50%;top:-4px;width:26px;height:14px;transform:translateX(-50%);opacity:0;background:radial-gradient(circle,#f0d9a8 0 2px,transparent 3px) 0 6px/8px 8px,radial-gradient(circle,#f0d9a8 0 1.5px,transparent 2.5px) 4px 0/9px 9px;animation:spark 3s ease-out infinite}
@keyframes clink{0%,70%,100%{transform:rotate(0) scale(1)}76%{transform:rotate(-10deg) scale(1.08)}82%{transform:rotate(8deg) scale(1.12)}88%{transform:rotate(-3deg) scale(1.04)}}
@keyframes spark{0%,78%{opacity:0;transform:translateX(-50%) translateY(4px) scale(.6)}84%{opacity:1;transform:translateX(-50%) translateY(-4px) scale(1.1)}100%{opacity:0;transform:translateX(-50%) translateY(-10px) scale(1.2)}}
</style></head><body>
<h1>Formulaire · version 5 avec les coupes 🥂</h1>
<p class="sub">Version 5 retenue (les 3 cartes qui tournent). 3 façons d'ajouter les coupes qui trinquent.</p>
<div class="g" id="g"></div>
<script>
const ANCHOR='<svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" style="vertical-align:-1px;margin-left:4px"><circle cx="12" cy="5" r="2.2"/><path d="M12 7.5V21M7 11h10M4.5 14.5c1 4 4 6.5 7.5 6.5s6.5-2.5 7.5-6.5"/></svg>';
const vert=(t,c)=>`<div class="kind" style="right:22px;top:50%;transform:translateY(-50%) rotate(90deg);transform-origin:right center;color:${c};font-size:8px">${t}</div>`;
function card(k,name,no){
  name=name||'VOTRE PRÉNOM'; const code='CLUB · ····';
  if(k==='noir') return `<div class="card noir"><div style="inset:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 2px,transparent 2px 4px),repeating-linear-gradient(-45deg,rgba(0,0,0,.25) 0 2px,transparent 2px 4px)"></div><div style="inset:10px;border:1px solid rgba(233,201,130,.4);border-radius:12px"></div><img class="masc" src="gentleman.png" style="left:50%;transform:translateX(-50%);height:104%;bottom:-6%;opacity:.85"><div class="wm2" style="left:24px;top:22px">DREVICI<br>OYSTER</div><div class="kind" style="right:24px;top:24px">Carte <span style="color:#e0524b">staff</span></div><div class="gl" style="right:24px;top:40px;font-size:13px;color:#bfa36a">Gentleman Oyster</div><div style="right:22px;top:56px;font-family:'Playfair Display',serif;font-weight:800;font-size:34px;color:rgba(233,201,130,.85)">001</div><div class="name nm" style="left:24px;bottom:46px;color:#f3dfa8;font-size:18px">WILL</div><div class="code" style="left:24px;bottom:26px;color:#bfa36a">CLUB · 4F7K</div><div class="no" style="right:24px;bottom:26px;color:#8d7a52">Membre depuis<b style="color:#e9c982;font-size:12.5px">10 / 26</b></div></div>`;
  if(k==='gold') return `<div class="card gold"><div style="inset:0;background:linear-gradient(125deg,#d4b06a 0%,#ecd39a 30%,#dcbd7c 50%,#f0dba8 68%,#cfa962 100%)"></div><div style="inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 1px,transparent 1px 3px)"></div><div style="inset:9px;border:1.5px solid rgba(80,55,15,.5);border-radius:12px"></div><div style="inset:13px;border:.5px solid rgba(80,55,15,.4);border-radius:9px"></div><img class="masc" src="gentleman.png" style="right:48px;mix-blend-mode:multiply"><img class="masc" src="gentleman.png" style="right:48px;opacity:.3"><div class="wm1" style="left:26px;top:24px;color:#2b1f0b">DREVICI OYSTER</div><div class="bzh" style="left:26px;top:58px;color:#6b4b14">BZH${ANCHOR}</div><div class="chip" style="left:26px;top:108px"></div>${vert('Carte Gold','#6b4b14')}<div class="name" style="left:26px;bottom:46px;color:#2b1f0b">CLAIRE</div><div class="code" style="left:26px;bottom:26px;color:#3a2a0c">CLUB · K8RT</div><div class="no" style="right:26px;bottom:24px;color:#6b4b14">Membre n°<b style="color:#2b1f0b">007</b></div></div>`;
  return `<div class="card navy"><div style="inset:9px;border:1px solid rgba(240,217,168,.6);border-radius:12px"></div><img class="masc" src="gentleman.png" style="right:50px;opacity:.85"><div class="wm1" style="left:24px;top:22px">DREVICI OYSTER</div><div class="bzh" style="left:24px;top:58px;color:#f0d9a8">BZH${ANCHOR}</div><div class="chip" style="left:24px;top:112px"></div><div class="name emb nm" style="left:24px;bottom:46px">${name}</div><div class="code" style="left:24px;bottom:26px;color:#cfd8ea">${code}</div>${vert('Carte membre','rgba(240,217,168,.75)')}<div class="no" style="right:24px;bottom:24px;color:#9fb0d0">Membre n°<b style="color:#fff">${no||'024'}</b></div></div>`;
}
const T='<span class="kick">Le Club Drevici</span><b class="ttl">Une coupe offerte<br>à votre première visite</b>';
const FORM=`<div class="two"><label class="f"><small>Prénom</small><input placeholder="Votre prénom" oninput="live(this)"></label><label class="f"><small>Nom</small><input placeholder="Votre nom"></label></div>
<label class="f"><small>Email</small><input placeholder="vous@exemple.fr"></label><label class="f"><small>Téléphone</small><input placeholder="06 12 34 56 78"></label>
<label class="ck"><input type="checkbox"> J'accepte de recevoir les soirées, avant-premières et offres du club par email et SMS. C'est le principe du club ; désinscription en 1 clic (lien ou STOP).</label>
<button class="cta">Je rejoins le club</button>
<p class="note">Votre prénom et l'initiale de votre nom pourront apparaître dans la liste des premiers membres (retrait sur simple demande). Coupe offerte pour un repas réservé, une par membre, valable 30 jours après l'inscription. Réservé aux plus de 18 ans. L'abus d'alcool est dangereux pour la santé.</p>`;
const D5=`<div class="grab"></div><div class="deck"><div class="slot pf"><div class="cw">${card('navy')}</div></div><div class="slot pr"><div class="cw">${card('gold')}</div></div><div class="slot pl"><div class="cw">${card('noir')}</div></div></div><div class="capt">Vous serez le membre <b>n° 024</b></div>`;
const V=[
 ['5A · Coupes dans le titre','« Une coupe offerte 🥂 » : les coupes qui trinquent juste après le titre.',D5+`<div style="text-align:center;margin-bottom:12px"><span class="kick">Le Club Drevici</span><b class="ttl">Une coupe offerte 🥂<br>à votre première visite</b></div>`,''],
 ['5B · Coupes sur le bouton','Titre sobre, et les coupes sur le bouton « Je rejoins le club 🥂 » : l\'émotion au moment de cliquer.',D5+`<div style="text-align:center;margin-bottom:12px">${T}</div>`,' 🥂'],
 ['5C · Coupes qui trinquent (animées)','Un grand 🥂 au-dessus du titre qui « trinque » toutes les 3 secondes (petit choc + éclat). Bouton avec les coupes aussi.',D5+`<div style="text-align:center;margin-bottom:12px"><div class="clink">🥂<i></i></div>${T}</div>`,' 🥂'],
];
document.getElementById('g').innerHTML=V.map(([t,d,h,e])=>`<div><div class="lab"><b>${t}</b><span>${d}</span></div><div class="sheet">${h}${FORM.replace('Je rejoins le club<','Je rejoins le club'+e+'<')}</div></div>`).join('');
function fit(){document.querySelectorAll('.cw').forEach(w=>{const c=w.querySelector('.card');c.style.transform='scale('+(w.clientWidth/440)+')';});}
fit();addEventListener('resize',fit);
function live(i){const c=i.closest('.sheet').querySelector('.slot.pf .nm, .one .nm');if(c)c.textContent=(i.value||'Votre prénom').toUpperCase();}
setInterval(()=>document.querySelectorAll('.deck').forEach(p=>p.querySelectorAll('.slot').forEach(c=>{const k=c.classList.contains('pf')?'pl':c.classList.contains('pr')?'pf':'pr';c.classList.remove('pf','pr','pl');c.classList.add(k);})),2800);
</script></body></html>
