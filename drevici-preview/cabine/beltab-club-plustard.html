<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Club · écran « Plus tard » avec photos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Playfair+Display:wght@700&family=Inter:wght@400;500;600;700&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;background:#e9e5dc;font-family:Inter,sans-serif;color:#16181d;padding:28px;-webkit-font-smoothing:antialiased}
h1{margin:0 0 4px;font-size:26px;letter-spacing:-.02em}.sub{margin:0 0 22px;color:#666;font-size:14px}
.g{display:grid;grid-template-columns:repeat(4,390px);gap:28px;align-items:start}
.lab b{font-size:16px}.lab span{display:block;color:#666;font-size:12.5px;margin:3px 0 10px;line-height:1.4;min-height:52px}
.sheet{background:#f5f1ea;border-radius:26px;padding:12px 22px 22px;box-shadow:0 20px 40px -18px rgba(0,0,0,.35)}
.grab{width:42px;height:5px;border-radius:9px;background:#d4cec3;margin:0 auto 12px}
.wel{text-align:center}
.wt{font-family:'Playfair Display',serif;font-size:24px;color:#10285e;font-weight:700;margin-top:4px}
.ws{font-size:13.5px;color:#6b7080;margin:4px 0 12px}
.dl{background:#fdf1e4;border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.5;color:#7a3b12;margin-bottom:14px}
.ig{background:#fff;border-radius:16px;padding:14px}.ig>b{display:block;font-size:15px;color:#10285e}.ig>span{display:block;font-size:13px;color:#6b7080;margin:4px 0 12px;line-height:1.4}
.cta{display:block;width:100%;border:0;background:#10285e;color:#fff;border-radius:999px;padding:15px;font-weight:600;font-size:15.5px;text-align:center;text-decoration:none}
.iga{display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(90deg,#f58529,#dd2a7b 50%,#8134af)}
.later{background:none;border:0;color:#6b7080;font-size:13.5px;margin-top:10px;padding:6px;font-family:inherit}
.ph{position:relative;margin:4px 0 16px}

/* A · le tas de photos (polaroids) */
.pile{height:218px}
.pol{position:absolute;width:150px;background:#fffdf8;padding:8px 8px 30px;box-shadow:0 8px 18px -6px rgba(0,0,0,.35),0 1px 2px rgba(0,0,0,.15)}
.pol img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.pol i{position:absolute;left:0;right:0;bottom:6px;font-family:Caveat,cursive;font-style:normal;font-weight:700;font-size:18px;color:#10285e;text-align:center}
.pol:before{content:"";position:absolute;top:-9px;left:50%;width:54px;height:18px;transform:translateX(-50%) rotate(-3deg);background:rgba(240,217,168,.75);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.p1{left:4px;top:22px;transform:rotate(-8deg)}.p2{left:96px;top:4px;transform:rotate(3deg);z-index:2}.p3{right:2px;top:30px;transform:rotate(9deg)}

/* B · galerie marine (3 cadres alignés) */
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fr{background:#10285e;padding:4px;border-radius:3px;box-shadow:0 6px 12px -6px rgba(16,40,94,.5)}
.fr div{background:#fbf8f1;padding:5px}
.fr img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.row small{display:block;text-align:center;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#8a7a5a;margin-top:6px;font-weight:700}

/* C · le tableau (une photo qui défile, cadre bois bleu + filet or + plaque laiton) */
.tab{margin:0 auto;width:250px;padding:13px;border-radius:3px;background:linear-gradient(135deg,#1b3a7a,#0e2457 40%,#163170 60%,#0b1d48);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),inset 0 0 0 4px rgba(0,0,0,.18),0 14px 24px -10px rgba(0,0,0,.45)}
.tab .gf{padding:2px;background:linear-gradient(135deg,#f3dc9f,#b8893a 50%,#f0d58e)}
.tab .pp{background:#f7f2e7;padding:12px;box-shadow:inset 0 2px 4px rgba(0,0,0,.18)}
.slide{position:relative;aspect-ratio:1;overflow:hidden}
.slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;animation:fade 12s infinite}
.slide img:nth-child(2){animation-delay:4s}.slide img:nth-child(3){animation-delay:8s}
@keyframes fade{0%{opacity:0;transform:scale(1.04)}6%,30%{opacity:1}36%,100%{opacity:0;transform:scale(1)}}
.plaque{margin:12px auto 0;width:150px;padding:5px 0;text-align:center;border-radius:2px;background:linear-gradient(180deg,#f3dc9f,#c9a24f 55%,#a8822f);color:#3a2a0c;font-family:'Playfair Display',serif;font-size:10.5px;letter-spacing:.14em;box-shadow:0 2px 4px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.5)}
.plaque small{display:block;font-family:Inter,sans-serif;font-size:7.5px;letter-spacing:.25em;font-weight:700;opacity:.8}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px}.dots i{width:6px;height:6px;border-radius:50%;background:#cfc6b4}.dots i:first-child{background:#10285e}

/* D · cadre corde (une photo qui défile) */
.rope{margin:0 auto;width:250px;padding:10px;border-radius:12px;background:repeating-linear-gradient(45deg,#d9b980 0 5px,#b08a4e 5px 7px,#e6cb98 7px 11px,#9c7740 11px 13px);box-shadow:0 12px 22px -10px rgba(0,0,0,.45),inset 0 0 0 1px rgba(80,55,15,.35)}
.rope .in{background:#fffdf8;padding:8px;border-radius:5px;box-shadow:inset 0 0 0 1px rgba(80,55,15,.2)}
.rope .slide{border-radius:3px}
.knot{position:absolute;left:50%;top:-14px;transform:translateX(-50%);width:34px;height:34px;border-radius:50%;background:#f5f1ea;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.2);z-index:3;color:#10285e}
.cap{font-family:Caveat,cursive;font-weight:700;font-size:20px;color:#10285e;text-align:center;margin-top:8px}
</style></head><body>
<h1>Écran « Plus tard » · photos dans un cadre marin</h1>
<p class="sub">Corrections déjà faites (sablier retiré, texte sur 2 lignes, plus de bordure autour du bloc Instagram, « Réserver ma table » en bleu plein). 4 façons de mettre les photos juste au-dessus de « Suivre ». C et D défilent toutes seules.</p>
<div class="g" id="g"></div>
<script>
const P=['../club/photos/drevici-1.webp','../club/photos/drevici-2.webp','../club/photos/drevici-3.webp'];
const ANCHOR='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="5" r="2.2"/><path d="M12 7.5V21M7 11h10M4.5 14.5c1 4 4 6.5 7.5 6.5s6.5-2.5 7.5-6.5"/></svg>';
const slide=`<div class="slide">${P.map(p=>`<img src="${p}" alt="">`).join('')}</div>`;
const V=[
 ['A · Le tas de photos','Trois polaroïds posés en vrac, scotchés, avec une légende écrite à la main. Ambiance album de famille.',
  `<div class="ph pile"><div class="pol p1"><img src="${P[0]}"><i>En mer</i></div><div class="pol p2"><img src="${P[1]}"><i>L'équipe</i></div><div class="pol p3"><img src="${P[2]}"><i>À table !</i></div></div>`],
 ['B · La galerie','Trois petits cadres bleu marine avec passe-partout, alignés comme au mur d\'une maison de pêcheur.',
  `<div class="ph row">${[['En mer',0],['L\'équipe',1],['À table',2]].map(([t,i])=>`<div><div class="fr"><div><img src="${P[i]}"></div></div><small>${t}</small></div>`).join('')}</div>`],
 ['C · Le tableau','Une seule photo à la fois dans un cadre en bois bleu, filet doré, passe-partout et plaque en laiton. Les photos défilent en fondu.',
  `<div class="ph"><div class="tab"><div class="gf"><div class="pp">${slide}</div></div></div><div class="plaque">DREVICI OYSTER<small>BRETAGNE</small></div></div>`],
 ['D · Le cadre corde','Une photo à la fois dans un cadre en corde de marin, avec une ancre en haut et une légende manuscrite. Défile en fondu.',
  `<div class="ph" style="margin-top:20px"><div class="knot">${ANCHOR}</div><div class="rope"><div class="in">${slide}</div></div><div class="cap">De la mer à votre table</div></div>`],
];
document.getElementById('g').innerHTML=V.map(([t,d,ph])=>`<div><div class="lab"><b>${t}</b><span>${d}</span></div>
<div class="sheet"><div class="grab"></div><div class="wel">
 <div class="wt">Pas de souci !</div><div class="ws">Votre carte vous attend, et votre coupe aussi…</div>
 <div class="dl">Plus que <b>30 jours</b> pour en profiter,<br>jusqu'au <b>11 novembre</b>, venez vite !</div>
 <div class="ig"><b>En attendant, suivez-nous sur Instagram</b><span>Jeux et cadeaux à gagner, soirées et nouveautés en avant-première.</span>
  ${ph}
  <a class="cta iga"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>Suivre @drevicioysterbar</a></div>
 <a class="cta" style="margin-top:12px">Réserver ma table</a>
 <button class="later">Fermer</button></div></div></div>`).join('');
</script>
</body></html>
