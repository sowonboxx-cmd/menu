<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestion · Clients en cartes · numéros</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
*{box-sizing:border-box}body{margin:0;background:#e9e5dc;font-family:Inter,sans-serif;color:#16181d;padding:28px;-webkit-font-smoothing:antialiased}
h1.t{margin:0 0 4px;font-size:26px}.sub{margin:0 0 24px;color:#666;font-size:14px;max-width:1100px}
.v{margin:0 0 40px}.v>h2{font-size:18px;margin:0 0 4px}.v>p{margin:0 0 12px;color:#555;font-size:13.5px;max-width:1000px}
.pg{background:#f4f2ee;border-radius:22px;padding:24px 26px;width:1040px;position:relative}
.hd{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:14px}.hd h3{margin:0;font-size:28px;letter-spacing:-.02em}.hd small{display:block;color:#6b7080;font-size:14px;margin-top:2px}
.btns{display:flex;gap:10px}.b1{background:#1a73e8;color:#fff;border-radius:999px;padding:10px 17px;font-weight:700;font-size:14px}.b2{background:#fff;border-radius:999px;padding:10px 17px;font-weight:700;font-size:14px}
.srch{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:13px 16px;font-size:15.5px;color:#9097a3;box-shadow:inset 0 0 0 1px #e6e1d6;margin-bottom:12px}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:14px}.chips{display:flex;gap:7px;flex-wrap:wrap;flex:1}.chip{background:#fff;border-radius:999px;padding:7px 13px;font-weight:600;font-size:13px}.chip i{font-style:normal;color:#9097a3;margin-left:4px}.chip.on{background:#10285e;color:#fff}.chip.on i{color:#b9c6e4}
.sort{flex:none;display:flex;align-items:center;gap:6px;background:#fff;border-radius:12px;padding:8px 12px;font-size:13px;font-weight:600;box-shadow:inset 0 0 0 1px #e6e1d6}.sort span{color:#8a8f99;font-weight:500}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.c{background:#fff;border-radius:20px;padding:16px;display:flex;gap:14px;align-items:center;position:relative;cursor:pointer;transition:box-shadow .2s}.c:hover{box-shadow:0 6px 18px -8px rgba(16,40,94,.35)}
.mini{width:96px;height:60px;border-radius:9px;flex:none;position:relative;overflow:hidden;box-shadow:0 4px 10px -4px rgba(0,0,0,.35)}
.mini b{position:absolute;left:7px;bottom:5px;font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.08em}
.mini i{position:absolute;left:7px;top:6px;font-family:'Playfair Display',serif;font-style:normal;font-weight:800;font-size:7.5px;letter-spacing:.08em}
.mini img{position:absolute;right:9px;bottom:2px;height:88%}
.mini .n{position:absolute;right:6px;bottom:4px;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:10px;letter-spacing:.06em}
.m-nav{background:radial-gradient(120% 140% at 85% 10%,#2a4a8f,#10285e 45%,#0a1838);color:#fff}.m-gold{background:linear-gradient(125deg,#d4b06a,#ecd39a 30%,#dcbd7c 50%,#f0dba8 68%,#cfa962);color:#2b1f0b}.m-staff{background:linear-gradient(160deg,#1c1c1e,#0b0b0c 70%);color:#e9c982}.m-none{background:#f1efea;color:#b0b4bc;display:grid;place-items:center;font-size:11px;font-weight:600}
.mid{flex:1;min-width:0}.nm{font-weight:700;font-size:15.5px;display:flex;align-items:center;gap:8px}.ct{font-size:12.5px;color:#6b7080;margin-top:2px}
.code{font-family:'IBM Plex Mono',monospace;font-weight:600;letter-spacing:.08em;font-size:11.5px;color:#8a8f99}
.bot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px;min-height:30px}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;background:#fff4e5;color:#b45309}
.go{background:#10285e;color:#fff;border-radius:999px;padding:7px 13px;font-weight:700;font-size:12.5px;white-space:nowrap}
.vis{font-size:12px;color:#6b7080}.vis b{color:#16181d}
/* placements du numéro */
.nA{position:absolute;right:16px;top:12px;font-family:'Playfair Display',serif;font-weight:800;font-size:22px;color:#10285e;letter-spacing:.02em;line-height:1}.nA small{display:block;font-family:Inter,sans-serif;font-size:8.5px;letter-spacing:.18em;color:#a9adb6;font-weight:700;text-align:right;margin-bottom:2px}
.nA.g{color:#9a7428}.nA.s{color:#16161a}
.nC{display:inline-flex;align-items:center;border-radius:7px;padding:2px 7px;font-size:11.5px;font-weight:800;letter-spacing:.04em;background:#10285e;color:#fff}.nC.g{background:#c9a24f;color:#2b1f0b}.nC.s{background:#16161a;color:#e9c982}
.nD{position:absolute;left:90px;top:10px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;background:#fff;color:#10285e;box-shadow:0 0 0 2px #fff,0 0 0 3.5px #c9a24f,0 3px 8px rgba(0,0,0,.2);z-index:2}
/* popup */
.dim{position:absolute;inset:0;background:rgba(15,20,35,.45);border-radius:22px;display:flex;align-items:center;justify-content:center}
.pop{width:440px;background:#fff;border-radius:24px;padding:22px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.pop .bigcard{height:170px;border-radius:14px;position:relative;overflow:hidden;margin:14px 0}.pop .bigcard i{position:absolute;left:16px;top:14px;font-family:'Playfair Display',serif;font-style:normal;font-weight:800;font-size:15px;letter-spacing:.09em}.pop .bigcard b{position:absolute;left:16px;bottom:14px;font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.14em}.pop .bigcard em{position:absolute;left:16px;bottom:34px;font-family:'IBM Plex Mono',monospace;font-style:normal;font-weight:600;font-size:17px;letter-spacing:.12em}.pop .bigcard img{position:absolute;right:30px;bottom:4px;height:92%}.pop .bigcard u{position:absolute;right:16px;bottom:14px;text-decoration:none;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:15px}
.coupe{border-radius:16px;padding:12px 14px;background:#fff8ec;box-shadow:inset 0 0 0 1px #f3dfb8;display:flex;align-items:center;gap:12px}.coupe div{flex:1}.coupe h4{margin:0;font-size:14px}.coupe p{margin:2px 0 0;font-size:12px;color:#6b5a3a}
.kv{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;font-size:13px;margin-top:14px;align-items:center}.kv span{color:#8a8f99}
.seg{display:flex;background:#f1efea;border-radius:999px;padding:3px}.seg a{flex:1;text-align:center;padding:6px 0;border-radius:999px;font-size:12.5px;font-weight:700;color:#6b7080}.seg a.on{background:#fff;color:#10285e;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.x{float:right;width:30px;height:30px;border-radius:50%;background:#f1efea;display:grid;place-items:center;font-size:15px;color:#6b7080}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.stats div{background:#f6f4ef;border-radius:12px;padding:9px 10px}.stats b{display:block;font-size:17px}.stats small{font-size:11px;color:#8a8f99}

.c{align-items:flex-start}.mid{padding-right:62px}.mid small{display:block;font-size:12.5px;color:#6b7080;line-height:1.5}
.nA{position:absolute;right:16px;top:12px;font-family:'Playfair Display',serif;font-weight:800;font-size:22px;color:#10285e;line-height:1;text-align:right}.nA small{display:block;font-family:Inter,sans-serif;font-size:8.5px;letter-spacing:.18em;color:#a9adb6;font-weight:700;margin-bottom:2px}.nA.g{color:#9a7428}.nA.s{color:#16161a}
.gp{display:inline-flex;align-items:center;gap:4px;background:#e3f5e9;color:#17663a;border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:700;white-space:nowrap}
.gb{background:#1e7a43;color:#fff;border-radius:999px;padding:6px 11px;font-size:12px;font-weight:700;white-space:nowrap}
.gbn{background:#10285e;color:#fff;border-radius:999px;padding:6px 11px;font-size:12px;font-weight:700;white-space:nowrap}
.r1{position:absolute;right:16px;top:46px}
.r2{position:absolute;right:16px;bottom:16px;display:flex;gap:6px;align-items:center}
.mbadge{position:absolute;left:10px;bottom:10px;z-index:3;background:#1e7a43;color:#fff;border-radius:999px;padding:2px 7px;font-size:10.5px;font-weight:800;box-shadow:0 0 0 2px #fff}
.inl{color:#17663a;font-weight:700}
</style></head><body><h1 class="t">Cartes clients · coupe à offrir, version compacte</h1><p class="sub">Toutes les cartes gardent la même hauteur que Claire et Louis. Le vert remplace l'orange pour qu'on voie la coupe tout de suite.</p><div id="out"></div><script>const P=[
 {nm:'Will Lucifer',em:'sowonboxx@gmail.com',ph:'06 30 33 01 86',no:1,code:'C8R7',tier:'staff',coupe:30},
 {nm:'Sengnokham Obmalay',em:'s.obmalay@gmail.com',ph:'07 86 06 24 27',no:2,code:'GYK7',tier:'membre',coupe:30},
 {nm:'Claire Martin',em:'claire.m@gmail.com',ph:'06 12 44 87 10',no:7,code:'K8RT',tier:'vip',coupe:null},
 {nm:'Louis Bernard',em:'louis.b@orange.fr',ph:'06 98 22 41 05',tier:null}];
const N=n=>String(n).padStart(3,'0'),CLS=p=>p.tier==='vip'?'g':p.tier==='staff'?'s':'';
const MINI=p=>!p.tier?'<div class="mini m-none">Pas de carte</div>':`<div class="mini m-${p.tier==='vip'?'gold':p.tier==='staff'?'staff':'nav'}"><i>DREVICI OYSTER</i><img src="gentleman.png"><b>CLUB · ${p.code}</b></div>`;
const NO=p=>p.tier?`<div class="nA ${CLS(p)}"><small>N°</small>${N(p.no)}</div>`:'';
const TXT=(p,extra='')=>`<div class="mid"><div class="nm">${p.nm}</div><small>${p.em}</small><small>${p.ph}</small>${p.tier?`<small class="code">CLUB-${p.code}${extra}</small>`:''}</div>`;
const V=[
 ['1 · Pastille verte sous le numéro','Juste une pastille verte « 🥂 30 j » sous le N°. On offre la coupe depuis la fiche (clic sur la carte). Le plus épuré.',p=>`<div class="c">${MINI(p)}${NO(p)}${p.coupe?'<span class="gp r1">🥂 30 j</span>':''}${TXT(p)}</div>`],
 ['2 · Bouton vert compact en bas à droite','Un seul bouton vert « 🥂 Offrir · 30 j » aligné sur la ligne du code, dans la carte. Même hauteur que les autres.',p=>`<div class="c">${MINI(p)}${NO(p)}${p.coupe?'<span class="r2"><span class="gb">🥂 Offrir · 30 j</span></span>':''}${TXT(p)}</div>`],
 ['3 · Pastille + petit bouton sur la ligne du code','La pastille verte et un petit bouton bleu côte à côte, à la hauteur du code.',p=>`<div class="c">${MINI(p)}${NO(p)}${p.coupe?'<span class="r2"><span class="gp">🥂 30 j</span><span class="gbn">Offrir</span></span>':''}${TXT(p)}</div>`],
 ['4 · Sur la mini carte + texte sur la ligne du code','Un badge vert « 🥂 » posé sur la mini carte, et « · coupe à offrir (30 j) » en vert à la suite du code. Pas de bouton : on offre depuis la fiche.',p=>`<div class="c"><div style="position:relative;flex:none">${MINI(p)}${p.coupe?'<span class="mbadge">🥂</span>':''}</div>${NO(p)}${TXT(p,p.coupe?' <span class="inl">· coupe à offrir (30 j)</span>':'')}</div>`],
];
document.getElementById('out').innerHTML=V.map(([t,d,f])=>`<div class="v"><h2>${t}</h2><p>${d}</p><div class="pg"><div class="grid">${P.map(f).join('')}</div></div></div>`).join('');
</script></body></html>
