<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 540" width="856" height="540">
<!-- Rue parisienne dessinée pour Drevici (création originale, libre d'usage) -->
<defs>
  <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6dfa9"/><stop offset="1" stop-color="#e9bd6c"/></linearGradient>
  <linearGradient id="sol" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c79a57"/><stop offset="1" stop-color="#5a3c1c"/></linearGradient>
  <pattern id="hach" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="6" stroke="#6b4a22" stroke-width=".7" opacity=".35"/></pattern>
  <pattern id="pav" width="34" height="16" patternUnits="userSpaceOnUse"><path d="M0 15 Q8 3 17 15 M17 7 Q25 -5 34 7 M-17 7 Q-9 -5 0 7" fill="none" stroke="#3e2912" stroke-width="1.2" opacity=".55"/></pattern>
  <g id="fen"><rect width="26" height="40" fill="#8a6131"/><rect x="2" y="2" width="22" height="36" fill="#f3d79d"/><line x1="13" y1="2" x2="13" y2="38" stroke="#6b4a22" stroke-width="1.5"/><line x1="2" y1="16" x2="24" y2="16" stroke="#6b4a22" stroke-width="1.2"/><path d="M-3 40 h32 v6 h-32z" fill="#6b4a22"/><path d="M-1 46 v8 M5 46 v8 M11 46 v8 M17 46 v8 M23 46 v8 M27 46 v8" stroke="#6b4a22" stroke-width="1"/><path d="M-3 54 h32" stroke="#6b4a22" stroke-width="1.6"/></g>
</defs>
<rect width="856" height="540" fill="url(#ciel)"/>
<!-- immeubles du fond -->
<g stroke="#6b4a22" stroke-width="1.5">
  <rect x="-10" y="20" width="300" height="340" fill="#efcf90"/>
  <rect x="290" y="0" width="300" height="360" fill="#ecc785"/>
  <rect x="590" y="30" width="280" height="330" fill="#efcf90"/>
  <path d="M-10 20 h300 M290 0 h300 M590 30 h280" stroke-width="4"/>
</g>
<rect x="-10" y="0" width="880" height="360" fill="url(#hach)"/>
<!-- fenêtres -->
<g>
  <use href="#fen" x="30" y="50"/><use href="#fen" x="110" y="50"/><use href="#fen" x="190" y="50"/>
  <use href="#fen" x="30" y="150"/><use href="#fen" x="110" y="150"/><use href="#fen" x="190" y="150"/>
  <use href="#fen" x="330" y="30"/><use href="#fen" x="410" y="30"/><use href="#fen" x="490" y="30"/>
  <use href="#fen" x="330" y="130"/><use href="#fen" x="410" y="130"/><use href="#fen" x="490" y="130"/>
  <use href="#fen" x="630" y="60"/><use href="#fen" x="710" y="60"/><use href="#fen" x="790" y="60"/>
  <use href="#fen" x="630" y="160"/><use href="#fen" x="710" y="160"/><use href="#fen" x="790" y="160"/>
</g>
<!-- corniches -->
<g stroke="#6b4a22" stroke-width="2" fill="#d9ad66"><rect x="-10" y="236" width="300" height="10"/><rect x="290" y="226" width="300" height="10"/><rect x="590" y="246" width="280" height="10"/></g>
<!-- boutiques et stores -->
<g stroke="#5a3c1c" stroke-width="1.5">
  <rect x="10" y="270" width="250" height="90" fill="#7a5226"/><rect x="20" y="290" width="230" height="70" fill="#e9c27c"/>
  <path d="M5 262 h260 l-12 26 h-236z" fill="#c76b3a"/><path d="M30 262 v26 M55 262 v26 M80 262 v26 M105 262 v26 M130 262 v26 M155 262 v26 M180 262 v26 M205 262 v26 M230 262 v26" stroke="#f3d79d" stroke-width="5" opacity=".7"/>
  <rect x="310" y="262" width="260" height="98" fill="#7a5226"/><rect x="322" y="282" width="236" height="78" fill="#efcf90"/>
  <path d="M305 254 h270 l-12 24 h-246z" fill="#b5602f"/>
  <rect x="610" y="276" width="240" height="84" fill="#7a5226"/><rect x="620" y="294" width="220" height="66" fill="#e9c27c"/>
  <path d="M605 268 h250 l-12 22 h-226z" fill="#c76b3a"/><path d="M630 268 v22 M660 268 v22 M690 268 v22 M720 268 v22 M750 268 v22 M780 268 v22 M810 268 v22" stroke="#f3d79d" stroke-width="5" opacity=".7"/>
</g>
<text x="440" y="250" text-anchor="middle" font-family="Georgia,serif" font-size="14" letter-spacing="4" fill="#5a3c1c">HUÎTRES · VINS</text>
<!-- silhouettes -->
<g fill="#8a5a2c" opacity=".55">
  <circle cx="345" cy="300" r="7"/><rect x="338" y="306" width="14" height="40" rx="5"/><path d="M336 294 h18 l-3 -10 h-12z"/>
  <circle cx="520" cy="304" r="7"/><path d="M510 310 h20 l6 40 h-32z"/><path d="M508 300 q12 -14 24 0z"/>
  <circle cx="700" cy="306" r="6"/><rect x="694" y="311" width="12" height="36" rx="5"/>
</g>
<!-- sol pavé -->
<rect x="0" y="360" width="856" height="180" fill="url(#sol)"/>
<rect x="0" y="360" width="856" height="180" fill="url(#pav)"/>
<rect x="0" y="360" width="856" height="180" fill="url(#hach)" opacity=".6"/>
<!-- réverbère -->
<g stroke="#2e1f0e" fill="#2e1f0e"><rect x="96" y="120" width="8" height="300"/><rect x="88" y="410" width="24" height="12" rx="3"/><path d="M86 120 h28 l-6 -26 h-16z" fill="#f6dfa9" stroke-width="2"/><path d="M84 94 h32 l-8 -10 h-16z"/><circle cx="100" cy="80" r="4"/><path d="M104 160 q30 -8 40 6" fill="none" stroke-width="4"/></g>
<!-- oiseaux -->
<g fill="none" stroke="#6b4a22" stroke-width="1.6"><path d="M640 20 q6 -6 12 0 q6 -6 12 0"/><path d="M690 40 q5 -5 10 0 q5 -5 10 0"/><path d="M180 30 q5 -5 10 0 q5 -5 10 0"/></g>
</svg>
