<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accueil mobile · complet</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#d9d4ca;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.row{display:flex;gap:28px;padding:28px;align-items:flex-start}
.col h2{font-size:21px;margin:0 0 12px;font-weight:800;color:#16181d}
.ph{--bg:#f5f3ef;--card:#fff;--ink:#16181d;--mut:#6b7080;--line:#ece8e0;--brand:#1E3A8A;width:390px;background:var(--bg);color:var(--ink);border-radius:34px;padding:18px 16px 26px;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.ph.dark{--bg:#121418;--card:#1c1f25;--ink:#eef0f4;--mut:#9aa0ad;--line:#2a2e36;--brand:#1E3A8A}
.hd{display:flex;align-items:center;gap:10px;margin:4px 2px 14px}.hd .lg{width:42px;height:42px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
.hd b{font-family:Georgia,serif;font-size:19px;letter-spacing:.02em}.hd small{display:block;color:#1a8f4a;font-size:12.5px;font-weight:600}
.resa{background:var(--brand);color:#fff;border-radius:22px;padding:14px 16px;margin-bottom:14px}
.resa .t{display:flex;justify-content:space-between;font-weight:700;font-size:15px}.resa .t a{font-size:13px}
.resa .k{display:flex;gap:10px;margin:10px 0 8px}.resa .k div{flex:1;background:rgba(255,255,255,.12);border-radius:14px;padding:9px 12px}.resa .k b{font-size:22px}.resa .k small{display:block;font-size:12px;opacity:.8}
.resa .nx{display:flex;gap:10px;background:rgba(255,255,255,.12);border-radius:12px;padding:9px 12px;font-size:14px;margin-top:6px}.resa .nx b{width:44px}
.sec{font-size:14px;font-weight:600;color:var(--mut);margin:20px 6px 8px}
.list{background:var(--card);border-radius:22px;padding:2px 16px}
.li{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line)}.li:first-child{border-top:0}
.ic{flex:none;width:26px;display:grid;place-items:center}.ic svg{width:23px;height:23px}
.li div{flex:1;min-width:0}.li b{display:block;font-size:16.5px;font-weight:600}.li small{display:block;font-size:13.5px;font-weight:500;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.chev{color:#b0b3bb;font-size:22px;line-height:1}
.sel{position:relative;display:flex;align-items:center;gap:8px;color:var(--mut);font-size:16px;font-weight:500}
.mono .ic{color:var(--ink)!important}
.sel select{position:absolute;inset:0;opacity:0}.sel svg{width:14px;height:14px}
</style></head><body><div class="row">
<div class="col"><h2>Thème clair</h2><div class="ph" id="a"></div></div>
<div class="col"><h2>Thème sombre (même page)</h2><div class="ph dark" id="b"></div></div>
<div class="col"><h2>Sombre · icônes sans couleur</h2><div class="ph dark mono" id="c"></div></div>
<div class="col"><h2>Clair · icônes sans couleur</h2><div class="ph mono" id="d"></div></div>
</div><script>const P={
  resa:'<path d="M4 7h16v13H4z"/><path d="M4 11h16M9 3v4M15 3v4"/>',stats:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',boost:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/>',jour:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  carte:'<path d="M3 5.6c3.2-1.2 6.2-.9 9 1.2 2.8-2.1 5.8-2.4 9-1.2V19c-3.2-1.1-6.2-.8-9 1.2-2.8-2-5.8-2.3-9-1.2z"/><path d="M12 6.8v13.4"/><path d="M6 9.5h3M6 12.5h3M15 9.5h3M15 12.5h3"/>',
spe:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h10M7 13h7"/>',share:'<path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/>',
  post:'<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".8" fill="currentColor"/>',mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
  vue:'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',compte:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  etab:'<path d="M3 10.5 12 4l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',hor:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  res:'<circle cx="6" cy="12" r="2.3"/><circle cx="18" cy="6" r="2.3"/><circle cx="18" cy="18" r="2.3"/><path d="M8 11l8-4M8 13l8 4"/>',acc:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>',
  plats:'<path d="M4 18h16M6 18a6 6 0 0 1 12 0M12 9V7M10 7h4"/>',pres:'<rect x="3" y="4" width="7" height="7" rx="1.5"/><rect x="14" y="4" width="7" height="7" rx="1.5"/><rect x="3" y="15" width="7" height="5" rx="1.5"/><rect x="14" y="15" width="7" height="5" rx="1.5"/>',
  coul:'<circle cx="13.5" cy="6.5" r="1"/><circle cx="17.5" cy="10.5" r="1"/><circle cx="8.5" cy="7.5" r="1"/><circle cx="6.5" cy="12.5" r="1"/><path d="M12 2a10 10 0 0 0 0 20c1.1 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.4-.5-.8-.5-1.3 0-1.1.9-2 2-2h2.4A5.6 5.6 0 0 0 22 9.8C22 5.5 17.5 2 12 2z"/>',
  sauv:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 4v4h4"/>',hist:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',lune:'<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>',ecran:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',
  tap:'<path d="M9 11V6a2 2 0 0 1 4 0v5"/><path d="M13 10a2 2 0 0 1 4 0v2a6 6 0 0 1-6 6h-1a5 5 0 0 1-4-2l-2.5-3.5a1.6 1.6 0 0 1 2.5-2L9 14"/>',mega:'<path d="M3 11v2a1 1 0 0 0 1 1h3l6 4V6L7 10H4a1 1 0 0 0-1 1z"/><path d="M17 9a4 4 0 0 1 0 6"/>',tiktok:'<path d="M14 3v11a4 4 0 1 1-4-4"/><path d="M14 3c.5 2.5 2.5 4.5 5 5"/>',fb:'<rect x="3" y="3" width="18" height="18" rx="4"/><path d="M15 8h-2a2 2 0 0 0-2 2v11M9 13h6"/>',table:'<path d="M3 10h18M6 10v9M18 10v9"/><path d="M5 10l1-4h12l1 4"/>',link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',up:'<path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20a7 7 0 0 1 14 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14a5 5 0 0 1 6 5"/>',star:'<path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/>',gift:'<rect x="3" y="8" width="18" height="13" rx="2"/><path d="M12 8v13M3 12h18"/><path d="M12 8C10 4 6 4 6 6.5S9 8 12 8c3 0 6-.5 6-1.5S14 4 12 8z"/>',check:'<path d="m5 12 5 5L20 7"/>',arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  alert:'<circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/>',out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/>'
};
const I=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${P[k]||''}</svg>`;
const M=[['carte','Ma carte','Modifier · Exporter','#1E5AA8'],['spe','Mes menus','Menu du jour · Menus personnalisés','#B4561B'],['mail','Communication','Réseaux sociaux · Table Boost · Emails','#7B3FB8']];
const R=[['etab','Mon établissement','Informations générales','#2E7D4F'],['acc','Mon site','Accueil · Menu · Couleurs','#C0392B']];
const A=[['vue','Statistiques','Scans des QR codes · visites du site','#0E8A8A'],['sauv','Sécurité','Sauvegardes · Historique','#5B6170']];
const hd=`<div class="hd"><div class="lg">DO</div><div><b>DREVICI OYSTER</b><small>● Ouvert aujourd'hui · 17h–2h</small></div></div>
<div class="resa"><div class="t">Réservations · aujourd'hui <a>Tout voir →</a></div><div class="k"><div><small>Midi</small><b>3</b> résas</div><div><small>Soir</small><b>5</b> résas</div></div><div class="nx"><b>19:30</b>Martin · 4 pers.</div><div class="nx"><b>20:00</b>Léa B. · 2 pers.</div></div>`;
const li=([k,t,s,c])=>`<div class="li"><span class="ic" style="color:${c}">${I(k)}</span><div><b>${t}</b><small>${s}</small></div><span class="chev">›</span></div>`;
const theme=v=>`<div class="list"><div class="li"><span class="ic" style="color:#6E56CF">${I('lune')}</span><div><b>Apparence</b></div><label class="sel">${v}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9l5-5 5 5M7 15l5 5 5-5"/></svg><select><option>Système</option><option>Clair</option><option>Sombre</option></select></label></div></div>`;
const page=v=>hd+`<div class="sec" style="margin-top:6px">Au quotidien</div><div class="list">${M.map(li).join('')}</div><div class="sec">Réglages</div><div class="list">${R.map(li).join('')}</div><div class="sec">Autres</div><div class="list">${A.map(li).join('')}</div><div class="sec">Thème</div>${theme(v)}`;
a.innerHTML=page('Système'); b.innerHTML=page('Sombre'); c.innerHTML=page('Sombre'); d.innerHTML=page('Clair');
document.body.dataset.bad=JSON.stringify([...document.querySelectorAll('.li small')].filter(e=>e.scrollWidth>e.clientWidth).map(e=>e.textContent));
</script></body></html>
