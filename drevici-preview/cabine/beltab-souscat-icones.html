<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sous-catégories · icônes</title>
<style>
:root{--bg:#f5f3ef;--card:#fff;--soft:#f1eee8;--ink:#16181d;--mut:#6b7080;--line:#ece8e0;--brand:#1E3A8A;--brand-soft:#e2e7f2;--red:#d93025;--gold:#E3A22B}
*{box-sizing:border-box}body{margin:0;background:#e7e2d8;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;padding:26px}
.v{display:grid;grid-template-columns:640px 360px;gap:26px;margin-bottom:34px;align-items:start}
h2{grid-column:1/-1;font-size:19px;margin:0 0 -14px;font-weight:800}h2 small{font-size:13.5px;color:#555;font-weight:500;margin-left:8px}
.lab{font-size:12px;font-weight:700;color:#777;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
svg{width:18px;height:18px}
.card{background:var(--card);border-radius:22px;padding:4px 16px 8px}
.ph{background:var(--bg);border-radius:28px;padding:12px}.ph .card{padding:4px 12px 6px}
.sc{border-top:1px solid var(--line);padding:6px 0}.sc:first-child{border:0}
.h{display:flex;align-items:center;gap:6px;margin:8px 0 4px}
.nm{flex:1;min-width:0;background:var(--soft);border-radius:13px;padding:11px 14px;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.off .nm{color:#9aa0ad}.pill{font-size:11px;font-weight:800;background:var(--soft);color:var(--mut);border-radius:99px;padding:3px 8px}
.ib{width:38px;height:38px;border-radius:11px;background:var(--soft);display:grid;place-items:center;color:var(--ink);flex:none}.ib.r{color:var(--red)}.ib.g{background:none}
.grp{display:flex;background:var(--soft);border-radius:12px;padding:2px}.grp span{width:36px;height:36px;display:grid;place-items:center;border-left:1px solid #e3dfd6}.grp span:first-child{border:0}.grp .r{color:var(--red)}
.tg{width:40px;height:24px;border-radius:99px;background:#34c759;position:relative;flex:none}.tg:after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;top:2px;left:18px;box-shadow:0 1px 2px rgba(0,0,0,.2)}.tg.no{background:#d8d4cc}.tg.no:after{left:2px}
.it{display:flex;align-items:center;gap:12px;padding:10px 2px;border-top:1px solid var(--line);font-size:15px;font-weight:600}.it i{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#d9cfbf,#bfb29c);flex:none}.it span{flex:1}.it b{font-weight:650;font-size:14px}
.menu{position:absolute;right:0;top:44px;background:#fff;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.16);padding:6px;width:200px;z-index:2}.menu div{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;font-size:14.5px;font-weight:600}.menu div.r{color:var(--red)}.menu div+div{border-top:1px solid var(--line)}
.rel{position:relative}
.tip{font-size:12px;color:var(--mut);font-weight:600;margin-left:2px}
</style></head><body><div id="r"></div><script>const P={
  resa:'<path d="M4 7h16v13H4z"/><path d="M4 11h16M9 3v4M15 3v4"/>',stats:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',boost:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/>',jour:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
carte:'<path d="M3 5.6c3.2-1.2 6.2-.9 9 1.2 2.8-2.1 5.8-2.4 9-1.2V19c-3.2-1.1-6.2-.8-9 1.2-2.8-2-5.8-2.3-9-1.2z"/><path d="M12 6.8v13.4"/><path d="M6 9.5h3M6 12.5h3M15 9.5h3M15 12.5h3"/>',
spe:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h10M7 13h7"/>',share:'<path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/>',
  post:'<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".8" fill="currentColor"/>',mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
  vue:'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',compte:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  etab:'<path d="M3 10.5 12 4l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',hor:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  res:'<circle cx="6" cy="12" r="2.3"/><circle cx="18" cy="6" r="2.3"/><circle cx="18" cy="18" r="2.3"/><path d="M8 11l8-4M8 13l8 4"/>',acc:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>',
  plats:'<path d="M4 18h16M6 18a6 6 0 0 1 12 0M12 9V7M10 7h4"/>',pres:'<rect x="3" y="4" width="7" height="7" rx="1.5"/><rect x="14" y="4" width="7" height="7" rx="1.5"/><rect x="3" y="15" width="7" height="5" rx="1.5"/><rect x="14" y="15" width="7" height="5" rx="1.5"/>',
  coul:'<circle cx="13.5" cy="6.5" r="1"/><circle cx="17.5" cy="10.5" r="1"/><circle cx="8.5" cy="7.5" r="1"/><circle cx="6.5" cy="12.5" r="1"/><path d="M12 2a10 10 0 0 0 0 20c1.1 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.4-.5-.8-.5-1.3 0-1.1.9-2 2-2h2.4A5.6 5.6 0 0 0 22 9.8C22 5.5 17.5 2 12 2z"/>',
  sauv:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 4v4h4"/>',hist:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',lune:'<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>',ecran:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',
  tap:'<path d="M9 11V6a2 2 0 0 1 4 0v5"/><path d="M13 10a2 2 0 0 1 4 0v2a6 6 0 0 1-6 6h-1a5 5 0 0 1-4-2l-2.5-3.5a1.6 1.6 0 0 1 2.5-2L9 14"/>',mega:'<path d="M3 11v2a1 1 0 0 0 1 1h3l6 4V6L7 10H4a1 1 0 0 0-1 1z"/><path d="M17 9a4 4 0 0 1 0 6"/>',tiktok:'<path d="M14 3v11a4 4 0 1 1-4-4"/><path d="M14 3c.5 2.5 2.5 4.5 5 5"/>',fb:'<rect x="3" y="3" width="18" height="18" rx="4"/><path d="M15 8h-2a2 2 0 0 0-2 2v11M9 13h6"/>',table:'<path d="M3 10h18M6 10v9M18 10v9"/><path d="M5 10l1-4h12l1 4"/>',link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',up:'<path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20a7 7 0 0 1 14 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14a5 5 0 0 1 6 5"/>',star:'<path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/>',gift:'<rect x="3" y="8" width="18" height="13" rx="2"/><path d="M12 8v13M3 12h18"/><path d="M12 8C10 4 6 4 6 6.5S9 8 12 8c3 0 6-.5 6-1.5S14 4 12 8z"/>',check:'<path d="m5 12 5 5L20 7"/>',arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  alert:'<circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/>',out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/>'
};
P.trash='<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>';P.eye='<path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>';P.eyeoff='<path d="M3 3l18 18M10.6 6.2A9.7 9.7 0 0 1 12 6c6 0 9.5 6 9.5 6a17 17 0 0 1-3 3.6M6.2 7.8C3.8 9.5 2.5 12 2.5 12S6 18 12 18c1.6 0 3-.4 4.2-1"/>';P.up='<path d="M12 19V5M6 11l6-6 6 6"/>';P.down='<path d="M12 5v14M6 13l6 6 6-6"/>';P.dots='<circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/>';
const I=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${P[k]||''}</svg>`;
const items=(a)=>a.map(([n,p])=>`<div class="it"><i></i><span>${n}</span><b>${p}</b></div>`).join('');
const A=[['Capitaine','45 €'],['Duo champagne','40 €']], B=[['Solo champagne','20 €'],['Mousaillon','22 €']];
const V=[
 ['1 · Icônes séparées','Monter, descendre, œil, corbeille : chaque action a son petit bouton.',
  (m,off)=>`<div class="h ${off?'off':''}"><div class="nm">${m?'À partager':'À partager'}</div>${m?'':`<span class="ib">${I('up')}</span><span class="ib">${I('down')}</span>`}<span class="ib">${I(off?'eyeoff':'eye')}</span><span class="ib r">${I('trash')}</span></div>`],
 ['2 · Une barre d\'icônes groupées','Les actions réunies dans une seule pastille, plus calme visuellement.',
  (m,off)=>`<div class="h ${off?'off':''}"><div class="nm">À partager</div><div class="grp">${m?'':`<span>${I('up')}</span><span>${I('down')}</span>`}<span>${I(off?'eyeoff':'eye')}</span><span class="r">${I('trash')}</span></div></div>`],
 ['3 · Interrupteur + corbeille','Comme la fiche plat : l\'interrupteur dit si la sous-catégorie est visible.',
  (m,off)=>`<div class="h ${off?'off':''}"><div class="nm">À partager</div>${m?'':`<span class="ib g">${I('up')}</span><span class="ib g">${I('down')}</span>`}<span class="tg ${off?'no':''}"></span><span class="ib g r">${I('trash')}</span></div>`],
 ['4 · Menu « … »','Une seule icône ; un clic ouvre les actions (ici ouvert sur la 2e sous-catégorie).',
  (m,off,open)=>`<div class="h rel ${off?'off':''}"><div class="nm">${off?'Plaisir solitaire':'À partager'}</div>${off?'<span class="pill">Masquée</span>':''}<span class="ib">${I('dots')}</span>${open?`<div class="menu"><div>${I('up')}Monter</div><div>${I('down')}Descendre</div><div>${I('eye')}Afficher</div><div class="r">${I('trash')}Supprimer</div></div>`:''}</div>`]
];
r.innerHTML=V.map(([t,d,f],k)=>`<div class="v"><h2>${t}<small>${d}</small></h2>
 <div><div class="lab">Ordinateur</div><div class="card"><div class="sc">${f(false,false)}${items(A)}</div><div class="sc">${(k===3?f(false,true,true):f(false,true)).replace('À partager','Plaisir solitaire')}${items(B)}</div></div></div>
 <div><div class="lab">Téléphone</div><div class="ph"><div class="card"><div class="sc">${f(true,false)}${items(A)}</div><div class="sc">${f(true,true).replace('À partager','Plaisir solitaire')}${items(B)}</div></div></div></div></div>`).join('');
</script></body></html>
