<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Club · « Plus tard » compte à rebours</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;background:#e9e5dc;font-family:Inter,sans-serif;color:#16181d;padding:28px;-webkit-font-smoothing:antialiased}
h1{margin:0 0 4px;font-size:26px;letter-spacing:-.02em}.sub{margin:0 0 22px;color:#666;font-size:14px}
.g{display:grid;grid-template-columns:repeat(4,390px);gap:28px;align-items:start}
.lab b{font-size:16px}.lab span{display:block;color:#666;font-size:12.5px;margin:3px 0 10px;line-height:1.4;min-height:52px}
.sheet{background:#f5f1ea;border-radius:26px;padding:12px 22px 22px;box-shadow:0 20px 40px -18px rgba(0,0,0,.35)}
.grab{width:42px;height:5px;border-radius:9px;background:#d4cec3;margin:0 auto 12px}
.wel{text-align:center}
.wt{font-family:'Playfair Display',serif;font-size:24px;color:#10285e;font-weight:700;margin-top:4px}
.ws{font-size:13.5px;color:#6b7080;margin:4px 0 12px}
.ig{background:#fff;border-radius:16px;padding:14px}.ig>b{display:block;font-size:15px;color:#10285e}.ig>span{display:block;font-size:13px;color:#6b7080;margin:4px 0 6px;line-height:1.4}
.cta{display:block;width:100%;border:0;background:#10285e;color:#fff;border-radius:999px;padding:15px;font-weight:600;font-size:15.5px;text-align:center;text-decoration:none}
.iga{display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(90deg,#f58529,#dd2a7b 50%,#8134af)}
.later{background:none;border:0;color:#6b7080;font-size:13.5px;margin-top:10px;padding:6px;font-family:inherit}

/* Tas de photos qui tourne (droite → gauche), cliquable vers Instagram */
.pile{position:relative;display:block;height:226px;margin:8px 0 12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.pol{position:absolute;left:50%;top:22px;width:150px;background:#fffdf8;padding:8px 8px 30px;box-shadow:0 8px 18px -6px rgba(0,0,0,.35),0 1px 2px rgba(0,0,0,.15);transition:transform .9s cubic-bezier(.45,.05,.25,1),box-shadow .9s;will-change:transform}
.pol img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.pol i{position:absolute;left:0;right:0;bottom:6px;font-family:Caveat,cursive;font-style:normal;font-weight:700;font-size:18px;color:#10285e;text-align:center}
.pol:before{content:"";position:absolute;top:-9px;left:50%;width:54px;height:18px;transform:translateX(-50%) rotate(-3deg);background:rgba(240,217,168,.75);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.pol.f{transform:translateX(-50%) translateY(-14px) rotate(2deg) scale(1.06);z-index:3;box-shadow:0 16px 26px -8px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.15)}
.pol.r{transform:translateX(calc(-50% + 92px)) rotate(9deg) scale(.9);z-index:2}
.pol.l{transform:translateX(calc(-50% - 92px)) rotate(-8deg) scale(.9);z-index:1}
.pile:after{content:"Voir sur Instagram ›";position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);font-size:11px;font-weight:600;color:#8a7a5a;letter-spacing:.04em}

/* 4 versions du compte à rebours */
.dl{border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.5;margin-bottom:14px}
.d1{background:radial-gradient(120% 140% at 85% 10%,#2a4a8f 0%,#10285e 50%,#0a1838 100%);color:#dfe6f5;position:relative;overflow:hidden}
.d1 b{color:#f0d9a8}.d1 .n{font-size:16px}
.d1:after,.d2:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.22) 50%,transparent 65%);transform:translateX(-100%);animation:shine 3.5s ease-in-out infinite}
@keyframes shine{0%,55%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.d2{background:linear-gradient(125deg,#d4b06a 0%,#ecd39a 30%,#dcbd7c 50%,#f0dba8 68%,#cfa962 100%);color:#3a2a0c;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(80,55,15,.25)}
.d2 b{color:#2b1f0b}
.d3{display:flex;align-items:center;gap:14px;text-align:left;background:#fff;padding:10px 14px}
.d3 .big{flex:none;width:62px;height:62px;border-radius:50%;background:#10285e;color:#fff;display:grid;place-items:center;line-height:1;font-family:'Playfair Display',serif;font-weight:800;font-size:26px;box-shadow:0 0 0 3px #f5f1ea,0 0 0 4.5px #c9a24f}
.d3 .big small{display:block;font-family:Inter,sans-serif;font-size:8px;font-weight:700;letter-spacing:.18em;margin-top:2px;color:#f0d9a8}
.d3 .t{color:#16181d;font-size:13.5px}.d3 b{color:#10285e}
.d4{background:#d6413b;color:#fff;position:relative}
.d4 b{color:#fff;text-decoration:underline;text-decoration-color:rgba(255,255,255,.55);text-underline-offset:3px}
.d4 .pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:#fff;margin-right:7px;vertical-align:1px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
</style></head><body>
<h1>Écran « Plus tard » · tas de photos qui tourne + 4 comptes à rebours</h1>
<p class="sub">Les photos glissent de droite à gauche toutes les 3 secondes (la photo de devant part derrière). Un clic sur les photos ouvre Instagram. 4 styles pour l'encart « Plus que 30 jours ».</p>
<div class="g" id="g"></div>
<script>
const P=[['../club/photos/drevici-1.webp','En mer'],['../club/photos/drevici-2.webp','L\'équipe'],['../club/photos/drevici-3.webp','À table !']];
const L1='Plus que <b class="n">30 jours</b> pour en profiter,', L2='jusqu\'au <b>11 novembre</b>, venez vite !';
const V=[
 ['1 · Bleu nuit et or','Le bleu de la carte membre, chiffres en or, avec un reflet qui passe de temps en temps.',`<div class="dl d1">${L1}<br>${L2}</div>`],
 ['2 · Or brossé','L\'or de la carte Gold, texte brun foncé, même reflet. Le plus « premium ».',`<div class="dl d2">${L1}<br>${L2}</div>`],
 ['3 · Le compteur','Un gros « 30 JOURS » dans un médaillon bleu cerclé d\'or, le texte à côté sur 2 lignes. Le plus lisible.',`<div class="dl d3"><div class="big"><div>30<small>JOURS</small></div></div><div class="t">Pour profiter de votre coupe,<br>jusqu'au <b>11 novembre</b>, venez vite !</div></div>`],
 ['4 · Rouge Drevici','Le rouge du logo, texte blanc et un petit point qui clignote : ça crée l\'urgence.',`<div class="dl d4"><span class="pulse"></span>${L1.replace('<b class="n">','<b>')}<br>${L2}</div>`],
];
const pile=()=>`<a class="pile" href="https://instagram.com/drevicioysterbar" target="_blank" rel="noopener" aria-label="Voir nos photos sur Instagram">${P.map(([s,t],i)=>`<div class="pol ${['f','r','l'][i]}"><img src="${s}" alt=""><i>${t}</i></div>`).join('')}</a>`;
document.getElementById('g').innerHTML=V.map(([t,d,dl])=>`<div><div class="lab"><b>${t}</b><span>${d}</span></div>
<div class="sheet"><div class="grab"></div><div class="wel">
 <div class="wt">Pas de souci !</div><div class="ws">Votre carte vous attend, et votre coupe aussi…</div>
 ${dl}
 <div class="ig"><b>En attendant, suivez-nous sur Instagram</b><span>Jeux et cadeaux à gagner, soirées et nouveautés en avant-première.</span>
  ${pile()}
  <a class="cta iga"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>Suivre @drevicioysterbar</a></div>
 <a class="cta" style="margin-top:12px">Réserver ma table</a>
 <button class="later">Fermer</button></div></div></div>`).join('');
// rotation : droite → devant → gauche → (derrière) droite
setInterval(()=>document.querySelectorAll('.pile').forEach(p=>p.querySelectorAll('.pol').forEach(c=>{const k=c.classList.contains('f')?'l':c.classList.contains('r')?'f':'r';c.classList.remove('f','r','l');c.classList.add(k);})),3000);
</script>
</body></html>
