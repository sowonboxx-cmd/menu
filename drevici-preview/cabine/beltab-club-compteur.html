<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Club · compteur inversé</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
*{box-sizing:border-box}body{margin:0;background:#e9e5dc;font-family:Inter,sans-serif;color:#16181d;padding:28px;-webkit-font-smoothing:antialiased}
h1{margin:0 0 4px;font-size:26px;letter-spacing:-.02em}.sub{margin:0 0 22px;color:#666;font-size:14px}
.g{display:grid;grid-template-columns:repeat(4,390px);gap:28px;align-items:start}
.lab b{font-size:16px}.lab span{display:block;color:#666;font-size:12.5px;margin:3px 0 10px;line-height:1.4;min-height:36px}
.sheet{background:#f5f1ea;border-radius:26px;padding:12px 22px 22px;text-align:center;box-shadow:0 20px 40px -18px rgba(0,0,0,.35)}
.grab{width:42px;height:5px;border-radius:9px;background:#d4cec3;margin:0 auto 12px}
.wt{font-family:'Playfair Display',serif;font-size:24px;color:#10285e;font-weight:700;margin-top:4px}.ws{font-size:13.5px;color:#6b7080;margin:4px 0 12px}
.c{display:flex;align-items:center;gap:14px;text-align:left;border-radius:14px;padding:10px 14px;position:relative;overflow:hidden}
.n{flex:none;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;text-align:center;line-height:1;font-family:'Playfair Display',serif;font-weight:800;font-size:26px}
.n small{display:block;font-family:Inter,sans-serif;font-size:8px;font-weight:700;letter-spacing:.18em;margin-top:2px}
.t{font-size:13.5px;line-height:1.5}
.ig{background:#fff;border-radius:16px;padding:14px;margin-top:14px;text-align:center}.ig b{display:block;font-size:15px;color:#10285e}.ig span{display:block;font-size:12px;color:#6b7080;margin-top:4px;white-space:nowrap;letter-spacing:-.01em}
/* 1 */.c1{background:#10285e}.c1 .n{background:#fff;color:#10285e;box-shadow:0 0 0 3px #10285e,0 0 0 4.5px #c9a24f}.c1 .n small{color:#b8945a}.c1 .t{color:#dfe6f5}.c1 b{color:#f0d9a8}
/* 2 */.c2{background:radial-gradient(120% 160% at 90% 0%,#2a4a8f 0%,#10285e 50%,#0a1838 100%)}.c2 .n{background:#fff;color:#10285e}.c2 .n small{color:#6b7080}.c2 .t{color:#fff}.c2 b{color:#fff;text-decoration:underline;text-decoration-color:#f0d9a8;text-underline-offset:3px}
.c2:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.18) 50%,transparent 65%);transform:translateX(-100%);animation:sh 3.5s ease-in-out infinite}
@keyframes sh{0%,55%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
/* 3 */.c3{background:#10285e}.c3 .n{background:linear-gradient(135deg,#f3dc9f,#c9a24f 50%,#f0d58e);color:#2b1f0b;box-shadow:0 2px 6px rgba(0,0,0,.3)}.c3 .n small{color:#5a3f10}.c3 .t{color:#dfe6f5}.c3 b{color:#f0d9a8}
/* 4 */.c4{background:#10285e;box-shadow:inset 0 0 0 1px rgba(240,217,168,.45),inset 0 0 0 5px #10285e,inset 0 0 0 6px rgba(240,217,168,.25)}.c4 .n{background:transparent;color:#fff;box-shadow:inset 0 0 0 1.5px #f0d9a8}.c4 .n small{color:#f0d9a8}.c4 .t{color:#dfe6f5}.c4 b{color:#fff}
</style></head><body>
<h1>Compteur « Plus tard » · couleurs inversées</h1>
<p class="sub">Encart en bleu, médaillon clair. Le sous-titre Instagram tient maintenant sur une ligne (déjà en ligne sur l'aperçu, comme le retrait de « Voir sur Instagram »).</p>
<div class="g" id="g"></div>
<script>
const V=[['1 · Bleu, médaillon blanc cerclé d\'or','Inverse exact de l\'actuel : encart bleu nuit, rond blanc avec un fin cercle doré, date en or.','c1'],
['2 · Bleu brillant, médaillon blanc','Bleu dégradé comme la carte membre, avec un reflet qui passe. Rond blanc tout simple, date soulignée d\'or.','c2'],
['3 · Bleu, médaillon or','Encart bleu nuit, rond en or comme une pièce. Le plus « précieux ».','c3'],
['4 · Bleu encadré, médaillon gravé','Encart bleu avec un double filet doré (comme le cadre des cartes), rond transparent cerclé d\'or, chiffre blanc.','c4']];
document.getElementById('g').innerHTML=V.map(([t,d,c])=>`<div><div class="lab"><b>${t}</b><span>${d}</span></div><div class="sheet"><div class="grab"></div>
<div class="wt">Pas de souci !</div><div class="ws">Votre carte vous attend, et votre coupe aussi…</div>
<div class="c ${c}"><div class="n"><div>30<small>JOURS</small></div></div><div class="t">Pour profiter de votre coupe,<br>jusqu'au <b>11 novembre</b>, venez vite !</div></div>
<div class="ig"><b>En attendant, suivez-nous sur Instagram</b><span>Jeux, cadeaux, soirées, nouveautés en avant-première.</span></div></div></div>`).join('');
</script></body></html>
