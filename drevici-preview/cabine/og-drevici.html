<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@500;600;700&display=swap">
<style>
*{box-sizing:border-box}body{margin:0;background:#888;font-family:Inter,sans-serif}
.og{position:relative;width:1200px;height:630px;overflow:hidden;margin:0 0 20px}
.og .bg{position:absolute;inset:0;background:url(../seo/drevici-parc-aquarelle.jpg) center 40%/cover}
/* A */
.a .sh{position:absolute;inset:0;background:linear-gradient(0deg,rgba(10,24,56,.92) 0%,rgba(16,40,94,.75) 32%,rgba(16,40,94,0) 62%)}
.a .lg{position:absolute;left:52px;bottom:44px;width:210px;filter:drop-shadow(0 8px 18px rgba(0,0,0,.35))}
.a .tx{position:absolute;left:290px;bottom:62px;color:#fff}
.a h1{margin:0;font-family:'Playfair Display',serif;font-weight:800;font-size:62px;letter-spacing:.06em;line-height:1}
.a p{margin:12px 0 0;font-size:24px;font-weight:600;color:#f0d9a8;letter-spacing:.02em}
.a small{display:block;margin-top:10px;font-size:19px;color:#dfe6f5;font-weight:500}
/* B */
.b .lg{position:absolute;right:48px;top:36px;width:250px;filter:drop-shadow(0 10px 22px rgba(16,40,94,.4))}
.b .tag{position:absolute;left:0;bottom:0;right:0;padding:16px 48px;background:rgba(16,40,94,.92);color:#fff;font-size:24px;font-weight:600;letter-spacing:.04em;display:flex;justify-content:space-between}
.b .tag em{font-style:normal;color:#f0d9a8}
/* C */
.c .bg{left:430px}
.c .pn{position:absolute;left:0;top:0;bottom:0;width:430px;background:radial-gradient(120% 140% at 85% 10%,#2a4a8f 0%,#10285e 45%,#0a1838 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;border-right:4px solid #c9a24f}
.c .pn img{width:300px}
.c .pn p{margin:26px 0 0;font-size:22px;font-weight:600;color:#f0d9a8;letter-spacing:.06em;text-transform:uppercase}
.c .pn small{display:block;margin-top:8px;font-size:18px;color:#dfe6f5}
</style></head><body>
<div class="og a" id="A"><div class="bg"></div><div class="sh"></div><img class="lg" src="../charte/files/logos/DreviciOyster-Bar_LogoRond_SansFond.png"><div class="tx"><h1>DREVICI OYSTER BAR</h1><p>Huîtres de Bretagne · en direct de notre parc</p><small>8 rue Biot, Paris 17e · Réservation en ligne</small></div></div>
<div class="og b" id="B"><div class="bg"></div><img class="lg" src="../charte/files/logos/DreviciOyster-Bar_LogoRond_SansFond.png"><div class="tag"><span>Bar à huîtres · <em>Surzur → Paris 17e</em></span><span>Réservez en ligne</span></div></div>
<div class="og c" id="C"><div class="bg"></div><div class="pn"><img src="../charte/files/logos/DreviciOyster-Bar_LogoTexte_Blanc.png"><p>Huîtres de Bretagne</p><small>8 rue Biot · Paris 17e</small></div></div>
</body></html>
