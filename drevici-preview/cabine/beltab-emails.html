<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Templates emails</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap">
<style>
*{box-sizing:border-box}body{margin:0;background:#e7e2d8;font-family:Inter,system-ui,sans-serif;color:#16181d;padding:28px;-webkit-font-smoothing:antialiased}
.row{display:flex;gap:28px;align-items:flex-start;margin-bottom:46px}
.lab{width:100%;margin:0 0 12px}.lab h2{margin:0;font-size:20px;font-weight:800}.lab p{margin:3px 0 0;font-size:13.5px;color:#555}
.desk{width:760px;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.mc{padding:14px 18px;border-bottom:1px solid #eee;font-size:13px;color:#444}.mc b{color:#111}.mc .s{font-size:15px;font-weight:600;color:#111;margin-bottom:4px}
.mbody{background:#f5f3ef;padding:26px 0}
.ph{width:390px;background:#111;border-radius:46px;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.15)}
.ph .scr{background:#f5f3ef;border-radius:36px;overflow:hidden;height:780px;overflow:hidden}
.ph .top{background:#fff;padding:40px 16px 10px;font-size:12.5px;color:#444;border-bottom:1px solid #eee}.ph .top b{color:#111}
/* ===== email ===== */
.em{width:600px;margin:0 auto;background:#fff;border-radius:18px;overflow:hidden;font-family:Inter,Arial,sans-serif;color:#16181d}
.ph .em{width:100%;border-radius:0}
.ehd{text-align:center;padding:22px 20px 18px;font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:22px;letter-spacing:.06em;color:#10285e}
.hero{display:block;width:100%;height:300px;object-fit:cover}
.ph .hero{height:230px}
.pad{padding:26px 34px 30px}.ph .pad{padding:22px 22px 26px}
.kick{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#b8945a;margin:0 0 8px}
.ttl{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:32px;line-height:1.15;margin:0 0 12px;color:#10285e}.ph .ttl{font-size:26px}
.txt{font-size:15.5px;line-height:1.6;color:#3b3f48;margin:0 0 20px}
.cta{display:inline-block;background:#10285e;color:#fff;text-decoration:none;font-weight:600;font-size:15px;padding:14px 26px;border-radius:999px}
.ctaw{text-align:center}
.info{display:flex;gap:10px;margin:0 0 22px}.info div{flex:1;background:#f5f3ef;border-radius:14px;padding:12px 14px}.info small{display:block;font-size:11.5px;color:#6b7080;font-weight:500}.info b{font-size:15px}
.efoot{text-align:center;padding:18px 20px 22px;font-size:12px;color:#8a8f99;line-height:1.6;border-top:1px solid #f0ede7}
.efoot a{color:#8a8f99}
/* plat */
.dish{display:flex;gap:16px;align-items:center;background:#f5f3ef;border-radius:16px;padding:12px;margin:0 0 20px}
.dish img{width:110px;height:110px;border-radius:12px;object-fit:cover}.dish h4{margin:0 0 4px;font-family:'Playfair Display',serif;font-size:19px;color:#10285e}.dish p{margin:0 0 6px;font-size:13.5px;color:#555;line-height:1.45}.dish b{font-size:16px}
/* lettre */
.letter{background:#10285e;color:#fff;text-align:center;padding:44px 34px 40px}.letter .ttl{color:#fff;font-style:italic;font-weight:500;font-size:38px}.ph .letter .ttl{font-size:30px}
.letter .txt{color:rgba(255,255,255,.82)}
.code{display:inline-block;border:1.5px dashed rgba(255,255,255,.5);border-radius:14px;padding:14px 22px;margin:4px 0 22px}.code small{display:block;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.65)}.code b{font-family:'Playfair Display',serif;font-size:26px;letter-spacing:.08em}
.letter .cta{background:#fff;color:#10285e}
/* menu */
.mn{border-top:1px solid #ece8e0;margin:0 0 22px}.mn div{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #ece8e0}.mn span{font-size:15px}.mn span small{display:block;color:#7a7f8a;font-size:13px;margin-top:2px}.mn b{font-family:Inter,Arial,sans-serif;font-weight:600;font-size:15.5px;color:#10285e;white-space:nowrap}
.sec{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#b8945a;margin:16px 0 0}
</style></head><body>
<div id="out"></div>
<script>
const IMG={dj:'../charte/files/mascotte/DreviciOyster_Mascotte_Affiche_Huitres-DJ-Set.webp',vin:'../charte/files/mascotte/DreviciOyster_Mascotte_Affiche_Vins-Champagnes.webp',paris:'../charte/files/animation/DreviciOyster-Paris_LogoAnime_Poster.jpg',open:'../charte/files/mascotte/DreviciOyster_Mascotte_Affiche_Ouvert.webp'};
const foot=`<div class="efoot">Drevici Oyster · 8 rue Biot, 75017 Paris · 09 74 64 05 87<br>Instagram · Site · <a href="#">Se désinscrire</a></div>`;
const hd=`<div class="ehd">DREVICI OYSTER</div>`;
const T=[
 {k:'evt',name:'1 · Événement',desc:'Une grande affiche, la date en évidence, un bouton Réserver. Pour une soirée, un DJ set, une dégustation.',subj:'Jeudi soir : huîtres & DJ set 🎶',
  html:`${hd}<img class="hero" src="${IMG.dj}"><div class="pad"><p class="kick">Jeudi 16 octobre · dès 19 h</p><h1 class="ttl">Huîtres & DJ set</h1><p class="txt">Le temps d'une soirée, le bar se transforme : huîtres à volonté jusqu'à 21 h, vins nature et un DJ aux platines. Les places partent vite.</p><div class="info"><div><small>Quand</small><b>Jeu. 16 oct.</b></div><div><small>Prix</small><b>35 € / pers.</b></div></div><div class="ctaw"><a class="cta">Réserver ma table</a></div></div>${foot}`},
 {k:'plat',name:'2 · Plat du moment',desc:'Le restaurateur choisit un plat de sa carte : photo, nom, prix et description viennent tout seuls.',subj:'Nouveau : le plateau Gentleman',
  html:`${hd}<img class="hero" src="${IMG.paris}"><div class="pad"><p class="kick">Nouveau à la carte</p><h1 class="ttl">Cette semaine, on vous recommande…</h1><div class="dish"><img src="${IMG.vin}"><div><h4>Plateau Gentleman</h4><p>12 huîtres n°3, crevettes, bulots, mayonnaise maison et une coupe de champagne.</p><b>45 €</b></div></div><p class="txt">Servi midi et soir, jusqu'à épuisement des arrivages du matin.</p><div class="ctaw"><a class="cta">Je réserve</a></div></div>${foot}`},
 {k:'lettre',name:'3 · Vous nous manquez',desc:'Une lettre courte, élégante, avec un petit cadeau. Envoyée aux clients pas revenus depuis 60 jours.',subj:'Ça fait longtemps, Will…',
  html:`${hd}<div class="letter"><h1 class="ttl">Ça fait longtemps…</h1><p class="txt">Bonjour Will, votre dernière visite remonte à l'été. Les huîtres de la saison viennent d'arriver : on vous garde une table, et la première coupe est pour nous.</p><div class="code"><small>Votre cadeau</small><b>UNE COUPE OFFERTE</b></div><br><a class="cta">Revenir nous voir</a></div>${foot}`},
 {k:'menu',name:'4 · Menu de la semaine',desc:'Le menu du jour ou de la semaine, repris de l\'admin, mis en page comme une carte imprimée.',subj:'Le menu de la semaine est arrivé',
  html:`${hd}<img class="hero" src="${IMG.open}"><div class="pad"><p class="kick">Du mardi 14 au samedi 18</p><h1 class="ttl">Le menu de la semaine</h1><p class="sec">Entrées</p><div class="mn"><div><span>Huîtres n°3 × 6<small>Citron, vinaigre échalote</small></span><b>14 €</b></div><div><span>Tartare de daurade<small>Agrumes, coriandre</small></span><b>12 €</b></div></div><p class="sec">Plats</p><div class="mn"><div><span>Moules marinières<small>Frites maison</small></span><b>19 €</b></div><div><span>Dos de cabillaud<small>Beurre blanc, poireaux</small></span><b>24 €</b></div></div><div class="ctaw"><a class="cta">Réserver une table</a></div></div>${foot}`},
];
const part=new URLSearchParams(location.search).get('p')||'1';
const list=part==='1'?T.slice(0,2):T.slice(2);
document.getElementById('out').innerHTML=list.map(t=>`<div class="lab"><h2>${t.name}</h2><p>${t.desc}</p></div><div class="row">
 <div class="desk"><div class="mc"><div class="s">${t.subj}</div><b>Drevici Oyster</b> &lt;reservation@beltab.app&gt; · à moi</div><div class="mbody"><div class="em">${t.html}</div></div></div>
 <div class="ph"><div class="scr"><div class="top"><b>Drevici Oyster</b><br>${t.subj}</div><div class="em">${t.html}</div></div></div></div>`).join('');
</script></body></html>
