<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Club · pop-up « Ne cliquez pas ici »</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>*{box-sizing:border-box}body{margin:0;background:#e9e5dc;font-family:Inter,sans-serif;padding:28px;color:#16181d}
h1{margin:0 0 4px;font-size:26px}.sub{margin:0 0 22px;color:#666;font-size:14px;max-width:1200px}
.g{display:grid;grid-template-columns:repeat(4,300px);gap:24px}.lab b{font-size:15px}.lab span{display:block;color:#666;font-size:12.5px;margin:3px 0 10px;min-height:34px}
.ph{width:300px;height:520px;border-radius:34px;background:#f5f1ea;position:relative;overflow:hidden;box-shadow:0 20px 40px -18px rgba(0,0,0,.35)}
.ph:before{content:"";position:absolute;inset:0;background:rgba(10,16,32,.55)}
.pop{position:absolute;left:24px;right:24px;top:110px;background:#fff;border-radius:24px;padding:22px 20px 18px;text-align:center;box-shadow:0 24px 50px -16px rgba(0,0,0,.5);animation:pin .5s cubic-bezier(.2,1.4,.4,1) both}
.pop img{height:120px;margin-top:-70px;filter:drop-shadow(0 8px 12px rgba(0,0,0,.25));animation:wig 1s ease-in-out infinite;transform-origin:50% 90%}
.pop h3{font-family:'Playfair Display',serif;font-size:22px;color:#10285e;margin:8px 0 6px;line-height:1.15}
.pop p{margin:0 0 14px;font-size:14px;color:#44506a}
.bar{height:4px;border-radius:9px;background:#efe9de;overflow:hidden}.bar i{display:block;height:100%;width:60%;background:linear-gradient(90deg,#f58529,#dd2a7b 50%,#8134af)}
.go{font-size:11.5px;color:#8a8f99;margin-top:8px}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes pin{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:none}}
</style></head><body>
<h1>« Ne cliquez pas ici ! » · le pop-up canular</h1>
<p class="sub">S'ouvre en rebondissant, la mascotte se dandine (ici le Gentleman, à remplacer par ton icône), une barre aux couleurs d'Instagram se remplit en 1,5 s, puis on part sur Instagram. 4 propositions de texte.</p>
<div class="g" id="g"></div>
<script>
const V=[['A · On vous avait prévenu','La phrase que tu proposais.','Ah… on vous avait prévenu.','Maintenant, il faut assumer 😏'],
['B · Vous avez cliqué, hein ?','Complice, un peu taquin.','Vous avez cliqué, hein ?','Bon… maintenant, il faut assumer.'],
['C · C\'était un piège','Plus direct, avec la sanction.','Raté, c\'était un piège !','Pour la peine : abonnez-vous 🦪'],
['D · Sans discuter','Le ton du patron.','On vous avait dit de ne pas cliquer…','Direction Instagram, et sans discuter.']];
document.getElementById('g').innerHTML=V.map(([t,d,h,p])=>`<div><div class="lab"><b>${t}</b><span>${d}</span></div><div class="ph"><div class="pop"><img src="gentleman.png"><h3>${h}</h3><p>${p}</p><div class="bar"><i></i></div><div class="go">On vous emmène sur Instagram…</div></div></div></div>`).join('');
</script></body></html>
