<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Charte graphique</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: une charte de maison de bord de mer — page papier, chapitres numérotés, planches de logos sur fonds réels. Look clair assumé, couleurs fixes. */
:root{
  --paper:#fbfaf6; --card:#ffffff; --line:#e4e1d8; --ink:#0d255c; --navy:#253968;
  --text:#1f2633; --muted:#5f6778; --gold:#d09d39; --red:#cd3232; --brick:#9f2e1f;
  --display:"Playfair Display",Georgia,"Times New Roman",serif;
  --body:Inter,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--paper);color:var(--text)}
body{font-family:var(--body);font-size:15px;line-height:1.55;padding-inline:clamp(16px,4vw,56px);padding-block:0 64px}
.wrap{max-width:1120px;margin:0 auto}
a{color:var(--navy)}
h1,h2,h3{font-family:var(--display);color:var(--ink);text-wrap:balance;margin:0}
h2{font-size:clamp(28px,4vw,40px);font-weight:700;line-height:1.1}
h3{font-size:19px;font-weight:600;margin-bottom:6px}
p{margin:0 0 10px;max-width:68ch}
.muted{color:var(--muted)}
.eyebrow{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--gold);margin:0 0 8px}

/* hero */
.hero{background:var(--navy);color:#fff;margin-inline:calc(-1*clamp(16px,4vw,56px));padding:clamp(40px,7vw,80px) clamp(16px,4vw,56px);margin-bottom:8px}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:32px;align-items:center}
.hero h1{color:#fff;font-size:clamp(38px,6vw,64px);line-height:1.02;font-weight:700}
.hero h1 em{font-style:italic;font-weight:500;color:var(--gold)}
.hero p{color:#cdd5e6;margin-top:14px}
.hero img{width:clamp(150px,22vw,250px);height:auto}
.meta{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:22px;font-size:13px;color:#aeb9d1}
.meta b{color:#fff;font-weight:600}

nav.toc{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin-inline:calc(-1*clamp(16px,4vw,56px));padding:10px clamp(16px,4vw,56px)}
nav.toc .wrap{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:13px}
nav.toc a{text-decoration:none;color:var(--muted);font-weight:500}
nav.toc a:hover,nav.toc a:focus-visible{color:var(--ink)}

section{padding-block:56px 8px;border-bottom:1px solid var(--line)}
section:last-of-type{border-bottom:0}
.sec-head{margin-bottom:22px}
.num{font-family:var(--display);font-style:italic;font-size:16px;letter-spacing:0;margin-right:6px}
.lead{font-size:16.5px;color:var(--text);margin-top:10px}

.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr))}
.tile{background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.plate{display:grid;place-items:center;padding:26px;aspect-ratio:4/3}
.plate img{max-width:100%;max-height:100%;width:auto;height:auto}
.plate.navy{background:var(--navy)} .plate.light{background:#fff} .plate.paper{background:#f2efe6}
.plate.dark{background:#1b1f27} .plate.photo{background:linear-gradient(135deg,#6b5a43,#2f3a4a)}
.plate.check{background:#fff;background-image:linear-gradient(45deg,#eceae4 25%,transparent 25%),linear-gradient(-45deg,#eceae4 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#eceae4 75%),linear-gradient(-45deg,transparent 75%,#eceae4 75%);background-size:18px 18px;background-position:0 0,0 9px,9px -9px,-9px 0}
.cap{padding:12px 14px;border-top:1px solid var(--line);font-size:13px;display:grid;gap:3px}
.cap b{color:var(--ink);font-size:14px}
code,.file{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--navy);word-break:break-all}

.venues{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 16px}
.venues button{font:600 13px/1 var(--body);padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.venues button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.venues button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

table{width:100%;border-collapse:collapse;font-size:14px}
.tablewrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:6px}
th{text-align:left;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:11px 14px;border-bottom:1px solid var(--navy);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.dot{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:8px;border:1px solid rgba(0,0,0,.1)}

.swatch{border-radius:6px;overflow:hidden;border:1px solid var(--line);background:#fff;display:flex;flex-direction:column}
.swatch .chip{height:120px;padding:14px;display:flex;align-items:flex-end;font-weight:600;font-size:13px}
.swatch dl{margin:0;padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12.5px;font-variant-numeric:tabular-nums}
.swatch dt{color:var(--muted)} .swatch dd{margin:0;font-family:ui-monospace,Menlo,monospace;color:var(--text)}
.swatch h3{font-size:16px;padding:12px 14px 0;margin:0}
.swatch .role{padding:2px 14px 0;font-size:12.5px;color:var(--muted)}

.type{background:#fff;border:1px solid var(--line);border-radius:6px;padding:22px;min-width:0}
.type .spec{font-size:12.5px;color:var(--muted);margin-bottom:10px}
.type .big{font-size:clamp(34px,5vw,52px);line-height:1.05;color:var(--ink);margin:6px 0 10px}
.type .alpha{font-size:15px;color:var(--text);word-break:break-word}

.icon{background:#fff;border:1px solid var(--line);border-radius:6px;padding:18px 12px 12px;display:grid;justify-items:center;gap:10px;text-align:center}
.icon img{width:84px;height:84px;object-fit:contain}
.icon b{font-size:13px;color:var(--ink)}

.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px;margin:0;padding:0;list-style:none}
.rules li{background:#fff;border:1px solid var(--line);border-left:3px solid var(--red);border-radius:4px;padding:12px 14px;font-size:14px}
.rules.ok li{border-left-color:#3b8a5a}

.zone{background:#fff;border:1px solid var(--line);border-radius:6px;padding:24px;display:grid;place-items:center}
.zone svg{max-width:100%;height:auto}

.masc{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:14px}
.masc figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.masc img{display:block;width:100%;height:auto;aspect-ratio:850/1600;object-fit:cover;background:#f4f2ec}
.masc figcaption{padding:10px 12px;font-size:12.5px;color:var(--muted)}
.masc figcaption b{display:block;color:var(--ink);font-size:13.5px}
.feature{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:26px;align-items:start;margin-bottom:22px}
.feature img{width:100%;height:auto;border-radius:6px;border:1px solid var(--line)}
.traits{display:grid;gap:8px;margin:12px 0 0;padding:0;list-style:none}
.traits li{display:grid;grid-template-columns:150px 1fr;gap:12px;font-size:14px;border-bottom:1px solid var(--line);padding-bottom:8px}
.traits b{color:var(--ink)}

.tree{background:#fff;border:1px solid var(--line);border-radius:6px;padding:18px 20px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.8;overflow-x:auto;white-space:pre;color:var(--text)}
footer{padding-top:40px;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px}

@media (max-width:720px){
  .hero .wrap{grid-template-columns:1fr} .hero img{order:-1}
  .feature{grid-template-columns:1fr} .traits li{grid-template-columns:1fr;gap:2px}
}
@media print{
  [hidden]{display:revert!important}
  @page{size:A4;margin:14mm 14mm 16mm}
  body{padding:0;font-size:10.5pt}
  nav.toc,.venues{display:none!important}
  .hero{margin:0 0 0;padding:28mm 12mm;min-height:250mm;display:grid;align-items:center;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  section{break-before:page;border:0;padding-top:0}
  .tile,.swatch,.icon,.masc figure,.type,.zone,.tablewrap,.feature{break-inside:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  [data-venue]{display:none!important} [data-venue="BZH"]{display:revert!important}
  .print-all [data-venue]{display:revert!important}
}
@media (prefers-reduced-motion:no-preference){ html{scroll-behavior:smooth} }

.dl{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.dl a{font:600 11.5px/1 var(--body);letter-spacing:.04em;text-decoration:none;color:var(--navy);border:1px solid var(--line);border-radius:999px;padding:6px 10px;background:#fff}
.dl a:hover,.dl a:focus-visible{border-color:var(--navy);background:#f3f5fa}

.specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:10px;margin-bottom:16px}
.spec{background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.spec b{display:block;font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.spec span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.anim-hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:20px;align-items:start}
.anim-hero video{width:100%;aspect-ratio:1;border-radius:6px;background:var(--navy);display:block}
.anim-groups{display:grid;gap:14px}
.anim-group{background:#fff;border:1px solid var(--line);border-radius:6px;padding:14px 16px}
.anim-group h3{font-size:16px;margin-bottom:4px}
.anim-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.anim-row:first-of-type{border-top:0}
.anim-row > div:first-child{display:grid;gap:2px;min-width:0;font-size:13.5px}
.anim-row b{color:var(--ink)} .anim-row .muted{font-size:12.5px}
.anim-row .dl{margin:0;flex-shrink:0}
@media (max-width:720px){.anim-hero{grid-template-columns:1fr}}

.dlbox{margin-top:26px;background:var(--navy);color:#fff;border-radius:8px;padding:22px}
.dlbox h3{color:#fff;font-size:20px}
.dlbox .muted{color:#c6cfe2}
.dlbtns{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0 4px}
.dlbtns button{font:600 14px/1 var(--body);padding:13px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;cursor:pointer}
.dlbtns button:first-child{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.dlbtns button:hover{border-color:#fff}
.dlbtns button:disabled{opacity:.5;cursor:wait}
@media print{ .dl,.dlbox,video+.anim-groups .dl{display:none!important} video{display:none!important} .anim-hero{grid-template-columns:1fr} }
.loading{padding:80px 0;text-align:center;color:var(--muted)}
.icon .dl{justify-content:center}
.masc figcaption .dl{margin-top:8px}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
<div id="app"><p class="loading">Chargement de la charte…</p></div>
<script>
/* Charte graphique dynamique : tout le contenu vient de charte.json (même dossier).
   Pour un autre client : copier ce dossier, remplacer charte.json et le dossier files/. */
(async () => {
  const app = document.getElementById('app');
  let C;
  try { C = await (await fetch('charte.json', { cache: 'no-store' })).json(); }
  catch (e) { app.innerHTML = '<p class="loading">Impossible de charger charte.json.</p>'; return; }
  const B = C.brand, P = B.prefix;
  document.title = `${B.name} — Charte graphique`;
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const fill = (tpl, o) => tpl.replace(/\{(\w+)\}/g, (_, k) => k === 'prefix' ? P : (o[k] ?? ''));
  const dl = (base, exts) => `<div class="dl">${exts.map(x => `<a href="${base}.${x}" download>${x.toUpperCase()}</a>`).join('')}</div>`;
  const head = (n, eyebrow, title, lead) => `<div class="sec-head"><div><p class="eyebrow"><span class="num">${n}</span> ${eyebrow}</p><h2>${esc(title)}</h2>${lead ? `<p class="lead">${lead}</p>` : ''}</div></div>`;
  const venues = B.venues;

  const logoTiles = (grp, maxH) => venues.map(v => grp.versions.map(ver => {
    const n = fill(grp.file, { venue: v.id, key: ver.key }), base = `files/logos/${n}`;
    return `<div class="tile" data-venue="${v.id}"><div class="plate ${ver.bg}"><img src="${base}.svg" alt="${esc(grp.title)} ${esc(v.label)} ${esc(ver.label)}" loading="lazy" style="max-height:${maxH}px"></div>
      <div class="cap"><b>${esc(ver.label)}</b><span class="muted">${esc(ver.use)}</span><span class="file">${n}</span>${dl(base, ['svg', 'png'])}</div></div>`;
  }).join('')).join('');

  const AN = C.animation, L = C.logos, F = C.fonds, R = C.regles, K = C.couleurs, T = C.typos, I = C.icones, M = C.mascotte, X = C.fichiers;
  app.innerHTML = `
<header class="hero"><div class="wrap">
  <div><p class="eyebrow">Charte graphique · Version ${esc(B.version)} · ${esc(B.date)}</p>
  <h1>${esc(B.name)} <em>Brand Guide</em></h1><p>${esc(B.heroLead)}</p>
  <div class="meta"><span>Établissements <b>${venues.map(v => esc(v.label)).join(' · ')}</b></span><span>Réalisée par <b>${esc(B.agency)}</b></span></div></div>
  <img src="${B.heroLogo}" alt="Logo ${esc(B.name)}">
</div></header>
<nav class="toc" aria-label="Sommaire"><div class="wrap">
  <a href="#logos">Logos</a><a href="#anime">Logo animé</a><a href="#fonds">Quel logo sur quel fond</a><a href="#regles">Règles</a><a href="#couleurs">Couleurs</a><a href="#typo">Typographies</a><a href="#icones">Icônes</a><a href="#mascotte">Mascotte</a><a href="#fichiers">Fichiers</a><a href="#telecharger">Télécharger</a>
</div></nav>
<main class="wrap">
<section id="logos">${head('01', 'Logos', L.title, L.lead)}
  <div class="venues" role="group" aria-label="Établissement affiché">${venues.map((v, i) => `<button type="button" aria-pressed="${i === 0}" data-v="${v.id}">${esc(v.label)}</button>`).join('')}</div>
  <h3>${esc(L.rond.title)}</h3><p class="muted">${esc(L.rond.usage)}</p><div class="grid g2">${logoTiles(L.rond, 230)}</div>
  <h3 style="margin-top:30px">${esc(L.texte.title)}</h3><p class="muted">${esc(L.texte.usage)}</p><div class="grid g3">${logoTiles(L.texte, 170)}</div>
</section>
<section id="anime">${head('02', 'Logo animé', AN.title, AN.lead)}
  <div class="specs">${AN.specs.map(([a, b]) => `<div class="spec"><b>${esc(a)}</b><span>${esc(b)}</span></div>`).join('')}</div>
  <div class="venues" role="group" aria-label="Établissement affiché">${venues.map((v, i) => `<button type="button" aria-pressed="${i === 0}" data-v="${v.id}">${esc(v.label)}</button>`).join('')}</div>
  ${venues.map(v => { const f = k => `files/animation/${fill(AN.file, { venue: v.id, key: k })}`;
    return `<div data-venue="${v.id}"><div class="anim-hero"><video src="${f('Carre_son')}.mp4" poster="${f('Poster')}.jpg" controls playsinline preload="none"></video>
      <div class="anim-groups">${AN.groups.map(g => `<div class="anim-group"><h3>${esc(g.title)}</h3>${g.formats.map(fm => `<div class="anim-row"><div><b>${esc(fm.label)}</b><span class="muted">${esc(fm.use)}</span></div><div class="dl"><a href="${f(fm.key)}.${fm.ext}" download>${fm.ext.toUpperCase()}</a></div></div>`).join('')}</div>`).join('')}</div></div></div>`; }).join('')}
  <div class="anim-group" style="margin-top:18px"><h3>${esc(AN.sound.title)}</h3><p class="muted" style="margin:0 0 6px">${esc(AN.sound.note)}</p>
    <audio src="files/animation/${AN.sound.files[1].file}.mp3" controls preload="none" style="width:100%;max-width:420px"></audio>
    ${AN.sound.files.map(fm => `<div class="anim-row"><div><b>${esc(fm.label)}</b><span class="muted">${esc(fm.use)}</span></div><div class="dl"><a href="files/animation/${fm.file}.${fm.ext}" download>${fm.ext.toUpperCase()}</a></div></div>`).join('')}</div>
  <h3 style="margin-top:24px">Bonnes pratiques</h3><ul class="rules ok">${AN.tips.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
</section>
<section id="fonds">${head('03', 'Usage', F.title, F.lead)}
  <div class="tablewrap"><table><thead><tr><th>Fond du support</th><th>Logo rond</th><th>Logo texte</th><th>Exemple</th></tr></thead><tbody>
  ${F.rows.map(r => `<tr><td><span class="dot" style="background:${r.swatch}"></span>${esc(r.fond)}</td><td>${esc(r.rond)}</td><td><b>${esc(r.texte)}</b></td><td>${esc(r.exemple)}</td></tr>`).join('')}
  </tbody></table></div><p class="muted" style="margin-top:12px">${esc(F.note)}</p>
</section>
<section id="regles">${head('04', 'Règles', R.title, R.lead)}
  <div class="grid g2">
    <div class="zone"><svg viewBox="0 0 460 420" role="img" aria-label="Zone de protection autour du logo">
      <rect x="30" y="20" width="400" height="380" fill="none" stroke="#cd3232" stroke-width="1.5" stroke-dasharray="6 5"/>
      <image href="${R.zoneLogo}" x="95" y="80" width="270" height="241"/>
      <g fill="#cd3232" font-family="Inter,Arial" font-size="13" font-weight="600">
      <line x1="230" y1="20" x2="230" y2="80" stroke="#cd3232" stroke-width="1.2"/><text x="238" y="55">a</text>
      <line x1="30" y1="200" x2="95" y2="200" stroke="#cd3232" stroke-width="1.2"/><text x="58" y="192">a</text>
      <text x="40" y="414" font-weight="500" fill="#5f6778">a = hauteur de l'ancre</text></g></svg></div>
    <div class="tablewrap"><table><thead><tr><th>Logo</th><th>Imprimé</th><th>Écran</th></tr></thead><tbody>
    ${R.tailles.map(t => `<tr><td>${esc(t.logo)}</td><td>${esc(t.print)}</td><td>${esc(t.screen)}</td></tr>`).join('')}</tbody></table></div>
  </div>
  <h3 style="margin-top:28px">À ne jamais faire</h3><ul class="rules">${R.interdits.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
</section>
<section id="couleurs">${head('05', 'Couleurs', K.title, K.lead)}
  <div class="grid g3">${K.items.map(c => { const light = c.hex.toUpperCase() === '#FFFFFF' || c.hex.toUpperCase() === '#D09D39';
    return `<div class="swatch"><div class="chip" style="background:${c.hex};color:${light ? '#0d255c' : '#fff'};${c.hex.toUpperCase() === '#FFFFFF' ? 'border-bottom:1px solid var(--line)' : ''}">${esc(c.hex)}</div><h3>${esc(c.name)}</h3><div class="role">${esc(c.role)}</div><dl><dt>HEX</dt><dd>${esc(c.hex)}</dd><dt>RVB</dt><dd>${esc(c.rgb)}</dd><dt>CMJN</dt><dd>${esc(c.cmyk)}</dd></dl></div>`; }).join('')}</div>
</section>
<section id="typo">${head('06', 'Typographies', T.title, T.lead)}
  <div class="grid g2">${T.items.map(t => `<div class="type"><p class="eyebrow">${esc(t.role)}</p><div class="spec">${esc(t.family)} · ${esc(t.weights)}</div>
    <div class="big" style="${t.css}">${esc(t.sample)}</div><div class="alpha" style="${t.css};font-weight:500;letter-spacing:0">ABCDEFGHIJKLMNOPQRSTUVWXYZ<br>abcdefghijklmnopqrstuvwxyz 0123456789</div>
    <p class="muted" style="margin-top:12px">${esc(t.use)}</p><div class="dl"><a href="${t.link}" target="_blank" rel="noopener">Télécharger sur Google Fonts</a></div></div>`).join('')}</div>
</section>
<section id="icones">${head('07', 'Iconographie', I.title, I.lead)}
  <div class="grid g4">${I.items.map(it => { const f = c => `files/icones/${fill(I.file, { key: it.key, color: c })}`;
    return `<div class="icon"><img src="${f(I.colors[0])}.svg" alt="" loading="lazy"><b>${esc(it.label)}</b>
      <div class="dl">${I.colors.map(c => `<a href="${f(c)}.svg" download title="${esc(it.label)} ${c} SVG">${c}</a>`).join('')}</div></div>`; }).join('')}</div>
  <p class="muted" style="margin-top:14px">${esc(I.note)} Chaque icône existe aussi en PNG dans le dossier des fichiers.</p>
</section>
<section id="mascotte">${head('08', 'Mascotte', M.title, M.lead)}
  <div class="feature"><img src="files/mascotte/${M.hero}.webp" alt="${esc(M.title)}" loading="lazy">
    <div><h3>Ce qui ne change jamais</h3><ul class="traits">${M.traits.map(([a, b]) => `<li><b>${esc(a)}</b><span>${esc(b)}</span></li>`).join('')}</ul>
    <h3 style="margin-top:20px">Sur une affiche</h3><p>${esc(M.affiche)}</p>${dl(`files/mascotte/${M.hero}`, ['png'])}</div></div>
  <div class="masc">${M.items.map(m => `<figure><img src="files/mascotte/${m.file}.webp" alt="${esc(m.title)}" loading="lazy"><figcaption><b>${esc(m.title)}</b>${esc(m.sub)}${dl(`files/mascotte/${m.file}`, ['png'])}</figcaption></figure>`).join('')}</div>
  <p class="muted" style="margin-top:14px">${esc(M.rights)}</p>
</section>
<section id="fichiers">${head('09', 'Fichiers', X.title, X.lead)}
  <div class="tablewrap"><table><tbody>
    <tr><td>Règle de nommage</td><td><code>${esc(X.naming)}</code></td></tr>
    <tr><td>Exemple</td><td><code>${esc(X.example)}</code></td></tr>
    <tr><td>Logos</td><td>${venues.length} établissements × ${L.rond.versions.length + L.texte.versions.length} versions, en SVG et PNG</td></tr>
    <tr><td>Logo animé</td><td>${venues.length} établissements × 9 formats (vidéos avec et sans son, transparent, GIF) + le son en WAV et MP3</td></tr>
    <tr><td>Icônes</td><td>${I.items.length} icônes × ${I.colors.length} couleurs, en SVG et PNG</td></tr>
    <tr><td>Mascotte</td><td>${M.items.length + 1} images en PNG haute définition</td></tr>
  </tbody></table></div>
  <div id="telecharger" class="dlbox">
    <h3>Télécharger toute la charte</h3>
    <p class="muted">Pour l'avoir hors ligne, l'envoyer à un imprimeur ou l'archiver. Le ZIP reprend tous les fichiers de cette page, rangés par dossier.</p>
    <div class="dlbtns">
      <button type="button" id="btnPdf">Version PDF</button>
      <button type="button" id="btnZipLight">ZIP sans vidéos · env. 20 Mo</button>
      <button type="button" id="btnZipFull">ZIP complet avec vidéos · env. 110 Mo</button>
    </div>
    <p id="zipStatus" class="muted" role="status" aria-live="polite"></p>
  </div>
  <footer><span>${esc(B.name)} · Charte graphique v${esc(B.version)} · ${esc(B.date)}</span><span>Réalisée par ${esc(B.agency)}</span></footer>
</section>
</main>`;

  const show = v => { document.querySelectorAll('[data-venue]').forEach(el => el.hidden = el.dataset.venue !== v); document.querySelectorAll('[data-venue][hidden] video').forEach(x => x.pause());
    document.querySelectorAll('.venues button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v)); };
  document.querySelectorAll('.venues button').forEach(b => b.addEventListener('click', () => show(b.dataset.v)));
  show(venues[0].id);

  /* ---- Téléchargements : PDF (impression du navigateur) et ZIP construit à partir des fichiers du site ---- */
  document.getElementById('btnPdf').addEventListener('click', () => window.print());
  const fileList = withVideos => {
    const out = [], add = (url, path) => out.push([url, path]);
    [['rond', '01_Logo_Rond'], ['texte', '02_Logo_Texte']].forEach(([g, dir]) => venues.forEach(v => C.logos[g].versions.forEach(ver => {
      const n = fill(C.logos[g].file, { venue: v.id, key: ver.key });
      ['svg', 'png'].forEach(x => add(`files/logos/${n}.${x}`, `${dir}/${x.toUpperCase()}/${n}.${x}`)); })));
    C.icones.items.forEach(it => C.icones.colors.forEach(c => { const n = fill(C.icones.file, { key: it.key, color: c });
      ['svg', 'png'].forEach(x => add(`files/icones/${n}.${x}`, `04_Icones/${x.toUpperCase()}/${n}.${x}`)); }));
    [{ file: C.mascotte.hero }, ...C.mascotte.items].forEach(m => add(`files/mascotte/${m.file}.png`, `05_Mascotte/${m.file}.png`));
    venues.forEach(v => AN.groups.forEach(g => g.formats.forEach(fm => {
      if (!withVideos && fm.ext !== 'gif') return;
      const n = fill(AN.file, { venue: v.id, key: fm.key }); add(`files/animation/${n}.${fm.ext}`, `03_Logo_Anime/${v.id}/${n}.${fm.ext}`); })));
    AN.sound.files.forEach(fm => add(`files/animation/${fm.file}.${fm.ext}`, `03_Logo_Anime/Son/${fm.file}.${fm.ext}`));
    add('charte.json', '00_Charte/charte.json');
    return out;
  };
  const zipStatus = document.getElementById('zipStatus');
  const buildZip = async withVideos => {
    if (!window.JSZip) { zipStatus.textContent = 'Le module ZIP ne s\'est pas chargé. Rechargez la page.'; return; }
    const btns = document.querySelectorAll('.dlbtns button'); btns.forEach(b => b.disabled = true);
    const list = fileList(withVideos), zip = new JSZip(), root = zip.folder(`${P}_Charte-graphique`);
    let done = 0, failed = 0;
    for (const [url, path] of list) {
      try { const r = await fetch(url); if (!r.ok) throw 0; root.file(path, await r.blob()); } catch (e) { failed++; }
      done++; zipStatus.textContent = `Préparation : ${done} / ${list.length} fichiers…`;
    }
    zipStatus.textContent = 'Compression…';
    const blob = await zip.generateAsync({ type: 'blob', compression: 'STORE' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `${P}_Charte-graphique${withVideos ? '_complete' : ''}.zip`; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    zipStatus.textContent = failed ? `ZIP prêt (${failed} fichier(s) manquant(s)).` : `ZIP prêt : ${list.length} fichiers.`;
    btns.forEach(b => b.disabled = false);
  };
  document.getElementById('btnZipLight').addEventListener('click', () => buildZip(false));
  document.getElementById('btnZipFull').addEventListener('click', () => buildZip(true));
  if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
})();
</script>
</body>
</html>
