<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hannah's table · live · Drevici Oyster</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#10285E">
<link rel="icon" href="seo/logo-pics-bar.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,700&family=Caveat:wght@700&family=Jost:wght@400;500;600;700&display=swap">
<style>
:root{--navy:#10285E;--gold:#C6A24A}
*{box-sizing:border-box;margin:0}
body{background:var(--navy);color:#fff;font-family:Jost,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 18px) 20px calc(env(safe-area-inset-bottom) + 22px);display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;font:600 11px Jost;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.65)}
.goal{text-align:center;font:600 12px Jost;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-top:28px;min-height:15px}
.big{text-align:center;font:800 84px/1 'Playfair Display',serif;margin-top:6px}
.big small{font-size:38px;color:rgba(255,255,255,.45)}
.sub{text-align:center;font:500 17px Jost;margin-top:6px}
.bar{height:8px;border-radius:9px;background:rgba(255,255,255,.14);margin-top:18px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--gold);border-radius:9px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.list{margin-top:18px;display:grid;gap:9px;flex:1;align-content:start}
.m{background:rgba(255,255,255,.08);border-radius:15px;padding:12px 14px;animation:in .5s ease}
.m b{display:block;font:700 22px/1 Caveat,cursive;color:var(--gold)}
.m p{font:italic 400 15px/1.45 'Playfair Display',serif;color:rgba(255,255,255,.88);margin-top:4px}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.draw{background:var(--gold);color:var(--navy);border-radius:18px;padding:14px 16px;margin-top:16px}
.draw b{display:block;font:700 17px Jost}.draw small{font:500 14px Jost}
.draw button{display:block;width:100%;margin-top:12px;background:var(--navy);color:#fff;border:0;border-radius:99px;font:600 16px Jost;padding:14px 0;cursor:pointer}
.win{font:800 26px/1.25 'Playfair Display',serif;margin-top:8px}
.win div{animation:in .6s ease both}
.win small{display:block;font:500 13px Jost;opacity:.75}

.story{display:block;margin:0 auto;border-radius:50%;padding:4px;background:conic-gradient(from 210deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5,#feda75)}
.story span{display:block;border-radius:50%;padding:4px;background:var(--bgc,#F6EEE2)}
.story img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover}
.story{width:96px;height:96px;margin-top:22px}.story span{width:88px;height:88px;--bgc:#10285E}
.goal{margin-top:14px}
</style></head><body>
<div id="testbar" style="display:none;position:sticky;top:0;z-index:9;background:#b3261e;color:#fff;font:600 12px Jost,sans-serif;text-align:center;padding:6px">TEST · nothing is saved or counted · <a href="#" id="treset" style="color:#fff">reset</a></div>
<div class="app">
  <div class="top"><span>Live · Hannah's table</span><span id="clock"></span></div>
  <div class="story"><span><img src="media/hannah.jpg" alt="Hannah"></span></div>
  <div class="goal" id="goal"></div>
  <div class="big"><span id="n">0</span><small> / <span id="g">25</span></small></div>
  <div class="sub" id="sub">messages for Hannah</div>
  <div class="bar"><i id="bar"></i></div>
  <div class="list" id="list"></div>
  <div class="draw" id="draw"><b>The draw · after midnight</b><small>3 names will take Hannah to dinner · <span id="nn">0</span> in the hat</small></div>
</div>
<script>
const SB='https://fdbzzkzfipzabryfanun.supabase.co', KEY='sb_publishable_9PaqDuXnWV3aOCBPk9ImmQ_4YgYTU9n';
// Mode test (?test) : rien n'est envoyé ni compté, tout reste sur ce téléphone.
const TEST=/[?&]test/.test(location.search);
const tst=()=>{try{return JSON.parse(localStorage.getItem('hannah-test'))||null}catch(e){return null}};
function mockRpc(fn,b){let st=tst()||{rows:[{first:'Sophie',msg:'To the woman who knows every good table in Paris. Love you!'},{first:'Marco',msg:'Tanti auguri Hannah!'},{first:'James',msg:'Another year of you being the best host in Paris.'}],n:18,drawn:[]};
  if(fn==='hannah_post'){const ex=st.rows.find(r=>r.email===b.p_email);if(ex){ex.msg=b.p_msg;ex.club=ex.club||b.p_club}else{st.rows.unshift({first:b.p_first,last:b.p_last,email:b.p_email,msg:b.p_msg,club:b.p_club});st.n++}
    const me=st.rows.find(r=>r.email===b.p_email);if(me.club&&!me.code)me.code='TEST-'+Math.random().toString(36).slice(2,5).toUpperCase();
    localStorage.setItem('hannah-test',JSON.stringify(st));return Promise.resolve({ok:true,count:st.n,code:me.code||null,first:me.first})}
  if(fn==='hannah_draw'){if(!st.drawn.length)st.drawn=['Sophie M.','Marco R.','James W.'].map(n=>({name:n}));localStorage.setItem('hannah-test',JSON.stringify(st));return Promise.resolve({ok:true,drawn:st.drawn})}
  return Promise.resolve({count:st.n,goal:25,latest:st.rows.slice(0,8).map(r=>({first:r.first,msg:r.msg})),drawn:st.drawn})}
const rpc=(fn,body)=>TEST?mockRpc(fn,body||{}):fetch(`${SB}/rest/v1/rpc/${fn}`,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(body||{})}).then(r=>r.json());
const key=new URLSearchParams(location.search).get('key');
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let shown='',winners=null;
function clock(){const d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}
function drawBox(n){const el=document.getElementById('draw');
  if(winners){el.innerHTML=`<b>They take Hannah to dinner</b><div class="win">${winners.map((w,i)=>`<div style="animation-delay:${i*.5}s">${esc(w.name)}</div>`).join('')}</div>`;return}
  el.innerHTML=`<b>The draw · after midnight</b><small>3 names will take Hannah to dinner · <span id="nn">${n}</span> in the hat</small>${(key||TEST)?'<button id="go">Draw 3 names</button>':''}`;
  const b=document.getElementById('go');if(b)b.onclick=async()=>{if(!confirm('Draw the 3 names now?'))return;b.disabled=true;const r=await rpc('hannah_draw',{p_key:key});if(r&&r.ok){winners=r.drawn;drawBox(n)}else{alert('Wrong key');b.disabled=false}}}
async function poll(){try{const r=await rpc('hannah_wall');if(!r||typeof r.count!=='number')return;
  const bott=Math.floor(r.count/r.goal),next=(bott+1)*r.goal;document.getElementById('n').textContent=r.count;document.getElementById('g').textContent=next;
  document.getElementById('bar').style.width=((r.count-bott*r.goal)/r.goal*100)+'%';
  document.getElementById('goal').textContent=bott?`${bott} bottle${bott>1?'s':''} of Chardonnay earned`:'';
  document.getElementById('sub').textContent=`messages for Hannah · ${next-r.count} more for bottle #${bott+1}`;
  const sig=JSON.stringify(r.latest);if(sig!==shown){shown=sig;document.getElementById('list').innerHTML=r.latest.slice(0,5).map(m=>`<div class="m"><b>${esc(m.first)}</b><p>${esc(m.msg)}</p></div>`).join('')}
  if(!winners&&r.drawn&&r.drawn.length){winners=r.drawn}
  drawBox(r.count);
}catch(e){}}
clock();setInterval(clock,10000);poll();setInterval(poll,5000);
if(TEST){document.getElementById('testbar').style.display='block';document.getElementById('treset').onclick=e=>{e.preventDefault();localStorage.removeItem('hannah-test');localStorage.removeItem('hannah-me-test');location.reload()}}
</script>
</body></html>
