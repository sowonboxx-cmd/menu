// ── Grey-placeholder → fade-in for content photos ──
// Watches every <img> that ever appears inside #tabsContainer (dish
// photos, hero, gallery — anything rendered from DATA) and adds
// .img-loaded once it has actually finished loading, so the CSS above
// can fade it in from the grey placeholder. A MutationObserver means
// this needs no changes anywhere content HTML is generated — it just
// reacts to whatever ends up in the DOM, including images inserted
// later (tab switches, admin edits, reconciliation re-renders).
(function(){
  function markLoaded(img){ img.classList.add('img-loaded'); }
  function watch(img){
    if(img.classList.contains('img-loaded')) return;
    if(img.complete && img.naturalWidth>0){ markLoaded(img); return; }
    img.addEventListener('load',()=>markLoaded(img),{once:true});
    // Don't leave a broken image invisible forever — reveal it (browser's
    // own broken-image icon) rather than an eternal grey box.
    img.addEventListener('error',()=>markLoaded(img),{once:true});
  }
  function watchAll(root){
    if(root.tagName==='IMG') watch(root);
    root.querySelectorAll && root.querySelectorAll('img').forEach(watch);
  }
  const container=document.getElementById('tabsContainer');
  if(!container) return;
  watchAll(container);
  new MutationObserver(muts=>{
    muts.forEach(m=>{ m.addedNodes.forEach(node=>{ if(node.nodeType===1) watchAll(node); }); });
  }).observe(container,{childList:true,subtree:true});
})();

function renderTabs(){
  const container=document.getElementById('tabsContainer');
  collectLbImages();
  // BUG FIX: this used to wipe and fully rebuild every visible tab's
  // content on every single render (container.innerHTML=''), even for a
  // plain tab switch where nothing in DATA actually changed. That meant
  // every <img> in every tab was destroyed and recreated on every click
  // or swipe, forcing the browser to redecode/repaint them — a visible
  // flicker on every tab change, not just the first load. Now existing
  // section elements are reused, and a tab's inner HTML is only rewritten
  // if its rendered content has actually changed; a pure tab switch just
  // toggles which section carries the `active` class, touching no images
  // at all.
  const visibleTabs=DATA.tabs.filter(tab=>tab.visible!==false);
  const visibleSectionIds=new Set(visibleTabs.map(tab=>'tab-'+tab.id));
  // Remove sections for tabs that no longer exist or became hidden.
  Array.from(container.children).forEach(child=>{
    if(!visibleSectionIds.has(child.id)) child.remove();
  });
  visibleTabs.forEach((tab,i)=>{
    const sectionId='tab-'+tab.id;
    let section=document.getElementById(sectionId);
    const isActive=tab.id===currentTabId;
    const html=renderTabContent(tab,0);
    if(!section){
      section=document.createElement('div');
      section.id=sectionId;
      const inner=document.createElement('div');
      inner.className='container';
      inner.innerHTML=html;
      section.appendChild(inner);
      // attach lb handlers via delegation (works for img-wrap + gc-wrap)
      section.addEventListener('click', e => {
        if(editMode){
          const ed = e.target.closest('[data-edit]');
          if(ed){ e.preventDefault(); e.stopPropagation(); openEditElement(ed); return; }
          return; // swallow other clicks in edit mode
        }
        const el = e.target.closest('[data-lbidx]');
        if(el) openLb(parseInt(el.dataset.lbidx));
      });
    } else {
      const inner=section.querySelector('.container');
      if(inner && inner.innerHTML!==html){
        // BUG FIX: even with the reuse-instead-of-rebuild fix above, a real
        // content change anywhere on a tab (one price, one text field) used
        // to still rewrite that whole tab's innerHTML wholesale — which
        // destroyed and recreated every <img> on the tab, including ones
        // completely unrelated to the change, causing them to visibly
        // flicker as the browser redecoded them. Parse the new HTML into a
        // detached fragment first, then "adopt" any already-loaded <img>
        // elements whose src is unchanged into the new markup (matched by
        // src, in document order, so duplicate srcs still pair up
        // correctly) before installing it — the browser never has to
        // re-fetch/re-decode an image that didn't actually change.
        const tmp=document.createElement('div');
        tmp.innerHTML=html;
        const oldBySrc=new Map();
        inner.querySelectorAll('img').forEach(img=>{
          const key=img.getAttribute('src')||'';
          if(!oldBySrc.has(key)) oldBySrc.set(key,[]);
          oldBySrc.get(key).push(img);
        });
        tmp.querySelectorAll('img').forEach(newImg=>{
          const key=newImg.getAttribute('src')||'';
          const bucket=oldBySrc.get(key);
          if(bucket && bucket.length){
            const oldImg=bucket.shift();
            Array.from(newImg.attributes).forEach(a=>{
              if(oldImg.getAttribute(a.name)!==a.value) oldImg.setAttribute(a.name,a.value);
            });
            newImg.replaceWith(oldImg);
          }
        });
        inner.innerHTML='';
        while(tmp.firstChild) inner.appendChild(tmp.firstChild);
      }
    }
    section.className='tab-content'+(isActive?' active':'');
    // Keep DOM order matching tab order (handles admin tab reordering)
    if(container.children[i]!==section) container.insertBefore(section, container.children[i]||null);
  });
}

// ── SWIPE TO CHANGE TABS ──
(function(){
  // True carousel-style swipe: both the current tab panel and the
  // neighbor it's revealing move together as one continuous surface,
  // like Twitter — never a disappear/reappear. All tabs already exist in
  // the DOM (#tabsContainer renders every visible tab, just toggling
  // display via the .active class), so we temporarily position the
  // active panel and its neighbor side by side and translate both by the
  // same amount. Cleanup happens either by resetting inline styles (swipe
  // cancelled) or automatically via goToTab()'s renderAll(), which
  // rebuilds #tabsContainer from scratch and discards our inline styles.
  //
  // The active-tab indicator bar (#navIndicator, see renderNav()) is
  // driven in lockstep with the exact same drag progress, so it glides
  // between tabs in real time instead of snapping after the fact.
  let tsX=0,tsY=0,isDragging=false,dragLocked=false,dir=0;
  let activeEl=null,neighborEl=null,containerEl=null,prevContainerStyle=null;
  let navIndicatorEl=null,navActiveLeft=0,navActiveWidth=0,navNeighborLeft=0,navNeighborWidth=0;
  let navActiveTabElRef=null,navNeighborTabElRef=null;
  // DÉCISION PRODUIT (Will) : le geste horizontal appartient au
  // bandeau « Nos incontournables » TANT QU'ON LE VOIT. Deux
  // glissements horizontaux au même endroit, et on ne sait plus
  // lequel on déclenche. Mais une fois le bandeau dépassé à plus de
  // moitié, le conflit disparaît : l'utilisateur est descendu dans la
  // liste, il voit les onglets en haut et glisser devient le geste
  // naturel pour changer de catégorie plutôt que de remonter cliquer.
  // Une catégorie sans bandeau (vins, cafés) autorise le glissement
  // d'emblée.
  // Chaque zone repond au geste qui lui appartient : un glissement qui
  // DEMARRE sur le bandeau fait defiler le bandeau (celui-ci est exclu
  // des ecouteurs plus bas), partout ailleurs il change de categorie.
  // Plus besoin de conditionner au defilement de la page : c'est
  // l'endroit ou le doigt se pose qui decide, et c'est bien plus
  // previsible.
  function tabSwipeAllowed(){ return true; }
  // On décide UNE fois, au poser du doigt : si la page bouge pendant le
  // geste, la réponse ne doit pas changer en cours de route.
  let swipeAllowed=false;
  const THRESHOLD=0.12; // 12% of screen width to commit — light swipe enough

  function resetPanel(el){
    if(!el) return;
    el.style.position='';el.style.top='';el.style.left='';el.style.width='';
    el.style.transition='';el.style.transform='';el.style.display='';
  }
  function cleanupSlide(){
    if(containerEl&&prevContainerStyle){
      containerEl.style.position=prevContainerStyle.position;
      containerEl.style.overflow=prevContainerStyle.overflow;
      containerEl.style.height=prevContainerStyle.height;
    }
    resetPanel(activeEl);
    resetPanel(neighborEl);
    if(navActiveTabElRef) navActiveTabElRef.classList.remove('nav-tab-swiping');
    if(navNeighborTabElRef) navNeighborTabElRef.classList.remove('nav-tab-swiping');
    navActiveTabElRef=null; navNeighborTabElRef=null;
    activeEl=null;neighborEl=null;containerEl=null;prevContainerStyle=null;dir=0;
    navIndicatorEl=null;
  }

  document.addEventListener('touchstart',e=>{
    swipeAllowed=tabSwipeAllowed();
    if(!swipeAllowed) return;
    if(document.getElementById('adminPanel')?.classList.contains('open')) return;
    // Don't intercept touches on nav-bar, lightbox, admin, inputs
    if(e.target.closest('.nav-bar,.rail,.lb,.admin-panel,input,textarea,select,button')) return;
    tsX=e.touches[0].clientX;
    tsY=e.touches[0].clientY;
    isDragging=false;
    dragLocked=false;
  },{passive:true});

  document.addEventListener('touchmove',e=>{
    if(!swipeAllowed) return;
    if(document.getElementById('adminPanel')?.classList.contains('open')) return;
    if(dragLocked) return;
    if(e.target.closest('.nav-bar,.rail,.lb,.admin-panel,input,textarea,select')) return;
    const dx=e.touches[0].clientX-tsX;
    const dy=e.touches[0].clientY-tsY;
    const W=window.innerWidth;
    // Lock to vertical scroll if clearly scrolling up/down
    if(!isDragging&&Math.abs(dy)>Math.abs(dx)*1.5+4){ dragLocked=true; return; }
    if(!isDragging&&Math.abs(dx)>6){
      isDragging=true;
      const vis=DATA.tabs.filter(tb=>tb.visible!==false);
      const idx=vis.findIndex(tb=>tb.id===currentTabId);
      dir=dx<0?1:-1; // 1 = swiping to next tab, -1 = swiping to previous
      const newIdx=idx+dir;
      if(newIdx<0||newIdx>=vis.length){ dir=0; return; } // no neighbour that way
      containerEl=document.getElementById('tabsContainer');
      activeEl=document.getElementById('tab-'+currentTabId);
      neighborEl=document.getElementById('tab-'+vis[newIdx].id);
      if(!containerEl||!activeEl||!neighborEl){ dir=0;activeEl=null;neighborEl=null;containerEl=null; return; }
      prevContainerStyle={position:containerEl.style.position,overflow:containerEl.style.overflow,height:containerEl.style.height};
      containerEl.style.position='relative';
      containerEl.style.overflow='hidden';
      containerEl.style.height=activeEl.offsetHeight+'px';
      activeEl.style.position='absolute';
      activeEl.style.top='0'; activeEl.style.left='0'; activeEl.style.width='100%';
      activeEl.style.transition='none';
      neighborEl.style.display='block';
      neighborEl.style.position='absolute';
      neighborEl.style.top='0'; neighborEl.style.width='100%';
      neighborEl.style.left=(dir>0?W:-W)+'px';
      neighborEl.style.transition='none';
      // Set up the indicator's start/end geometry once, from the two
      // corresponding .nav-tab elements (same index order as `vis`).
      const navEl=document.getElementById('nav');
      const navTabs=navEl?Array.from(navEl.querySelectorAll('.nav-tab')):[];
      const navActiveTabEl=navTabs[idx]||null;
      const navNeighborTabEl=navTabs[newIdx]||null;
      navIndicatorEl=document.getElementById('navIndicator');
      if(navIndicatorEl&&navActiveTabEl&&navNeighborTabEl){
        navIndicatorEl.style.transition='none';
        navActiveLeft=navActiveTabEl.offsetLeft; navActiveWidth=navActiveTabEl.offsetWidth;
        navNeighborLeft=navNeighborTabEl.offsetLeft; navNeighborWidth=navNeighborTabEl.offsetWidth;
        // BUG FIX: only the tab that WAS active had navy (legible) text —
        // the neighbor being swiped toward was still styled pale/dim
        // (correct for sitting on the navy header, but that same pale
        // text turns near-invisible once the white pill slides under it
        // mid-drag). That read as "the label is blank, then it appears"
        // once the swipe finished and a fresh render finally colored it
        // navy. Color both tabs navy for the live drag — whichever one
        // the pill currently covers is then already legible throughout,
        // like a light passing over something already there rather than
        // something being drawn in after the fact.
        navActiveTabEl.classList.add('nav-tab-swiping');
        navNeighborTabEl.classList.add('nav-tab-swiping');
        navActiveTabElRef=navActiveTabEl; navNeighborTabElRef=navNeighborTabEl;
      } else {
        navIndicatorEl=null;
      }
    }
    if(!isDragging||dir===0) return;
    // Move both panels together with the finger — the neighbour follows
    // right along at its fixed offset, so it visibly slides in as the
    // active panel slides out, instead of a cut between two states.
    activeEl.style.transform=`translate3d(${dx}px,0,0)`;
    neighborEl.style.transform=`translate3d(${dx}px,0,0)`;
    // Slide the indicator in perfect lockstep with the same drag progress
    // driving the content — never after the fact.
    if(navIndicatorEl){
      const p=Math.min(1,Math.abs(dx)/W);
      navIndicatorEl.style.left=(navActiveLeft+(navNeighborLeft-navActiveLeft)*p)+'px';
      navIndicatorEl.style.width=(navActiveWidth+(navNeighborWidth-navActiveWidth)*p)+'px';
    }
  },{passive:true});

  document.addEventListener('touchend',e=>{
    if(!swipeAllowed) return;
    const wasDragging=isDragging;
    isDragging=false;
    dragLocked=false;
    // Pure tap — reset any stray transform and let click fire normally
    if(!wasDragging){ cleanupSlide(); return; }
    if(document.getElementById('adminPanel')?.classList.contains('open')){ cleanupSlide(); return; }
    if(dir===0||!activeEl||!neighborEl){ cleanupSlide(); return; }
    const dx=e.changedTouches[0].clientX-tsX;
    const W=window.innerWidth;
    const vis=DATA.tabs.filter(tb=>tb.visible!==false);
    const idx=vis.findIndex(tb=>tb.id===currentTabId);
    const newIdx=idx+dir;
    const _active=activeEl,_neighbor=neighborEl,_navIndicator=navIndicatorEl;
    // Slower, softer easing so the settle feels like one continuous
    // surface gliding to a stop, not a snap. The indicator uses the exact
    // same duration/easing so it lands at the same instant as the content.
    const EASE='transform .32s cubic-bezier(0.22,1,0.36,1)';
    const NAV_EASE='left .32s cubic-bezier(0.22,1,0.36,1),width .32s cubic-bezier(0.22,1,0.36,1)';
    if(Math.abs(dx)>W*THRESHOLD&&newIdx>=0&&newIdx<vis.length){
      _active.style.transition=EASE;
      _neighbor.style.transition=EASE;
      _active.style.transform=`translate3d(${-dir*W}px,0,0)`;
      // BUG FIX: this must land the neighbor at the SAME net offset as the
      // active panel's exit (-dir*W), because the neighbor's resting
      // "left" is already offset by +dir*W — translate3d(0,0,0) here
      // cancelled that offset back out instead of bringing it into view,
      // which is exactly the "content disappears" flash right as the
      // swipe committed.
      _neighbor.style.transform=`translate3d(${-dir*W}px,0,0)`;
      if(_navIndicator){
        _navIndicator.style.transition=NAV_EASE;
        _navIndicator.style.left=navNeighborLeft+'px';
        _navIndicator.style.width=navNeighborWidth+'px';
      }
      setTimeout(()=>{
        cleanupSlide();
        goToTab(vis[newIdx].id);
      },320);
    } else {
      _active.style.transition=EASE;
      _neighbor.style.transition=EASE;
      _active.style.transform='translate3d(0,0,0)';
      // Return the neighbor to its exact starting offset (0 added
      // translate on top of its resting +dir*W position) rather than
      // doubling the offset.
      _neighbor.style.transform='translate3d(0,0,0)';
      if(_navIndicator){
        _navIndicator.style.transition=NAV_EASE;
        _navIndicator.style.left=navActiveLeft+'px';
        _navIndicator.style.width=navActiveWidth+'px';
      }
      setTimeout(cleanupSlide,340);
    }
  });
})();

// Sur desktop, la vue en liste laisse d'immenses vides : une ligne de
// texte perdue sur 680px de large. La grille est la seule mise en
// page qui tient sur grand écran, quel que soit le réglage du
// restaurateur — lequel ne concerne donc que le mobile.
function isWideScreen(){
  try{ return window.matchMedia('(min-width:768px)').matches; }catch(e){ return false; }
}
function effectiveView(){ return isWideScreen() ? 'grid' : (view||'list'); }
function renderTabContent(tab,lbOffset){
  const view=effectiveView();   // masque volontairement la variable globale
  let imgIdx=lbOffset;
  let html='<div class="cards-stack">';

  // ACTUAL HOME TAB

    }
    // 2. Media (photo or video)
    const wantVideo = DATA.homeTab && DATA.homeTab.mediaChoice==='video' && DATA.homeTab.video;
    if(wantVideo){
      const videoUrl=DATA.homeTab.video;
      const ratio=DATA.homeTab.videoRatio||'16/9';
      const ytMatch=videoUrl.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]+)/);
      const vimeoMatch=videoUrl.match(/vimeo\.com\/([\d]+)/);
      const isDirectFile=/\.(mp4|webm|mov)(\?|$)/i.test(videoUrl);
      // Flat line-art icons matching the reference style (rounded-square
      // dark badge, white speaker glyph) instead of relying on emoji,
      // which render inconsistently across platforms/fonts.
      const muteIconSvg=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><line x1="16" y1="9" x2="22" y2="15"/><line x1="22" y1="9" x2="16" y2="15"/></svg>`;
      const muteBtnHtml=`<button type="button" class="video-mute-btn" onclick="toggleHomeVideoMute(this)" aria-label="Activer/couper le son">${muteIconSvg}</button>`;
      if(isDirectFile && !ytMatch && !vimeoMatch){
        // A direct video file plays natively — autoplay/loop/mute work
        // as real HTML attributes here, unlike the YouTube/Vimeo iframe
        // embeds below which only respond to their own query params.
        html+=`<div class="home-photo-wrap" style="position:relative;aspect-ratio:${ratio};background:#000"><video src="${videoUrl}" autoplay muted loop playsinline style="width:100%;height:100%;object-fit:cover"></video>${muteBtnHtml}</div>`;
      } else {

        // enablejsapi=1 lets the mute button below talk to the embed via

        if(ytMatch) embedUrl=`https://www.youtube.com/embed/${ytMatch[1]}?autoplay=0&rel=0&controls=0&modestbranding=1&showinfo=0&enablejsapi=1`;
        else if(vimeoMatch) embedUrl=`https://player.vimeo.com/video/${vimeoMatch[1]}?controls=0&title=0&byline=0&portrait=0`;
        else embedUrl=videoUrl;
        if(embedUrl) html+=`<div class="home-photo-wrap" style="position:relative;aspect-ratio:${ratio};background:#000"><iframe src="${embedUrl+(embedUrl.includes('?')?'&':'?')+'autoplay=1&mute=1&controls=0&loop=1&playsinline=1'}" style="width:100%;height:100%;border:none;pointer-events:none" allow="autoplay; encrypted-media" allowfullscreen loading="lazy"></iframe>${muteBtnHtml}</div>`;
      }
    } else if(DATA.homeTab&&DATA.homeTab.photo){

        html+=`</div></div>`;
      } else {

        html+=`<div class="card" style="border:1.5px solid var(--gold)"><div class="card-hdr" style="border-bottom:1px solid rgba(198,162,74,0.3)"><span class="card-label" style="color:var(--gold)">★ Nos incontournables ★</span></div><div class="card-body">`;
        pinDishes2.forEach((d,idx)=>{
          html+=`<div class="dish-row dish-row-clickable" onclick="openPinLb(${idx})">`;
          if(d.img) html+=`<img class="dish-img" src="${d.img}" alt="" loading="lazy">`;
          html+=`<div class="dish-text"><div class="dish-name-row"><span class="dish-name">${t(d.name)}</span></div>`;
          if(t(d.desc)) html+=`<div class="dish-desc">${t(d.desc)}</div>`;
          if(d.price) html+=`<div class="dish-price">${dishPriceDisplay(d)}</div>`;
          html+=`</div></div>`;
        });
        html+=`</div></div>`;
      }
    }
    // Schedule widget rendered in subheader (renderViewBar)
    html+=homeSocialBarHtml();
    html+='</div>';
    return html;
  }

  // OLD HOME: specials + intro + featured
  if(tab.isHome){
    // intro only if no dedicated home tab
    if(DATA.intro.active && !DATA.tabs.some(tb=>tb.id==='__home')){
      const soc=DATA.social||{};
      html+=`<div class="intro-card" data-edit="intro"><div class="intro-card-label">À propos</div><div class="intro-card-text">${t(DATA.intro.text)}</div></div>`;

      html+=`</div></div>`;

  }

  // BUG FIX: this used to hardcode an exemption for a tab literally

  const hasGridableContent = tab.cards.some(c => c.type !== 'bevs');

        (card.items||[]).filter(item=>!item.hidden).forEach(item=>{

        });
        if(editMode) bevsCardsHtml+=`<button type="button" class="aadd" onclick="addBev(${DATA.tabs.indexOf(tab)},${_ci})">+ Ajouter une boisson</button>`;
        bevsCardsHtml+=`</div></div>`;
        return;
      }
      if(card.type==='variants'){

        const idx=card.img?imgIdx++:null;

        gridItems.push(`<div class="gc" data-edit="variants" data-ti="${DATA.tabs.indexOf(tab)}" data-ci="${ci}"${card.img?` data-lbidx="${idx}"`:''}><div class="gc-wrap">${card.img?`<img class="gc-img" src="${card.img}" alt="" loading="lazy">`:'<div style="aspect-ratio:1;background:#ece8e1"></div>'}</div><div class="gc-body"><div class="gc-name">${t(card.label)}</div><div class="gc-desc">${vinfo.flavourText}</div><div class="gc-price">${vinfo.sharedPrice}</div></div></div>`);

      (card.dishes||[]).filter(d=>!d.hidden).forEach(d=>{

        const priceHtml=dishPriceDisplay(d);

        const gcBody=d.priceType==='dual'

          : `<div class="gc-top-row"><div class="gc-name">${t(d.name)}${isPinnedDish(d)?'&nbsp;<span class="dish-star">\u2605</span>':''}${badges?` <span class="dish-badges" style="display:inline-flex">${badges}</span>`:''}</div>${priceHtml?`<span class="gc-price-inline">${priceHtml}</span>`:''}</div><div class="gc-desc">${t(d.desc)}</div>`;
        gridItems.push(`<div class="gc" data-edit="dish" data-ti="${DATA.tabs.indexOf(tab)}" data-ci="${ci}" data-di="${di}"${d.img?` data-lbidx="${idx}"`:''}><div class="gc-wrap">${d.img?`<img class="gc-img" src="${d.img}" alt="" loading="lazy">`:'<div style="aspect-ratio:1;background:#ece8e1"></div>'}</div><div class="gc-body">${gcBody}</div></div>`);
      });
    });
    if(gridItems.length) html+=`<div class="dish-grid">${gridItems.join('')}</div>`;
    if(bevsCardsHtml) html+=bevsCardsHtml;
    if(editMode){
      const _ti=DATA.tabs.indexOf(tab);
      html+=`<button type="button" class="aadd" style="margin-top:10px;margin-bottom:14px" onclick="addCard(${_ti})">+ Ajouter une section</button>`;
    }
  } else {
    // list
    tab.cards.forEach(card=>{
      // Une section masquée n'apparaît pas côté visiteur, mais reste
      // visible en mode édition pour pouvoir la réafficher.
      if(card.hidden && !editMode) return;
      const _ciE=tab.cards.indexOf(card);
      html+=`<div class="card"><div class="card-hdr"><span class="card-label">${t(card.label)}</span></div><div class="card-body">`;

      if(card.type==='bevs'){
        (card.items||[]).filter(item=>!item.hidden).forEach(item=>{
          const sizes=item.sizes||[];
          // sizes display: "Pinte / Demi" or "25cl / 50cl" depending on
          // whether a format was picked for that row, "5€ / 17€" in price area
          const clStr=sizes.length>0?sizes.filter(s=>bevSizeLabel(s)).map(s=>bevSizeLabel(s)).join(' / '):'';
          const rawPrice=(item.price||'').toString(); const priceStr=fmtCurrency(sizes.length>0?sizes.filter(s=>s.price).map(s=>s.price+'€').join(' / '):(rawPrice.includes('€')?rawPrice:rawPrice?rawPrice+'€':''));

function toggleSchedPopup(e,suffix){
  suffix=suffix||'';
  e.stopPropagation();
  const p=document.getElementById('schedPopup'+suffix);
  // Use the element that was actually clicked rather than re-querying by
  // id — guarantees we measure the real, currently-visible badge (the
  // one the person's finger/cursor is on), with zero chance of a stale
  // or mismatched element being picked up some other way.
  const badge=e.currentTarget;
  if(p.classList.contains('visible')){ p.classList.remove('visible'); return; }
  const rect=badge.getBoundingClientRect();
  // Read the popup's own real rendered width (it's visibility:hidden, not
  // display:none, so it's already laid out and measurable) rather than
  // guessing a constant — the popup's min/max-width means its actual
  // width varies with content, and a fixed guess drifted off the badge's
  // true center.
  // Meme conversion que pour le menu d'apparence : au-dessus de 641px,
  // html porte un zoom:1.1, donc une mesure ecran ecrite telle quelle
  // dans style.left / style.top est remultipliee au rendu.
  const z=visualScaleOf(p);
  const pw=(p.offsetWidth||260)*z;
  const vw=window.innerWidth;
  // Centered directly under the button itself (its horizontal midpoint),
  // clamped so it never runs off either edge of the viewport. Works the
  // same for the header's own badge and the cover's separate instance —
  // no more special-casing per screen size or per neighboring button.
  let left=rect.left+rect.width/2-pw/2;
  left=Math.max(12, Math.min(left, vw-pw-12));
  const top=rect.bottom+10+(vw<=640?20:8);
  p.style.left=(left/z)+'px';
  p.style.top=(top/z)+'px';
  p.style.transform='none';
  p.classList.add('visible');
}

let dragTabSrc=null;
function onDragTab(e,ti){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT') { e.preventDefault(); return; } dragTabSrc=ti; e.currentTarget.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; }

// Touch drag for mobile reorder
(function(){
  let touchSrc=null, touchEl=null, ghost=null, listEl=null;
  document.addEventListener('touchstart',e=>{
    const handle=e.target.closest('.drag-handle');
    if(!handle) return;
    const card=handle.closest('[data-ti]');
    if(!card) return;
    touchSrc=parseInt(card.dataset.ti);
    touchEl=card;
    listEl=card.parentElement;
    ghost=card.cloneNode(true);
    ghost.style.cssText='position:fixed;opacity:.6;pointer-events:none;z-index:9999;width:'+card.offsetWidth+'px;background:#e8edf5;border-radius:8px;';
    document.body.appendChild(ghost);
    card.style.opacity='.3';
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(touchSrc===null) return;
    e.preventDefault();
    const t=e.touches[0];
    ghost.style.left=(t.clientX-80)+'px';
    ghost.style.top=(t.clientY-20)+'px';
    // find target
    const els=Array.from(listEl.querySelectorAll('[data-ti]'));
    els.forEach(el=>{
      const r=el.getBoundingClientRect();
      if(t.clientY>r.top&&t.clientY<r.bottom&&el!==touchEl){
        el.style.borderTop='3px solid #10285E';
      } else {
        el.style.borderTop='';
      }
    });
  },{passive:false});
  document.addEventListener('touchend',e=>{
    if(touchSrc===null) return;
    const t=e.changedTouches[0];
    const els=Array.from(listEl.querySelectorAll('[data-ti]'));
    let targetTi=null;
    els.forEach(el=>{
      el.style.borderTop='';
      const r=el.getBoundingClientRect();
      if(t.clientY>r.top&&t.clientY<r.bottom&&el!==touchEl){
        targetTi=parseInt(el.dataset.ti);
      }
    });
    if(ghost) ghost.remove();
    if(touchEl) touchEl.style.opacity='';
    if(targetTi!==null && targetTi!==touchSrc){
      const tabs=DATA.tabs;
      const [moved]=tabs.splice(touchSrc,1);
      tabs.splice(targetTi,0,moved);
      currentTabId=DATA.tabs[0]?.id;
      renderAll(); renderAdminTabDd(); renderAdminSection('__reorder');
      showToast('Ordre mis à jour');
    }
    touchSrc=null; touchEl=null; ghost=null;
  });
})();

// Conversion heure décimale (12.5 = 12h30, format interne existant)
// <-> "HH:MM" (format natif de <input type="time">, utilisé pour le
// nouveau design des horaires).
function decHourToTimeStr(dec){
  if(dec==null||isNaN(dec)) return '';
  const hh=Math.floor(dec), mm=Math.round((dec-hh)*60);
  return String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
}
function timeStrToDecHour(str){
  if(!str) return null;
  const [hh,mm]=str.split(':').map(Number);
  return hh+(mm||0)/60;
}
// Menu déroulant maison (créneaux de 15 min, 00:00 à 23:45) — pour
// avoir un rendu identique sur toutes les plateformes, contrairement
// à <input type="time"> dont l'icône ne peut pas être repeinte de
// façon fiable sur Safari iOS.
// Menu déroulant maison (créneaux de 15 min, 00:00 à 23:45) — pour
// avoir un rendu identique sur toutes les plateformes, contrairement
// à <input type="time"> dont l'icône ne peut pas être repeinte de
// façon fiable sur Safari iOS.
// BUG FIX (le natif prend tout l'écran sur iPhone) : un <select> HTML
// classique ouvre le même genre de plein écran natif sur iOS que
// <input type="time"> — impossible à limiter en hauteur depuis le
// CSS. On construit donc notre propre liste déroulante (une div
// absolument positionnée, hauteur limitée à ~6-7 lignes, défilable),
// entièrement sous notre contrôle sur toutes les plateformes.
function nearestQuarterHourDec(){
  const now = new Date();
  let dec = now.getHours() + Math.round(now.getMinutes()/15)*(15/60);
  if(dec >= 24) dec -= 24;
  return dec;
}
function timePickerFieldHtml(id, dec, onChangeJs){
  const label = decHourToTimeStr(dec) || '--';
  let opts = '';
  for(let hh=0; hh<24; hh++){
    for(let mm=0; mm<60; mm+=15){
      const d = hh + mm/60;
      const lbl = String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
      const isSel = dec!=null && Math.abs(dec-d)<0.01;
      opts += `<div class="ig-time-picker-opt${isSel?' selected':''}" data-dec="${d}" onclick="selectTimePickerOpt('${id}',${d},'${lbl}')">${lbl}</div>`;
    }
  }
  return `<div class="ig-time-picker" id="tp-${id}" data-onchange="${escAttr(onChangeJs)}">
    <div class="ai ig-visible-field ig-time-field ig-time-picker-display" onclick="openTimePicker('${id}')">${label}</div>
    <div class="ig-time-picker-panel" id="tp-panel-${id}">${opts}</div>
  </div>`;
}
function closeAllTimePickers(){
  document.querySelectorAll('.ig-time-picker-panel.open').forEach(p=>p.classList.remove('open'));
  document.removeEventListener('click', onTimePickerOutsideClick, true);
}
function onTimePickerOutsideClick(e){
  if(!e.target.closest('.ig-time-picker')) closeAllTimePickers();
}
function openTimePicker(id){
  const alreadyOpen = document.getElementById('tp-panel-'+id).classList.contains('open');
  closeAllTimePickers();
  if(alreadyOpen) return;
  const panel = document.getElementById('tp-panel-'+id);
  panel.classList.add('open');
  const sel = panel.querySelector('.ig-time-picker-opt.selected')
    || panel.querySelector(`[data-dec="${nearestQuarterHourDec()}"]`)
    || panel.firstElementChild;
  if(sel && sel.scrollIntoView) sel.scrollIntoView({block:'center'});
  setTimeout(()=>document.addEventListener('click', onTimePickerOutsideClick, true), 0);
}
function selectTimePickerOpt(id, dec, label){
  const wrap = document.getElementById('tp-'+id);
  wrap.querySelector('.ig-time-picker-display').textContent = label;
  wrap.querySelectorAll('.ig-time-picker-opt').forEach(o=>o.classList.toggle('selected', Math.abs(parseFloat(o.dataset.dec)-dec)<0.01));
  closeAllTimePickers();
  const onChangeJs = wrap.dataset.onchange;
  if(onChangeJs){ const v = dec; eval(onChangeJs); renderAll(); }
}
function timeSelectOptions(selectedDec){
  let opts='<option value="">--</option>';
  for(let h=0;h<24;h++){
    for(let m=0;m<60;m+=15){
      const dec=h+m/60;
      const label=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
      const sel=(selectedDec!=null&&Math.abs(selectedDec-dec)<0.01)?'selected':'';
      opts+=`<option value="${dec}" ${sel}>${label}</option>`;
    }
  }
  return opts;
}

// La barre de statut (encoche iPhone) prend le fond de l'admin sombre
// tant que ce panneau est ouvert, puis rend la main au cover ou à la
// couleur de marque dès qu'on le ferme — sinon on garde une bande
// navy au-dessus d'un panneau #212121.
function syncAdminStatusBar(){
  const meta=document.getElementById('themeColorMeta');
  const panel=document.getElementById('adminPanel');
  const adminOpen=!!(panel && panel.classList.contains('open') && panel.classList.contains('ig-dark-panel'));
  // Les pop-up de confirmation vivent hors du panneau dans le DOM :
  // ce drapeau sur <body> leur permet de suivre son thème.
  document.body.classList.toggle('ig-admin-ui', adminOpen);
  if(!adminOpen) closeThemeMenu();
  if(!meta) return;
  if(adminOpen){
    // La barre de statut prend le fond réel du panneau, quel que soit
    // le thème choisi.
    meta.setAttribute('content', resolvedAdminTheme()==='dark' ? '#212121' : '#F2F2F7');
    return;
  }
  if(isHomeCoverShowing()){
    meta.setAttribute('content',(DATA.homeCover&&DATA.homeCover.statusBarColor)||'#000000');
    return;
  }
  const primary=(DATA.brandColors&&DATA.brandColors.primary)||getComputedStyle(document.documentElement).getPropertyValue('--navy').trim();
  if(primary) meta.setAttribute('content',primary);
}
function closeAdmin(){ document.getElementById('adminOverlay').classList.remove('open'); document.getElementById('adminPanel').classList.remove('open'); syncAdminStatusBar(); }
function armAdminBackGuard(){ try{ history.pushState(null,'',location.href); }catch(e){} }

  dd.innerHTML='<option value="__global">Home</option>'

// Le bouton "Accueil" du bandeau ramène à la racine du panneau,
// quelle que soit la profondeur de navigation.
// Remonte d'un niveau dans l'admin (plat → sous-catégorie → catégorie
// → accueil). Renvoie false s'il n'y avait plus rien à remonter.
function adminBackStep(){
  if(homeSubpageKey==='accueil' && homeCoverSubpage){ closeHomeCoverRow(); return true; }
  if(homeSubpageKey==='formules'){
    if(formuleCatOpen){ closeFormuleCat(); return true; }
    if(formulePane){ closeFormulePane(); return true; }
    if(formuleOpen){ closeFormule(); return true; }
  }
  const tab=DATA.tabs.find(t=>t.id===homeSubpageKey);
  if(tab){
    if(dishDetailOpen[tab.id]!=null){ closeDishDetail(tab.id); return true; }
    if(bevDetailOpen[tab.id]!=null){ closeBevDetail(tab.id); return true; }
    if(tabSectionOpen[tab.id]!=null){ closeTabSection(tab.id); return true; }
  }
  if(homeSubpageKey){ closeHomeRow(); return true; }
  if(adminCurrentTab!=='__global'){ adminGoHome(); return true; }
  return false;
}
function adminGoHome(){
  adminCurrentTab='__global';
  homeSubpageKey=null;
  homeSubpageStack=[];
  renderAdminSection('__global');
}
function adminGoTab(val){
  if(val==='__social'){ adminCurrentTab='__social'; renderAdminSection('__social'); return; }
  // Accès direct : on ouvre la page comme si on y était arrivé depuis
  // Home, pile de navigation comprise, pour que le retour fonctionne.
  if(val==='__go_export'||val==='__go_formules'){
    adminCurrentTab='__global';
    homeSubpageKey = val==='__go_export' ? 'export' : 'formules';
    homeSubpageStack=[];
    renderAdminSection('__global');
    return;
  }
  // Une vraie catégorie : on passe par la navigation sombre, comme le
  // bouton Paramètres — plus d'ancien écran clair.
  adminCurrentTab='__global';
  homeSubpageKey=val;
  homeSubpageStack=['menus-et-plats'];
  renderAdminSection('__global');
}

function adminSaveBar(){
  // Retiré partout — demande explicite de Will : tout s'enregistre
  // automatiquement maintenant (voir renderAll()), plus besoin d'un
  // bouton manuel. Un échec de sauvegarde reste signalé par ailleurs
  // (toast d'erreur dans publishToSupabase), donc rien n'est perdu
  // silencieusement.
  return '';
}
// Wrapped so that a rendering error can never silently block publishing —
// the user always gets a clear toast instead of a click that appears to do nothing.
function handleSaveClick(){

function getAdminOpenSections(){
  const body=document.getElementById('adminBody');
  if(!body) return [];
  return Array.from(body.querySelectorAll('.admin-section.collapsible')).map((s,i)=>({i,open:!s.classList.contains('collapsed'),title:s.querySelector('.admin-sect-title')?.textContent?.trim().slice(0,40)||''}));
}
function restoreAdminOpenSections(states){
  const body=document.getElementById('adminBody');
  if(!body||!states||!states.length) return;
  const secs=body.querySelectorAll('.admin-section.collapsible');
  secs.forEach((s,i)=>{
    const st=states.find(x=>x.i===i);
    if(st){ if(st.open) s.classList.remove('collapsed'); else s.classList.add('collapsed'); }
  });

function renderAdminSection(tid, _skipScroll){
  const body=document.getElementById('adminBody');
  // BUG FIX: every admin section (dish editing, colors, schedule, etc.)
  // used to render and stay fully usable — locally — for anyone who
  // reached this panel via ?admin=1, even with no real session. Only
  // the "Publier" button itself checked for a session. Now nothing
  // renders except the login form until there's an actual Supabase
  // session — matching how admin.html (reservations) already works.
  if(!supaSession){
    adminCurrentTab='__global';
    body.innerHTML=ghSectionHtml();
    return;
  }
  const prevStates=getAdminOpenSections();
  const prevScroll=body?body.scrollTop:0;
  adminCurrentTab=tid;
  // Dark mode (façon ChatGPT) pour "Informations générales" — fond du
  // panneau assombri uniquement quand on est dans cette section,
  // le reste de l'admin n'est pas encore redessiné.
  if(body) body.classList.toggle('ig-dark', tid==='__global');
  const panelEl=document.getElementById('adminPanel');
  if(panelEl) panelEl.classList.toggle('ig-dark-panel', tid==='__global');
  syncAdminStatusBar();
  if(tid==='__global'){
    body.innerHTML=renderAdminGlobal();
  } else if(tid==='__social'){
    body.innerHTML=renderSocialSection()+adminSaveBar();
  } else if(tid==='__reorder'){
    body.innerHTML=renderTabReorder();
  } else {
    const ti=DATA.tabs.findIndex(tb=>tb.id===tid);
    if(ti<0){body.innerHTML='';return;}
    body.innerHTML=renderAdminTab(ti);
  }
  restoreAdminOpenSections(prevStates);
  if(!_skipScroll) body.scrollTop=prevScroll;
  // bind inputs
  body.querySelectorAll('.ai[data-bind]').forEach(input=>input.addEventListener('input',()=>applyBind(input)));
  body.querySelectorAll('.ai[data-bind]').forEach(input=>input.addEventListener('change',()=>applyBind(input)));
  if(document.getElementById('pdfPreviewFrame')) setTimeout(()=>{ if(typeof updatePdfPreview==='function') updatePdfPreview(); }, 100);
  if(document.getElementById('gbizCarousel')) setTimeout(()=>{ if(typeof initGbizCarouselFrames==='function') initGbizCarouselFrames(); }, 100);
  if(document.getElementById('pdfCarousel')) setTimeout(()=>{ if(typeof initPdfCarouselFrames==='function') initPdfCarouselFrames(); }, 100);
  if(document.getElementById('instaCarousel')) setTimeout(()=>{ if(typeof initInstaCarouselFrames==='function') initInstaCarouselFrames(); }, 100);
  if(document.getElementById('menuColorsCarousel')) setTimeout(()=>{ if(typeof initMenuColorsFrames==='function') initMenuColorsFrames(); }, 100);
  if(document.querySelector('textarea.ig-autogrow')) requestAnimationFrame(autoGrowAll);
  if(document.querySelector('.formule-preview-frame')) setTimeout(()=>{ if(typeof initFormulePreviewFrames==='function') initFormulePreviewFrames(); }, 100);
}

function applyBind(input){
  const path=input.dataset.bind.split('.');
  let obj=DATA;
  for(let i=0;i<path.length-1;i++) obj=obj[path[i]];
  const key=path[path.length-1];
  if(input.type==='checkbox') obj[key]=input.checked; else obj[key]=input.value;
  renderAll();
}

function deepSet(obj,path,val){
  const parts=path.split('.');
  for(let i=0;i<parts.length-1;i++) obj=obj[parts[i]];
  obj[parts[parts.length-1]]=val;
}

// Touch drag for mobile pins
(function(){
  let touchPinSrc=null, touchPinY=0, touchPinEl=null;
  document.addEventListener('touchstart',function(e){
    const handle=e.target.closest('.admin-card[data-pinidx]');
    if(!handle) return;
    touchPinSrc=parseInt(handle.dataset.pinidx);
    touchPinEl=handle;
    touchPinY=e.touches[0].clientY;
    handle.classList.add('dragging');
  },{passive:true});
  document.addEventListener('touchmove',function(e){
    if(touchPinSrc===null||!touchPinEl) return;
    e.preventDefault();
    const y=e.touches[0].clientY;
    const els=document.querySelectorAll('.admin-card[data-pinidx]');
    els.forEach(el=>{
      const r=el.getBoundingClientRect();
      if(y>r.top&&y<r.bottom&&parseInt(el.dataset.pinidx)!==touchPinSrc){
        els.forEach(x=>x.classList.remove('drag-over'));
        el.classList.add('drag-over');
      }
    });
  },{passive:false});
  document.addEventListener('touchend',function(e){
    if(touchPinSrc===null) return;
    const over=document.querySelector('.admin-card[data-pinidx].drag-over');
    if(over){
      const tgt=parseInt(over.dataset.pinidx);
      const pins=DATA.pinnedDishes||[];
      const [moved]=pins.splice(touchPinSrc,1);
      pins.splice(tgt,0,moved);
      DATA.pinnedDishes=pins;
      renderAll();
      renderAdminSection(adminCurrentTab);
    }
    document.querySelectorAll('.admin-card[data-pinidx]').forEach(el=>{el.classList.remove('dragging');el.classList.remove('drag-over');});
    touchPinSrc=null; touchPinEl=null;
  });
})();

// Les incontournables sont désormais PAR CATÉGORIE : chacune alimente
// son propre bandeau photo, donc le plafond se compte par catégorie et
// non plus sur tout le site (4 au total, c'était la limite de l'ancien
// bloc unique en page d'accueil).
const PIN_MAX_PER_TAB = 3;
function pinCountForTab(tabId){
  return (DATA.pinnedDishes||[]).filter(p=>p.tabId===tabId).length;
}
// Le rang n'est pas un champ a part : c'est la place de l'entree parmi
// celles de sa categorie, dans DATA.pinnedDishes. Rien a migrer sur les
// donnees deja enregistrees, et la section « incontournables » de la
// page d'accueil, qui lisait deja ce tableau dans l'ordre, suit toute
// seule.
function tabPinSlots(tabId){
  const pins=DATA.pinnedDishes||[];
  const out=[];
  pins.forEach((p,i)=>{ if(p.tabId===tabId) out.push(i); });
  return out;
}
function pinRankOf(tabId,pid){
  const slots=tabPinSlots(tabId);
  const k=slots.findIndex(i=>DATA.pinnedDishes[i].pid===pid);
  return k<0 ? 0 : k+1;
}
// Choisir un rang deja pris echange les deux plats : les numeros
// restent donc toujours 1..N, sans doublon ni trou, et sans avoir a
// renumeroter quoi que ce soit.
function setPinRank(tabId,pid,rank){
  const pins=DATA.pinnedDishes||[];
  const slots=tabPinSlots(tabId);
  const from=slots.findIndex(i=>pins[i].pid===pid);
  const to=rank-1;
  if(from<0 || to<0 || to>=slots.length || to===from) return;
  const a=slots[from], b=slots[to];
  const tmp=pins[a]; pins[a]=pins[b]; pins[b]=tmp;
  DATA.pinnedDishes=pins;
  renderAll();
  if(editCtx && editCtx.type==='dish') openEditDish(editCtx.ti, editCtx.ci, editCtx.di);
  renderAdminSection(adminCurrentTab);
  publishNow(true);
}
function togglePin(tabId,ci,di){
  const tb=DATA.tabs.find(t=>t.id===tabId);
  const dish=tb&&tb.cards[ci]&&tb.cards[ci].dishes&&tb.cards[ci].dishes[di];
  if(!dish) return;
  ensureDishPid(dish);
  const pins=DATA.pinnedDishes||[];
  const idx=pins.findIndex(p=>p.tabId===tabId&&p.pid===dish._pid);
  if(idx>=0){ pins.splice(idx,1); }
  else if(pinCountForTab(tabId)<PIN_MAX_PER_TAB){ pins.push({tabId,pid:dish._pid,name:t(dish.name)}); }
  else { showToast(`${PIN_MAX_PER_TAB} incontournables maximum par catégorie`); return; }
  DATA.pinnedDishes=pins;
  renderAll();
  // La fiche ouverte doit refléter l'étoile tout de suite.
  if(editCtx && editCtx.type==='dish') openEditDish(editCtx.ti, editCtx.ci, editCtx.di);
  renderAdminSection(adminCurrentTab);
  // Enregistrement IMMÉDIAT, pas au bout des 900 ms habituelles :
  // épingler est un geste ponctuel, souvent suivi d'un rechargement
  // pour vérifier le rendu — et le délai avalait justement le
  // changement qu'on venait de faire.
  publishNow(true);
}

// Une tab est maintenant une vraie navigation à deux niveaux : la
// liste des sections (un bloc chacune, comme "Changer l'ordre des
// onglets"), puis le détail d'UNE section (ses plats) une fois qu'on
// clique dedans. tabSectionOpen retient, par tab, quelle section est
// actuellement ouverte (ou aucune = on est sur la liste).
let tabSectionOpen = {};
// Un plat, dans une section de plats (pas boissons/variantes), ouvre
// lui aussi sa propre page — même logique, un niveau plus profond.
let dishDetailOpen = {};
function openDishDetail(tabId, di){ dishDetailOpen[tabId] = di; refreshCurrentTabView(tabId); }
function closeDishDetail(tabId){ dishDetailOpen[tabId] = null; refreshCurrentTabView(tabId); }
// Même mécanique pour les boissons.
let bevDetailOpen = {};
function openBevDetail(tabId, ii){ bevDetailOpen[tabId] = ii; refreshCurrentTabView(tabId); }
function closeBevDetail(tabId){ bevDetailOpen[tabId] = null; refreshCurrentTabView(tabId); }
// BUG FIX (retombe en light mode) : appeler renderAdminSection(tabId)
// directement prend la branche générique de rendu (l'ancien accès
// direct par onglet, sans l'habillage sombre) — alors qu'on est en
// réalité toujours dans Home → Catégories. On doit redemander
// __global pour que le contenu reste imbriqué dans le bon wrapper.
function refreshCurrentTabView(tabId){
  if(adminCurrentTab==='__global') renderAdminSection('__global');
  else renderAdminSection(tabId);
}
function openTabSection(tabId, ci){ tabSectionOpen[tabId] = ci; dishDetailOpen[tabId] = null; bevDetailOpen[tabId] = null; refreshCurrentTabView(tabId); }
function closeTabSection(tabId){ tabSectionOpen[tabId] = null; refreshCurrentTabView(tabId); }

// Une catégorie n'a très souvent qu'une seule section, laissée sans
// titre. Cliquer sur une ligne vide juste pour atteindre ses plats
// n'apporte rien : dans ce cas précis on liste les plats directement
// sur la page de la catégorie. Renvoie l'index de cette section, ou
// null si la navigation normale (par sections) s'applique.
function soloUntitledCardIndex(tab){
  if(!tab || !Array.isArray(tab.cards)) return null;
  // La section "hors section" est simplement la première sans titre :
  // elle peut coexister avec de vraies sections nommées (typiquement
  // après avoir rangé une partie seulement des plats).
  const i=tab.cards.findIndex(c=>c.type!=='bevs'&&c.type!=='variants'&&!(t(c.label)||'').trim());
  return i===-1?null:i;
}
function renderAdminTab(ti){
  const tab=DATA.tabs[ti];
  const openCi = tabSectionOpen[tab.id];
  if(openCi!=null && tab.cards[openCi]) return renderTabSectionDetail(ti, openCi);
  // Plats listés directement (voir soloUntitledCardIndex) : le détail
  // d'un plat doit donc aussi pouvoir s'ouvrir depuis ce niveau.
  const inlineCi = soloUntitledCardIndex(tab);
  if(inlineCi!=null){
    const openDi = dishDetailOpen[tab.id];
    const dishes = tab.cards[inlineCi].dishes||[];
    if(openDi!=null && dishes[openDi]) return renderDishDetailBody(ti, inlineCi, openDi);
  }
  return renderTabSectionList(ti);
}

function renderTabSectionList(ti){
  const tab=DATA.tabs[ti];
  let h='';

  // Le nom de la catégorie, le masquage et la suppression vivent
  // désormais dans le bloc "Gestion de la catégorie", tout en bas
  // (voir plus loin) — le haut de page est réservé au contenu.
  const tabNameEsc=(tab.label.fr||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");

  // Sections — un seul bloc cliquable chacune (nom en bleu clair,
  // petite flèche à droite), on entre dans le détail au clic. Plus
  // d'accordéon qui déplie tout sur place : trop d'informations d'un
  // coup quand il y a beaucoup de plats.
  // Plats en accès direct quand il n'y a qu'une section sans titre —
  // ou aucune section du tout (on la crée alors à la volée au premier
  // plat ajouté). Placé au-dessus du bloc "Section".
  const inlineCi = soloUntitledCardIndex(tab);
  const isBevTab = tab.id==='boissons' || (tab.cards.length>0 && tab.cards.every(c=>c.type==='bevs'));
  // Le tout premier bloc de la page colle au fil d'Ariane (comme la
  // liste des plats dans une section) ; seuls les blocs SUIVANTS
  // prennent la grande marge qui les sépare du précédent.
  let firstBlock = true;
  const groupLabel = txt => {
    const mt = firstBlock ? '2' : '30';
    firstBlock = false;
    return `<div class="ig-group-label" style="margin:${mt}px 0 8px 4px;display:block;color:var(--ig-text-dimmer)!important">${txt}</div>`;
  };
  if(inlineCi!=null || (!tab.cards.length && !isBevTab)){
    const dishes = inlineCi!=null ? (tab.cards[inlineCi].dishes||[]) : [];
    h+=groupLabel('Plats');
    if(dishes.length){
      h+=`<div class="ig-list">`;
      dishes.forEach((d,di)=>{
        const dName=d.name&&(d.name[adminLang]||d.name.fr)||'';
        h+=`<div class="ig-row" onclick="openDishDetail('${tab.id}',${di})">
          <span class="ig-row-label">${escAttr(dName)||'(sans nom)'}</span>
          <span class="ig-row-chevron">›</span>
        </div>`;
      });
      h+=`</div>`;
    }
    h+=`<div class="ig-list" style="margin-top:${dishes.length?'14':'0'}px"><div class="ig-row" style="justify-content:center" onclick="addDishToSoloSection(${ti})"><span style="color:var(--ig-green);font-weight:500">Ajouter un plat</span></div></div>`;
  }

  // Les sections réellement nommées. Une section sans titre créée pour
  // héberger des plats "hors section" n'est pas une vraie section du
  // point de vue de l'utilisateur : ses plats sont déjà listés
  // au-dessus, donc on ne l'affiche pas ici comme "(sans titre)".
  const realCards = tab.cards.map((card,ci)=>({card,ci}))
    .filter(({card,ci}) => ci!==inlineCi);
  h+=groupLabel('Sous-catégorie');
  if(realCards.length){
    h+=`<div class="ig-list">`;
    realCards.forEach(({card,ci})=>{
      h+=`<div class="ig-row" onclick="openTabSection('${tab.id}',${ci})">
        <span class="ig-row-label">${t(card.label)||'(sans titre)'}</span>
        <span class="ig-row-chevron">›</span>
      </div>`;
    });
    h+=`</div>`;
  }

  h+=`<div class="ig-list" style="margin-top:${realCards.length?'14':'0'}px"><div class="ig-row" style="justify-content:center" onclick="askNewSection(${ti})"><span style="color:var(--ig-green);font-weight:500">Ajouter une sous-catégorie</span></div></div>`;

  // Réordonner les sections (2+ sections seulement), tout en bas.
  if(tab.cards.length>=2){
    h+=`<div class="admin-section collapsible collapsed" style="margin-top:20px"><div class="admin-sect-title" onclick="toggleAdminSection(this)">Ordre des sous-catégories</div><div class="admin-sect-body">`;
    h+=`<div class="ig-group-label" style="margin:0 0 8px 4px;display:block;color:var(--ig-text-dimmer)!important">Changer l'ordre des sous-catégories</div>`;
    h+=`<div id="sectionReorderList" data-ti="${ti}">`;
    tab.cards.forEach((card,ci)=>{
      h+=`<div class="admin-card sec-reorder-row" style="display:flex;align-items:center;gap:10px;background:var(--ig-card);margin-bottom:6px"
            data-ti="${ti}" data-ci="${ci}"
            ondragover="onDragSectionRowOver(event,${ti},${ci})"
            ondragleave="onDragLeave(event)"
            ondrop="onDropSectionRow(event,${ti},${ci})">
        <span class="drag-handle" draggable="true" style="font-size:18px;padding:8px 6px;color:var(--ig-text-dim);cursor:grab;touch-action:none" ondragstart="onDragSectionRow(event,${ti},${ci})" ondragend="onDragSectionRowEnd(event)">⠿</span>
        <span style="font-size:13.5px;font-weight:500;color:var(--ig-text);flex:1;min-width:0">${t(card.label)||'(sans titre)'}</span>
        <button class="sec-move-btn" ${ci===0?'disabled':''} title="Monter" onclick="moveSection(${ti},${ci},-1)"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 14 6-6 6 6"/></svg></button>
        <button class="sec-move-btn" ${ci===tab.cards.length-1?'disabled':''} title="Descendre" onclick="moveSection(${ti},${ci},1)"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 10 6 6 6-6"/></svg></button>
      </div>`;
    });
    h+=`</div></div></div>`;
  }

  // Actions sur la catégorie elle-même — tout en bas, sous leur propre
  // titre : ce sont des actions de fin de page, pas le point de départ
  // de l'édition.
  h+=`<div class="ig-group-label" style="margin:34px 0 8px 4px;display:block;color:var(--ig-text-dimmer)!important">Gestion de la catégorie</div>
  <div class="ig-stack-field">
    <span class="ig-stack-label">Nom de la catégorie</span>
    <input class="ai" value="${escAttr(tab.label[adminLang]||'')}" placeholder="Ex: Entrées" oninput="DATA.tabs[${ti}].label[adminLang]=this.value;renderAll()">
  </div>
  <div class="ig-list">
    <div class="ig-row" style="cursor:default">
      <span class="ig-row-icon">${tab.visible===false?EYE_OFF_SVG:EYE_SVG}</span>
      <span class="ig-row-label">Masquer la catégorie</span>
      <label class="ig-switch" style="margin-left:auto"><input type="checkbox" ${tab.visible===false?'checked':''} onchange="DATA.tabs[${ti}].visible=!this.checked;renderAll();refreshCurrentTabView(DATA.tabs[${ti}].id);renderAdminSection('__global')"><span class="ig-switch-track"><span class="ig-switch-thumb"></span></span></label>
    </div>
    <div class="ig-row" onclick="askConfirm('Supprimer la catégorie « ${tabNameEsc} » et tout son contenu ?',()=>{delTab(${ti});adminCurrentTab='__global';closeHomeRow();})">
      <span class="ig-row-icon" style="color:var(--ig-red)">${TRASH_SVG}</span>
      <span class="ig-row-label" style="color:var(--ig-red)">Supprimer la catégorie</span>
    </div>
  </div>`;

  h+=adminSaveBar();
  return h;
}

// Actions sur la section elle-même — tout en bas de sa page, sous leur
// propre titre, comme pour une catégorie ou un plat.
function sectionManageBlockHtml(ti, ci){
  const card=DATA.tabs[ti].cards[ci];
  return `<div class="ig-group-label" style="margin:34px 0 8px 4px;display:block;color:var(--ig-text-dimmer)!important">Gestion de la sous-catégorie</div>
  <div class="ig-stack-field">
    <span class="ig-stack-label">Nom de la sous-catégorie</span>

  </div>
  <div class="ig-list">

    </div>
  </div>`;
}
function renderTabSectionDetail(ti, ci){
  const tab=DATA.tabs[ti];
  const card=tab.cards[ci];
  let h='';

  if(card.type==='bevs'){
    const openBi = bevDetailOpen[tab.id];
    if(openBi!=null && (card.items||[])[openBi]){
      h+=renderBevDetailBody(ti, ci, openBi);
      return h;
    }
    h+=`<div class="ig-list">`;
    (card.items||[]).forEach((item,ii)=>{
      const bevName=typeof item.name==='object'?(item.name[adminLang]||item.name.fr||''):(item.name||'');
      h+=`<div class="ig-row" onclick="openBevDetail('${tab.id}',${ii})">
        <span class="ig-row-label">${escAttr(bevName)||'(sans nom)'}</span>
        <span class="ig-row-chevron">›</span>
      </div>`;
    });
    h+=`</div>`;
    h+=`<div class="ig-list" style="margin-top:14px"><div class="ig-row" style="justify-content:center" onclick="addBev(${ti},${ci})"><span style="color:var(--ig-green);font-weight:500">Ajouter une boisson</span></div></div>`;
    h+=sectionManageBlockHtml(ti,ci);
  } else if(card.type==='variants'){
    h+=`<div class="admin-card">`;
    h+=imgFieldHtml(card.img||'',`DATA.tabs[${ti}].cards[${ci}].img=this.value;renderAll()`,"Image URL ou uploader");
    (card.variants||[]).forEach((v,vi)=>{
      const vFr=typeof v.name==='object'?v.name.fr||'':v.name||'';
      const vVal=typeof v.name==='object'?(v.name[adminLang]||''):v.name||'';
      h+=`<div class="ai-row" style="margin-top:4px" ondragover="onDragOver(event,${ti},${ci},${vi})" ondragleave="onDragLeave(event)" ondrop="onDropVariant(event,${ti},${ci},${vi})"><span class="drag-handle" title="Glisser pour réordonner" draggable="true" ondragstart="onDragVariant(event,${ti},${ci},${vi})" ondragend="onDragEndHandle(event)">⠿</span><input class="ai ig-visible-field" value="${vVal}" placeholder="${adminLang!=='fr'?vFr:''}" oninput="if(typeof DATA.tabs[${ti}].cards[${ci}].variants[${vi}].name!=='object'){DATA.tabs[${ti}].cards[${ci}].variants[${vi}].name={fr:DATA.tabs[${ti}].cards[${ci}].variants[${vi}].name};}DATA.tabs[${ti}].cards[${ci}].variants[${vi}].name[adminLang]=this.value;renderAll()"><input class="ai ai-sm ig-visible-field" value="${v.price||''}" oninput="DATA.tabs[${ti}].cards[${ci}].variants[${vi}].price=this.value;renderAll()"><button class="adel" onclick="askConfirm('Supprimer cette variante ?',()=>delVariant(${ti},${ci},${vi}))">×</button></div>`;
    });
    h+=`</div>`;
    h+=`<button class="aadd ig-add-btn ig-add-btn-standalone" onclick="addVariant(${ti},${ci})">Variante</button>`;
  } else {
    const openDi = dishDetailOpen[tab.id];
    if(openDi!=null && card.dishes[openDi]){
      h+=renderDishDetailBody(ti, ci, openDi);
      h+=adminSaveBar();
      return h;
    } else {
      h+=`<div class="ig-list">`;
      card.dishes.forEach((d,di)=>{
        const dName=d.name&&(d.name[adminLang]||d.name.fr)||'';
        h+=`<div class="ig-row" onclick="openDishDetail('${tab.id}',${di})">
          <span class="ig-row-label">${escAttr(dName)||'(sans nom)'}</span>
          <span class="ig-row-chevron">›</span>
        </div>`;
      });
      h+=`</div>`;
      h+=`<div class="ig-list" style="margin-top:14px"><div class="ig-row" style="justify-content:center" onclick="addDish(${ti},${ci})"><span style="color:var(--ig-green);font-weight:500">Ajouter un plat</span></div></div>`;
      h+=sectionManageBlockHtml(ti,ci);
      h+=adminSaveBar();
      return h;
    }
  }

  h+=adminSaveBar();
  return h;
}

// Une boisson suit exactement le même modèle qu'un plat : sa propre
// page, des champs "empilés" avec leur libellé intégré, et les mêmes
// blocs outils. Seule différence de fond : une boisson a plusieurs
// formats/contenances/prix au lieu d'un prix unique.
function renderBevDetailBody(ti, ci, ii){
  const tab=DATA.tabs[ti];
  const card=tab.cards[ci];
  const item=card.items[ii];
  const base=`DATA.tabs[${ti}].cards[${ci}].items[${ii}]`;
  const nameVal=typeof item.name==='object'?(item.name[adminLang]||''):(item.name||'');
  const nameSetter=`if(typeof ${base}.name!=='object'){${base}.name={fr:${base}.name};}${base}.name[adminLang]=this.value;renderAll()`;
  const descSetter=`if(!${base}.desc||typeof ${base}.desc!=='object'){${base}.desc={};}${base}.desc[adminLang]=this.value;renderAll()`;
  let h='';

  h+=`<div class="ig-stack-field">
    <span class="ig-stack-label">Nom de la boisson</span>
    <input class="ai" value="${escAttr(nameVal)}" placeholder="Ex: Sancerre blanc" oninput="${nameSetter}">
  </div>
  <div class="ig-stack-field">
    <span class="ig-stack-label">Sous-titre / notes de dégustation</span>
    <textarea class="ai" rows="2" style="resize:vertical" placeholder="Ex: Domaine Vacheron — vif et minéral" oninput="${descSetter}">${escAttr((item.desc&&item.desc[adminLang])||'')}</textarea>
  </div>`;

  h+=`<div class="ig-panel-card">
    <div class="ig-panel-hdr">
      <span class="ig-panel-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12l-1 7a5 5 0 0 1-10 0Z"/><line x1="12" y1="14" x2="12" y2="20"/><line x1="8.5" y1="21" x2="15.5" y2="21"/></svg></span>
      <span class="ig-panel-title">Formats, contenances &amp; prix</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:12px">`;
  (item.sizes||[]).forEach((s,si)=>{
    const unit=s.unit||'cl';
    h+=`<div style="display:flex;align-items:center;gap:6px">
      <select class="ai ig-hm-select ig-bev-sel" style="flex:1;min-width:0" onchange="${base}.sizes[${si}].format=this.value;const f=BEV_FORMATS.find(f=>f.key===this.value);if(f&&f.autoCl!=null){${base}.sizes[${si}].cl=f.autoCl;${base}.sizes[${si}].unit='cl';}renderAll();refreshCurrentTabView('${tab.id}');renderAdminSection(adminCurrentTab)">${bevFormatOptionsHtml(s.format)}</select>
      <input class="ai ig-bev-sel ig-num-white-arrows" type="number" min="0" placeholder="Cont." value="${s.cl||''}" style="width:68px;flex:none" oninput="${base}.sizes[${si}].cl=this.value;renderAll()">
      <select class="ai ig-hm-select ig-bev-sel" style="width:62px;flex:none" onchange="${base}.sizes[${si}].unit=this.value;renderAll()"><option value="cl" ${unit==='cl'?'selected':''}>cl</option><option value="l" ${unit==='l'?'selected':''}>L</option></select>
      <input class="ai ig-bev-sel ig-num-white-arrows" type="number" min="0" step="0.5" placeholder="Prix" value="${s.price||''}" style="width:72px;flex:none" oninput="${base}.sizes[${si}].price=this.value;renderAll()">
      <button class="ig-gallery-del" style="position:static;transform:none;flex:none" title="Retirer ce format" onclick="${base}.sizes.splice(${si},1);renderAll();refreshCurrentTabView('${tab.id}');renderAdminSection(adminCurrentTab)">${TRASH_SVG}</button>
    </div>`;
  });
  h+=`</div>

// BUG FIX: tab ids used to be random timestamps ("tab_1782264697487"), which
// meant a tab's shareable URL (#tab_...) never matched its actual name.
// New tabs now get a slug derived from their name instead.
function slugifyTabId(label){
  const base=(label||'').toString().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'') // strip accents (é→e, etc.)
    .replace(/[^a-z0-9]+/g,'-')
    .replace(/^-+|-+$/g,'');
  return base||'tab';
}
function uniqueTabId(baseSlug, excludeTab){
  let slug=baseSlug, n=2;
  while(DATA.tabs.some(tb=>tb!==excludeTab && tb.id===slug)){ slug=baseSlug+'-'+n; n++; }
  return slug;
}
// One-time migration: any tab still carrying an old-style "tab_<timestamp>"
// id gets a proper name-based slug, with every reference to it (pins,
// current tab, last-visited tab) updated to match.
function migrateTabIds(){
  (DATA.tabs||[]).forEach(tab=>{
    if(!/^tab_\d+$/.test(tab.id)) return;
    const oldId=tab.id;
    const name=(tab.label&&(tab.label.fr||tab.label.en||Object.values(tab.label)[0]))||oldId;
    const newId=uniqueTabId(slugifyTabId(name), tab);
    tab.id=newId;
    (DATA.pinnedDishes||[]).forEach(p=>{ if(p.tabId===oldId) p.tabId=newId; });
    if(currentTabId===oldId) currentTabId=newId;
    if(sessionStorage.getItem('lastTabId')===oldId) sessionStorage.setItem('lastTabId',newId);
  });
}

// Menus/formules autonomes (Menu du jour, Menu Saint-Valentin…),
// séparés du vrai menu (DATA.tabs) mais utilisant exactement la même
// forme de données (mêmes catégories → cartes → plats) pour pouvoir
// être passés tels quels au moteur d'export existant (cfg.tabsSource
// — voir buildPdfBlocks) sans aucune nouvelle logique de rendu.
// Maximum 10 : au-delà, la plus ancienne est remplacée — demande
// explicite de Will pour éviter une liste sans fin.
function formule_ensureInit(){ if(!DATA.formules) DATA.formules = []; }
// Aperçu en direct pour les champs texte (nom de plat, prix,
// description, catégorie...) — léger debounce pour ne pas
// reconstruire l'aperçu à chaque frappe (buildFormulePage fait
// plusieurs passes de mesure, ça ralentirait sinon).
let _formulePreviewTimer = null;
// ── Réglage plein écran d'une couleur / taille (mobile) ──────────
// Toucher une ligne de "Couleurs et style" ouvre un écran dédié :
// l'aperçu en grand tout en haut, le seul réglage concerné en bas
// sous le pouce. Plus besoin de faire défiler pour voir l'effet.
let _tunerState=null;
function formuleTunerOpen(fid, key, sizeKey, label){
  const f = DATA.formules && DATA.formules.find(x=>x.id===fid);
  if(!f) return;
  _tunerState={ fid, key, sizeKey };
  const sel=document.getElementById('formuleTunerSelect');
  sel.innerHTML=FORMULE_COLOR_FIELDS.map(d=>`<option value="${d.key}" ${d.key===key?'selected':''}>${d.label}</option>`).join('');
  formuleTunerBuildCarousel(fid);
  formuleTunerRenderCtrl(f, key, sizeKey);
  formuleTunerRenderAlign(f, key);
  document.body.classList.add('tuner-open');
  document.getElementById('formuleTuner').classList.add('open');
  requestAnimationFrame(formuleTunerFitFrames);
}
// Les trois formats sont côte à côte dans un carrousel qui se balaie,
// avec des points en dessous — même principe que les aperçus de la
// page principale.
const TUNER_VARIANTS=[{v:'a4',label:'A4'},{v:'post',label:'Post'},{v:'story',label:'Story'}];
// Cinq crans de taille plutôt qu'un pourcentage libre : viser une
// valeur au pouce est pénible, et cinq choix couvrent le besoin.
const TUNER_STEPS=[70,85,100,120,140];
const FORMULE_COLOR_FIELDS=[
  {key:'formuleTitleColor', sizeKey:'formuleTitlePct', label:'Titre'},
  {key:'formuleSubColor',   sizeKey:'formuleSubPct',   label:'Sous-titre'},
  {key:'instaTitleColor',   sizeKey:'titleSizePct',    label:'Sections'},
  {key:'instaMenuColor',    sizeKey:'menuSizePct',     label:'Plats'},
  {key:'instaDescColor',    sizeKey:'descSizePct',     label:'Description'},
  {key:'instaBgColor',      sizeKey:null,              label:'Arrière-plan'}
];
// Ramène une valeur stockée sur le cran le plus proche : d'anciens
// réglages libres (50, 137…) tombaient hors de l'échelle et plaçaient
// la poignée tout à gauche.
function tunerStepValue(pct){ return TUNER_STEPS[tunerStepIndexFor(pct)]; }
function tunerRatioFor(v){ return v==='a4' ? INSTA_A4_RATIO : v==='post' ? INSTA_POST_RATIO : INSTA_RATIO; }
function tunerStepIndexFor(pct){
  const p = pct ?? 100;
  const min=TUNER_STEPS[0], max=TUNER_STEPS[TUNER_STEPS.length-1];
  if(p<min || p>max) return TUNER_STEPS.indexOf(100); // hors échelle = neutre
  let best=TUNER_STEPS.indexOf(100), d=Infinity;
  TUNER_STEPS.forEach((v,i)=>{ const dd=Math.abs(v-p); if(dd<d){ d=dd; best=i; } });
  return best;
}
function formuleTunerBuildCarousel(fid){
  const f=DATA.formules && DATA.formules.find(x=>x.id===fid);
  const car=document.getElementById('formuleTunerCarousel');
  if(!f || !car) return;
  // Le document est posé via la propriété srcdoc plutôt que dans le
  // HTML : pas d'échappement d'attribut à gérer sur un document entier.
  car.innerHTML=TUNER_VARIANTS.map(t=>
    `<div class="formule-tuner-slide"><iframe class="formule-preview-frame" data-fid="${fid}" data-variant="${t.v}"></iframe></div>`
  ).join('');
  car.querySelectorAll('.formule-preview-frame').forEach(frame=>{
    const ratio=tunerRatioFor(frame.dataset.variant);
    const built=buildFormulePage(formule_buildCfg(f), ratio);
    frame.srcdoc=buildPreviewSlideDoc(built.css, built.pages[0].html, built.pages[0].spaceScale, INSTA_RENDER_W, Math.round(INSTA_RENDER_W*ratio));
  });
  formuleTunerFitFrames();
  document.getElementById('formuleTunerFormat').innerHTML=TUNER_VARIANTS.map((t,i)=>
    `<button type="button" class="formule-fmt-tab${i===0?' active':''}" onclick="formuleTunerGoTo(${i})">${t.label}</button>`).join('');
  car.scrollLeft=0;
}
// Chaque aperçu occupe la place disponible en respectant son format :
// on prend la contrainte qui s'applique (hauteur ou largeur) au lieu
// d'en fixer une et de laisser l'autre déborder.
// BUG FIX (aperçu rogné à droite et en bas) : on calait la boîte de
// l'iframe sur le rapport exact du format, puis le document se mettait
// à l'échelle sur cette boîte. Au moindre écart d'arrondi entre les
// deux calculs, la page dépassait d'un ou deux pixels et le filet doré
// se retrouvait coupé. L'iframe prend maintenant toute la place
// disponible et c'est la mise à l'échelle interne, qui connaît les
// dimensions réelles, qui centre et contient la page. Un seul calcul,
// donc plus de désaccord possible.
function formuleTunerFitFrames(){}
window.addEventListener('resize', ()=>{ if(document.getElementById('formuleTuner').classList.contains('open')) formuleTunerFitFrames(); });

function formule_setColor(fid, key, value){
  const f = DATA.formules.find(x=>x.id===fid);

  // à chaque oninput détruisait le champ <input type="color"> pendant
  // qu'on glissait dedans, ce qui refermait le sélecteur natif du
  // navigateur avant d'avoir choisi. On ne touche plus au DOM ici,
  // juste l'aperçu (léger, ne recrée aucun champ).
  if(f){ f[key] = value; formule_schedulePreviewRefresh(); scheduleAutoSave(true); }

function formule_setField(fid, field, value){
  const f = DATA.formules.find(x=>x.id===fid);
  if(f) f[field] = value;
  // BUG FIX (aperçu figé) : les cases d'alignement notamment ne
  // rafraîchissaient jamais l'aperçu — seul un rendu complet de la
  // section le faisait, et elles ne le déclenchaient pas. On rafraîchit
  // juste les iframes d'aperçu ici (léger, ne perd pas le focus/le
  // défilement, contrairement à un renderAdminSection complet).
  // BUG FIX (curseurs saccadés) : ce rafraîchissement était immédiat,
  // donc reconstruisait les trois aperçus à CHAQUE pixel parcouru par
  // un curseur de taille — d'où le glissement dur. On regroupe les
  // rafraîchissements, assez court pour rester instantané au clic.
  // BUG FIX (les tailles ne changeaient pas) : la mise à jour à chaud
  // ne remplace que la feuille de style, or les tailles des plats et
  // des sections sont écrites EN DUR dans le HTML généré (l'ajustement
  // automatique calcule une taille par ligne pour qu'elle tienne).
  // Une nouvelle CSS ne pouvait donc rien changer — seul l'espacement
  // bougeait. Les réglages de taille reconstruisent l'aperçu ; les
  // couleurs et l'alignement, purement CSS, gardent la voie rapide.
  if(typeof field==='string' && /Pct$/.test(field) && field!=='dishGapPct') formule_scheduleFullPreview();
  else formule_scheduleFastPreview();
  scheduleAutoSave(true);
}

function formule_onDragCat(e, fid, catIdx){

// Titre + texte libre optionnels, injectés en préambule de la
// première page — voir buildInstaPages (cfg.formulePreamble). Comptent
// dans le calcul "tout tenir sur une page", comme le reste.
function formule_buildPreamble(f, cfg){
  const title = f.title || f.name || '';
  if(!title && !f.freeText) return '';
  const css = buildInstaCSS(cfg);
  // RÈGLE DE BASE (Will) : jamais un mot seul sur la dernière ligne.
  // On soude les deux derniers mots de chaque ligne par une espace
  // insécable — ils passent alors à la ligne ensemble. Le texte libre
  // peut contenir des retours forcés : on traite chaque segment à part.
  const noOrphan = txt => {
    const parts = txt.trim().split(/\s+/);
    if(parts.length < 3) return txt;
    return parts.slice(0,-2).join(' ') + ' ' + parts.slice(-2).join(' ');
  };
  const subHtml = f.freeText
    ? f.freeText.split('\n').map(noOrphan).join('<br>')
    : '';
  return `${title?`<div class="formule-title">${noOrphan(title)}</div>`:''}${f.freeText?`<div class="formule-freetext">${subHtml}</div>`:''}`;
}
// Config Instagram/Formule partagée entre l'export et l'aperçu — un
// seul endroit où les couleurs, la police, l'alignement, la casse ET
// les curseurs de taille par élément (Titre/Plat/Description, en %
// de la taille de base) sont assemblés, pour ne jamais les faire
// diverger entre ce qui s'affiche en aperçu et ce qui s'exporte.
function formule_buildCfg(f){
  const base = pdfCfg();
  const cfg = {
    ...base, format:'insta', tabsSource: f.tabs,
    // BUG FIX : depuis l'unification des couleurs d'export, le moteur
    // Instagram lit menuTitleColor/menuNameColor/menuDescColor/
    // menuBgColor. La formule ne renseignait que les anciennes clés
    // insta*, donc aucun de ses réglages de couleur n'avait d'effet —
    // c'est le jeu global qui s'appliquait. On mappe les deux, en
    // retombant sur le réglage global quand la formule ne surcharge pas.
    instaTitleColor: f.instaTitleColor, instaMenuColor: f.instaMenuColor,
    instaDescColor: f.instaDescColor, instaBgColor: f.instaBgColor,
    menuTitleColor: f.instaTitleColor || base.menuTitleColor,
    menuNameColor: f.instaMenuColor || base.menuNameColor,
    menuDescColor: f.instaDescColor || base.menuDescColor,
    menuBgColor: f.instaBgColor || base.menuBgColor,
    // Titre et sous-titre de la formule : réglables séparément du
    // reste (ils partageaient la couleur des sections / descriptions).
    formuleTitleColor: f.formuleTitleColor, formuleTitlePct: f.formuleTitlePct,
    formuleSubColor: f.formuleSubColor, formuleSubPct: f.formuleSubPct,
    instaFont: f.instaFont || base.instaFont,
    alignContentLeft: !!f.alignContentLeft, alignTitleLeft: !!f.alignTitleLeft,
    catCase: f.catCase, descCase: f.descCase, nameCase: f.nameCase,
    // BUG FIX (le + / − des sections et des plats restait sans effet) :
    // le pourcentage était fondu dans la taille AVANT l'ajustement
    // automatique, qui cherche la plus grande police tenant sur une
    // page. Agrandir poussait donc l'ajustement à réduire d'autant, et
    // les deux s'annulaient. Le pourcentage voyage désormais à part et
    // s'applique après, une fois l'échelle de base trouvée.
    instaTitleSize: Math.round(base.instaTitleSize||45),
    instaMenuSize: Math.round(base.instaMenuSize||21),
    instaDescSize: Math.round((base.instaDescSize||19) * 1.10),
    fmtPct: { title: f.titleSizePct ?? 100, menu: f.menuSizePct ?? 100, desc: f.descSizePct ?? 100 },
    dishGapPct: f.dishGapPct ?? 100,
    // BUG FIX : le titre et le sous-titre se calculaient à partir des
    // tailles ci-dessus, donc "Sections" déplaçait aussi le titre et
    // "Description" déplaçait aussi le sous-titre. On repart des
    // tailles de référence, non modulées, pour qu'ils ne dépendent que
    // de leur propre réglage.
    formuleTitleBase: Math.round((base.instaTitleSize||45) * 0.8),
    formuleSubBase: Math.round((base.instaDescSize||19) * 1.10 * 0.85)
  };
  cfg.formulePreamble = formule_buildPreamble(f, cfg);
  return cfg;
}
function formule_exportInsta(fid, variant){
  const f = DATA.formules.find(x=>x.id===fid);
  if(!f) return;
  const cfg = formule_buildCfg(f);
  exportInstaImages(cfg, variant);
}

let dragSectionSrc=null;
function onDragSection(e,ti,ci){

  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT'||e.target.tagName==='BUTTON') { e.preventDefault(); return; }

let dragSectionRowSrc=null;
// BUG FIX (réordonner impossible au doigt) : le glisser-déposer
// reposait sur l'API HTML5 drag-and-drop, qui ne se déclenche pas sur
// écran tactile — la ligne semblait "bloquée", et le touch-action:none

// fonctionnent partout ; le glisser reste disponible à la souris, via
// la poignée seule.
function moveTab(ti, dir){
  const to=ti+dir;

}
function moveSection(ti, ci, dir){

  cards.splice(to,0,moved);

  refreshCurrentTabView(DATA.tabs[ti].id);

}

function onDrop(e,ti,ci,di){
