    <div class="edit-pop-foot"><button class="edit-save" onclick="saveAndPublishEditPop()">Publier</button></div>
  </div>
</div>

<!-- LIGHTBOX -->
<div class="lb" id="lb">
  <!-- Vue plein écran d'un plat : fond à la couleur du restaurant (le
       plus grand aplat de sa couleur du site, et il arrive pile au
       moment où l'on désire le plat), photo en 4:5 comme partout
       ailleurs, fermeture à gauche, position dans la catégorie au
       centre, et des points en bas pour dire qu'on peut glisser. -->
  <div class="lb-card">
    <!-- La catégorie remonte au-dessus de l'image, sur la couleur du
         restaurant : il ne reste plus que le nom et la description à
         lire en bas. Le compteur et la croix encadrent ce bandeau, ce
         qui laisse la catégorie parfaitement centrée. -->
    <div class="lb-cat-bar">
      <span class="lb-count" id="lbCount"></span>
      <div class="lb-cat-row"><div class="lb-cat-line"></div><div class="lb-cat-label" id="lbCat"></div><div class="lb-cat-line"></div></div>
      <button class="lb-close" onclick="closeLb()" aria-label="Fermer">✕</button>
    </div>
    <div class="lb-media">
      <div class="lb-zone lb-zone-left" onclick="lbStep(-1)"></div>
      <div class="lb-zone lb-zone-right" onclick="lbStep(1)"></div>
      <img id="lbImg" src="" alt=""/>
    </div>
    <div class="lb-info" id="lbFooter">
      <!-- Nom + description forment UN bloc dont seule la hauteur
           totale est figée : la description reste donc toujours
           collée sous le titre, qu'il tienne sur une ou deux lignes,
           et c'est l'espace vide qui se reporte en bas. -->
      <div class="lb-text" id="lbText">
        <div class="lb-dish-name" id="lbName"></div>
        <div class="lb-dish-desc" id="lbDesc"></div>
      </div>
    </div>
    <div class="lb-dots" id="lbDots"></div>
  </div>
</div>

<!-- CONFIRM MODAL -->
<div class="confirm-modal" id="confirmModal">
  <div class="confirm-box">
    <div class="confirm-title">Confirmer la suppression</div>
    <div class="confirm-text" id="confirmText">Cette action est irréversible.</div>
    <div class="confirm-btns">
      <button class="confirm-cancel" onclick="closeConfirm()">Annuler</button>
      <button class="confirm-ok" id="confirmOk">Supprimer</button>
    </div>
  </div>
</div>

<!-- Suppression d'une section : supprimer une section n'a pas un seul
     sens. Soit on jette la section ET ses plats, soit on veut juste
     arrêter de regrouper ces plats dans une section et les conserver.
     On demande donc explicitement, au lieu de choisir à la place de
     l'utilisateur. -->
<div class="confirm-modal" id="sectionDelModal">
  <div class="confirm-box" style="max-width:360px">
    <div class="confirm-title">Supprimer la sous-catégorie</div>
    <div class="confirm-text" id="sectionDelText">Que faut-il faire de son contenu ?</div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <button class="confirm-cancel" id="sectionDelKeep" style="border-radius:10px;text-align:left;padding:12px 14px;line-height:1.4">
        <strong style="display:block;color:var(--navy);font-size:13px">Garder les plats</strong>
        <span style="font-size:11.5px;color:var(--text3)">La section disparaît, ses plats rejoignent la page précédente.</span>
      </button>
      <button class="confirm-ok" id="sectionDelAll" style="border-radius:10px;text-align:left;padding:12px 14px;line-height:1.4">
        <strong style="display:block;font-size:13px">Tout supprimer</strong>
        <span style="font-size:11.5px;opacity:.85">La section et ses plats sont effacés définitivement.</span>
      </button>
      <button class="confirm-cancel" onclick="closeSectionDel()" style="border-radius:10px">Annuler</button>
    </div>
  </div>
</div>

<!-- Création d'une section : si des plats traînent hors section, on
     propose de les y ranger plutôt que de forcer un déplacement
     manuel plat par plat après coup. -->
<div class="confirm-modal" id="newSectionModal">
  <div class="confirm-box" style="max-width:380px;text-align:left">
    <div class="confirm-title" style="text-align:left">Nouvelle sous-catégorie</div>
    <input class="ai" id="newSectionName" placeholder="Nom de la sous-catégorie" style="width:100%;margin-bottom:14px">
    <div id="newSectionPickWrap" style="display:none">
      <div style="font-size:12px;color:var(--text3);font-family:'Jost',sans-serif;margin-bottom:8px">Plats à incorporer (optionnel)</div>
      <div id="newSectionPickList" style="max-height:200px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin-bottom:16px"></div>
    </div>
    <div class="confirm-btns">
      <button class="confirm-cancel" onclick="closeNewSection()">Annuler</button>
      <button class="confirm-ok" id="newSectionOk" style="background:var(--ig-green)">Créer</button>
    </div>
  </div>
</div>

// ═══════════════════════════════════════════
// STABLE DISH IDS (for "Plats à la une" pins)
// ═══════════════════════════════════════════
// BUG FIX: pinned dishes used to be stored as raw {tabId, cardIdx, dishIdx}
// array positions. Any later reorder/delete of dishes or sections (drag &
// drop, deleting a dish above it, etc.) silently shifted those positions,
// so a pin would end up pointing at a completely different dish — exactly
// the "I click Capitaine and Drevici opens" symptom. Dishes now get a
// permanent random id (_pid) the moment they're created, and pins are
// resolved by that id instead of by position, so reordering/deleting other
// dishes can never make a pin point at the wrong one again.
function genPid(){ return 'd_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function ensureDishPid(d){ if(d && !d._pid) d._pid=genPid(); return d&&d._pid; }
// Walk every dish in DATA and assign a stable id to any that doesn't have one yet.
function ensureAllDishPids(){
  (DATA.tabs||[]).forEach(tab=>{
    (tab.cards||[]).forEach(card=>{
      (card.dishes||[]).forEach(d=>ensureDishPid(d));
    });
  });
}
// One-time migration: upgrade old-format pins (position-based) to the new
// id-based format, using their current (possibly already-wrong) position as
// a best-effort resolution — this can't undo damage already caused by the
// bug, but from this point on pins stay correct through any reordering.
function migratePins(){
  ensureAllDishPids();
  const pins=DATA.pinnedDishes||[];
  const migrated=[];
  pins.forEach(p=>{
    if(p.pid){ migrated.push(p); return; }
    const tb=DATA.tabs.find(t=>t.id===p.tabId);
    const card=tb&&tb.cards[p.cardIdx];
    const d=card&&card.dishes&&card.dishes[p.dishIdx];
    if(d){ ensureDishPid(d); migrated.push({tabId:p.tabId, pid:d._pid, name:t(d.name)}); }
    else { migrated.push(p); }   // on garde : repairPins() tentera par le nom
  });
  DATA.pinnedDishes=migrated;
}
// BUG FIX (épingles perdues au rechargement) : une épingle pointe un
// plat par son identifiant interne (_pid). Si ce plat est recréé
// ailleurs dans l'appli — réimport, duplication, migration — il
// reçoit un NOUVEL identifiant, et l'épingle pointe alors dans le
// vide : les incontournables disparaissent silencieusement au
// rechargement. On retient donc aussi le nom du plat, et si
// l'identifiant ne répond plus, on retrouve le plat par son nom
// dans sa catégorie et on réécrit l'identifiant au passage. Une
// épingle vraiment orpheline (plat supprimé) est retirée.
function repairPins(){
  ensureAllDishPids();
  const pins=DATA.pinnedDishes||[];
  pins.forEach(p=>{
    if(resolvePin(p)) return;
    if(!p.name) return;
    // On cherche le plat par son nom dans TOUTES les categories, pas
    // seulement celle memorisee : une categorie renommee change d'id,
    // et l'epingle pointerait alors sur une categorie disparue. On
    // reecrit au passage l'identifiant ET la categorie.
    for(const tb of (DATA.tabs||[])){
      for(const card of (tb.cards||[])){
        const d=(card.dishes||[]).find(dd=>t(dd.name)===p.name);
        if(d){ ensureDishPid(d); p.pid=d._pid; p.tabId=tb.id; return; }
      }
    }
  });
  // REGLE : on ne supprime JAMAIS une epingle ici. Une epingle qu'on
  // n'arrive pas a resoudre ne s'affiche simplement pas, mais elle
  // reste dans les donnees -- sinon le moindre faux negatif au
  // chargement l'effacerait definitivement a l'enregistrement suivant.
  // C'etait tres probablement la cause des incontournables qui
  // sautaient.
  DATA.pinnedDishes=pins;
}
// Resolve a pin to its live dish (searches by stable id, so it's immune to
// any later reordering of sections/dishes). Returns null if the dish was
// deleted since being pinned.
function resolvePin(p){
  const tb=DATA.tabs.find(t=>t.id===p.tabId);
  if(!tb) return null;
  for(let ci=0; ci<tb.cards.length; ci++){
    const card=tb.cards[ci];
    if(!card.dishes) continue;
    for(let di=0; di<card.dishes.length; di++){
      if(card.dishes[di]._pid===p.pid) return {tab:tb, ci, di, dish:card.dishes[di]};
    }
  }
  return null;
}

// DEEP LINKS — each tab gets its own shareable/bookmarkable URL (#tabId)
// ═══════════════════════════════════════════
function tabIdFromHash(){
  const raw=decodeURIComponent((location.hash||'').replace(/^#/,''));
  return raw||null;
}
// Called at the end of every renderAll() — keeps the address bar's #hash
// matching whichever tab is actually showing, for every call site that
// changes currentTabId (nav click, swipe, admin actions...), without
// spamming the browser history (uses replaceState).
function syncHashToCurrentTab(){
  if(!currentTabId) return;
  // Tant que le cover est affiché, l'URL reste nue (aucun #tab) : c'est
  // ce hash qui dit à un rechargement "ce visiteur était dans le menu",
  // donc l'écrire derrière le splashscreen le rendrait impossible à
  // recharger (on sauterait toujours le cover).
  if(isHomeCoverShowing()){
    if(location.hash){
      try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
    }
    return;
  }
  const newHash='#'+encodeURIComponent(currentTabId);
  if(location.hash!==newHash){
    try{ history.replaceState(null,'',newHash); }catch(e){}
  }
}
// Deliberate navigation (nav tab click, swipe) — creates a real history
// entry so the back/forward buttons step through tabs naturally.
function goToTab(tabId){
  currentTabId=tabId;
  sessionStorage.setItem('lastTabId',tabId);
  const newHash='#'+encodeURIComponent(tabId);
  if(location.hash!==newHash){
    try{ history.pushState(null,'',newHash); }catch(e){}
  }
  renderAll();
}
// Handles browser Back/Forward and someone pasting a #tab link while the page is already open.
window.addEventListener('popstate', ()=>{
  // BUG FIX (geste "retour" dans l'admin) : balayer vers la droite
  // quittait le panneau pour retourner sur le site, alors qu'on
  // s'attend à remonter d'un cran DANS l'admin. Tant que le panneau
  // est ouvert, le geste remonte la navigation interne, et ne ferme le
  // panneau qu'une fois à la racine.
  const panel=document.getElementById('adminPanel');
  if(panel && panel.classList.contains('open')){
    history.pushState(null,'',location.href);
    if(adminBackStep()) return;
    closeAdmin();
    return;
  }
  const raw=tabIdFromHash();
  // URL redevenue nue : on remonte au cover (cas du bouton Retour juste
  // après avoir cliqué "Voir le menu").
  if(!raw){
    if(DATA.homeCover && DATA.homeCover.active && homeCoverDismissedThisSession){
      homeCoverDismissedThisSession=false;
      renderHomeCover();
    }
    return;
  }
  // On revient sur un #tab alors que le cover est affiché (Suivant du
  // navigateur) : on l'efface sans rejouer le fondu.
  if(isHomeCoverShowing()){
    homeCoverDismissedThisSession=true;
    stopHomeCoverSlideshow();
    const el=document.getElementById('homeCoverContainer');
    if(el) el.innerHTML='';
    document.body.classList.remove('home-cover-showing');
    applyBrandColors();
  }
  if(DATA.tabs.some(tb=>tb.id===raw && tb.visible!==false) && raw!==currentTabId){
    currentTabId=raw;
    sessionStorage.setItem('lastTabId',raw);
    renderAll();
  }
});

function showToast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.style.opacity='1';
  clearTimeout(el._t); el._t=setTimeout(()=>el.style.opacity='0',2200);
}

function setEditMode(on){
  // BUG FIX: entering edit mode had no auth check at all — a completely
  // separate code path from openAdmin()'s login wall. "Modifier" let
  // anyone click straight into inline editing on the page itself,
  // without ever logging in, bypassing the wall entirely.
  if(on && !supaSession){
    showToast('Connecte-toi d\'abord');
    openAdmin();
    return;
  }
  editMode=on;
  document.getElementById('app').classList.toggle('edit-mode',on);
  // Single toggle button (desktop + mobile) rather than two separate
  // icons: swap the SVG content and title in place based on the mode
  // we're IN, so the icon always shows the action a click would take
  // (pencil = "switch to edit" while reading; eye = "switch to read"
  // while editing) — matches the intent behind the old two-button
  // setup without needing two elements.
  const eyeIcon = '<path d="M1 8s2.6-5 7-5 7 5 7 5-2.6 5-7 5-7-5-7-5z"/><circle cx="8" cy="8" r="2"/>';
  // Crayon dans un cadre : plus lisible qu'un crayon seul a 19px, et
  // c'est le pictogramme que tout le monde associe a « editer ».
  const pencilIcon = '<path d="M8.4 2.6H3.7A1.7 1.7 0 0 0 2 4.3v8A1.7 1.7 0 0 0 3.7 14h8a1.7 1.7 0 0 0 1.7-1.7V7.6"/><path d="M12.1 2.1a1.55 1.55 0 0 1 2.2 2.2l-5.9 5.9-2.9.7.7-2.9 5.9-5.9z"/>';
  [['btnModeToggle','btnModeToggleIcon'],['modeLinkEdit','modeLinkEditIcon']].forEach(([btnId,svgId])=>{
    const btn=document.getElementById(btnId), svg=document.getElementById(svgId);
    if(!btn||!svg) return;
    svg.innerHTML = on ? eyeIcon : pencilIcon;
    btn.title = on ? 'Mode lecture' : 'Mode modification';
    btn.classList.toggle('active', on);
  });
  if(!on) closeEditPop();
  showToast(on?'Mode modification — cliquez un élément':'Mode lecture');
}

function efBi(label,frVal,curVal,isText){

      </div>
      <img class="ai-img-preview" src="${escAttr(val||'')}" style="${previewStyle}" onerror="this.style.display='none'">
    </div>`;
  }
  return `<div class="ef"><label class="el">${label}</label><div class="ai-img-wrap">
    <input class="ei" id="${id}" value="${escAttr(val||'')}" placeholder="Collez un lien ou uploadez" oninput="syncEfImgPreview(this)">
    <label class="ai-upload-btn" title="Uploader une image"><input type="file" accept="image/*" style="display:none" onchange="uploadEditImgFile(this,${ratio===null?'null':ratio})"><svg width="18.4" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M18.22,20.75H5.78A2.64,2.64,0,0,1,3.25,18V15a.75.75,0,0,1,1.5,0v3a1.16,1.16,0,0,0,1,1.25H18.22a1.16,1.16,0,0,0,1-1.25V15a.75.75,0,0,1,1.5,0v3A2.64,2.64,0,0,1,18.22,20.75Z"/><path d="M16,8.75a.74.74,0,0,1-.53-.22L12,5.06,8.53,8.53A.75.75,0,0,1,7.47,7.47l4-4a.75.75,0,0,1,1.06,0l4,4a.75.75,0,0,1,0,1.06A.74.74,0,0,1,16,8.75Z"/><path d="M12,15.75a.76.76,0,0,1-.75-.75V4a.75.75,0,0,1,1.5,0V15A.76.76,0,0,1,12,15.75Z"/></svg></label>
  </div><img class="ai-img-preview" src="${escAttr(val||'')}" style="${previewStyle};width:100%;max-width:120px;aspect-ratio:1;object-fit:cover;border-radius:6px;margin-top:6px;border:1px solid var(--border)" onerror="this.style.display='none'"></div>`;
}
function uploadEditImgFile(fileInput, ratio){
  const file=fileInput.files[0];
  readImageFileSafe(file, dataUrl => {
    const wrap=fileInput.closest('.ai-img-wrap');
    const inp=wrap&&wrap.querySelector('.ei');
    if(!inp) return;
    inp.value=dataUrl;
    syncEfImgPreview(inp);
  }, {ratio});
}
function syncEfImgPreview(input){
  const wrap=input.closest('.ai-img-wrap');
  if(!wrap) return;
  const preview=wrap.parentElement.querySelector('.ai-img-preview');
  if(!preview) return;
  const val=input.value.trim();
  if(val){ preview.src=val; preview.style.display='block'; }
  else { preview.style.display='none'; }
}

// ---- Masquer / Supprimer — mêmes formes que le panneau admin ----
// Trois petits boutons alignes (Visible / Masquee / Supprimer) etaient
// le langage du site, pas celui du back-office : celui-ci pose un
// interrupteur pour un etat, et une ligne rouge a part pour une action
// destructrice. Une bascule dit aussi mieux qu'un couple de boutons
// qu'il n'y a que deux etats possibles.
function efVisRow(hidden, kind){
  const noun = kind==='bev' ? 'la boisson' : 'le plat';
  return `<div class="ef-vis">
    <div class="ef-vis-row">
      <span class="ef-vis-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></span>
      <span class="ef-vis-label">Masquer ${noun}</span>
      <label class="ig-switch"><input type="checkbox" ${hidden?'checked':''} onchange="efSetHidden(this.checked)"><span class="ig-switch-track"><span class="ig-switch-thumb"></span></span></label>
    </div>
    <button type="button" class="ef-vis-row ef-del-row" onclick="efDeleteCurrent()">
      <span class="ef-vis-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/></svg></span>
      <span class="ef-vis-label">Supprimer ${noun}</span>
    </button>
  </div>`;
}
// Épingler un plat en « incontournable » directement depuis la fiche,
// en mode modification : c'est là qu'on a le plat sous les yeux, donc
// c'est là que la décision se prend. Les incontournables alimentent le
// bandeau photo en tête de sa catégorie.
function efPinRow(ti,ci,di,d){
  const tabId=DATA.tabs[ti] && DATA.tabs[ti].id;
  const on=isPinnedDish(d);
  const n=pinCountForTab(tabId);
  const rank=on ? pinRankOf(tabId, d._pid) : 0;
  // Une etoile allumee ne disait pas ou le plat allait atterrir dans le
  // bandeau — ni meme S'IL allait y atterrir. Deux cas restaient
  // totalement muets : sans photo ou masque, il n'y figure pas du tout.
  let hint;
  if(on){
    if(!d.img) hint='Ajoutez une photo pour qu\'il apparaisse dans le bandeau';
    else if(d.hidden) hint='Masqué : il n\'apparaît pas dans le bandeau';
    else if(n>1) hint='Sa place dans le bandeau';
    else hint='Seul incontournable de cette catégorie';
  } else {
    hint = n>=PIN_MAX_PER_TAB ? `${PIN_MAX_PER_TAB} incontournables déjà choisis ici`
                              : 'Le mettre en avant en haut de cette catégorie';
  }
  // Les numeros ne valent que s'il y a un ordre a arbitrer : a un seul
  // incontournable, un bouton « 1 » unique ne servirait a rien. On n'en
  // propose donc que N, jamais un rang inatteignable.
  let ranks='';
  if(on && n>1 && d.img && !d.hidden){
    let btns='';
    for(let r=1;r<=n;r++){
      btns+=`<button type="button" class="ef-rank${r===rank?' ef-rank-on':''}" aria-pressed="${r===rank}" title="Position ${r}" onclick="setPinRank('${escAttr(tabId)}','${escAttr(d._pid||'')}',${r})">${r}</button>`;
    }
    ranks=`<div class="ef-pin-ranks">${btns}</div>`;
  }
  return `<div class="ef-pin${on?' ef-pin-on':''}">
    <button type="button" class="ef-pin-main" onclick="togglePin('${escAttr(tabId)}',${ci},${di})">
      <span class="ef-pin-star">${on?'★':'☆'}</span>
      <span class="ef-pin-text"><span class="ef-pin-label">Plat incontournable</span><span class="ef-pin-hint">${hint}</span></span>
    </button>${ranks}
  </div>`;
}
function efSetHidden(val){
  if(!editCtx) return;
  const {type,ti,ci,di,ii}=editCtx;
  let obj=null;
  if(type==='dish') obj=DATA.tabs[ti]?.cards[ci]?.dishes?.[di];
  else if(type==='bev') obj=DATA.tabs[ti]?.cards[ci]?.items?.[ii];
  if(!obj) return;
  if(val) obj.hidden=true; else delete obj.hidden;
  renderAll();
  if(type==='dish') openEditDish(ti,ci,di);
  else if(type==='bev') openEditBev(ti,ci,ii);
  if(typeof adminCurrentTab!=='undefined' && adminCurrentTab && document.getElementById('adminBody')?.innerHTML) renderAdminSection(adminCurrentTab, true);
}
function efDeleteCurrent(){
  if(!editCtx) return;
  const {type,ti,ci,di,ii}=editCtx;
  const msg = type==='dish' ? 'Supprimer ce plat ?' : 'Supprimer cette boisson ?';
  askConfirm(msg, ()=>{
    if(type==='dish' && DATA.tabs[ti]?.cards[ci]?.dishes) DATA.tabs[ti].cards[ci].dishes.splice(di,1);
    else if(type==='bev' && DATA.tabs[ti]?.cards[ci]?.items) DATA.tabs[ti].cards[ci].items.splice(ii,1);
    renderAll();
    closeEditPop();
    if(typeof adminCurrentTab!=='undefined' && adminCurrentTab && document.getElementById('adminBody')?.innerHTML) renderAdminSection(adminCurrentTab, true);
    showToast('Supprimé — Publiez pour mettre en ligne');
  });
}

// ---- Popup size row (boisson) — numeric value + cl/L unit dropdown + price, mirrors admin panel ----
// ---- Bev size "format" (verre/pinte/demi/...) — a fixed, curated list
// rather than free text: the admin adds new formats to this list
// himself as new clients need them, instead of each client typing
// something that might not render consistently. Formats with a known
// fixed quantity (pinte, demi, galopin) auto-fill the cl field when
// picked — canette is deliberately NOT auto-filled since it varies
// (33cl standard, 25cl for energy drinks like Red Bull); verre/bouteille/
// coupe have no fixed size at all, always filled in by hand.
const BEV_FORMATS = [
  {key:'', label:'—'},
  {key:'verre', label:'Verre'},
  {key:'bouteille', label:'Bouteille'},
  {key:'coupe', label:'Coupe'},
  {key:'pinte', label:'Pinte', autoCl:50},
  {key:'demi', label:'Demi', autoCl:25},
  {key:'canette', label:'Canette'},
  {key:'galopin', label:'Galopin', autoCl:12.5},
];
function bevFormatOptionsHtml(selected){
  return BEV_FORMATS.map(f=>`<option value="${f.key}" ${f.key===(selected||'')?'selected':''}>${f.label}</option>`).join('');
}
// Public-facing label for one size row: if a format is picked, show
// just its name (a "Pinte" doesn't need "— 50cl" next to it, everyone
// already knows roughly what that means) — otherwise fall back to the
// raw cl/L value, exactly as before this feature existed.
function bevSizeLabel(s){
  if(s.format){
    const f=BEV_FORMATS.find(f=>f.key===s.format);
    if(f) return f.label;
  }
  return s.cl ? (s.cl+(s.unit==='l'?'L':'cl')) : '';
}
// ---- Popup size row (boisson) — numeric value + cl/L unit dropdown + price, mirrors admin panel ----
function efSizeRowHtml(si, s){
  s=s||{};
  const unit=s.unit||'cl';
  return `<div class="efrow" data-srow="${si}" style="margin-bottom:8px;align-items:center;gap:6px">
    <select class="unit-sel" data-sformat onchange="efSizeFormatChange(this)">${bevFormatOptionsHtml(s.format)}</select>
    <div class="ef" style="flex:1;margin-bottom:0"><input class="ei" data-scl type="number" min="0" value="${escAttr(s.cl||'')}" placeholder="Contenance"></div>
    <select class="unit-sel" data-sunit>
      <option value="cl" ${unit==='cl'?'selected':''}>cl</option>
      <option value="l" ${unit==='l'?'selected':''}>L</option>
    </select>
    <div class="ef" style="flex:1;margin-bottom:0"><input class="ei" data-sprice type="number" step="0.5" min="0" value="${escAttr(s.price||'')}" placeholder="Prix"></div>
    <span style="font-size:12px;color:var(--text3);flex:none">€</span>
  </div>`;
}
// Auto-fills the known fixed contenance (pinte/demi/galopin) when that
// format is picked — still editable by hand afterward if needed.
function efSizeFormatChange(sel){
  const f=BEV_FORMATS.find(f=>f.key===sel.value);
  const row=sel.closest('.efrow');
  if(f && f.autoCl!=null && row){
    const clInput=row.querySelector('[data-scl]');
    const unitSel=row.querySelector('[data-sunit]');
    if(clInput) clInput.value=f.autoCl;
    if(unitSel) unitSel.value='cl';
  }
}
function efAddSizeRow(){
  const wrap=document.getElementById('ed-sizes');
  if(!wrap) return;
  const idx=wrap.children.length;
  const tmp=document.createElement('div');
  tmp.innerHTML=efSizeRowHtml(idx,{});
  wrap.appendChild(tmp.firstElementChild);
}

function openEditElement(el){
  const type=el.dataset.edit;
  const ti=+el.dataset.ti, ci=+el.dataset.ci;
  if(type==='dish') openEditDish(ti,ci,+el.dataset.di);
  else if(type==='bev') openEditBev(ti,ci,+el.dataset.ii);
  else if(type==='variants') openEditVariants(ti,ci);
  else if(type==='intro') openEditIntro();
  else if(type==='special') openEditSpecial(+el.dataset.si);
}

function showEditPop(title){
  document.getElementById('editPopTitle').textContent=title;
  document.getElementById('editPop').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeEditPop(){
  document.getElementById('editPop').classList.remove('open');
  document.body.style.overflow='';
  editCtx=null;
}
document.getElementById('editPop').addEventListener('click',e=>{ if(e.target===e.currentTarget) closeEditPop(); });

// ---- Bloc de prix : simple, ou deux couples quantite/prix ----
function efPriceBlockHtml(d){
  d=d||{};
  if(d.priceType==='dual'){
    return `<div class="efrow">
      <div class="ef"><label class="el">Quantité 1</label><input class="ei" id="ed-q1" type="number" value="${escAttr(d.qty1||'')}" placeholder="6"></div>
      <div class="ef"><label class="el">Prix 1 (€)</label><input class="ei" id="ed-p1" type="number" value="${escAttr(d.p1||'')}" placeholder="12"></div>
    </div>
    <div class="efrow">
      <div class="ef"><label class="el">Quantité 2</label><input class="ei" id="ed-q2" type="number" value="${escAttr(d.qty2||'')}" placeholder="12"></div>
      <div class="ef"><label class="el">Prix 2 (€)</label><input class="ei" id="ed-p2" type="number" value="${escAttr(d.p2||'')}" placeholder="22"></div>
    </div>`;
  }
  const numVal=(d.price||'').toString().replace('€','').trim();
  return `<div class="ef"><label class="el">Prix (€)</label><input class="ei" id="ed-price" type="number" step="0.5" style="max-width:140px" value="${escAttr(numVal)}"></div>`;
}
// On ne redessine QUE le bloc de prix : le reste de la fiche, y compris
// ce qui vient d'etre tape, reste en place. Le prix deja saisi est
// reporte sur le premier palier, et inversement, pour ne pas obliger a
// le retaper apres un aller-retour.
function efToggleDual(cb){
  const block=document.getElementById('ed-price-block');
  if(!block) return;
  const gv=id=>{ const e=document.getElementById(id); return e?e.value:''; };
  if(cb.checked){
    const single=gv('ed-price');
    block.innerHTML=efPriceBlockHtml({priceType:'dual', p1:single});
  } else {
    const first=gv('ed-p1');
    block.innerHTML=efPriceBlockHtml({price:first});
  }
}
// ---- DISH ----
function openEditDish(ti,ci,di){
  const d=DATA.tabs[ti]?.cards[ci]?.dishes?.[di]; if(!d) return;
  editCtx={type:'dish',ti,ci,di};
  let h='';
  h+=efPinRow(ti,ci,di,d);
  h+=efBi('Nom du plat', d.name&&d.name.fr, d.name&&d.name[lang]);
  h+=efBi('Description', d.desc&&d.desc.fr, d.desc&&d.desc[lang], true);
  // Le double tarif n'etait propose que dans la categorie « huitres »,
  // alors qu'une planche, un pichet ou une portion se vendent en deux
  // tailles dans a peu pres toutes les cartes. La case est donc offerte
  // partout, sous le prix, et basculer refait le bloc de prix sur place
  // — sans fermer la fiche ni perdre le nom en cours de frappe.
  h+=`<div id="ed-price-block">${efPriceBlockHtml(d)}</div>`;
  h+=`<div class="ef"><label class="ei-check"><input type="checkbox" id="ed-dual" ${d.priceType==='dual'?'checked':''} onchange="efToggleDual(this)"><span>Double tarif (ex : Les 6 / Les 12)</span></label></div>`;
  h+=efImgField('ed-img', d.img||'', 'Image principale');
  h+=efBadgesField(d);
  h+=efSocialAccordion(d.gallery||[], d.caption||'', 'Ex: Nos huîtres Spéciales N°3 — iodées, fraîches, servies sur glace 🦪 Disponibles au bar ou à emporter.');
  // Masquer / Supprimer ferment la fiche, comme dans le panneau admin :
  // on ne met pas une action destructrice sur le trajet du regard.
  h+=efVisRow(!!d.hidden);
  document.getElementById('editPopBody').innerHTML=h;
  showEditPop(t(d.name)||'Modifier le plat');
}

// ---- VARIANTS (ex: Rillettes) ----
function openEditVariants(ti,ci){
  const card=DATA.tabs[ti]?.cards[ci]; if(!card) return;
  editCtx={type:'variants',ti,ci};
  let h='';
  h+=efBi('Titre de la carte', card.label&&card.label.fr, card.label&&card.label[lang]);
  h+=efImgField('ed-img', card.img||'', 'Image');
  h+=`<div class="el" style="margin-bottom:8px">Variantes</div><div id="ed-variants">`;
  (card.variants||[]).forEach((v,vi)=>{
    const vname=typeof v.name==='object'?(v.name[lang]||v.name.fr||''):(v.name||'');
    h+=`<div class="efrow" data-vrow="${vi}" style="margin-bottom:8px">
      <div class="ef" style="flex:2;margin-bottom:0"><input class="ei" data-vname value="${escAttr(vname)}" placeholder="Nom"></div>
      <div class="ef" style="flex:1;margin-bottom:0"><input class="ei" data-vprice value="${escAttr(v.price||'')}" placeholder="Prix"></div>
    </div>`;
  });
  h+=`</div>`;
  document.getElementById('editPopBody').innerHTML=h;
  showEditPop(t(card.label)||'Modifier');
}

// ---- BEV ----
function openEditBev(ti,ci,ii){
  const item=DATA.tabs[ti]?.cards[ci]?.items?.[ii]; if(!item) return;
  editCtx={type:'bev',ti,ci,ii};
  const iname=typeof item.name==='object'?(item.name[lang]||item.name.fr||''):(item.name||'');
  const ifr=typeof item.name==='object'?(item.name.fr||''):(item.name||'');
  let h='';
  const isFr=lang==='fr';
  h+=`<div class="ef"><label class="el">Nom${isFr?'':' ('+lang.toUpperCase()+')'}</label><input class="ei" id="ed-bname" value="${escAttr(iname)}" placeholder="${escAttr(isFr?'':ifr)}"></div>`;
  h+=efBi('Description (notes de dégustation, etc.)', item.desc&&item.desc.fr, item.desc&&item.desc[lang], true);
  h+=efImgField('ed-img', item.img||'', 'Image (optionnel)');
  h+=`<div class="el" style="margin-bottom:8px">Format, contenance & prix</div><div id="ed-sizes">`;
  (item.sizes||[]).forEach((s,si)=>{ h+=efSizeRowHtml(si,s); });
  if(!(item.sizes||[]).length){ h+=efSizeRowHtml(0,{}); }
  h+=`</div><button type="button" class="aadd" onclick="efAddSizeRow()" style="margin-bottom:14px">+ Taille</button>`;
  h+=efSocialAccordion(item.gallery||[], item.caption||'', 'Ex: Notre sélection du moment 🍷');
  h+=efVisRow(!!item.hidden,'bev');
  document.getElementById('editPopBody').innerHTML=h;
  showEditPop(iname||'Modifier la boisson');
}

// ---- SPECIAL (menu du jour, etc.) ----
function openEditSpecial(si){
  const sp=DATA.specials[si]; if(!sp) return;
  editCtx={type:'special',si};
  let h='';
  h+=`<div class="ef"><label class="ei-check"><input type="checkbox" id="ed-sp-active" ${sp.active?'checked':''}><span>Activer ce menu</span></label></div>`;
  h+=efBi('Titre', sp.title&&sp.title.fr, sp.title&&sp.title[lang]);
  h+=efBi('Description', sp.desc&&sp.desc.fr, sp.desc&&sp.desc[lang], true);

function saveEditPop(silent){
  if(!editCtx) return true;
  try{
    const {type,ti,ci,di,ii,si}=editCtx;
    if(type==='intro'){
      DATA.intro.active=document.getElementById('ed-intro-active').checked;
      if(typeof DATA.intro.text!=='object') DATA.intro.text={fr:''};
      DATA.intro.text[lang]=readEf(0);
      renderAll(); closeEditPop(); if(!silent) showToast('Enregistré — Publiez pour mettre en ligne'); return true;
    }
    if(type==='special'){
      const sp=DATA.specials[si];
      sp.active=document.getElementById('ed-sp-active').checked;
      if(typeof sp.title!=='object') sp.title={fr:''};
      if(typeof sp.desc!=='object') sp.desc={fr:''};
      sp.title[lang]=readEf(0);
      sp.desc[lang]=readEf(1);
      sp.price=v('ed-sp-price');
      renderAll(); closeEditPop(); if(!silent) showToast('Enregistré — Publiez pour mettre en ligne'); return true;
    }
    if(type==='dish'){
      const d=DATA.tabs[ti].cards[ci].dishes[di];
      if(typeof d.name!=='object') d.name={fr:d.name||''};
      if(typeof d.desc!=='object') d.desc={fr:d.desc||''};
      d.name[lang]=readEf(0);
      d.desc[lang]=readEf(1);
      const dualCb=document.getElementById('ed-dual');
      // La case pilote seule le format : decochee, le bloc de prix a
      // deja ete remplace, donc ed-q1 n'existe plus. La seconde
      // condition n'est qu'un filet si la case n'etait pas rendue.
      if((dualCb && dualCb.checked) || (!dualCb && document.getElementById('ed-q1'))){
        d.priceType='dual';
        d.qty1=v('ed-q1'); d.p1=v('ed-p1'); d.qty2=v('ed-q2'); d.p2=v('ed-p2');
        d.price=`Les ${d.qty1||'?'} — ${d.p1||'?'}€ · Les ${d.qty2||'?'} — ${d.p2||'?'}€`;
      } else {
        d.priceType='';
        const pv=v('ed-price');
        d.price=pv?pv+'€':'';
      }
      d.img=v('ed-img');
      d.gallery=readGalleryFields();
      d.caption=v('ed-caption');
      readBadgeFields(d);
    } else if(type==='variants'){
      const card=DATA.tabs[ti].cards[ci];
      if(typeof card.label!=='object') card.label={fr:card.label||''};
      card.label[lang]=readEf(0);
      card.img=v('ed-img');
      const names=document.querySelectorAll('#ed-variants [data-vname]');
      const prices=document.querySelectorAll('#ed-variants [data-vprice]');
      (card.variants||[]).forEach((vr,vi)=>{
        if(typeof vr.name!=='object') vr.name={fr:vr.name||''};
        if(names[vi]) vr.name[lang]=names[vi].value;
        if(prices[vi]) vr.price=prices[vi].value;
      });
    } else if(type==='bev'){
      const item=DATA.tabs[ti].cards[ci].items[ii];
      if(typeof item.name!=='object') item.name={fr:item.name||''};
      item.name[lang]=v('ed-bname');
      if(!item.desc || typeof item.desc!=='object') item.desc={fr:''};
      item.desc[lang]=readEf(0);
      item.img=v('ed-img');
      const formats=document.querySelectorAll('#ed-sizes [data-sformat]');
      const cls=document.querySelectorAll('#ed-sizes [data-scl]');
      const units=document.querySelectorAll('#ed-sizes [data-sunit]');
      const prs=document.querySelectorAll('#ed-sizes [data-sprice]');
      const sizes=[];
      cls.forEach((clEl,si2)=>{
        const cl=clEl.value.trim();
        const pr=prs[si2]?prs[si2].value.trim():'';
        const unit=units[si2]?units[si2].value:'cl';
        const format=formats[si2]?formats[si2].value:'';
        if(cl||pr||format) sizes.push({format,cl,unit,price:pr});
      });
      item.sizes=sizes;
      item.gallery=readGalleryFields();
      item.caption=v('ed-caption');
    }
    renderAll();
    closeEditPop();
    if(!silent) showToast('Enregistré — Publiez pour mettre en ligne');
    if(typeof adminCurrentTab!=='undefined' && adminCurrentTab && document.getElementById('adminBody')?.innerHTML) renderAdminSection(adminCurrentTab, true);
    return true;
  }catch(e){
    console.error('saveEditPop error:', e);
    showToast('❌ Erreur lors de l\'enregistrement : '+e.message);
    return false;
  }
}

function createSection(ti, name, looseCi, pickedDis){
  const tab=DATA.tabs[ti];
  if(!Array.isArray(tab.cards)) tab.cards=[];
  const moved=[];
  if(looseCi!=null && pickedDis.length){
    const src=tab.cards[looseCi];
    // On retire du plus grand index au plus petit pour que les index
    // restants restent valides pendant la boucle.
    pickedDis.slice().sort((a,b)=>b-a).forEach(di=>{
      if(src.dishes[di]) moved.unshift(src.dishes.splice(di,1)[0]);
    });
  }
  tab.cards.push({label:{fr:name,en:name},dishes:moved});
  // Si la section "hors section" s'est vidée, elle n'a plus lieu d'être.
  if(looseCi!=null && !(tab.cards[looseCi].dishes||[]).length) tab.cards.splice(looseCi,1);
  renderAll();
  refreshCurrentTabView(tab.id);
  renderAdminSection(adminCurrentTab);
}
// Supprimer une section : on demande d'abord ce qu'il advient des
// plats. "Garder" les déverse dans la section restante (ou, s'il n'en
// reste aucune, dans une section sans titre — ils s'affichent alors
// directement sur la page de la catégorie).
function askSectionDelete(ti, ci){
  const card=DATA.tabs[ti].cards[ci];
  const count=(card.dishes||card.items||[]).length;
  const name=t(card.label)||'cette section';
  const txt=document.getElementById('sectionDelText');
  if(txt) txt.textContent=count ? `« ${name} » contient ${count} élément${count>1?'s':''}. Que faut-il en faire ?` : `« ${name} » est vide.`;
  const keepBtn=document.getElementById('sectionDelKeep');
  const allBtn=document.getElementById('sectionDelAll');
  if(keepBtn){
    keepBtn.style.display = count ? '' : 'none';
    keepBtn.onclick=()=>{ closeSectionDel(); deleteSection(ti,ci,true); };
  }
  if(allBtn) allBtn.onclick=()=>{ closeSectionDel(); deleteSection(ti,ci,false); };
  document.getElementById('sectionDelModal').classList.add('open');
}
function deleteSection(ti, ci, keepContent){
  const tab=DATA.tabs[ti];
  const card=tab.cards[ci];
  const moved = keepContent ? (card.dishes||[]).slice() : [];
  tab.cards.splice(ci,1);
  if(moved.length){
    // On vise une section sans titre pour ne pas mélanger ces plats
    // avec une section nommée par l'utilisateur ; sinon on en crée une.
    let target=tab.cards.find(c=>c.type!=='bevs'&&c.type!=='variants'&&!(t(c.label)||'').trim());
    if(!target){ target={label:{fr:'',en:''},dishes:[]}; tab.cards.unshift(target); }
    if(!Array.isArray(target.dishes)) target.dishes=[];
    target.dishes=target.dishes.concat(moved);
  }
  tabSectionOpen[tab.id]=null;
  dishDetailOpen[tab.id]=null;
  renderAll();
  refreshCurrentTabView(tab.id);
  renderAdminSection(adminCurrentTab);
  publishNow();
  showToast(keepContent&&moved.length?'Sous-catégorie supprimée, plats conservés':'Sous-catégorie supprimée');
}

// BUG FIX: this used to collect images from every tab, which meant opening a
// dish's photo let you Next/Prev through *every other tab's* dishes too.
// Now scoped to the tab currently on screen only.
// ═══ BANDEAU PHOTO EN TÊTE DE CATÉGORIE ═══
// Règle de base : la STRUCTURE ne change jamais — bandeau photo en
// haut, liste complète en dessous. Seul le CONTENU du bandeau varie :
//  • des plats épinglés dans cette catégorie → ce sont eux, titrés
//    « ★ Nos incontournables » ;
//  • aucun épinglé → le bandeau prend simplement les plats qui ont une
//    photo et perd son titre et son étoile (l'onglet actif dit déjà de
//    quelle catégorie il s'agit) ;
//  • aucune photo du tout (vins, cafés) → pas de bandeau. C'est le
//    seul cas où la structure change, et il se comprend tout seul.
// La liste en dessous contient TOUJOURS tout, donc elle n'est jamais
// vide, quoi qu'il arrive au bandeau.
// Rappel discret de l'étoile sur les plats épinglés : le même signe
// que dans le bandeau, pour qu'on fasse le lien entre les deux.
function isPinnedDish(d){
  if(!d || !d._pid) return false;
  return (DATA.pinnedDishes||[]).some(p=>p.pid===d._pid);
}
function renderCategoryRail(tab){
  // Tout le monde ne veut pas d'un bandeau en tete de categorie. Quand
  // il est coupe, la liste commence directement par les plats — les
  // etoiles, elles, restent a cote des noms : choisir ses
  // incontournables et les MONTRER en haut sont deux decisions
  // differentes. Coupe aussi le repli sans epingle (les six premieres
  // photos) : c'est le meme bandeau, sinon l'interrupteur ne ferait
  // rien de visible dans une categorie sans incontournable.
  if(DATA.pinnedShowRail===false) return '';
  // On parcourt la catégorie exactement comme collectLbImages(), pour
  // que data-lbidx désigne bien la même image dans la visionneuse.
  // On retient aussi ci/di : en mode modification, taper une carte du
  // bandeau ouvre la fiche du plat, donc son étoile — c'est le chemin
  // le plus court pour dés/épingler ce qu'on a sous les yeux.
  const ti=DATA.tabs.indexOf(tab);
  const shots=[]; let idx=0;
  tab.cards.forEach((card,ci)=>{
    if(card.dishes){
      card.dishes.forEach((d,di)=>{
        if(d.hidden) return;
        if(d.img){ shots.push({dish:d,lb:idx,ci,di}); idx++; }
      });
    } else if(card.img){ idx++; }
  });
  if(!shots.length) return '';
  // L'ordre du bandeau EST celui de la liste d'epingles : le rang choisi
  // dans la fiche (1, 2, 3) est la position de l'entree dans ce tableau.
  // Avant, on filtrait la carte de haut en bas et le rang subissait donc
  // la place du plat dans la categorie, sans qu'on puisse y toucher.
  const pinOrder=(DATA.pinnedDishes||[]).filter(p=>p.tabId===tab.id).map(p=>p.pid);
  const pinned=pinOrder.map(pid=>shots.find(sh=>sh.dish._pid===pid)).filter(Boolean);
  const items=pinned.length?pinned:shots.slice(0,6);
  const head=pinned.length
    ? `<div class="rail-hdr"><span class="rail-star">★</span><span class="rail-title">Nos incontournables</span></div>`
    : '';
  const cards=items.map(s=>{
    const d=s.dish, price=dishPriceShort(d);
    return `<div class="rail-card" data-edit="dish" data-ti="${ti}" data-ci="${s.ci}" data-di="${s.di}" data-lbidx="${s.lb}">`
      + `<img class="rail-img" src="${d.img}" alt="" loading="lazy">`
      + `<div class="rail-text"><div class="rail-meta"><div class="rail-name">${t(d.name)}</div>`
      // Sur mobile, pas de prix ici : le nom occupe toute la carte, il
      // se lit en entier et rien ne detourne l'oeil. Le prix reste dans
      // la liste et en plein ecran. Sur desktop (liste), il revient.
      + (price?`<div class="rail-price">${price}</div>`:'')
      + `</div>`
      // La description n'est montree que sur grand ecran : sur mobile,
      // la carte est deja haute et le nom suffit.
      + (t(d.desc)?`<div class="rail-desc">${t(d.desc)}</div>`:'')
      + `</div></div>`;
  }).join('');
  return `<div class="rail-wrap">${head}<div class="rail">${cards}</div></div>`;
}
function collectLbImages(){
  lbImages=[];
  const tab=DATA.tabs.find(tb=>tb.id===currentTabId);
  if(!tab) return;
  const cat=t(tab.label);
  tab.cards.forEach(card=>{
    if(card.dishes) card.dishes.filter(d=>!d.hidden).forEach(d=>{ if(d.img) lbImages.push({src:d.img,name:t(d.name),desc:t(d.desc)||'',price:dishPriceDisplay(d)||'',cat}); });
    if(card.img && !card.dishes) lbImages.push({src:card.img,name:t(card.label),desc:'',price:'',cat});
  });
}
// ── LIGHTBOX MODE FLAG ──
// 'pin' = plats à la une (4 slides indépendantes), 'normal' = lb standard
let lbMode='normal';

// Mini lightbox for pinned dishes — independent slides, own counter
let pinLbDishes=[], pinLbIdx=0;
function openPinLb(idx){
  if(editMode){ const p=(DATA.pinnedDishes||[])[idx]; if(p){ const r=resolvePin(p); if(r){ const ti=DATA.tabs.indexOf(r.tab); openEditDish(ti,r.ci,r.di); } } return; }
  const pins=DATA.pinnedDishes||[];

    return (r&&r.dish&&!r.dish.hidden)?r.dish:null;  // exclude hidden / deleted
  }).filter(Boolean).slice(0,4);
  if(!pinLbDishes.length) return;
  lbMode='pin';
  pinLbIdx=Math.min(idx,pinLbDishes.length-1);
  renderPinLb();
  document.getElementById('lb').classList.add('open');

function renderPinLb(){

function stepPinLb(dir){

function openLb(idx){ if(editMode) return; lbMode='normal'; collectLbImages(); lbIdx=idx; renderLbSlide();
  document.getElementById('lb').classList.add('open');
  // La mesure n'est fiable qu'une fois la carte affichée (sa largeur
  // n'existe pas avant).
  sizeLbDesc(lbImages.map(i=>i.desc||''), lbImages.map(i=>i.name||''));
  document.body.style.overflow='hidden'; }
function closeLb(){ document.getElementById('lb').classList.remove('open'); document.body.style.overflow=''; lbMode='normal'; }
// Route lbStep to the right mode
function lbStep(d){ if(lbMode==='pin'){ stepPinLb(d); } else { lbIdx=(lbIdx+d+lbImages.length)%lbImages.length; renderLbSlide(); } }
// La description fait une, deux ou trois lignes selon le plat : sans
// précaution, le cadre grandit et rapetisse à chaque glissement. On
// mesure donc toutes les descriptions du lot une fois à l'ouverture
// et on réserve la hauteur de la plus longue.
// On fige la hauteur TOTALE du bloc nom + description, pas celle de
// chacun : figer le titre séparément réservait deux lignes même pour un
// titre court, et la description se retrouvait décrochée, avec un trou
// au milieu. Ici elle reste collée sous le titre et c'est le bas du
// bloc qui absorbe la différence — la carte, elle, ne bouge plus.
// Le compteur en haut est discret : des points en bas donnent le
// meme repere sous une forme qu'on percoit d'un coup d'oeil, sans
// avoir a lire un chiffre. Au-dela d'une douzaine de plats ils
// deviennent illisibles : le compteur prend alors le relais seul.
function renderLbDots(total, idx){
  const el=document.getElementById('lbDots'); if(!el) return;
  if(total<2 || total>12){ el.innerHTML=''; return; }
  let h='';
  for(let i=0;i<total;i++) h+='<span class="lb-dot'+(i===idx?' on':'')+'"></span>';
  el.innerHTML=h;
}
function sizeLbDesc(descs, names){
  const wrap=document.getElementById('lbText');
  if(!wrap) return;
  wrap.style.minHeight='';
  // Seul le BLOC porte une hauteur imposee : une hauteur posee sur le
  // titre decrocherait la description de celui-ci.
  const nEl=document.getElementById('lbName'); if(nEl) nEl.style.minHeight='';
  const dEl=document.getElementById('lbDesc'); if(dEl) dEl.style.minHeight='';
  const probe=document.createElement('div');
  probe.className='lb-text lb-desc-probe';
  const pn=document.createElement('div'); pn.className='lb-dish-name';
  const pd=document.createElement('div'); pd.className='lb-dish-desc';
  probe.appendChild(pn); probe.appendChild(pd);
  wrap.parentNode.appendChild(probe);
  // Plancher : deux lignes de titre et deux de description, même si
  // tout le lot tient sur une. Le jour où le restaurateur allonge un
  // texte, rien ne bouge.
  const lhN=parseFloat(getComputedStyle(pn).lineHeight)||22;
  const lhD=parseFloat(getComputedStyle(pd).lineHeight)||20;
  let max=lhN*2+lhD*2+6;
  const n=Math.max((descs||[]).length,(names||[]).length);
  for(let i=0;i<n;i++){
    pn.textContent=(names&&names[i])||'';
    pd.textContent=(descs&&descs[i])||'';
    max=Math.max(max, probe.offsetHeight);
  }
  probe.remove();
  wrap.style.minHeight=Math.ceil(max)+'px';
}
function renderLbSlide(){
  const item=lbImages[lbIdx];
  document.getElementById('lbImg').src=item.src;
  document.getElementById('lbName').textContent=item.name;
  document.getElementById('lbDesc').textContent=item.desc||'';
  const catEl=document.getElementById('lbCat'); if(catEl) catEl.textContent=item.cat||'';
  document.getElementById('lbCount').textContent=(lbIdx+1)+' / '+lbImages.length;
  renderLbDots(lbImages.length, lbIdx);
}
// Taper n'importe où en dehors de la carte ferme la fiche — bien plus
// simple à viser que la croix, surtout à la souris.
document.getElementById('lb').addEventListener('click',e=>{ if(!e.target.closest('.lb-card')) closeLb(); });
// Tap left/right on footer to navigate
// Le bloc texte n'est plus une zone de navigation : on y lit la
// description, un tap involontaire ne doit pas changer de plat.
document.getElementById('lbFooter').addEventListener('click',e=>{ e.stopPropagation(); });
document.addEventListener('keydown',e=>{ const lb=document.getElementById('lb'); if(!lb.classList.contains('open'))return; if(e.key==='Escape')closeLb(); if(e.key==='ArrowLeft')lbStep(-1); if(e.key==='ArrowRight')lbStep(1); });
// Swipe support
(function(){
  let sx=0,sy=0;
  const lb=document.getElementById('lb');
  lb.addEventListener('touchstart',e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; },{passive:true});
  lb.addEventListener('touchend',e=>{
    const dx=e.changedTouches[0].clientX-sx;
    const dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>40){
      if(dx<0) lbStep(1); else lbStep(-1);
    }
  });
})();

function renderAll(){
  // BUG FIX: isHome must always track array position 0, never a stale flag
  // left over from before a tab reorder (drag & drop) or before the
  // dedicated Accueil (__home) tab was toggled on/off/unshifted. Without
  // this, a formerly-first tab keeps isHome:true forever, so pinned dishes
  // wrongly render twice — once on Accueil, once on that stale tab.
  DATA.tabs.forEach((t,i)=>{ t.isHome = (i===0); });
  // If current tab was hidden, reset to first visible
  if(!DATA.tabs.filter(t=>t.visible!==false).some(t=>t.id===currentTabId)){
    const first=DATA.tabs.find(t=>t.visible!==false);
    if(first) currentTabId=first.id;
  }
  syncHashToCurrentTab();
  collectLbImages(); renderNav(); renderTabs(); renderViewBar();
  const subEl=document.getElementById('heroSubEl');
  if(subEl){ const st=DATA.hero?t(DATA.hero):''; subEl.textContent=st; subEl.style.display=st?'block':'none'; }
  applyRestaurantBranding();
  // Rendered last, deliberately: applyRestaurantBranding() sets the
  // status-bar meta to the site's own navy — if the cover is active it
  // needs the final say, overriding that with its own configured color,
  // or every render (not just the first) would silently revert it.
  renderHomeCover();
  // Auto-save : dès qu'il y a une vraie session admin, point.
  // BUG FIX : ça exigeait AUSSI editMode (le mode crayon sur le site),
  // qui n'est pas lié à l'ouverture du panneau admin (l'engrenage) —
  // modifier un champ dans "Informations générales" sans avoir en plus
  // activé ce mode-là ne déclenchait donc aucune sauvegarde silencieuse,
  // contrairement à ce qui était attendu partout dans l'admin.
  if(supaSession) scheduleAutoSave(true);
}

// BUG FIX: this used to populate a sticky #globalSocialBar shown on
// every single tab, permanently fixed at the bottom of the screen. Social
// links + website should only appear once, in-flow, at the bottom of the
// actual home page content — not as a sticky bar repeated everywhere else.
function homeSocialBarHtml(){
  const soc=DATA.social||{};
  const sLinks=[];
  if(soc.instagram) sLinks.push(`<a class="social-link-txt" href="https://instagram.com/${soc.instagram.replace('@','')}" target="_blank">INSTAGRAM</a>`);
  if(soc.tiktok) sLinks.push(`<a class="social-link-txt" href="https://tiktok.com/@${soc.tiktok.replace('@','')}" target="_blank">TIKTOK</a>`);
  if(soc.facebook) sLinks.push(`<a class="social-link-txt" href="https://facebook.com/${soc.facebook.replace('@','')}" target="_blank">FACEBOOK</a>`);
  if(!sLinks.length) return '';
  return `<div class="social-links-bar" style="margin-top:15px">${sLinks.join('<span class="social-link-sep">·</span>')}</div>`;
}

function renderNav(){
  const nav=document.getElementById('nav'); nav.innerHTML='';
  const visibleTabs=DATA.tabs.filter(tab=>tab.visible!==false);
  visibleTabs.forEach(tab=>{
    const el=document.createElement('div');
    // BUG FIX: this used to set the .active class immediately at
    // creation time — but since every tab is a brand-new DOM node on
    // every renderNav() call, there was no "before" state for the CSS
    // color transition to animate from, so the label just snapped
    // straight to navy the instant it was inserted. Against the still-
    // navy header (before the white pill has slid underneath it), that
    // read as invisible text that only "popped in" once the pill
    // physically arrived. Starting every tab inactive/grey and adding
    // .active a frame later (once actually painted) gives the browser a
    // real starting state, so the label now fades in step with the pill.
    el.className='nav-tab';
    el.textContent=t(tab.label);
    el.addEventListener('click',()=>{
      if(tab.id==='__home' && DATA.homeTab&&DATA.homeTab.siteUrl){
        window.open(DATA.homeTab.siteUrl,'_blank');
        return;
      }
      goToTab(tab.id);
    });
    nav.appendChild(el);
  });
  // Sliding active-tab indicator: a single bar that glides between tabs
  // instead of each tab's border-bottom toggling instantly. Rebuilt fresh
  // here on every renderNav() (so it's always correctly positioned after
  // a real tab change), and additionally kept in sync frame-by-frame
  // during the swipe gesture itself — see "SWIPE TO CHANGE TABS".
  const indicator=document.createElement('div');
  indicator.className='nav-indicator';
  indicator.id='navIndicator';
  nav.appendChild(indicator);
  requestAnimationFrame(()=>{
    const tabs=Array.from(nav.querySelectorAll('.nav-tab'));
    const activeIdx=visibleTabs.findIndex(tb=>tb.id===currentTabId);
    const activeTabEl=activeIdx>=0?tabs[activeIdx]:null;
    if(activeTabEl){
      activeTabEl.classList.add('active');
      indicator.style.left=activeTabEl.offsetLeft+'px';
      indicator.style.width=activeTabEl.offsetWidth+'px';
    }
    scrollNavToActive();
  });
}
// Scroll nav: show active + 2 full + half of 3rd on each side (Twitter-style)
function scrollNavToActive(){
  const nav=document.getElementById('nav');
  setTimeout(()=>{
    const activeEl=nav.querySelector('.nav-tab.active');
    if(!activeEl) return;
    const navBar=nav.closest('.nav-bar')||nav.parentElement;
    const tabs=Array.from(nav.querySelectorAll('.nav-tab'));
    const activeIdx=tabs.indexOf(activeEl);
    const barW=navBar.offsetWidth;
    const totalW=nav.scrollWidth;

    // Compute target: position scroll so active tab sits at left + 16px padding,
    // letting the next 2 full + half of 3rd peek to the right naturally
    // For the last tabs, scroll back so 2 prev + half peek on the left
    const nextTabs=tabs.slice(activeIdx+1, activeIdx+4);
    const prevTabs=tabs.slice(Math.max(0,activeIdx-3), activeIdx);
    const nextW=nextTabs.reduce((s,el)=>s+el.offsetWidth,0);
    const prevW=prevTabs.reduce((s,el)=>s+el.offsetWidth,0);
    const halfNext=nextTabs[2]?nextTabs[2].offsetWidth/2:(nextTabs[1]?nextTabs[1].offsetWidth/2:40);
    const halfPrev=prevTabs[0]?prevTabs[0].offsetWidth/2:40;

    let target;
    const hasNext=activeIdx<tabs.length-1;
    const hasPrev=activeIdx>0;

    if(hasNext&&hasPrev){
      // Middle: show active at ~left-quarter, peek both sides
      const rightPeek=nextW-halfNext;
      target=activeEl.offsetLeft-(barW-activeEl.offsetWidth-rightPeek)/2;
    } else if(hasNext){
      // First tab(s): start from left, just show naturally
      target=0;
    } else {
      // Last tab(s): scroll so 2 prev + half show on left
      target=totalW-barW;
    }

    target=Math.max(0, Math.min(target, totalW-barW));

    // Only scroll if needed, use smooth for non-initial renders
    if(Math.abs(navBar.scrollLeft-target)>2){
      navBar.scrollTo({left:target, behavior:'smooth'});
    }
  },20);
}

function renderViewBar(){

function renderScheduleInline(suffix){
  suffix=suffix||'';
  // Standard formatting for a closing hour: midnight is stored as 24 (or
  // 24+N for hours past midnight, e.g. 26 = 2am) so the "is still open"
  // math above works, but displaying that raw number reads as "24h" —
  // normalize with a plain modulo so midnight shows "0h00" instead
  // (post-midnight hours like 2am still show as "2h", unchanged).
  const fmtCloseHour = c => { if(c==null) return ''; const h=c%24; return h===0?'0h00':h+'h'; };
  const sch=DATA.schedule||[];
  const now=new Date();
  let today=now.getDay(); let hour=now.getHours()+now.getMinutes()/60;
  if(hour<6){today=(today+6)%7;hour+=24;}
  const dayIdx=today===0?6:today-1;
  const dayData=sch[dayIdx]||{};
  const svcs=dayData.services||[];
  const allSvcs=svcs.length===0&&dayData.open!=null?[{label:'',open:dayData.open,close:dayData.close}]:svcs;
  let state='closed',label="Fermé";
  for(const s of allSvcs){
    if(s.open==null) continue;
    const effectiveClose=s.close<=s.open?s.close+24:s.close;
    if(hour>=s.open&&hour<effectiveClose){state='open';label="Ouvert jusqu'à "+fmtCloseHour(s.close);break;}
    if(hour<s.open){state='soon';label='Ouvre à '+s.open+'h';}
  }
  const dotClass=state==='open'?'open':state==='soon'?'soon':'closed';
  const rows=sch.map((d,i)=>{
    const isToday=(i===dayIdx);
    const svs=(d.services||[]).length>0?d.services:(d.open!=null?[{label:'',open:d.open,close:d.close}]:[]);
    const h=svs.length===0?'Fermé':svs.map(s=>{
      const o=s.open!=null?s.open+'h':'';
      const c=s.close!=null?fmtCloseHour(s.close):'';
      return o&&c?o+' – '+c:(s.label||'Fermé');
    }).join(', ');
    return `<div class="resto-popup-row${isToday?' today':''}"><span class="rday">${d.day}</span><span>${h}</span></div>`;
  }).join('');
  const mapsUrl = DATA.address && DATA.address.mapsUrl;
  const addr = DATA.address || {};
  const addrText = [addr.street, addr.zip, addr.city].filter(Boolean).join(', ');
  const addrHtml = addrText
    ? (mapsUrl
        ? `<a href="${escAttr(mapsUrl)}" target="_blank" rel="noopener" style="display:block;color:rgba(255,255,255,.75);font-size:13px;text-decoration:none;margin-bottom:10px;padding-bottom:10px;border-bottom:.5px solid rgba(255,255,255,.07)">${escapeHtmlLocal(addrText)}</a>`
        : `<div style="color:rgba(255,255,255,.75);font-size:13px;margin-bottom:10px;padding-bottom:10px;border-bottom:.5px solid rgba(255,255,255,.07)">${escapeHtmlLocal(addrText)}</div>`)
    : '';
  const pinIconHtml = mapsUrl ? `<span style="display:inline-flex;align-items:center;color:var(--navy)">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C7.58 2 4 5.58 4 10c0 5.25 7 12 7.29 12.29a1 1 0 0 0 1.42 0C13 22 20 15.25 20 10c0-4.42-3.58-8-8-8zm0 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/></svg>
  </span>` : '';
  const phone = addr.phone;
  const phoneHtml = phone
    ? `<div style="margin-top:10px;display:flex;align-items:baseline;gap:5px;flex-wrap:wrap"><span class="resto-popup-title" style="margin-bottom:0;color:${suffix==='Cover'?'var(--gold)':'#fff'}">Tel&nbsp;:</span><a href="tel:${escAttr(phone.replace(/\s+/g,''))}" style="color:rgba(255,255,255,.75);text-decoration:none;font-size:14px">${escapeHtmlLocal(phone)}</a></div>`
    : '';
  return `<div class="sched-pin-frame">
    <div class="resto-badge-inline" id="schedBadge${suffix}" onclick="toggleSchedPopup(event,'${suffix}')" style="display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none">
      <span class="resto-dot ${dotClass}"></span>
      <span style="font-size:11px;color:var(--text2);font-family:Jost,sans-serif">${label}</span>
      ${pinIconHtml}
      <div class="resto-popup" id="schedPopup${suffix}">
        ${addrText?`<div class="resto-popup-title">Adresse</div>${addrHtml}`:''}
        <div class="resto-popup-title" style="color:${state==='open'?'#22c55e':state==='soon'?'#f97316':'#ef4444'}">Horaires d'ouverture</div>
        ${rows}
        ${phoneHtml}
      </div>
    </div>
  </div>`;
}
function escapeHtmlLocal(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// Variants (e.g. Rillettes flavours) used to only ever show the FIRST
// variant's raw price (no €, and silently wrong the moment two flavours
// are priced differently). Now: one shared price if every variant costs
// the same, otherwise each flavour shows its own price inline — same
// idea as how bevs shows several format/price pairs side by side.
// Global "show currency" toggle (Mon établissement) — strips the €
// sign from an already-formatted price string when off. Kept as one
// small helper rather than touching how prices are stored, so this is
// purely a display-time decision and never risks mangling saved data.
function fmtCurrency(s){
  if(DATA.showCurrency===false) return String(s||'').replace(/€/g,'').trim();
  return s;
}
// Dish/plat price: normalizes to "X€" (or "" if unset) then applies the
// currency toggle — used by both grid and list rendering so the two
// don't drift from each other.
function dishPriceDisplay(d){
  const raw=(d.price||'').toString();
  const withCurrency = raw.includes('€') ? raw : (d.price ? raw+'€' : '');
  return fmtCurrency(withCurrency);
}
// Le bandeau n'a la place que d'un prix : pour un plat à double
// tarif (huîtres « Les 6 — 12€ · Les 12 — 22€ »), on ne garde que
// le premier. Les deux restent affichés dans la liste en dessous,
// où la ligne entière est disponible.
function dishPriceShort(d){
  const full=dishPriceDisplay(d);
  if(!full) return '';
  if(d.priceType!=='dual') return full;
  return full.split('\u00b7')[0].trim();
}
function variantsPriceInfo(variants){
  const list=variants||[];
  const fmt=p=>{ const s=(p||'').toString().trim(); if(!s) return ''; return s.includes('€')?s:s+'€'; };
  const prices=list.map(v=>fmt(v.price));
  const allSame=prices.length>0 && prices.every(p=>p===prices[0]);
  if(allSame){
    return {sharedPrice:fmtCurrency(prices[0]||''), flavourText:list.map(v=>t(v.name)).join(' · ')};
  }
  // Different prices per flavour: show each price inline, colored with
  // the theme's accent (same as a normal price) instead of blending
  // into the grey description text.
  return {sharedPrice:'', flavourText:list.map(v=>{
    const p=fmt(v.price);
    return t(v.name)+(p?` — <span style="color:var(--gold)">${fmtCurrency(p)}</span>`:'');
  }).join(' · ')};
}

// ── Page de couverture (calque plein écran par-dessus le site déjà chargé) ──
// Renders into #homeCoverContainer as a position:fixed overlay — the
// real header/nav/content underneath is already fully rendered on its
// default tab the whole time, simply hidden behind this opaque layer.
// "Voir le menu" fades OUT the image/badge/headline/CTAs (quick, ~0.2s)
// then removes the cover outright — no scrolling, no navigation, and
// the restaurant name (not part of that fade group) never visibly
// moves, since the real header's own name is already sitting in a
// similar spot the instant the cover is gone.
// BUG FIX (reload depuis une tab) : le cover se réaffichait à chaque
// rechargement, même quand l'URL portait déjà un #tab — on retombait
// sur le splashscreen au lieu de la page du menu qu'on regardait.
// Le #tab n'est écrit dans l'URL qu'une fois le cover passé (voir
// syncHashToCurrentTab / dismissHomeCover), donc sa présence au
// chargement est justement le signal "ce visiteur était déjà dans le
// menu". Une URL nue = splashscreen, une URL avec #tab = le menu sur
// cette tab. Lu ici pendant que le hash est encore intact : le premier
// renderAll() (qui pourrait le réécrire) ne tourne qu'en fin de script.
let homeCoverDismissedThisSession=!!(location.hash||'').replace(/^#/,'').trim();
function isHomeCoverShowing(){
  return !!(DATA.homeCover && DATA.homeCover.active && !homeCoverDismissedThisSession);
}
function renderHomeCover(){
  const el=document.getElementById('homeCoverContainer');
  const hc=DATA.homeCover||{};
  if(!hc.active||homeCoverDismissedThisSession){ el.innerHTML=''; document.body.classList.remove('home-cover-showing'); stopHomeCoverSlideshow(); return; }
  const isVideo=hc.mediaType==='video';
  const isSlideshow=hc.mediaType==='slideshow';
  let mediaHtml='';
  if(isVideo && hc.video){
    const videoUrl=hc.video;
    const ytMatch=videoUrl.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]+)/);
    const vimeoMatch=videoUrl.match(/vimeo\.com\/([\d]+)/);
    const isDirectFile=/\.(mp4|webm|mov)(\?|$)/i.test(videoUrl);
    if(isDirectFile && !ytMatch && !vimeoMatch){
      mediaHtml=`<video src="${escAttr(videoUrl)}" autoplay muted loop playsinline style="width:100%;height:100%;object-fit:cover"></video>`;
    } else {
      let embedUrl='';
      if(ytMatch) embedUrl=`https://www.youtube.com/embed/${ytMatch[1]}?autoplay=1&mute=1&controls=0&loop=1&playlist=${ytMatch[1]}&rel=0&modestbranding=1&showinfo=0&playsinline=1`;
      else if(vimeoMatch) embedUrl=`https://player.vimeo.com/video/${vimeoMatch[1]}?autoplay=1&muted=1&loop=1&background=1&controls=0`;
      else embedUrl=videoUrl;
      mediaHtml=`<iframe src="${escAttr(embedUrl)}" style="width:100%;height:100%;border:none;pointer-events:none" allow="autoplay; encrypted-media" allowfullscreen loading="lazy"></iframe>`;
    }
  } else if(isSlideshow && hc.slideshow && hc.slideshow.some(s=>s.image)){
    const slides=hc.slideshow.filter(s=>s.image);
    mediaHtml=`<div class="home-cover-slideshow" id="homeCoverSlideshow">${slides.map((s,i)=>
      `<div class="hcs-slide${i===0?' hcs-active':''}" data-kb="${escAttr(s.kenBurns||'zoom-in')}"><img src="${escAttr(s.image)}" alt="" class="hcs-kb hcs-kb-${escAttr(s.kenBurns||'zoom-in')}"></div>`
    ).join('')}</div>`;
  } else if(!isVideo && hc.image){
    applyHomeCoverMobilePos(hc.mobilePos!=null?hc.mobilePos:50);
    // A dedicated mobile photo, if set, takes over from the shared
    // background specifically on small screens — <picture> picks it
    // automatically per viewport, no JS needed. Desktop always uses
    // the shared image regardless.
    mediaHtml=hc.mobileImage
      ? `<picture><source media="(max-width:640px)" srcset="${escAttr(hc.mobileImage)}"><img src="${escAttr(hc.image)}" alt=""></picture>`
      : `<img src="${escAttr(hc.image)}" alt="">`;
  }
  const cta1Url=hc.cta1Url||'';
  const cta2Url=hc.cta2Url||'';
  const headlineHtml=escapeHtmlLocal(hc.headline||'').replace(/\n/g,'<br>');
  el.innerHTML=`<div class="home-cover" id="homeCoverEl">
    <div class="home-cover-media">${mediaHtml}</div>
    <div class="home-cover-overlay"></div>
    <div class="home-cover-top">
      ${hc.logo
        ? `<img src="${escAttr(hc.logo)}" alt="${escAttr(getRestaurantName())}" class="home-cover-logo" onerror="this.style.display='none'">`
        : `<div class="home-cover-name">${escapeHtmlLocal(getRestaurantName())}</div>`}
    </div>
    <div class="home-cover-fade-group" id="homeCoverFadeGroup">
      <div class="home-cover-sched">${renderScheduleInline('Cover')}</div>
      <div class="home-cover-content">
        <div class="home-cover-headline" style="font-family:'${escAttr(hc.headlineFont||'Jost')}',sans-serif">${headlineHtml}</div>
        <div class="home-cover-ctas">
          ${cta1Url
            ? `<a class="home-cover-cta home-cover-cta-menu" href="${escAttr(cta1Url)}">${escapeHtmlLocal(hc.cta1Label||'Voir le menu')}</a>`
            : `<button type="button" class="home-cover-cta home-cover-cta-menu" onclick="dismissHomeCover()">${escapeHtmlLocal(hc.cta1Label||'Voir le menu')}</button>`}
          <a class="home-cover-cta home-cover-cta-reserve" href="${escAttr(cta2Url)}">${escapeHtmlLocal(hc.cta2Label||'Réserver')}</a>
        </div>
      </div>
    </div>
  </div>`;
  document.body.classList.add('home-cover-showing');
  const themeMeta=document.getElementById('themeColorMeta');
  if(themeMeta) themeMeta.setAttribute('content', hc.statusBarColor || (DATA.brandColors&&DATA.brandColors.accent) || '#000000');
  startHomeCoverSlideshow();
}
// Cycles through the slideshow's slides via a crossfade — each slide's
// own Ken Burns animation (see CSS) restarts automatically because
// adding/removing .hcs-active re-triggers it (animation resets when an
// element goes from display/opacity:0 back to visible in most browsers
// via the class toggle + a reflow-free restart is not guaranteed, so we
// force it by re-adding the class on a fresh animation frame).
let homeCoverSlideshowTimer=null;
function startHomeCoverSlideshow(){
  if(homeCoverSlideshowTimer){ clearInterval(homeCoverSlideshowTimer); homeCoverSlideshowTimer=null; }
  const wrap=document.getElementById('homeCoverSlideshow');
  if(!wrap) return;
  const slides=[...wrap.querySelectorAll('.hcs-slide')];
  if(slides.length<2) return; // nothing to cycle with 0 or 1 image
  let idx=0;
  homeCoverSlideshowTimer=setInterval(()=>{
    slides[idx].classList.remove('hcs-active');
    idx=(idx+1)%slides.length;
    slides[idx].classList.add('hcs-active');
  }, 6000);
}
function stopHomeCoverSlideshow(){
  if(homeCoverSlideshowTimer){ clearInterval(homeCoverSlideshowTimer); homeCoverSlideshowTimer=null; }
}
function dismissHomeCover(){
  homeCoverDismissedThisSession=true;
  // C'est ici que le #tab entre dans l'URL — en pushState, pour que le
  // bouton Retour du navigateur ramène au cover (URL nue) plutôt que de
  // quitter le site.
  if(currentTabId){
    const newHash='#'+encodeURIComponent(currentTabId);
    if(location.hash!==newHash){
      try{ history.pushState(null,'',newHash); }catch(e){}
    }
  }
  stopHomeCoverSlideshow();
  const group=document.getElementById('homeCoverFadeGroup');
  if(group) group.classList.add('fading-out');
  setTimeout(()=>{
    const el=document.getElementById('homeCoverContainer');
    if(el) el.innerHTML='';
    document.body.classList.remove('home-cover-showing');
    // Hand the status bar color back to the site's own brand color, now
    // that the real header (which was underneath the whole time) is
    // what's showing.
    applyBrandColors();
  },220);
}
// Clicking the restaurant name/logo, once past the cover and browsing
// the actual menu, brings the cover back — "home" in the usual sense
// of a logo click, now that the cover (not a menu tab) is what "Page
// d'accueil" actually means.
function returnToHomeCover(){
  if(!DATA.homeCover||!DATA.homeCover.active) return;
  homeCoverDismissedThisSession=false;
  // Retour au cover = retour à l'URL nue, cohérent avec le reste : le
  // rechargement sur cet écran redonnera bien le splashscreen.
  try{ history.pushState(null,'',location.pathname+location.search); }catch(e){}
  renderHomeCover();
}
// Mirrors clampHomePhotoRatio's spirit but for the cover's mobile crop:
// a plain object-position shift, injected as a scoped <style> so it only
// applies under the mobile breakpoint, same technique as the reference.
function applyHomeCoverMobilePos(pos){
  let styleEl=document.getElementById('homeCoverMobilePosStyle');
  if(!styleEl){ styleEl=document.createElement('style'); styleEl.id='homeCoverMobilePosStyle'; document.head.appendChild(styleEl); }
  styleEl.textContent=`@media(max-width:640px){ .home-cover-media img{ object-position:${pos}% center; } }`;
}
function updateHomeCoverMobilePreview(pos){
  const label=document.getElementById('homeCoverMobilePosLabel');
  if(label) label.textContent=pos;
  const img=document.getElementById('homeCoverMobilePreviewImg');
  if(img) img.style.objectPosition=pos+'% center';
}

// Admin panel for the home cover — deliberately minimal compared to the
// reference this was adapted from (no chef photo, no software icon/name,
// no separate subtitle/price line): just the background image, its
// mobile crop position (with the same live phone-shaped preview), the
// headline text, and the two CTA buttons (label + link each, so either
// can point anywhere — a custom URL, not just "scroll to menu").
let _autoSaveTimer=null;
// The whole admin panel auto-publishes on every edit now (debounced
// ~900ms after the last change) instead of requiring the "Publier"
// button — it's too easy to forget to click it. Hooked into renderAll()
// itself (see below) rather than added to every individual field's
// handler, since virtually every admin edit already calls renderAll()
// right after mutating DATA — this way nothing gets missed. Gated on
// supaSession && editMode so a regular visitor's own tab-switching
// never triggers a publish attempt or shows them an admin toast.
function scheduleAutoSave(silent){
  if(_autoSaveTimer) clearTimeout(_autoSaveTimer);
  _autoSaveTimer=setTimeout(()=>{ publishToSupabase(silent); }, 900);
}
// Deletions (a tab, a dish, a section...) get saved immediately instead
// of through the usual debounce — someone who just deleted something is
// prone to closing the panel or navigating away right after, and the
// normal ~900ms delay risked losing exactly the change they most wanted
// kept: the deletion itself.
function publishNow(silent){
  if(_autoSaveTimer){ clearTimeout(_autoSaveTimer); _autoSaveTimer=null; }
  publishToSupabase(silent);
}
// Kept as an alias: the cover section's fields already call this by
// name in their own handlers — no need to touch each of them.
function scheduleCoverAutoSave(){ scheduleAutoSave(); }
// Each diaporama slide keeps its own folded/unfolded state, same
// pattern as the schedule day cards (scheduleDayOpen/toggleScheduleDay).
let coverSlideOpen = {};
function toggleCoverSlide(i){ coverSlideOpen[i] = !coverSlideOpen[i]; renderAdminSection('__global'); }
function setCoverMediaType(key){ DATA.homeCover.mediaType=key; renderAll(); scheduleCoverAutoSave(); }
// One extra navigation level inside "Page d'accueil" itself — same
// push/back pattern as openDishDetail/closeDishDetail (a list of rows,
// clicking one shows just that row's page with a back arrow).
let homeCoverSubpage = null;
const HOME_COVER_ROW_LABELS={
  infos:'Logo, description, boutons',
  photo:'Photo (plein écran)',
  video:'Vidéo (plein écran)',
  slideshow:'Diaporama (3 photos)'
};
function openHomeCoverRow(key){
  homeCoverSubpage = key;
  if(key==='photo'||key==='video'||key==='slideshow') setCoverMediaType(key);
  renderAdminSection('__global');
}

// Home tab photo: respect the photo's own proportions rather than
// force-cropping every upload to a fixed 4:3 — but keep it within a
// sane range (never taller than 4:3, never flatter/wider than 16:9)
// so an odd source photo can't make the header oddly tall or a thin strip.
function clampHomePhotoRatio(img){
  if(!img.naturalWidth || !img.naturalHeight) return;
  const natural = img.naturalWidth / img.naturalHeight;
  const clamped = Math.min(Math.max(natural, 4/3), 16/9);
  img.style.aspectRatio = clamped;
}

// Home tab background video is forced muted for autoplay to work at
// all in modern browsers — but that means no way to hear it otherwise.
// This button un-mutes on click: a real property toggle for a native
// <video>, or a postMessage command for YouTube/Vimeo iframes (each
// platform has its own tiny protocol for this, since we can't reach
// into a cross-origin iframe directly).
function toggleHomeVideoMute(btn){
  const wrap=btn.closest('.home-photo-wrap');
  if(!wrap) return;
  const nowUnmuted=!wrap.classList.contains('video-unmuted');
  const video=wrap.querySelector('video');
  const iframe=wrap.querySelector('iframe');
  if(video){ video.muted=!nowUnmuted; }
  if(iframe){
    const src=iframe.src||'';
    if(src.includes('youtube.com')){
      iframe.contentWindow.postMessage(JSON.stringify({event:'command',func:nowUnmuted?'unMute':'mute',args:[]}), '*');
    } else if(src.includes('vimeo.com')){
      iframe.contentWindow.postMessage(JSON.stringify({method:'setVolume',value:nowUnmuted?1:0}), '*');
    }
  }
  wrap.classList.toggle('video-unmuted', nowUnmuted);
  btn.innerHTML = nowUnmuted
    ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18 6a9 9 0 0 1 0 12"/></svg>`
    : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><line x1="16" y1="9" x2="22" y2="15"/><line x1="22" y1="9" x2="16" y2="15"/></svg>`;
}
