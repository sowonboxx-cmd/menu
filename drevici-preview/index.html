function exportA4Print(cfg){
  const css = buildPdfCSS(cfg);
  const pages = paginatePdfPages(cfg);
  const restName = getRestaurantName() || 'Menu';
  const pagesHtml = pages.map((page, i)=>{
    const breakStyle = i<pages.length-1 ? 'page-break-after:always;break-after:page;' : '';
    const scaleStyle = page.spaceScale && page.spaceScale!==1 ? `--space-scale:${page.spaceScale};` : '';
    // Continuation pages (no header) sat with the same top padding as
    // page 1, but without the header there to justify that much air —
    // the first category on those pages read as starting too low.
    const topTrimStyle = i>0 ? `--top-pad-trim:5px;` : '';
    return `<div class="pdf-page" style="${breakStyle}${scaleStyle}${topTrimStyle}">${page.html}</div>`;
  }).join('');
  const doc = `<!DOCTYPE html><html><head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans+Condensed:wght@300;700&family=Lovelo:wght@400;700&family=Open+Sans:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet"><meta charset="UTF-8"><title>${restName}</title><style>${css}</style></head><body>${pagesHtml}</body></html>`;
  // BUG FIX: this used to open a blank window and fill it via
  // document.write() — increasingly restricted by modern browsers
  // (Safari in particular), which can silently leave the new tab blank
  // or refuse the popup outright. A Blob URL opened directly gives the
  // new tab a real, complete document from the start — no write-after-
  // open step for the browser to interfere with.
  const blob = new Blob([doc], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const win = window.open(url, '_blank');
  if(!win){ showToast('⚠️ Le navigateur a bloqué la fenêtre — autorise les pop-ups pour ce site'); return; }
  // BUG FIX (iPhone) : la fenêtre pouvait s'ouvrir et afficher le menu
  // sans jamais déclencher win.print() — soit parce que win.document.
  // fonts.ready ne se résout pas de façon fiable dans cette fenêtre
  // séparée sur iOS, soit parce que l'évènement 'load' ne se déclenche
  // pas toujours sur une URL blob: là-bas. Deux filets de sécurité
  // ajoutés : un délai maximum sur l'attente des polices, et un appel
  // de secours si rien n'a encore imprimé après quelques secondes —
  // print() finit donc toujours par être appelé, même si l'un des
  // signaux attendus ne vient jamais.
  let printed = false;
  const doPrint = () => {
    if(printed) return;
    printed = true;
    try{ win.print(); }catch(e){ console.error(e); }
    URL.revokeObjectURL(url);
  };
  const waitThenPrint = () => {
    const ready = win.document && win.document.fonts && win.document.fonts.ready
      ? win.document.fonts.ready
      : Promise.resolve();
    Promise.race([ ready, new Promise(res=>setTimeout(res, 3000)) ]).then(()=>{
      setTimeout(doPrint, 100);
    });
  };
  if(win.document && win.document.readyState === 'complete') waitThenPrint();
  else win.addEventListener('load', waitThenPrint);
  setTimeout(()=>{ if(!printed) doPrint(); }, 4500);
}

// Découpe le contenu en plusieurs images de mêmes proportions que le
// format Google Business déjà validé par Will (ratio hauteur/largeur
// ≈1.886, mesuré sur son propre export testé). Même logique que la
// pagination PDF : on essaie de garder chaque catégorie entière sur une
// image, on la fait juste commencer sur la suivante si elle ne rentre
// pas dans ce qui reste — et seulement si une catégorie est trop
// grande pour tenir seule sur une image entière, on la découpe plat
// par plat en dernier recours (jamais un plat coupé en deux).
// Ratio mesuré sur le format Doma (référence de Will) — 1.663 au lieu
// de l'ancien 1.8863 : un cadre plus compact, moins susceptible d'être
// rogné à l'affichage sur des écrans plus petits.
const GBIZ_PAGE_RATIO = 1.663; // height / width
// Instagram Story — vraie proportion 9:16 (1080×1920 à l'export final).
const INSTA_RATIO = 16/9; // height / width
// Instagram Post — format 3:4 (1080×1440 à l'export final), demandé
// par Will à la place du 4:5 initial. Même largeur que la story, juste
// une page moins haute — aucune nouvelle règle : mêmes plafonds une
// seule ligne, même découpage équilibré multi-pages, juste plus
// susceptible de se déclencher puisqu'il y a moins de hauteur
// disponible.
const INSTA_POST_RATIO = 4/3; // height / width — 1080×1440
// "Menus et Formules" — format A4, mais avec l'habillage visuel
// d'Instagram (centré, épuré) plutôt que celui de l'impression
// classique du menu complet, jugé plus agréable pour un menu/formule
// autonome. Même moteur (compression + découpage équilibré multi-
// pages en dernier recours), juste une proportion A4 (210×297mm).
const INSTA_A4_RATIO = 1123/794; // height / width
// 20 polices Google Fonts parmi les plus populaires ET les plus
// lisibles pour un menu — mélange de serif élégantes (registre menu
// classique) et de sans-serif nettes (lisibilité). Demande explicite
// de Will : propre à Instagram uniquement, une seule police pour tout
// le visuel (titre, plat, prix, description).
const INSTA_FONT_OPTIONS = [
  'Playfair Display','Cormorant Garamond','Merriweather','Lora','EB Garamond',
  'Libre Baskerville','Crimson Text','Cardo','Cinzel','Marcellus',
  'Prata','DM Serif Display','Abril Fatface','Bodoni Moda','Josefin Sans',
  'Montserrat','Raleway','Poppins','Quicksand','Nunito',
  'Oswald','Archivo Narrow','Barlow Condensed','Roboto Condensed','PT Sans Narrow',
  'Fjalla One','Yanone Kaffeesatz','Saira Condensed','Cabin Condensed','Khand',
  'Asap Condensed','Ubuntu Condensed','Big Shoulders Condensed','IBM Plex Sans Condensed','Encode Sans Condensed',
  'Rozha One','Kreon','Bevan','Trirong','Rosarivo',
  'Cormorant SC','Cormorant Upright','Cormorant Infant','Antic Slab','Radley',
  'Vidaloka','Kadwa','Alegreya','Alegreya SC','Judson'
];
// Polices condensées (lettres plus serrées) — demande explicite de
// Will pour aider les noms de plats longs à tenir dans le cadre sans
// trop rétrécir ni passer à la ligne. Affichées avec "(Condensed)"
// entre parenthèses dans les listes ci-dessous pour qu'on les
// reconnaisse — le vrai nom de police (sans le suffixe) reste ce qui
// est envoyé à Google Fonts et stocké comme cfg.instaFont. Deuxième
// vague : 15 condensées avec empattements (serif), pour ceux qui
// veulent rester dans un registre plus classique tout en gagnant de
// la place.
const INSTA_CONDENSED_FONTS = [
  'Oswald','Archivo Narrow','Barlow Condensed','Roboto Condensed','PT Sans Narrow',
  'Fjalla One','Yanone Kaffeesatz','Saira Condensed','Cabin Condensed','Khand',
  'Asap Condensed','Ubuntu Condensed','Big Shoulders Condensed','IBM Plex Sans Condensed','Encode Sans Condensed',
  'Rozha One','Kreon','Bevan','Trirong','Rosarivo',
  'Cormorant SC','Cormorant Upright','Cormorant Infant','Antic Slab','Radley',
  'Vidaloka','Kadwa','Alegreya','Alegreya SC','Judson'
];
function instaFontLabel(font){ return INSTA_CONDENSED_FONTS.includes(font) ? font+' (Condensed)' : font; }
const INSTA_RENDER_W = 608;
// BUG FIX: le site applique un zoom CSS de 1.1x sur desktop (à partir
// de 641px de large), mais PAS en dessous de cette largeur — annuler
// systématiquement un zoom de 1.1 (comme fait dans un premier temps)
// est donc faux dès que la fenêtre est plus étroite : ça introduit
// alors le décalage inverse. On mesure ici le zoom RÉELLEMENT actif au
// moment de l'appel, plutôt que de le supposer fixe, pour que la
// correction reste juste quelle que soit la largeur de la fenêtre.
function getActiveZoomRatio(){
  const probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;left:-99999px;top:0;width:1000px;height:10px;visibility:hidden';
  document.body.appendChild(probe);
  const ratio = probe.getBoundingClientRect().width / 1000;
  document.body.removeChild(probe);
  return ratio || 1;
}
function paginateGbizPages(cfg){
  // 612px = la largeur pour laquelle les tailles de police du format
  // Google Business sont déjà calibrées (buildPdfCSS's pageW pour
  // isGbiz) — mesurer à une autre largeur fausserait les proportions
  // texte/page.
  const RENDER_W = 612;
  // Petite marge de sécurité : la capture finale utilise maintenant une
  // hauteur stricte (overflow:hidden côté source), donc mieux vaut
  // viser légèrement en dessous du maximum théorique plutôt que de
  // risquer de rogner un plat au pixel près.
  const maxPageHeightPx = Math.floor(RENDER_W * GBIZ_PAGE_RATIO * 0.97);

  const { headerHtml, contentBlocks, footerHtml } = buildPdfBlocks(cfg);

  const holder = document.createElement('div');
  // BUG FIX: le zoom actif (1.1x ou 1x selon la largeur de fenêtre) est
  // maintenant mesuré dynamiquement plutôt que supposé fixe — voir
  // getActiveZoomRatio() ci-dessus.
  const zoomCancel = 1 / getActiveZoomRatio();
  holder.style.cssText = `position:fixed;left:-99999px;top:0;visibility:hidden;width:${RENDER_W}px;zoom:${zoomCancel}`;
  holder.innerHTML = `<style>${buildPdfCSS(cfg)}</style><div class="pdf-page" id="__gbizMeasure" style="height:auto;min-height:0;width:${RENDER_W}px"></div>`;
  document.body.appendChild(holder);
  const measureEl = holder.querySelector('#__gbizMeasure');
  const heightOf = html => { measureEl.innerHTML = html; return measureEl.offsetHeight; };

  // Regroupe les blocs plat-par-plat en paquets par catégorie (chaque
  // <h2 class="pdf-cat"> marque le début d'une nouvelle catégorie).
  const groups = [];
  contentBlocks.forEach(b=>{
    if(b.html.includes('class="pdf-cat"') || groups.length===0) groups.push([b]);
    else groups[groups.length-1].push(b);
  });

  // Pas de plafond de catégories par page — on remplit selon la place
  // réellement disponible (2 ou 3 catégories, selon ce qui tient),
  // pour éviter à la fois le débordement ET une page qui reste à
  // moitié vide alors qu'une catégorie de plus aurait tenu.
  const pages = []; // { html, spaceScale }
  const pullFailures = []; // tabIds où "rejoindre la précédente" a été demandé mais n'a pas pu aboutir
  let current = headerHtml;
  let currentScale = 1;
  // Tente les mêmes blocs à une échelle d'espacement réduite (jamais le
  // texte) pour voir s'ils rentrent quand même — utilisé uniquement
  // pour "rejoindre la page précédente", jamais imposé par défaut.
  const heightOfScaled = (html, scale) => {
    measureEl.style.setProperty('--space-scale', String(scale));
    measureEl.innerHTML = html;
    const h = measureEl.offsetHeight;
    measureEl.style.setProperty('--space-scale', '1');
    return h;
  };
  const COMPRESS_STEPS = [1, 0.97, 0.94, 0.91, 0.88, 0.85, 0.82]; // jusqu'à 18% maintenant
  groups.forEach(group=>{
    const groupHtml = group.map(b=>b.html).join('');
    const tb = group[0] && group[0].tabId ? DATA.tabs.find(x=>x.id===group[0].tabId) : null;
    const candidate = current + groupHtml;
    // "Saut de page par catégorie" — même mécanique que le PDF : on
    // force une page fraîche pour cette catégorie, sauf si on est déjà
    // en tout début de page (rien à gagner à forcer un saut inutile).
    const mustBreak = group[0] && group[0].forceBreak && current !== '';

    let combined = false;
    if(!mustBreak && heightOf(candidate) <= maxPageHeightPx){
      current = candidate; combined = true;
    } else if(!mustBreak && current !== ''){
      // Par défaut (plus besoin de cocher "Rejoindre la page
      // précédente") : avant de sauter à une page neuve, on tente de
      // compresser l'espacement de tout ce qui est déjà sur la page
      // (jusqu'à -18%, jamais le texte) pour voir si cette catégorie
      // peut quand même s'ajouter à la suite — remplir chaque page tant
      // que c'est possible plutôt que d'en laisser une à moitié vide
      // alors que la suivante aurait tenu (ex. "Huîtres" seule sur la
      // page 1 alors que "Terre & mer" aurait pu suivre directement).
      let fitScale = null;
      for(const s of COMPRESS_STEPS){
        if(heightOfScaled(candidate, s) <= maxPageHeightPx){ fitScale = s; break; }
      }
      if(fitScale !== null){
        current = candidate; currentScale = fitScale; combined = true;
      } else if(tb && tb.gbizPullPrevious){
        // Cette catégorie demandait explicitement à rejoindre la page
        // précédente et même la compression max n'y suffit pas — on le
        // signale (pullFailures) plutôt que d'imposer un rendu abîmé.
        pullFailures.push(tb.id);
      }
    }
    if(combined) return;

    if(heightOf(groupHtml) <= maxPageHeightPx){
      // La catégorie entière rentre sur une page fraîche.
      pages.push({ html: current, spaceScale: currentScale });
      current = groupHtml; currentScale = 1;
    } else {
      // La catégorie ne rentre pas seule à taille normale — avant de la
      // découper plat par plat (ce qui peut laisser un plat orphelin
      // tout seul sur sa page, ex. "Caviar de nori"), on tente le même
      // espacement compressé (jusqu'à -18%, jamais le texte) déjà
      // utilisé ci-dessus : souvent le dépassement ne représente que
      // quelques %, largement dans la marge de compression, alors
      // qu'une catégorie resserrée tient très bien en entier sur une
      // seule image.
      let fitScale = null;
      for(const s of COMPRESS_STEPS){
        if(heightOfScaled(groupHtml, s) <= maxPageHeightPx){ fitScale = s; break; }
      }
      if(fitScale !== null){
        pages.push({ html: current, spaceScale: currentScale });
        current = groupHtml; currentScale = fitScale;
      } else {
        // Même compressée à -18%, la catégorie est trop grande —
        // dernier recours : on la découpe plat par plat (jamais un plat
        // coupé en deux).
        if(current){ pages.push({ html: current, spaceScale: currentScale }); current=''; currentScale=1; }
        let sub='';
        group.forEach(b=>{
          const cand2 = sub + b.html;
          if(heightOf(cand2) <= maxPageHeightPx){ sub = cand2; }
          else { if(sub) pages.push({ html: sub, spaceScale: 1 }); sub = b.html; }
        });
        current = sub;
      }
    }
  });
  if(footerHtml){
    const withFooter = current + footerHtml;
    if(heightOf(withFooter) <= maxPageHeightPx){ current = withFooter; }
    else { pages.push({ html: current, spaceScale: currentScale }); current = footerHtml; currentScale = 1; }
  }
  if(current) pages.push({ html: current, spaceScale: currentScale });

  document.body.removeChild(holder);
  // Plus besoin d'espaceur artificiel : sans aucun en-tête nulle part
  // (voir buildPdfBlocks), chaque page démarre déjà au même niveau
  // naturellement — alignement "gratuit", pas de bricolage nécessaire.
  return { pages, pullFailures };
}

// Détection mobile simple (pour proposer un téléchargement page par page
// en plus du bouton "Générer toutes les images" — voir plus bas) : sur
// desktop, le bouton existant fonctionne déjà bien tel quel, donc pas
// besoin d'alourdir cette UI là où ce n'est pas nécessaire.
function isMobileDevice(){
  return /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent || '');
}

// Rendu d'UNE page Google Business en Blob PNG — logique extraite
// d'exportGbizImage pour être réutilisée aussi par le téléchargement
// page par page (mobile). Lève une erreur si ça échoue (à charge de
// l'appelant de l'attraper).
async function renderGbizPageToBlob(css, pages, i, restName, bg){
  const RENDER_W = 612; // doit rester identique à paginateGbizPages
  const TARGET_W = 1080;
  const scale = TARGET_W / RENDER_W;
  const holder = document.createElement('div');
  const pageHeightPx = Math.floor(RENDER_W*GBIZ_PAGE_RATIO);
  // BUG FIX: le vrai coupable de l'écart entre les mots était
  // html2canvas lui-même — son moteur de texte "maison" (par
  // opposition au vrai moteur du navigateur) accumule des écarts
  // d'arrondi entre les mots quel que soit le réglage tenté
  // (police bien chargée localement ou non, letterRendering activé
  // ou non, scale entier ou non — testé et confirmé un par un).
  // La vraie solution : foreignObjectRendering, qui délègue le texte
  // au moteur natif du navigateur plutôt qu'à l'approximation
  // d'html2canvas. Cette option avait déjà été essayée mais donnait
  // des pages blanches — uniquement parce que l'élément était placé
  // très loin hors écran (left:-99999px), ce que foreignObjectRendering
  // gère mal. En le gardant DANS l'écran (juste rendu invisible par
  // une opacité quasi nulle plutôt que par un déplacement), ça
  // fonctionne parfaitement : plus de pages blanches, plus d'écart.
  // BUG FIX: la correction de zoom fixe (1.1x) était fausse dès que
  // la fenêtre est plus étroite que 641px (le zoom du site ne
  // s'active qu'à partir de cette largeur) — mesurée dynamiquement
  // maintenant via getActiveZoomRatio(), plutôt que supposée.
  const zoomCancel = 1 / getActiveZoomRatio();
  holder.style.cssText = `position:fixed;left:0;top:0;width:${RENDER_W}px;height:${pageHeightPx}px;opacity:0.001;pointer-events:none;z-index:-1;zoom:${zoomCancel}`;
  const scaleStyle = pages[i].spaceScale && pages[i].spaceScale!==1 ? `--space-scale:${pages[i].spaceScale};` : '';
  holder.innerHTML = `<style>${css}</style><div class="pdf-page" id="gbizPage${i}" style="width:${RENDER_W}px;height:${pageHeightPx}px;overflow:hidden;${scaleStyle}">${pages[i].html}</div>`;
  document.body.appendChild(holder);
  const pageEl = holder.querySelector(`#gbizPage${i}`);
  try{
    await document.fonts.ready;
    await new Promise(r=>setTimeout(r,150));
    // BUG FIX (mobile bloqué) : foreignObjectRendering:true (choisi
    // pour corriger l'écart entre les mots — voir plus haut) a un
    // support très inégal sur Safari/WebKit mobile : il peut rester
    // bloqué indéfiniment sans jamais réussir ni lever d'erreur,
    // laissant "Génération en cours…" affiché pour rien — aucun
    // try/catch ne peut rattraper une promesse qui ne se résout
    // jamais. On l'entoure d'un délai de sécurité et, s'il n'a pas
    // répondu à temps ou s'il échoue, on retente la même page sans
    // foreignObjectRendering (léger écart entre mots possible en
    // secours, mais au moins une image est produite). Délai remonté
    // à 20s (au lieu de 8s) : un mobile est plus lent qu'un
    // ordinateur, et les pages sont maintenant plus denses (fusion +
    // compression) — un rendu simplement lent ne doit pas être pris
    // pour un vrai blocage et abandonné trop tôt.
    const withTimeout = (p, ms) => Promise.race([
      p,
      new Promise((_,rej)=>setTimeout(()=>rej(new Error('html2canvas timeout')), ms))
    ]);
    let canvas;
    try{
      canvas = await withTimeout(html2canvas(pageEl, { scale, useCORS:true, backgroundColor:bg, logging:false, foreignObjectRendering:true }), 20000);
    } catch(errFo){
      console.error('foreignObjectRendering a échoué ou expiré, repli sans lui :', errFo);
      canvas = await withTimeout(html2canvas(pageEl, { scale, useCORS:true, backgroundColor:bg, logging:false, foreignObjectRendering:false }), 20000);
    }
    const suffix = pages.length>1 ? `-${i+1}` : '';
    const blob = await new Promise(res=>canvas.toBlob(res,'image/png'));
    if(!blob) throw new Error('toBlob a renvoyé null');
    return { blob, name: `${restName}-google-business${suffix}.png`, pageIndex: i };
  } finally {
    document.body.removeChild(holder);
  }
}

// Instagram : même moteur robuste que Google Business (délai de
// sécurité + repli sans foreignObjectRendering), mais dimensions et
// police propres au format story (voir buildInstaCSS/buildInstaPages).
async function renderInstaPageToBlob(css, pages, i, restName, bg, ratio, variantLabel, targetW){
  ratio = ratio || INSTA_RATIO;
  const TARGET_W = targetW || 1080;
  const scale = TARGET_W / INSTA_RENDER_W;
  const holder = document.createElement('div');
  const pageHeightPx = Math.round(INSTA_RENDER_W*ratio);
  const zoomCancel = 1 / getActiveZoomRatio();
  holder.style.cssText = `position:fixed;left:0;top:0;width:${INSTA_RENDER_W}px;height:${pageHeightPx}px;opacity:0.001;pointer-events:none;z-index:-1;zoom:${zoomCancel}`;
  const scaleStyle = pages[i].spaceScale && pages[i].spaceScale!==1 ? `--space-scale:${pages[i].spaceScale};` : '';
  holder.innerHTML = `<style>${css}</style><div class="pdf-page" id="instaPage${i}" style="width:${INSTA_RENDER_W}px;height:${pageHeightPx}px;overflow:hidden;${scaleStyle}">${pages[i].html}</div>`;
  document.body.appendChild(holder);
  const pageEl = holder.querySelector(`#instaPage${i}`);
  try{
    await document.fonts.ready;
    await new Promise(r=>setTimeout(r,150));
    const withTimeout = (p, ms) => Promise.race([
      p,
      new Promise((_,rej)=>setTimeout(()=>rej(new Error('html2canvas timeout')), ms))
    ]);
    // BUG FIX (contenu décalé/manquant en haut) : la pagination
    // elle-même est vérifiée correcte (testé : chaque page démarre
    // bien sur une frontière de plat entière, jamais coupée) — le
    // problème vient de la capture foreignObjectRendering:true elle-
    // même sur ce format (page haute, mise à l'échelle ~1.78x) : elle
    // ne lève aucune erreur mais capture une zone décalée par rapport
    // au vrai contenu de la page, engendrant exactement ce
    // "contenu manquant en haut + grand vide en bas". On saute donc
    // directement au mode sans foreignObjectRendering pour Instagram,
    // qui capture la bonne zone (léger écart entre mots possible en
    // échange, largement préférable à du contenu manquant).
    let canvas = await withTimeout(html2canvas(pageEl, { scale, useCORS:true, backgroundColor:bg, logging:false, foreignObjectRendering:false }), 20000);
    const slug = (pages[i].tabLabel || `image-${i+1}`).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
    const blob = await new Promise(res=>canvas.toBlob(res,'image/png'));
    if(!blob) throw new Error('toBlob a renvoyé null');
    return { blob, name: `${restName}-instagram-${variantLabel||'story'}-${slug||i+1}.png`, pageIndex: i };
  } finally {
    document.body.removeChild(holder);
  }
}

// variant: 'story' (9:16, par défaut), 'post' (4:5), ou 'a4' (menus et
// formules — même moteur, juste une hauteur de page différente ;
// aucune nouvelle règle (rétrécissement une ligne, découpage équilibré
// multi-pages, compression d'espacement) n'est dupliquée, tout
// continue de s'appliquer tel quel avec ce nouveau ratio.
async function exportInstaImages(cfg, variant){
  variant = variant || 'story';
  const ratio = variant === 'post' ? INSTA_POST_RATIO : variant === 'a4' ? INSTA_A4_RATIO : INSTA_RATIO;
  const targetW = variant === 'a4' ? 1600 : 1080; // A4 : un peu plus de résolution pour l'impression
  if(typeof html2canvas === 'undefined'){ showToast('⚠ html2canvas non chargé'); return; }
  showToast('Génération des images en cours…');
  // Menus et Formules (cfg.tabsSource) : toujours une seule page,
  // jamais le découpage multi-pages du vrai menu — voir
  // buildFormulePage.
  let css, pages;
  if(cfg.tabsSource){
    const built = buildFormulePage(cfg, ratio);
    css = built.css; pages = built.pages;
  } else {
    css = buildInstaCSS(cfg, ratio);
    pages = buildInstaPages(cfg, ratio);
  }
  const restName = (getRestaurantName()||'menu').replace(/\s+/g,'-').toLowerCase();
  const bg = cfg.menuBgColor || cfg.instaBgColor || cfg.bgColor || '#FDFBF6';

  const blobs = [];
  for(let i=0;i<pages.length;i++){
    try{
      const result = await renderInstaPageToBlob(css, pages, i, restName, bg, ratio, variant, targetW);
      blobs.push(result);
    } catch(err){
      console.error(err);
      showToast('⚠ Erreur génération image '+(i+1));
    }
  }

  if(!blobs.length) return;

  const urls = blobs.map(b=>({ url: URL.createObjectURL(b.blob), name: b.name, pageIndex: b.pageIndex, totalPages: pages.length }));

  try{
    urls.forEach(({url,name})=>{
      const link = document.createElement('a');
      link.download = name;
      link.href = url;
      link.click();
    });
  } catch(err){ console.error(err); }

  // La galerie de secours n'a de sens que sur mobile (où le
  // téléchargement JS est peu fiable) — sur desktop, le lien de
  // téléchargement ci-dessus suffit déjà, ce popup n'apportait rien
  // et gênait inutilement (demande explicite de Will).
  if(isMobileDevice()){
    try{ showGbizResultGallery(urls); } catch(err){ console.error(err); }
  }
}

async function exportGbizImage(cfg){
  if(typeof html2canvas === 'undefined'){ showToast('⚠ html2canvas non chargé'); return; }
  showToast('Génération des images en cours…');
  const css = buildPdfCSS(cfg);
  const { pages } = paginateGbizPages(cfg);
  const restName = (getRestaurantName()||'menu').replace(/\s+/g,'-').toLowerCase();
  const bg = cfg.bgColor || '#FDFBF6';

  // BUG FIX (mobile) : la méthode <a download> + toDataURL() ne
  // télécharge rien sur mobile (Safari iOS ignore l'attribut "download"
  // sur les URLs data:, et un lien cliqué après plusieurs "await" perd
  // son statut de geste utilisateur "de confiance" — le clic est alors
  // silencieusement ignoré, sans erreur visible). Sur desktop ça marche
  // car le navigateur est plus permissif. On génère donc chaque image en
  // Blob (voir plus bas pour le téléchargement + la galerie de secours
  // garantie sur mobile) — navigator.share() a été essayé puis retiré :
  // trop peu fiable, voir le second BUG FIX plus bas. Sur mobile, ce
  // bouton reste réservé au desktop dans l'UI (voir isMobileDevice
  // dans renderGbizPagePreview) : html2canvas n'y étant pas fiable, le
  // téléchargement par page et l'aperçu capture d'écran ont été
  // essayés et retirés à la demande de Will — à revoir plus tard.
  const blobs = [];
  for(let i=0;i<pages.length;i++){
    try{
      const result = await renderGbizPageToBlob(css, pages, i, restName, bg);
      blobs.push(result);
    } catch(err){
      console.error(err);
      showToast('⚠ Erreur génération image '+(i+1));
    }
  }

  if(!blobs.length) return;

  const urls = blobs.map(b=>({ url: URL.createObjectURL(b.blob), name: b.name, pageIndex: b.pageIndex, totalPages: pages.length }));

  // BUG FIX (desktop cassé) : navigator.share() a été retiré. Même
  // protégé par try/catch, il pouvait rester en attente indéfiniment
  // sans jamais réussir ni lever d'erreur sur certains navigateurs
  // desktop (aucun catch ne peut rattraper une promesse qui ne se
  // résout jamais) — ce qui bloquait toute la fonction en silence.
  // Retour à quelque chose de simple et fiable : téléchargement direct
  // (fonctionne sur desktop, comme à l'origine) + galerie visuelle
  // affichée systématiquement juste après (garantie sur mobile, appui
  // long pour enregistrer).
  try{
    urls.forEach(({url,name})=>{
      const link = document.createElement('a');
      link.download = name;
      link.href = url;
      link.click();
    });
  } catch(err){ console.error(err); }

  try{ showGbizResultGallery(urls); } catch(err){ console.error(err); }
}

// Galerie de secours garantie : affiche chaque image générée directement
// à l'écran (appui long pour enregistrer sur mobile, clic droit sur
// desktop) — voir le BUG FIX ci-dessus dans exportGbizImage. Les URLs
// blob restent valides tant que la modale est ouverte ; libérées à la
// fermeture.
function showGbizResultGallery(images){
  const old = document.getElementById('gbizResultModal');
  if(old){ old.querySelectorAll('img').forEach(img=>{ try{ URL.revokeObjectURL(img.src); }catch(e){} }); old.remove(); }
  // Toujours trier par position réelle dans le menu (pageIndex) — si une
  // page a échoué, les suivantes gardent leur vrai numéro (ex. "Page
  // 3/5") au lieu d'être renumérotées à la suite ("Page 2/4"), ce qui
  // donnait l'impression trompeuse d'un ordre mélangé.
  const sorted = [...images].sort((a,b)=>(a.pageIndex??0)-(b.pageIndex??0));
  const totalPages = sorted[0] && sorted[0].totalPages ? sorted[0].totalPages : sorted.length;
  const missingNote = sorted.length < totalPages
    ? `<div style="color:#ffb4b0;font-family:Jost,sans-serif;font-size:12px;text-align:center;margin-bottom:14px">⚠️ ${totalPages - sorted.length} page(s) sur ${totalPages} n'ont pas pu être générée(s) — regénère si besoin.</div>`
    : '';
  const modal = document.createElement('div');
  modal.id = 'gbizResultModal';
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9500;display:flex;flex-direction:column;align-items:center;padding:22px 14px;overflow-y:auto;-webkit-overflow-scrolling:touch';
  modal.innerHTML = `
    <div style="width:100%;max-width:480px;display:flex;flex-direction:column;align-items:center">
      <button id="gbizResultClose" style="align-self:flex-end;background:none;border:none;color:#fff;font-size:28px;line-height:1;cursor:pointer;margin-bottom:8px;opacity:.85;padding:4px 8px">✕</button>
      <div style="color:rgba(255,255,255,.8);font-family:Jost,sans-serif;font-size:12.5px;text-align:center;margin-bottom:18px;line-height:1.6">📱 Sur téléphone : appuie <b>longuement</b> sur une image ci-dessous, puis "Enregistrer l'image".<br>💻 Sur ordinateur : clic droit → "Enregistrer l'image sous…".</div>
      ${missingNote}
      ${sorted.map(im=>`
        <div style="width:100%;margin-bottom:24px;text-align:center">
          <img src="${im.url}" style="width:100%;border-radius:10px;display:block;box-shadow:0 4px 24px rgba(0,0,0,.45)">
          <div style="margin-top:9px;display:flex;align-items:center;justify-content:center;gap:12px">
            <span style="color:rgba(255,255,255,.55);font-family:Jost,sans-serif;font-size:11.5px">Page ${(im.pageIndex??0)+1}/${totalPages}</span>
            <a href="${im.url}" download="${im.name}" style="color:#fff;font-family:Jost,sans-serif;font-size:12px;font-weight:600;text-decoration:underline">Télécharger</a>
          </div>
        </div>`).join('')}
    </div>`;
  document.body.appendChild(modal);
  const cleanup = ()=>{ images.forEach(im=>{ try{ URL.revokeObjectURL(im.url); }catch(e){} }); modal.remove(); };
  document.getElementById('gbizResultClose').onclick = cleanup;
}

// ajusté ensuite : liste des formules (max 5), édition libre des
// catégories/plats (à la main ou importés du vrai menu), couleurs

function closeFormule(){ formuleOpen=null; formulePane=null; formuleCatOpen=null; renderAdminSection('__global'); }
function openFormuleCat(catId){ formuleCatOpen=catId; renderAdminSection('__global'); }
function closeFormuleCat(){ formuleCatOpen=null; renderAdminSection('__global'); }

function renderFormulesSection(){
  formule_ensureInit();
  if(formuleOpen){
    const f = DATA.formules.find(x=>x.id===formuleOpen);
    if(f){
      if(formuleCatOpen){

// Aperçu mobile Google Business — une vraie iframe isolée, mais qui
// garde la page à sa vraie taille fixe (mêmes tailles de police que
// l'export réel) et la réduit ENTIÈREMENT en un seul bloc via
// transform:scale() — comme le fait déjà la vignette desktop. Un
// width:100%!important avait été tenté ici mais force le texte (en
// tailles fixes calibrées pour une largeur donnée) à se replier dans un
// espace minuscule : tout apparaît alors énorme et hors d'échelle. Le
// scale calculé dynamiquement dans l'iframe (au chargement + au resize)
// garantit que tout — texte, espacement — rétrécit ensemble,
// proportionnellement, comme un vrai zoom out. Partagé entre Google
// Business (page fixe 612px) et Impression (page A4/A5).
function buildPreviewSlideDoc(css, pageHtml, spaceScale, pageW, pageH){
  const scaleStyle = spaceScale && spaceScale!==1 ? `--space-scale:${spaceScale};` : '';
  return `<!DOCTYPE html><html><head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans+Condensed:wght@300;700&family=Lovelo:wght@400;700&family=Open+Sans:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet"><meta charset="UTF-8"><style id="liveCss">${css}</style><style>
html,body{overflow:hidden;margin:0;background:transparent}
/* BUG FIX (page collée à droite et coupée sur iPad/desktop) :
   .pdf-page porte un margin:0 auto qui la centrait DÉJÀ dans le corps
   de l'iframe, et le transform de mise à l'échelle ajoutait par-dessus
   son propre décalage de centrage — d'où un double décalage vers la
   droite. Invisible sur mobile, où la largeur de l'écran vaut presque
   celle de la page et où ce premier décalage est donc nul. On annule
   la marge : un seul centrage, celui du transform. */
#stage{width:${pageW}px;height:${pageH}px;margin:0!important;transform-origin:top left;box-shadow:0 2px 14px rgba(0,0,0,.18)}
</style></head><body><div id="stage" class="pdf-page" style="${scaleStyle}">${pageHtml}</div>
<script>
(function(){
  function fit(){
    // BUG FIX (cadre coupé à droite) : la mise à l'échelle ne tenait
    // compte que de la largeur. Dès que la hauteur disponible était la
    // contrainte la plus serrée, le contenu débordait. On prend la
    // plus petite des deux et on recentre.
    var vw = document.documentElement.clientWidth;
    var vh = document.documentElement.clientHeight;
    // Une marge de sécurité de 0,5% : sans elle, l'arrondi au pixel
    // près rognait le filet doré collé au bord de la page.
    var scale = Math.min(vw / ${pageW}, vh / ${pageH}) * 0.995;
    var stage = document.getElementById('stage');
    stage.style.transform = 'translate(' + ((vw - ${pageW} * scale) / 2) + 'px,' + ((vh - ${pageH} * scale) / 2) + 'px) scale(' + scale + ')';
    document.body.style.height = vh + 'px';
  }
  fit();
  window.addEventListener('resize', fit);
  // Les polices arrivent après le premier rendu et changent les
  // hauteurs : on recalcule une fois qu'elles sont prêtes.
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  window.addEventListener('load', fit);
})();
<\/script>
</body></html>`;
}
function buildGbizPreviewDoc(css, pageHtml, spaceScale){
  const RENDER_W = 612;
  const pageHeightPx = Math.floor(RENDER_W*GBIZ_PAGE_RATIO);
  return buildPreviewSlideDoc(css, pageHtml, spaceScale, RENDER_W, pageHeightPx);
}
// Remplit chaque iframe des carrousels (Google Business + Impression)
// avec sa page — appelé une fois au rendu (voir les hooks setTimeout
// après renderAdminSection / toggleAdminSection), pas besoin de le
// refaire au balayage puisque toutes les pages sont déjà présentes,
// juste côte à côte.

}
function initPdfCarouselFrames(){

  const pageH = isA5 ? 794 : 1123;

function buildInstaPreviewDoc(css, pageHtml, spaceScale){
  const pageHeightPx = Math.round(INSTA_RENDER_W*INSTA_RATIO);
  return buildPreviewSlideDoc(css, pageHtml, spaceScale, INSTA_RENDER_W, pageHeightPx);

// Aperçu statique par formule — un seul aperçu (format Story) juste
// au-dessus des boutons d'export, pas un carrousel (une formule ne
// produit jamais qu'une seule page). Pas de mise à jour en direct à
// chaque frappe (uniquement au chargement/après une action qui
// re-rend la section) — suffisant pour se faire une idée avant
// d'exporter.
// Aperçu statique par formule — les 3 formats (A4/Story/Post) côte à
// côte dans un carrousel qui se balaie, comme les autres aperçus
// d'Export du menu (une formule ne produisant jamais qu'une seule
// page, pas besoin de points de pagination). Pas de mise à jour en
// direct à chaque frappe (uniquement au chargement/après une action
// qui re-rend la section) — suffisant pour se faire une idée avant
// d'exporter.
// BUG FIX (curseurs et alignement lents) : chaque modification
// reconstruisait le srcdoc des TROIS aperçus, donc rechargeait trois
// documents complets — d'où la latence au clic et le glissement dur.
// Couleurs, tailles, alignement et casse ne changent que du CSS : on
// remplace la feuille de style à l'intérieur des iframes déjà
// chargées. Aucun rechargement, effet immédiat.
function formule_liveStyleUpdate(){
  let allLive = true;
  document.querySelectorAll('.formule-preview-frame').forEach(frame=>{
    const fid = frame.dataset.fid;
    const f = DATA.formules && DATA.formules.find(x=>x.id===fid);
    if(!f){ return; }
    let doc=null;
    try{ doc = frame.contentDocument; }catch(e){}
    const styleEl = doc && doc.getElementById('liveCss');
    const stage = doc && doc.getElementById('stage');
    if(!styleEl || !stage){ allLive = false; return; }
    const variant = frame.dataset.variant || 'story';
    const ratio = variant==='a4' ? INSTA_A4_RATIO : variant==='post' ? INSTA_POST_RATIO : INSTA_RATIO;
    const built = buildFormulePage(formule_buildCfg(f), ratio);
    styleEl.textContent = built.css;
    const sc = built.pages[0].spaceScale;
    stage.style.setProperty('--space-scale', (sc && sc!==1) ? sc : '');
  });
  // Une iframe pas encore chargée : on retombe sur la reconstruction.
  if(!allLive) initFormulePreviewFrames();
}
function initFormulePreviewFrames(){
  document.querySelectorAll('.formule-preview-frame').forEach(frame=>{
    const fid = frame.dataset.fid;
    const variant = frame.dataset.variant || 'story';
    const f = DATA.formules && DATA.formules.find(x=>x.id===fid);
    if(!f) return;
    const ratio = variant==='a4' ? INSTA_A4_RATIO : variant==='post' ? INSTA_POST_RATIO : INSTA_RATIO;
    const cfg = formule_buildCfg(f);
    const built = buildFormulePage(cfg, ratio);
    const pageH = Math.round(INSTA_RENDER_W*ratio);
    frame.srcdoc = buildPreviewSlideDoc(built.css, built.pages[0].html, built.pages[0].spaceScale, INSTA_RENDER_W, pageH);
  });
}
function initInstaCarouselFrames(){
  const container = document.getElementById('instaCarousel');
  if(!container) return;
  const cfg = { ...pdfCfg(), format:'insta' };
  const css = buildInstaCSS(cfg);
  const pages = buildInstaPages(cfg);
  container.querySelectorAll('.insta-slide-frame').forEach(frame=>{
    const idx = parseInt(frame.dataset.idx, 10);
    if(pages[idx]) frame.srcdoc = buildInstaPreviewDoc(css, pages[idx].html, pages[idx].spaceScale);
  });
}
// Met à jour le point actif pendant le balayage tactile (défilement
// natif — aucune flèche à gérer). Générique pour partager la même
// logique entre les trois carrousels (Google Business + Impression +
// Instagram).
function carouselOnScroll(containerId, slideClass, dotsId, dotClass){
  const container = document.getElementById(containerId);
  if(!container) return;
  const slides = container.querySelectorAll('.'+slideClass);
  if(!slides.length) return;
  const slideStep = slides[1] ? (slides[1].offsetLeft - slides[0].offsetLeft) : slides[0].offsetWidth;
  const idx = Math.max(0, Math.min(slides.length-1, Math.round(container.scrollLeft / slideStep)));
  document.querySelectorAll('#'+dotsId+' .'+dotClass).forEach((d,i)=>{
    d.style.width = i===idx?'7px':'6px'; d.style.height = i===idx?'7px':'6px'; d.style.background = i===idx?'#fff':'var(--ig-focus)';
  });
}
function gbizCarouselOnScroll(){ carouselOnScroll('gbizCarousel','gbiz-slide','gbizCarouselDots','gbiz-carousel-dot'); }
function pdfCarouselOnScroll(){ carouselOnScroll('pdfCarousel','pdf-slide','pdfCarouselDots','pdf-carousel-dot'); }
function instaCarouselOnScroll(){ carouselOnScroll('instaCarousel','insta-slide','instaCarouselDots','insta-carousel-dot'); }

// Vignettes de chaque image Google Business à venir, avec pour chaque
// catégorie le choix de rejoindre la page précédente (espacement
// compressé de 18% maximum) ou de repartir sur la suivante — pensé
// pour les cas où l'algorithme automatique coupe mal (un ou deux plats
// livrés seuls en bas d'une page).
function renderGbizPagePreview(){
  const cfg = { ...pdfCfg(), format:'gbiz' };
  const { pages, pullFailures } = paginateGbizPages(cfg);

  const rows = [];
  pages.forEach((p,i)=>{
    const tabIds = [...new Set([...p.html.matchAll(/data-tab-id="([^"]+)"/g)].map(m=>m[1]))];
    tabIds.forEach(tid=>{
      const tb = DATA.tabs.find(x=>x.id===tid);
      if(tb) rows.push({ pageIdx:i, tb });
    });
  });

  const btnStyle = (active) => `font-size:11px;padding:5px 9px;border-radius:6px;border:1px solid var(--ig-hairline);background:${active?'#3a3a3a':'var(--ig-card)'};color:${active?'#8ab4f8':'var(--ig-text-dim)'};cursor:pointer;font-family:Jost,sans-serif;white-space:nowrap`;

  // Façon Apple (App Store), sur desktop comme sur mobile : chaque
  // page prend la quasi-totalité de la largeur disponible, la suivante
  // dépasse juste assez pour inviter à balayer — pas de flèches.
  // scroll-snap-align fait s'aligner proprement. Les points en bas
  // (jamais de texte) indiquent le nombre de pages et la position
  // actuelle. Même composant sur les deux (juste plus grand sur
  // desktop, puisque le conteneur est plus large) — demande explicite
  // de Will : les grosses vignettes multiples sur desktop ne
  // permettaient pas de vraiment voir à quoi ressemble une page.
  const carouselPreview = `<div class="af" style="margin-top:14px">
    <div id="gbizCarousel" onscroll="gbizCarouselOnScroll()" style="display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding-bottom:4px">
      ${pages.map((p,i)=>`
        <div class="gbiz-slide" style="flex:0 0 92%;scroll-snap-align:start;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#fff">
          <iframe class="gbiz-slide-frame" data-idx="${i}" style="width:100%;aspect-ratio:1 / ${GBIZ_PAGE_RATIO};border:none;display:block;background:#fff"></iframe>
        </div>`).join('')}
    </div>
    <div id="gbizCarouselDots" style="display:flex;justify-content:center;gap:6px;margin-top:10px">
      ${pages.map((p,i)=>`<span class="gbiz-carousel-dot" data-idx="${i}" style="width:${i===0?7:6}px;height:${i===0?7:6}px;border-radius:50%;background:${i===0?'#fff':'var(--ig-focus)'}"></span>`).join('')}
    </div>
  </div>`;

  return `${carouselPreview}
    <div style="margin-top:4px">
      ${rows.map(({pageIdx,tb})=>`
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;background:var(--ig-card);border:none;border-radius:10px;margin-top:6px;flex-wrap:wrap">
          <div style="font-size:12.5px;font-family:Jost,sans-serif;color:var(--ig-accent)"><strong>${t(tb.label)}</strong></div>
          <div style="display:flex;gap:5px">
            ${pageIdx>0?`<button style="${btnStyle(!!tb.gbizPullPrevious)}" onclick="tb_setGbizPull('${tb.id}',${tb.gbizPullPrevious?'false':'true'})"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px;margin-right:5px"><path d="m14 6-6 6 6 6"/></svg>Page ${pageIdx}</button>`:''}
            ${pageIdx<pages.length-1?`<button style="${btnStyle(!!tb.pdfPageBreakBefore)}" onclick="tb_setPageBreak('${tb.id}',${tb.pdfPageBreakBefore?'false':'true'})">Page ${pageIdx+2}<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px;margin-left:5px"><path d="m10 6 6 6-6 6"/></svg></button>`:''}
          </div>
        </div>
        ${pullFailures.includes(tb.id)?`<div style="font-size:11px;color:#B31217;background:#fdecea;border:1px solid #f3c6c2;border-radius:6px;padding:6px 10px;margin-top:4px;font-family:Jost,sans-serif">⚠️ Impossible de faire rentrer "${t(tb.label)}" dans la page précédente sans dépasser 18% de compression — ça abîmerait la mise en page. Elle reste sur sa propre page.</div>`:''}
      `).join('')}
    </div>`;
}

async function publishToSupabase(silent){
  if(!supaSession){ showToast('⚠️ Connecte-toi pour publier'); renderAdminSection('__global'); return; }
  // NOTE: this used to target a second, redundant "Publier" button
  // (🚀, inside the collapsible "Connexion admin" section) — removed
  // since every admin tab already ends with its own adminSaveBar()
  // "Publier" button; the loading state now lives on that one instead.
  const btn=document.getElementById('mainPublishBtn');
  if(btn){ btn.textContent='⏳ Publication…'; btn.disabled=true; }
  try{
    // Deep-clone DATA so we publish a clean snapshot, same as before.
    const clean=JSON.parse(JSON.stringify(DATA));
    // Same oversized-payload guard as the old GitHub version — a menu
    // bloated with embedded base64 photos is still worth catching early
    // with a clear message rather than a cryptic network error.
    const MAX_PAYLOAD_MB = 20;
    const approxBytes=new TextEncoder().encode(JSON.stringify(clean)).length;
    if(approxBytes > MAX_PAYLOAD_MB*1024*1024){
      throw new Error('Menu trop volumineux ('+(approxBytes/1024/1024).toFixed(1)+' Mo) — remplacez certaines photos par des URLs externes au lieu d\'uploads pour réduire la taille');
    }
    // BUG FIX (architecture): the old GitHub version needed a fresh SHA
    // before every write, with retry-on-conflict logic (see pitfall
    // about SHA races). Postgres upsert handles create-or-update
    // atomically — no SHA, no conflict retries needed at all.
    const { error }=await supabaseClient
      .from('menu_data')
      .upsert({ client_slug: CLIENT_SLUG, data: clean, updated_at: new Date().toISOString() }, { onConflict: 'client_slug' });
    if(error) throw error;
    // Plus de toast de succès : la publication est déclenchée très
    // souvent (chaque suppression, réordonnancement, etc.) et le
    // bandeau finissait par apparaître en permanence. Seules les
    // erreurs sont signalées.
  }catch(e){
    console.error('Publish error:',e);
    showToast('❌ '+e.message);
  }finally{
    if(btn){ btn.textContent='Publier'; btn.disabled=false; }
  }
}

// BUG FIX: these four functions used to read/write
// localStorage.getItem/setItem('restaurant_name' / 'restaurant_logo')
// directly — completely disconnected from DATA.restaurantName /
// DATA.restaurantLogo, which are the fields actually restored from and
// published to menu.json (see loadFromGitHub()). That meant a name or
// logo set in the admin only ever lived in that one browser's
// localStorage: never published, never seen by a real customer, and
// silently reverting to a hardcoded fallback for anyone else — including
// the same admin in a different browser or incognito window. This is
// also why the name could appear in different casing between "admin"
// and "public": they were really two entirely separate values, not a
// styling difference.
function getRestaurantName(){ return DATA.restaurantName||'Mon Restaurant'; }
function getRestaurantLogo(){ return DATA.restaurantLogo||''; }
function setRestaurantName(v){ DATA.restaurantName=v; applyRestaurantBranding(); }
function setRestaurantLogo(v){ DATA.restaurantLogo=v; applyRestaurantBranding(); }
function applyRestaurantBranding(){
  applyBrandColors();
  // BUG FIX: setRestoFont() only ever set this CSS var live, in-session,
  // when the admin dropdown fired onchange. Nothing re-applied it from
  // DATA.restoFont on a fresh load, so the font change appeared to "work"
  // only in that same browser tab and was lost on any other device/reload
  // even though DATA.restoFont was saved correctly. Re-apply it here since
  // this runs on every renderAll() and at init.
  if(DATA.restoFont) document.documentElement.style.setProperty('--restoFont', "'"+DATA.restoFont+"'");
  // BUG FIX (part 2): setting the CSS var alone means nothing if a
  // regular visitor's browser never actually downloaded that font's
  // file — only the admin's own tab did, at the moment they picked it
  // (see setRestoFont/setCoverHeadlineFont). Anyone else just silently
  // fell back to a generic font. Load both chosen fonts here too, on
  // every visit, not only when explicitly picked in this session.
  [DATA.restoFont, DATA.homeCover&&DATA.homeCover.headlineFont].forEach(font=>{
    if(font && !document.querySelector('link[data-font="'+font+'"]')){
      const l=document.createElement('link');
      l.rel='stylesheet';
      l.dataset.font=font;
      l.href='https://fonts.googleapis.com/css2?family='+encodeURIComponent(font)+':wght@400;700&display=swap';
      document.head.appendChild(l);
    }
  });
  const name=getRestaurantName();
  const logo=getRestaurantLogo();
  const logoEl=document.querySelector('.logo-img');
  const textEl=document.getElementById('logoText');
  // Logo takes over from the styled text the moment one is uploaded —
  // text is only the fallback for restaurants that haven't set a logo
  // yet. (Previously this always showed text and never the logo here;
  // the logo only ever appeared in PDF/social exports.)
  if(logo){
    if(logoEl){ logoEl.src=logo; logoEl.style.display='block'; }
    if(textEl) textEl.style.display='none';
  } else {
    if(logoEl) logoEl.style.display='none';
    if(textEl){ textEl.style.display='block'; textEl.textContent=name||'Mon Restaurant'; }
  }
  document.title=(name||'Menu')+' — Menu';
}

function renderBrandColorsSection(){
  const bc=DATA.brandColors||{primary:'#10285E',accent:'#C6A24A',bg:'#F7F5F0'};
  const defaults={primary:'#10285E',accent:'#C6A24A',bg:'#F7F5F0',tabInactive:'#B3B3B3'};
  // Une ligne par couleur, avec sous son nom les éléments qu'elle
  // touche réellement : "couleur principale" ne dit pas ce qui change.
  const rows=[
    {key:'primary', label:'Couleur principale', hint:'Bandeau, noms des plats, boutons'},
    {key:'accent', label:'Couleur secondaire', hint:'Prix'},
    {key:'bg', label:"Couleur d'arrière-plan", hint:''},
    {key:'tabInactive', label:'Couleur des onglets', hint:''}
  ];
  // Le choix « bandeau coloré ou fond clair » vit dans
  // « Présentation et affichage > Affichage », avec les autres
  // décisions de mise en page — pas ici, où l'on ne choisit que des
  // couleurs.
  let h='';
  h+='<div class="admin-section collapsible collapsed"><div class="admin-sect-title" onclick="toggleAdminSection(this)">Couleurs</div><div class="admin-sect-body">';
  h+='<div class="ig-list">';
  rows.forEach(r=>{
    const val=(bc[r.key]||defaults[r.key]).toUpperCase();
    h+='<div class="ig-row" style="cursor:default">'
      +'<span class="ig-row-label"><span>'+r.label+'</span>'
      +(r.hint?'<span class="ig-row-hint">'+r.hint+'</span>':'')
      +'</span>'
      +'<input type="color" class="ig-swatch" value="'+val+'" oninput="setBrandColor(&quot;'+r.key+'&quot;,this.value)" style="width:18px;height:18px;flex:none;border:none;border-radius:50%;padding:0;cursor:pointer">'
      +'</div>';
  });

// En-tête : « clair » (par défaut) ou « bandeau coloré ». Un seul
// réglage — tout ce qui est SOUS l'en-tête est rigoureusement
// identique dans les deux cas, ce n'est pas deux designs mais une
// bascule. Pilote aussi la barre de statut (encoche iPhone), qui doit
// toujours prendre la couleur réellement affichée en haut de page.
// Le bandeau colore n'est plus une option (voir la section
// Affichage) : il est systematique. La fonction reste en place
// pour ses appelants, et une ancienne valeur 'light' enregistree
// chez un client n'a plus d'effet.
function headerStyle(){ return 'band'; }
function applyHeaderStyle(){
  const band = headerStyle()==='band';
  document.body.classList.toggle('hdr-band', band);
  document.body.classList.toggle('hdr-light', !band);
}

// Fond de la vue plein écran : la couleur du restaurant, assombrie,
// plutôt qu'un noir neutre. C'est le plus grand aplat de sa couleur de
// tout le site, et il arrive pile au moment où le client désire le plat.
function darkenHex(hex, amount){
  const m=/^#?([0-9a-f]{6})$/i.exec((hex||'').trim());
  if(!m) return '#0B1A3D';
  const n=parseInt(m[1],16);
  const f=v=>Math.max(0, Math.round(v*(1-amount)));
  return '#'+[f(n>>16&255), f(n>>8&255), f(n&255)].map(v=>v.toString(16).padStart(2,'0')).join('');
}

function applyBrandColors(){
  const bc=DATA.brandColors||{};
  const root=document.documentElement;
  applyHeaderStyle();
  root.style.setProperty('--lbBg', darkenHex(bc.primary||getComputedStyle(root).getPropertyValue('--navy').trim()||'#10285E', 0.3));
  if(bc.primary) root.style.setProperty('--navy',bc.primary);
  if(bc.accent)  root.style.setProperty('--gold',bc.accent);
  if(bc.bg)      root.style.setProperty('--bg',bc.bg);
  if(bc.tabInactive) root.style.setProperty('--tabInactiveColor',bc.tabInactive);
  // Keep the browser/status-bar tint (iOS/Android) in sync with the header
  // color so it never falls back to showing --bg above the header. Read
  // the resolved --navy value (not just bc.primary) so this also self-heals
  // if --navy was set some other way.
  const themeMeta=document.getElementById('themeColorMeta');
  // BUG FIX : appelée à chaque rendu, cette fonction réimposait la
  // couleur de marque du site à la barre de statut, y compris pendant
  // qu'on est dans le panneau admin — qui doit garder le fond de son
  // thème clair ou sombre, sans exception.
  const panel=document.getElementById('adminPanel');
  const adminOpen=!!(panel && panel.classList.contains('open') && panel.classList.contains('ig-dark-panel'));
  if(themeMeta && !adminOpen){
    // En-tête clair : le haut de page est le fond crème, donc la barre
    // de statut doit l'être aussi — sinon on garde une bande navy
    // au-dessus d'un en-tête crème.
    const top = headerStyle()==='band'
      ? (bc.primary||getComputedStyle(root).getPropertyValue('--navy').trim())
      : (bc.bg||getComputedStyle(root).getPropertyValue('--bg').trim());
    if(top) themeMeta.setAttribute('content',top);
  }
  if(adminOpen) syncAdminStatusBar();
}

// Shared list of selectable Google Fonts — used by both the dropdown
// and the "view all fonts" gallery below, so there's only one place to
// add/remove a font. Trimmed the most generic/overlapping sans-serifs
// (many look near-identical at a glance) in favor of more distinctive,
// characterful options — scripts, display faces, slab serifs — so the
// gallery is actually useful for telling fonts apart quickly.
const FONT_LIST = ["Jost", "Montserrat", "Oswald", "Raleway", "Poppins", "Merriweather", "Playfair Display", "Libre Baskerville", "Josefin Sans", "Quicksand", "Inter", "Cormorant Garamond", "EB Garamond", "Spectral", "Source Serif Pro", "Bitter", "Dancing Script", "Pacifico", "Lobster", "Satisfy", "Abril Fatface", "Bebas Neue", "Anton", "Righteous", "Cinzel", "Teko", "Fraunces", "DM Serif Display", "Prata", "Marcellus", "Bodoni Moda", "Yeseva One", "Italiana", "Cinzel Decorative", "Great Vibes", "Tangerine", "Sacramento", "Yellowtail", "Grand Hotel", "Kaushan Script", "Caveat", "Amatic SC", "Permanent Marker", "Fredoka", "Comfortaa", "Baloo 2", "Alfa Slab One", "Passion One", "Bungee", "Monoton", "Fjalla One"];
// Picking a font from a native <select> means comparing them one at a
// time from memory — hard to judge 50 options that way. This opens a
// popup that loads every font at once and shows the restaurant's own
// name (or "Restaurant" as a fallback) set in each of them side by
// side, so they can actually be compared at a glance.
// Les polices de la galerie n'étaient chargées qu'à l'ouverture de
// celle-ci. Résultat : dans "Menus spéciaux et formules", le nom de la
// police choisie s'affichait avec la police de repli tant qu'on
// n'avait pas ouvert la galerie au moins une fois. On sort le
// chargement pour pouvoir le déclencher aussi au rendu de la page.
function ensureGalleryFontsLoaded(){
  if(document.querySelector('link[data-font-gallery]')) return;
  const all=[...new Set([...FONT_LIST, ...INSTA_FONT_OPTIONS])];
  const l=document.createElement('link');
  l.rel='stylesheet';
  l.dataset.fontGallery='1';
  l.href='https://fonts.googleapis.com/css2?'+all.map(f=>'family='+f.replace(/ /g,'+')+':wght@400;700').join('&')+'&display=swap';
  document.head.appendChild(l);
}
function showFontGallery(target, fid){
  target=target||'resto';
  // Google Fonts supports combining every family into one request —
  // load them all in a single <link> rather than 50 separate ones.
  // BUG FIX : le lien Google Fonts ne chargeait toujours que FONT_LIST
  // (la liste des 50 générales) — pour les Menus et Formules, qui
  // utilisent INSTA_FONT_OPTIONS (avec les nouvelles condensées),
  // certaines polices n'étaient donc jamais réellement chargées,
  // affichées avec la police de repli du navigateur dans l'aperçu.
  // On charge maintenant systématiquement l'union des deux, une
  // seule fois, quel que soit le contexte d'ouverture de la galerie.
  ensureGalleryFontsLoaded();
  // Menus et Formules : liste réduite (celle déjà proposée pour
  // Instagram, pensée pour ce format précis) plutôt que les 50
  // polices générales — mais même principe d'aperçu en direct.
  const fontList = (target==='formule' || target==='insta') ? INSTA_FONT_OPTIONS : FONT_LIST;
  const sampleText = (DATA.restaurantName||'Restaurant');
  const rows = fontList.map(f=>{
    const onclick = target==='formule'
      ? `formule_setField('${fid}','instaFont','${f.replace(/'/g,"\\'")}');if(typeof initFormulePreviewFrames==='function')initFormulePreviewFrames();closeFontGallery();renderAdminSection('__global')`
      : target==='insta'
      ? `setPdfCfg('instaFont','${f.replace(/'/g,"\\'")}');closeFontGallery();renderAdminSection(adminCurrentTab)`
      : `${target==='cover' ? 'setCoverHeadlineFont' : 'setRestoFont'}('${f.replace(/'/g,"\\'")}');closeFontGallery()`;
    return `<div class="font-gallery-row" onclick="${onclick}">
    <div class="font-gallery-name">${(target==='formule'||target==='insta') ? instaFontLabel(f) : f}</div>
    <div class="font-gallery-sample" style="font-family:'${f}',serif!important">${escapeHtmlLocal(sampleText)}</div>
  </div>`;
  }).join('');
  const modal=document.createElement('div');
  modal.className='font-gallery-overlay';
  modal.id='fontGalleryOverlay';
  // Dark mode : réutilise le même marqueur que le panneau admin
  // (.ig-dark, posé sur #adminBody quand on est dans "Home") — cette
  // fenêtre s'ouvre ailleurs aussi (Formules, Export), qui ne sont pas
  // encore redessinés, donc on ne l'assombrit que dans ce contexte-là.
  const adminBodyEl = document.getElementById('adminBody');
  if(adminBodyEl && adminBodyEl.classList.contains('ig-dark')) modal.classList.add('ig-dark-modal');
  modal.innerHTML=`<div class="font-gallery-card">
    <div class="font-gallery-hdr"><span>Choisir une police</span><button type="button" class="lb-close" style="position:static;color:var(--text)" onclick="closeFontGallery()">✕</button></div>
    <div class="font-gallery-list">${rows}</div>
  </div>`;
  modal.addEventListener('click', e=>{ if(e.target===modal) closeFontGallery(); });
  document.body.appendChild(modal);
  document.body.style.overflow='hidden';
}
function closeFontGallery(){
  const el=document.getElementById('fontGalleryOverlay');

  document.body.style.overflow='';

  if(!zip||zip.length!==5) return;
  fetch('https://geo.api.gouv.fr/communes?codePostal='+zip+'&fields=nom&limit=1')
    .then(r=>r.json())
    .then(data=>{
      if(data&&data.length){

        if(cityEl) cityEl.value=data[0].nom;
        renderAll();
      }
    })
    .catch(()=>{}); // if no internet, user types manually
}

// sinon on force clair ou sombre. Mémorisé localement — c'est une
// préférence d'affichage propre à l'admin de cet appareil, pas une
// donnée du restaurant, donc rien à publier.
const ADMIN_THEME_KEY='adminTheme';
let adminTheme=(()=>{ try{ return localStorage.getItem(ADMIN_THEME_KEY)||'system'; }catch(e){ return 'system'; } })();
const ADMIN_THEME_LABELS={system:'Système',light:'Clair',dark:'Sombre'};
function resolvedAdminTheme(){
  if(adminTheme==='light'||adminTheme==='dark') return adminTheme;
  return (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
}

/* BUG FIX (le choix Clair/Sombre ne repondait plus sur desktop) :
   a partir de 641px, le site entier porte un html{zoom:1.1}.
   getBoundingClientRect() et innerWidth/innerHeight repondent en pixels
   ECRAN, deja multiplies par ce zoom, alors qu'une valeur ecrite dans
   style.left / style.top est relue dans l'espace de l'element, donc
   remultipliee par 1,1 au moment du rendu. Un menu calcule a 1212px se
   dessinait a 1334px, et un menu de 133px de haut en occupait 147 : il
   sortait de l'ecran par la droite et par le bas, invisible et donc
   inclicable. Sur mobile le zoom vaut 1 et rien ne se voyait.
   On mesure le facteur sur l'element lui-meme — aucune hypothese sur le
   navigateur ni sur le point de rupture — pour convertir dans un sens
   comme dans l'autre. */
function visualScaleOf(el){
  const r=el.getBoundingClientRect();
  const w=el.offsetWidth;
  if(!w||!r.width) return 1;
  const s=r.width/w;
  return (s>0.2&&s<5)?s:1;
}
function toggleThemeMenu(e){

  const m=document.getElementById('themeMenu');
  if(!m) return;
  if(m.classList.contains('open')){ closeThemeMenu(); return; }
  m.innerHTML=['system','light','dark'].map(k=>
    `<div class="ig-theme-opt" onclick="setAdminTheme('${k}')"><span class="ig-theme-check">${adminTheme===k?'✓':''}</span>${ADMIN_THEME_LABELS[k]}</div>`
  ).join('');
  // Placement adaptatif : le menu se centre sur la ligne et se recale
  // s'il dépasse un bord. On impose sa largeur au lieu de la mesurer :
  // lue juste après l'affichage, offsetWidth pouvait encore valoir 0,
  // et le menu partait alors vers la droite hors de l'écran.
  const W=210, pad=10;
  // BUG FIX (menu coupé à droite sur desktop) : .admin-panel porte un
  // transform pour son animation d'ouverture, ce qui en fait le
  // référentiel de tout position:fixed placé à l'intérieur. Les
  // coordonnées calculées en repère écran étaient donc appliquées
  // depuis le bord du panneau, et le menu partait hors cadre. On le
  // rattache au <body> avant de le positionner.
  if(m.parentElement!==document.body) document.body.appendChild(m);
  m.style.width=W+'px';
  m.classList.add('open');
  // Tout le calcul se fait en pixels ECRAN : on convertit donc la
  // largeur et la hauteur du menu, mesurees dans son propre espace.
  const z=visualScaleOf(m);
  const Wv=W*z;
  const row=e.currentTarget.getBoundingClientRect();
  const mh=(m.offsetHeight||150)*z;
  // On reste dans le panneau admin quand il est là : il est ancré à
  // droite sur desktop, donc le bord de l'écran n'est pas la limite
  // pertinente.
  const panel=document.getElementById('adminPanel');
  const box=(panel && panel.classList.contains('open')) ? panel.getBoundingClientRect() : {left:0,right:window.innerWidth};
  let top=row.top+row.height/2-mh/2;
  if(top+mh>window.innerHeight-pad) top=window.innerHeight-mh-pad;
  if(top<pad) top=pad;
  let left=row.right-Wv;
  const maxRight=Math.min(box.right, window.innerWidth)-pad;
  const minLeft=Math.max(box.left, 0)+pad;
  if(left+Wv>maxRight) left=maxRight-Wv;
  if(left<minLeft) left=minLeft;
  // Retour dans l'espace de l'element pour l'ecriture.
  m.style.top=(top/z)+'px';
  m.style.left=(left/z)+'px';
  m.style.right='auto';
  setTimeout(()=>document.addEventListener('click',closeThemeMenu,{once:true}),0);
}

function adminCrumbParts(row){
  // Page d'accueil : un niveau de sous-pages (logo/boutons, photo,
  // vidéo, diaporama) qui rendait sa propre barre de retour sous le
  // titre — deux lignes pour dire la même chose.

    if(!homeCoverSubpage) return null;
    const sub=HOME_COVER_ROW_LABELS[homeCoverSubpage];
    return [
      {label:row.label, go:'closeHomeCoverRow()'},
      {label:sub||''}
    ];
  }
  // Menus et formules : la page d'une formule rendait sa propre barre
  // de retour ; elle passe maintenant par le fil d'Ariane, comme le
  // reste.
  if(row.key==='formules'){
    if(!formuleOpen) return null;
    const f=(DATA.formules||[]).find(x=>x.id===formuleOpen);
    const parts=[{label:row.label, go:'closeFormule()'}];
    if(!f) return parts;
    const PANE_LABELS={perso:'Majuscules et minuscules'};
    if(formuleCatOpen){
      const cat=(f.tabs||[]).find(c=>c.id===formuleCatOpen);
      parts.push({label:f.name||'(sans nom)', go:'closeFormuleCat()'});
      parts.push({label:(cat&&t(cat.label))||'Section'});
    } else if(formulePane){
      parts.push({label:f.name||'(sans nom)', go:'closeFormulePane()'});
      parts.push({label:PANE_LABELS[formulePane]||''});
    } else {
      parts.push({label:f.name||'(sans nom)'});
    }
    return parts;
  }
  const tab=DATA.tabs.find(tb=>tb.id===row.key);
  if(!tab) return null;
  const id=tab.id;
  const ci=tabSectionOpen[id];
  const card=(ci!=null)?tab.cards[ci]:null;
  const inlineCi=soloUntitledCardIndex(tab);
  const dishOpen=dishDetailOpen[id]!=null;
  const bevOpen=bevDetailOpen[id]!=null;
  const parts=[{label:t(tab.label)||'Catégorie', go:`closeDishDetail('${id}');closeBevDetail('${id}');closeTabSection('${id}')`}];
  const secLabel=card?(t(card.label)||'').trim():'';
  if(secLabel) parts.push({label:secLabel, go:`closeDishDetail('${id}');closeBevDetail('${id}')`});
  if(card && card.type==='bevs' && bevOpen) parts.push({label:'Boisson'});
  else if(dishOpen && (card||inlineCi!=null)) parts.push({label:'Plat'});

}

      <label class="ig-inline-upload-icon" title="Uploader une image"><input type="file" accept="image/*" style="display:none" onchange="uploadImgFile(this,${9/16})"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M18.22,20.75H5.78A2.64,2.64,0,0,1,3.25,18V15a.75.75,0,0,1,1.5,0v3a1.16,1.16,0,0,0,1,1.25H18.22a1.16,1.16,0,0,0,1-1.25V15a.75.75,0,0,1,1.5,0v3A2.64,2.64,0,0,1,18.22,20.75Z"/><path d="M16,8.75a.74.74,0,0,1-.53-.22L12,5.06,8.53,8.53A.75.75,0,0,1,7.47,7.47l4-4a.75.75,0,0,1,1.06,0l4,4a.75.75,0,0,1,0,1.06A.74.74,0,0,1,16,8.75Z"/><path d="M12,15.75a.76.76,0,0,1-.75-.75V4a.75.75,0,0,1,1.5,0V15A.76.76,0,0,1,12,15.75Z"/></svg></label>
    </div>`;

function syncImgPreview(input){
  const wrap = input.closest('.ai-img-wrap');
  if(!wrap) return;
  const preview = wrap.parentElement.querySelector('.ai-img-preview');
  if(!preview) return;
  const v = input.value.trim();
  if(v){ preview.src = v; preview.style.display = 'block'; }
  else { preview.style.display = 'none'; }
}

// Shared guard: warns instead of silently bloating menu.json (and eventually breaking
// GitHub publish) when someone uploads a very large photo. Images end up embedded as
// base64 directly inside menu.json, so size adds up fast across dishes/galleries.
// BUG FIX / FEATURE: photos used to be stored exactly as uploaded (any
// size, any format) — a raw smartphone photo (often 5-15 Mo) got
// embedded as-is into DATA, which gets published straight into
// Supabase's menu_data column. That bloats every page load (every
// visitor downloads every photo, full size, regardless of the tiny
// thumbnail it's actually displayed at) and eats storage. Every upload
// now goes through automatic compression instead: cropped to the right
// ratio for its context, resized to a sane display size, and
// re-encoded as WEBP — all in the browser, before it ever gets stored.
// No manual "please compress your photo first" step needed anymore.
const MAX_RAW_UPLOAD_BYTES = 25*1024*1024; // 25 Mo — just a sanity cap on the *source* file (before compression), not the stored result
function compressImageFile(file, {ratio=null, maxDim=1000, quality=0.8}={}){
  return new Promise((resolve, reject) => {
    if(!file) return reject(new Error('Aucun fichier'));
    if(file.size > MAX_RAW_UPLOAD_BYTES){
      reject(new Error('Fichier trop lourd ('+Math.round(file.size/1024/1024)+' Mo) — 25 Mo max en entrée'));
      return;
    }
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Erreur de lecture du fichier'));
    reader.onload = e => {
      const img = new Image();
      img.onerror = () => reject(new Error('Image illisible'));
      img.onload = () => {
        // 1. Crop to the target ratio (e.g. 1:1 for dishes, 9:16 for
        // social photos) — "cover" style, centered. No ratio => keep the
        // photo's own proportions untouched (logos, decorative icons).
        let sx=0, sy=0, sw=img.width, sh=img.height;
        if(ratio){
          const target = ratio;
          const current = img.width / img.height;
          if(current > target){ sw = img.height*target; sx = (img.width-sw)/2; }
          else if(current < target){ sh = img.width/target; sy = (img.height-sh)/2; }
        }
        // 2. Resize down to a sane display size — never worth storing a
        // 4000px photo for a menu thumbnail or a story background.
        let outW = sw, outH = sh;
        if(Math.max(outW, outH) > maxDim){
          const scale = maxDim / Math.max(outW, outH);
          outW = Math.round(outW*scale); outH = Math.round(outH*scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = outW; canvas.height = outH;
        canvas.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, outW, outH);
        // 3. Re-encode as WEBP — ~25-35% lighter than JPEG at the same
        // visual quality.
        resolve(canvas.toDataURL('image/webp', quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
function readImageFileSafe(file, onOk, opts){
  if(!file) return;
  compressImageFile(file, opts).then(onOk).catch(e => showToast('⚠️ '+e.message));
}
function uploadImgFile(fileInput, ratio){
  const file = fileInput.files[0];
  readImageFileSafe(file, dataUrl => {
    const wrap = fileInput.closest('.ai-img-wrap');
    const inp = wrap && wrap.querySelector('.ai');
    if(!inp) return;
    inp.value = dataUrl;
    inp.dispatchEvent(new Event('input'));
  }, {ratio});
}

// BUG FIX: renderAll() used to run ONLY after loadFromGitHub() resolved.
// For a visitor with no saved token that's near-instant (loadFromGitHub
// returns immediately), but for the site owner's own browser (which has
// a token saved for publishing), it triggers a real network fetch first —
// so the page sat completely blank for that round trip, then the entire
// menu popped in all at once, reading as an unpleasant "reload flash".
// Render immediately from whatever DATA is already embedded in this
// page (always correct as of the last full deploy) so there's never a
// blank moment, then let the GitHub check reconcile in the background —
// this only visibly changes anything if newer edits were published from
// elsewhere since this file was last deployed.
applyRestaurantBranding();
renderAll();
// BUG FIX: the schedule popup (homepage badge AND the menu-list page's
// badge — both use this same widget, just with a different suffix)
// only ever closed if you clicked its own badge again. toggleSchedPopup
// stops the click from bubbling on the badge itself, but nothing closed
// it on an outside click — on mobile especially, that reads as "stuck
// open". One listener, closes any open popup whose badge wasn't the
// click target, covers every instance regardless of suffix.
document.addEventListener('click', function(e){
  document.querySelectorAll('.resto-popup.visible').forEach(function(p){
    const badge = p.closest('.resto-badge-inline');
    if (badge && !badge.contains(e.target)) p.classList.remove('visible');
  });
});
{ const dBtn=document.getElementById('calAdminBtnDesktop'); if(dBtn) dBtn.href=RESA_ADMIN_URL;
  const mBtn=document.getElementById('calAdminBtnMobile'); if(mBtn) mBtn.href=RESA_ADMIN_URL; }
// BUG FIX: the "Lecture / Modifier / Réglages" bar (.mode-links-bar) was
// never actually gated by admin status — its visibility was controlled
// purely by a responsive CSS media query (hidden on desktop, always
// shown on mobile), with no check anywhere for whether an admin session
// existed. That meant any regular visitor on a phone saw the admin
// controls, even in a fresh private/incognito window. Toggle a body
// class based on the real Supabase session, and require it in the CSS
// rule that reveals this bar on mobile (see .mode-links-bar in the
// stylesheet) — now it only ever appears for an actual admin.
//
// ARCHITECTURE NOTE: since the admin buttons only show once `is-admin`
// is set, and that now depends on an actual Supabase session (not a
// token you could just paste into an always-visible field), there needs
// to be a way to log in for the very first time. Same convention as the
// reservations admin sticky button: opening this page with `?admin=1`
// reveals the entry point regardless of session state, where a login
// form (email/password, same restaurant_admins account used for
// reservations) is presented. Once logged in, the session persists
// normally and the plain URL (no query param) is enough from then on.
(async function initAdminAccess(){
  const wantsAdminEntry = new URLSearchParams(location.search).get('admin')==='1';
  await checkAdminSession(); // sets supaSession + toggles is-admin if a session exists
  if(wantsAdminEntry) document.body.classList.add('admin-entry-visible');
})();
// BUG FIX: the reconciliation re-render below used to run unconditionally,
// even when the fetched data was byte-for-byte identical to what's already
// embedded (the common case, especially in the owner's own browser, which
// is the only one that ever runs this fetch at all). A full re-render
// recreates every DOM node — including every <img> — so even with no
// visible content change, images briefly flicker as they're torn down and
// recreated. Home/the first tab usually carries the largest photo, so
// that's exactly where this one-time blink was most visible. Only
// re-render now if the data genuinely differs.
// Le thème du panneau admin est posé dès le départ pour que les
// jetons soient définis avant tout rendu de l'admin, et pour suivre
// l'appareil en mode "Système".
applyAdminTheme();
if(window.matchMedia){
  try{
    window.matchMedia('(prefers-color-scheme: light)').addEventListener('change',()=>{
      if(adminTheme==='system') applyAdminTheme();
    });
  }catch(e){}
}
