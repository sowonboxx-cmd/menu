<!DOCTYPE html>
<html lang="fr">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans+Condensed:wght@300;700&family=Lovelo:wght@400;700&family=Open+Sans:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" id="themeColorMeta" content="#10285E">
<title>Menu</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Jost:wght@300;400;500&family=Open+Sans:wght@300;400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
/* NOTE: the viewport meta tag already sets user-scalable=no, but modern
   iOS Safari ignores that for accessibility reasons and allows pinch-zoom
   regardless — there's no way to fully block that on iOS anymore. This at
   least prevents the double-tap-to-zoom gesture everywhere, which does
   still work on all browsers. */
html,body{touch-action:manipulation}
/* Whole site scaled up 10% — everything (text, spacing, icons) grows
   proportionally together, rather than bumping just a base font-size
   which would leave fixed-px elements (icons, some paddings) behind.
   Desktop only — on mobile this made everything feel too large/zoomed
   in on an already-small screen, so it's scoped to bigger viewports. */
@media(min-width:641px){ html{zoom:1.1} }
:root{--restoFont:'Cormorant Garamond';--navy:#10285E;--gold:#C6A24A;--bg:#F4F0EA;--white:#fff;--border:rgba(0,0,0,0.08);--text:#1a1a1a;--text2:#666;--text3:#aaa;--r:10px;--rs:6px;--subtitleColor:rgba(255,255,255,0.45);--tabInactiveColor:rgba(255,255,255,0.4)}
body{background:var(--bg);font-family:'Jost',sans-serif;font-weight:400;font-size:14px}

/* ── LIGHTBOX ── */
/* Fiche plat : une CARTE posée sur un fond assombri, pas un plein
   écran. L'image touche exactement les bords arrondis de la carte —
   aucune bande de couleur autour d'elle — et seul le bas porte du
   texte. C'est ce qui donne l'impression d'immersion. On ferme en
   tapant n'importe où à côté. */
.lb{position:fixed;inset:0;background:rgba(0,0,0,.86);z-index:9100;display:none;align-items:center;justify-content:center;padding:18px}
.lb.open{display:flex}
.lb-card{position:relative;width:100%;max-width:440px;max-height:calc(100dvh - 36px);display:flex;flex-direction:column;background:var(--lbBg,#0B1A3D);border-radius:18px;overflow:hidden;margin:0}
.lb-cat-bar{position:relative;flex:none;display:flex;align-items:center;justify-content:center;padding:13px 6px 11px;background:var(--lbBg,#0B1A3D)}
.lb-top-spacer{display:none}
.lb-media{position:relative;flex:none;line-height:0}
.lb-info{padding:16px 22px 20px;display:flex;flex-direction:column;text-align:center}
.lb-text{display:flex;flex-direction:column;gap:6px}
.lb-head{display:flex;flex-direction:column;align-items:center;gap:4px}
.lb-dish-price{font-family:'Open Sans',sans-serif;font-size:17px;font-weight:500;color:#fff;white-space:nowrap}
.lb-dots{padding:0 20px 18px;display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap}
.lb-dot{width:5px;height:5px;border-radius:999px;background:rgba(255,255,255,.3);transition:width .18s}
.lb-dot.on{width:18px;background:rgba(255,255,255,.85)}
.lb-zone{position:absolute;top:0;bottom:0;width:38%;z-index:3;cursor:pointer}
.lb-zone-left{left:0}
.lb-zone-right{right:0}
.lb img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;border-radius:0;background:rgba(255,255,255,.06)}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:none;border:none;color:#fff;width:44px;height:44px;cursor:pointer;font-size:28px;display:flex;align-items:center;justify-content:center;text-shadow:0 1px 6px rgba(0,0,0,0.6);transition:opacity .15s;z-index:2}
.lb-nav:hover{opacity:.75}
.lb-prev{left:10px}.lb-next{right:10px}
.lb-footer{background:none;padding:0}
.lb-cat-row{display:flex;align-items:center;justify-content:center;gap:10px;margin:0}
.lb-cat-line{flex:1;height:1px;background:rgba(255,255,255,0.85);max-width:40px}
.lb-cat-label{font-family:'Open Sans',sans-serif;font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#fff}
.lb-dish-name{font-family:'Open Sans',sans-serif;font-size:18px;color:#fff;font-weight:600;line-height:1.25;text-align:center;text-transform:uppercase;letter-spacing:.04em;margin-bottom:0}
.lb-dish-desc{font-size:13.5px;color:rgba(255,255,255,0.72);font-family:'Open Sans',sans-serif;font-weight:400;line-height:1.55;text-align:center;margin-bottom:0}
.lb-desc-probe{position:absolute;left:0;right:0;visibility:hidden;pointer-events:none;min-height:0!important}
.lb-footer-row{display:flex;align-items:center;justify-content:center}
/* Le compteur et la categorie demandaient tous deux du 600, mais pas
   dans la meme police : Jost n'est chargee qu'en 300/400/500, donc son
   600 etait un GRAS SYNTHETIQUE — un epaississement calcule par le
   navigateur, toujours plus lourd qu'un vrai demi-gras. C'etait donc le
   compteur qui etait anormalement epais, pas la categorie qui etait
   legere. Meme famille et meme graisse REELLE pour les deux, en Open
   Sans 600, et la barre redevient d'un seul bloc. */
.lb-count{position:absolute;left:14px;font-size:10px;font-weight:600;color:#fff;letter-spacing:.08em;font-family:'Open Sans',sans-serif;background:none;padding:0}
.lb-close{position:absolute;right:2px;top:50%;transform:translateY(-50%);background:none;border:none;color:#fff;font-size:19px;cursor:pointer;line-height:1;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:opacity .15s}
.font-gallery-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9600;display:flex;align-items:center;justify-content:center;padding:20px}
.font-gallery-card{background:#fff;border-radius:14px;width:min(560px,100%);max-height:85vh;display:flex;flex-direction:column;overflow:hidden}
.font-gallery-hdr{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);font-family:'Jost',sans-serif;font-weight:500;font-size:15px;color:var(--text)}
.font-gallery-list{overflow-y:auto;padding:6px 0}
.font-gallery-row{padding:12px 20px;cursor:pointer;border-bottom:1px solid rgba(0,0,0,.04);transition:background .1s}
.font-gallery-row:hover{background:#faf9f6}
.font-gallery-name{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);font-family:'Jost',sans-serif;margin-bottom:3px}
.font-gallery-sample{font-size:22px;color:var(--text);line-height:1.2}
/* Dark mode — uniquement quand ouverte depuis une partie déjà
   redessinée (voir showFontGallery, marqueur .ig-dark-modal). */
.font-gallery-overlay.ig-dark-modal .font-gallery-card{background:var(--ig-bg)}
.font-gallery-overlay.ig-dark-modal .font-gallery-hdr{border-bottom-color:var(--ig-border);color:var(--ig-text)}
.font-gallery-overlay.ig-dark-modal .font-gallery-hdr .lb-close{color:var(--ig-text)!important}
.font-gallery-overlay.ig-dark-modal .font-gallery-row{border-bottom-color:rgba(255,255,255,.08)}
.font-gallery-overlay.ig-dark-modal .font-gallery-row:hover{background:var(--ig-card)}
.font-gallery-overlay.ig-dark-modal .font-gallery-name{color:var(--ig-text-dimmer)}
.font-gallery-overlay.ig-dark-modal .font-gallery-sample{color:var(--ig-text)}
.lb-close:hover{opacity:1}

/* ── LAYOUT ── */
.page{background:var(--bg);min-height:100vh;padding-bottom:100px}
.container{max-width:680px;margin:0 auto;padding:0 16px}

/* ── HEADER ── */
.header{background:var(--navy);padding:14px 0 0}
.header .container{display:flex;flex-direction:column;align-items:center}
.header-top{width:100%;display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.header-top-left{display:flex;align-items:center;gap:6px}
/* Revenu à l'emplacement d'origine (à côté du logo, dans le flux
   normal du header) — la barre noire fixe en haut posait un problème
   de chevauchement avec le titre jamais résolu après plusieurs
   tentatives (position:fixed + marge compensatoire sur le menu).
   Plat/noir gardé pour les icônes, juste plus la position "barre
   séparée". */
.header-top-right{display:flex;align-items:center;gap:6px;visibility:hidden}
body.is-admin .header-top-right, body.admin-entry-visible .header-top-right{visibility:visible}

.lang-wrap{position:relative}
.lang-sel{display:flex;align-items:center;gap:3px;padding:5px 10px;border:1px solid rgba(255,255,255,0.2);border-radius:6px;cursor:pointer;background:var(--navy);color:rgba(255,255,255,0.85);font-size:11px;font-family:'Jost',sans-serif;font-weight:500;letter-spacing:.06em;user-select:none}
.lang-dd{position:absolute;left:0;top:calc(100% + 6px);background:#fff;border:1px solid rgba(0,0,0,0.1);border-radius:8px;overflow:hidden;z-index:400;display:none;min-width:140px;box-shadow:0 4px 20px rgba(0,0,0,0.15)}
.lang-dd.open{display:block}
.lang-opt{padding:9px 14px;font-size:12px;color:var(--text2);cursor:pointer;font-family:'Jost',sans-serif;white-space:nowrap;transition:background .1s}
.lang-opt:hover{background:var(--bg)}
.lang-opt.active{color:var(--navy);font-weight:500}
.admin-btn{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border:none;outline:none;box-shadow:none;-webkit-appearance:none;appearance:none;border-radius:6px;cursor:pointer;background:transparent;color:#fff;transition:background .15s;flex:none}
.admin-btn:hover{background:rgba(255,255,255,0.15)}
.mode-btn{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border:none;outline:none;box-shadow:none;-webkit-appearance:none;appearance:none;border-radius:6px;cursor:pointer;background:transparent;color:#fff;transition:all .15s;flex:none}
.mode-btn svg{width:15px;height:15px}
.mode-btn.active{opacity:1;background:rgba(255,255,255,0.15)}
/* edit popup */
.edit-pop{position:fixed;inset:0;z-index:9200;display:none;align-items:center;justify-content:center;background:rgba(16,40,94,0.55);padding:16px}
.edit-pop.open{display:flex}
.edit-pop-box{background:#fff;border-radius:14px;width:100%;max-width:680px;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
.edit-pop-hdr{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;border-radius:14px 14px 0 0;z-index:2}
.edit-pop-title{font-family:'Jost',sans-serif;font-size:17px;font-weight:600;letter-spacing:.01em;color:var(--navy)}
/* Une seule police dans toute la fiche de modification : le titre
   etait en Cormorant (la police « restaurant »), le reste en Jost.
   Deux polices dans une meme boite d'edition, ca se voit. */
.edit-pop, .edit-pop input, .edit-pop textarea, .edit-pop select, .edit-pop button{font-family:'Jost',sans-serif}
.edit-pop-close{width:30px;height:30px;border:none;background:var(--bg);border-radius:8px;cursor:pointer;font-size:16px;color:var(--text2);display:flex;align-items:center;justify-content:center}
.edit-pop-body{padding:18px 20px}
.edit-pop-foot{padding:14px 20px 18px;position:sticky;bottom:0;background:#fff;border-top:1px solid var(--border);border-radius:0 0 14px 14px}
.edit-save{width:100%;padding:13px;background:var(--navy);color:#fff;border:none;border-radius:10px;font-family:'Jost',sans-serif;font-size:14px;font-weight:500;letter-spacing:.03em;cursor:pointer}
.edit-save:active{transform:scale(0.99)}
.ef{margin-bottom:14px}
.el{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text2);font-family:'Jost',sans-serif;margin-bottom:5px}
.ei{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-family:'Jost',sans-serif;font-size:14px;color:var(--text);background:#fff}
.ei:focus{outline:none;border-color:var(--navy)}
textarea.ei{resize:vertical;min-height:70px;line-height:1.5}
.ei-check{display:flex;align-items:center;gap:9px;cursor:pointer;padding:4px 0}
.ei-check input{width:17px;height:17px;accent-color:var(--navy);flex:none}
.ei-check span{font-size:13px;font-family:'Jost',sans-serif;color:var(--text)}
.ei-badges{display:flex;gap:8px;flex-wrap:wrap}
.badge-toggle{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1.5px solid var(--border);border-radius:20px;background:#fff;font-family:'Jost',sans-serif;font-size:12.5px;color:var(--text2);cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent}
.badge-toggle .bt-emoji{font-size:15px;line-height:1}
.badge-toggle.on{border-color:var(--navy);background:rgba(16,40,94,0.07);color:var(--navy);font-weight:500}
.badge-toggle:active{transform:scale(0.97)}
.ef-acc{border:1px solid var(--border);border-radius:10px;margin-bottom:14px;overflow:hidden;background:#fbfbfa}
.ef-acc>summary{list-style:none;cursor:pointer;padding:12px 14px;font-family:'Jost',sans-serif;font-size:13px;font-weight:500;color:var(--text);display:flex;align-items:center;justify-content:space-between;user-select:none}
.ef-acc>summary::-webkit-details-marker{display:none}
.ef-acc>summary::after{content:'▾';font-size:14px;line-height:1;color:currentColor;transition:transform .2s;margin-left:8px;display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px}
.ef-acc[open]>summary::after{transform:rotate(180deg)}
.ef-acc .acc-body{padding:2px 14px 12px}
.ef-acc .acc-body .ef:first-child{margin-top:0}
.badge-emoji{font-size:15px;line-height:1;display:inline-block;vertical-align:middle;margin-right:2px}
.efrow{display:flex;gap:10px}
.efrow>.ef{flex:1}
/* edit-mode clickable blocks */
.edit-mode [data-edit],.edit-mode .edit-block{cursor:pointer;position:relative;transition:box-shadow .12s}
.edit-mode [data-edit]:hover,.edit-mode .edit-block:hover{box-shadow:0 0 0 2px var(--navy);border-radius:8px}
.edit-mode .dish-row[data-edit]:hover,.edit-mode .bev-row[data-edit]:hover{box-shadow:inset 0 0 0 2px var(--navy);border-radius:8px}
.admin-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.admin-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.logo-img{height:36px;max-width:180px;object-fit:contain;display:none}
.logo-text{font-family:var(--restoFont,'Cormorant Garamond'),serif;font-size:20px;font-weight:700;color:#fff;letter-spacing:.08em;white-space:nowrap;text-align:center}
.header-top{position:relative}
.logo-centered{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;display:flex;align-items:center;justify-content:center}
.header-sub{font-size:10px;font-weight:300;color:var(--subtitleColor,rgba(255,255,255,0.45));letter-spacing:.14em;text-transform:uppercase;margin-bottom:0;text-align:center}

/* ── STICKY NAV ── */
.sticky-header-group{position:sticky;top:0;z-index:99;background:var(--navy)}
.sticky-nav{position:relative}
.nav-bar{background:var(--navy);overflow-x:auto;scrollbar-width:none;display:flex;border-bottom:none;margin-bottom:0;-webkit-overflow-scrolling:touch}
.nav-bar::-webkit-scrollbar{display:none}
.nav-bar-inner{display:flex;margin:0 auto;padding:0 16px 0 16px;min-width:max-content;position:relative}
.nav-indicator{position:absolute;top:6px;bottom:6px;background:#fff;border-radius:var(--rs);pointer-events:none;transition:left .22s ease,width .22s ease;z-index:0}
.nav-tab{flex:none;padding:11px 14px 10px;font-size:11px;font-weight:500;font-family:'Jost',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--tabInactiveColor,rgba(255,255,255,0.4));cursor:pointer;white-space:nowrap;transition:all .2s;position:relative;z-index:1}
.nav-tab.active{color:var(--navy)}
.nav-tab.nav-tab-swiping{color:var(--navy)}
.view-bar{background:#fff;border-bottom:1px solid var(--border)}
.view-bar-inner{max-width:680px;margin:0 auto;padding:9px 16px;display:flex;align-items:center;justify-content:space-between}
.view-tab-label{font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);font-family:'Jost',sans-serif}
.view-btns{display:flex;gap:4px}
.header-reserve-btn{display:inline-flex;align-items:center;background:var(--navy);color:#fff;font-size:11px;font-weight:500;font-family:Jost,sans-serif;padding:5px 14px;border-radius:6px;text-decoration:none;white-space:nowrap;transition:opacity .15s}
.header-reserve-btn:hover{opacity:.85}
/* ═══ EN-TÊTE CLAIR — style par défaut ═══
   Le logo reste centré et seul sur sa ligne : c'est le moment de marque.
   Les horaires se placent juste en dessous, sur le MÊME axe, ce qui
   règle le décalage de l'ancienne bande blanche. Celle-ci disparaît
   complètement (horaires remontés, Réserver descendu en bas) : ~70px
   regagnés sur CHAQUE écran, exactement ce dont les grandes photos ont
   besoin. La couleur du restaurant ne vit plus dans un aplat mais en
   accent — logo, noms de plats, prix, filet de l'onglet actif, et le
   gros bouton Réserver. `body.hdr-band` rétablit le bandeau coloré
   pour les restaurants qui y tiennent (réglage Personnalisation). */
body.hdr-light .header{background:var(--bg);padding:4px 0 0}
body.hdr-light .logo-text{color:var(--navy);font-size:23px}
body.hdr-light .header-sub{color:var(--text2)}
body.hdr-light .nav-bar{background:var(--bg)}
body.hdr-light .nav-tab{color:#6B6559}
body.hdr-light .nav-tab.active,
body.hdr-light .nav-tab.nav-tab-swiping{color:var(--navy)}
/* Plus de pastille pleine derrière l'onglet actif : un simple filet.
   Une pastille remplie date immédiatement un design — l'état actif se
   lit au poids du texte et à ce trait, jamais à un bloc de couleur. */
body.hdr-light .nav-indicator{top:auto;bottom:0;height:2px;background:var(--gold);border-radius:2px}
body.hdr-light .view-bar{display:none}
/* Variante « bandeau coloré » : le logo seul sur l'aplat, la
   navigation redescend sur le crème — sans pastille pleine non plus. */
/* Le bandeau coloré s'arrête AU-DESSUS des onglets : il porte le logo
   et les horaires, rien de plus. Les onglets redescendent sur le crème,
   où l'onglet actif se signale par le filet de la couleur secondaire —
   jamais par une pastille pleine. */
body.hdr-band .header{padding:6px 0 8px}
body.hdr-band .nav-bar{background:var(--bg)}
body.hdr-band .nav-tab{color:#6B6559}
body.hdr-band .nav-tab.active,
body.hdr-band .nav-tab.nav-tab-swiping{color:var(--navy)}
body.hdr-band .nav-indicator{top:auto;bottom:0;height:2px;background:var(--gold);border-radius:2px}
body.hdr-band .view-bar{display:none}
.hdr-sched{display:flex;justify-content:center;padding:0 0 8px;margin-top:-2px}
.hdr-sched .sched-pin-frame{border:none;background:transparent;padding:4px 8px}
/* Le badge horaires heritait d'un 11px pose en ligne, trop petit
   par rapport au reste de la page. */
.hdr-sched .resto-badge-inline > span{font-size:12px!important}
/* En bandeau, le badge horaires est posé SUR la couleur : son texte
   et son épingle doivent passer en clair, sinon ils disparaissent. */
body.hdr-band .hdr-sched .resto-badge-inline > span{color:rgba(255,255,255,.82)!important}
body.hdr-band .hdr-sched .resto-badge-inline svg{color:rgba(255,255,255,.82)!important;fill:currentColor}
/* Réserver : une pastille flottante, présente en permanence sous le
   pouce. Grosse par le contraste, pas par la surface — une barre pleine
   largeur mange l'écran à chaque scroll et fait « appli de livraison ». */
/* La bande n'a plus de degrade : elle est opaque de son filet jusqu'en
   bas, donc le centre vu redevient le centre geometrique et les deux
   marges sont a nouveau egales — la compensation optique n'a plus lieu
   d'etre. Reste un point : sur un telephone a encoche, la bande est
   peinte jusqu'au bas de l'ecran, reserve comprise. Ajoutee entierement
   sous le bouton, elle le remonterait de sa moitie ; elle est donc
   repartie de part et d'autre, et le centrage tient avec encoche comme
   sans. */
.reserve-float{display:flex;align-items:center;justify-content:center;gap:10px;padding:calc(14px + env(safe-area-inset-bottom)/2) 0}
/* Raccourcis administrateur : jamais visibles pour un visiteur, et
   sur mobile uniquement — sur ordinateur, ils vivent déjà dans
   l'en-tête et rien ne change là-bas. Plat, mais bien détaché du
   fond crème pour rester repérable. */
.admin-quick{display:none;align-items:center;gap:6px}
.admin-quick .mode-link{width:40px;height:40px;padding:0;justify-content:center;background:none;color:var(--navy);opacity:1}
.admin-quick .mode-link:active{opacity:.5}
.admin-quick .mode-link svg{width:19px;height:19px}
/* 10% de moins sur toutes les dimensions : hauteur, corps du texte et
   marges laterales, pour que la pilule reste proportionnee. */
.reserve-pill{display:inline-flex;align-items:center;justify-content:center;height:36px;padding:0 23px;border-radius:999px;background:var(--navy);color:#fff;text-decoration:none;font-family:'Jost',sans-serif;font-size:11.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;transition:transform .15s}
.reserve-pill:active{transform:scale(.97)}
/* Sur ordinateur, personne ne va chercher un bouton flottant en bas :
   le reflexe est en haut a droite. Reserver y remonte donc, et les
   raccourcis administrateur passent a gauche — le logo garde sa place
   au centre et rien ne se chevauche. La barre du bas disparait. */
.reserve-desk{display:none}
@media(min-width:641px){
  .reserve-desk{display:inline-flex;align-items:center;justify-content:center;height:31px;padding:0 18px;border-radius:999px;background:var(--navy);color:#fff;text-decoration:none;font-family:'Jost',sans-serif;font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap;transition:opacity .15s}
  .reserve-desk:hover{opacity:.88}
  body.hdr-band .reserve-desk{background:#fff;color:var(--navy)}
  /* Les deux cotes etaient centres sur la seule ligne du logo, alors
     que le bloc d'en-tete descend jusqu'aux horaires : ils paraissaient
     donc trop hauts. On les sort du flux et on les centre sur la
     hauteur reelle de l'en-tete. Le logo, seul enfant restant, se
     recentre de lui-meme et ne bouge pas selon qu'on soit visiteur ou
     administrateur. */
  .header .container{position:relative}
  /* .header-top porte un position:relative : c'est donc LUI qui servait
     d'ancrage, et les deux cotes se calaient sur la seule ligne du logo,
     tout en haut. On le repasse en statique pour que l'ancrage devienne
     le bloc d'en-tete complet, horaires comprises. Sa hauteur minimale
     compense les deux elements qui ont quitte le flux, sinon la barre se
     tasse et le logo vient toucher les horaires. */
  /* La hauteur minimale vaut exactement celle du bouton, c'est-a-dire ce
     que les deux cotes apportaient quand ils etaient encore dans le
     flux : l'en-tete garde donc rigoureusement sa hauteur d'avant, sans
     espace ajoute en haut. */
  .header-top{position:static;justify-content:center;min-height:31px}
  /* Le logo etait cale sur .header-top par un top:50%. En passant celui-ci
     en statique, son ancrage est devenu le bloc d'en-tete entier, horaires
     comprises : il se centrait donc sur les DEUX lignes et descendait sur
     « Ouvre a 17h ». On le remet simplement dans le flux — .header-top est
     deja en justify-content:center, il se centre donc tout seul — et il
     redonne sa hauteur a la barre, comme avant. */
  .logo-centered{position:static;left:auto;top:auto;transform:none;pointer-events:auto}
  .header-top-left,
  .header-top-right{position:absolute;top:50%;transform:translateY(-50%);margin:0}
  .header-top-right{left:16px}
  .header-top-left{right:16px}
  .sticky-reserve{display:none}
  .page{padding-bottom:32px}
}
/* ═══ BANDEAU PHOTO EN TÊTE DE CATÉGORIE ═══
   Le 4:5 est invariant : bandeau, vignettes de liste et vue plein
   écran partagent le même cadrage. C'est aussi le format Instagram,
   donc une photo faite pour le menu est publiable telle quelle. */
.rail-wrap{margin:2px 0 20px}
/* Le titre du bandeau reprend EXACTEMENT le style des titres de
   section du site (.card-label) : même police Jost, même corps, même
   interlettrage. Un titre en serif ici introduisait une troisième
   police et cassait le système. L'étoile est alignée sur la ligne de
   base du texte, pas centrée sur la boîte — c'est ce décalage d'un ou
   deux pixels qui faisait « pas terrible ». */
.rail-hdr{display:flex;align-items:baseline;gap:6px;margin-bottom:11px}
.rail-star{color:var(--gold);font-size:10px;line-height:1}
.rail-title{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--navy);font-family:'Jost',sans-serif;line-height:1}
/* Marge négative + padding : le bandeau file jusqu'aux bords de
   l'écran et laisse dépasser la carte suivante — c'est ce dépassement
   qui dit « ça défile » sans aucune flèche ni indicateur. */
.rail{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-left:0;overscroll-behavior-x:contain;scrollbar-width:none;margin:0 -16px 0 0;padding:0 16px 2px 0}
.rail::-webkit-scrollbar{display:none}
/* Reactivite facon Apple : scroll-snap-stop garantit qu'une
   impulsion vive s'arrete NET sur la carte suivante au lieu de
   deriver mollement, et overscroll-behavior empeche le geste de
   partir dans la page. L'ancien -webkit-overflow-scrolling:touch,
   qui ajoutait une inertie flottante, est retire. */
.rail-card{flex:0 0 63%;max-width:280px;scroll-snap-align:start;scroll-snap-stop:always;cursor:pointer;position:relative}
.rail-img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:20px;display:block;background:#ece8e1;transition:opacity .15s}
.rail-card:active .rail-img{opacity:.85}
.rail-meta{display:flex;align-items:baseline;justify-content:center;gap:10px;margin-top:10px;padding:0 5%}
.rail-name{font-family:'Open Sans',sans-serif;font-size:12px;font-weight:600;color:var(--navy);line-height:1.3;text-align:center}
.rail-price{display:none;font-size:13px;font-weight:500;color:var(--navy);white-space:nowrap;flex:none}
.dish-star{color:var(--gold);font-size:11px;line-height:1;white-space:nowrap}
.rail-desc{display:none}
/* ═══ DESKTOP ═══
   Les incontournables passent EN BAS et en liste : en haut et en
   carrousel, ils feraient doublon avec la grille de photos juste en
   dessous. En bas, en liste compacte et dans leur propre bloc, ils
   redeviennent une recommandation qui se distingue au lieu de
   répéter ce qu'on vient de voir. */
@media (min-width:768px){
  .tab-content > .container{display:flex;flex-direction:column}
  /* Le bandeau remonte en tete sur desktop, mais « À propos » doit
     rester avant lui : c'est la presentation du restaurant. */
  .intro-card{order:-2;margin-bottom:18px}
  .rail-wrap{order:-1;background:#fff;border-radius:var(--r);padding:16px 18px 8px;margin:0 0 18px}
  .rail-hdr{margin-bottom:12px;padding-bottom:11px;border-bottom:1px solid rgba(198,162,74,.35)}
  .rail{flex-direction:column;gap:0;overflow:visible;margin:0;padding:0;scroll-snap-type:none}
  /* Sur desktop la vignette est petite : le 4:5 y perdrait son interet
     (on ne voit plus le plat, juste un timbre-poste etroit) alors que le
     carre remplit mieux la place et s'aligne sur la hauteur du texte. */
  /* La vignette occupe les deux rangees, donc la grille fait au moins sa
     hauteur ; sans align-content:start, l'espace restant se repartissait
     ENTRE le nom et la description et les decollait l'un de l'autre.
     Ici les rangees se tassent en haut et le vide part sous le texte. */
  /* BUG FIX (description decollee du nom) : en grille, la vignette qui
     occupait deux rangees faisait GRANDIR ces rangees, et l'espace
     supplementaire se glissait entre le nom et la description.
     align-content n'y pouvait rien : il ne repartit que l'espace libre
     du conteneur, pas celui absorbe par les rangees elles-memes. Le nom
     et la description vivent desormais dans un meme bloc, pose a cote
     de la vignette : plus aucune rangee ne peut s'intercaler. */
  .rail-card{flex:none;max-width:none;width:100%;display:flex;align-items:flex-start;gap:14px;padding:12px 0}
  /* Deux incontournables suffisent sur grand ecran : en liste, au-dessus
     de la grille, trois lignes commencent a peser. */
  .rail-card:nth-child(n+3){display:none}
  /* Le filet se pose ENTRE deux cartes, jamais sous la derniere : porte
     par la carte suivante, il n'existe que s'il y a quelque chose a
     separer. Un border-bottom sur chaque carte laissait un trait sous la
     seconde, qui ne separait plus rien puisqu'il n'y en a pas de
     troisieme. */
  .rail-card+.rail-card{border-top:1px solid var(--border)}
  .rail-img{width:72px;height:72px;aspect-ratio:auto;flex:none;border-radius:10px}
  .rail-text{flex:1;min-width:0}
  /* Pas de prix dans le bandeau : il est deja sur la meme ligne dans la
     carte juste en dessous, et le repeter transforme la mise en avant en
     ligne de tarif. Le nom reprend donc toute la largeur. */
  .rail-meta{margin-top:0;padding:0;justify-content:flex-start}
  .rail-name{font-size:15px;text-align:left}
  .rail-desc{display:block;font-family:'Open Sans',sans-serif;font-size:12.5px;font-weight:400;color:var(--text2);line-height:1.5;margin-top:2px}
}
/* TEST (Will) : la photo passe à GAUCHE et le texte à droite dans
   la liste. On inverse l'ordre visuel sans toucher au balisage, pour
   que l'ordre de lecture reste correct au clavier et au lecteur
   d'écran. */
.dish-row .img-wrap{order:-1}
.dish-top-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.dish-price-inline{font-size:13px;font-weight:500;color:var(--gold);white-space:nowrap;flex:none}
/* Bouton « incontournable » dans la fiche du plat (mode modification) */
.ef-pin{display:flex;align-items:center;gap:11px;width:100%;padding:11px 13px;margin-bottom:14px;border:1px solid var(--border);border-radius:10px;background:#fff;font-family:'Jost',sans-serif}
/* La ligne porte maintenant des boutons de rang a droite : l'etoile et
   son libelle deviennent donc un bouton A PART, un bouton ne pouvant
   pas en contenir d'autres. */
.ef-pin-main{display:flex;align-items:center;gap:11px;flex:1;min-width:0;padding:0;border:none;background:none;text-align:left;cursor:pointer;font-family:inherit;color:inherit}
.ef-pin-on{border-color:var(--gold);background:rgba(198,162,74,.08)}
.ef-pin-star{font-size:19px;line-height:1;color:var(--text3);flex:none}
.ef-pin-on .ef-pin-star{color:var(--gold)}
.ef-pin-text{display:flex;flex-direction:column;gap:2px;min-width:0}
.ef-pin-label{font-size:14px;font-weight:500;color:var(--text)}
.ef-pin-hint{font-size:11.5px;color:var(--text2)}
.view-btn{width:30px;height:30px;border:1px solid var(--border);border-radius:6px;cursor:pointer;background:#fff;color:var(--text3);display:flex;align-items:center;justify-content:center;transition:all .15s}
.sched-pin-frame{display:inline-flex;align-items:center;border:1px solid var(--border);border-radius:6px;background:#fff;padding:5px 10px}
.view-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.view-btn.active{background:var(--navy);border-color:var(--navy);color:#fff}
.view-btn.active svg{stroke:#fff}

/* ── CONTENT ── */
.tab-content{display:none;padding:18px 0}
.tab-content.active{display:block}
/* BUG FIX: this animation used to fire on EVERY tab switch (click or
   swipe), not just the true first page load, because renderTabs() fully
   recreates every .cards-stack/.dish-grid element on every renderAll()
   call — so each tab change replayed a 0→1 opacity fade, reading as an
   unpleasant flash. Content just appears normally now, with no fade. */
.dish-grid,.cards-stack{}
/* Grey placeholder + smooth fade-in for content photos (dish photos,
   hero, gallery) — scoped to #tabsContainer only so header/nav/admin
   icons are unaffected. Without this, a slow-loading photo either shows
   nothing or a broken-image icon until the network delivers it, which
   reads as the page "switching" from an empty state to the real menu. */
#tabsContainer img{background:#e8e8e8;opacity:0}
#tabsContainer img.img-loaded{opacity:1;transition:opacity .25s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.cards-stack{display:flex;flex-direction:column;gap:12px}

/* ── INTRO CARD ── */
.intro-card{background:#fff;border-radius:var(--r);padding:18px 20px}
.intro-card-label{font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);font-family:'Jost',sans-serif;margin-bottom:8px}
.intro-card-text{font-family:'Open Sans',sans-serif;font-size:12px;color:var(--text);line-height:1.7}
.social-icons{display:flex;gap:14px;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid rgba(0,0,0,0.06)}
.social-links-bar{display:flex;gap:0;align-items:center;justify-content:center;padding:6px 0 2px;flex-wrap:wrap}
.social-link-txt{font-size:10px;font-weight:600;letter-spacing:.14em;color:var(--text3);text-decoration:none;text-transform:uppercase;font-family:Jost,sans-serif;transition:color .15s}
.social-link-txt:hover{color:var(--navy)}
.social-link-sep{font-size:10px;color:var(--text3);padding:0 8px}
.social-icon{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;border:1px solid var(--border);color:var(--text3);text-decoration:none;transition:all .15s;font-size:13px}
.mode-links-bar{display:none;align-items:center;justify-content:center;gap:2px;margin-top:8px;padding:8px 4px;background:var(--navy);border-radius:10px}
.mode-link{display:flex;align-items:center;gap:5px;background:none;border:none;cursor:pointer;padding:2px 10px;font-family:Jost,sans-serif;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#fff;opacity:.45;transition:opacity .15s;text-decoration:none}
.mode-link svg{width:14px;height:14px;flex:none}
.mode-link.active{opacity:1}
.mode-link-sep{color:rgba(255,255,255,0.22);font-size:12px}
.social-icon:hover{border-color:var(--navy);color:var(--navy)}
.social-icon svg{width:14px;height:14px;fill:currentColor}

/* ── FEATURED ── */
.featured-card{background:#fff;border-radius:var(--r);border:1px solid var(--border);padding:16px}
.featured-label{font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);font-family:'Jost',sans-serif;margin-bottom:12px}
.featured-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.featured-item{border-radius:8px;overflow:hidden;border:1px solid var(--border)}
.featured-item-img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#ece8e1}
.featured-item-body{padding:8px 10px 10px}
.featured-item-name{font-family:'Open Sans',sans-serif;font-size:12px;font-weight:600;color:var(--navy);line-height:1.2}
.featured-item-price{font-size:11px;font-weight:500;color:var(--gold);margin-top:3px}
.featured-top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.featured-item-price-inline{font-size:10px;font-weight:500;color:var(--gold);white-space:nowrap;flex-shrink:0;margin-top:1px}

/* ── CARD ── */
.card{background:#fff;border-radius:var(--r)}
.card-hdr{padding:14px 16px 0;display:flex;align-items:center;justify-content:space-between}
.card-label{font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);font-family:'Jost',sans-serif}
.card-body{padding:14px 16px 16px}

/* ── DISH LIST ── */
.dish-row{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid rgba(0,0,0,0.05)}
.dish-row-clickable{cursor:pointer;transition:background .15s;border-radius:0;margin:0 -16px;padding-left:16px;padding-right:16px}
.dish-row-clickable:hover{background:rgba(16,40,94,0.03)}
.dish-row:first-child{padding-top:0}
.dish-row:last-child{border-bottom:none;padding-bottom:0}
/* Au survol, on ne veut QUE la bande : les filets de séparation
   juste au-dessus et juste en dessous s'effacent, sinon ils
   dessinent deux traits qui semblent déborder de la bande. */
.dish-row-clickable:hover{border-bottom-color:transparent}
.dish-row:has(+ .dish-row-clickable:hover){border-bottom-color:transparent}
.dish-text{flex:1;min-width:0}
.dish-name-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dish-name{font-family:'Open Sans',sans-serif;font-size:14px;font-weight:600;color:var(--navy);line-height:1.2}
.dish-badges{display:flex;gap:4px;align-items:center}
.badge-icon{width:18px;height:18px;object-fit:contain;display:inline-block}
.dish-desc{font-size:12px;font-family:'Open Sans',sans-serif;font-weight:400;color:var(--text2);line-height:1.55;margin-top:2px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.dish-price{font-size:13px;font-weight:500;color:var(--gold);margin-top:6px;white-space:nowrap;flex-shrink:0}
.dish-img{width:80px;height:80px;border-radius:8px;object-fit:cover;flex:none;background:#ece8e1;cursor:pointer;transition:opacity .15s}
.dish-img:hover{opacity:.82}

/* ── GRID ── */
.dish-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
/* Cartes de plats en vue grille : plus de bordure — le fond blanc sur
   le beige de la page suffit à les détacher, et sans le liseré la
   grille respire beaucoup mieux. */
.gc{background:#fff;border-radius:var(--r);overflow:hidden}
.gc[data-lbidx]{cursor:pointer}
.gc-img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#ece8e1;cursor:pointer;transition:opacity .15s}
.gc-img:hover{opacity:.82}
.gc-body{padding:10px 12px 12px}
.gc-name{font-family:'Open Sans',sans-serif;font-size:14px;font-weight:600;color:var(--navy);margin-bottom:2px;line-height:1.2}
.gc-desc{font-size:12px;font-family:'Open Sans',sans-serif;font-weight:400;color:var(--text2);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gc-price{font-size:12px;font-weight:500;color:var(--gold);margin-top:5px;white-space:nowrap;flex-shrink:0}
.gc-top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;margin-bottom:2px}
.gc-top-row .gc-name{margin-bottom:0}
.gc-price-inline{font-size:11px;font-weight:500;color:var(--gold);white-space:nowrap;flex-shrink:0;margin-top:1px}
@media(max-width:640px){.gc-name{font-size:12px!important;font-family:'Open Sans',sans-serif!important}.gc-desc{font-size:11px!important;font-family:'Open Sans',sans-serif!important}}

/* ── VARIANTS / BEV ── */
.variant-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(0,0,0,0.05)}
.variant-row:last-child{border-bottom:none;padding-bottom:0}
.variant-name{font-family:'Cormorant Garamond',serif;font-size:15px;font-weight:400;color:var(--text)}
.variant-price{font-size:12px;font-weight:500;color:var(--gold)}
.bev-row{display:flex;justify-content:space-between;align-items:flex-start;padding:10px 0;border-bottom:1px solid rgba(0,0,0,0.05);gap:10px}
.bev-row>div:first-child{min-width:0;flex:1}
.bev-desc{font-size:12px;font-family:'Open Sans',sans-serif;font-weight:400;color:var(--text2);line-height:1.5;margin-top:2px;max-width:340px}
.bev-sizes{font-size:12px;font-weight:400;color:var(--text2);font-family:'Jost',sans-serif;margin-top:2px}
.bev-row:last-child{border-bottom:none;padding-bottom:0}
.bev-name{font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:400;color:var(--text)}
.bev-price{font-size:12px;font-weight:500;color:var(--gold);white-space:nowrap;flex-shrink:0}
.tag{display:inline-block;font-size:10px;padding:2px 7px;border-radius:20px;border:1px solid rgba(198,162,74,0.35);color:var(--gold);margin-left:6px;vertical-align:middle;font-family:'Jost',sans-serif;letter-spacing:.04em}

/* ── SPECIALS BANNER (menu du jour/midi/soir) ── */
.special-banner{background:var(--navy);border-radius:var(--r);padding:16px 18px;margin-top:26px}
.special-banner-label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,0.45);font-family:'Jost',sans-serif;margin-bottom:4px;display:flex;align-items:center;justify-content:space-between}
.special-banner-title{font-family:'Open Sans',sans-serif;font-size:14px;font-weight:600;color:#fff;margin-bottom:6px}
.special-banner-text{font-size:12px;font-weight:400;font-family:'Open Sans',sans-serif;color:rgba(255,255,255,0.7);line-height:1.6}
.special-banner-price{font-size:15px;font-weight:500;color:var(--gold);margin-top:8px}

/* ── SOCIAL TEMPLATES ── */
.soc-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.soc-pos-btn{padding:6px 4px;font-size:10px;font-family:'Jost',sans-serif;border:1px solid var(--border);border-radius:4px;background:#fff;color:var(--text2);cursor:pointer;font-weight:500;min-width:40px}
.soc-pos-btn.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.soc-layout{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
.soc-left{flex:1;min-width:260px;display:flex;flex-direction:column;gap:0}
.soc-mini-section{margin-bottom:14px;padding:12px 14px;background:var(--bg);border-radius:8px;border:1px solid var(--border)}
.soc-mini-title{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:10px}
.soc-preview-wrap{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:16px}
.soc-canvas-wrap{flex:1;min-width:260px}
.soc-canvas-label{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin-bottom:6px;font-family:Jost,sans-serif}
.soc-frame{width:100%;border-radius:var(--r);overflow:hidden;border:1px solid var(--border);position:relative}
.soc-frame.ratio-1{aspect-ratio:1}
.soc-frame.ratio-916{aspect-ratio:9/16}

.home-photo{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:var(--r);display:block}
/* ── Page de couverture (plein écran, avant le site) ── */
/* ── Page de couverture (calque plein écran par-dessus le site déjà chargé) ── */
body.home-cover-showing{overflow:hidden}
.home-cover{position:fixed;inset:0;z-index:500;width:100%;height:100vh;height:100svh;height:100dvh;overflow:hidden;background:#0b0b0b;display:flex;flex-direction:column}
/* Cancels out the desktop-only 10% site-wide zoom (see html{zoom:1.1}
   below) specifically for this overlay, so its fixed 100vh sizing means
   exactly one real screen — without this, the zoomed rendering would
   push the CTAs below the fold, forcing a scroll the cover is meant to
   avoid entirely. */
@media(min-width:641px){ .home-cover{zoom:0.9090909} }
.home-cover-media{position:absolute;inset:0;width:100%;height:100%}
.home-cover-media img,.home-cover-media video{width:100%;height:100%;object-fit:cover;display:block}
/* Slideshow: 3 photos cross-fading, each with its own Ken Burns pan/
   zoom running continuously underneath (not just during its own
   crossfade window — the image keeps drifting the whole time it's
   loaded, the animation just isn't visible until that slide fades in). */
.home-cover-slideshow{position:absolute;inset:0;width:100%;height:100%;overflow:hidden}
.hcs-slide{position:absolute;inset:0;opacity:0;transition:opacity 1.4s ease}
.hcs-slide.hcs-active{opacity:1;z-index:1}
.hcs-kb{width:100%;height:100%;object-fit:cover;display:block;animation-duration:9s;animation-timing-function:ease-in-out;animation-iteration-count:infinite;animation-direction:alternate}
@keyframes hcsZoomIn{from{transform:scale(1)}to{transform:scale(1.18)}}
@keyframes hcsZoomOut{from{transform:scale(1.18)}to{transform:scale(1)}}
@keyframes hcsPanTop{from{transform:scale(1.15) translateY(4%)}to{transform:scale(1.15) translateY(-4%)}}
@keyframes hcsPanBottom{from{transform:scale(1.15) translateY(-4%)}to{transform:scale(1.15) translateY(4%)}}
@keyframes hcsPanLeft{from{transform:scale(1.15) translateX(4%)}to{transform:scale(1.3) translateX(-2%)}}
@keyframes hcsPanRight{from{transform:scale(1.15) translateX(-4%)}to{transform:scale(1.3) translateX(2%)}}
.hcs-kb-zoom-in{animation-name:hcsZoomIn}
.hcs-kb-zoom-out{animation-name:hcsZoomOut}
.hcs-kb-pan-top{animation-name:hcsPanTop}
.hcs-kb-pan-bottom{animation-name:hcsPanBottom}
.hcs-kb-pan-left{animation-name:hcsPanLeft}
.hcs-kb-pan-right{animation-name:hcsPanRight}
.home-cover-overlay{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.65) 0%,rgba(0,0,0,.15) 45%,rgba(0,0,0,.35) 100%)}
/* Name is NOT part of the fade group below — it stays put the whole
   time, so the handoff to the real header's own name (once the cover
