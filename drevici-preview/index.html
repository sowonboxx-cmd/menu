// Same Supabase project/keys as the reservation system (resa.html /
// admin.html) — and crucially the SAME restaurant_admins table, so one
// login works for both the menu editor and the reservations dashboard.
const SUPABASE_URL      = 'https://fdbzzkzfipzabryfanun.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_9PaqDuXnWV3aOCBPk9ImmQ_4YgYTU9n';
// Detect client slug from URL: /menu/drevici → 'drevici'
const _pathParts = window.location.pathname.replace(/\/+$/,'').replace(/^\/+/,'').split('/');
// Le suffixe "-preview" designe un dossier de recette (…/drevici-preview/)
// : meme code, meme base, mais une URL a part pour verifier une version
// avant de la publier. On le retire pour que la preview lise bien les
// donnees du vrai client au lieu d'en chercher un qui n'existe pas.
// Aucun deploiement reel ne se termine par "-preview".
const CLIENT_SLUG = (_pathParts[_pathParts.length - 1] || 'default').replace(/-preview$/, '');
// Reservations admin dashboard for this restaurant (admin.html) — a
// per-deployment value, since the reservation module lives in its own
// folder/slug (e.g. 'drevici-paris'), separate from this menu's own
// CLIENT_SLUG. Adjust per restaurant when reusing this template.
const RESA_ADMIN_URL = 'https://sowonboxx-cmd.github.io/menu/drevici/admin';

const supabaseClient = (SUPABASE_URL !== 'COLLE_ICI_SUPABASE_URL' && window.supabase)
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

// BUG FIX / ARCHITECTURE CHANGE: this used to be a GitHub personal
// access token stored in localStorage, checked synchronously everywhere
// via getToken(). Supabase Auth sessions are checked asynchronously, so
// `supaSession` is a module-level cache of the current session — set
// once at init (see checkAdminSession(), called right after the first
// render so it never delays or blanks the first paint) and refreshed on
// login/logout. Everywhere the old code did `if(!getToken())`, it now
// checks `!supaSession`.
let supaSession = null;
async function checkAdminSession(){
  if(!supabaseClient) return;
  const { data } = await supabaseClient.auth.getSession();
  supaSession = data.session || null;
  document.body.classList.toggle('is-admin', !!supaSession);
}
async function adminSignIn(email, password){
  if(!supabaseClient) return { error: { message: 'Configuration Supabase manquante' } };
  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if(!error){ supaSession = data.session; document.body.classList.add('is-admin'); }
  return { error };
}
async function adminSignOut(){
  if(supabaseClient) await supabaseClient.auth.signOut();
  supaSession = null;
  document.body.classList.remove('is-admin');
  openAdmin();
}

// ── Load the menu from Supabase (public read, no login needed) ──
async function loadFromSupabase(){
  if(!supabaseClient) return;
  try{
    const { data: row, error } = await supabaseClient
      .from('menu_data')
      .select('data')
      .eq('client_slug', CLIENT_SLUG)
      .maybeSingle();
    if(error) throw error;
    if(!row){ console.log('menu_data absent — premier lancement'); migrateTabIds(); migratePins(); return; }
    const json = row.data;
    // BUG FIX (architecture): the old GitHub version restored fields one
    // by one from a hand-maintained whitelist (see pitfall #16/#9) —
    // easy to forget a new field and have it silently fail to persist.
    // Since Supabase stores the whole DATA object as a single JSON blob
    // (exactly what publishToSupabase() writes), a straight merge covers
    // every field automatically, with no whitelist to maintain.
    Object.assign(DATA, json);
    if(Array.isArray(DATA.tabs) && DATA.tabs.length>0) DATA.tabs[0].isHome=true;
    if(Array.isArray(DATA.specials)) DATA.specials=DATA.specials.filter(s=>s.id!=='midi'&&s.id!=='soir');
    // The old "Accueil" tab (photo/video + pinned dishes) has been
    // retired — replaced by the full-screen "Page d'accueil" cover.
    // There's no more admin UI to manage it, so force it off regardless
    // of what an earlier session had saved, rather than silently
    // reviving a tab the person can no longer see or turn off.
    if(DATA.homeTab) DATA.homeTab.active=false;
    DATA.tabs=DATA.tabs.filter(t=>t.id!=='__home');
    // The "Page d'accueil" cover is now a mandatory default — there's no
    // more admin toggle for it, so force it on regardless of an earlier
    // session's saved value (e.g. from before this checkbox was removed).
    if(!DATA.homeCover) DATA.homeCover={};
    DATA.homeCover.active=true;
    migrateTabIds();
    migratePins();
    repairPins();
    { const hashTid=tabIdFromHash();
      currentTabId=(hashTid && DATA.tabs.some(tb=>tb.id===hashTid && tb.visible!==false)) ? hashTid : (DATA.tabs[0]?.id||'huitres');
    }
    migratePins();
    console.log('✓ Chargé depuis Supabase — tabs:'+DATA.tabs.length+', specials actifs:'+DATA.specials.filter(s=>s.active).length+', intro:'+DATA.intro.active);
  }catch(e){
    console.warn('Supabase load failed:', e.message);
    if(supaSession) showToast('⚠️ Chargement impossible : '+e.message+' — données locales affichées');
  }
}

function getScheduleSummary(){
  const sch = DATA.schedule||[];
  const open = sch.filter(d=>(d.services||[]).length>0||(d.open!=null));
  if(!open.length) return '';
  const names = open.map(d=>d.day.substring(0,3)).join(' · ');
  const firstSvc = (open[0].services||[])[0] || open[0];
  if(!firstSvc||firstSvc.open==null) return '';
  return `${names} · ${firstSvc.open}h – ${firstSvc.close>12?firstSvc.close-24||firstSvc.close:firstSvc.close}h`;
}

function socPickDish(val){
  if(!val){ socState.selectedDish=null; renderAdminSection('__social'); return; }
  try {
    const d = JSON.parse(decodeURIComponent(val));
    socState.selectedDish = d;
    socState.titre = d.name || '';
    socState.desc = d.desc || '';
    socState.caption = d.caption || '';

    const gallery = d.gallery ? d.gallery.filter(Boolean) : [];
    socState.photo = gallery[0] || d.img || '';
    socState.galleryIdx = 0;
    renderAdminSection('__social');
  } catch(e){}
}

function downloadSocImg(fmt){
  const s = socState;
  const prevFmt = s.format;
  s.format = fmt;

  const size = fmt==='story' ? {w:1080,h:1920} : {w:1080,h:1350};

  // Render at preview size (matches the visible frame) then scale up
  // Preview frame is ~800px wide max, we render at that width and scale to 1080
  const renderW = fmt==='story' ? 405 : 400; // 9:16 → 405×720, 1:1 → 400×400
  const renderH = fmt==='story' ? 720 : 400;
  const scaleF  = size.w / renderW; // ~2.7x → produces 1080px output

  const div = document.createElement('div');
  div.style.cssText = `position:fixed;left:-9999px;top:0;width:${renderW}px;height:${renderH}px;overflow:hidden;z-index:-1;font-size:16px`;
  div.innerHTML = buildTplHTML(s.tplId, s.titre, s.desc, s.extra, s.photo, fmt, s.textPos, s.textColor, s.overlayOpacity, s);
  document.body.appendChild(div);

  if(typeof html2canvas !== 'undefined'){
    showToast('Export en cours…');
    // Pre-load images as blob to bypass CORS, then render
    async function loadImgAsBlob(url){
      try {
        const r=await fetch(url,{mode:'cors'}); const b=await r.blob();
        return URL.createObjectURL(b);
      } catch(e){ return url; }
    }
    const imgEl=div.querySelector('img[src]:not([src=""])');
    const imgSrc=imgEl?.src||'';
    (imgSrc ? loadImgAsBlob(imgSrc) : Promise.resolve('')).then(blobUrl=>{
      if(blobUrl&&imgEl) imgEl.src=blobUrl;
      return html2canvas(div, {
        width: renderW,
        height: renderH,
        scale: scaleF,
        useCORS: true,
        allowTaint: true,
        logging: false,
        // Même correctif que pour l'export Google Business : évite
        // l'espacement excessif entre les mots qu'html2canvas introduit
        // par défaut (mesure mot par mot plutôt que lettre par lettre).
        letterRendering: true,
        onclone: (cloneDoc)=>{
          // ensure fonts are loaded in clone
          const s=cloneDoc.createElement('link');
          s.href='https://fonts.googleapis.com/css2?family=Open+Sans+Condensed:wght@300;700&family=Playfair+Display:ital,wght@0,400;0,700&family=Jost:wght@400;700&display=swap';
          s.rel='stylesheet'; cloneDoc.head.appendChild(s);
        }
      });
    }).then(canvas=>{
      const a = document.createElement('a');
      a.href = canvas.toDataURL('image/png');
      a.download = `drevici-${s.tplId}-${fmt}.png`;
      a.click();
      document.body.removeChild(div);
      s.format = prevFmt;
      showToast('Image exportée !');
    }).catch((e)=>{ console.error(e); document.body.removeChild(div); s.format=prevFmt; showToast('Erreur export — vérifiez les images CORS'); });
  } else {
    document.body.removeChild(div);
    s.format = prevFmt;
    showToast('⚠ html2canvas non chargé');
  }
}

function exportTabCSV(tabId){
  const tab = tabId === '__all'
    ? null
    : DATA.tabs.find(tb => tb.id === tabId);
  const tabs = tab ? [tab] : DATA.tabs;
  const rows = [['Onglet','Carte','Nom','Description','Prix','Informations alimentaires']];
  tabs.forEach(tb => {
    tb.cards.forEach(card => {
      const cardLabel = t(card.label) || '';
      const tabLabel  = t(tb.label)  || '';
      if(card.dishes){
        card.dishes.forEach(d => {
          rows.push([
            tabLabel, cardLabel,
            t(d.name)||'', t(d.desc)||'', d.price||'',
            badgeLabels(d).join(', ')
          ]);
        });
      } else if(card.type==='variants'){
        (card.variants||[]).forEach(v => {
          rows.push([tabLabel, cardLabel, t(v.name)||'', '', v.price||'','']);
        });
      } else if(card.type==='bevs'){
        (card.items||[]).forEach(item => {
          const sizes = (item.sizes||[]).map(s=>bevSizeLabel(s)+' '+s.price+'€').join(' / ');
          rows.push([tabLabel, cardLabel, t(item.name)||'', t(item.desc)||'', sizes||item.price||'', '']);
        });
      }
    });
  });
  const csv = rows.map(r => r.map(v => '"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
  const bom  = '﻿';
  const blob = new Blob([bom+csv], {type:'text/csv;charset=utf-8;'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  const name = tab ? t(tab.label).toLowerCase().replace(/\s+/g,'-') : 'menu-complet';
  a.href=url; a.download='menu-'+name+'.csv'; a.click();
  URL.revokeObjectURL(url);
  showToast('CSV exporté — '+rows.length+' lignes');
}

function pdfCfg(){
  if(!DATA.pdfStyle) DATA.pdfStyle = {};
  const d = DATA.pdfStyle;
  return {
    template: d.template || 'maritime',          // 'classic' | 'maritime'
    // Plus de sélection séparée ici (accordéon "Couleurs du menu"
    // retiré à la demande de Will) : le menu exporté reprend
    // directement les couleurs de marque définies une seule fois dans
    // Informations générales, pour une DA toujours identique sans
    // qu'on ait à les re-choisir. d.titleColor/etc restent lus en
    // premier uniquement pour ne pas casser une éventuelle ancienne
    // personnalisation déjà enregistrée avant ce changement.
    titleColor: d.titleColor || (DATA.brandColors && DATA.brandColors.primary) || '#10285E',
    accentColor: d.accentColor || (DATA.brandColors && DATA.brandColors.accent) || '#C6A24A',
    // Défaut : coché seulement si un logo existe déjà (uploadé pour le
    // PDF ou repris de l'identité du restaurant) — sinon décoché, le
    // texte prend le relai. Une fois que l'utilisateur touche la case
    // lui-même, son choix explicite (d.showLogo) est toujours respecté.
    showLogo: d.showLogo !== undefined ? d.showLogo : true,
    showIcons: d.showIcons !== false,
    showDots: d.showDots !== false,
    showFrame: d.showFrame !== false,
    bgColor: d.bgColor || (DATA.brandColors && DATA.brandColors.bg) || '#FFFDF8',
    logoData: d.logoData || '',
    footerCustomText: d.footerCustomText || '',
    // Réglage LOCAL à l'impression/export, indépendant du réglage
    // global (Mon établissement → "Afficher la devise (€)") — permet
    // de forcer le symbole € on/off spécifiquement sur le menu imprimé
    // sans changer l'affichage du site. Affiché par défaut ici, quel
    // que soit l'état du réglage global.
    showCurrency: d.showCurrency !== undefined ? d.showCurrency : true,
    format: d.format || 'a4',                    // 'a4' | 'gbiz'
    paperSize: d.paperSize || 'a4',               // 'a4' | 'a5' — only applies when format is 'a4' (the print/PDF format)
    exportTab: d.exportTab || 'print',            // which tab is active in the export panel UI: 'print' | 'gbiz' | 'insta'
    instaFont: d.instaFont || 'Playfair Display', // Instagram uniquement — voir INSTA_FONT_OPTIONS
    // Instagram uniquement — 3 couleurs et 3 tailles indépendantes
    // (titre de catégorie / "menu" = nom de plat + prix / description),
    // pour une liberté totale de personnalisation demandée par Will.
    // Défauts calqués sur le rendu initial validé (navy + bleu clair
    // dérivé) pour ne rien changer visuellement tant que rien n'est
    // explicitement modifié.
    instaTitleColor: d.instaTitleColor || d.titleColor || '#10285E',
    instaBgColor: d.instaBgColor || '',            // vide = hérite de la couleur de fond générale
    instaMenuColor: d.instaMenuColor || d.titleColor || '#10285E',
    instaDescColor: d.instaDescColor || '',        // vide = dérivé automatiquement du navy (voir buildInstaCSS)
    // "Couleurs du menu" — un seul jeu partagé par les trois formats
    // (impression, Google Business, Instagram) : les couleurs du menu
    // exporté ne devraient pas différer d'un support à l'autre.
    menuTitleColor: d.menuTitleColor || d.titleColor || (DATA.brandColors && DATA.brandColors.primary) || '#10285E',
    menuNameColor: d.menuNameColor || '#1D1D1F',
    menuDescColor: d.menuDescColor || '#5280DA',
    menuFrameColor: d.menuFrameColor || d.accentColor || (DATA.brandColors && DATA.brandColors.accent) || '#C6A24A',
    menuSepColor: d.menuSepColor || '#CCCCCC',          // pointillés nom↔prix (impression / Google)
    menuInstaSepColor: d.menuInstaSepColor || d.accentColor || (DATA.brandColors && DATA.brandColors.accent) || '#C6A24A', // trait entre plats (Instagram)
    menuBgColor: d.menuBgColor || '',                    // vide = couleur d'arrière-plan du site
    instaTitleSize: d.instaTitleSize || 45,
    instaMenuSize: d.instaMenuSize || 21,
    instaDescSize: d.instaDescSize || 19
  };
}
// Sélecteur de taille : une liste native de 101 options s'ouvrait sur
// toute la hauteur de l'écran. On affiche un champ compact qui ouvre
// un petit panneau d'environ 6 lignes, scrollable, centré sur la
// valeur courante.
function sizePickerHtml(sizeKey, current){
  return `<div class="ig-size-picker" style="flex:1;min-width:0">
    <button type="button" class="ig-size-field" onclick="toggleSizePicker(event,'${sizeKey}')">
      <span data-size-value="${sizeKey}">${current}</span>
      <span class="ig-size-caret">⌄</span>
    </button>
    <div class="ig-size-panel" data-size-panel="${sizeKey}">
      ${Array.from({length:101},(_,n)=>n).map(n=>`<div class="ig-size-opt${n===current?' selected':''}" data-n="${n}" onclick="pickSize(event,'${sizeKey}',${n})">${n}</div>`).join('')}
    </div>
  </div>`;
}
function closeSizePickers(){ document.querySelectorAll('.ig-size-panel.open').forEach(p=>p.classList.remove('open')); }
function toggleSizePicker(e, key){
  e.stopPropagation();
  const panel=document.querySelector(`[data-size-panel="${key}"]`);
  if(!panel) return;
  const wasOpen=panel.classList.contains('open');
  closeSizePickers();
  if(wasOpen) return;
  panel.classList.add('open');
  // Le panneau se superpose au champ (top:0) plutôt que de s'ouvrir
  // au-dessus ou en dessous : sur une ligne de trois sélecteurs, ces
  // deux positions sortaient de la zone visible. On centre la valeur
  // courante dans le panneau pour qu'elle reste sous le doigt.
  const sel=panel.querySelector('.ig-size-opt.selected');
  if(sel) panel.scrollTop=Math.max(0, sel.offsetTop - panel.clientHeight/2 + sel.offsetHeight/2);
  setTimeout(()=>document.addEventListener('click',closeSizePickers,{once:true}),0);
}
function pickSize(e, key, n){
  e.stopPropagation();
  setPdfCfg(key, n);
  const label=document.querySelector(`[data-size-value="${key}"]`);
  if(label) label.textContent=n;
  const panel=document.querySelector(`[data-size-panel="${key}"]`);
  if(panel){
    panel.querySelectorAll('.ig-size-opt.selected').forEach(o=>o.classList.remove('selected'));
    const opt=panel.querySelector(`.ig-size-opt[data-n="${n}"]`);
    if(opt) opt.classList.add('selected');
  }
  closeSizePickers();
}
// Réinitialise TOUTES les couleurs Instagram, pas seulement le fond :
// vidées, elles retombent sur les couleurs de marque choisies dans
// Couleurs. Mise à jour des pastilles sur place — un re-rendu
// refermerait l'accordéon "Personnaliser".
function setPdfCfg(key, val){
  if(!DATA.pdfStyle) DATA.pdfStyle = {};
  DATA.pdfStyle[key] = val;
  updatePdfPreview();
  schedulePreviewRefresh();
}
// BUG FIX (aperçus figés) : updatePdfPreview ne vise que l'ancienne
// iframe unique #pdfPreviewFrame, qui n'existe plus depuis le passage
// aux carrousels — donc changer une couleur ne se voyait nulle part
// avant un re-rendu complet de la section. On recharge les carrousels
// présents, avec un court délai pour ne pas les reconstruire à chaque
// pixel parcouru par le sélecteur de couleur.
let _previewRefreshT=null;
function schedulePreviewRefresh(){
  clearTimeout(_previewRefreshT);
  _previewRefreshT=setTimeout(()=>{
    try{ initPdfCarouselFrames(); }catch(e){}
    try{ initGbizCarouselFrames(); }catch(e){}
    try{ initInstaCarouselFrames(); }catch(e){}
    try{ initMenuColorsFrames(); }catch(e){}
  },120);
}

// Build the inner menu HTML (shared by preview + export)
function buildPdfMenuHTML(cfg){
  const b = buildPdfBlocks(cfg);
  return b.headerHtml + b.contentBlocks.map(x=>x.html).join('') + b.footerHtml;
}

// Split the menu into atomic pieces (header / each dish-or-item / footer)
// instead of one giant HTML string — needed so paginatePdfPages() can
// measure and distribute them across real physical pages. Every dish/
// variant/bev-item is its own block (never split internally); a
// category's own <h2> travels with its first dish so a category never
// starts a page with just a lonely heading and nothing under it.
// Menus et Formules uniquement — transformation du TEXTE lui-même
// (jamais du CSS text-transform + ::first-letter) pour la casse
// "minuscule" : ::first-letter n'est pas fiable avec html2canvas
// (confirmé par capture — ça casse le rendu, espace fantôme entre la
// 1ère et la 2e lettre). En transformant la vraie chaîne de
// caractères avant de l'insérer dans le HTML, ça marche avec
// n'importe quel moteur de rendu, sans dépendre d'un pseudo-élément.
function applyTextCase(text, mode){
  if(!text) return text;
  if(mode === 'upper') return text.toUpperCase();
  if(mode === 'lower') return text.charAt(0).toUpperCase() + text.slice(1).toLowerCase();
  return text;
}
function buildPdfBlocks(cfg){
  const restName = getRestaurantName() || 'Menu';
  // Instagram (comme Google Business) : aucun en-tête, direct dans les
  // catégories — chaque story ne montre qu'UNE catégorie à la fois.
  const isGbizFmt = cfg.format === 'gbiz' || cfg.format === 'insta';
  // Logo: PDF-specific upload > restaurant logo already stored > nothing
  const logoUrl = (DATA.pdfStyle && DATA.pdfStyle.logoData) || getRestaurantLogo() || '';
  const icData = DATA.icones||{};
  const showMainIc = cfg.showIcons!==false && icData.main && !cfg.showLogo;
  const showSecIc  = cfg.showIcons!==false && !!icData.secondary;
  // Google Business n'affiche aucun en-tête du tout (ni logo, ni nom
  // du restaurant) — seulement les catégories, dès la première page.
  // Ça règle aussi l'alignement entre pages d'un coup : sans en-tête
  // nulle part, chaque page démarre déjà au même niveau naturellement.
  const showLogoImg = !isGbizFmt && cfg.showLogo && logoUrl;

  let headerHtml = '';
  if(!isGbizFmt){
    headerHtml = `<div class="pdf-header">`;
    if(showLogoImg) headerHtml += `<img src="${logoUrl}" class="pdf-logo" onerror="this.style.display='none'">`;
    else if(cfg.showLogo && !logoUrl) headerHtml += `<div class="pdf-logo-text">${getRestaurantName()||''}</div>`;
    // BUG FIX: this only ever suppressed the big <h1> title when a real
    // logo IMAGE was showing — but checking "Afficher le logo" with no
    // logo actually uploaded falls back to .pdf-logo-text (the name,
    // small and styled), and the <h1> still rendered right under it: two
    // renderings of the same name stacked together. The checkbox itself
    // is "soit l'un soit l'autre" regardless of whether a real image
    // exists — so the title is now suppressed whenever cfg.showLogo is
    // on at all, not just when an image happens to be present.
    if(!cfg.showLogo) headerHtml += `<h1 class="pdf-title">${restName}</h1>`;
    if(DATA.heroActive && DATA.hero) headerHtml += `<div class="pdf-sub">${t(DATA.hero)}</div>`;
    if(showMainIc) headerHtml += `<img src="${icData.main}" style="width:48px;height:48px;object-fit:contain;margin:10px auto 0;display:block" onerror="this.style.display='none'">`;
    headerHtml += `</div>`;
  }

  const contentBlocks = [];
  const dots = cfg.showDots!==false ? '<span class="pdf-dots"></span>' : '<span class="pdf-dots-off"></span>';
  // Google Business specifically gets a cleaner price format for
  // dual-price dishes (oysters etc.) — "12€ / 22€" reads unambiguously
  // on one line, versus the site's own "Les 6 — 12€ · Les 12 — 22€"
  // which is harder for a quick glance (and for Google's own menu
  // parsing, when it reads a PDF/image) to disambiguate.
  // Format simple validé par Will pour Google Business — "12€ / 22€",
  // pas de découpage en plusieurs lignes.
  // Réglage propre à l'impression (cfg.showCurrency), pas le réglage
  // global du site — c'est ce qui permet de le forcer indépendamment
  // depuis la section Export/Impression. Instagram (isInstaFmt) ignore
  // ce réglage et retire toujours le symbole € — demande explicite de
  // Will, spécifique à ce format uniquement.
  const isInstaFmt = cfg.format === 'insta';
  const pdfCurrency = s => (cfg.showCurrency===false || isInstaFmt) ? String(s||'').replace(/€/g,'').trim() : s;
  // Sur Instagram, un double prix (ex. huîtres "Les 6 — 12€ · Les 12 —
  // 22€") n'affiche que le premier — demande explicite de Will, pour
  // rester le plus épuré possible sur ce format précis uniquement.
  const priceText = d => pdfCurrency((isGbizFmt && d.priceType==='dual' && d.p1 && d.p2)
    ? (isInstaFmt ? `${d.p1}` : `${d.p1}€ / ${d.p2}€`)
    : (d.price||''));
  // Réutilisable pour "Menu et Formule" : par défaut on lit le vrai
  // menu (DATA.tabs), mais si cfg.tabsSource est fourni (les
  // catégories d'une formule), c'est cette liste qui est utilisée à la
  // place — c'est le seul point de contact du moteur avec la source
  // des données, aucune autre logique n'a besoin de changer.
  (cfg.tabsSource || DATA.tabs).filter(tb=>tb.id!=='__home' && tb.visible!==false).forEach(tb=>{
    const catLabel = cfg.tabsSource ? applyTextCase(t(tb.label), cfg.catCase==='lower'?'lower':'upper') : t(tb.label);
    let pendingHeader = `<h2 class="pdf-cat" data-tab-id="${tb.id}">${showSecIc?`<img src="${icData.secondary}" style="width:16px;height:16px;object-fit:contain;vertical-align:middle;margin-right:6px" onerror="this.remove()">`:''}${catLabel}</h2>`;
    let firstBlockOfTab = true;
    // "Catégorie solo" — une catégorie qui ne contient qu'UN SEUL plat au
    // total (tous types de cartes confondus) se retrouve visuellement
    // déséquilibrée à l'export : un gros titre de catégorie suivi d'une
    // seule petite ligne, avec tout l'espace calibré pour plusieurs plats
    // resté vide en dessous. Exception demandée par Will : uniquement
    // dans ce cas précis (jamais à partir de 2 plats), on resserre un peu
    // le plat lui-même (texte + espacement, jamais le titre de la
    // catégorie) via la classe .pdf-dish-solo ci-dessous.
    const tabItemCount = tb.cards.reduce((n,card)=>{
      if(card.dishes) return n + card.dishes.filter(d=>!d.hidden).length;
      if(card.type==='variants') return n + (card.variants||[]).filter(v=>!v.hidden).length;
      if(card.type==='bevs') return n + (card.items||[]).filter(item=>!item.hidden).length;
      return n;
    }, 0);
    const soloCls = tabItemCount===1 ? ' pdf-dish-solo' : '';
    tb.cards.forEach(card=>{
      let pendingSubcat = (t(card.label) && tb.cards.length>1) ? `<h3 class="pdf-subcat">${t(card.label)}</h3>` : '';
      const items = card.dishes ? card.dishes.filter(d=>!d.hidden).map(d=>{
          const dName = cfg.tabsSource ? applyTextCase(t(d.name)||'', cfg.nameCase==='lower'?'lower':'upper') : (t(d.name)||'');
          const dDesc = cfg.tabsSource ? applyTextCase(t(d.desc), cfg.descCase==='upper'?'upper':'lower') : t(d.desc);
          return `<div class="pdf-dish${soloCls}"><div class="pdf-dish-line"><span class="pdf-dish-name">${dName}</span>${dots}<span class="pdf-dish-price">${priceText(d)}</span></div>${dDesc?`<div class="pdf-dish-desc">${dDesc}</div>`:''}</div>`;
        })
        : card.type==='variants' ? (card.variants||[]).filter(v=>!v.hidden).map(v=>
          `<div class="pdf-dish${soloCls}"><div class="pdf-dish-line"><span class="pdf-dish-name">${t(v.name)||''}</span>${dots}<span class="pdf-dish-price">${priceText(v)}</span></div></div>`)
        : card.type==='bevs' ? (card.items||[]).filter(item=>!item.hidden).map(item=>{
          // Sur Instagram, un seul prix affiché (la 1ère taille), pas la
          // liste complète "Les 6 — 12€ · Les 12 — 22€" — même logique
          // d'épuration que priceText ci-dessus, appliquée ici pour les
          // plats à tailles multiples (huîtres, etc.).
          const sizes = isInstaFmt
            ? ((item.sizes||[])[0] ? String((item.sizes||[])[0].price||'') : '')
            : (item.sizes||[]).map(s=>bevSizeLabel(s)+' — '+s.price+'€').join(' · ');
          return `<div class="pdf-dish${soloCls}"><div class="pdf-dish-line"><span class="pdf-dish-name">${t(item.name)||''}</span>${dots}<span class="pdf-dish-price">${pdfCurrency(sizes||item.price||'')}</span></div>${t(item.desc)?`<div class="pdf-dish-desc">${t(item.desc)}</div>`:''}</div>`;
        }) : [];
      items.forEach((itemHtml, i)=>{
        let html = itemHtml;
        if(i===0){ html = pendingSubcat + html; pendingSubcat = ''; }
        let forceBreak = false;
        if(firstBlockOfTab){
          html = pendingHeader + html;
          forceBreak = !!tb.pdfPageBreakBefore;
          firstBlockOfTab = false;
        }
        contentBlocks.push({ html, forceBreak, tabId: tb.id, cardType: card.type||'dishes' });
      });
    });
  });

  // Footer : uniquement le texte personnalisé — plus aucun champ ajouté
  // automatiquement (adresse, téléphone, date), puisque rien de tout ça
  // n'était sélectionnable/désactivable individuellement. Non pertinent
  // pour Google Business (pas de champ dédié pour ce format).
  const footerHtml = cfg.footerCustomText
    ? `<div class="pdf-footer"><div class="pdf-footer-text">${cfg.footerCustomText}</div></div>`
    : '';

  return { headerHtml, contentBlocks, footerHtml };
}

// BUG FIX: the page frame (.pdf-page::before) was drawn once around one
// giant div holding the whole menu, then the browser's native print
// engine sliced that div across as many physical sheets as needed. A
// single border drawn around content 3x taller than one page only ever
// shows its top edge on page 1, its bottom edge on the last page, and
// NEITHER on any page in between — exactly the "incomplete frame"
// symptom. Fix: actually paginate in JS — measure real rendered heights
// (same fonts, same CSS, same everything) and split content into
// several independent .pdf-page divs, each already sized to fit one
// physical sheet. Each one gets its own complete, independent border.
function paginatePdfPages(cfg){
  if(cfg.format === 'gbiz') return [{ html: buildPdfMenuHTML(cfg), spaceScale: 1 }]; // one tall image, not print-paginated
  const isA5 = cfg.paperSize === 'a5';
  // True A4/A5 physical page height at 96dpi (210×297mm / 148×210mm).
  // @page margin is 0 (see buildPdfCSS) — the PDF itself must be truly
  // edge-to-edge, so the full physical height is available; the only
  // inset left is our own deliberate `pad`, a design choice rather
  // than a print-driver default.
  const fullPageHeightPx = isA5 ? 794 : 1123;
  const A5_SCALE = 0.72;
  const padPx = Math.round((isA5 ? A5_SCALE : 1) * 30);
  // Small safety margin: fonts/DPI vary slightly by browser/OS, so aim
  // a touch under the true limit rather than risk the browser's own
  // print engine still needing to split a page we thought would fit.
  // (Was 6% — real-world testing showed that left a whole extra dish's
  // worth of unused space at the bottom of every page, which is also
  // what read as "bottom margin bigger than the other 3 sides": the
  // frame itself is a uniform 14px inset on every side, so that gap
  // was unused content room, not the frame sitting off-center.)
  const maxPageHeightPx = Math.floor((fullPageHeightPx - 2*padPx) * 1.03);

  const { headerHtml, contentBlocks, footerHtml } = buildPdfBlocks(cfg);

  const holder = document.createElement('div');
  holder.style.cssText = 'position:fixed;left:-99999px;top:0;visibility:hidden;';
  // min-height:0 here is essential, not cosmetic: .pdf-page carries its
  // own min-height (the full physical page) so real pages always look
  // complete even half-empty — but that same min-height would poison
  // THIS measurement if left in place, since every offsetHeight read
  // would floor out at "one full page" regardless of actual content,
  // making every single block appear to overflow and forcing a page
  // break after each one. This override keeps the measurement honest.
  holder.innerHTML = `<style>${buildPdfCSS(cfg)}</style><div class="pdf-page" id="__pdfMeasure" style="height:auto;min-height:0"></div>`;
  document.body.appendChild(holder);
  const measureEl = holder.querySelector('#__pdfMeasure');
  const heightOf = html => { measureEl.innerHTML = html; return measureEl.offsetHeight; };

  const pages = [];
  let current = headerHtml;
  contentBlocks.forEach(block=>{
    const candidate = current + block.html;
    const mustBreak = block.forceBreak && current !== headerHtml && current !== '';
    if(!mustBreak && heightOf(candidate) <= maxPageHeightPx){
      current = candidate;
    } else {
      pages.push(current);
      current = block.html; // new page starts with just this block (no repeated header)
    }
  });
  // Footer: append to the last page if it fits, otherwise its own page.
  const withFooter = current + footerHtml;
  if(footerHtml && heightOf(withFooter) > maxPageHeightPx){
    pages.push(current);
    current = footerHtml;
  } else {
    current = withFooter;
  }
  pages.push(current);
  // Whitespace as the adjustment variable: a page sitting well under
  // its available height gets its inter-dish/inter-category spacing
  // gently stretched (never text size) via the --space-scale custom
  // property (see buildPdfCSS) so the page reads as "designed to end
  // here" rather than "ran out of content". Remonté de +22% à +50% —
  // le plafond précédent était trop bas pour une page très courte
  // (ex. Huîtres seule, 4 plats), qui gardait un vide visible même une
  // fois étirée au maximum autorisé.
  const result = pages.map(pageHtml=>{
    const used = heightOf(pageHtml);
    const ratio = maxPageHeightPx > 0 ? used / maxPageHeightPx : 1;
    let spaceScale = 1;
    if(ratio < 0.97 && ratio > 0){
      const slack = 0.97 - ratio;
      spaceScale = Math.min(1.5, 1 + slack * 0.9);
    }
    return { html: pageHtml, spaceScale };
  });

  document.body.removeChild(holder);
  return result;
}


// Éclaircit une couleur hex en la mélangeant avec du blanc — utilisé
// pour dériver le "bleu moyen" des descriptions Instagram à partir du
// navy de la marque (cfg.titleColor), sans devoir stocker une 2e
// couleur séparée que Will devrait régler lui-même.
function lightenHex(hex, amt){
  hex = (hex||'#10285E').replace('#','');
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  const r = parseInt(hex.slice(0,2),16)||0, g = parseInt(hex.slice(2,4),16)||0, b = parseInt(hex.slice(4,6),16)||0;
  const mix = c => Math.round(c + (255-c)*amt);
  return `rgb(${mix(r)},${mix(g)},${mix(b)})`;
}

// CSS dédiée au format Instagram (story 9:16) — reprend les mêmes
// Calcul centralisé des tailles Instagram/Formule — utilisé à la fois
// par buildInstaCSS (le CSS affiché) ET fitInstaOneLiners (le
// rétrécissement "une seule ligne", qui applique un style en ligne
// prioritaire sur la classe CSS). BUG FIX : avant ce partage,
// fitInstaOneLiners recalculait sa propre taille de base à partir de
// cfg.instaTitleSize brut, ignorant complètement catTitleSize/
// formuleTitleSize/l'échelle globale — ses styles en ligne écrasaient
// donc silencieusement toute réduction de taille faite côté CSS.
// Menus et Formules uniquement : catégories 50%×75% plus petites,
// titre de formule 20% plus petit, et une échelle globale (%)
// s'applique en dernier, sur tout à la fois, proportionnellement.
function instaSizesFor(cfg){
  const titleSize = cfg.instaTitleSize || 45;
  const menuSize = cfg.instaMenuSize || 21;
  const descSize = cfg.instaDescSize || 19;
  const globalScale = cfg.tabsSource ? (cfg.globalSizeScale ?? 100)/100 : 1;
  const catTitleSize = Math.round((cfg.tabsSource ? titleSize*0.5*0.75*1.25*0.85*1.10 : titleSize) * globalScale);
  const formuleTitleSize = Math.round(titleSize*0.8*globalScale);
  return {
    titleSize,
    catTitleSize,
    formuleTitleSize,
    menuSize: Math.round(menuSize*globalScale),
    descSize: Math.round(descSize*globalScale)
  };
}

// classes que buildPdfBlocks produit déjà (.pdf-cat, .pdf-dish, etc.)
// mais avec un habillage entièrement différent : tout centré, gros
// titres en majuscules, prix et descriptions en italique, courtes
// séparations dorées entre les plats plutôt que des pointillés —
// calqué sur la référence fournie par Will (mood Drevici, mise en
// forme différente). Une image = une seule catégorie, jamais de
// chevauchement entre catégories.
function buildInstaCSS(cfg, ratio){
  ratio = ratio || INSTA_RATIO;
  const navy = cfg.titleColor || '#10285E';
  const gold = cfg.accentColor || '#C6A24A';
  // Fond Instagram — réglable indépendamment (cfg.instaBgColor),
  // sinon hérite de la couleur de fond générale de la marque.
  const bg = cfg.menuBgColor || cfg.instaBgColor || cfg.bgColor || '#FDFBF6';
  // 3 couleurs et 3 tailles indépendantes (titre / menu / description)
  // — réglables dans l'admin, uniquement pour Instagram. Défauts
  // calqués sur le rendu initial si rien n'est explicitement choisi.
  // Mêmes couleurs que les autres formats (voir "Couleurs du menu").
  const titleColor = cfg.menuTitleColor || navy;
  const menuColor = cfg.menuNameColor || navy;
  const descColor = cfg.menuDescColor || lightenHex(navy, 0.28);
  const { titleSize, catTitleSize, formuleTitleSize, menuSize, descSize } = instaSizesFor(cfg);
  // 100px pour la story normale, 50px pour le post ET pour toute
  // formule (A4/Story/Post confondus) — demande explicite de Will :
  // pour une formule, le titre doit toujours être remonté au même
  // niveau sur les 3 formats, pour garder la place gagnée en bas.
  const padTop = (ratio === INSTA_POST_RATIO || cfg.tabsSource) ? 50 : 100, padSide = 36;
  // Police propre à Instagram (cfg.instaFont) — voir INSTA_FONT_OPTIONS
  // pour la liste proposée dans l'admin. Une seule police pour tout
  // (titre, nom de plat, prix, description), à différents poids/styles
  // — demande explicite de Will, spécifique à ce format uniquement.
  const font = cfg.instaFont || 'Playfair Display';
  const fontUrlName = font.replace(/ /g,'+');
  return `
  @import url('https://fonts.googleapis.com/css2?family=${fontUrlName}:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{margin:0;padding:0;background:${bg}}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important}
  .pdf-page{--space-scale:1;font-family:'${font}',serif;color:${titleColor};background:${bg};width:${INSTA_RENDER_W}px;height:${Math.round(INSTA_RENDER_W*ratio)}px;padding:${padTop}px ${padSide}px;margin:0 auto;position:relative;overflow:hidden;text-align:center;display:flex;flex-direction:column;align-items:center}
  .pdf-page::before{content:'';position:absolute;inset:20px;border:1.5px solid ${gold};pointer-events:none}
  .pdf-cat{font-family:'${font}',serif;font-weight:800;font-size:${catTitleSize}px;line-height:1.1;text-transform:${cfg.tabsSource?'none':'uppercase'};letter-spacing:.01em;color:${titleColor};margin-bottom:${cfg.tabsSource?'calc(13.2px * var(--space-scale))':'44px'};border:none}
  .pdf-cat:has(+ .pdf-subcat){margin-bottom:22px}
  .pdf-cat + .pdf-subcat{margin-top:15px}
  ${cfg.tabsSource ? '.pdf-dish + .pdf-cat{margin-top:calc(34px * var(--space-scale))}' : ''}
  .pdf-subcat{font-family:'${font}',serif;font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.06em;color:${cfg.menuFrameColor||gold};margin:30px 0 18px}
  .pdf-dish{margin-bottom:calc(${cfg.tabsSource?(7.05*((cfg.dishGapPct ?? 100)/100)).toFixed(2):30}px * var(--space-scale));width:100%}
  ${cfg.tabsSource ? '' : `.pdf-dish + .pdf-dish::before{content:'';display:block;width:64px;height:1px;background:${cfg.menuInstaSepColor||gold};margin:0 auto calc(26px * var(--space-scale));opacity:.8}`}
    /* BUG FIX (écarts inégaux entre les plats) : chaque nom reçoit sa
     propre taille de police pour tenir sur une ligne, ce qui changeait
     la hauteur de sa ligne — donc l'écart perçu d'un plat à l'autre.
     Une hauteur de ligne fixe, calée sur la taille de référence, rend
     l'espacement identique partout et dans les trois formats. */
  .pdf-dish-line{display:flex;justify-content:center;align-items:baseline;gap:14px${cfg.tabsSource?`;line-height:${Math.round(menuSize*1.38)}px`:''}}
  .pdf-dish-line-group{width:100%}
  .pdf-dish-line-cont{margin-top:2px}
  .pdf-dish-name{font-family:'${font}',serif;font-weight:800;font-size:${menuSize}px;text-transform:${cfg.tabsSource?'none':'uppercase'};letter-spacing:.01em;color:${menuColor}}
  .pdf-dots,.pdf-dots-off{display:none}
  .pdf-dish-price{font-family:'${font}',serif;font-style:italic;font-weight:500;font-size:${cfg.tabsSource?Math.max(10,menuSize-1):Math.max(14,menuSize-1)}px;line-height:inherit;color:${menuColor}}
  .pdf-dish-desc{font-family:'${font}',serif;font-style:italic;font-weight:500;font-size:${descSize}px;line-height:1.35;color:${descColor};margin-top:6px;max-width:76%;margin-left:auto;margin-right:auto;text-wrap:balance}
  .pdf-footer{display:none}
  /* Menus et Formules uniquement — titre + texte libre optionnels,
     affichés avant les catégories (voir formule_buildPreamble). */
  .formule-title{font-family:'${font}',serif;font-weight:800;font-size:${Math.round((cfg.formuleTitleBase ?? formuleTitleSize)*((cfg.formuleTitlePct ?? 100)/100))}px;line-height:1.15;text-transform:uppercase;letter-spacing:.01em;color:${cfg.formuleTitleColor||titleColor};margin-bottom:9px;text-align:center}
  .formule-freetext{font-family:'${font}',serif;font-style:italic;font-weight:500;font-size:${Math.round((cfg.formuleSubBase ?? Math.round(descSize*0.85))*((cfg.formuleSubPct ?? 100)/100))}px;line-height:1.4;color:${cfg.formuleSubColor||descColor};white-space:pre-wrap;text-align:center;margin-bottom:34px;max-width:82%;margin-left:auto;margin-right:auto}
  /* Deux options d'alignement indépendantes, demandées séparément par
     Will : le contenu (catégories/plats) d'un côté, le titre + texte
     libre de l'autre — chacun peut être aligné à gauche ou rester
     centré, sans dépendre l'un de l'autre. */
  ${cfg.alignContentLeft ? `
  .pdf-cat{text-align:left;width:100%}
  .pdf-subcat{text-align:left;width:100%}
  .pdf-dish-line{justify-content:flex-start;text-align:left}
  .pdf-dish-desc{text-align:left;margin-left:0;margin-right:auto}
  ` : ''}
  ${cfg.alignTitleLeft ? `
  .formule-title{text-align:left;width:100%}
  .formule-freetext{text-align:left;margin-left:0;margin-right:auto;width:100%}
  ` : ''}
  `;
}

// Une image = une seule catégorie (jamais de fusion entre catégories,
// jamais de découpe au milieu d'une catégorie) — automatique, sans
// aucun réglage manuel par catégorie contrairement à Google Business :
// le seul degré de liberté est un resserrement d'espacement (jusqu'à
// -30%, jamais le texte) si la catégorie ne rentre pas nativement dans
// le cadre fixe de la story.
//
// BUG FIX (chevauchement massif) : dès qu'un titre de catégorie ou un
// nom de plat était trop long pour tenir sur une ligne, il repassait à
// la ligne — et html2canvas (contrairement à un vrai navigateur) ne
// recalcule pas correctement la hauteur d'un conteneur flex dont un
// enfant vient de passer sur 2 lignes : la hauteur qu'il croit avoir
// est trop petite, donc tout ce qui suit (description, plat suivant)
// se retrouve positionné par-dessus au lieu d'en dessous. La vraie
// solution — demande explicite de Will — est d'empêcher ce
// retour-à-la-ligne à la source : titres et noms de plats DOIVENT
// toujours tenir sur une seule ligne, en réduisant leur taille de
// police si besoin (jamais le texte tronqué). Ainsi le bug n'a plus
// jamais l'occasion de se déclencher, quelle que soit la longueur du
// texte réel du restaurateur.
function fitInstaOneLiners(html, holder, cfg){
  const measureEl = holder.querySelector('#__instaMeasure');
  // Largeur réellement disponible pour le texte : largeur de page moins
  // le padding gauche+droite de .pdf-page (voir buildInstaCSS), moins
  // une petite marge de sécurité pour ne jamais toucher le cadre doré.
  const padSide = 36;
  // Menus et Formules uniquement — marge en pourcentage (15% à
  // gauche ET à droite, donc 70% de largeur utile) plutôt qu'une
  // marge fixe en pixels : demande explicite de Will, les noms de
  // plats touchaient encore les bords du cadre.
  //
  // BUG FIX (aligné à gauche) : cette limite à 70% a été pensée pour
  // du texte CENTRÉ, où elle se traduit automatiquement en 15% de
  // marge des deux côtés. Aligné à gauche, le texte démarre déjà au
  // bord gauche (padding fixe de la page) — avec le même plafond de
  // 70%, un plat qui l'atteint dépasse alors largement à droite (plus
  // de marge à droite qu'à gauche), OU passe à la ligne trop tôt alors
  // qu'il reste clairement de la place. Pour que la marge gauche et
  // la marge droite soient identiques en aligné à gauche, le texte
  // doit pouvoir utiliser toute la largeur du padding de page (le
  // même repère qui définit déjà la marge gauche), pas le plafond à
  // 70% pensé pour le centrage.
  const availableW = cfg.tabsSource
    ? (cfg.alignContentLeft ? INSTA_RENDER_W - padSide*2 : INSTA_RENDER_W * 0.70)
    : INSTA_RENDER_W - padSide*2 - 16;
  const { catTitleSize, menuSize } = instaSizesFor(cfg);

  function fitOne(text, tag, className, baseSize, minSize){
    const test = document.createElement(tag);
    test.className = className;
    test.style.whiteSpace = 'nowrap';
    test.style.position = 'absolute';
    // BUG FIX (titres plus petits en alignement à gauche) : .pdf-cat a
    // width:100% quand alignContentLeft est actif (pour que le texte
    // s'aligne vraiment sur le bord de la page) — sans ce correctif,
    // l'élément de mesure hérite de ce width:100%, et scrollWidth
    // reflète alors la largeur du CONTENEUR entier plutôt que celle du
    // texte, faussant le calcul et rétrécissant inutilement. width:auto
    // ici force une mesure toujours basée sur la taille naturelle du
    // texte, centré ou aligné à gauche.
    test.style.width = 'auto';
    test.style.fontSize = baseSize+'px';
    test.innerHTML = text;
    measureEl.appendChild(test);
    let size = baseSize;
    while(test.scrollWidth > availableW && size > minSize){
      size -= 1;
      test.style.fontSize = size+'px';
    }
    const fits = test.scrollWidth <= availableW;
    measureEl.removeChild(test);
    return { size, fits };
  }

  // BUG FIX (texte qui sortait du cadre à droite) : une fois la police
  // descendue à son plancher, le texte restait en "pas de retour à la
  // ligne" et débordait, alors que la marge gauche, elle, était
  // respectée. S'il ne tient toujours pas, on l'autorise à passer à la
  // ligne — la marge droite vaut alors la marge gauche.
  const wrapStyle = fit => fit.fits ? 'white-space:nowrap' : 'white-space:normal';
  // Quand un nom passe à la ligne, il finit souvent par un mot seul,
  // ce qui déséquilibre le bloc. On soude les deux derniers mots par
  // une espace insécable : ils descendent ensemble, et la dernière
  // ligne compte au moins deux mots.
  const bindOrphan = txt => {
    if(/[<>]/.test(txt)) return txt;              // balises : on ne touche pas
    const parts = txt.trim().split(/\s+/);
    if(parts.length < 3) return txt;
    return parts.slice(0, -2).join(' ') + (parts.length>2?' ':'') + parts.slice(-2).join('\u00A0');
  };
  let out = html.replace(/<h2 class="pdf-cat"([^>]*)>([\s\S]*?)<\/h2>/, (m, attrs, inner)=>{
    const fit = fitOne(inner, 'h2', 'pdf-cat', catTitleSize, Math.min(13, catTitleSize));
    const text = fit.fits ? inner : bindOrphan(inner);
    return `<h2 class="pdf-cat"${attrs} style="font-size:${fit.size}px;${wrapStyle(fit)}">${text}</h2>`;
  });
  out = out.replace(/<h3 class="pdf-subcat">([\s\S]*?)<\/h3>/g, (m, inner)=>{
    const fit = fitOne(inner, 'h3', 'pdf-subcat', 22, 13);
    return `<h3 class="pdf-subcat" style="font-size:${fit.size}px;${wrapStyle(fit)}">${inner}</h3>`;
  });
  // RÈGLE DE BASE (Will) : jamais un mot seul sur la dernière ligne.
  // Les descriptions, elles, passent bien à la ligne (contrairement
  // aux noms de plats) : on soude simplement leurs deux derniers mots
  // par une espace insécable, ils descendent alors ensemble.
  out = out.replace(/<div class="pdf-dish-desc">([\s\S]*?)<\/div>/g,
    (m, inner)=>`<div class="pdf-dish-desc">${bindOrphan(inner)}</div>`);
  out = out.replace(/<div class="pdf-sub">([\s\S]*?)<\/div>/g,
    (m, inner)=>`<div class="pdf-sub">${bindOrphan(inner)}</div>`);
  // BUG FIX (chevauchement) : le retour à la ligne d'un nom de plat
  // recasse la mise en page à l'export — confirmé que ça arrive aussi
  // en inline-block, pas seulement en flex ; html2canvas mesure mal la
  // hauteur dès qu'un retour à la ligne se produit ici, quel que soit
  // le mode d'affichage. Retour au principe d'origine : un nom de plat
  // ne passe JAMAIS à la ligne, on rétrécit sa police à la place.
  //
  // Export du menu (vrai menu) : calibré sur "Maquereau au poivre de
  // Sichuan" comme cas limite accepté par Will (jamais plus long que
  // ça dans la pratique) — cette taille devient le plancher, jamais
  // rétréci davantage même pour un nom encore plus long.
  if(!cfg.tabsSource){
    const worstCaseFloor = fitOne('Maquereau au poivre de Sichuan', 'span', 'pdf-dish-name', menuSize, 10).size;
    out = out.replace(/<span class="pdf-dish-name">([\s\S]*?)<\/span>/g, (m, inner)=>{
      const fit = fitOne(inner, 'span', 'pdf-dish-name', menuSize, worstCaseFloor);
      const text = fit.fits ? inner : bindOrphan(inner);
      return `<span class="pdf-dish-name" style="font-size:${fit.size}px;${wrapStyle(fit)}">${text}</span>`;
    });
    return out;
  }

  // Menus et Formules — demande explicite de Will : tous les noms de
  // plats gardent la MÊME taille (plus de rétrécissement individuel
  // qui donnait des tailles incohérentes d'un plat à l'autre). Si un
  // nom dépasse la largeur disponible (70%) à cette taille commune,
  // il passe à une DEUXIÈME LIGNE — mais jamais via le retour à la
  // ligne natif du navigateur (c'est justement ce qui casse le rendu
  // html2canvas) : on découpe le texte au mot le plus proche nous-
  // mêmes et on produit deux éléments SÉPARÉS, chacun sur sa propre
  // ligne, ni l'un ni l'autre ne wrappant jamais lui-même. Le prix
  // reste uniquement sur la première ligne, pour la clarté demandée.
  function widthOfName(text, size){
    const t2 = document.createElement('span');
    t2.className = 'pdf-dish-name';
    t2.style.whiteSpace = 'nowrap'; t2.style.position = 'absolute'; t2.style.width = 'auto';
    t2.style.fontSize = size+'px';
    t2.innerHTML = text;
    measureEl.appendChild(t2);
    const w = t2.scrollWidth;
    measureEl.removeChild(t2);
    return w;
  }
  out = out.replace(/<div class="pdf-dish-line"><span class="pdf-dish-name">([\s\S]*?)<\/span>((?:<span class="pdf-dots(?:-off)?"><\/span>)?)<span class="pdf-dish-price">([\s\S]*?)<\/span><\/div>/g,
    (m, nameInner, dotsInner, priceInner)=>{
      const fullW = widthOfName(nameInner, menuSize);
      if(fullW <= availableW){
        return `<div class="pdf-dish-line"><span class="pdf-dish-name" style="font-size:${menuSize}px;white-space:nowrap">${nameInner}</span>${dotsInner}<span class="pdf-dish-price">${priceInner}</span></div>`;
      }
      const priceW = widthOfName(priceInner, menuSize);
      const gap = 14;
      const words = nameInner.split(' ');
      let splitIdx = 0;
      for(let i=words.length-1;i>=1;i--){
        if(widthOfName(words.slice(0,i).join(' '), menuSize) <= availableW - priceW - gap){ splitIdx = i; break; }
      }
      // RÈGLE DE BASE (Will) : jamais un seul mot orphelin sur la
      // deuxième ligne. La boucle ci-dessus remplit la première ligne
      // au maximum, ce qui laissait souvent un mot seul en dessous
      // ("… confit au / soja"). On descend un mot de plus pour que la
      // deuxième ligne en compte toujours au moins deux. Si ça n'est
      // pas possible (il ne resterait rien sur la première ligne), on
      // ne coupe pas du tout : on rétrécit le nom pour le garder sur
      // une seule ligne, ce qui vaut mieux qu'un orphelin.
      if(splitIdx > 0 && words.length - splitIdx === 1){
        splitIdx = splitIdx - 1 >= 1 ? splitIdx - 1 : 0;
      }
      if(splitIdx===0){
        // Pas de découpe possible sans laisser un orphelin (ou un seul
        // mot déjà trop long) — dernier recours : rétrécir cette ligne,
        // plutôt que de la couper au milieu d'un mot. On vise la place
        // réellement libre, prix compris, pour que le prix reste aligné
        // à droite au lieu d'être repoussé hors du cadre.
        const room = Math.max(60, availableW - priceW - gap);
        let size = menuSize;
        while(widthOfName(nameInner,size) > room && size>10) size -= 1;
        return `<div class="pdf-dish-line"><span class="pdf-dish-name" style="font-size:${size}px;white-space:nowrap">${nameInner}</span>${dotsInner}<span class="pdf-dish-price">${priceInner}</span></div>`;
      }
      const line1 = words.slice(0,splitIdx).join(' ');
      const line2 = words.slice(splitIdx).join(' ');
      let size2 = menuSize;
      while(widthOfName(line2,size2) > availableW && size2>10) size2 -= 1;
      return `<div class="pdf-dish-line-group"><div class="pdf-dish-line"><span class="pdf-dish-name" style="font-size:${menuSize}px;white-space:nowrap">${line1}</span>${dotsInner}<span class="pdf-dish-price">${priceInner}</span></div><div class="pdf-dish-line pdf-dish-line-cont"><span class="pdf-dish-name" style="font-size:${size2}px;white-space:nowrap">${line2}</span></div></div>`;
    });
  return out;
}

// MENUS ET FORMULES UNIQUEMENT — règle absolue de Will : tout doit
// tenir sur UNE seule page, jamais de découpage en plusieurs images
// (contrairement à l'export Instagram du vrai menu, où plusieurs
// catégories/pages sont normales). Toutes les catégories de la
// formule sont combinées en un seul bloc. Ordre de repli : d'abord la
// compression d'espacement habituelle (étendue plus bas que
// d'habitude), puis, si ça ne suffit toujours pas, une réduction
// progressive de la taille de police (titre/menu/description
// ensemble, en gardant leurs proportions relatives) — jamais un
// découpage en plusieurs pages. Les règles de largeur existantes
// (une seule ligne pour le titre et le nom de plat, jamais de retour
// à la ligne) restent inchangées à chaque palier.
function buildFormulePage(cfg, ratio){
  ratio = ratio || INSTA_A4_RATIO;
  const pageH = Math.round(INSTA_RENDER_W*ratio);
  const baseTitleSize = cfg.instaTitleSize || 45;
  const baseMenuSize = cfg.instaMenuSize || 21;
  const baseDescSize = cfg.instaDescSize || 19;
  // Bien plus bas que le plancher habituel (-30%) — ici on préfère un
  // espacement très resserré à un découpage en plusieurs images.
  const COMPRESS_STEPS = [1, 0.94, 0.88, 0.82, 0.76, 0.7, 0.62, 0.54, 0.46, 0.4, 0.34];
  const FONT_SCALE_STEPS = [1, 0.92, 0.85, 0.78, 0.72, 0.66, 0.6, 0.54];

  const holder = document.createElement('div');
  holder.style.cssText = 'position:fixed;left:-99999px;top:0;visibility:hidden;';
  document.body.appendChild(holder);

  let finalHtml = null, finalScale = 1, finalCss = null, finalFontScale = 1;
  outer:
  for(const fontScale of FONT_SCALE_STEPS){
    const scaledCfg = {
      ...cfg,
      instaTitleSize: Math.max(16, Math.round(baseTitleSize*fontScale)),
      instaMenuSize: Math.max(11, Math.round(baseMenuSize*fontScale)),
      instaDescSize: Math.max(10, Math.round(baseDescSize*fontScale))
    };
    const css = buildInstaCSS(scaledCfg, ratio);
    holder.innerHTML = `<style>${css}</style><div class="pdf-page" id="__instaMeasure" style="height:auto;overflow:visible"></div>`;
    const measureEl = holder.querySelector('#__instaMeasure');

    const { contentBlocks } = buildPdfBlocks(scaledCfg);
    if(!contentBlocks.length){ finalHtml = cfg.formulePreamble || ''; finalCss = css; break; }
    const fixedBlocks = contentBlocks.map(b=>({ ...b, html: fitInstaOneLiners(b.html, holder, scaledCfg) }));
    const wholeHtml = (cfg.formulePreamble || '') + fixedBlocks.map(b=>b.html).join('');

    for(const scale of COMPRESS_STEPS){
      measureEl.style.setProperty('--space-scale', scale);
      measureEl.innerHTML = wholeHtml;
      if(measureEl.offsetHeight <= pageH){
        finalFontScale = fontScale; finalHtml = wholeHtml; finalScale = scale; finalCss = css;
        break outer;
      }
    }
  }
  // Dernier recours extrême (même la plus petite police + la
  // compression maximale ne suffiraient pas) : on force quand même une
  // seule page, à la config la plus compressée essayée — jamais de
  // deuxième image.
  if(finalHtml === null){
    const scaledCfg = { ...cfg, instaTitleSize: Math.max(16,Math.round(baseTitleSize*0.54)), instaMenuSize: Math.max(11,Math.round(baseMenuSize*0.54)), instaDescSize: Math.max(10,Math.round(baseDescSize*0.54)) };
    finalCss = buildInstaCSS(scaledCfg, ratio);
    const { contentBlocks } = buildPdfBlocks(scaledCfg);
    const fixedBlocks = contentBlocks.map(b=>({ ...b, html: fitInstaOneLiners(b.html, holder, scaledCfg) }));
    finalHtml = (cfg.formulePreamble || '') + fixedBlocks.map(b=>b.html).join('');
    finalScale = 0.34;
    finalFontScale = 0.54;
  }

  // Les réglages de l'utilisateur sont appliqués ici, sur l'échelle
  // que l'ajustement vient de retenir : ils ne peuvent donc plus être
  // repris par celui-ci. Le contenu peut déborder un peu si on
  // agrandit beaucoup, ce qui est exactement l'effet demandé.
  // BUG FIX (le + / − des sections et des plats restait sans effet) :
  // reconstruire avec une taille plus grande ne servait à rien, parce
  // que fitInstaOneLiners refixe la taille de CHAQUE titre et de
  // CHAQUE nom de plat en dur dans le HTML, pour qu'ils tiennent sur
  // une ligne — un plafond qui dépend de la largeur du texte, pas du
  // réglage. On met donc à l'échelle les tailles que cet ajustement
  // vient d'écrire : la proportion entre les lignes est conservée, et
  // le réglage de l'utilisateur s'applique toujours.
  const pct = cfg.fmtPct;
  if(pct && (pct.title!==100 || pct.menu!==100 || pct.desc!==100)){
    // BUG FIX (prix plus gros que les noms) : seuls les noms étaient
    // mis à l'échelle. Le prix, lui, gardait sa taille et un plancher,
    // donc il ressortait dès qu'on réduisait. On rebâtit la CSS avec
    // la taille des plats corrigée : le prix la suit.
    if(pct.desc!==100 || pct.menu!==100){
      finalCss = buildInstaCSS({ ...cfg,
        instaTitleSize: baseTitleSize,
        instaMenuSize: Math.max(8, Math.round(baseMenuSize*pct.menu/100)),
        instaDescSize: Math.max(8, Math.round(baseDescSize*pct.desc/100))
      }, ratio);
    }
    const scaleInline = (html, cls, factor) => factor===100 ? html :
      html.replace(new RegExp('(class="'+cls+'"[^>]*?font-size:)(\\d+(?:\\.\\d+)?)px','g'),
        (m,head,n)=>head+Math.max(8, Math.round(parseFloat(n)*factor/100))+'px');
    finalHtml = scaleInline(finalHtml, 'pdf-cat', pct.title);
    finalHtml = scaleInline(finalHtml, 'pdf-dish-name', pct.menu);
  }

  // Rattrapage : l'ajustement automatique a choisi son échelle AVANT
  // que les réglages de l'utilisateur soient appliqués, donc un menu
  // très agrandi peut désormais déborder du cadre. On resserre alors
  // les écarts — entre les plats, et entre une section et ses plats —
  // jusqu'à ce que tout rentre. La taille du texte, elle, n'est jamais
  // touchée : c'est le choix de l'utilisateur, il doit être respecté.
  try{
    const styleEl=holder.querySelector('style');
    if(styleEl) styleEl.textContent=finalCss;
    // measureEl est local à la boucle ci-dessus : on le reprend ici.
    const measure=holder.querySelector('#__instaMeasure');
    if(!measure) throw 0;
    measure.innerHTML=finalHtml;
    const TIGHTEN=[finalScale, 0.9, 0.8, 0.7, 0.6, 0.5, 0.42, 0.34, 0.28, 0.22, 0.16];
    for(const sc of TIGHTEN){
      if(sc>finalScale) continue;
      measure.style.setProperty('--space-scale', sc);
      if(measure.offsetHeight <= pageH){ finalScale = sc; break; }
      finalScale = sc; // même au plancher, on garde le plus serré
    }
  }catch(e){}

  document.body.removeChild(holder);
  return { pages: [{ html: finalHtml, spaceScale: finalScale, tabLabel: 'formule' }], css: finalCss };
}

function buildInstaPages(cfg, ratio){
  ratio = ratio || INSTA_RATIO;
  const { contentBlocks } = buildPdfBlocks(cfg);
  const groups = [];
  let current = null;
  contentBlocks.forEach(b=>{
    if(b.html.includes('class="pdf-cat"')){ current = []; groups.push(current); }
    if(current) current.push(b);
  });

  const css = buildInstaCSS(cfg, ratio);
  const pageH = Math.round(INSTA_RENDER_W*ratio);
  const holder = document.createElement('div');
  holder.style.cssText = 'position:fixed;left:-99999px;top:0;visibility:hidden;';
  holder.innerHTML = `<style>${css}</style><div class="pdf-page" id="__instaMeasure" style="height:auto;overflow:visible"></div>`;
  document.body.appendChild(holder);
  const measureEl = holder.querySelector('#__instaMeasure');
  const heightOf = (html, scale) => {
    measureEl.style.setProperty('--space-scale', scale ?? 1);
    measureEl.innerHTML = html;
    return measureEl.offsetHeight;
  };

  const COMPRESS_STEPS = [1, 0.94, 0.88, 0.82, 0.76, 0.7];
  const bestScaleFor = html => {
    for(const s of COMPRESS_STEPS){
      if(heightOf(html, s) <= pageH) return s;
    }
    return null; // ne rentre même pas compressé au maximum
  };
  // Répartition la plus équilibrée possible de `n` éléments en `parts`
  // groupes — ex. n=5, parts=2 → [3,2], jamais [4,1]. Règle absolue
  // demandée par Will pour la répartition sur plusieurs images.
  const balancedSplit = (n, parts) => {
    const base = Math.floor(n/parts), rem = n % parts;
    return Array.from({length:parts}, (_, i) => base + (i < rem ? 1 : 0));
  };

  const result = [];
  groups.forEach((group, groupIdx)=>{
    const preamble = groupIdx === 0 ? (cfg.formulePreamble || '') : '';
    const tabIdMatch = group[0].html.match(/data-tab-id="([^"]+)"/);
    const tabId = tabIdMatch ? tabIdMatch[1] : null;
    const tb = tabId ? (cfg.tabsSource || DATA.tabs).find(x=>x.id===tabId) : null;
    const tabLabel = tb ? t(tb.label) : null;
    const headerMatch = group[0].html.match(/^<h2 class="pdf-cat"[\s\S]*?<\/h2>/);
    const headerHtml = headerMatch ? headerMatch[0] : '';

    // Boissons exclues par défaut sur Instagram (Will ne fait que des
    // restaurants) — case à cocher par catégorie pour les inclure
    // explicitement (tb.instaIncludeBevs). Si toute la catégorie est
    // composée de boissons et n'est pas cochée, aucune image générée
    // pour elle.
    const filtered = (tb && tb.instaIncludeBevs) ? group : group.filter(b=>b.cardType!=='bevs');
    if(!filtered.length) return;

    // Taille de police "une seule ligne" fixée indépendamment sur
    // chaque bloc, avant toute décision de découpage — voir
    // fitInstaOneLiners. Si le tout premier bloc restant après le
    // filtrage boissons n'a plus le titre de catégorie (parce que le
    // vrai premier bloc d'origine a été filtré), on le réinjecte.
    const fixedBlocks = filtered.map(b=>({ ...b, html: fitInstaOneLiners(b.html, holder, cfg) }));
    if(!fixedBlocks[0].html.includes('class="pdf-cat"')){
      fixedBlocks[0] = { ...fixedBlocks[0], html: headerHtml + fixedBlocks[0].html };
    }

    // Le préambule (titre + texte libre d'une formule) compte dans le
    // calcul "tout tenir sur une page", comme le reste — jamais ajouté
    // après coup sans vérifier qu'il rentre.
    const wholeHtml = preamble + fixedBlocks.map(b=>b.html).join('');
    const wholeScale = bestScaleFor(wholeHtml);
    if(wholeScale !== null){
      result.push({ html: wholeHtml, spaceScale: wholeScale, tabId, tabLabel });
      return;
    }

    // Ne rentre pas en une seule image, même compressée à -30% —
    // règle absolue de Will : répartir sur autant de pages que
    // nécessaire, en équilibrant le NOMBRE de plats aussi près que
    // possible entre elles (jamais 4 et 1 quand 3 et 2 est possible),
    // jamais en coupant un plat au milieu. Le titre de catégorie n'est
    // PAS répété sur les pages suivantes — demande explicite de Will :
    // c'est la suite du même menu, pas une nouvelle catégorie.
    const n = fixedBlocks.length;
    let placed = false;
    for(let parts=2; parts<=n && !placed; parts++){
      const sizes = balancedSplit(n, parts);
      const pages = [];
      let idx = 0, allFit = true, sliceI = 0;
      for(const size of sizes){
        const slice = fixedBlocks.slice(idx, idx+size);
        idx += size;
        const sliceHtml = (sliceI===0 ? preamble : '') + slice.map(b=>b.html).join('');
        sliceI++;
        const scale = bestScaleFor(sliceHtml);
        if(scale === null){ allFit = false; break; }
        pages.push({ html: sliceHtml, spaceScale: scale, tabId, tabLabel });
      }
      if(allFit){ result.push(...pages); placed = true; }
    }
    if(!placed){
      // Dernier recours extrême (même 1 plat par page ne rentrerait
      // pas) : une seule image, compressée au maximum, plutôt que de
      // ne rien produire.
      result.push({ html: wholeHtml, spaceScale: COMPRESS_STEPS[COMPRESS_STEPS.length-1], tabId, tabLabel });
    }
  });

  document.body.removeChild(holder);
  return result;
}


// CSS for a given config + format
function buildPdfCSS(cfg){
  const isGbiz = cfg.format === 'gbiz';
  const isA5 = !isGbiz && cfg.paperSize === 'a5';
  // True A4/A5 physical page size at 96dpi (210×297mm / 148×210mm).
  // @page margin is 0 below — the PDF itself must be genuinely
  // edge-to-edge (background/frame reach the true page border), no
  // browser-added margin; the only inset left is our own deliberate
  // `pad`, a design choice rather than a print-driver default. A5's
  // own true dimensions (559×794px) sit at ~0.70-0.72 of A4's, which is
  // why the existing 0.72 scale (already used for every font-size/
  // spacing below) stays a good approximation rather than needing a
  // second, separately-tuned set of numbers.
  const A5_SCALE = 0.72;
  const scale = isGbiz ? 1 : (isA5 ? A5_SCALE : 1);
  const px = v => Math.round(v*scale*100)/100;
  const pageW = isGbiz ? 612 : (isA5 ? Math.round(794*A5_SCALE) : 794);
  // Must match paginatePdfPages()'s fullPageHeightPx exactly — both need
  // the SAME physical page height, one to size the box, the other to
  // budget how much content fits in it.
  const pageH = isGbiz ? null : (isA5 ? 794 : 1123);
  const pad = isGbiz ? 45 : px(30);
  const maritime = cfg.template === 'maritime';
  return `
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Open+Sans:wght@300;400;600&family=Playfair+Display:wght@400;600&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{margin:0;padding:0;background:${cfg.menuBgColor||cfg.bgColor||'#FFFDF8'}}
  /* BUG FIX: without this, browsers print backgrounds/colors differently
     from what's shown on screen by default (usually to save ink) — this
     is exactly what made the live preview and the actual printed/PDF
     output look different (background color, accent yellow, etc.). This
     forces the print output to reproduce colors exactly as configured,
     so the two always match — one standard recipe, no per-client tweaking. */
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important}
  .pdf-page{--space-scale:1;--top-pad-trim:0px;--solo-scale:.92;font-family:'Open Sans',sans-serif;color:#1a1a1a;background:${cfg.menuBgColor||cfg.bgColor||'#FFFDF8'};width:${pageW}px;${pageH?`min-height:${pageH}px;`:''}padding-top:calc(${pad}px - var(--top-pad-trim));padding-right:${pad}px;padding-bottom:${pad}px;padding-left:${pad}px;margin:0 auto;position:relative}
  ${cfg.showFrame!==false?`.pdf-page::before{content:'';position:absolute;inset:${px(14)}px;border:1.5px solid ${cfg.menuFrameColor};opacity:.4;pointer-events:none}`:''}
  .pdf-header{text-align:center;margin-bottom:calc(${isGbiz?18:px(33)}px * var(--space-scale));position:relative}
  .pdf-logo-text{font-family:'Cormorant Garamond',serif;font-size:${isGbiz?24.86:px(22)}px;font-weight:700;color:var(--navy,#10285E);margin:0 auto 12px;display:block;text-align:center}
.pdf-logo{max-width:${isGbiz?100:px(180)}px;max-height:${isGbiz?70:px(120)}px;object-fit:contain;margin:0 auto 8px;display:block}
  .pdf-title{font-family:'Cormorant Garamond',serif;font-size:${isGbiz?49.72:px(32)}px;font-weight:700;color:${cfg.menuTitleColor};line-height:1.1}
  .pdf-sub{font-size:${isGbiz?14.69:px(11)}px;letter-spacing:.16em;text-transform:uppercase;color:#999;margin-top:6px}
  .pdf-section{margin-bottom:calc(${isGbiz?100:px(52)}px * var(--space-scale));break-inside:avoid;page-break-inside:avoid}

// Live preview into the admin iframe
function updatePdfPreview(){
  const frame = document.getElementById('pdfPreviewFrame');
  if(!frame) return;
  const cfg = pdfCfg();
  const isGbiz = cfg.format === 'gbiz';
  // The live preview always renders at A5 proportions regardless of the
  // real paperSize setting — A4 in this narrow admin panel ends up so
  // zoomed out it barely reads as a page. A4 and A5 share the exact
  // same width:height ratio (ISO 216), so this is purely cosmetic here;
  // the real export (exportA4Print) still uses the actual cfg.paperSize.
  const previewCfg = isGbiz ? cfg : { ...cfg, paperSize: 'a5' };
  const css = buildPdfCSS(previewCfg);
  const menu = buildPdfMenuHTML(previewCfg);
  const isA5 = !isGbiz; // preview is always A5-shaped unless it's the gbiz image format
  const previewMaxW = isGbiz ? 612 : Math.round(794*0.72);
  // For A4: overlay page-break guides every ~1040px (A4 ratio at 700px width)
  const doc = `<!DOCTYPE html><html><head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans+Condensed:wght@300;700&family=Lovelo:wght@400;700&family=Open+Sans:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet"><meta charset="UTF-8"><style>${css}
    html,body{overflow-x:hidden}
    body{background:#e8e8e8;padding:16px 0;margin:0}
    /* Preview-only: shrink the page to fit whatever width the iframe
       actually has instead of the fixed print width — real size shows
       up when they hit "Imprimer le menu". Font sizes stay in real px
       (not %), so at small widths text can look tiny; that's expected,
       it's a layout preview, not a legibility test. */
    .pdf-page{width:100%!important;max-width:${previewMaxW}px;box-shadow:0 2px 12px rgba(0,0,0,.15)}
    ${!isGbiz?`.pdf-page{position:relative}`:''}
  </style></head><body><div class="pdf-page" id="pdfPageEl">${menu}</div>
  <script>
    // Draw page-break guide lines for A4 so user sees where pages cut
    (function(){
      var isGbiz=${isGbiz};
      if(isGbiz) return;
      var page=document.getElementById('pdfPageEl');
      var w=page.offsetWidth;
      var pageH=Math.round(w*297/210); // A4 ratio
      var total=page.offsetHeight;
      var n=Math.floor(total/pageH);
      for(var i=1;i<=n;i++){
        var line=document.createElement('div');
        line.style.cssText='position:absolute;left:0;right:0;top:'+(i*pageH)+'px;border-top:2px dashed #d33;z-index:99;pointer-events:none';
        var lbl=document.createElement('div');
        lbl.textContent='— coupure page '+(i+1)+' —';
        lbl.style.cssText='position:absolute;right:6px;top:'+(i*pageH+2)+'px;font:10px sans-serif;color:#d33;background:#fff;padding:1px 5px;z-index:100';
        page.appendChild(line);page.appendChild(lbl);
      }
    })();
  <\/script>
  </body></html>`;
  frame.srcdoc = doc;
}

// Export: A4 → print dialog; Google Business → PNG via html2canvas at 3064x5447

function doPdfExport(){

    exportGbizImage(cfg);
  } else {
