<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Drevici Oyster · Maison ostréicole</title><meta name="robots" content="noindex"><meta name="theme-color" content="#2b3550">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0b1530}body{font-family:Jost,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.lp{position:fixed;top:0;left:0;right:0;height:100vh;height:100lvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;overflow:hidden}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dim{position:absolute;inset:0;background:rgba(5,12,30,var(--dim,.55))}
.in{position:relative;width:100%;display:flex;flex-direction:column;align-items:center}
.k{font-size:16px;letter-spacing:.28em;text-transform:uppercase;color:#ffc61a;font-weight:600;text-shadow:0 0 22px rgba(0,0,0,.85),0 0 8px rgba(0,0,0,.7),0 1px 2px rgba(0,0,0,.6)}
.name{font-family:'Playfair Display',serif;font-weight:700;letter-spacing:.04em;font-size:34px;margin:4px 0 8px;text-shadow:0 0 30px rgba(0,0,0,.6)}
.tag{font-size:15.5px;font-weight:500;color:#fff;letter-spacing:.04em;text-shadow:0 0 22px rgba(0,0,0,.85),0 0 8px rgba(0,0,0,.7),0 1px 2px rgba(0,0,0,.6)}
.tag .pc{display:none}.bgv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:34px;width:min(540px,100%)}
.ch{border:1.5px solid rgba(255,255,255,.85);border-radius:14px;padding:18px 10px;background:rgba(0,0,0,var(--btn,.18));transition:background .2s}
.nob .ch{border-color:transparent}
.ch:hover{background:rgba(0,0,0,calc(var(--btn,.18) + .12))}
.ch b{display:block;font-family:'Playfair Display',serif;font-size:26px;margin-bottom:6px}
.ch small{display:block;font-size:13px;font-weight:500;color:#fff;text-shadow:0 0 10px rgba(0,0,0,.7)}
.hint{font-size:14px;font-weight:500;color:#fff;margin-top:16px;text-shadow:0 0 22px rgba(0,0,0,.85),0 0 8px rgba(0,0,0,.7),0 1px 2px rgba(0,0,0,.6)}
@media(min-width:900px){.name{font-size:52px}.ch{padding:24px 12px}.ch b{font-size:30px}.k{font-size:19px}.tag{font-size:18px}.tag .pc{display:inline}.tag .mo{display:none}.ch small{font-size:14px}.hint{font-size:15px}}
.sl{opacity:var(--lo,.8);filter:drop-shadow(0 0 14px rgba(0,0,0,.7));display:block}.sl{width:112px;height:112px;margin-bottom:18px}@media(min-width:900px){.sl{width:135px;height:135px}}
@media(max-width:899px){.sl{position:absolute;top:calc(env(safe-area-inset-top) + 64px);left:50%;transform:translateX(-50%);margin:0}}
</style></head><body>
<!-- Page d'entrée des deux établissements. Les valeurs écrites ici servent de repli ; les réglages
     viennent de l'admin de Paris (Mon site → Page d'entrée), rangés dans menu_data.data.entree. -->
<main class="lp" style="--dim:.55">
  <img class="bg" id="eBg" src="media/accueil-fond.jpg" alt="">
  <div class="dim"></div>
  <img class="sl" id="eLogo" src="media/accueil-logo.png" alt="Drevici Oyster">
  <div class="in">
    <div class="k" id="eK">Maison ostréicole</div>
    <h1 class="name" id="eName">DREVICI OYSTER</h1>
    <div class="tag"><span class="pc" id="eTag">Producteurs-ostréiculteurs · De la mer à votre assiette</span><span class="mo" id="eTagM">De la mer à votre assiette</span></div>
    <nav class="two">
      <a class="ch" id="eB1" href="https://drevici.beltab.app/"><b>Paris</b><small>8 rue Biot, 75017 Paris</small></a>
      <a class="ch" id="eB2" href="https://drevici-surzur.beltab.app/"><b>Surzur</b><small>Pentes, 56450 Surzur</small></a>
    </nav>
  </div>
</main>
<script>
// Réglages de la page d'entrée : admin de Paris → Mon site → Page d'entrée (menu_data.data.entree).
// Préview : copie de test « drevici-test » ; à publier, remplacer par « drevici ».
const ENTREE_SLUG='drevici-test';
const SB_URL='https://fdbzzkzfipzabryfanun.supabase.co', SB_KEY='sb_publishable_9PaqDuXnWV3aOCBPk9ImmQ_4YgYTU9n';
(async()=>{
  try{
    const r=await fetch(SB_URL+'/rest/v1/menu_data?select=data->entree&client_slug=eq.'+encodeURIComponent(ENTREE_SLUG),{headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}});
    const rows=await r.json(); const e=rows&&rows[0]&&rows[0].entree; if(!e) return;
    const $=id=>document.getElementById(id), lp=document.querySelector('.lp');
    const txt=(id,v)=>{ if(typeof v==='string'&&v.trim()) $(id).textContent=v; };
    if(e.dim!=null) lp.style.setProperty('--dim',Math.min(.9,Math.max(0,e.dim/100)));
    if(e.btn!=null) lp.style.setProperty('--btn',Math.min(.9,Math.max(0,e.btn/100)));
    if(e.border===false) lp.classList.add('nob');
    if(e.bgType==='video'&&e.video){ const v=document.createElement('video'); v.className='bgv'; v.src=e.video; v.muted=true; v.loop=true; v.autoplay=true; v.playsInline=true; v.setAttribute('playsinline',''); $('eBg').replaceWith(v); v.play().catch(()=>{}); }
    else if(e.image) $('eBg').src=e.image;
    if(e.logoOn===false) $('eLogo').remove(); else { if(e.logo) $('eLogo').src=e.logo; if(e.logoOpacity!=null) lp.style.setProperty('--lo',Math.min(1,Math.max(.1,e.logoOpacity/100))); }
    txt('eK',e.kicker); txt('eName',e.name); txt('eTag',e.tagline); txt('eTagM',e.taglineMobile);
    [['eB1',e.b1],['eB2',e.b2]].forEach(([id,b])=>{ if(!b) return; const a=$(id); if(b.label) a.querySelector('b').textContent=b.label; if(typeof b.sub==='string') a.querySelector('small').textContent=b.sub; if(b.url) a.href=b.url; });
    if(e.kicker||e.name) document.title=(e.name||'Drevici Oyster')+' · '+(e.kicker||'Maison ostréicole');
  }catch(err){ console.warn('Réglages de la page d\'entrée illisibles, valeurs par défaut :',err); }
})();
</script>
</body></html>
