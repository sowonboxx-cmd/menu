<!-- Page d'entrée des deux établissements. Les textes, le logo et l'assombrissement se règlent dans l'admin
     de Paris (Mon site → Page d'entrée, menu_data.data.entree) ; le fond est la vidéo de Paris, sauf si
     une autre vidéo y est choisie. -->
<main class="lp" style="--dim:.4">
  <img class="bg" id="eBg" src="https://media.beltab.app/drevici/accueil/accueil-02.webp" alt="">
  <div class="dim"></div>
  <div class="in">

    <div class="k" id="eK">Maison ostréicole</div>
    <h1 class="name" id="eName">DREVICI OYSTER</h1>

  </div>
  <nav class="where" aria-label="Nos adresses">

         eB1 = Paris, eB2 = Surzur, comme dans les réglages de l'admin. -->
    <a id="eB2" href="https://drevici-surzur.beltab.app/"><b>Surzur</b><small>Pentès, 56450 Surzur</small></a>
    <a id="eB1" href="https://drevici.beltab.app/"><b>Paris</b><small>8 rue Biot, 75017 Paris</small></a>
  </nav>
</main>
<script>
// Fond : vidéo de Drevici Oyster Paris (la même que la couverture du site de Paris).
const PARIS_VIDEO='https://media.beltab.app/drevici/uploads/video-20261012213240-f5c5.mp4';
function setVideo(src){
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return; // la photo reste
  const img=document.getElementById('eBg'); if(!img) return;
  const v=document.createElement('video'); v.className='bgv'; v.muted=true; v.loop=true; v.autoplay=true; v.playsInline=true;
  v.setAttribute('playsinline',''); v.setAttribute('muted',''); v.preload='auto'; v.poster=img.src; v.src=src;
  img.after(v); v.play().catch(()=>{});
}
setVideo(PARIS_VIDEO);
// Réglages de la page d'entrée : admin de Paris → Mon site → Page d'entrée (menu_data.data.entree).
const ENTREE_SLUG='drevici';
const SB_URL='https://fdbzzkzfipzabryfanun.supabase.co', SB_KEY='sb_publishable_9PaqDuXnWV3aOCBPk9ImmQ_4YgYTU9n';
(async()=>{
  try{
    const r=await fetch(SB_URL+'/rest/v1/menu_data?select=data->entree&client_slug=eq.'+encodeURIComponent(ENTREE_SLUG),{headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}});
    const rows=await r.json(); const e=rows&&rows[0]&&rows[0].entree; if(!e) return;
    const $=id=>document.getElementById(id), lp=document.querySelector('.lp');
    const txt=(id,v)=>{ if(typeof v==='string'&&v.trim()) $(id).textContent=v; };
    if(e.dim!=null) lp.style.setProperty('--dim',Math.min(.8,Math.max(0,e.dim/100)));
    // Une autre vidéo choisie dans l'admin remplace celle de Paris ; une simple photo ne la remplace plus.
    if(e.bgType==='video'&&e.video&&e.video!==PARIS_VIDEO){ const v=document.querySelector('.bgv'); if(v){ v.src=e.video; v.play().catch(()=>{}); } }
    // 26/10 : logo propre (anneau intérieur rempli de blanc : la vidéo passait au travers et le badge
    // paraissait mal détouré). L'ancien fichier réglé dans l'admin est remplacé par le propre, et le logo
    // est toujours opaque : à 80 %, la vidéo se voyait à travers.
    if(e.logoOn===false) $('eLogo').remove(); else { if(e.logo && e.logo!=='media/accueil-logo.png') $('eLogo').src=e.logo; }
    txt('eK',e.kicker); txt('eName',e.name); txt('eTag',e.tagline); txt('eTagM',e.taglineMobile);
    [['eB1',e.b1],['eB2',e.b2]].forEach(([id,b])=>{ if(!b) return; const a=$(id); if(b.label) a.querySelector('b').textContent=b.label; if(typeof b.sub==='string'&&b.sub.trim()) a.querySelector('small').textContent=b.sub; if(b.url) a.href=b.url; });
    if(e.kicker||e.name) document.title=(e.name||'Drevici Oyster')+' · '+(e.kicker||'Maison ostréicole');
  }catch(err){ console.warn('Réglages de la page d\'entrée illisibles, valeurs par défaut :',err); }
})();
</script>
