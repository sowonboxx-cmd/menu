<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Hannah · le parcours</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Jost:wght@400;500;600&display=swap">
<style>:root{--navy:#10285E;--pink:#E8336B}*{box-sizing:border-box;margin:0}body{background:#FFF6EE;color:#3d3a34;font-family:Jost,system-ui,sans-serif;padding:32px 16px 60px}
header,main{max-width:1180px;margin:0 auto}h1{font:800 40px/1 'Baloo 2',system-ui;color:var(--navy)}h1 em{font-style:normal;color:var(--pink)}
header p{font-size:15px;margin-top:8px;max-width:640px;line-height:1.5}
main{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start}
h2{flex-basis:100%;font:800 26px 'Baloo 2',system-ui;color:var(--navy);margin-top:30px}
figure{width:340px;max-width:100%;background:#fff;border-radius:22px;padding:12px}
figure.mail,figure:not(.phone):not(.mail){width:420px}
figure img,figure video{display:block;width:100%;border-radius:14px}
figcaption{font-size:14px;line-height:1.45;padding:12px 4px 4px}figcaption b{display:block;font:800 18px 'Baloo 2',system-ui;color:var(--pink);margin-bottom:2px}
figcaption a{display:inline-block;margin-top:10px;background:var(--navy);color:#fff;text-decoration:none;font:600 13px Jost;border-radius:99px;padding:8px 16px}
</style></head><body><header><h1>Anniversaire de <em>Hannah</em> · de A à Z</h1><p>Toutes les étapes dans l'ordre. Les liens « Ouvrir en direct » ouvrent les vraies pages en mode test : rien n'est enregistré.</p></header><main><h2>Avant la soirée</h2><figure class=""><img src="media/hannah-parcours/00.jpg" alt="" loading="lazy"><figcaption><b>L'affiche A4</b>Passée de main en main. Le QR (avec votre renard) ouvre la page de Hannah.<a href="media/hannah-parcours/Hannah-QR-A4.pdf" target="_blank">Télécharger le PDF</a></figcaption></figure><h2>Pendant la soirée</h2><figure class="phone"><video src="media/hannah-parcours/intro.mp4" autoplay muted loop playsinline></video><figcaption><b>0 · L'intro (4 s)</b>Au scan : la photo charge en grand façon story, confettis, puis la photo et le titre glissent à leur place.<a href="https://drevici-preview.beltab.app/paris/hannah?intro" target="_blank">Ouvrir en direct</a></figcaption></figure><figure class="phone"><img src="media/hannah-parcours/02.jpg" alt="" loading="lazy"><figcaption><b>1 · La page d'accueil</b>La règle des bouteilles de Chardonnay, le club, le tirage.<a href="https://drevici-preview.beltab.app/paris/hannah?test" target="_blank">Ouvrir en direct</a></figcaption></figure><figure class="phone"><img src="media/hannah-parcours/03.jpg" alt="" loading="lazy"><figcaption><b>2 · Le message</b>Prénom, nom, email, message. Le club n'est jamais pré-coché ; s'il l'active, le téléphone est demandé.</figcaption></figure><figure class="phone"><img src="media/hannah-parcours/04.jpg" alt="" loading="lazy"><figcaption><b>3 · Envoyé, membre du club</b>Pluie de confettis. Ticket bleu avec nœud et code : sa coupe de champagne pour la prochaine visite.</figcaption></figure><figure class="phone"><img src="media/hannah-parcours/05.jpg" alt="" loading="lazy"><figcaption><b>3 bis · Envoyé, sans le club</b>Même coupe, mais verrouillée (gris). Le bouton « Join » la débloque.</figcaption></figure><figure class="phone"><img src="media/hannah-parcours/06.jpg" alt="" loading="lazy"><figcaption><b>4 · Le mur live</b>Sur un écran ou votre téléphone : compteur, bouteilles gagnées, derniers messages.<a href="https://drevici-preview.beltab.app/paris/hannah-live?test" target="_blank">Ouvrir en direct</a></figcaption></figure><h2>Après minuit</h2><figure class="phone"><img src="media/hannah-parcours/07.jpg" alt="" loading="lazy"><figcaption><b>5 · Le tirage (vous seul)</b>Le bouton « Draw 3 names » n'apparaît qu'avec votre lien secret. Juste en dessous, vos 3 emails prêts à partir.</figcaption></figure><figure class="mail"><img src="media/hannah-parcours/08.jpg" alt="" loading="lazy"><figcaption><b>6 · L'email aux 3 gagnants</b>Leur code dîner, les noms des deux autres, les 3 étapes, le lien de réservation, et s'ils ne peuvent pas venir : passer le code à un ami (sauf vous). Vous êtes exclu du tirage.</figcaption></figure><h2>Dimanche</h2><figure class="mail"><img src="media/hannah-parcours/09.jpg" alt="" loading="lazy"><figcaption><b>7 · L'email de Hannah</b>Les 3 gagnants, la bouteille de chardonnay, les photos de la soirée et tous les messages.</figcaption></figure><figure class="phone"><img src="media/hannah-parcours/10.jpg" alt="" loading="lazy"><figcaption><b>8 · Son livre</b>Sa page complète, avec « Share as a story ».<a href="https://drevici-preview.beltab.app/paris/hannah-book?demo" target="_blank">Ouvrir en direct</a></figcaption></figure><figure class="phone"><img src="media/hannah-parcours/11.jpg" alt="" loading="lazy"><figcaption><b>9 · Sa story Instagram</b>L'image 1080 × 1920 générée depuis son livre.</figcaption></figure></main></body></html>
