const img=src=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src});
function wrap(x,t,maxW){const w=t.split(' '),L=[];let l='';for(const s of w){const n=l?l+' '+s:s;if(x.measureText(n).width>maxW&&l){L.push(l);l=s}else l=n}if(l)L.push(l);return L}

const COLS=['#E8336B','#F6C945','#3B82F6','#2BB673','#FF8A3D','#10285E'];

function confetti(x,r,n){for(let i=0;i<n;i++){const X=r()*1080,Y=r()*1920;x.save();x.translate(X,Y);x.rotate(r()*6.28);const c=COLS[i%6];x.fillStyle=c;x.strokeStyle=c;const t=r();

const ST=[{bg:'#FFE680',ink:'#3d3a34',nm:'#E8336B',tape:1},{bg:'#FFD3E0',ink:'#3d3a34',nm:'#10285E'},{bg:'#10285E',ink:'#fff',nm:'#F6C945'},{bg:'#CFE3FF',ink:'#10285E',nm:'#E8336B',tape:1},{bg:'#fff',ink:'#3d3a34',nm:'#E8336B'},{bg:'#C9F0D9',ink:'#10285E',nm:'#E8336B',tape:1}];
function sticker(x,m,X,Y,W,rot,k){const st=ST[k%ST.length];x.font='700 46px Caveat';const L=wrap(x,m.msg,W-72).slice(0,5);const H=58+L.length*50+66;

let SLIDES=null;
async function openStories(){const pv=document.getElementById('prev'),st=document.getElementById('strip');st.innerHTML='<p class="wait">Preparing your stories…</p>';pv.classList.add('on');
  if(!SLIDES){const cs=await storySlides();SLIDES=await Promise.all(cs.map(toBlob))}
  st.innerHTML=SLIDES.map((b,i)=>`<img src="${URL.createObjectURL(b)}" alt="Story ${i+1}">`).join('');
  document.getElementById('ptxt').textContent=`${SLIDES.length} stories, swipe to see them all`;}
async function shareAll(){const fs=SLIDES.map((b,i)=>new File([b],`hannah-story-${i+1}.jpg`,{type:'image/jpeg'}));
  if(navigator.canShare&&navigator.canShare({files:fs})){try{await navigator.share({files:fs});return}catch(e){if(e.name==='AbortError')return}}
  if(/iPhone|iPad|Android/i.test(navigator.userAgent)){document.getElementById('ptxt').textContent='Press and hold each image to save it, then post them in your story.';return}
  fs.forEach(f=>{const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click()})}
document.getElementById('share').onclick=openStories;
document.getElementById('save').onclick=async()=>{await openStories();shareAll()};
document.getElementById('pshare').onclick=shareAll;
document.getElementById('pclose').onclick=()=>document.getElementById('prev').classList.remove('on');
// ── photos : on touche, elles s'agrandissent et se passent comme des cartes ──
function openLb(k){const lb=document.getElementById('lb'),tr=document.getElementById('lbt');tr.innerHTML=PHOTOS.map(p=>`<div class="sl"><img src="${p}" alt=""></div>`).join('');
  lb.classList.add('on');document.body.style.overflow='hidden';requestAnimationFrame(()=>{tr.scrollLeft=k*tr.clientWidth;cnt()})}
function cnt(){const tr=document.getElementById('lbt');document.getElementById('lbn').textContent=`${Math.round(tr.scrollLeft/tr.clientWidth)+1} / ${PHOTOS.length}`}
document.getElementById('lbt').addEventListener('scroll',cnt,{passive:true});
document.getElementById('lbx').onclick=()=>{document.getElementById('lb').classList.remove('on');document.body.style.overflow=''};
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('lbx').click()});
document.getElementById('app').addEventListener('click',e=>{const t=e.target.closest('.photos img');if(t)openLb([...document.querySelectorAll('.photos img')].indexOf(t))});

load();
</script>
