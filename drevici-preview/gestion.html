<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Gestion · Beltab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=DM+Serif+Display&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/morphdom@2.7.4/dist/morphdom-umd.min.js"></script>
<style>
:root{
  --bg:#f5f3ef; --card:#fff; --soft:#f1eee8; --ink:#16181d; --mut:#6b7080; --line:#ece8e0;
  --ok:#1f9d55; --ok-soft:#e2f4ea; --alert:#d93636; --alert-soft:#fbe7e7;
  --r:22px;
  --brand:#1d4f7a; --on-brand:#fff; --on-brand-mut:rgba(255,255,255,.74); --brand-tint:rgba(255,255,255,.15); --brand-soft:#e3ebf2; --brand-text:#1d4f7a;
  --accent:#f0a830; --on-accent:#16181d; --accent-soft:#fdf1dc; --accent-text:#8a5a00;
  --display:"Inter",system-ui,sans-serif; --display-w:800;
  /* réglages : 3 couleurs fixes, lisibles quel que soit le thème */
  --set-a:#e4edfb; --set-a-ink:#2557a7; --set-b:#e3f1e6; --set-b-ink:#2f7a45; --set-c:#ece9e3; --set-c-ink:#5d6170;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.num{font-variant-numeric:tabular-nums}


.hd{display:flex;align-items:center;gap:12px;margin:2px 0 16px}
.logo{width:48px;height:48px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:18px;flex:none}
.hd h1{margin:0;font-family:var(--display);font-weight:var(--display-w);font-size:22px;line-height:1.05}
.hd p{margin:3px 0 0;font-size:12.5px;color:var(--mut)}
.live{color:var(--ok);font-weight:700}
.live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:5px;vertical-align:1px}
.site{margin-left:auto;font-size:12.5px;font-weight:700;background:var(--card);border-radius:999px;padding:9px 13px;white-space:nowrap}

.c{border-radius:var(--r);padding:18px;background:var(--card);position:relative;overflow:hidden;min-width:0}
.c h3{margin:0;font-size:15px;font-weight:800;display:flex;align-items:center;gap:10px}
.c h3 .more{margin-left:auto;font-size:12.5px;font-weight:800;color:var(--accent-text);white-space:nowrap}
.ico{width:34px;height:34px;border-radius:11px;background:var(--soft);display:flex;align-items:center;justify-content:center;flex:none}
.ico svg,.dot svg{width:18px;height:18px;display:block}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;border-radius:999px;padding:4px 9px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.alert{background:var(--alert-soft);color:var(--alert)}.pill.soon{background:var(--ink);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:13px;padding:12px 14px;font-size:13.5px;font-weight:800;background:var(--accent-btn,var(--accent));color:var(--on-accent-btn,var(--on-accent));white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn.w{background:var(--card);color:var(--ink)}
.btn.g{background:var(--soft);color:var(--ink)}
.sec{font-size:13.5px;font-weight:800;margin:24px 4px 10px;display:flex;align-items:center;justify-content:space-between}

/* 1 · réservations */
.resa{background:var(--brand);color:var(--on-brand)}
.resa .sub{font-size:12px;color:var(--on-brand-mut)}
.resa .ico{background:var(--brand-tint);color:var(--on-brand)}
.resa h3 .more{color:var(--on-brand)}
.svc{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));gap:8px;margin-top:12px}
.svc>div{background:var(--brand-tint);border-radius:15px;padding:12px}
.svc .l{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.82}
.svc .n{font-size:25px;font-weight:900;margin-top:2px}
.svc .n small{font-size:12px;font-weight:600}
.svc .cv{font-size:12px;opacity:.88}
.bar{height:6px;border-radius:9px;background:var(--brand-tint);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--accent)}
.row2{display:flex;gap:8px;margin-top:12px}
.row2 .btn{flex:1}

/* 2 · ma carte et mes menus (liste) */
.list{background:var(--card);border-radius:var(--r);padding:4px 16px}
.li{display:flex;align-items:center;gap:12px;padding:14px 0}
.li+.li,.li+.mdj,.mdj+.li,.mdj+.mdj{border-top:1px solid var(--line)}
.dot{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;color:#fff}
.li b{display:block;font-size:14.5px}
.li small{display:block;font-size:12.5px;color:var(--mut);line-height:1.35}
.li>div{min-width:0;flex:1}
.chev{color:var(--mut);font-size:18px;margin-left:auto}
.lks{display:flex;gap:12px;font-size:12.5px;font-weight:800;margin-left:auto;white-space:nowrap}
.lks a{color:var(--accent-text)}
.tg{width:46px;height:28px;border-radius:999px;background:#d8d4cb;position:relative;flex:none;margin-left:auto}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15);transition:left .15s}
.tg.on{background:var(--ok)}.tg.on::after{left:21px}
.mdj{padding:14px 0 16px}
.mdj .top{display:flex;align-items:center;gap:12px}
.mdj .box{margin-top:12px;border-radius:18px;padding:14px 16px;background:var(--brand-soft)}
.mdj .box .ln em{color:var(--brand-text)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chips span{font-size:11.5px;font-weight:700;background:var(--soft);border-radius:999px;padding:4px 9px;color:var(--ink)}
.mdj .ln{display:flex;gap:12px;font-size:14px;padding:5px 0}
.mdj .ln em{font-style:normal;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);width:60px;flex:none;padding-top:2px}
.mdj .ft{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.mdj .price{font-size:26px;font-weight:900}
.mdj .acts{display:flex;gap:8px;margin-top:12px}
.mdj .acts .btn{flex:1;padding:10px 12px}

/* 3 · export */
.exp{padding:0}
.exp .hdr{background:var(--brand-soft);padding:16px 18px;display:flex;align-items:center;gap:10px}
.exp .hdr b{font-size:15px;color:var(--brand-text)}
.exp .hdr .ico{background:rgba(255,255,255,.7);color:var(--brand-text)}
.exp .hdr .more{margin-left:auto;font-size:12.5px;font-weight:800;color:var(--brand-text)}
.exp .bd{padding:14px 18px 18px}
.exp .bd>small{font-size:12.5px;color:var(--mut)}
.fmts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.fmts a{border-radius:16px;background:var(--soft);padding:14px 6px 12px;text-align:center;font-size:12.5px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;min-height:104px}
.fmts .pv{border-radius:6px;background:var(--brand);display:block}
.fmts a:nth-child(1) .pv{height:46px;width:28px}.fmts a:nth-child(2) .pv{height:34px;width:30px}.fmts a:nth-child(3) .pv{height:24px;width:40px}.fmts a:nth-child(4) .pv{height:38px;width:28px;background:#fbfaf6;box-shadow:inset 0 0 0 2px var(--brand)}

/* réglages */
.sets{display:grid;gap:12px}
.set{border-radius:var(--r);padding:16px}
.set h4{margin:2px 4px 12px;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:12px;min-width:0}
.tile .ico{width:36px;height:36px;border-radius:11px;color:#fff}
.tile b{display:block;font-size:13.5px;line-height:1.2}
.tile>div{min-width:0}
.tile>div>span{display:block;font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-a{background:var(--set-a)}.s-a h4{color:var(--set-a-ink)}.s-a .ico{background:var(--set-a-ink)}
.s-b{background:var(--set-b)}.s-b h4{color:var(--set-b-ink)}.s-b .ico{background:var(--set-b-ink)}
.s-c{background:var(--set-c)}.s-c h4{color:var(--set-c-ink)}.s-c .ico{background:var(--ink)}

/* visites (pleine largeur) */
.vis{display:grid;gap:14px}
.vis .k{font-size:32px;font-weight:900;letter-spacing:-.02em;line-height:1}
.vis small{font-size:12.5px;color:var(--mut)}
.spark{display:flex;align-items:flex-end;gap:5px;height:60px}
.spark i{flex:1;border-radius:5px 5px 2px 2px;background:var(--soft)}.spark i.on{background:var(--brand)}
.days{display:flex;gap:5px}.days span{flex:1;text-align:center;font-size:10.5px;color:var(--mut);font-weight:700}
.srcs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.srcs div{background:var(--soft);border-radius:12px;padding:9px 11px;font-size:12px;color:var(--mut)}
.srcs b{display:block;font-size:16px;color:var(--ink)}

/* ── intégration des titres dans les bulles ── */
/* A · titre dans la bulle */
.ttl{font-family:var(--display);font-weight:var(--display-w);font-size:19px;line-height:1.1;padding:16px 0 8px;display:flex;align-items:center;gap:8px}
.ttl small{margin-left:auto;font-family:Inter,system-ui,sans-serif;font-size:12px;font-weight:700;color:var(--mut)}
.c>.ttl{padding-top:0}
/* B · bandeau de couleur (comme Exporter la carte) */
.bh{background:var(--brand-soft);color:var(--brand-text);padding:15px 16px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:10px}
.bh .ico{background:rgba(255,255,255,.7);color:var(--brand-text)}
.bh small{margin-left:auto;font-size:12px;font-weight:700;opacity:.8}
.list>.bh{margin:-4px -16px 0}
.c>.bh{margin:-18px -18px 4px}
/* C · étiquette en bulle posée sur la carte */
.tag{position:relative;z-index:1;display:inline-flex;align-items:center;gap:7px;margin:22px 0 -15px 14px;background:var(--ink);color:#fff;border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:800;box-shadow:0 0 0 4px var(--bg)}
.tag svg{width:14px;height:14px}
.tag+.list,.tag+.c{padding-top:16px}
.tag+.c.box-sets{padding-top:22px}
/* boîte qui regroupe les 3 blocs de réglages */
.box-sets{padding:12px}
.box-sets>.ttl{padding:4px 6px 12px}
.box-sets>.bh{margin:-12px -12px 12px}
.box-sets .set{padding:14px}
.vis>.ttl,.vis>.bh{grid-column:1/-1}
/* V2 : titres de section plus présents */

/* ── mise en page ordinateur ── */
.L{display:grid;gap:12px}
@media(min-width:900px){
  .wrap{padding:20px 32px 60px}
  .L{gap:18px;align-items:start}
  .srcs{grid-template-columns:1fr 1fr}
  .hd{margin-bottom:20px}.hd h1{font-size:28px}
  /* réglages : 2 × 2 blocs */
  .sets{grid-template-columns:1fr 1fr;align-items:start}
  .sets .tile b{font-size:13.5px}
  .a-resa{grid-area:resa}.a-carte{grid-area:carte}.a-menus{grid-area:menus}.a-comm{grid-area:comm}.a-sets{grid-area:sets}.a-vis{grid-area:vis}
  /* 1 · deux colonnes */
  .v1 .L{grid-template-columns:1fr 1fr;grid-template-areas:"resa resa" "carte menus" "comm vis" "sets sets"}
  .v1 .a-resa .svc{max-width:none}
  /* 2 · menu latéral */
  .v2 .shell{display:grid;grid-template-columns:232px 1fr;gap:28px;align-items:start}
  .v2 .L{grid-template-columns:1fr 1fr;align-items:stretch;grid-template-areas:"resa comm" "carte menus" "sets sets" "vis vis"}
  .v2 .a-sets,.v2 .a-vis{align-self:start}
  .v2 .a-carte,.v2 .a-menus{display:flex;flex-direction:column}.v2 .a-carte>.list,.v2 .a-menus>.list{flex:1;display:flex;flex-direction:column}
  .v2 .a-menus>.list>.li:last-child{margin-top:auto}
  .v2 .a-carte .fill{flex:1}
  .v2 .a-menus .mdj.fix{flex:1;display:flex;flex-direction:column}.v2 .a-menus .mdj.fix .box{flex:1;display:flex;flex-direction:column;justify-content:center}
  .v2 .cv3 .fmts{flex:1;align-content:stretch}.v2 .cv3 .xp{flex:1;display:flex;flex-direction:column}.v2 .cv3 .fmts a{min-height:0}
  .v2 .cv3 .fmts a:nth-child(1) .pv{height:70px;width:40px}.v2 .cv3 .fmts a:nth-child(2) .pv{height:52px;width:44px}.v2 .cv3 .fmts a:nth-child(3) .pv{height:36px;width:60px}.v2 .cv3 .fmts a:nth-child(4) .pv{height:58px;width:42px}
  .v2 .a-comm{display:flex;flex-direction:column}.v2 .a-comm .list{flex:1;display:flex;flex-direction:column}
  .v2 .a-comm .li{flex:1}
  .v2 .a-resa .next{display:block}
  .v2 .vis{grid-template-columns:1.1fr 1.6fr 1fr;align-items:center}
  .v2 .a-sets .sets{grid-template-columns:1fr 1fr}
  .v2 .a-sets .tiles{grid-template-columns:1fr 1fr}
  .v2 .a-sets{margin-top:6px}
  /* 3 · bento */
  .v3 .L{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-areas:"resa resa vis" "carte menus comm" "sets sets sets"}
  .v3 .sets{grid-template-columns:1.3fr 1.3fr 1fr 1fr}
  .v3 .sets .tiles{grid-template-columns:1fr 1fr}
  .v3 .s-d .seg{flex-direction:column}
  .v3 .s-c .tiles{grid-template-columns:1fr}
  /* 4 · réglages à droite */
  .v4 .L{grid-template-columns:1fr 1fr 360px;grid-template-areas:"resa resa sets" "carte menus sets" "comm vis sets" ". . sets"}
  .v4 .sets{grid-template-columns:1fr}
  .v4 .a-sets{position:sticky;top:110px}
  .v4 .a-sets .sec{margin-top:0}
}
.side{display:none}
@media(min-width:900px){
  .v2 .side{display:block;position:sticky;top:20px;background:var(--card);border-radius:var(--r);padding:16px 12px}
  .v2 .side .who{display:flex;align-items:center;gap:10px;padding:4px 6px 16px;border-bottom:1px solid var(--line);margin-bottom:10px}
  .v2 .side .who .logo{width:38px;height:38px;font-size:14px}
  .v2 .side .who b{font-family:var(--display);font-weight:var(--display-w);font-size:17px;line-height:1.1}
  .v2 .side a.nv{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;font-size:14px;font-weight:700;color:var(--ink)}
  .v2 .side a.nv svg{width:18px;height:18px;color:var(--mut)}
  .v2 .side a.nv.on{background:var(--brand-soft);color:var(--brand-text)}.v2 .side a.nv.on svg{color:var(--brand-text)}
  .v2 .side .gap{height:1px;background:var(--line);margin:10px 6px}
  .v2 .side .mini{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);padding:8px 10px 4px}
  .v2 .hd .logo{display:none}
}
.mobile-sec{display:block}
@media(min-width:900px){.mobile-sec{display:none}}
.desk-sec{display:none}
@media(min-width:900px){.desk-sec{display:flex}}

.list{overflow:hidden}
.li small.lg{display:none}
.pill.ca{background:var(--ok-soft);color:var(--ok);margin-left:6px;vertical-align:1px}
@media(min-width:900px){.v2 .a-comm small.sh{display:none}.v2 .a-comm small.lg{display:block;font-size:13px;line-height:1.45;margin-top:3px;max-width:52ch}.v2 .a-comm .li b{font-size:15px}}
@media(max-width:899px){.pill.ca{display:none}}
.next{display:none;margin-top:12px}
.nx-t{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.75;margin:0 2px 8px}
.nx{display:flex;align-items:center;gap:14px;background:var(--brand-tint);border-radius:13px;padding:11px 14px;font-size:14px}
.nx+.nx{margin-top:6px}
.nx b{font-size:14.5px;width:46px;flex:none}
.nx span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nx em{font-style:normal;opacity:.8}
.nx small{font-size:12.5px;opacity:.75;white-space:nowrap}
.tile{min-height:60px}
.sets .set{padding:14px 10px}.sets .set h4{margin-left:6px}.sets .tile{padding:12px 6px 12px 10px;gap:8px}.sets .tile .ico{width:32px;height:32px;border-radius:10px}
.sets .tile b{font-size:12.5px;letter-spacing:-.01em}
.s-d{background:#ece8f6}.s-d h4{color:#5a4a9a}
.app-card{background:var(--card);border-radius:16px;padding:12px}
.app-card small{display:block;font-size:12px;color:var(--mut);margin:0 2px 10px}
.seg{display:flex;gap:4px;background:var(--soft);border-radius:13px;padding:4px}
.seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:800;padding:9px 6px;border-radius:10px;color:var(--mut)}
.seg button svg{width:15px;height:15px}
.seg button.on{background:var(--ink);color:#fff}
.app-row{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:10px 10px 10px 12px;margin-top:8px}
.app-row .ico{width:36px;height:36px;border-radius:11px;color:#fff}
.app-row b{font-size:13.5px;flex:1}
.app-row .seg{flex:none;width:170px}
.sl-list .li{padding:11px 0}
.sl-list .dot{width:34px;height:34px;border-radius:50%}
.sl-list .dot svg{width:16px;height:16px}
.xp .more{margin-left:auto;font-size:12.5px;font-weight:800;color:var(--brand-text);white-space:nowrap;align-self:flex-start;padding-top:2px}
.xp .fmts a{background:var(--brand-soft)}
.acts3{display:flex;gap:8px;margin-top:12px}
.acts3 .btn{flex:1;padding:10px 6px;font-size:13px;gap:5px}
.btn.x{background:var(--accent);color:var(--on-accent)}
.btn.g{background:var(--soft)}
.spe .sl{display:flex;align-items:center;gap:10px;padding:7px 0}
.spe .sl+.sl{border-top:1px solid rgba(22,24,29,.08)}
.spe .sl>div{flex:1;min-width:0}.spe .sl b{display:block;font-size:14px}.spe .sl small{display:block;font-size:12px;color:var(--mut)}
.spe .sl span{font-weight:900;font-size:16px}
.spe .acts .btn{padding:10px 6px;font-size:13px;gap:5px}

/* pages de détail */
.ph{display:flex;align-items:flex-end;gap:16px;margin:4px 0 18px}
.ph h2{margin:0;font-family:var(--display);font-weight:var(--display-w);font-size:30px;line-height:1.05}
.ph p{margin:6px 0 0;font-size:13.5px;color:var(--mut)}
.ph-a{margin-left:auto;display:flex;gap:8px}
.pgrid{display:grid;gap:18px;align-items:start}.pgrid>div{display:grid;gap:18px;min-width:0}
.g-3-1{grid-template-columns:1.9fr 1fr}.g-2-1{grid-template-columns:1.6fr 1fr}.g-1-1{grid-template-columns:1fr 1fr}.g-1{grid-template-columns:1fr}
.pc .pb{padding:6px 0 14px}
.rw{display:flex;align-items:center;gap:14px;padding:11px 0;font-size:14px;border-top:1px solid var(--line)}
.pb>.rw:first-child,.pb>.tbs+.rw,.pb>.svch+.rw{border-top:0}
.rw-a{min-width:96px}.rw-a:has(.hdl){min-width:0}.rw .tg{display:inline-block;vertical-align:middle;margin:0}.rw-b{flex:1;min-width:0}.rw-b small,.rw-a small{color:var(--mut);font-size:12.5px}.rw em{font-style:normal;color:var(--mut)}
.rw-c{font-size:13px;color:var(--mut);white-space:nowrap}.rw-d{white-space:nowrap}
.lk{font-size:13px;font-weight:800;color:var(--brand-text);cursor:pointer}.lk+.lk{margin-left:10px}
.lk.add{display:inline-block;margin-top:10px}
.pl{display:inline-flex;font-size:11.5px;font-weight:800;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--ink)}

.pvs{display:grid;gap:20px;justify-items:center;width:100%}
.pvs.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.pvs .pv-wrap{width:100%;max-width:520px}
.pvs.grid-st{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.pv-wrap small{display:block;text-align:center;font-size:12px;font-weight:800;color:var(--mut);margin-top:8px}
.pv-load{display:grid;place-items:center;min-height:240px;color:var(--mut);font-size:13px;font-weight:700}
.xprev .pv-frame{height:420px;width:auto}
.xprev .pvx{display:flex;gap:18px;justify-content:center;align-items:center}

.logo.img{width:auto;min-width:48px;padding:8px 12px;border-radius:14px}.logo.img img{display:block;max-height:30px;max-width:150px;object-fit:contain}
.v2 .side .who .logo.img{width:auto;min-width:44px;height:auto;padding:6px 9px;border-radius:12px}.v2 .side .who .logo.img img{max-height:34px;max-width:130px}
.side a.who{color:var(--ink);text-decoration:none}
.logo.img.sq,.side .who .logo.img.sq,.mtop .logo.img.sq{padding:0;min-width:0;width:48px;height:48px;border-radius:50%;overflow:hidden}.logo.img.sq img,.side .who .logo.img.sq img,.mtop .logo.img.sq img{width:100%;height:100%;max-height:none;max-width:none;object-fit:cover}

.hd h1 a{color:inherit}
.upl{display:flex;gap:14px;align-items:center}.upl-th{width:88px;height:88px;border-radius:18px;background:var(--brand);display:grid;place-items:center;flex:none;overflow:hidden;color:var(--on-brand);font-family:var(--display);font-size:26px}.upl-th img{width:100%;height:100%;object-fit:contain}
.upl-a{display:flex;flex-direction:column;align-items:flex-start;gap:8px}.upl-btn{cursor:pointer;padding:10px 14px}.upl-btn svg{transform:none}
.mv{background:var(--soft);border:0;border-radius:8px;width:28px;height:28px;cursor:pointer;color:var(--ink)}


/* communication */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px;align-items:stretch}
.cc{display:flex;flex-direction:column}.cc .pb{padding:14px 0 18px;display:flex;flex-direction:column;flex:1}
.cc-cta{width:100%;margin-top:auto}

.fs svg{width:26px;height:26px;color:var(--brand-text)}.fs b{font-size:13.5px}.fs small{font-size:11.5px;color:var(--mut);line-height:1.3}
.fa{display:grid;place-items:center;color:var(--mut)}.fa svg{width:18px;height:18px}
.chans{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.chans span{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;background:var(--soft);border-radius:999px;padding:6px 11px}.chans svg{width:15px;height:15px}
.bul{list-style:none;padding:0;margin:0 0 16px;display:grid;gap:8px}.bul li{display:flex;gap:9px;align-items:center;font-size:13.5px}.bul svg{width:16px;height:16px;color:var(--ok);flex:none}
.segs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.sg{background:var(--brand-soft);border-radius:16px;padding:12px;display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:center}
.sg svg{width:22px;height:22px;color:var(--brand-text);grid-row:span 2}.sg b{font-size:14px}.sg small{font-size:11.5px;color:var(--mut)}
.bb{background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 82%,#000),var(--brand) 60%,color-mix(in srgb,var(--brand) 80%,#fff));color:#fff;border-radius:var(--r);padding:26px 28px;position:relative;overflow:hidden}
.bb::after{content:"";position:absolute;right:-80px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 45%,transparent),transparent 70%);pointer-events:none}
.bb-h{display:flex;align-items:center;gap:16px;position:relative;z-index:1}

.bb h3{margin:0;font-size:24px;font-weight:900;letter-spacing:-.01em}.bb-h p{margin:4px 0 0;color:rgba(255,255,255,.8);font-size:14px}
.bb-cta{margin-left:auto;padding:13px 18px;font-size:14px;flex:none}
@keyframes bbpulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent)}70%{box-shadow:0 0 0 14px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes bblink{0%,100%{opacity:1}50%{opacity:.35}}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px;position:relative;z-index:1}
.kpis div{background:rgba(255,255,255,.09);border-radius:16px;padding:14px 16px}.kpis b{font-size:28px;font-weight:900;color:var(--accent-light,var(--accent))}.kpis small{display:block;color:rgba(255,255,255,.78);font-size:12.5px}
.cards6{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:14px;position:relative;z-index:1}
.c6{background:var(--card);color:var(--ink);border-radius:16px;padding:44px 12px 14px;position:relative;display:flex;flex-direction:column;gap:6px}
.c6 em{position:absolute;top:10px;left:12px;font-style:normal;font-weight:900;font-size:15px;width:28px;height:28px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center}
.c6i{position:absolute;top:12px;right:12px}.c6i svg{width:22px;height:22px;color:var(--brand-text)}
.c6 b{font-size:13.5px}.c6 small{font-size:11.5px;color:var(--mut);line-height:1.35}
.c6:first-child{box-shadow:inset 0 0 0 2px #ff8f8f}.c6:first-child em{background:var(--alert);color:#fff;animation:bblink 1.6s infinite}
.c6:last-child{background:var(--accent-light,var(--accent));color:var(--on-accent-light,#16181d)}.c6:last-child small{color:inherit;opacity:.8}.c6:last-child em{background:#16181d;color:#fff}.c6:last-child .c6i svg{color:inherit}
@media(max-width:1180px){.cards6{grid-template-columns:repeat(3,1fr)}}
@media(max-width:899px){.cgrid{grid-template-columns:1fr}.hook{white-space:normal}.bb{padding:20px 18px}.bb-h{flex-wrap:wrap}.bb h3{font-size:20px}.bb-cta{margin-left:0;width:100%}.cards6{grid-template-columns:repeat(2,1fr)}.kpis b{font-size:22px}.kpis div{padding:10px 12px}}
@media(prefers-reduced-motion:reduce){.bb-ico,.c6 em{animation:none!important}}
.csolo{max-width:none}
.rtabs{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--card);border-radius:12px;padding:4px;margin-bottom:16px}.rtabs a{font-size:13.5px;font-weight:800;padding:8px 14px;border-radius:9px;color:var(--mut)}.rtabs a.on{background:var(--ink);color:var(--card)}

// ── couleurs du restaurant (mêmes garde-fous que les maquettes) ──
const hex=h=>{h=(h||'#000000').replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');return [0,2,4].map(i=>parseInt(h.substr(i,2),16)||0);};
const lum=c=>{const [r,g,b]=hex(c).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);});return .2126*r+.7152*g+.0722*b;};
const contrast=(a,b)=>{const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05);};
const mix=(a,b,t)=>'#'+hex(a).map((v,i)=>Math.round(v+(hex(b)[i]-v)*t).toString(16).padStart(2,'0')).join('');
const INK='#16181d', textOn=bg=>contrast(bg,'#ffffff')>=contrast(bg,INK)?'#ffffff':INK;
function darkEnough(c,bg){let t=0,x=c;while(contrast(x,bg)<4.5&&t<1){t+=.05;x=mix(c,INK,t);}return x;}
function toHsl(h){let [r,g,b]=hex(h).map(v=>v/255);const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let H=0,S=0,L=(mx+mn)/2;if(mx!==mn){const d=mx-mn;S=L>.5?d/(2-mx-mn):d/(mx+mn);H=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;H/=6;}return [H,S,L];}
function fromHsl(H,S,L){const f=n=>{const k=(n+H*12)%12,a=S*Math.min(L,1-L);return Math.round(255*(L-a*Math.max(-1,Math.min(k-3,9-k,1)))).toString(16).padStart(2,'0');};return '#'+f(0)+f(8)+f(4);}
function tame(c,{lmin=.32,lmax=.62,smax=.62}={}){let [H,S,L]=toHsl(c);S=Math.min(S,smax);L=Math.min(lmax,Math.max(lmin,L));let x=fromHsl(H,S,L),on=textOn(x);for(let i=0;i<30&&contrast(x,on)<4.5;i++){L+=on==='#ffffff'?-.02:.02;x=fromHsl(H,S,Math.min(.95,Math.max(.05,L)));}return x;}
function separate(acc,brand){let [H,S,L]=toHsl(acc);const up=lum(brand)<.18;let x=acc;for(let i=0;i<40&&contrast(x,brand)<2.6;i++){L=Math.min(.92,Math.max(.08,L+(up?.025:-.025)));x=fromHsl(H,S,L);}return x;}
function applyTheme(){
  const bc=(DATA&&DATA.brandColors)||{};
  const brand=tame(bc.primary||'#1d4f7a'), acc0=tame(bc.accent||'#f0a830',{lmin:.36,lmax:.66,smax:.7}), accent=separate(acc0,brand);
  const s=document.documentElement.style, onB=textOn(brand), light=onB!=='#ffffff';
  s.setProperty('--brand',brand); s.setProperty('--on-brand',onB);
  s.setProperty('--on-brand-mut',light?'rgba(22,24,29,.66)':'rgba(255,255,255,.74)');
  s.setProperty('--brand-tint',light?'rgba(22,24,29,.09)':'rgba(255,255,255,.15)');
  const soft=mix(brand,'#ffffff',.86); s.setProperty('--brand-soft',soft); s.setProperty('--brand-text',darkEnough(brand,soft));
  s.setProperty('--accent',accent); s.setProperty('--on-accent',textOn(accent));
  { let b=accent; if(textOn(accent)===INK){ for(let t=0;t<.7&&contrast(b,INK)<9;t+=.03) b=mix(accent,'#ffffff',t); } s.setProperty('--accent-light',b); s.setProperty('--on-accent-light',textOn(b)); if(!document.documentElement.dataset.btn){ s.setProperty('--accent-btn',b); s.setProperty('--on-accent-btn',textOn(b)); } } s.setProperty('--accent-soft',mix(accent,'#ffffff',.84)); s.setProperty('--accent-text',darkEnough(accent,mix(accent,'#ffffff',.84)));
  const font=(DATA&&DATA.restoFont)||'DM Serif Display';
  if(!document.getElementById('restoFontLink')){const l=document.createElement('link');l.id='restoFontLink';l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family='+encodeURIComponent(font).replace(/%20/g,'+')+':wght@400;700&display=swap';document.head.appendChild(l);}
  s.setProperty('--display',`"${font}",Georgia,serif`); s.setProperty('--display-w','700');
}
function applyAppearance(){

}

// ══ Données ══
async function loadAll(){

  if(!DATA.specials.find(s=>s.id==='jour')) DATA.specials.unshift({id:'jour',active:false,label:{fr:'Menu du jour'},title:{fr:'Menu du jour'},desc:{fr:''},price:'',showHome:true,showFirst:true});
  applyTheme();
  loadSide();
  return {};
}
async function loadSide(){
  const t=todayIso();
  const q=async(p,label)=>{ try{ const r=await p; if(r.error){ console.warn(label,r.error); if(label==='réservations') toast('⚠ Réservations illisibles : '+r.error.message); return []; } return r.data||[]; }catch(e){ console.warn(label,e); return []; } };
  const in14=iso(Date.now()+14*864e5);
  [RESA,TABLES,SPACES,SERVICES,BLOCKED,WAIT]=await Promise.all([
    q(sb.from('restaurant_reservations').select('*').eq('client_slug',RESA_SLUG).gte('date_iso',t).lte('date_iso',in14).order('date_iso'),'réservations'),
    q(sb.from('restaurant_tables').select('*').eq('client_slug',RESA_SLUG)),
    q(sb.from('restaurant_spaces').select('*').eq('client_slug',RESA_SLUG).order('sort_order')),
    q(sb.from('restaurant_services').select('*').eq('client_slug',RESA_SLUG).order('sort_order')),
    q(sb.from('blocked_dates').select('date_iso').eq('client_slug',RESA_SLUG).gte('date_iso',t).order('date_iso')),
    q(sb.from('restaurant_waitlist').select('*').eq('client_slug',RESA_SLUG).gte('date_iso',t))
  ]);
  RESA.sort((a,b)=>(a.date_iso+(a.slot||'')).localeCompare(b.date_iso+(b.slot||'')));
  QR=await q(sb.from('qr_scans').select('code,at').eq('client_slug',STATS_SLUG).gte('at',new Date(Date.now()-30*864e5).toISOString()).limit(5000));
  render();
}

function touch(rerender){ setSave('Enregistrement…'); clearTimeout(saveT); saveT=setTimeout(save,900); if(rerender) render(); }
function setSave(t){ saveState=t; const b=$('#savebar'); if(!b) return; b.textContent=t; b.classList.toggle('on',!!t); if(t==='Enregistré') setTimeout(()=>{ if(saveState==='Enregistré') b.classList.remove('on'); },1600); }
async function save(){
  if(!DATA||!LOADED) return;

let ENGP=null;
function engine(){
  if(ENGP) return ENGP;
  ENGP=new Promise((res,rej)=>{
    const f=document.createElement('iframe');
    f.src='/index.html?engine=1'; f.title='moteur';
    f.style.cssText='position:fixed;left:0;top:0;width:1200px;height:900px;opacity:0;pointer-events:none;z-index:-5;border:0';
    f.onload=async()=>{
      const w=f.contentWindow;
      for(let i=0;i<150;i++){ try{ if(w.eval('typeof DATA_SOURCE!=="undefined" && DATA_SOURCE!=="chargement"')) break; }catch(e){} await sleep(100); }
      // Le moteur ne doit jamais rien enregistrer lui-même.
      try{ w.eval('window.publishToSupabase=async function(){}; window.scheduleAutoSave=function(){}; window.publishNow=function(){};'); }catch(e){}
      w.showToast=(m)=>toast(m);
      w.showGbizResultGallery=(imgs)=>showGallery(imgs);
      try{ w.eval(ENGINE_HELPERS); }catch(e){ console.error('helpers',e); }

}

  const ph=pages.map((p,i)=>'<div class="pdf-page" style="'+(i<pages.length-1?'page-break-after:always;break-after:page;':'')+(p.spaceScale&&p.spaceScale!==1?'--space-scale:'+p.spaceScale+';':'')+(i>0?'--top-pad-trim:5px;':'')+'">'+p.html+'</div>').join('');

// Remplit des iframes d'aperçu (data-prev=kind, data-i=index) — appelé après chaque rendu.
let prevSeq=0;
async function fillPreviews(){
  const frames=[...document.querySelectorAll('iframe[data-prev]')];
  if(!frames.length) return;
  const seq=++prevSeq;
  let w; try{ w=await eng(); }catch(e){ return; }
  if(seq!==prevSeq) return;
  const cache={};
  for(const fr of frames){
    const key=fr.dataset.prev+'|'+(fr.dataset.opt||'');
    if(!cache[key]){ try{ cache[key]=w.__prev(fr.dataset.prev, fr.dataset.opt?JSON.parse(fr.dataset.opt):{}); }catch(e){ console.error(e); cache[key]=[]; } }
    const docs=cache[key], i=+(fr.dataset.i||0);

    else { const ph=fr.closest('.pv-wrap'); if(ph&&fr.dataset.hideEmpty) ph.style.display='none'; }
  }
}

function openLine(){

const hh=v=>{ if(v==null||v==='') return '?'; const n=+v; const h=Math.floor(n)%24, m=Math.round((n-Math.floor(n))*60); return h+'h'+(m?String(m).padStart(2,'0'):''); };
function qrByDay(){ const days=[]; for(let i=6;i>=0;i--){ const d=iso(Date.now()-i*864e5); days.push({d,n:QR.filter(x=>iso(x.at)===d).length}); } return days; }
function visitsCard(){
  const days=qrByDay(), max=Math.max(1,...days.map(x=>x.n)), tot7=days.reduce((a,x)=>a+x.n,0);
  const by={}; QR.filter(x=>Date.now()-new Date(x.at)<7*864e5).forEach(x=>{ by[x.code]=(by[x.code]||0)+1; });
  const top=Object.entries(by).sort((a,b)=>b[1]-a[1]).slice(0,4);
  const dn=['dim','lun','mar','mer','jeu','ven','sam'];
  return `<section class="full a-vis"><div class="c vis"><div class="bh"><span class="ico">${I('stats')}</span>Statistiques<small>7 derniers jours</small></div>

    <div><div class="spark">${days.map((x,i)=>`<i class="${i===6?'on':''}" style="height:${Math.max(6,Math.round(x.n/max*100))}%" title="${x.n}"></i>`).join('')}</div><div class="days">${days.map(x=>`<span>${dn[new Date(x.d+'T12:00').getDay()]}</span>`).join('')}</div></div>
    <div class="srcs">${top.length?top.map(([c,n])=>`<div><b class="num">${n}</b>${esc(c)}</div>`).join(''):'<div><b>—</b>Pas encore de scan</div>'}</div></div></section>`;
}

function setByBind(path,val){

  if(p[0]==='tab'){ const t=DATA.tabs[+p[1]]; if(p[2]==='label'){ t.label=setTr(t.label,val); return; } const c=t.cards[+p[3]]; if(p[4]==='label'){ c.label=setTr(c.label,val); return; } const d=c.dishes[+p[5]]; if(p[6]==='price') d.price=val;
    else if(p[6]==='priceNum') d.price=val===''?'':fmtEur(val)+'€';
    else if(['qty1','p1','qty2','p2'].includes(p[6])){ d[p[6]]=val; dualSync(d); }
    else d[p[6]]=setTr(d[p[6]],val); return; }
  if(p[0]==='tabL'){ const t=DATA.tabs[+p[1]]; t.label=setL(t.label,val); return; }
  if(p[0]==='cardL'){ const c=DATA.tabs[+p[1]].cards[+p[2]]; c.label=setL(c.label,val); return; }
  if(p[0]==='it'){ const {it}=itemAt(p.slice(1,4).join('.')); const f=p[4];
    if(f==='name'||f==='desc'){ it[f]=setL(it[f],val); return; }
    if(f==='priceNum'){ it.price=val===''?'':fmtEur(val)+'€'; return; }

  if(p[0]==='intro'){ if(!DATA.intro.text||typeof DATA.intro.text!=='object') DATA.intro.text={fr:DATA.intro.text||''}; DATA.intro.text[LG()]=val; return; }

function fileToWebpBlob(file,max=1600){ return new Promise((res,rej)=>{ if(file.type==='image/svg+xml'){ res(file); return; } const r=new FileReader(); r.onerror=rej; r.onload=()=>{ const img=new Image(); img.onerror=rej; img.onload=()=>{ const sc=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc); c.getContext('2d').drawImage(img,0,0,c.width,c.height); c.toBlob(b=>b?res(b):rej(new Error('conversion')),'image/webp',.88); }; img.src=r.result; }; r.readAsDataURL(file); }); }
const blobToDataUrl=b=>new Promise(r=>{ const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(b); });
// Envoie l'image sur le serveur d'images (media.beltab.app) et renvoie son adresse.
// Si le serveur n'est pas encore branché, l'image est gardée dans la carte (comme l'admin actuel).
async function uploadVideo(file){
  if(!file||!/^video\//.test(file.type)){ toast('Choisissez une vidéo MP4 ou WebM'); return null; }
  if(file.size>60*1024*1024){ toast('Vidéo trop lourde (60 Mo max) : raccourcissez-la'); return null; }
  toast('Envoi de la vidéo… (peut prendre une minute)');
  try{
    const r=await fetch(UPLOAD_URL+'?slug='+encodeURIComponent(SLUG)+'&kind=video',{method:'POST',headers:{'Authorization':'Bearer '+(SESSION&&SESSION.access_token||''),'Content-Type':file.type},body:file});
    const j=await r.json().catch(()=>({}));
    if(r.ok&&j.url){ toast('Vidéo enregistrée sur le serveur'); return j.url; }
    toast('⚠ '+(j.error||('Envoi impossible ('+r.status+')'))); return null;
  }catch(e){ console.warn('video',e); toast('⚠ Serveur d\'envoi injoignable'); return null; }
}
async function uploadImage(file,kind){
  if(!file||!/^image\//.test(file.type)){ toast('Choisissez une image (PNG, JPG, WebP ou SVG)'); return null; }
  toast('Envoi de l\'image…');
  const blob=await fileToWebpBlob(file, kind==='logo'?900:1600);
  try{
    const r=await fetch(UPLOAD_URL+'?slug='+encodeURIComponent(SLUG)+'&kind='+encodeURIComponent(kind),{method:'POST',headers:{'Authorization':'Bearer '+(SESSION&&SESSION.access_token||''),'Content-Type':blob.type||'image/webp'},body:blob});
    const j=await r.json().catch(()=>({}));
    if(r.ok&&j.url){ toast('Image enregistrée sur le serveur'); return j.url; }
    if(r.status===401||r.status===403){ toast('⚠ '+(j.error||'Accès refusé')); return null; }
    throw new Error(j.error||('HTTP '+r.status));
  }catch(e){
    console.warn('upload',e);
    toast('Serveur d\'images pas encore branché : image gardée dans la carte');
    return await blobToDataUrl(blob);
  }
}

    case 'fDelAsk': UI.delc=ARG; render(); break;
    case 'fDelNo': UI.delc=null; render(); break;
    case 'fDelYes': DATA.formules=DATA.formules.filter(f=>f.id!==ARG); UI.delc=null; touch(false); await save(); go('menus'); break;
    case 'fCase': findF(ARG)[d.k]=d.v; touch(true); break;
    case 'secAdd': { const f=findF(ARG); f.tabs.push({id:f.id+'-cat'+Date.now(),label:{fr:''},cards:[{label:{fr:''},dishes:[]}]}); touch(true); break; }
    case 'secDel': { const f=findF(ARG); f.tabs.splice(+d.si,1); touch(true); break; }
    case 'secMove': { const f=findF(ARG); const i=+d.si, j=i+(+d.d); if(j>=0&&j<f.tabs.length){ [f.tabs[i],f.tabs[j]]=[f.tabs[j],f.tabs[i]]; touch(true);} break; }
    case 'dAdd': { const f=findF(ARG); const s=f.tabs[+d.si]; if(!s.cards||!s.cards[0]) s.cards=[{label:{fr:''},dishes:[]}]; s.cards[0].dishes.push({name:{fr:''},desc:{fr:''},price:''}); touch(true); break; }
    case 'dDel': { const f=findF(ARG); f.tabs[+d.si].cards[0].dishes.splice(+d.di,1); touch(true); break; }
    case 'tunerV': UI.tunerV=d.v; render(); break;
    case 'tunerEl': UI.tunerEl=d.v; render(); break;
    case 'zoom': UI.zoom=Math.max(60,Math.min(140,UI.zoom+(+d.d))); render(); break;
    case 'tunerSize': { const T=tunerTarget(); const fld=TUNER_FIELDS.find(x=>x[1]===UI.tunerEl)||TUNER_FIELDS[3]; if(!fld[1]) break; const cur=T.obj[fld[1]]??100; let i=STEPS.indexOf(STEPS.reduce((b,s)=>Math.abs(s-cur)<Math.abs(b-cur)?s:b,100)); i=Math.max(0,Math.min(STEPS.length-1,i+(+d.d))); T.obj[fld[1]]=STEPS[i]; touch(true); break; }
    case 'tunerColorReset': delete tunerTarget().obj[d.k]; touch(true); break;
    case 'tunerAlign': { const o=tunerTarget().obj; o.alignContentLeft=d.v==='1'; o.alignTitleLeft=d.v==='1'; touch(true); break; }
    case 'tunerGap': tunerTarget().obj.dishGapPct=+d.v; touch(true); break;
    case 'tunerLogo': { const o=tunerTarget().obj; if(d.v==='none') o.showLogo=false; else { o.showLogo=true; o.logoSize=d.v; } touch(true); break; }
    case 'tunerCase': tunerTarget().obj[d.k]=d.v; touch(true); break;
    case 'tunerDl': { const T=tunerTarget(); if(ARG==='mdj') await doFormule(jourAsFormule(sp),d.v); else { const w=await eng(); toast('Génération en cours…'); w.formule_exportInsta(T.f.id,d.v); } break; }
    case 'print': doPrint(); break;
    case 'gbiz': doGbiz(); break;
    case 'insta': doInsta(d.v); break;
    case 'igf': UI.igf=d.v; go('xinsta/'+d.v); break;
    case 'igSize': { const p=pS(); const base={instaTitleSize:45,instaMenuSize:21,instaDescSize:19,instaPostTitleSize:p.instaTitleSize||45,instaPostMenuSize:p.instaMenuSize||21,instaPostDescSize:p.instaDescSize||19}[d.k]; p[d.k]=Math.max(8,Math.min(120,(p[d.k]||base)+(+d.d))); touch(true); break; }
    case 'igBev': { const t=DATA.tabs.find(x=>x.id===d.id); t.instaIncludeBevs=!t.instaIncludeBevs; touch(true); break; }
    case 'pdfFlag': { const p=pS(); const cur=d.k==='showLogo'?(p.showLogo!==undefined?p.showLogo:true):p[d.k]!==false; p[d.k]=!cur; touch(true); break; }
    case 'pdfSet': pS()[d.k]=d.v; touch(true); break;
    case 'pdfLogoSite': pS().logoData=''; touch(true); toast('Le logo du site sera utilisé'); break;
    case 'tabBreak': { const t=DATA.tabs.find(x=>x.id===d.id); t.pdfPageBreakBefore=!t.pdfPageBreakBefore; if(t.pdfPageBreakBefore) t.gbizPullPrevious=false; touch(true); break; }
    case 'gbizPlace': { const t=DATA.tabs.find(x=>x.id===d.id); t.gbizPullPrevious=d.v==='pull'; t.pdfPageBreakBefore=d.v==='break'; touch(true); break; }
    case 'colReset': COLS.forEach(([,rows])=>rows.forEach(([k])=>delete pS()[k])); touch(true); break;
    case 'catOpen': if(e.target.closest('.mv')) break; UI.catOpen=d.id; render(); break;
    case 'catMove': { const i=+d.i, j=i+(+d.d); if(j>=0&&j<DATA.tabs.length){ [DATA.tabs[i],DATA.tabs[j]]=[DATA.tabs[j],DATA.tabs[i]]; touch(true);} break; }
    case 'catAdd': { const id='cat-'+Date.now(); DATA.tabs.push({id,label:{fr:'Nouvelle catégorie'},cards:[{label:{fr:''},dishes:[]}]}); touch(true); go('carte/'+(DATA.tabs.length-1)); break; }
    case 'dishAdd': DATA.tabs[+d.ti].cards[+d.ci].dishes.push({_pid:'p'+Date.now().toString(36),name:{fr:''},desc:{fr:''},price:''}); touch(true); break;
    case 'dishVis': { const dd=DATA.tabs[+d.ti].cards[+d.ci].dishes[+d.di]; dd.hidden=!dd.hidden; touch(true); break; }
    case 'dishMove': { const arr=DATA.tabs[+d.ti].cards[+d.ci].dishes; const i=+d.di, j=i+(+d.d); if(j>=0&&j<arr.length){ [arr[i],arr[j]]=[arr[j],arr[i]]; touch(true);} break; }
    case 'dishDel': DATA.tabs[+d.ti].cards[+d.ci].dishes.splice(+d.di,1); UI.delc=null; touch(true); break;
    case 'delAsk': UI.delc=d.k; render(); break;
    case 'delNo': UI.delc=null; render(); break;
    case 'dayToggle': { const day=DATA.schedule[+d.i]; const on=day.active!==false&&(day.services||[]).some(x=>x.open!=null); if(on){ day.active=false; } else { day.active=true; if(!day.services||!day.services.length) day.services=[{label:'',open:12,close:14}]; day.services.forEach(s=>{ if(s.open==null){ s.open=19; s.close=22; } }); day.open=day.services[0].open; day.close=day.services[0].close; } touch(true); break; }
    case 'logoDel': DATA.restaurantLogo=''; touch(true); break;
    case 'soon': toast(d.v); break;
    case 'hcFlag': DATA.homeCover[d.k]=DATA.homeCover[d.k]===false; touch(true); break;
    case 'hcType': DATA.homeCover.mediaType=d.v; touch(true); break;
    case 'introFlag': DATA.intro.active=!DATA.intro.active; touch(true); break;
    case 'viewSet': DATA.defaultView=d.v; touch(true); break;
    case 'siteDel': { const hc=DATA.homeCover, sl=d.slot; if(/^s\d$/.test(sl)) hc.slideshow[+sl[1]].image=''; else hc[sl]=''; touch(true); break; }
    case 'rootFlag': DATA[d.k]=DATA[d.k]===false; touch(true); break;
    case 'backup': { const blob=new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'}); const u=URL.createObjectURL(blob); const ln=document.createElement('a'); const n=new Date(); ln.download=`${SLUG}-${iso(n).replace(/-/g,'')}-${String(n.getHours()).padStart(2,'0')}${String(n.getMinutes()).padStart(2,'0')}.json`; ln.href=u; ln.click(); setTimeout(()=>URL.revokeObjectURL(u),2000); break; }
    case 'restore': { const {data,error}=await sb.from('menu_data_history').select('data').eq('id',d.id).maybeSingle(); if(error||!data){ toast('⚠ Version introuvable'); break; } try{ await sb.from('menu_data_history').insert({client_slug:SLUG,data:DATA}); }catch(x){} DATA=data.data; UI.delc=null; HIST=null; await save(); applyTheme(); render(); toast('Version restaurée'); break; }
  }
});

// ══ Démarrage ══
document.addEventListener('submit',async e=>{
  if(e.target.id!=='loginForm') return; e.preventDefault();
  const f=new FormData(e.target); const err=$('#loginErr'); err.textContent='Connexion…';
  const {data,error}=await sb.auth.signInWithPassword({email:f.get('email'),password:f.get('pw')});
  if(error){ err.textContent='Email ou mot de passe incorrect.'; return; }
  SESSION=data.session; await boot();
});
setInterval(()=>{ if(SESSION&&DATA&&!document.hidden) loadSide(); },120000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&SESSION&&DATA) loadSide(); });
async function boot(){
  const r=await loadAll();
  if(r.err&&r.err!=='missing') toast(r.err);
  render();
  engine().then(w=>{ try{ ENGFONTS=w.__fonts(); }catch(e){} if(['tuner','xinsta'].includes(PG)) render(); else refreshPreviews(); });
}
(async()=>{
  { const b=QS.get('btn')||'bleu'; if(b!=='or') document.documentElement.dataset.btn=b; const ic=QS.get('ico'); if(ic) document.documentElement.dataset.ico=ic; }
  applyAppearance(); parseHash();
  const {data}=await sb.auth.getSession(); SESSION=data.session;
  if(SESSION) await boot(); else render();
  sb.auth.onAuthStateChange((ev,s)=>{ if(ev==='SIGNED_OUT'){ SESSION=null; render(); } });
})();

</script>
