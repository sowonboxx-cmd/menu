<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1a40">
<meta name="robots" content="noindex">
<title>La Criée · Drevici Oyster</title>
<link rel="icon" href="../charte/files/logos/DreviciOyster-BZH_LogoRond_FondBleu.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@600&display=swap">
<style>
:root{--abyss:#0a1a40;--ink:#0d255c;--navy:#253968;--gold:#d09d39;--red:#cd3232;--brick:#9f2e1f;--paper:#fbfaf6;--slate:#3b4663;
  --line:rgba(255,255,255,.09);--soft:rgba(255,255,255,.06);--mut:#9aa7c7;--green:#7fd89c;--nav:72px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--abyss);color:#fff;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:radial-gradient(120% 40% at 50% -10%,#1b3270 0%,transparent 60%),var(--abyss)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 16px calc(var(--nav) + 34px)}
.mock{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--gold);text-align:center;opacity:.85}
.num{font-variant-numeric:tabular-nums}

/* en-tête */
.top{display:flex;align-items:center;gap:12px;padding:12px 0 4px}
.back{width:40px;height:40px;border-radius:50%;background:var(--soft);display:grid;place-items:center;flex:none;border:0}
.top h1{margin:0;font-family:"Playfair Display",serif;font-weight:600;font-size:26px;line-height:1}
.top p{margin:3px 0 0;font-size:13px;color:var(--mut)}
.live{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  background:rgba(127,216,156,.12);color:var(--green);border-radius:999px;padding:8px 12px;white-space:nowrap}
.live i{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.3}}

/* période (sticky) */
.period{position:sticky;top:0;z-index:6;margin:0 -16px;padding:10px 16px;background:rgba(10,26,64,.9);backdrop-filter:blur(10px);
  display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.period::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--soft);color:#cfd7ea;font-weight:600;font-size:13px;border-radius:999px;padding:9px 15px}
.chip[aria-pressed=true]{background:#fff;color:var(--ink)}
.period .lbl{margin-left:auto;align-self:center;font-size:12px;color:var(--mut);white-space:nowrap;padding-left:8px}

/* barre d'onglets : en bas sur mobile */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:space-around;
  background:rgba(8,20,50,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:8px 6px max(8px,env(safe-area-inset-bottom))}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:700;color:var(--mut);padding:4px 0;position:relative}
.nav a svg{width:23px;height:23px}
.nav a[aria-current=page]{color:#fff}
.nav a[aria-current=page] svg{stroke:var(--gold)}
.nav sup{position:absolute;top:0;left:calc(50% + 6px);background:var(--red);color:#fff;border-radius:999px;font-size:10px;padding:1px 6px}
@media(min-width:1000px){
  .nav{position:static;justify-content:flex-start;gap:6px;background:none;border:0;padding:6px 0 0;backdrop-filter:none}
  .nav a{flex:none;flex-direction:row;gap:8px;font-size:14px;background:var(--soft);border-radius:999px;padding:10px 16px}
  .nav a svg{width:18px;height:18px}
  .nav a[aria-current=page]{background:#fff;color:var(--ink)}
  .nav a[aria-current=page] svg{stroke:var(--ink)}
  .nav sup{position:static}
  .wrap{padding-bottom:48px}
}

/* blocs */
.view{padding-top:6px}
.sec{margin-top:18px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 2px 10px}
.sec-h h2{margin:0;font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:800}
.sec-h a,.sec-h button.lk{font-size:13px;font-weight:700;color:var(--gold);background:none;border:0;padding:0}
.box{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:22px;padding:16px}
.hint{margin:-4px 2px 12px;font-size:13px;color:var(--mut)}
.grid2{display:grid;gap:0 18px}.grid2>*{min-width:0}
@media(min-width:1000px){.grid2{grid-template-columns:1.3fr 1fr;align-items:start}.grid2>.sec{margin-top:18px}}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:720px){.kpis{grid-template-columns:repeat(5,1fr);gap:12px}}
.kpi{border-radius:20px;padding:14px 15px;background:var(--navy)}
.kpi span{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;opacity:.8}
.kpi b{display:block;font-size:26px;font-weight:900;margin-top:3px;letter-spacing:-.02em}
.kpi em{font-style:normal;font-size:12px;font-weight:700;color:var(--green)}
.kpi.gold{background:linear-gradient(135deg,#d9a843,#c48a26);color:var(--abyss)}.kpi.gold em{color:#1d5a35}
.kpi.red{background:var(--red)}.kpi.brick{background:var(--brick)}
.kpi.red em,.kpi.brick em{color:#fff;opacity:.85}
.kpi.wide{grid-column:span 2}@media(min-width:720px){.kpi.wide{grid-column:auto}}

/* règles de commission */
.rules{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rule{background:var(--soft);border-radius:16px;padding:12px 14px}
.rule small{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:700}
.rule .st{display:flex;align-items:center;gap:10px;margin-top:6px}
.rule .st b{font-size:22px;font-weight:900;flex:1;text-align:center;white-space:nowrap}
.rule .st button{flex:none}
.rule .st button{width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.1);font-weight:800;font-size:16px}
.rule p{margin:6px 0 0;font-size:12px;color:var(--mut);line-height:1.35}
.rule.will{background:rgba(208,157,57,.14)}
.rule.will small{color:var(--gold)}

/* répartition par type */
.types{display:grid;gap:10px}
@media(min-width:720px){.types{grid-template-columns:repeat(3,1fr)}}
.type{border-radius:18px;padding:14px;position:relative;overflow:hidden}
.type h3{margin:0;font-size:18px;font-weight:900;text-transform:uppercase;letter-spacing:-.01em}
.type p{margin:2px 0 10px;font-size:12px;opacity:.85}
.type .n{display:flex;gap:16px}
.type .n div{font-size:20px;font-weight:800}
.type .n small{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;opacity:.75;font-weight:700}
.t-resa{background:var(--navy)}.t-plateau{background:var(--red)}.t-event{background:linear-gradient(135deg,#d9a843,#c48a26);color:var(--abyss)}

/* podium / équipe */
.reps{display:grid;gap:10px}
@media(min-width:720px){.reps{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1000px){.reps.three{grid-template-columns:repeat(3,1fr)}}
.repc{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;background:var(--soft);border:1px solid var(--line);
  border-radius:20px;padding:14px;text-align:left;width:100%}
@media(hover:hover){.repc:hover{background:rgba(255,255,255,.09)}}
.av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:18px;flex:none;position:relative}
.av.sm{width:30px;height:30px;font-size:12px}
.av .crown{position:absolute;top:-6px;right:-4px;background:var(--gold);color:var(--abyss);font-size:9px;font-weight:900;border-radius:999px;padding:2px 5px}
.repc b{display:block;font-size:16px}
.repc .rl{font-size:12px;color:var(--mut)}
.repc .mini{display:flex;gap:12px;margin-top:6px;font-size:12px;color:#cfd7ea}
.repc .mini i{font-style:normal;font-weight:800;color:#fff}
.repc .r{text-align:right}
.repc .r b{font-size:17px}
.repc .r span{font-size:11px;color:var(--gold);font-weight:700}

/* tableaux */
.tw{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:700;text-align:right;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
tr[data-go]{cursor:pointer}
@media(hover:hover){tr[data-go]:hover td{background:var(--soft)}}
td .who{display:flex;align-items:center;gap:9px;font-weight:700}
.neg{color:#f19a9a}.pos{color:var(--green)}.gd{color:var(--gold);font-weight:800}
tfoot td{font-weight:800;border-bottom:0;padding-top:13px}

/* commission mobile (cartes) */
.comm{display:grid;gap:8px}
.cm{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.cm:last-child{border-bottom:0}
.cm b{display:block}
.cm .d{font-size:12px;color:var(--mut);margin-top:2px}
.cm .r{text-align:right}
.cm .r b{display:block;font-size:16px;color:var(--gold)}
.cm .r span{font-size:11px;color:var(--mut)}
.only-m{display:block}.only-d{display:none}
@media(min-width:1000px){.only-m{display:none}.only-d{display:block}}

/* codes */
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px}
.filters::-webkit-scrollbar{display:none}
.filters .chip{font-size:12.5px;padding:8px 13px}
.filters .chip span{opacity:.6;margin-left:4px}
.grp{margin-bottom:16px}
.grp h3{margin:0 2px 8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);display:flex;align-items:center;gap:8px}
.grp h3 i{width:8px;height:8px;border-radius:50%}
.code{display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:center;background:var(--soft);border:1px solid var(--line);
  border-radius:18px;padding:12px;margin-bottom:8px}
.lg{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none}
.lg svg{width:19px;height:19px}
.code code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;font-weight:700;letter-spacing:.01em}
.code .lb{display:block;font-size:12.5px;color:#cfd7ea;margin-top:2px}
.code .ow{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:11.5px;color:var(--mut);flex-wrap:wrap}
.pill{display:inline-block;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:700;background:rgba(255,255,255,.08);color:#dfe5f3}
.pill.g{background:rgba(208,157,57,.18);color:var(--gold)}
.code .r{text-align:right}
.code .r b{display:block;font-size:16px;font-weight:800}
.code .r span{display:block;font-size:11px;color:var(--mut)}
.code .r em{font-style:normal;font-size:12px;font-weight:800;color:var(--gold)}
.new{display:block;width:100%;border:1.5px dashed rgba(255,255,255,.22);background:none;border-radius:16px;padding:13px;font-weight:700;font-size:14px;color:#cfd7ea}

/* événements */
.evs{display:grid;gap:10px}
@media(min-width:720px){.evs{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1000px){.evs{grid-template-columns:repeat(3,1fr)}}
.ev{display:grid;grid-template-columns:56px 1fr;gap:12px;background:var(--soft);border:1px solid var(--line);border-radius:20px;padding:13px;text-align:left;width:100%}
@media(hover:hover){.ev:hover{background:rgba(255,255,255,.09)}}
.date{border-radius:14px;background:#fff;color:var(--ink);text-align:center;padding:7px 0;height:max-content}
.date b{display:block;font-size:20px;font-weight:900;line-height:1}
.date span{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--red)}
.date.rec{background:var(--gold)}.date.rec span{color:var(--abyss)}
.ev h3{margin:0;font-size:15.5px;font-weight:800;line-height:1.2}
.ev .meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:6px;font-size:11.5px;color:var(--mut)}
.st-live{background:rgba(127,216,156,.16)!important;color:var(--green)!important}
.st-soon{background:rgba(255,255,255,.1)!important}
.st-done{background:rgba(205,50,50,.18)!important;color:#f19a9a!important}
.st-recur{background:rgba(208,157,57,.18)!important;color:var(--gold)!important}
.ev .n{display:flex;gap:14px;margin-top:9px}
.ev .n div{font-size:16px;font-weight:800}
.ev .n small{display:block;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:700}

/* fil direct */
.feed{list-style:none;margin:0;padding:0}
.feed li{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line);font-size:14px}
.feed li:first-child{border-top:0}
.feed .dot{width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.feed .dot svg{width:16px;height:16px}
.feed .t span{display:block;font-size:11.5px;color:var(--mut);margin-top:2px;font-family:ui-monospace,Menlo,monospace}
.feed .amt{font-weight:800;color:var(--gold);font-size:14px}
.feed .ago{font-size:11px;color:var(--mut);font-weight:600}
.feed li.fresh{animation:fresh 1.4s ease}
@keyframes fresh{from{background:rgba(208,157,57,.28)}}

/* page personne */
.ph{display:flex;align-items:center;gap:14px;margin:18px 0 4px}
.ph .av{width:64px;height:64px;font-size:24px}
.ph h2{margin:0;font-family:"Playfair Display",serif;font-size:30px;font-weight:600;line-height:1}
.ph p{margin:4px 0 0;font-size:13px;color:var(--mut)}
.ptiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:720px){.ptiles{grid-template-columns:repeat(5,1fr)}}
.chart{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:20px}
.chart .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;height:100%;position:relative}
.chart .c i{display:block;border-radius:6px 6px 2px 2px}
.chart .c .s{background:#5b6fa8}
.chart .c .o{background:var(--gold);border-radius:2px}
.chart .c em{position:absolute;top:-18px;left:0;right:0;text-align:center;font-style:normal;font-size:10.5px;font-weight:800;color:#dfe5f3}
.clabels{display:flex;gap:6px;margin-top:6px}
.clabels span{flex:1;text-align:center;font-size:10.5px;color:var(--mut);font-weight:700}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.split{display:grid;gap:10px}
.sp{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px}
.sp b{font-weight:700}
.sp span{font-weight:800}
.sp .bar{grid-column:1/-1;height:8px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}
.sp .bar i{display:block;height:100%;border-radius:9px}
.mgmt{background:rgba(208,157,57,.12);border:1px solid rgba(208,157,57,.35)}
.mgmt .cm{border-color:rgba(208,157,57,.2)}
.swap{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:14px 0 4px}
.swap::-webkit-scrollbar{display:none}
.swap a{flex:none;display:flex;align-items:center;gap:7px;background:var(--soft);border-radius:999px;padding:5px 12px 5px 5px;font-size:13px;font-weight:700}
.swap a[aria-current=true]{background:#fff;color:var(--ink)}

/* feuille */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(5,12,30,.6);backdrop-filter:blur(4px)}
.panel{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--paper);color:var(--ink);border-radius:26px 26px 0 0;padding:10px 20px max(24px,env(safe-area-inset-bottom));animation:up .25s ease}
@media(min-width:720px){.sheet{align-items:center}.panel{border-radius:26px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.grab{width:42px;height:5px;border-radius:9px;background:#d6d2c6;margin:0 auto 14px}
.x{float:right;border:0;background:#ece8dd;border-radius:50%;width:36px;height:36px;font-size:18px;color:var(--ink)}
.panel h3{margin:0;font-family:"Playfair Display",serif;font-size:24px;font-weight:600}
.panel .sub{margin:4px 0 14px;font-size:13px;color:#5f6778}
.panel .pt{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px}
@media(min-width:480px){.panel .pt{grid-template-columns:repeat(4,1fr)}}
.panel .pt div{background:#fff;border:1px solid #e4e1d8;border-radius:14px;padding:10px 12px}
.panel .pt b{display:block;font-size:19px;font-weight:800}
.panel .pt span{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#5f6778;font-weight:700}
.panel h4{margin:0 0 8px;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:#5f6778}
.panel .code{background:#fff;border-color:#e4e1d8}
.panel .code .lb,.panel .code .ow,.panel .code .r span{color:#5f6778}
.panel .pill{background:#ece8dd;color:var(--ink)}
.demo{font-size:12px;color:#9f2e1f;background:#f6e9e6;border-radius:10px;padding:9px 12px;margin:12px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="mock">Maquette · données d'exemple</div>

  <header class="top">
    <a class="back" href="./" aria-label="Retour à La Cabine"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2.2"><path d="M10 3L5 8l5 5"/></svg></a>
    <div><h1>La Criée</h1><p>Tracker · qui a vendu quoi</p></div>
    <span class="live"><i></i>En direct</span>
  </header>

  <nav class="nav" id="nav">
    <a href="#vue" data-t="vue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>Vue</a>
    <a href="#equipe" data-t="equipe"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14.2A5 5 0 0 1 22 19"/></svg>Équipe</a>
    <a href="#codes" data-t="codes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 14h3v3h-3zM20 17v4h-3M20 14h1"/></svg>Codes</a>
    <a href="#events" data-t="events"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M12 13.5l1 2 2.2.3-1.6 1.5.4 2.2-2-1.1-2 1.1.4-2.2-1.6-1.5 2.2-.3z"/></svg>Events</a>
    <a href="#direct" data-t="direct"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>Direct<sup id="liveCount">3</sup></a>
  </nav>

  <div class="period" id="period">
    <button class="chip" data-p="w" aria-pressed="true">Semaine</button>
    <button class="chip" data-p="m" aria-pressed="false">Mois</button>
    <button class="chip" data-p="q" aria-pressed="false">3 mois</button>
    <button class="chip" data-p="a" aria-pressed="false">Depuis le début</button>
    <span class="lbl" id="plbl"></span>
  </div>

  <main id="main"></main>
</div>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"><div class="panel" id="panel"></div></div>

<script>

const fmt=n=>Math.round(n).toLocaleString('fr-FR');
const eur=n=>fmt(n)+' €';
const pct=n=>(Math.round(n*10)/10).toString().replace('.',',')+' %';
const rep=id=>REPS.find(r=>r.id===id);
const av=(r,cls='')=>`<span class="av ${cls}" style="background:${r.color};color:${r.ink||'#fff'}">${r.name[0]}${r.id===ADMIN&&!cls?'<span class="crown">ADMIN</span>':''}</span>`;
const sc=c=>({s:c.s*K(),r:c.r*K(),o:c.o*K(),ca:c.ca*K()});
const sum=arr=>arr.reduce((a,c)=>{const x=sc(c);return{s:a.s+x.s,r:a.r+x.r,o:a.o+x.o,ca:a.ca+x.ca}},{s:0,r:0,o:0,ca:0});
const conv=t=>t.s?(t.r+t.o)/t.s*100:0;
function seeded(str){let h=2166136261;for(const ch of str){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return()=>{h^=h<<13;h^=h>>>17;h^=h<<5;return((h>>>0)%1000)/1000}}

/* commissions */
function comm(id){
  const own=sum(CODES.filter(c=>c.rep===id));
  const brute=own.ca*RATE/100;
  if(id===ADMIN){
    const gestion=REPS.filter(r=>r.id!==ADMIN).reduce((a,r)=>a+sum(CODES.filter(c=>c.rep===r.id)).ca*RATE/100*MGMT/100,0);
    return {own,brute,cut:0,gestion,net:brute+gestion};
  }
  const cut=brute*MGMT/100;
  return {own,brute,cut,gestion:0,net:brute-cut};
}

/* ───────── Briques ───────── */
function kpis(t,extra){
  const tot=REPS.reduce((a,r)=>a+comm(r.id).brute,0);
  return `<section class="kpis">
    <div class="kpi"><span>Scans</span><b class="num">${fmt(t.s)}</b><em>+18 %</em></div>
    <div class="kpi red"><span>Ventes</span><b class="num">${fmt(t.o)}</b><em>plateaux & à emporter</em></div>
    <div class="kpi"><span>Résas · inscrits</span><b class="num">${fmt(t.r)}</b><em>+9 %</em></div>
    <div class="kpi brick"><span>Conversion</span><b class="num">${pct(conv(t))}</b><em>scan → vente ou résa</em></div>
    <div class="kpi gold wide"><span>CA généré</span><b class="num">${eur(t.ca)}</b><em>${eur(extra??tot)} de commissions</em></div>
  </section>`;
}
function repCard(r){
  const c=comm(r.id),t=c.own;
  return `<a class="repc" href="#p/${r.id}">${av(r)}
    <span><b>${r.name}</b><span class="rl">${r.role}</span>
      <span class="mini"><span><i>${fmt(t.s)}</i> scans</span><span><i>${fmt(t.o)}</i> ventes</span><span><i>${fmt(t.r)}</i> résas</span></span></span>
    <span class="r"><b class="num">${eur(t.ca)}</b><span>${eur(c.net)} net</span></span></a>`;
}
function codeRow(c,light){
  const x=sc(c), r=rep(c.rep), brute=x.ca*RATE/100;
  const share=c.rep===ADMIN?`<span class="pill g">${RATE} % Will</span>`
    :`<span class="pill">${pct(RATE*(1-MGMT/100))} ${r.name}</span><span class="pill g">${pct(RATE*MGMT/100)} Will</span>`;
  return `<div class="code"><span class="lg" style="background:${CBG[c.canal]}">${ICON[c.canal]}</span>
    <span><code>${c.code}</code><span class="lb">${c.lb}</span>
      <span class="ow">${av(r,'sm')}${r.name} · ${share}</span></span>
    <span class="r"><b class="num">${fmt(x.s)}</b><span>scans</span><span>${fmt(x.r+x.o)} conv.</span>${x.ca?`<em class="num">${eur(brute)}</em>`:''}</span></div>`;
}
function evStats(e){ if(e.fixed) return e.fixed; const cs=CODES.filter(c=>c.ev===e.id); return cs.length?sum(cs):null; }
function evCard(e){
  const t=evStats(e), r=rep(e.rep), rec=e.st==='recur';
  return `<button class="ev" data-ev="${e.id}"><span class="date ${rec?'rec':''}"><b>${e.d}</b><span>${e.m}</span></span>
    <span><h3>${e.n}</h3><span class="meta"><span class="pill st-${e.st}">${ST[e.st]}</span><span class="pill">${e.k}</span>${av(r,'sm')}${r.name}</span>
    ${t?`<span class="n"><div class="num">${fmt(t.s)}<small>Scans</small></div><div class="num">${fmt(t.r)}<small>Inscrits</small></div><div class="num">${fmt(t.o)}<small>Ventes</small></div><div class="num">${eur(t.ca)}<small>CA</small></div></span>`
       :`<span class="meta" style="margin-top:9px">${e.when} · code à créer</span>`}</span></button>`;
}
function feedList(items){
  return `<ul class="feed">${items.map((f,i)=>{const r=rep(f.rep),bg=f.k==='o'?'var(--gold)':f.k==='r'?'var(--red)':'var(--navy)';
    return `<li class="${f.fresh?'fresh':''}"><span class="dot" style="background:${bg}">${ICON[f.k]}</span>
      <span class="t"><b>${r.name}</b> · ${f.t}<span>${f.code}</span></span>
      <span style="text-align:right">${f.amt?`<span class="amt">+${f.amt} €</span><br>`:''}<span class="ago">${f.ago}</span></span></li>`}).join('')}</ul>`;
}
function commTable(){
  const rows=REPS.map(r=>({r,c:comm(r.id)})).sort((a,b)=>b.c.net-a.c.net);
  const T=rows.reduce((a,{c})=>({ca:a.ca+c.own.ca,b:a.b+c.brute}),{ca:0,b:0});
  const desk=`<div class="only-d tw"><table><thead><tr><th>Personne</th><th>CA généré</th><th>Commission ${RATE} %</th><th>Part gestion</th><th>Net perçu</th></tr></thead><tbody>
    ${rows.map(({r,c})=>`<tr data-go="#p/${r.id}"><td><span class="who">${av(r,'sm')}${r.name}</span></td><td class="num">${eur(c.own.ca)}</td><td class="num">${eur(c.brute)}</td>
      <td class="num ${r.id===ADMIN?'pos':'neg'}">${r.id===ADMIN?'+'+eur(c.gestion):'−'+eur(c.cut)}</td><td class="num gd">${eur(c.net)}</td></tr>`).join('')}
    </tbody><tfoot><tr><td>Total à verser</td><td class="num">${eur(T.ca)}</td><td class="num">${eur(T.b)}</td><td class="num">0 €</td><td class="num gd">${eur(T.b)}</td></tr></tfoot></table></div>`;
  const mob=`<div class="only-m comm">${rows.map(({r,c})=>`<a class="cm" href="#p/${r.id}">${av(r,'sm')}
      <span><b>${r.name}</b><span class="d">${eur(c.own.ca)} de CA · ${r.id===ADMIN?`<span class="pos">+${eur(c.gestion)} gestion</span>`:`<span class="neg">−${eur(c.cut)} gestion</span>`}</span></span>
      <span class="r"><b class="num">${eur(c.net)}</b><span>net perçu</span></span></a>`).join('')}
      <div class="cm" style="grid-template-columns:1fr auto"><b>Total à verser par le restaurant</b><span class="r"><b class="num">${eur(T.b)}</b></span></div></div>`;
  return desk+mob;
}
function rulesBox(){
  return `<div class="rules">
    <div class="rule"><small>Commission</small><div class="st"><button data-rule="RATE" data-d="-1">−</button><b class="num">${RATE} %</b><button data-rule="RATE" data-d="1">+</button></div>
      <p>du CA généré par chaque code, pour tout le monde.</p></div>
    <div class="rule will"><small>Part gestion · Will</small><div class="st"><button data-rule="MGMT" data-d="-1">−</button><b class="num">${MGMT} %</b><button data-rule="MGMT" data-d="1">+</button></div>
      <p>de chaque commission de l'équipe, soit ${pct(RATE*MGMT/100)} du CA.</p></div></div>`;
}

  const types=Object.entries(TYPES).map(([k,v])=>{const s=sum(CODES.filter(c=>c.type===k));
    return `<a class="type t-${k}" href="#codes" data-f="${k}"><h3>${v.n}</h3><p>${CODES.filter(c=>c.type===k).length} codes actifs</p>
      <span class="n"><div class="num">${fmt(s.s)}<small>Scans</small></div><div class="num">${fmt(k==='plateau'?s.o:s.r)}<small>${k==='plateau'?'Ventes':k==='event'?'Inscrits':'Résas'}</small></div><div class="num">${eur(s.ca)}<small>CA</small></div></span></a>`}).join('');

  <div class="grid2">

  <section class="sec"><div class="sec-h"><h2>Events à venir</h2><a href="#events">Tout voir</a></div><div class="evs">${next}</div></section>
  <section class="sec"><div class="sec-h"><h2>Dernières alertes</h2><a href="#direct">Fil complet</a></div><div class="box">${feedList(FEED.slice(0,4))}</div></section>`;
};

  const list=CODES.filter(c=>(CF==='all'||c.type===CF)&&(CR==='all'||c.rep===CR));
  const chips=[['all','Tous',CODES.length],...Object.entries(TYPES).map(([k,v])=>[k,v.n.split(' ')[0]==='Événements'?'Events':v.n.split(' ')[0]==='Ventes'?'Plateaux':'Résas',CODES.filter(c=>c.type===k).length])]
    .map(([k,l,n])=>`<button class="chip" data-cf="${k}" aria-pressed="${CF===k}">${l}<span>${n}</span></button>`).join('');
  const people=[['all','Tout le monde'],...REPS.map(r=>[r.id,r.name])].map(([k,l])=>`<button class="chip" data-cr="${k}" aria-pressed="${CR===k}">${l}</button>`).join('');
  const groups=Object.entries(TYPES).map(([k,v])=>{const g=list.filter(c=>c.type===k).sort((a,b)=>b.s-a.s);
    return g.length?`<div class="grp"><h3><i style="background:${v.c}"></i>${v.n} · ${g.length}</h3>${g.map(c=>codeRow(c)).join('')}</div>`:''}).join('');
  const table=`<div class="only-d tw"><table><thead><tr><th>Code</th><th>Type</th><th>Canal</th><th>Porteur</th><th>Scans</th><th>Conv.</th><th>CA</th><th>Part porteur</th><th>Part Will</th></tr></thead><tbody>
    ${list.slice().sort((a,b)=>b.ca-a.ca).map(c=>{const x=sc(c),r=rep(c.rep),b=x.ca*RATE/100,w=c.rep===ADMIN?b:b*MGMT/100;
      return `<tr><td><code style="font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:12.5px">${c.code}</code></td><td>${TYPES[c.type].n.split(' ')[0]}</td><td>${CANAL[c.canal]}</td>
      <td><span class="who" style="justify-content:flex-end">${av(r,'sm')}${r.name}</span></td><td class="num">${fmt(x.s)}</td><td class="num">${pct(conv(x))}</td><td class="num">${eur(x.ca)}</td>
      <td class="num">${c.rep===ADMIN?'—':`${pct(RATE*(1-MGMT/100))} · ${eur(b-w)}`}</td><td class="num gd">${c.rep===ADMIN?RATE+' %':pct(RATE*MGMT/100)} · ${eur(w)}</td></tr>`}).join('')}
    </tbody></table></div>`;
  return `<section class="sec"><div class="sec-h"><h2>Codes</h2><button class="lk" type="button">+ Créer un code</button></div>
    <p class="hint">Format : PERSONNE-TYPE-SUPPORT. Un code = qui + quoi + où.</p>
    <div class="filters">${chips}</div><div class="filters">${people}</div>
    <div class="only-m">${groups||'<p class="hint">Aucun code.</p>'}<button class="new" type="button">+ Créer un code</button></div>
    <div class="box only-d" style="margin-top:4px">${table}</div></section>`;
};

let EF='all';
V.events=()=>{
  const list=EVENTS.filter(e=>EF==='all'||e.st===EF);
  const chips=[['all','Tous'],['live','En cours'],['soon','À venir'],['recur','Récurrents'],['done','Terminés']]
    .map(([k,l])=>`<button class="chip" data-ef="${k}" aria-pressed="${EF===k}">${l}<span>${k==='all'?EVENTS.length:EVENTS.filter(e=>e.st===k).length}</span></button>`).join('');
  const T=list.map(evStats).filter(Boolean).reduce((a,t)=>({s:a.s+t.s,r:a.r+t.r,o:a.o+t.o,ca:a.ca+t.ca}),{s:0,r:0,o:0,ca:0});
  const table=`<div class="only-d tw"><table><thead><tr><th>Événement</th><th>Type</th><th>Quand</th><th>Responsable</th><th>Statut</th><th>Scans</th><th>Inscrits</th><th>Ventes</th><th>CA</th></tr></thead><tbody>
    ${list.map(e=>{const t=evStats(e),r=rep(e.rep);return `<tr data-ev="${e.id}" data-go=""><td><b>${e.n}</b></td><td>${e.k}</td><td>${e.when}</td><td><span class="who" style="justify-content:flex-end">${av(r,'sm')}${r.name}</span></td>
      <td><span class="pill st-${e.st}">${ST[e.st]}</span></td><td class="num">${t?fmt(t.s):'—'}</td><td class="num">${t?fmt(t.r):'—'}</td><td class="num">${t?fmt(t.o):'—'}</td><td class="num gd">${t?eur(t.ca):'—'}</td></tr>`}).join('')}
    </tbody><tfoot><tr><td colspan="5">Total</td><td class="num">${fmt(T.s)}</td><td class="num">${fmt(T.r)}</td><td class="num">${fmt(T.o)}</td><td class="num gd">${eur(T.ca)}</td></tr></tfoot></table></div>`;
  return `<section class="sec"><div class="sec-h"><h2>Events & campagnes</h2><button class="lk" type="button">+ Nouvel event</button></div>
    <p class="hint">Pop-up, dégustations, soirées, Running Club, fêtes… chacun avec ses codes.</p>
    <div class="filters">${chips}</div>
    <div class="evs">${list.map(evCard).join('')}</div>
    <section class="sec"><div class="sec-h"><h2>Tableau des events</h2></div><div class="box">${table}<div class="only-m comm">${list.map(e=>{const t=evStats(e);return `<div class="cm" style="grid-template-columns:1fr auto"><span><b>${e.n}</b><span class="d">${e.k} · ${ST[e.st]}</span></span><span class="r"><b class="num">${t?eur(t.ca):'—'}</b><span>${t?fmt(t.r+t.o)+' conv.':'pas encore de code'}</span></span></div>`}).join('')}</div></div></section>
  </section>`;
};
V.direct=()=>`<section class="sec"><div class="sec-h"><h2>En direct</h2></div><p class="hint">Chaque scan, résa et vente, à la seconde. Une alerte part à chaque vente.</p>
  <div class="box">${feedList(FEED)}</div></section>`;

/* page personne */
V.person=id=>{
  const r=rep(id); if(!r) return V.equipe();
  const c=comm(id), t=c.own, mine=CODES.filter(x=>x.rep===id);
  const labels=BUCK[P], rnd=seeded(id+P);
  const wk=P==='w'?[.8,.7,.9,1,1.4,1.8,1.3]:labels.map((_,i)=>.6+i/labels.length*.6);
  const w=labels.map((_,i)=>wk[i]*(.75+rnd()*.5)), W=w.reduce((a,b)=>a+b,0);
  const ss=w.map(v=>t.s*v/W), oo=w.map(v=>(t.o+t.r)*v/W), mx=Math.max(...ss);
  const chart=`<div class="chart">${ss.map((v,i)=>`<div class="c"><em class="num">${fmt(v)}</em><i class="s" style="height:${(v-oo[i])/mx*100}%"></i><i class="o" style="height:${oo[i]/mx*100}%"></i></div>`).join('')}</div>
    <div class="clabels">${labels.map(l=>`<span>${l}</span>`).join('')}</div>
    <div class="legend"><span><i style="background:#5b6fa8"></i>Scans</span><span><i style="background:var(--gold)"></i>Ventes + résas</span></div>`;
  const byType=Object.entries(TYPES).map(([k,v])=>({k,v,s:sum(mine.filter(x=>x.type===k))})).filter(x=>x.s.s);
  const maxCa=Math.max(1,...byType.map(x=>x.s.ca));
  const split=byType.map(({k,v,s})=>`<div class="sp"><b>${v.n}</b><span class="num">${eur(s.ca)}</span>
    <span class="bar"><i style="width:${s.ca/maxCa*100}%;background:${v.c}"></i></span>
    <span style="grid-column:1/-1;font-size:12px;color:var(--mut);font-weight:500">${fmt(s.s)} scans · ${fmt(k==='plateau'?s.o:s.r)} ${k==='plateau'?'ventes':k==='event'?'inscrits':'résas'} · ${pct(conv(s))} de conversion</span></div>`).join('');
  const myEv=EVENTS.filter(e=>e.rep===id);
  const mgmt=id===ADMIN?`<section class="sec"><div class="sec-h"><h2>Part gestion · ${MGMT} %</h2></div>
    <div class="box mgmt"><p class="hint" style="margin:0 0 6px">Ce que Will touche sur les commissions de chacun.</p><div class="comm">
    ${REPS.filter(x=>x.id!==ADMIN).map(x=>{const cx=comm(x.id);return `<a class="cm" href="#p/${x.id}">${av(x,'sm')}<span><b>${x.name}</b><span class="d">Commission ${eur(cx.brute)}</span></span><span class="r"><b class="num">+${eur(cx.cut)}</b><span>pour Will</span></span></a>`}).join('')}
    <div class="cm" style="grid-template-columns:1fr auto"><b>Total gestion</b><span class="r"><b class="num">+${eur(c.gestion)}</b></span></div></div></div></section>`:'';
  const feed=FEED.filter(f=>f.rep===id);
  const swap=`<nav class="swap">${REPS.map(x=>`<a href="#p/${x.id}" aria-current="${x.id===id}">${av(x,'sm')}${x.name}</a>`).join('')}</nav>`;
  return `${swap}
  <div class="ph">${av(r)}<div><h2>${r.name}</h2><p>${r.role} · ${PER[P].l}</p></div></div>
  <section class="sec ptiles">
    <div class="kpi"><span>Scans</span><b class="num">${fmt(t.s)}</b></div>
    <div class="kpi red"><span>Ventes</span><b class="num">${fmt(t.o)}</b></div>
    <div class="kpi"><span>Résas · inscrits</span><b class="num">${fmt(t.r)}</b></div>
    <div class="kpi brick"><span>CA généré</span><b class="num">${eur(t.ca)}</b></div>
    <div class="kpi gold wide"><span>${id===ADMIN?'Gagné (ventes + gestion)':'Commission nette'}</span><b class="num">${eur(c.net)}</b>
      <em>${id===ADMIN?`${eur(c.brute)} ventes + ${eur(c.gestion)} gestion`:`${eur(c.brute)} − ${eur(c.cut)} gestion`}</em></div>
  </section>
  <div class="grid2">
    <section class="sec"><div class="sec-h"><h2>Activité</h2></div><div class="box">${chart}</div></section>
    <section class="sec"><div class="sec-h"><h2>Ce qu'${r.id==='lea'||r.id==='ines'?'elle':'il'} a déclenché</h2></div><div class="box split">${split}</div></section>
  </div>
  ${mgmt}
  <div class="grid2">
    <section class="sec"><div class="sec-h"><h2>Ses codes · ${mine.length}</h2><button class="lk" type="button">+ Code</button></div>${mine.sort((a,b)=>b.ca-a.ca).map(x=>codeRow(x)).join('')}</section>
    <section class="sec"><div class="sec-h"><h2>Dernières actions</h2></div><div class="box">${feed.length?feedList(feed):'<p class="hint" style="margin:0">Rien pour l’instant.</p>'}</div>
      ${myEv.length?`<div class="sec-h" style="margin-top:18px"><h2>Ses events</h2></div><div class="evs" style="grid-template-columns:1fr">${myEv.map(evCard).join('')}</div>`:''}</section>
  </div>`;
};

/* ───────── Routage ───────── */
const main=document.getElementById('main');
function route(){
  const h=location.hash.slice(1)||'vue';
  const isP=h.startsWith('p/'), tab=isP?'equipe':(V[h]?h:'vue');
  document.querySelectorAll('#nav a').forEach(a=>a.setAttribute('aria-current',a.dataset.t===tab?'page':'false'));
  document.getElementById('plbl').textContent=PER[P].l;
  main.innerHTML=`<div class="view">${isP?V.person(h.slice(2)):V[tab]()}</div>`;
  if(tab==='direct') document.getElementById('liveCount').hidden=true;
}
addEventListener('hashchange',()=>{route();scrollTo({top:0})});

/* ───────── Interactions ───────── */
document.addEventListener('click',e=>{
  const p=e.target.closest('[data-p]'); if(p){P=p.dataset.p;document.querySelectorAll('#period .chip').forEach(x=>x.setAttribute('aria-pressed',x===p));route();return}
  const f=e.target.closest('[data-f]'); if(f){CF=f.dataset.f;CR='all'}
  const cf=e.target.closest('[data-cf]'); if(cf){CF=cf.dataset.cf;route();return}
  const cr=e.target.closest('[data-cr]'); if(cr){CR=cr.dataset.cr;route();return}
  const ef=e.target.closest('[data-ef]'); if(ef){EF=ef.dataset.ef;route();return}
  const ru=e.target.closest('[data-rule]'); if(ru){const d=+ru.dataset.d; if(ru.dataset.rule==='RATE')RATE=Math.min(30,Math.max(1,RATE+d)); else MGMT=Math.min(50,Math.max(0,MGMT+d)); route();return}
  const ev=e.target.closest('[data-ev]'); if(ev){openEvent(ev.dataset.ev);return}
  const go=e.target.closest('tr[data-go]'); if(go&&go.dataset.go){location.hash=go.dataset.go;return}
  if(e.target===sheet||e.target.closest('[data-close]')) sheet.hidden=true;
});
const sheet=document.getElementById('sheet');
function openEvent(id){
  const e=EVENTS.find(x=>x.id===id), t=evStats(e), r=rep(e.rep), cs=CODES.filter(c=>c.ev===id);
  document.getElementById('panel').innerHTML=`<div class="grab"></div><button class="x" data-close aria-label="Fermer">×</button>
    <h3>${e.n}</h3><p class="sub">${e.k} · ${e.when} · ${ST[e.st]} · responsable ${r.name}</p>
    ${t?`<div class="pt"><div><b class="num">${fmt(t.s)}</b><span>Scans</span></div><div><b class="num">${fmt(t.r)}</b><span>Inscrits</span></div><div><b class="num">${fmt(t.o)}</b><span>Ventes</span></div><div><b class="num">${eur(t.ca)}</b><span>CA</span></div></div>`:''}
    <h4>Codes liés</h4>${cs.length?cs.map(c=>codeRow(c)).join(''):`<p class="sub">Aucun code pour l'instant. Créez-en un par personne qui fait la promo (ex. ${r.name.toUpperCase()}-EVENT-${e.id.toUpperCase()}).</p>`}
    <p class="demo">Maquette : chiffres d'exemple.</p>`;
  sheet.hidden=false;
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')sheet.hidden=true});

/* alerte simulée */
setTimeout(()=>{FEED.unshift({k:'o',rep:'ines',t:'Plateau royal · table 3',code:'INES-PLATEAU-TABLE',amt:89,ago:'à l’instant',fresh:true});
  const lc=document.getElementById('liveCount'); if(!lc.hidden) lc.textContent='4';
  const h=location.hash.slice(1)||'vue'; if(h==='vue'||h==='direct'||h==='p/ines') route();},7000);

route();
</script>
</body>
</html>
