<!DOCTYPE html>
<html lang="fr">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans+Condensed:wght@300;700&family=Lovelo:wght@400;700&family=Open+Sans:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" id="themeColorMeta" content="#10285E">
<title>Menu</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Jost:wght@300;400;500&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
/* NOTE: the viewport meta tag already sets user-scalable=no, but modern
   iOS Safari ignores that for accessibility reasons and allows pinch-zoom
   regardless — there's no way to fully block that on iOS anymore. This at
   least prevents the double-tap-to-zoom gesture everywhere, which does
   still work on all browsers. */
html,body{touch-action:manipulation}
/* Whole site scaled up 10% — everything (text, spacing, icons) grows
   proportionally together, rather than bumping just a base font-size
   which would leave fixed-px elements (icons, some paddings) behind.
   Desktop only — on mobile this made everything feel too large/zoomed
   in on an already-small screen, so it's scoped to bigger viewports. */
@media(min-width:641px){ html{zoom:1.1} }
:root{--restoFont:'Cormorant Garamond';--navy:#10285E;--gold:#C6A24A;--bg:#F4F0EA;--white:#fff;--border:rgba(0,0,0,0.08);--text:#1a1a1a;--text2:#666;--text3:#aaa;--r:10px;--rs:6px;--subtitleColor:rgba(255,255,255,0.45);--tabInactiveColor:rgba(255,255,255,0.4)}
body{background:var(--bg);font-family:'Jost',sans-serif;font-weight:400;font-size:14px}

/* ── LIGHTBOX ── */
.lb{position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:9100;display:none;align-items:center;justify-content:center}
.lb.open{display:flex}
.lb-card{position:relative;width:min(420px,92vw);border-radius:16px;overflow:hidden;background:#10285E;margin-top:44px}
.lb-zone{position:absolute;top:0;bottom:0;width:45%;z-index:3;cursor:pointer}
.lb-zone-left{left:0}
.lb-zone-right{right:0}
.lb img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:none;border:none;color:#fff;width:44px;height:44px;cursor:pointer;font-size:28px;display:flex;align-items:center;justify-content:center;text-shadow:0 1px 6px rgba(0,0,0,0.6);transition:opacity .15s;z-index:2}
.lb-nav:hover{opacity:.75}
.lb-prev{left:10px}.lb-next{right:10px}
.lb-footer{background:#10285E;padding:14px 20px 20px}
.lb-cat-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:10px}
.lb-cat-line{flex:1;height:1px;background:rgba(255,255,255,0.45);max-width:40px}
.lb-cat-label{font-family:'Open Sans',sans-serif;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,0.45)}
.lb-dish-name{font-family:'Open Sans',sans-serif;font-size:16px;color:#fff;font-weight:600;line-height:1.2;text-align:center;margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em}
.lb-dish-desc{font-size:13px;color:rgba(255,255,255,0.65);font-family:'Open Sans',sans-serif;font-weight:400;line-height:1.55;text-align:center;margin-bottom:10px}
.lb-footer-row{display:flex;align-items:center;justify-content:center}
.lb-count{font-size:11px;color:#fff;letter-spacing:.12em;font-family:'Open Sans',sans-serif;background:none;padding:2px 0}
.lb-close{position:absolute;top:-40px;right:0;background:none;border:none;color:#fff;font-size:22px;cursor:pointer;line-height:1;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:3;opacity:.8;transition:opacity .15s}
.font-gallery-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9150;display:flex;align-items:center;justify-content:center;padding:20px}
.font-gallery-card{background:#fff;border-radius:14px;width:min(560px,100%);max-height:85vh;display:flex;flex-direction:column;overflow:hidden}
.font-gallery-hdr{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);font-family:'Jost',sans-serif;font-weight:500;font-size:15px;color:var(--text)}
.font-gallery-list{overflow-y:auto;padding:6px 0}
.font-gallery-row{padding:12px 20px;cursor:pointer;border-bottom:1px solid rgba(0,0,0,.04);transition:background .1s}
.font-gallery-row:hover{background:#faf9f6}
.font-gallery-name{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);font-family:'Jost',sans-serif;margin-bottom:3px}
.font-gallery-sample{font-size:22px;color:var(--text);line-height:1.2}
.lb-close:hover{opacity:1}

/* ── LAYOUT ── */
.page{background:var(--bg);min-height:100vh;padding-bottom:100px}
.container{max-width:680px;margin:0 auto;padding:0 16px}

/* ── HEADER ── */
.header{background:var(--navy);padding:14px 0 0}
.header .container{display:flex;flex-direction:column;align-items:center}
.header-top{width:100%;display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.header-top-left{display:flex;align-items:center;gap:6px}
/* Revenu à l'emplacement d'origine (à côté du logo, dans le flux
   normal du header) — la barre noire fixe en haut posait un problème
   de chevauchement avec le titre jamais résolu après plusieurs
   tentatives (position:fixed + marge compensatoire sur le menu).
   Plat/noir gardé pour les icônes, juste plus la position "barre
   séparée". */
.header-top-right{display:flex;align-items:center;gap:6px;visibility:hidden}
body.is-admin .header-top-right, body.admin-entry-visible .header-top-right{visibility:visible}

.lang-wrap{position:relative}
.lang-sel{display:flex;align-items:center;gap:3px;padding:5px 10px;border:1px solid rgba(255,255,255,0.2);border-radius:6px;cursor:pointer;background:var(--navy);color:rgba(255,255,255,0.85);font-size:11px;font-family:'Jost',sans-serif;font-weight:500;letter-spacing:.06em;user-select:none}
.lang-dd{position:absolute;left:0;top:calc(100% + 6px);background:#fff;border:1px solid rgba(0,0,0,0.1);border-radius:8px;overflow:hidden;z-index:400;display:none;min-width:140px;box-shadow:0 4px 20px rgba(0,0,0,0.15)}
.lang-dd.open{display:block}
.lang-opt{padding:9px 14px;font-size:12px;color:var(--text2);cursor:pointer;font-family:'Jost',sans-serif;white-space:nowrap;transition:background .1s}
.lang-opt:hover{background:var(--bg)}
.lang-opt.active{color:var(--navy);font-weight:500}
.admin-btn{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border:none;outline:none;box-shadow:none;-webkit-appearance:none;appearance:none;border-radius:6px;cursor:pointer;background:transparent;color:#fff;transition:background .15s;flex:none}
.admin-btn:hover{background:rgba(255,255,255,0.15)}
.mode-btn{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border:none;outline:none;box-shadow:none;-webkit-appearance:none;appearance:none;border-radius:6px;cursor:pointer;background:transparent;color:#fff;transition:all .15s;flex:none}
.mode-btn svg{width:15px;height:15px}
.mode-btn.active{opacity:1;background:rgba(255,255,255,0.15)}
/* edit popup */
.edit-pop{position:fixed;inset:0;z-index:9200;display:none;align-items:center;justify-content:center;background:rgba(16,40,94,0.55);padding:16px}
.edit-pop.open{display:flex}
.edit-pop-box{background:#fff;border-radius:14px;width:100%;max-width:680px;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
.edit-pop-hdr{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;border-radius:14px 14px 0 0;z-index:2}
.edit-pop-title{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;color:var(--navy)}
.edit-pop-close{width:30px;height:30px;border:none;background:var(--bg);border-radius:8px;cursor:pointer;font-size:16px;color:var(--text2);display:flex;align-items:center;justify-content:center}
.edit-pop-body{padding:18px 20px}
.edit-pop-foot{padding:14px 20px 18px;position:sticky;bottom:0;background:#fff;border-top:1px solid var(--border);border-radius:0 0 14px 14px}
.edit-save{width:100%;padding:13px;background:var(--navy);color:#fff;border:none;border-radius:10px;font-family:'Jost',sans-serif;font-size:14px;font-weight:500;letter-spacing:.03em;cursor:pointer}
.edit-save:active{transform:scale(0.99)}
.ef{margin-bottom:14px}
.el{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text2);font-family:'Jost',sans-serif;margin-bottom:5px}
.ei{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-family:'Jost',sans-serif;font-size:14px;color:var(--text);background:#fff}
.ei:focus{outline:none;border-color:var(--navy)}
textarea.ei{resize:vertical;min-height:70px;line-height:1.5}
.ei-check{display:flex;align-items:center;gap:9px;cursor:pointer;padding:4px 0}
.ei-check input{width:17px;height:17px;accent-color:var(--navy);flex:none}
.ei-check span{font-size:13px;font-family:'Jost',sans-serif;color:var(--text)}
.ei-badges{display:flex;gap:8px;flex-wrap:wrap}
.badge-toggle{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1.5px solid var(--border);border-radius:20px;background:#fff;font-family:'Jost',sans-serif;font-size:12.5px;color:var(--text2);cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent}
.badge-toggle .bt-emoji{font-size:15px;line-height:1}
.badge-toggle.on{border-color:var(--navy);background:rgba(16,40,94,0.07);color:var(--navy);font-weight:500}
.badge-toggle:active{transform:scale(0.97)}
.ef-acc{border:1px solid var(--border);border-radius:10px;margin-bottom:14px;overflow:hidden;background:#fbfbfa}
.ef-acc>summary{list-style:none;cursor:pointer;padding:12px 14px;font-family:'Jost',sans-serif;font-size:13px;font-weight:500;color:var(--text);display:flex;align-items:center;justify-content:space-between;user-select:none}
.ef-acc>summary::-webkit-details-marker{display:none}
.ef-acc>summary::after{content:'▾';font-size:14px;line-height:1;color:currentColor;transition:transform .2s;margin-left:8px;display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px}
.ef-acc[open]>summary::after{transform:rotate(180deg)}
.ef-acc .acc-body{padding:2px 14px 12px}
.ef-acc .acc-body .ef:first-child{margin-top:0}
.badge-emoji{font-size:15px;line-height:1;display:inline-block;vertical-align:middle;margin-right:2px}
.efrow{display:flex;gap:10px}
.efrow>.ef{flex:1}
/* edit-mode clickable blocks */
.edit-mode [data-edit],.edit-mode .edit-block{cursor:pointer;position:relative;transition:box-shadow .12s}
.edit-mode [data-edit]:hover,.edit-mode .edit-block:hover{box-shadow:0 0 0 2px var(--navy);border-radius:8px}
.edit-mode .dish-row[data-edit]:hover,.edit-mode .bev-row[data-edit]:hover{box-shadow:inset 0 0 0 2px var(--navy);border-radius:8px}
.admin-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.admin-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.logo-img{height:36px;max-width:180px;object-fit:contain;display:none}
.logo-text{font-family:var(--restoFont,'Cormorant Garamond'),serif;font-size:20px;font-weight:700;color:#fff;letter-spacing:.08em;white-space:nowrap;text-align:center}
.header-top{position:relative}
.logo-centered{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;display:flex;align-items:center;justify-content:center}
.header-sub{font-size:10px;font-weight:300;color:var(--subtitleColor,rgba(255,255,255,0.45));letter-spacing:.14em;text-transform:uppercase;margin-bottom:0;text-align:center}

/* ── STICKY NAV ── */
.sticky-header-group{position:sticky;top:0;z-index:99;background:var(--navy)}
.sticky-nav{position:relative}
.nav-bar{background:var(--navy);overflow-x:auto;scrollbar-width:none;display:flex;border-bottom:none;margin-bottom:0;-webkit-overflow-scrolling:touch}
.nav-bar::-webkit-scrollbar{display:none}
.nav-bar-inner{display:flex;margin:0 auto;padding:0 16px 0 16px;min-width:max-content;position:relative}
.nav-indicator{position:absolute;top:6px;bottom:6px;background:#fff;border-radius:var(--rs);pointer-events:none;transition:left .22s ease,width .22s ease;z-index:0}
.nav-tab{flex:none;padding:11px 14px 10px;font-size:11px;font-weight:500;font-family:'Jost',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--tabInactiveColor,rgba(255,255,255,0.4));cursor:pointer;white-space:nowrap;transition:all .2s;position:relative;z-index:1}
.nav-tab.active{color:var(--navy)}
.nav-tab.nav-tab-swiping{color:var(--navy)}
.view-bar{background:#fff;border-bottom:1px solid var(--border)}
.view-bar-inner{max-width:680px;margin:0 auto;padding:9px 16px;display:flex;align-items:center;justify-content:space-between}
.view-tab-label{font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);font-family:'Jost',sans-serif}
.view-btns{display:flex;gap:4px}
.header-reserve-btn{display:inline-flex;align-items:center;background:var(--navy);color:#fff;font-size:11px;font-weight:500;font-family:Jost,sans-serif;padding:5px 14px;border-radius:6px;text-decoration:none;white-space:nowrap;transition:opacity .15s}
.header-reserve-btn:hover{opacity:.85}
.view-btn{width:30px;height:30px;border:1px solid var(--border);border-radius:6px;cursor:pointer;background:#fff;color:var(--text3);display:flex;align-items:center;justify-content:center;transition:all .15s}
.sched-pin-frame{display:inline-flex;align-items:center;border:1px solid var(--border);border-radius:6px;background:#fff;padding:5px 10px}
.view-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.view-btn.active{background:var(--navy);border-color:var(--navy);color:#fff}
.view-btn.active svg{stroke:#fff}

/* ── CONTENT ── */
.tab-content{display:none;padding:18px 0}
.tab-content.active{display:block}
/* BUG FIX: this animation used to fire on EVERY tab switch (click or
   swipe), not just the true first page load, because renderTabs() fully
   recreates every .cards-stack/.dish-grid element on every renderAll()
   call — so each tab change replayed a 0→1 opacity fade, reading as an
   unpleasant flash. Content just appears normally now, with no fade. */
.dish-grid,.cards-stack{}
/* Grey placeholder + smooth fade-in for content photos (dish photos,
   hero, gallery) — scoped to #tabsContainer only so header/nav/admin
   icons are unaffected. Without this, a slow-loading photo either shows
   nothing or a broken-image icon until the network delivers it, which
   reads as the page "switching" from an empty state to the real menu. */
#tabsContainer img{background:#e8e8e8;opacity:0}
#tabsContainer img.img-loaded{opacity:1;transition:opacity .25s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.cards-stack{display:flex;flex-direction:column;gap:12px}

/* ── INTRO CARD ── */
.intro-card{background:#fff;border-radius:var(--r);border:1px solid var(--border);padding:18px 20px}
.intro-card-label{font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);font-family:'Jost',sans-serif;margin-bottom:8px}
.intro-card-text{font-family:'Open Sans',sans-serif;font-size:12px;color:var(--text);line-height:1.7}
.social-icons{display:flex;gap:14px;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid rgba(0,0,0,0.06)}
.social-links-bar{display:flex;gap:0;align-items:center;justify-content:center;padding:6px 0 2px;flex-wrap:wrap}
.social-link-txt{font-size:10px;font-weight:600;letter-spacing:.14em;color:var(--text3);text-decoration:none;text-transform:uppercase;font-family:Jost,sans-serif;transition:color .15s}
.social-link-txt:hover{color:var(--navy)}
.social-link-sep{font-size:10px;color:var(--text3);padding:0 8px}
.social-icon{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;border:1px solid var(--border);color:var(--text3);text-decoration:none;transition:all .15s;font-size:13px}
.mode-links-bar{display:none;align-items:center;justify-content:center;gap:2px;margin-top:8px;padding:8px 4px;background:var(--navy);border-radius:10px}
.mode-link{display:flex;align-items:center;gap:5px;background:none;border:none;cursor:pointer;padding:2px 10px;font-family:Jost,sans-serif;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#fff;opacity:.45;transition:opacity .15s;text-decoration:none}
.mode-link svg{width:14px;height:14px;flex:none}
.mode-link.active{opacity:1}
.mode-link-sep{color:rgba(255,255,255,0.22);font-size:12px}
.social-icon:hover{border-color:var(--navy);color:var(--navy)}
.social-icon svg{width:14px;height:14px;fill:currentColor}

/* ── FEATURED ── */
.featured-card{background:#fff;border-radius:var(--r);border:1px solid var(--border);padding:16px}
.featured-label{font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);font-family:'Jost',sans-serif;margin-bottom:12px}
.featured-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.featured-item{border-radius:8px;overflow:hidden;border:1px solid var(--border)}
.featured-item-img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#ece8e1}
.featured-item-body{padding:8px 10px 10px}
.featured-item-name{font-family:'Open Sans',sans-serif;font-size:12px;font-weight:600;color:var(--navy);line-height:1.2}
.featured-item-price{font-size:11px;font-weight:500;color:var(--gold);margin-top:3px}
.featured-top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.featured-item-price-inline{font-size:10px;font-weight:500;color:var(--gold);white-space:nowrap;flex-shrink:0;margin-top:1px}

/* ── CARD ── */
.card{background:#fff;border-radius:var(--r);border:1px solid var(--border)}
.card-hdr{padding:14px 16px 0;display:flex;align-items:center;justify-content:space-between}
.card-label{font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);font-family:'Jost',sans-serif}
.card-body{padding:14px 16px 16px}

/* ── DISH LIST ── */
.dish-row{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid rgba(0,0,0,0.05)}
.dish-row-clickable{cursor:pointer;transition:background .15s;border-radius:6px;margin:0 -6px;padding-left:6px;padding-right:6px}
.dish-row-clickable:hover{background:rgba(16,40,94,0.03)}
.dish-row:first-child{padding-top:0}
.dish-row:last-child{border-bottom:none;padding-bottom:0}
.dish-text{flex:1;min-width:0}
.dish-name-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dish-name{font-family:'Open Sans',sans-serif;font-size:14px;font-weight:600;color:var(--navy);line-height:1.2}
.dish-badges{display:flex;gap:4px;align-items:center}
.badge-icon{width:18px;height:18px;object-fit:contain;display:inline-block}
.dish-desc{font-size:12px;font-family:'Open Sans',sans-serif;font-weight:400;color:var(--text2);line-height:1.55;margin-top:2px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.dish-price{font-size:13px;font-weight:500;color:var(--gold);margin-top:6px;white-space:nowrap;flex-shrink:0}
.dish-img{width:80px;height:80px;border-radius:8px;object-fit:cover;flex:none;background:#ece8e1;cursor:pointer;transition:opacity .15s}
.dish-img:hover{opacity:.82}

/* ── GRID ── */
.dish-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.gc{background:#fff;border-radius:var(--r);border:1px solid var(--border);overflow:hidden}
.gc[data-lbidx]{cursor:pointer}
.gc-img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#ece8e1;cursor:pointer;transition:opacity .15s}
.gc-img:hover{opacity:.82}
.gc-body{padding:10px 12px 12px}
.gc-name{font-family:'Open Sans',sans-serif;font-size:14px;font-weight:600;color:var(--navy);margin-bottom:2px;line-height:1.2}
.gc-desc{font-size:12px;font-family:'Open Sans',sans-serif;font-weight:400;color:var(--text2);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gc-price{font-size:12px;font-weight:500;color:var(--gold);margin-top:5px;white-space:nowrap;flex-shrink:0}
.gc-top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;margin-bottom:2px}
.gc-top-row .gc-name{margin-bottom:0}

/* ── Page de couverture (plein écran, avant le site) ── */
/* ── Page de couverture (calque plein écran par-dessus le site déjà chargé) ── */
body.home-cover-showing{overflow:hidden}
.home-cover{position:fixed;inset:0;z-index:500;width:100%;height:100vh;height:100svh;height:100dvh;overflow:hidden;background:#0b0b0b;display:flex;flex-direction:column}
/* Cancels out the desktop-only 10% site-wide zoom (see html{zoom:1.1}
   below) specifically for this overlay, so its fixed 100vh sizing means
   exactly one real screen — without this, the zoomed rendering would
   push the CTAs below the fold, forcing a scroll the cover is meant to
   avoid entirely. */
@media(min-width:641px){ .home-cover{zoom:0.9090909} }
.home-cover-media{position:absolute;inset:0;width:100%;height:100%}
.home-cover-media img,.home-cover-media video{width:100%;height:100%;object-fit:cover;display:block}
/* Slideshow: 3 photos cross-fading, each with its own Ken Burns pan/
   zoom running continuously underneath (not just during its own
   crossfade window — the image keeps drifting the whole time it's
   loaded, the animation just isn't visible until that slide fades in). */
.home-cover-slideshow{position:absolute;inset:0;width:100%;height:100%;overflow:hidden}
.hcs-slide{position:absolute;inset:0;opacity:0;transition:opacity 1.4s ease}
.hcs-slide.hcs-active{opacity:1;z-index:1}
.hcs-kb{width:100%;height:100%;object-fit:cover;display:block;animation-duration:9s;animation-timing-function:ease-in-out;animation-iteration-count:infinite;animation-direction:alternate}
@keyframes hcsZoomIn{from{transform:scale(1)}to{transform:scale(1.18)}}
@keyframes hcsZoomOut{from{transform:scale(1.18)}to{transform:scale(1)}}
@keyframes hcsPanTop{from{transform:scale(1.15) translateY(4%)}to{transform:scale(1.15) translateY(-4%)}}
@keyframes hcsPanBottom{from{transform:scale(1.15) translateY(-4%)}to{transform:scale(1.15) translateY(4%)}}
@keyframes hcsPanLeft{from{transform:scale(1.15) translateX(4%)}to{transform:scale(1.3) translateX(-2%)}}
@keyframes hcsPanRight{from{transform:scale(1.15) translateX(-4%)}to{transform:scale(1.3) translateX(2%)}}
.hcs-kb-zoom-in{animation-name:hcsZoomIn}
.hcs-kb-zoom-out{animation-name:hcsZoomOut}
.hcs-kb-pan-top{animation-name:hcsPanTop}
.hcs-kb-pan-bottom{animation-name:hcsPanBottom}
.hcs-kb-pan-left{animation-name:hcsPanLeft}
.hcs-kb-pan-right{animation-name:hcsPanRight}
.home-cover-overlay{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.65) 0%,rgba(0,0,0,.15) 45%,rgba(0,0,0,.35) 100%)}
/* Name is NOT part of the fade group below — it stays put the whole
   time, so the handoff to the real header's own name (once the cover
   is gone) doesn't read as anything moving. */
.home-cover-top{position:relative;z-index:3;padding:20px 20px 0;text-align:center;flex:none}

.sticky-reserve .container{display:block}
.reserve-btn{display:block;width:100%;padding:15px;background:var(--navy);color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:500;font-family:'Jost',sans-serif;letter-spacing:.06em;cursor:pointer;text-align:center;text-decoration:none}
@media(max-width:640px){
  .sticky-reserve{position:fixed;bottom:0;left:0;right:0;z-index:100;background:linear-gradient(to top,var(--bg) 80%,transparent)}
  .sticky-reserve .container{padding:0 0}
  .reserve-btn{border-radius:0;padding:17px 16px}
  /* BUG FIX: 130px reserved way more space than the sticky bar (reserve
     button + admin bar) actually takes up on mobile (~106-115px in
     practice), leaving a visible empty cream gap above it once scrolled
     to the bottom. Tightened to match. */
  .page{padding-bottom:110px}
  /* BUG FIX: this used to be beaten by the higher-specificity
     "body.is-admin .header-top-right{visibility:visible}" rule further
     up — on mobile, an admin ended up seeing the header icons AND the
     bottom bar at once, when only the bottom bar (.mode-links-bar) is
     meant to be the mobile entry point. Matching selector specificity
     here so this always wins on small screens, admin or not. */
  .header-top-right, body.is-admin .header-top-right, body.admin-entry-visible .header-top-right{visibility:hidden}
  .mode-links-bar{display:none;width:100%;margin-top:0;padding:11px 4px calc(11px + env(safe-area-inset-bottom,0px));border-radius:0;align-items:center;background:var(--navy);gap:32px}
  /* Icons 50% bigger (14px -> 21px) — padding above/below is reduced
     to compensate (bar padding 14->11, link padding 5->2) so the extra
     icon height doesn't grow the black bar itself. */
  .mode-link svg{width:21px;height:21px}
  .mode-link{padding:2px 6px}
  body.is-admin .mode-links-bar, body.admin-entry-visible .mode-links-bar{display:flex}
}

// ═══════════════════════════════════════════
// STABLE DISH IDS (for "Plats à la une" pins)
// ═══════════════════════════════════════════
// BUG FIX: pinned dishes used to be stored as raw {tabId, cardIdx, dishIdx}
// array positions. Any later reorder/delete of dishes or sections (drag &
// drop, deleting a dish above it, etc.) silently shifted those positions,
// so a pin would end up pointing at a completely different dish — exactly
// the "I click Capitaine and Drevici opens" symptom. Dishes now get a
// permanent random id (_pid) the moment they're created, and pins are
// resolved by that id instead of by position, so reordering/deleting other
// dishes can never make a pin point at the wrong one again.
function genPid(){ return 'd_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function ensureDishPid(d){ if(d && !d._pid) d._pid=genPid(); return d&&d._pid; }
// Walk every dish in DATA and assign a stable id to any that doesn't have one yet.
function ensureAllDishPids(){
  (DATA.tabs||[]).forEach(tab=>{
    (tab.cards||[]).forEach(card=>{
      (card.dishes||[]).forEach(d=>ensureDishPid(d));
    });
  });
}
// One-time migration: upgrade old-format pins (position-based) to the new
// id-based format, using their current (possibly already-wrong) position as
// a best-effort resolution — this can't undo damage already caused by the
// bug, but from this point on pins stay correct through any reordering.
function migratePins(){
  ensureAllDishPids();
  const pins=DATA.pinnedDishes||[];
  const migrated=[];
  pins.forEach(p=>{
    if(p.pid){ migrated.push(p); return; }
    const tb=DATA.tabs.find(t=>t.id===p.tabId);
    const card=tb&&tb.cards[p.cardIdx];
    const d=card&&card.dishes&&card.dishes[p.dishIdx];
    if(d){ ensureDishPid(d); migrated.push({tabId:p.tabId, pid:d._pid}); }
    // else: dish no longer exists at that position — drop the stale pin
  });
  DATA.pinnedDishes=migrated;
}
// Resolve a pin to its live dish (searches by stable id, so it's immune to
// any later reordering of sections/dishes). Returns null if the dish was
// deleted since being pinned.
function resolvePin(p){
  const tb=DATA.tabs.find(t=>t.id===p.tabId);
  if(!tb) return null;
  for(let ci=0; ci<tb.cards.length; ci++){
    const card=tb.cards[ci];
    if(!card.dishes) continue;
    for(let di=0; di<card.dishes.length; di++){
      if(card.dishes[di]._pid===p.pid) return {tab:tb, ci, di, dish:card.dishes[di]};
    }
  }
  return null;
}

// DEEP LINKS — each tab gets its own shareable/bookmarkable URL (#tabId)
// ═══════════════════════════════════════════
function tabIdFromHash(){
  const raw=decodeURIComponent((location.hash||'').replace(/^#/,''));
  return raw||null;
}
// Called at the end of every renderAll() — keeps the address bar's #hash
// matching whichever tab is actually showing, for every call site that
// changes currentTabId (nav click, swipe, admin actions...), without
// spamming the browser history (uses replaceState).
function syncHashToCurrentTab(){
  if(!currentTabId) return;
  const newHash='#'+encodeURIComponent(currentTabId);
  if(location.hash!==newHash){
    try{ history.replaceState(null,'',newHash); }catch(e){}
  }
}
// Deliberate navigation (nav tab click, swipe) — creates a real history
// entry so the back/forward buttons step through tabs naturally.
function goToTab(tabId){
  currentTabId=tabId;
  sessionStorage.setItem('lastTabId',tabId);
  const newHash='#'+encodeURIComponent(tabId);
  if(location.hash!==newHash){
    try{ history.pushState(null,'',newHash); }catch(e){}
  }
  renderAll();
}
// Handles browser Back/Forward and someone pasting a #tab link while the page is already open.
window.addEventListener('popstate', ()=>{
  const raw=tabIdFromHash();
  if(raw && DATA.tabs.some(tb=>tb.id===raw && tb.visible!==false) && raw!==currentTabId){
    currentTabId=raw;
    sessionStorage.setItem('lastTabId',raw);
    renderAll();
  }
});

  // (pencil = "switch to edit" while reading; eye = "switch to read"

  const eyeIcon = '<path d="M1 8s2.6-5 7-5 7 5 7 5-2.6 5-7 5-7-5-7-5z"/><circle cx="8" cy="8" r="2"/>';

// ---- Bev size "format" (verre/pinte/demi/...) — a fixed, curated list

// himself as new clients need them, instead of each client typing
// something that might not render consistently. Formats with a known
// fixed quantity (pinte, demi, galopin) auto-fill the cl field when
// picked — canette is deliberately NOT auto-filled since it varies
// (33cl standard, 25cl for energy drinks like Red Bull); verre/bouteille/
// coupe have no fixed size at all, always filled in by hand.
const BEV_FORMATS = [
  {key:'', label:'—'},
  {key:'verre', label:'Verre'},
  {key:'bouteille', label:'Bouteille'},
  {key:'coupe', label:'Coupe'},
  {key:'pinte', label:'Pinte', autoCl:50},
  {key:'demi', label:'Demi', autoCl:25},

  {key:'galopin', label:'Galopin', autoCl:12.5},
];
function bevFormatOptionsHtml(selected){
  return BEV_FORMATS.map(f=>`<option value="${f.key}" ${f.key===(selected||'')?'selected':''}>${f.label}</option>`).join('');
}
// Public-facing label for one size row: if a format is picked, show
// just its name (a "Pinte" doesn't need "— 50cl" next to it, everyone
// already knows roughly what that means) — otherwise fall back to the
// raw cl/L value, exactly as before this feature existed.
function bevSizeLabel(s){
  if(s.format){
    const f=BEV_FORMATS.find(f=>f.key===s.format);
    if(f) return f.label;
  }
  return s.cl ? (s.cl+(s.unit==='l'?'L':'cl')) : '';

// ---- SAVE ----
function saveEditPop(silent){
  if(!editCtx) return true;
  try{
    const {type,ti,ci,di,ii,si}=editCtx;
    if(type==='intro'){
      DATA.intro.active=document.getElementById('ed-intro-active').checked;
      if(typeof DATA.intro.text!=='object') DATA.intro.text={fr:''};
      DATA.intro.text[lang]=readEf(0);
      renderAll(); closeEditPop(); if(!silent) showToast('Enregistré — Publiez pour mettre en ligne'); return true;
    }
    if(type==='special'){
      const sp=DATA.specials[si];
      sp.active=document.getElementById('ed-sp-active').checked;
      if(typeof sp.title!=='object') sp.title={fr:''};
      if(typeof sp.desc!=='object') sp.desc={fr:''};
      sp.title[lang]=readEf(0);
      sp.desc[lang]=readEf(1);
      sp.price=v('ed-sp-price');
      renderAll(); closeEditPop(); if(!silent) showToast('Enregistré — Publiez pour mettre en ligne'); return true;
    }
    if(type==='dish'){
      const d=DATA.tabs[ti].cards[ci].dishes[di];
      if(typeof d.name!=='object') d.name={fr:d.name||''};
      if(typeof d.desc!=='object') d.desc={fr:d.desc||''};
      d.name[lang]=readEf(0);
      d.desc[lang]=readEf(1);
      const dualCb=document.getElementById('ed-dual');
      if(dualCb&&dualCb.checked){
        d.priceType='dual';
        d.qty1=v('ed-q1'); d.p1=v('ed-p1'); d.qty2=v('ed-q2'); d.p2=v('ed-p2');
        d.price=`Les ${d.qty1||'?'} — ${d.p1||'?'}€ · Les ${d.qty2||'?'} — ${d.p2||'?'}€`;
      } else if(document.getElementById('ed-q1')){
        // was dual, still dual (non-huitres path keeps dual fields)
        d.qty1=v('ed-q1'); d.p1=v('ed-p1'); d.qty2=v('ed-q2'); d.p2=v('ed-p2');
        d.price=`Les ${d.qty1||'?'} — ${d.p1||'?'}€ · Les ${d.qty2||'?'} — ${d.p2||'?'}€`;
      } else {
        d.priceType='';
        const pv=v('ed-price');
        d.price=pv?pv+'€':'';
      }
      d.img=v('ed-img');
      d.gallery=readGalleryFields();
      d.caption=v('ed-caption');
      readBadgeFields(d);
    } else if(type==='variants'){
      const card=DATA.tabs[ti].cards[ci];
      if(typeof card.label!=='object') card.label={fr:card.label||''};
      card.label[lang]=readEf(0);
      card.img=v('ed-img');
      const names=document.querySelectorAll('#ed-variants [data-vname]');
      const prices=document.querySelectorAll('#ed-variants [data-vprice]');
      (card.variants||[]).forEach((vr,vi)=>{
        if(typeof vr.name!=='object') vr.name={fr:vr.name||''};
        if(names[vi]) vr.name[lang]=names[vi].value;
        if(prices[vi]) vr.price=prices[vi].value;
      });
    } else if(type==='bev'){
      const item=DATA.tabs[ti].cards[ci].items[ii];
      if(typeof item.name!=='object') item.name={fr:item.name||''};
      item.name[lang]=v('ed-bname');
      if(!item.desc || typeof item.desc!=='object') item.desc={fr:''};
      item.desc[lang]=readEf(0);
      item.img=v('ed-img');
      const formats=document.querySelectorAll('#ed-sizes [data-sformat]');
      const cls=document.querySelectorAll('#ed-sizes [data-scl]');
      const units=document.querySelectorAll('#ed-sizes [data-sunit]');
      const prs=document.querySelectorAll('#ed-sizes [data-sprice]');
      const sizes=[];
      cls.forEach((clEl,si2)=>{
        const cl=clEl.value.trim();
        const pr=prs[si2]?prs[si2].value.trim():'';
        const unit=units[si2]?units[si2].value:'cl';
        const format=formats[si2]?formats[si2].value:'';
        if(cl||pr||format) sizes.push({format,cl,unit,price:pr});
      });
      item.sizes=sizes;
      item.gallery=readGalleryFields();
      item.caption=v('ed-caption');
    }
    renderAll();
    closeEditPop();
    if(!silent) showToast('Enregistré — Publiez pour mettre en ligne');
    if(typeof adminCurrentTab!=='undefined' && adminCurrentTab && document.getElementById('adminBody')?.innerHTML) renderAdminSection(adminCurrentTab, true);
    return true;
  }catch(e){
    console.error('saveEditPop error:', e);
    showToast('❌ Erreur lors de l\'enregistrement : '+e.message);
    return false;
  }
}

// Swipe support
(function(){
  let sx=0,sy=0;
  const lb=document.getElementById('lb');
  lb.addEventListener('touchstart',e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; },{passive:true});
  lb.addEventListener('touchend',e=>{
    const dx=e.changedTouches[0].clientX-sx;
    const dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>40){
      if(dx<0) lbStep(1); else lbStep(-1);
    }
  });
})();

function renderAll(){
  // BUG FIX: isHome must always track array position 0, never a stale flag
  // left over from before a tab reorder (drag & drop) or before the
  // dedicated Accueil (__home) tab was toggled on/off/unshifted. Without
  // this, a formerly-first tab keeps isHome:true forever, so pinned dishes
  // wrongly render twice — once on Accueil, once on that stale tab.
  DATA.tabs.forEach((t,i)=>{ t.isHome = (i===0); });
  // If current tab was hidden, reset to first visible
  if(!DATA.tabs.filter(t=>t.visible!==false).some(t=>t.id===currentTabId)){
    const first=DATA.tabs.find(t=>t.visible!==false);
    if(first) currentTabId=first.id;
  }
  syncHashToCurrentTab();
  collectLbImages(); renderNav(); renderTabs(); renderViewBar();
  const subEl=document.getElementById('heroSubEl');
  if(subEl){ const st=DATA.hero?t(DATA.hero):''; subEl.textContent=st; subEl.style.display=st?'block':'none'; }
  applyRestaurantBranding();
  // Rendered last, deliberately: applyRestaurantBranding() sets the
  // status-bar meta to the site's own navy — if the cover is active it
  // needs the final say, overriding that with its own configured color,
  // or every render (not just the first) would silently revert it.
  renderHomeCover();
  // Auto-save: only when an actual admin is actively editing — never
  // for a regular visitor just browsing tabs, who has no session and
  // would otherwise see a stray "connecte-toi pour publier" toast.
  if(supaSession && editMode) scheduleAutoSave();
}

function renderNav(){
  const nav=document.getElementById('nav'); nav.innerHTML='';
  const visibleTabs=DATA.tabs.filter(tab=>tab.visible!==false);
  visibleTabs.forEach(tab=>{
    const el=document.createElement('div');
    // BUG FIX: this used to set the .active class immediately at
    // creation time — but since every tab is a brand-new DOM node on
    // every renderNav() call, there was no "before" state for the CSS
    // color transition to animate from, so the label just snapped
    // straight to navy the instant it was inserted. Against the still-
    // navy header (before the white pill has slid underneath it), that
    // read as invisible text that only "popped in" once the pill
    // physically arrived. Starting every tab inactive/grey and adding
    // .active a frame later (once actually painted) gives the browser a
    // real starting state, so the label now fades in step with the pill.
    el.className='nav-tab';
    el.textContent=t(tab.label);
    el.addEventListener('click',()=>{
      if(tab.id==='__home' && DATA.homeTab&&DATA.homeTab.siteUrl){
        window.open(DATA.homeTab.siteUrl,'_blank');
        return;
      }
      goToTab(tab.id);
    });
    nav.appendChild(el);
  });
  // Sliding active-tab indicator: a single bar that glides between tabs
  // instead of each tab's border-bottom toggling instantly. Rebuilt fresh
  // here on every renderNav() (so it's always correctly positioned after
  // a real tab change), and additionally kept in sync frame-by-frame
  // during the swipe gesture itself — see "SWIPE TO CHANGE TABS".
  const indicator=document.createElement('div');
  indicator.className='nav-indicator';
  indicator.id='navIndicator';
  nav.appendChild(indicator);
  requestAnimationFrame(()=>{
    const tabs=Array.from(nav.querySelectorAll('.nav-tab'));
    const activeIdx=visibleTabs.findIndex(tb=>tb.id===currentTabId);
    const activeTabEl=activeIdx>=0?tabs[activeIdx]:null;
    if(activeTabEl){
      activeTabEl.classList.add('active');
      indicator.style.left=activeTabEl.offsetLeft+'px';
      indicator.style.width=activeTabEl.offsetWidth+'px';
    }
    scrollNavToActive();
  });
}
// Scroll nav: show active + 2 full + half of 3rd on each side (Twitter-style)
function scrollNavToActive(){
  const nav=document.getElementById('nav');
  setTimeout(()=>{
    const activeEl=nav.querySelector('.nav-tab.active');
    if(!activeEl) return;
    const navBar=nav.closest('.nav-bar')||nav.parentElement;
    const tabs=Array.from(nav.querySelectorAll('.nav-tab'));
    const activeIdx=tabs.indexOf(activeEl);
    const barW=navBar.offsetWidth;
    const totalW=nav.scrollWidth;

    // Compute target: position scroll so active tab sits at left + 16px padding,
    // letting the next 2 full + half of 3rd peek to the right naturally
    // For the last tabs, scroll back so 2 prev + half peek on the left
    const nextTabs=tabs.slice(activeIdx+1, activeIdx+4);
    const prevTabs=tabs.slice(Math.max(0,activeIdx-3), activeIdx);
    const nextW=nextTabs.reduce((s,el)=>s+el.offsetWidth,0);
    const prevW=prevTabs.reduce((s,el)=>s+el.offsetWidth,0);
    const halfNext=nextTabs[2]?nextTabs[2].offsetWidth/2:(nextTabs[1]?nextTabs[1].offsetWidth/2:40);
    const halfPrev=prevTabs[0]?prevTabs[0].offsetWidth/2:40;

    let target;
    const hasNext=activeIdx<tabs.length-1;
    const hasPrev=activeIdx>0;

    if(hasNext&&hasPrev){
      // Middle: show active at ~left-quarter, peek both sides
      const rightPeek=nextW-halfNext;
      target=activeEl.offsetLeft-(barW-activeEl.offsetWidth-rightPeek)/2;
    } else if(hasNext){
      // First tab(s): start from left, just show naturally
      target=0;
    } else {
      // Last tab(s): scroll so 2 prev + half show on left
      target=totalW-barW;
    }

    target=Math.max(0, Math.min(target, totalW-barW));

    // Only scroll if needed, use smooth for non-initial renders
    if(Math.abs(navBar.scrollLeft-target)>2){
      navBar.scrollTo({left:target, behavior:'smooth'});
    }
  },20);
}

function renderScheduleInline(suffix){
  suffix=suffix||'';
  // Standard formatting for a closing hour: midnight is stored as 24 (or
  // 24+N for hours past midnight, e.g. 26 = 2am) so the "is still open"
  // math above works, but displaying that raw number reads as "24h" —
  // normalize with a plain modulo so midnight shows "0h00" instead
  // (post-midnight hours like 2am still show as "2h", unchanged).
  const fmtCloseHour = c => { if(c==null) return ''; const h=c%24; return h===0?'0h00':h+'h'; };
  const sch=DATA.schedule||[];
  const now=new Date();
  let today=now.getDay(); let hour=now.getHours()+now.getMinutes()/60;
  if(hour<6){today=(today+6)%7;hour+=24;}
  const dayIdx=today===0?6:today-1;
  const dayData=sch[dayIdx]||{};
  const svcs=dayData.services||[];
  const allSvcs=svcs.length===0&&dayData.open!=null?[{label:'',open:dayData.open,close:dayData.close}]:svcs;
  let state='closed',label="Fermé";
  for(const s of allSvcs){
    if(s.open==null) continue;
    const effectiveClose=s.close<=s.open?s.close+24:s.close;
    if(hour>=s.open&&hour<effectiveClose){state='open';label="Ouvert jusqu'à "+fmtCloseHour(s.close);break;}
    if(hour<s.open){state='soon';label='Ouvre à '+s.open+'h';}
  }
  const dotClass=state==='open'?'open':state==='soon'?'soon':'closed';
  const rows=sch.map((d,i)=>{
    const isToday=(i===dayIdx);
    const svs=(d.services||[]).length>0?d.services:(d.open!=null?[{label:'',open:d.open,close:d.close}]:[]);
    const h=svs.length===0?'Fermé':svs.map(s=>{
      const o=s.open!=null?s.open+'h':'';
      const c=s.close!=null?fmtCloseHour(s.close):'';
      return o&&c?o+' – '+c:(s.label||'Fermé');
    }).join(', ');
    return `<div class="resto-popup-row${isToday?' today':''}"><span class="rday">${d.day}</span><span>${h}</span></div>`;
  }).join('');
  const mapsUrl = DATA.address && DATA.address.mapsUrl;
  const addr = DATA.address || {};
  const addrText = [addr.street, addr.zip, addr.city].filter(Boolean).join(', ');
  const addrHtml = addrText
    ? (mapsUrl
        ? `<a href="${escAttr(mapsUrl)}" target="_blank" rel="noopener" style="display:block;color:rgba(255,255,255,.75);font-size:13px;text-decoration:none;margin-bottom:10px;padding-bottom:10px;border-bottom:.5px solid rgba(255,255,255,.07)">${escapeHtmlLocal(addrText)}</a>`
        : `<div style="color:rgba(255,255,255,.75);font-size:13px;margin-bottom:10px;padding-bottom:10px;border-bottom:.5px solid rgba(255,255,255,.07)">${escapeHtmlLocal(addrText)}</div>`)
    : '';
  const pinIconHtml = mapsUrl ? `<span style="display:inline-flex;align-items:center;color:var(--navy)">

  </span>` : '';
  const phone = addr.phone;
  const phoneHtml = phone
    ? `<div style="margin-top:10px;display:flex;align-items:baseline;gap:5px;flex-wrap:wrap"><span class="resto-popup-title" style="margin-bottom:0;color:${suffix==='Cover'?'var(--gold)':'#fff'}">Tel&nbsp;:</span><a href="tel:${escAttr(phone.replace(/\s+/g,''))}" style="color:rgba(255,255,255,.75);text-decoration:none;font-size:14px">${escapeHtmlLocal(phone)}</a></div>`
    : '';
  return `<div class="sched-pin-frame">
    <div class="resto-badge-inline" id="schedBadge${suffix}" onclick="toggleSchedPopup(event,'${suffix}')" style="display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none">
      <span class="resto-dot ${dotClass}"></span>
      <span style="font-size:11px;color:var(--text2);font-family:Jost,sans-serif">${label}</span>
      ${pinIconHtml}
      <div class="resto-popup" id="schedPopup${suffix}">
        ${addrText?`<div class="resto-popup-title">Adresse</div>${addrHtml}`:''}

function escapeHtmlLocal(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// Variants (e.g. Rillettes flavours) used to only ever show the FIRST
// variant's raw price (no €, and silently wrong the moment two flavours
// are priced differently). Now: one shared price if every variant costs
// the same, otherwise each flavour shows its own price inline — same
// idea as how bevs shows several format/price pairs side by side.
// Global "show currency" toggle (Mon établissement) — strips the €
// sign from an already-formatted price string when off. Kept as one
// small helper rather than touching how prices are stored, so this is
// purely a display-time decision and never risks mangling saved data.
function fmtCurrency(s){
  if(DATA.showCurrency===false) return String(s||'').replace(/€/g,'').trim();
  return s;
}
// Dish/plat price: normalizes to "X€" (or "" if unset) then applies the
// currency toggle — used by both grid and list rendering so the two
// don't drift from each other.
function dishPriceDisplay(d){
  const raw=(d.price||'').toString();
  const withCurrency = raw.includes('€') ? raw : (d.price ? raw+'€' : '');
  return fmtCurrency(withCurrency);
}
function variantsPriceInfo(variants){
  const list=variants||[];
  const fmt=p=>{ const s=(p||'').toString().trim(); if(!s) return ''; return s.includes('€')?s:s+'€'; };
  const prices=list.map(v=>fmt(v.price));
  const allSame=prices.length>0 && prices.every(p=>p===prices[0]);
  if(allSame){
    return {sharedPrice:fmtCurrency(prices[0]||''), flavourText:list.map(v=>t(v.name)).join(' · ')};
  }
  // Different prices per flavour: show each price inline, colored with
  // the theme's accent (same as a normal price) instead of blending
  // into the grey description text.
  return {sharedPrice:'', flavourText:list.map(v=>{
    const p=fmt(v.price);
    return t(v.name)+(p?` — <span style="color:var(--gold)">${fmtCurrency(p)}</span>`:'');
  }).join(' · ')};
}

// ── Page de couverture (calque plein écran par-dessus le site déjà chargé) ──
// Renders into #homeCoverContainer as a position:fixed overlay — the
// real header/nav/content underneath is already fully rendered on its
// default tab the whole time, simply hidden behind this opaque layer.
// "Voir le menu" fades OUT the image/badge/headline/CTAs (quick, ~0.2s)
// then removes the cover outright — no scrolling, no navigation, and
// the restaurant name (not part of that fade group) never visibly
// moves, since the real header's own name is already sitting in a
// similar spot the instant the cover is gone.
let homeCoverDismissedThisSession=false;
function renderHomeCover(){
  const el=document.getElementById('homeCoverContainer');
  const hc=DATA.homeCover||{};
  if(!hc.active||homeCoverDismissedThisSession){ el.innerHTML=''; document.body.classList.remove('home-cover-showing'); stopHomeCoverSlideshow(); return; }
  const isVideo=hc.mediaType==='video';
  const isSlideshow=hc.mediaType==='slideshow';
  let mediaHtml='';
  if(isVideo && hc.video){
    const videoUrl=hc.video;
    const ytMatch=videoUrl.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]+)/);
    const vimeoMatch=videoUrl.match(/vimeo\.com\/([\d]+)/);
    const isDirectFile=/\.(mp4|webm|mov)(\?|$)/i.test(videoUrl);
    if(isDirectFile && !ytMatch && !vimeoMatch){
      mediaHtml=`<video src="${escAttr(videoUrl)}" autoplay muted loop playsinline style="width:100%;height:100%;object-fit:cover"></video>`;
    } else {
      let embedUrl='';
      if(ytMatch) embedUrl=`https://www.youtube.com/embed/${ytMatch[1]}?autoplay=1&mute=1&controls=0&loop=1&playlist=${ytMatch[1]}&rel=0&modestbranding=1&showinfo=0&playsinline=1`;
      else if(vimeoMatch) embedUrl=`https://player.vimeo.com/video/${vimeoMatch[1]}?autoplay=1&muted=1&loop=1&background=1&controls=0`;
      else embedUrl=videoUrl;
      mediaHtml=`<iframe src="${escAttr(embedUrl)}" style="width:100%;height:100%;border:none;pointer-events:none" allow="autoplay; encrypted-media" allowfullscreen loading="lazy"></iframe>`;
    }
  } else if(isSlideshow && hc.slideshow && hc.slideshow.some(s=>s.image)){
    const slides=hc.slideshow.filter(s=>s.image);
    mediaHtml=`<div class="home-cover-slideshow" id="homeCoverSlideshow">${slides.map((s,i)=>
      `<div class="hcs-slide${i===0?' hcs-active':''}" data-kb="${escAttr(s.kenBurns||'zoom-in')}"><img src="${escAttr(s.image)}" alt="" class="hcs-kb hcs-kb-${escAttr(s.kenBurns||'zoom-in')}"></div>`
    ).join('')}</div>`;
  } else if(!isVideo && hc.image){
    applyHomeCoverMobilePos(hc.mobilePos!=null?hc.mobilePos:50);
    // A dedicated mobile photo, if set, takes over from the shared
    // background specifically on small screens — <picture> picks it
    // automatically per viewport, no JS needed. Desktop always uses
    // the shared image regardless.
    mediaHtml=hc.mobileImage
      ? `<picture><source media="(max-width:640px)" srcset="${escAttr(hc.mobileImage)}"><img src="${escAttr(hc.image)}" alt=""></picture>`
      : `<img src="${escAttr(hc.image)}" alt="">`;
  }
  const cta1Url=hc.cta1Url||'';
  const cta2Url=hc.cta2Url||'';
  const headlineHtml=escapeHtmlLocal(hc.headline||'').replace(/\n/g,'<br>');
  el.innerHTML=`<div class="home-cover" id="homeCoverEl">
    <div class="home-cover-media">${mediaHtml}</div>
    <div class="home-cover-overlay"></div>
    <div class="home-cover-top">
      ${hc.logo
        ? `<img src="${escAttr(hc.logo)}" alt="${escAttr(getRestaurantName())}" class="home-cover-logo" onerror="this.style.display='none'">`
        : `<div class="home-cover-name">${escapeHtmlLocal(getRestaurantName())}</div>`}
    </div>
    <div class="home-cover-fade-group" id="homeCoverFadeGroup">
      <div class="home-cover-sched">${renderScheduleInline('Cover')}</div>
      <div class="home-cover-content">
        <div class="home-cover-headline" style="font-family:'${escAttr(hc.headlineFont||'Jost')}',sans-serif">${headlineHtml}</div>
        <div class="home-cover-ctas">
          ${cta1Url
            ? `<a class="home-cover-cta home-cover-cta-menu" href="${escAttr(cta1Url)}">${escapeHtmlLocal(hc.cta1Label||'Voir le menu')}</a>`
            : `<button type="button" class="home-cover-cta home-cover-cta-menu" onclick="dismissHomeCover()">${escapeHtmlLocal(hc.cta1Label||'Voir le menu')}</button>`}
          <a class="home-cover-cta home-cover-cta-reserve" href="${escAttr(cta2Url)}">${escapeHtmlLocal(hc.cta2Label||'Réserver')}</a>
        </div>
      </div>

// Cycles through the slideshow's slides via a crossfade — each slide's
// own Ken Burns animation (see CSS) restarts automatically because
// adding/removing .hcs-active re-triggers it (animation resets when an
// element goes from display/opacity:0 back to visible in most browsers
// via the class toggle + a reflow-free restart is not guaranteed, so we
// force it by re-adding the class on a fresh animation frame).
let homeCoverSlideshowTimer=null;
function startHomeCoverSlideshow(){
  if(homeCoverSlideshowTimer){ clearInterval(homeCoverSlideshowTimer); homeCoverSlideshowTimer=null; }
  const wrap=document.getElementById('homeCoverSlideshow');
  if(!wrap) return;
  const slides=[...wrap.querySelectorAll('.hcs-slide')];
  if(slides.length<2) return; // nothing to cycle with 0 or 1 image
  let idx=0;
  homeCoverSlideshowTimer=setInterval(()=>{
    slides[idx].classList.remove('hcs-active');
    idx=(idx+1)%slides.length;
    slides[idx].classList.add('hcs-active');
  }, 6000);
}
function stopHomeCoverSlideshow(){
  if(homeCoverSlideshowTimer){ clearInterval(homeCoverSlideshowTimer); homeCoverSlideshowTimer=null; }
}
function dismissHomeCover(){
  homeCoverDismissedThisSession=true;
  stopHomeCoverSlideshow();
  const group=document.getElementById('homeCoverFadeGroup');
  if(group) group.classList.add('fading-out');
  setTimeout(()=>{
    const el=document.getElementById('homeCoverContainer');
    if(el) el.innerHTML='';
    document.body.classList.remove('home-cover-showing');
    // Hand the status bar color back to the site's own brand color, now
    // that the real header (which was underneath the whole time) is
    // what's showing.
    applyBrandColors();
  },220);
}
// Clicking the restaurant name/logo, once past the cover and browsing
// the actual menu, brings the cover back — "home" in the usual sense
// of a logo click, now that the cover (not a menu tab) is what "Page
// d'accueil" actually means.
function returnToHomeCover(){
  if(!DATA.homeCover||!DATA.homeCover.active) return;

// Mirrors clampHomePhotoRatio's spirit but for the cover's mobile crop:
// a plain object-position shift, injected as a scoped <style> so it only
// applies under the mobile breakpoint, same technique as the reference.
function applyHomeCoverMobilePos(pos){
  let styleEl=document.getElementById('homeCoverMobilePosStyle');
  if(!styleEl){ styleEl=document.createElement('style'); styleEl.id='homeCoverMobilePosStyle'; document.head.appendChild(styleEl); }
  styleEl.textContent=`@media(max-width:640px){ .home-cover-media img{ object-position:${pos}% center; } }`;
}
function updateHomeCoverMobilePreview(pos){
  const label=document.getElementById('homeCoverMobilePosLabel');
  if(label) label.textContent=pos;
  const img=document.getElementById('homeCoverMobilePreviewImg');
  if(img) img.style.objectPosition=pos+'% center';
}

// Home tab photo: respect the photo's own proportions rather than
// force-cropping every upload to a fixed 4:3 — but keep it within a
// sane range (never taller than 4:3, never flatter/wider than 16:9)
// so an odd source photo can't make the header oddly tall or a thin strip.
function clampHomePhotoRatio(img){
  if(!img.naturalWidth || !img.naturalHeight) return;
  const natural = img.naturalWidth / img.naturalHeight;
  const clamped = Math.min(Math.max(natural, 4/3), 16/9);
  img.style.aspectRatio = clamped;
}

// Home tab background video is forced muted for autoplay to work at
// all in modern browsers — but that means no way to hear it otherwise.
// This button un-mutes on click: a real property toggle for a native
// <video>, or a postMessage command for YouTube/Vimeo iframes (each
// platform has its own tiny protocol for this, since we can't reach
// into a cross-origin iframe directly).
function toggleHomeVideoMute(btn){
  const wrap=btn.closest('.home-photo-wrap');
  if(!wrap) return;
  const nowUnmuted=!wrap.classList.contains('video-unmuted');
  const video=wrap.querySelector('video');
  const iframe=wrap.querySelector('iframe');
  if(video){ video.muted=!nowUnmuted; }
  if(iframe){
    const src=iframe.src||'';

      iframe.contentWindow.postMessage(JSON.stringify({method:'setVolume',value:nowUnmuted?1:0}), '*');
    }
  }
  wrap.classList.toggle('video-unmuted', nowUnmuted);
  btn.innerHTML = nowUnmuted
    ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18 6a9 9 0 0 1 0 12"/></svg>`
    : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><line x1="16" y1="9" x2="22" y2="15"/><line x1="22" y1="9" x2="16" y2="15"/></svg>`;
}

// ── Grey-placeholder → fade-in for content photos ──
// Watches every <img> that ever appears inside #tabsContainer (dish
// photos, hero, gallery — anything rendered from DATA) and adds
// .img-loaded once it has actually finished loading, so the CSS above
// can fade it in from the grey placeholder. A MutationObserver means
// this needs no changes anywhere content HTML is generated — it just
// reacts to whatever ends up in the DOM, including images inserted
// later (tab switches, admin edits, reconciliation re-renders).
(function(){
  function markLoaded(img){ img.classList.add('img-loaded'); }
  function watch(img){
    if(img.classList.contains('img-loaded')) return;
    if(img.complete && img.naturalWidth>0){ markLoaded(img); return; }
    img.addEventListener('load',()=>markLoaded(img),{once:true});
    // Don't leave a broken image invisible forever — reveal it (browser's
    // own broken-image icon) rather than an eternal grey box.
    img.addEventListener('error',()=>markLoaded(img),{once:true});
  }
  function watchAll(root){
    if(root.tagName==='IMG') watch(root);
    root.querySelectorAll && root.querySelectorAll('img').forEach(watch);
  }
  const container=document.getElementById('tabsContainer');
  if(!container) return;
  watchAll(container);
  new MutationObserver(muts=>{
    muts.forEach(m=>{ m.addedNodes.forEach(node=>{ if(node.nodeType===1) watchAll(node); }); });
  }).observe(container,{childList:true,subtree:true});
})();

function renderTabs(){
  const container=document.getElementById('tabsContainer');
  collectLbImages();
  // BUG FIX: this used to wipe and fully rebuild every visible tab's
  // content on every single render (container.innerHTML=''), even for a
  // plain tab switch where nothing in DATA actually changed. That meant
  // every <img> in every tab was destroyed and recreated on every click
  // or swipe, forcing the browser to redecode/repaint them — a visible
  // flicker on every tab change, not just the first load. Now existing
  // section elements are reused, and a tab's inner HTML is only rewritten
  // if its rendered content has actually changed; a pure tab switch just
  // toggles which section carries the `active` class, touching no images
  // at all.
  const visibleTabs=DATA.tabs.filter(tab=>tab.visible!==false);
  const visibleSectionIds=new Set(visibleTabs.map(tab=>'tab-'+tab.id));
  // Remove sections for tabs that no longer exist or became hidden.
  Array.from(container.children).forEach(child=>{
    if(!visibleSectionIds.has(child.id)) child.remove();
  });
  visibleTabs.forEach((tab,i)=>{
    const sectionId='tab-'+tab.id;
    let section=document.getElementById(sectionId);
    const isActive=tab.id===currentTabId;
    const html=renderTabContent(tab,0);
    if(!section){
      section=document.createElement('div');
      section.id=sectionId;
      const inner=document.createElement('div');
      inner.className='container';
      inner.innerHTML=html;
      section.appendChild(inner);
      // attach lb handlers via delegation (works for img-wrap + gc-wrap)
      section.addEventListener('click', e => {
        if(editMode){
          const ed = e.target.closest('[data-edit]');
          if(ed){ e.preventDefault(); e.stopPropagation(); openEditElement(ed); return; }
          return; // swallow other clicks in edit mode
        }
        const el = e.target.closest('[data-lbidx]');
        if(el) openLb(parseInt(el.dataset.lbidx));
      });
    } else {
      const inner=section.querySelector('.container');
      if(inner && inner.innerHTML!==html){
        // BUG FIX: even with the reuse-instead-of-rebuild fix above, a real
        // content change anywhere on a tab (one price, one text field) used
        // to still rewrite that whole tab's innerHTML wholesale — which
        // destroyed and recreated every <img> on the tab, including ones
        // completely unrelated to the change, causing them to visibly
        // flicker as the browser redecoded them. Parse the new HTML into a
        // detached fragment first, then "adopt" any already-loaded <img>
        // elements whose src is unchanged into the new markup (matched by
        // src, in document order, so duplicate srcs still pair up
        // correctly) before installing it — the browser never has to
        // re-fetch/re-decode an image that didn't actually change.
        const tmp=document.createElement('div');
        tmp.innerHTML=html;
        const oldBySrc=new Map();
        inner.querySelectorAll('img').forEach(img=>{
          const key=img.getAttribute('src')||'';
          if(!oldBySrc.has(key)) oldBySrc.set(key,[]);
          oldBySrc.get(key).push(img);
        });
        tmp.querySelectorAll('img').forEach(newImg=>{
          const key=newImg.getAttribute('src')||'';
          const bucket=oldBySrc.get(key);
          if(bucket && bucket.length){
            const oldImg=bucket.shift();
            Array.from(newImg.attributes).forEach(a=>{
              if(oldImg.getAttribute(a.name)!==a.value) oldImg.setAttribute(a.name,a.value);
            });
            newImg.replaceWith(oldImg);
          }
        });
        inner.innerHTML='';
        while(tmp.firstChild) inner.appendChild(tmp.firstChild);
      }
    }
    section.className='tab-content'+(isActive?' active':'');
    // Keep DOM order matching tab order (handles admin tab reordering)
    if(container.children[i]!==section) container.insertBefore(section, container.children[i]||null);
  });
}

// ── SWIPE TO CHANGE TABS ──
(function(){
  // True carousel-style swipe: both the current tab panel and the
  // neighbor it's revealing move together as one continuous surface,
  // like Twitter — never a disappear/reappear. All tabs already exist in
  // the DOM (#tabsContainer renders every visible tab, just toggling
  // display via the .active class), so we temporarily position the
  // active panel and its neighbor side by side and translate both by the
  // same amount. Cleanup happens either by resetting inline styles (swipe
  // cancelled) or automatically via goToTab()'s renderAll(), which
  // rebuilds #tabsContainer from scratch and discards our inline styles.
  //
  // The active-tab indicator bar (#navIndicator, see renderNav()) is
  // driven in lockstep with the exact same drag progress, so it glides
  // between tabs in real time instead of snapping after the fact.
  let tsX=0,tsY=0,isDragging=false,dragLocked=false,dir=0;
  let activeEl=null,neighborEl=null,containerEl=null,prevContainerStyle=null;
  let navIndicatorEl=null,navActiveLeft=0,navActiveWidth=0,navNeighborLeft=0,navNeighborWidth=0;
  let navActiveTabElRef=null,navNeighborTabElRef=null;
  const THRESHOLD=0.12; // 12% of screen width to commit — light swipe enough

  function resetPanel(el){
    if(!el) return;
    el.style.position='';el.style.top='';el.style.left='';el.style.width='';
    el.style.transition='';el.style.transform='';el.style.display='';
  }
  function cleanupSlide(){
    if(containerEl&&prevContainerStyle){
      containerEl.style.position=prevContainerStyle.position;
      containerEl.style.overflow=prevContainerStyle.overflow;
      containerEl.style.height=prevContainerStyle.height;
    }
    resetPanel(activeEl);
    resetPanel(neighborEl);
    if(navActiveTabElRef) navActiveTabElRef.classList.remove('nav-tab-swiping');
    if(navNeighborTabElRef) navNeighborTabElRef.classList.remove('nav-tab-swiping');
    navActiveTabElRef=null; navNeighborTabElRef=null;
    activeEl=null;neighborEl=null;containerEl=null;prevContainerStyle=null;dir=0;
    navIndicatorEl=null;
  }

  document.addEventListener('touchstart',e=>{
    if(document.getElementById('adminPanel')?.classList.contains('open')) return;
    // Don't intercept touches on nav-bar, lightbox, admin, inputs
    if(e.target.closest('.nav-bar,.lb,.admin-panel,input,textarea,select,button')) return;
    tsX=e.touches[0].clientX;
    tsY=e.touches[0].clientY;
    isDragging=false;
    dragLocked=false;
  },{passive:true});

  document.addEventListener('touchmove',e=>{
    if(document.getElementById('adminPanel')?.classList.contains('open')) return;
    if(dragLocked) return;
    if(e.target.closest('.nav-bar,.lb,.admin-panel,input,textarea,select')) return;
    const dx=e.touches[0].clientX-tsX;
    const dy=e.touches[0].clientY-tsY;
    const W=window.innerWidth;
    // Lock to vertical scroll if clearly scrolling up/down
    if(!isDragging&&Math.abs(dy)>Math.abs(dx)*1.5+4){ dragLocked=true; return; }
    if(!isDragging&&Math.abs(dx)>6){
      isDragging=true;
      const vis=DATA.tabs.filter(tb=>tb.visible!==false);
      const idx=vis.findIndex(tb=>tb.id===currentTabId);
      dir=dx<0?1:-1; // 1 = swiping to next tab, -1 = swiping to previous
      const newIdx=idx+dir;
      if(newIdx<0||newIdx>=vis.length){ dir=0; return; } // no neighbour that way
      containerEl=document.getElementById('tabsContainer');
      activeEl=document.getElementById('tab-'+currentTabId);
      neighborEl=document.getElementById('tab-'+vis[newIdx].id);
      if(!containerEl||!activeEl||!neighborEl){ dir=0;activeEl=null;neighborEl=null;containerEl=null; return; }
      prevContainerStyle={position:containerEl.style.position,overflow:containerEl.style.overflow,height:containerEl.style.height};
      containerEl.style.position='relative';
      containerEl.style.overflow='hidden';
      containerEl.style.height=activeEl.offsetHeight+'px';
      activeEl.style.position='absolute';
      activeEl.style.top='0'; activeEl.style.left='0'; activeEl.style.width='100%';
      activeEl.style.transition='none';
      neighborEl.style.display='block';
      neighborEl.style.position='absolute';
      neighborEl.style.top='0'; neighborEl.style.width='100%';
      neighborEl.style.left=(dir>0?W:-W)+'px';
      neighborEl.style.transition='none';
      // Set up the indicator's start/end geometry once, from the two
      // corresponding .nav-tab elements (same index order as `vis`).
      const navEl=document.getElementById('nav');
      const navTabs=navEl?Array.from(navEl.querySelectorAll('.nav-tab')):[];
      const navActiveTabEl=navTabs[idx]||null;
      const navNeighborTabEl=navTabs[newIdx]||null;
      navIndicatorEl=document.getElementById('navIndicator');
      if(navIndicatorEl&&navActiveTabEl&&navNeighborTabEl){
        navIndicatorEl.style.transition='none';
        navActiveLeft=navActiveTabEl.offsetLeft; navActiveWidth=navActiveTabEl.offsetWidth;
        navNeighborLeft=navNeighborTabEl.offsetLeft; navNeighborWidth=navNeighborTabEl.offsetWidth;
        // BUG FIX: only the tab that WAS active had navy (legible) text —
        // the neighbor being swiped toward was still styled pale/dim
        // (correct for sitting on the navy header, but that same pale
        // text turns near-invisible once the white pill slides under it
        // mid-drag). That read as "the label is blank, then it appears"
        // once the swipe finished and a fresh render finally colored it
        // navy. Color both tabs navy for the live drag — whichever one
        // the pill currently covers is then already legible throughout,
        // like a light passing over something already there rather than
        // something being drawn in after the fact.
        navActiveTabEl.classList.add('nav-tab-swiping');
        navNeighborTabEl.classList.add('nav-tab-swiping');
        navActiveTabElRef=navActiveTabEl; navNeighborTabElRef=navNeighborTabEl;
      } else {
        navIndicatorEl=null;
      }
    }
    if(!isDragging||dir===0) return;
    // Move both panels together with the finger — the neighbour follows
    // right along at its fixed offset, so it visibly slides in as the
    // active panel slides out, instead of a cut between two states.
    activeEl.style.transform=`translate3d(${dx}px,0,0)`;
    neighborEl.style.transform=`translate3d(${dx}px,0,0)`;
    // Slide the indicator in perfect lockstep with the same drag progress
    // driving the content — never after the fact.
    if(navIndicatorEl){
      const p=Math.min(1,Math.abs(dx)/W);
      navIndicatorEl.style.left=(navActiveLeft+(navNeighborLeft-navActiveLeft)*p)+'px';
      navIndicatorEl.style.width=(navActiveWidth+(navNeighborWidth-navActiveWidth)*p)+'px';
    }
  },{passive:true});

  document.addEventListener('touchend',e=>{
    const wasDragging=isDragging;
    isDragging=false;
    dragLocked=false;
    // Pure tap — reset any stray transform and let click fire normally
    if(!wasDragging){ cleanupSlide(); return; }
    if(document.getElementById('adminPanel')?.classList.contains('open')){ cleanupSlide(); return; }
    if(dir===0||!activeEl||!neighborEl){ cleanupSlide(); return; }
    const dx=e.changedTouches[0].clientX-tsX;
    const W=window.innerWidth;
    const vis=DATA.tabs.filter(tb=>tb.visible!==false);
    const idx=vis.findIndex(tb=>tb.id===currentTabId);
    const newIdx=idx+dir;
    const _active=activeEl,_neighbor=neighborEl,_navIndicator=navIndicatorEl;
    // Slower, softer easing so the settle feels like one continuous
    // surface gliding to a stop, not a snap. The indicator uses the exact
    // same duration/easing so it lands at the same instant as the content.
    const EASE='transform .32s cubic-bezier(0.22,1,0.36,1)';
    const NAV_EASE='left .32s cubic-bezier(0.22,1,0.36,1),width .32s cubic-bezier(0.22,1,0.36,1)';
    if(Math.abs(dx)>W*THRESHOLD&&newIdx>=0&&newIdx<vis.length){
      _active.style.transition=EASE;
      _neighbor.style.transition=EASE;
      _active.style.transform=`translate3d(${-dir*W}px,0,0)`;
      // BUG FIX: this must land the neighbor at the SAME net offset as the
      // active panel's exit (-dir*W), because the neighbor's resting
      // "left" is already offset by +dir*W — translate3d(0,0,0) here
      // cancelled that offset back out instead of bringing it into view,
      // which is exactly the "content disappears" flash right as the
      // swipe committed.
      _neighbor.style.transform=`translate3d(${-dir*W}px,0,0)`;
      if(_navIndicator){
        _navIndicator.style.transition=NAV_EASE;
        _navIndicator.style.left=navNeighborLeft+'px';
        _navIndicator.style.width=navNeighborWidth+'px';
      }
      setTimeout(()=>{
        cleanupSlide();
        goToTab(vis[newIdx].id);
      },320);
    } else {
      _active.style.transition=EASE;
      _neighbor.style.transition=EASE;
      _active.style.transform='translate3d(0,0,0)';
      // Return the neighbor to its exact starting offset (0 added
      // translate on top of its resting +dir*W position) rather than
      // doubling the offset.
      _neighbor.style.transform='translate3d(0,0,0)';
      if(_navIndicator){
        _navIndicator.style.transition=NAV_EASE;
        _navIndicator.style.left=navActiveLeft+'px';
        _navIndicator.style.width=navActiveWidth+'px';
      }
      setTimeout(cleanupSlide,340);
    }
  });
})();

function renderTabContent(tab,lbOffset){
  let imgIdx=lbOffset;
  let html='<div class="cards-stack">';

  // ACTUAL HOME TAB
  if(tab.id==='__home'){
    // 1. Description first
    if(DATA.intro.active){
      const soc=DATA.social||{};
      html+=`<div class="intro-card" data-edit="intro"><div class="intro-card-label">À propos</div><div class="intro-card-text">${t(DATA.intro.text)}</div></div>`;
    }
    // 2. Media (photo or video)
    const wantVideo = DATA.homeTab && DATA.homeTab.mediaChoice==='video' && DATA.homeTab.video;
    if(wantVideo){
      const videoUrl=DATA.homeTab.video;
      const ratio=DATA.homeTab.videoRatio||'16/9';
      const ytMatch=videoUrl.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]+)/);
      const vimeoMatch=videoUrl.match(/vimeo\.com\/([\d]+)/);
      const isDirectFile=/\.(mp4|webm|mov)(\?|$)/i.test(videoUrl);
      // Flat line-art icons matching the reference style (rounded-square
      // dark badge, white speaker glyph) instead of relying on emoji,
      // which render inconsistently across platforms/fonts.
      const muteIconSvg=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><line x1="16" y1="9" x2="22" y2="15"/><line x1="22" y1="9" x2="16" y2="15"/></svg>`;
      const muteBtnHtml=`<button type="button" class="video-mute-btn" onclick="toggleHomeVideoMute(this)" aria-label="Activer/couper le son">${muteIconSvg}</button>`;
      if(isDirectFile && !ytMatch && !vimeoMatch){
        // A direct video file plays natively — autoplay/loop/mute work
        // as real HTML attributes here, unlike the YouTube/Vimeo iframe
        // embeds below which only respond to their own query params.
        html+=`<div class="home-photo-wrap" style="position:relative;aspect-ratio:${ratio};background:#000"><video src="${videoUrl}" autoplay muted loop playsinline style="width:100%;height:100%;object-fit:cover"></video>${muteBtnHtml}</div>`;
      } else {
        let embedUrl='';
        // enablejsapi=1 lets the mute button below talk to the embed via
        // postMessage — otherwise there'd be no way to unmute a
        // YouTube/Vimeo background video at all once it's forced muted.
        if(ytMatch) embedUrl=`https://www.youtube.com/embed/${ytMatch[1]}?autoplay=0&rel=0&controls=0&modestbranding=1&showinfo=0&enablejsapi=1`;
        else if(vimeoMatch) embedUrl=`https://player.vimeo.com/video/${vimeoMatch[1]}?controls=0&title=0&byline=0&portrait=0`;
        else embedUrl=videoUrl;
        if(embedUrl) html+=`<div class="home-photo-wrap" style="position:relative;aspect-ratio:${ratio};background:#000"><iframe src="${embedUrl+(embedUrl.includes('?')?'&':'?')+'autoplay=1&mute=1&controls=0&loop=1&playsinline=1'}" style="width:100%;height:100%;border:none;pointer-events:none" allow="autoplay; encrypted-media" allowfullscreen loading="lazy"></iframe>${muteBtnHtml}</div>`;
      }
    } else if(DATA.homeTab&&DATA.homeTab.photo){
      html+=`<div class="home-photo-wrap"><img class="home-photo" src="${DATA.homeTab.photo}" alt="Photo restaurant" loading="lazy" onload="clampHomePhotoRatio(this)"></div>`;
    }
    // 3. Specials + info banners
    DATA.specials.forEach(sp=>{
      if(sp.active&&(sp.showHome!==false)){
        html+=renderBanner(sp);
      }
    });
    if(DATA.infoBanner&&DATA.infoBanner.active&&(DATA.infoBanner.showHome!==false)){
      html+=renderInfoBanner(DATA.infoBanner);
    }
    // Pinned dishes on home tab — own mini lightbox
    const pins2=DATA.pinnedDishes||[];
    const pinDishes2=pins2.map(p=>{ const r=resolvePin(p); return r?{...r.dish}:null; }).filter(Boolean).slice(0,4);
    if(pinDishes2.length>0&&(DATA.pinnedShowHome!==false)){
      if(view==='grid'){
        html+=`<div class="featured-card" style="border:1.5px solid var(--gold);box-shadow:0 2px 12px rgba(198,162,74,0.12)">
        <div class="featured-label" style="display:flex;align-items:center;gap:6px">
          <span style="color:var(--gold)">★</span> Nos incontournables <span style="color:var(--gold)">★</span>
        </div>
        <div class="featured-grid">`;
        pinDishes2.forEach((d,idx)=>{ html+=`<div class="featured-item" style="cursor:pointer" onclick="openPinLb(${idx})">${d.img?`<img class="featured-item-img" src="${d.img}" alt="" loading="lazy">`:'<div class="featured-item-img"></div>'}<div class="featured-item-body">${d.priceType==='dual'?`<div class="featured-item-name">${t(d.name)}</div><div class="featured-item-price">${dishPriceDisplay(d)}</div>`:`<div class="featured-top-row"><div class="featured-item-name">${t(d.name)}</div>${dishPriceDisplay(d)?`<span class="featured-item-price-inline">${dishPriceDisplay(d)}</span>`:''}</div>`}</div></div>`; });
        html+=`</div></div>`;
      } else {
        // list view
        html+=`<div class="card" style="border:1.5px solid var(--gold)"><div class="card-hdr" style="border-bottom:1px solid rgba(198,162,74,0.3)"><span class="card-label" style="color:var(--gold)">★ Nos incontournables ★</span></div><div class="card-body">`;
        pinDishes2.forEach((d,idx)=>{
          html+=`<div class="dish-row dish-row-clickable" onclick="openPinLb(${idx})">`;
          if(d.img) html+=`<img class="dish-img" src="${d.img}" alt="" loading="lazy">`;
          html+=`<div class="dish-text"><div class="dish-name-row"><span class="dish-name">${t(d.name)}</span></div>`;
          if(t(d.desc)) html+=`<div class="dish-desc">${t(d.desc)}</div>`;
          if(d.price) html+=`<div class="dish-price">${dishPriceDisplay(d)}</div>`;
          html+=`</div></div>`;
        });
        html+=`</div></div>`;
      }
    }
    // Schedule widget rendered in subheader (renderViewBar)
    html+=homeSocialBarHtml();
    html+='</div>';
    return html;
  }

  // OLD HOME: specials + intro + featured
  if(tab.isHome){
    // intro only if no dedicated home tab
    if(DATA.intro.active && !DATA.tabs.some(tb=>tb.id==='__home')){
      const soc=DATA.social||{};
      html+=`<div class="intro-card" data-edit="intro"><div class="intro-card-label">À propos</div><div class="intro-card-text">${t(DATA.intro.text)}</div></div>`;
    }
    // specials on first tab
    DATA.specials.forEach(sp=>{
      if(sp.active && sp.showFirst!==false) html+=renderBanner(sp);
    });
    if(DATA.infoBanner&&DATA.infoBanner.active&&DATA.infoBanner.showFirst!==false) html+=renderInfoBanner(DATA.infoBanner);
    // featured / pinned
    // Pinned dishes on first tab
    const pins=DATA.pinnedDishes||[];
    const pinDishes=pins.map(p=>{ const r=resolvePin(p); return r?{...r.dish}:null; }).filter(Boolean);
    if(pinDishes.length>0&&(DATA.pinnedShowFirst!==false)){
      html+=`<div class="featured-card"><div class="featured-label">⭐ Nos incontournables</div><div class="featured-grid">`;
      pinDishes.slice(0,4).forEach((d,idx)=>{ html+=`<div class="featured-item" style="cursor:pointer" onclick="openPinLb(${idx})">${d.img?`<img class="featured-item-img" src="${d.img}" alt="" loading="lazy">`:'<div class="featured-item-img"></div>'}<div class="featured-item-body">${d.priceType==='dual'?`<div class="featured-item-name">${t(d.name)}</div><div class="featured-item-price">${dishPriceDisplay(d)}</div>`:`<div class="featured-top-row"><div class="featured-item-name">${t(d.name)}</div>${dishPriceDisplay(d)?`<span class="featured-item-price-inline">${dishPriceDisplay(d)}</span>`:''}</div>`}</div></div>`; });
      html+=`</div></div>`;
    }
  }

  // BUG FIX: this used to hardcode an exemption for a tab literally
  // id'd 'boissons' — but grid view skips EVERY bevs-type card (they

        // compact top-right slot — those keep the price on its own
        // line below the description, same as before this change.

          ? `<div class="gc-name">${t(d.name)}${badges?` <span class="dish-badges" style="display:inline-flex">${badges}</span>`:''}</div><div class="gc-desc">${t(d.desc)}</div><div class="gc-price">${priceHtml}</div>`

        gridItems.push(`<div class="gc" data-edit="dish" data-ti="${DATA.tabs.indexOf(tab)}" data-ci="${ci}" data-di="${di}"${d.img?` data-lbidx="${idx}"`:''}><div class="gc-wrap">${d.img?`<img class="gc-img" src="${d.img}" alt="" loading="lazy">`:'<div style="aspect-ratio:1;background:#ece8e1"></div>'}</div><div class="gc-body">${gcBody}</div></div>`);
