// Build the inner menu HTML (shared by preview + export)
function buildPdfMenuHTML(cfg){
  const b = buildPdfBlocks(cfg);
  return b.headerHtml + b.contentBlocks.map(x=>x.html).join('') + b.footerHtml;
}

// Split the menu into atomic pieces (header / each dish-or-item / footer)
// instead of one giant HTML string — needed so paginatePdfPages() can
// measure and distribute them across real physical pages. Every dish/
// variant/bev-item is its own block (never split internally); a
// category's own <h2> travels with its first dish so a category never
// starts a page with just a lonely heading and nothing under it.
// Menus et Formules uniquement — transformation du TEXTE lui-même
// (jamais du CSS text-transform + ::first-letter) pour la casse
// "minuscule" : ::first-letter n'est pas fiable avec html2canvas
// (confirmé par capture — ça casse le rendu, espace fantôme entre la
// 1ère et la 2e lettre). En transformant la vraie chaîne de
// caractères avant de l'insérer dans le HTML, ça marche avec
// n'importe quel moteur de rendu, sans dépendre d'un pseudo-élément.
function applyTextCase(text, mode){
  if(!text) return text;
  if(mode === 'upper') return text.toUpperCase();
  if(mode === 'lower') return text.charAt(0).toUpperCase() + text.slice(1).toLowerCase();
  return text;
}
function buildPdfBlocks(cfg){
  const restName = getRestaurantName() || 'Menu';
  // Instagram (comme Google Business) : aucun en-tête, direct dans les
  // catégories — chaque story ne montre qu'UNE catégorie à la fois.
  const isGbizFmt = cfg.format === 'gbiz' || cfg.format === 'insta';
  // Logo: PDF-specific upload > restaurant logo already stored > nothing
  const logoUrl = (DATA.pdfStyle && DATA.pdfStyle.logoData) || getRestaurantLogo() || '';
  const icData = DATA.icones||{};
  const showMainIc = cfg.showIcons!==false && icData.main && !cfg.showLogo;
  const showSecIc  = cfg.showIcons!==false && !!icData.secondary;
  // Google Business n'affiche aucun en-tête du tout (ni logo, ni nom
  // du restaurant) — seulement les catégories, dès la première page.
  // Ça règle aussi l'alignement entre pages d'un coup : sans en-tête
  // nulle part, chaque page démarre déjà au même niveau naturellement.
  const showLogoImg = !isGbizFmt && cfg.showLogo && logoUrl;

  let headerHtml = '';
  if(!isGbizFmt){
    headerHtml = `<div class="pdf-header">`;
    if(showLogoImg) headerHtml += `<img src="${logoUrl}" class="pdf-logo" onerror="this.style.display='none'">`;
    else if(cfg.showLogo && !logoUrl) headerHtml += `<div class="pdf-logo-text">${getRestaurantName()||''}</div>`;
    // BUG FIX: this only ever suppressed the big <h1> title when a real
    // logo IMAGE was showing — but checking "Afficher le logo" with no
    // logo actually uploaded falls back to .pdf-logo-text (the name,
    // small and styled), and the <h1> still rendered right under it: two
    // renderings of the same name stacked together. The checkbox itself
    // is "soit l'un soit l'autre" regardless of whether a real image
    // exists — so the title is now suppressed whenever cfg.showLogo is
    // on at all, not just when an image happens to be present.
    if(!cfg.showLogo) headerHtml += `<h1 class="pdf-title">${restName}</h1>`;
    if(DATA.heroActive && DATA.hero) headerHtml += `<div class="pdf-sub">${t(DATA.hero)}</div>`;
    if(showMainIc) headerHtml += `<img src="${icData.main}" style="width:48px;height:48px;object-fit:contain;margin:10px auto 0;display:block" onerror="this.style.display='none'">`;
    headerHtml += `</div>`;
  }

  const contentBlocks = [];
  const dots = cfg.showDots!==false ? '<span class="pdf-dots"></span>' : '<span class="pdf-dots-off"></span>';
  // Google Business specifically gets a cleaner price format for
  // dual-price dishes (oysters etc.) — "12€ / 22€" reads unambiguously
  // on one line, versus the site's own "Les 6 — 12€ · Les 12 — 22€"
  // which is harder for a quick glance (and for Google's own menu
  // parsing, when it reads a PDF/image) to disambiguate.
  // Format simple validé par Will pour Google Business — "12€ / 22€",
  // pas de découpage en plusieurs lignes.
  // Réglage propre à l'impression (cfg.showCurrency), pas le réglage
  // global du site — c'est ce qui permet de le forcer indépendamment
  // depuis la section Export/Impression. Instagram (isInstaFmt) ignore
  // ce réglage et retire toujours le symbole € — demande explicite de
  // Will, spécifique à ce format uniquement.
  const isInstaFmt = cfg.format === 'insta';
  const pdfCurrency = s => (cfg.showCurrency===false || isInstaFmt) ? String(s||'').replace(/€/g,'').trim() : s;
  // Sur Instagram, un double prix (ex. huîtres "Les 6 — 12€ · Les 12 —
  // 22€") n'affiche que le premier — demande explicite de Will, pour
  // rester le plus épuré possible sur ce format précis uniquement.
  const priceText = d => pdfCurrency((isGbizFmt && d.priceType==='dual' && d.p1 && d.p2)
    ? (isInstaFmt ? `${d.p1}` : `${d.p1}€ / ${d.p2}€`)
    : (d.price||''));
  // Réutilisable pour "Menu et Formule" : par défaut on lit le vrai
  // menu (DATA.tabs), mais si cfg.tabsSource est fourni (les
  // catégories d'une formule), c'est cette liste qui est utilisée à la
  // place — c'est le seul point de contact du moteur avec la source
  // des données, aucune autre logique n'a besoin de changer.
  (cfg.tabsSource || DATA.tabs).filter(tb=>tb.id!=='__home' && tb.visible!==false).forEach(tb=>{
    const catLabel = cfg.tabsSource ? applyTextCase(t(tb.label), cfg.catCase==='lower'?'lower':'upper') : t(tb.label);
    let pendingHeader = `<h2 class="pdf-cat" data-tab-id="${tb.id}">${showSecIc?`<img src="${icData.secondary}" style="width:16px;height:16px;object-fit:contain;vertical-align:middle;margin-right:6px" onerror="this.remove()">`:''}${catLabel}</h2>`;
    let firstBlockOfTab = true;
    // "Catégorie solo" — une catégorie qui ne contient qu'UN SEUL plat au
    // total (tous types de cartes confondus) se retrouve visuellement
    // déséquilibrée à l'export : un gros titre de catégorie suivi d'une
    // seule petite ligne, avec tout l'espace calibré pour plusieurs plats
    // resté vide en dessous. Exception demandée par Will : uniquement
    // dans ce cas précis (jamais à partir de 2 plats), on resserre un peu
    // le plat lui-même (texte + espacement, jamais le titre de la
    // catégorie) via la classe .pdf-dish-solo ci-dessous.
    const tabItemCount = tb.cards.reduce((n,card)=>{
      if(card.dishes) return n + card.dishes.filter(d=>!d.hidden).length;
      if(card.type==='variants') return n + (card.variants||[]).filter(v=>!v.hidden).length;
      if(card.type==='bevs') return n + (card.items||[]).filter(item=>!item.hidden).length;
      return n;
    }, 0);
    const soloCls = tabItemCount===1 ? ' pdf-dish-solo' : '';
    tb.cards.forEach(card=>{
      let pendingSubcat = (t(card.label) && tb.cards.length>1) ? `<h3 class="pdf-subcat">${t(card.label)}</h3>` : '';
      const items = card.dishes ? card.dishes.filter(d=>!d.hidden).map(d=>{
          const dName = cfg.tabsSource ? applyTextCase(t(d.name)||'', cfg.nameCase==='lower'?'lower':'upper') : (t(d.name)||'');
          const dDesc = cfg.tabsSource ? applyTextCase(t(d.desc), cfg.descCase==='upper'?'upper':'lower') : t(d.desc);
          return `<div class="pdf-dish${soloCls}"><div class="pdf-dish-line"><span class="pdf-dish-name">${dName}</span>${dots}<span class="pdf-dish-price">${priceText(d)}</span></div>${dDesc?`<div class="pdf-dish-desc">${dDesc}</div>`:''}</div>`;
        })
        : card.type==='variants' ? (card.variants||[]).filter(v=>!v.hidden).map(v=>
          `<div class="pdf-dish${soloCls}"><div class="pdf-dish-line"><span class="pdf-dish-name">${t(v.name)||''}</span>${dots}<span class="pdf-dish-price">${priceText(v)}</span></div></div>`)
        : card.type==='bevs' ? (card.items||[]).filter(item=>!item.hidden).map(item=>{
          // Sur Instagram, un seul prix affiché (la 1ère taille), pas la
          // liste complète "Les 6 — 12€ · Les 12 — 22€" — même logique
          // d'épuration que priceText ci-dessus, appliquée ici pour les
          // plats à tailles multiples (huîtres, etc.).
          const sizes = isInstaFmt
            ? ((item.sizes||[])[0] ? String((item.sizes||[])[0].price||'') : '')
            : (item.sizes||[]).map(s=>bevSizeLabel(s)+' — '+s.price+'€').join(' · ');
          return `<div class="pdf-dish${soloCls}"><div class="pdf-dish-line"><span class="pdf-dish-name">${t(item.name)||''}</span>${dots}<span class="pdf-dish-price">${pdfCurrency(sizes||item.price||'')}</span></div>${t(item.desc)?`<div class="pdf-dish-desc">${t(item.desc)}</div>`:''}</div>`;
        }) : [];
      items.forEach((itemHtml, i)=>{
        let html = itemHtml;
        if(i===0){ html = pendingSubcat + html; pendingSubcat = ''; }
        let forceBreak = false;
        if(firstBlockOfTab){
          html = pendingHeader + html;
          forceBreak = !!tb.pdfPageBreakBefore;
          firstBlockOfTab = false;
        }
        contentBlocks.push({ html, forceBreak, tabId: tb.id, cardType: card.type||'dishes' });
      });
    });
  });

  // Footer : uniquement le texte personnalisé — plus aucun champ ajouté
  // automatiquement (adresse, téléphone, date), puisque rien de tout ça
  // n'était sélectionnable/désactivable individuellement. Non pertinent
  // pour Google Business (pas de champ dédié pour ce format).
  const footerHtml = cfg.footerCustomText
    ? `<div class="pdf-footer"><div class="pdf-footer-text">${cfg.footerCustomText}</div></div>`
    : '';

  return { headerHtml, contentBlocks, footerHtml };
}

// BUG FIX: the page frame (.pdf-page::before) was drawn once around one
// giant div holding the whole menu, then the browser's native print
// engine sliced that div across as many physical sheets as needed. A
// single border drawn around content 3x taller than one page only ever
// shows its top edge on page 1, its bottom edge on the last page, and
// NEITHER on any page in between — exactly the "incomplete frame"
// symptom. Fix: actually paginate in JS — measure real rendered heights
// (same fonts, same CSS, same everything) and split content into
// several independent .pdf-page divs, each already sized to fit one
// physical sheet. Each one gets its own complete, independent border.
function paginatePdfPages(cfg){
  if(cfg.format === 'gbiz') return [{ html: buildPdfMenuHTML(cfg), spaceScale: 1 }]; // one tall image, not print-paginated
  const isA5 = cfg.paperSize === 'a5';
  // True A4/A5 physical page height at 96dpi (210×297mm / 148×210mm).
  // @page margin is 0 (see buildPdfCSS) — the PDF itself must be truly
  // edge-to-edge, so the full physical height is available; the only
  // inset left is our own deliberate `pad`, a design choice rather
  // than a print-driver default.
  const fullPageHeightPx = isA5 ? 794 : 1123;
  const A5_SCALE = 0.72;
  const padPx = Math.round((isA5 ? A5_SCALE : 1) * 30);
  // Small safety margin: fonts/DPI vary slightly by browser/OS, so aim
  // a touch under the true limit rather than risk the browser's own
  // print engine still needing to split a page we thought would fit.
  // (Was 6% — real-world testing showed that left a whole extra dish's
  // worth of unused space at the bottom of every page, which is also
  // what read as "bottom margin bigger than the other 3 sides": the
  // frame itself is a uniform 14px inset on every side, so that gap
  // was unused content room, not the frame sitting off-center.)
  const maxPageHeightPx = Math.floor((fullPageHeightPx - 2*padPx) * 1.03);

  const { headerHtml, contentBlocks, footerHtml } = buildPdfBlocks(cfg);

  const holder = document.createElement('div');
  holder.style.cssText = 'position:fixed;left:-99999px;top:0;visibility:hidden;';
  // min-height:0 here is essential, not cosmetic: .pdf-page carries its
  // own min-height (the full physical page) so real pages always look
  // complete even half-empty — but that same min-height would poison
  // THIS measurement if left in place, since every offsetHeight read
  // would floor out at "one full page" regardless of actual content,
  // making every single block appear to overflow and forcing a page
  // break after each one. This override keeps the measurement honest.
  holder.innerHTML = `<style>${buildPdfCSS(cfg)}</style><div class="pdf-page" id="__pdfMeasure" style="height:auto;min-height:0"></div>`;
  document.body.appendChild(holder);
  const measureEl = holder.querySelector('#__pdfMeasure');
  const heightOf = html => { measureEl.innerHTML = html; return measureEl.offsetHeight; };

  const pages = [];
  let current = headerHtml;
  contentBlocks.forEach(block=>{
    const candidate = current + block.html;
    const mustBreak = block.forceBreak && current !== headerHtml && current !== '';
    if(!mustBreak && heightOf(candidate) <= maxPageHeightPx){
      current = candidate;
    } else {
      pages.push(current);
      current = block.html; // new page starts with just this block (no repeated header)
    }
  });
  // Footer: append to the last page if it fits, otherwise its own page.
  const withFooter = current + footerHtml;
  if(footerHtml && heightOf(withFooter) > maxPageHeightPx){
    pages.push(current);
    current = footerHtml;
  } else {
    current = withFooter;
  }
  pages.push(current);
  // Whitespace as the adjustment variable: a page sitting well under
  // its available height gets its inter-dish/inter-category spacing
  // gently stretched (never text size) via the --space-scale custom
  // property (see buildPdfCSS) so the page reads as "designed to end
  // here" rather than "ran out of content". Remonté de +22% à +50% —
  // le plafond précédent était trop bas pour une page très courte
  // (ex. Huîtres seule, 4 plats), qui gardait un vide visible même une
  // fois étirée au maximum autorisé.
  const result = pages.map(pageHtml=>{
    const used = heightOf(pageHtml);
    const ratio = maxPageHeightPx > 0 ? used / maxPageHeightPx : 1;
    let spaceScale = 1;
    if(ratio < 0.97 && ratio > 0){
      const slack = 0.97 - ratio;
      spaceScale = Math.min(1.5, 1 + slack * 0.9);
    }
    return { html: pageHtml, spaceScale };
  });

  document.body.removeChild(holder);
  return result;
}


// Éclaircit une couleur hex en la mélangeant avec du blanc — utilisé
// pour dériver le "bleu moyen" des descriptions Instagram à partir du
// navy de la marque (cfg.titleColor), sans devoir stocker une 2e
// couleur séparée que Will devrait régler lui-même.
function lightenHex(hex, amt){
  hex = (hex||'#10285E').replace('#','');
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  const r = parseInt(hex.slice(0,2),16)||0, g = parseInt(hex.slice(2,4),16)||0, b = parseInt(hex.slice(4,6),16)||0;
  const mix = c => Math.round(c + (255-c)*amt);
  return `rgb(${mix(r)},${mix(g)},${mix(b)})`;
}

// CSS dédiée au format Instagram (story 9:16) — reprend les mêmes
// Calcul centralisé des tailles Instagram/Formule — utilisé à la fois
// par buildInstaCSS (le CSS affiché) ET fitInstaOneLiners (le
// rétrécissement "une seule ligne", qui applique un style en ligne
// prioritaire sur la classe CSS). BUG FIX : avant ce partage,
// fitInstaOneLiners recalculait sa propre taille de base à partir de
// cfg.instaTitleSize brut, ignorant complètement catTitleSize/
// formuleTitleSize/l'échelle globale — ses styles en ligne écrasaient
// donc silencieusement toute réduction de taille faite côté CSS.
// Menus et Formules uniquement : catégories 50%×75% plus petites,
// titre de formule 20% plus petit, et une échelle globale (%)
// s'applique en dernier, sur tout à la fois, proportionnellement.
function instaSizesFor(cfg){
  const titleSize = cfg.instaTitleSize || 45;
  const menuSize = cfg.instaMenuSize || 21;
  const descSize = cfg.instaDescSize || 19;
  const globalScale = cfg.tabsSource ? (cfg.globalSizeScale ?? 100)/100 : 1;
  const catTitleSize = Math.round((cfg.tabsSource ? titleSize*0.5*0.75*1.25*0.85*1.10 : titleSize) * globalScale);
  const formuleTitleSize = Math.round(titleSize*0.8*globalScale);
  return {
    titleSize,
    catTitleSize,
    formuleTitleSize,
    menuSize: Math.round(menuSize*globalScale),
    descSize: Math.round(descSize*globalScale)
  };
}

// classes que buildPdfBlocks produit déjà (.pdf-cat, .pdf-dish, etc.)
// mais avec un habillage entièrement différent : tout centré, gros
// titres en majuscules, prix et descriptions en italique, courtes
// séparations dorées entre les plats plutôt que des pointillés —
// calqué sur la référence fournie par Will (mood Drevici, mise en
// forme différente). Une image = une seule catégorie, jamais de
// chevauchement entre catégories.
function buildInstaCSS(cfg, ratio){
  ratio = ratio || INSTA_RATIO;
  const navy = cfg.titleColor || '#10285E';
  const gold = cfg.accentColor || '#C6A24A';
  // Fond Instagram — réglable indépendamment (cfg.instaBgColor),
  // sinon hérite de la couleur de fond générale de la marque.
  const bg = cfg.instaBgColor || cfg.bgColor || '#FDFBF6';
  // 3 couleurs et 3 tailles indépendantes (titre / menu / description)
  // — réglables dans l'admin, uniquement pour Instagram. Défauts
  // calqués sur le rendu initial si rien n'est explicitement choisi.
  const titleColor = cfg.instaTitleColor || navy;
  const menuColor = cfg.instaMenuColor || navy;
  const descColor = cfg.instaDescColor || lightenHex(navy, 0.28);
  const { titleSize, catTitleSize, formuleTitleSize, menuSize, descSize } = instaSizesFor(cfg);
  // 100px pour la story normale, 50px pour le post ET pour toute
  // formule (A4/Story/Post confondus) — demande explicite de Will :
  // pour une formule, le titre doit toujours être remonté au même
  // niveau sur les 3 formats, pour garder la place gagnée en bas.
  const padTop = (ratio === INSTA_POST_RATIO || cfg.tabsSource) ? 50 : 100, padSide = 36;
  // Police propre à Instagram (cfg.instaFont) — voir INSTA_FONT_OPTIONS
  // pour la liste proposée dans l'admin. Une seule police pour tout
  // (titre, nom de plat, prix, description), à différents poids/styles
  // — demande explicite de Will, spécifique à ce format uniquement.
  const font = cfg.instaFont || 'Playfair Display';
  const fontUrlName = font.replace(/ /g,'+');
  return `
  @import url('https://fonts.googleapis.com/css2?family=${fontUrlName}:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{margin:0;padding:0;background:${bg}}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important}
  .pdf-page{--space-scale:1;font-family:'${font}',serif;color:${titleColor};background:${bg};width:${INSTA_RENDER_W}px;height:${Math.round(INSTA_RENDER_W*ratio)}px;padding:${padTop}px ${padSide}px;margin:0 auto;position:relative;overflow:hidden;text-align:center;display:flex;flex-direction:column;align-items:center}
  .pdf-page::before{content:'';position:absolute;inset:20px;border:1.5px solid ${gold};pointer-events:none}
  .pdf-cat{font-family:'${font}',serif;font-weight:800;font-size:${catTitleSize}px;line-height:1.1;text-transform:${cfg.tabsSource?'none':'uppercase'};letter-spacing:.01em;color:${titleColor};margin-bottom:${cfg.tabsSource?14.7:44}px;border:none}
  .pdf-cat:has(+ .pdf-subcat){margin-bottom:22px}
  .pdf-cat + .pdf-subcat{margin-top:15px}
  ${cfg.tabsSource ? '.pdf-dish + .pdf-cat{margin-top:38px}' : ''}
  .pdf-subcat{font-family:'${font}',serif;font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.06em;color:${gold};margin:30px 0 18px}
  .pdf-dish{margin-bottom:calc(${cfg.tabsSource?7.83:30}px * var(--space-scale));width:100%}
  ${cfg.tabsSource ? '' : `.pdf-dish + .pdf-dish::before{content:'';display:block;width:64px;height:1px;background:${gold};margin:0 auto calc(26px * var(--space-scale));opacity:.8}`}
  .pdf-dish-line{display:flex;justify-content:center;align-items:baseline;gap:14px}
  .pdf-dish-name{font-family:'${font}',serif;font-weight:800;font-size:${menuSize}px;text-transform:${cfg.tabsSource?'none':'uppercase'};letter-spacing:.01em;color:${menuColor}}
  .pdf-dots,.pdf-dots-off{display:none}
  .pdf-dish-price{font-family:'${font}',serif;font-style:italic;font-weight:500;font-size:${Math.max(14,menuSize-1)}px;color:${menuColor}}
  .pdf-dish-desc{font-family:'${font}',serif;font-style:italic;font-weight:500;font-size:${descSize}px;line-height:1.35;color:${descColor};margin-top:6px;max-width:76%;margin-left:auto;margin-right:auto;text-wrap:balance}
  .pdf-footer{display:none}
  /* Menus et Formules uniquement — titre + texte libre optionnels,
     affichés avant les catégories (voir formule_buildPreamble). */
  .formule-title{font-family:'${font}',serif;font-weight:800;font-size:${formuleTitleSize}px;line-height:1.15;text-transform:uppercase;letter-spacing:.01em;color:${titleColor};margin-bottom:10px;text-align:center}
  .formule-freetext{font-family:'${font}',serif;font-style:italic;font-weight:500;font-size:${descSize}px;line-height:1.4;color:${descColor};white-space:pre-wrap;text-align:center;margin-bottom:34px;max-width:82%;margin-left:auto;margin-right:auto}
  /* Deux options d'alignement indépendantes, demandées séparément par
     Will : le contenu (catégories/plats) d'un côté, le titre + texte
     libre de l'autre — chacun peut être aligné à gauche ou rester
     centré, sans dépendre l'un de l'autre. */
  ${cfg.alignContentLeft ? `
  .pdf-cat{text-align:left;width:100%}
  .pdf-subcat{text-align:left;width:100%}
  .pdf-dish-line{justify-content:flex-start;text-align:left}
  .pdf-dish-desc{text-align:left;margin-left:0;margin-right:auto}
  ` : ''}
  ${cfg.alignTitleLeft ? `
  .formule-title{text-align:left;width:100%}
  .formule-freetext{text-align:left;margin-left:0;margin-right:auto;width:100%}
  ` : ''}
  `;
}

// Une image = une seule catégorie (jamais de fusion entre catégories,
// jamais de découpe au milieu d'une catégorie) — automatique, sans
// aucun réglage manuel par catégorie contrairement à Google Business :
// le seul degré de liberté est un resserrement d'espacement (jusqu'à
// -30%, jamais le texte) si la catégorie ne rentre pas nativement dans
// le cadre fixe de la story.
//
// BUG FIX (chevauchement massif) : dès qu'un titre de catégorie ou un
// nom de plat était trop long pour tenir sur une ligne, il repassait à
// la ligne — et html2canvas (contrairement à un vrai navigateur) ne
// recalcule pas correctement la hauteur d'un conteneur flex dont un
// enfant vient de passer sur 2 lignes : la hauteur qu'il croit avoir
// est trop petite, donc tout ce qui suit (description, plat suivant)
// se retrouve positionné par-dessus au lieu d'en dessous. La vraie
// solution — demande explicite de Will — est d'empêcher ce
// retour-à-la-ligne à la source : titres et noms de plats DOIVENT
// toujours tenir sur une seule ligne, en réduisant leur taille de
// police si besoin (jamais le texte tronqué). Ainsi le bug n'a plus
// jamais l'occasion de se déclencher, quelle que soit la longueur du
// texte réel du restaurateur.
function fitInstaOneLiners(html, holder, cfg){
  const measureEl = holder.querySelector('#__instaMeasure');
  // Largeur réellement disponible pour le texte : largeur de page moins
  // le padding gauche+droite de .pdf-page (voir buildInstaCSS), moins
  // une petite marge de sécurité pour ne jamais toucher le cadre doré.
  const padSide = 36;
  const availableW = INSTA_RENDER_W - padSide*2 - 16;
  const { catTitleSize, menuSize } = instaSizesFor(cfg);

  function fitOne(text, tag, className, baseSize, minSize){
    const test = document.createElement(tag);
    test.className = className;
    test.style.whiteSpace = 'nowrap';
    test.style.position = 'absolute';
    // BUG FIX (titres plus petits en alignement à gauche) : .pdf-cat a
    // width:100% quand alignContentLeft est actif (pour que le texte
    // s'aligne vraiment sur le bord de la page) — sans ce correctif,
    // l'élément de mesure hérite de ce width:100%, et scrollWidth
    // reflète alors la largeur du CONTENEUR entier plutôt que celle du
    // texte, faussant le calcul et rétrécissant inutilement. width:auto
    // ici force une mesure toujours basée sur la taille naturelle du
    // texte, centré ou aligné à gauche.
    test.style.width = 'auto';
    test.style.fontSize = baseSize+'px';
    test.innerHTML = text;
    measureEl.appendChild(test);
    let size = baseSize;
    while(test.scrollWidth > availableW && size > minSize){
      size -= 1;
      test.style.fontSize = size+'px';
    }
    measureEl.removeChild(test);
    return size;
  }

  let out = html.replace(/<h2 class="pdf-cat"([^>]*)>([\s\S]*?)<\/h2>/, (m, attrs, inner)=>{
    const size = fitOne(inner, 'h2', 'pdf-cat', catTitleSize, Math.min(13, catTitleSize));
    return `<h2 class="pdf-cat"${attrs} style="font-size:${size}px;white-space:nowrap">${inner}</h2>`;
  });
  out = out.replace(/<h3 class="pdf-subcat">([\s\S]*?)<\/h3>/g, (m, inner)=>{
    const size = fitOne(inner, 'h3', 'pdf-subcat', 22, 13);
    return `<h3 class="pdf-subcat" style="font-size:${size}px;white-space:nowrap">${inner}</h3>`;
  });
  // BUG FIX (chevauchement) : le retour à la ligne d'un nom de plat
  // recasse la mise en page à l'export — confirmé que ça arrive aussi
  // en inline-block, pas seulement en flex ; html2canvas mesure mal la
  // hauteur dès qu'un retour à la ligne se produit ici, quel que soit
  // le mode d'affichage. Retour au principe d'origine : un nom de plat
  // ne passe JAMAIS à la ligne, on rétrécit sa police à la place — mais
  // calibré sur "Maquereau au poivre de Sichuan" comme cas
  // limite accepté par Will (jamais plus long que ça dans la
  // pratique) : cette taille devient le plancher, jamais rétréci
  // davantage même pour un nom encore plus long (mieux vaut un léger
  // dépassement rare qu'un texte illisible ou le bug qui revient — à
  // la charge du restaurateur de raccourcir si besoin).
  const worstCaseFloor = fitOne('Maquereau au poivre de Sichuan', 'span', 'pdf-dish-name', menuSize, 10);
  out = out.replace(/<span class="pdf-dish-name">([\s\S]*?)<\/span>/g, (m, inner)=>{
    const size = fitOne(inner, 'span', 'pdf-dish-name', menuSize, worstCaseFloor);
    return `<span class="pdf-dish-name" style="font-size:${size}px;white-space:nowrap">${inner}</span>`;
  });
  return out;
}

// MENUS ET FORMULES UNIQUEMENT — règle absolue de Will : tout doit
// tenir sur UNE seule page, jamais de découpage en plusieurs images
// (contrairement à l'export Instagram du vrai menu, où plusieurs
// catégories/pages sont normales). Toutes les catégories de la
// formule sont combinées en un seul bloc. Ordre de repli : d'abord la
// compression d'espacement habituelle (étendue plus bas que
// d'habitude), puis, si ça ne suffit toujours pas, une réduction
// progressive de la taille de police (titre/menu/description
// ensemble, en gardant leurs proportions relatives) — jamais un
// découpage en plusieurs pages. Les règles de largeur existantes
// (une seule ligne pour le titre et le nom de plat, jamais de retour
// à la ligne) restent inchangées à chaque palier.
function buildFormulePage(cfg, ratio){
  ratio = ratio || INSTA_A4_RATIO;
  const pageH = Math.round(INSTA_RENDER_W*ratio);
  const baseTitleSize = cfg.instaTitleSize || 45;
  const baseMenuSize = cfg.instaMenuSize || 21;
  const baseDescSize = cfg.instaDescSize || 19;
  // Bien plus bas que le plancher habituel (-30%) — ici on préfère un
  // espacement très resserré à un découpage en plusieurs images.
  const COMPRESS_STEPS = [1, 0.94, 0.88, 0.82, 0.76, 0.7, 0.62, 0.54, 0.46, 0.4, 0.34];
  const FONT_SCALE_STEPS = [1, 0.92, 0.85, 0.78, 0.72, 0.66, 0.6, 0.54];

  const holder = document.createElement('div');
  holder.style.cssText = 'position:fixed;left:-99999px;top:0;visibility:hidden;';
  document.body.appendChild(holder);

  let finalHtml = null, finalScale = 1, finalCss = null;
  outer:
  for(const fontScale of FONT_SCALE_STEPS){
    const scaledCfg = {
      ...cfg,
      instaTitleSize: Math.max(16, Math.round(baseTitleSize*fontScale)),
      instaMenuSize: Math.max(11, Math.round(baseMenuSize*fontScale)),
      instaDescSize: Math.max(10, Math.round(baseDescSize*fontScale))
    };
    const css = buildInstaCSS(scaledCfg, ratio);
    holder.innerHTML = `<style>${css}</style><div class="pdf-page" id="__instaMeasure" style="height:auto;overflow:visible"></div>`;
    const measureEl = holder.querySelector('#__instaMeasure');

    const { contentBlocks } = buildPdfBlocks(scaledCfg);
    if(!contentBlocks.length){ finalHtml = cfg.formulePreamble || ''; finalCss = css; break; }
    const fixedBlocks = contentBlocks.map(b=>({ ...b, html: fitInstaOneLiners(b.html, holder, scaledCfg) }));
    const wholeHtml = (cfg.formulePreamble || '') + fixedBlocks.map(b=>b.html).join('');

    for(const scale of COMPRESS_STEPS){
      measureEl.style.setProperty('--space-scale', scale);
      measureEl.innerHTML = wholeHtml;
      if(measureEl.offsetHeight <= pageH){
        finalHtml = wholeHtml; finalScale = scale; finalCss = css;
        break outer;
      }
    }
  }
  // Dernier recours extrême (même la plus petite police + la
  // compression maximale ne suffiraient pas) : on force quand même une
  // seule page, à la config la plus compressée essayée — jamais de
  // deuxième image.
  if(finalHtml === null){
    const scaledCfg = { ...cfg, instaTitleSize: Math.max(16,Math.round(baseTitleSize*0.54)), instaMenuSize: Math.max(11,Math.round(baseMenuSize*0.54)), instaDescSize: Math.max(10,Math.round(baseDescSize*0.54)) };
    finalCss = buildInstaCSS(scaledCfg, ratio);
    const { contentBlocks } = buildPdfBlocks(scaledCfg);
    const fixedBlocks = contentBlocks.map(b=>({ ...b, html: fitInstaOneLiners(b.html, holder, scaledCfg) }));
    finalHtml = (cfg.formulePreamble || '') + fixedBlocks.map(b=>b.html).join('');
    finalScale = 0.34;
  }

  document.body.removeChild(holder);
  return { pages: [{ html: finalHtml, spaceScale: finalScale, tabLabel: 'formule' }], css: finalCss };
}

function buildInstaPages(cfg, ratio){
  ratio = ratio || INSTA_RATIO;
  const { contentBlocks } = buildPdfBlocks(cfg);
  const groups = [];
  let current = null;
  contentBlocks.forEach(b=>{
    if(b.html.includes('class="pdf-cat"')){ current = []; groups.push(current); }
    if(current) current.push(b);
  });

  const css = buildInstaCSS(cfg, ratio);
  const pageH = Math.round(INSTA_RENDER_W*ratio);
  const holder = document.createElement('div');
  holder.style.cssText = 'position:fixed;left:-99999px;top:0;visibility:hidden;';
  holder.innerHTML = `<style>${css}</style><div class="pdf-page" id="__instaMeasure" style="height:auto;overflow:visible"></div>`;
  document.body.appendChild(holder);
  const measureEl = holder.querySelector('#__instaMeasure');
  const heightOf = (html, scale) => {
    measureEl.style.setProperty('--space-scale', scale ?? 1);
    measureEl.innerHTML = html;
    return measureEl.offsetHeight;
  };

  const COMPRESS_STEPS = [1, 0.94, 0.88, 0.82, 0.76, 0.7];
  const bestScaleFor = html => {
    for(const s of COMPRESS_STEPS){
      if(heightOf(html, s) <= pageH) return s;
    }
    return null; // ne rentre même pas compressé au maximum
  };
  // Répartition la plus équilibrée possible de `n` éléments en `parts`
  // groupes — ex. n=5, parts=2 → [3,2], jamais [4,1]. Règle absolue
  // demandée par Will pour la répartition sur plusieurs images.
  const balancedSplit = (n, parts) => {
    const base = Math.floor(n/parts), rem = n % parts;
    return Array.from({length:parts}, (_, i) => base + (i < rem ? 1 : 0));
  };

  const result = [];
  groups.forEach((group, groupIdx)=>{
    const preamble = groupIdx === 0 ? (cfg.formulePreamble || '') : '';
    const tabIdMatch = group[0].html.match(/data-tab-id="([^"]+)"/);
    const tabId = tabIdMatch ? tabIdMatch[1] : null;
    const tb = tabId ? (cfg.tabsSource || DATA.tabs).find(x=>x.id===tabId) : null;
    const tabLabel = tb ? t(tb.label) : null;
    const headerMatch = group[0].html.match(/^<h2 class="pdf-cat"[\s\S]*?<\/h2>/);
    const headerHtml = headerMatch ? headerMatch[0] : '';

    // Boissons exclues par défaut sur Instagram (Will ne fait que des
    // restaurants) — case à cocher par catégorie pour les inclure
    // explicitement (tb.instaIncludeBevs). Si toute la catégorie est
    // composée de boissons et n'est pas cochée, aucune image générée
    // pour elle.
    const filtered = (tb && tb.instaIncludeBevs) ? group : group.filter(b=>b.cardType!=='bevs');
    if(!filtered.length) return;

    // Taille de police "une seule ligne" fixée indépendamment sur
    // chaque bloc, avant toute décision de découpage — voir
    // fitInstaOneLiners. Si le tout premier bloc restant après le
    // filtrage boissons n'a plus le titre de catégorie (parce que le
    // vrai premier bloc d'origine a été filtré), on le réinjecte.
    const fixedBlocks = filtered.map(b=>({ ...b, html: fitInstaOneLiners(b.html, holder, cfg) }));
    if(!fixedBlocks[0].html.includes('class="pdf-cat"')){
      fixedBlocks[0] = { ...fixedBlocks[0], html: headerHtml + fixedBlocks[0].html };
    }

    // Le préambule (titre + texte libre d'une formule) compte dans le
    // calcul "tout tenir sur une page", comme le reste — jamais ajouté
    // après coup sans vérifier qu'il rentre.
    const wholeHtml = preamble + fixedBlocks.map(b=>b.html).join('');
    const wholeScale = bestScaleFor(wholeHtml);
    if(wholeScale !== null){
      result.push({ html: wholeHtml, spaceScale: wholeScale, tabId, tabLabel });
      return;
    }

    // Ne rentre pas en une seule image, même compressée à -30% —
    // règle absolue de Will : répartir sur autant de pages que
    // nécessaire, en équilibrant le NOMBRE de plats aussi près que
    // possible entre elles (jamais 4 et 1 quand 3 et 2 est possible),
    // jamais en coupant un plat au milieu. Le titre de catégorie n'est
    // PAS répété sur les pages suivantes — demande explicite de Will :
    // c'est la suite du même menu, pas une nouvelle catégorie.
    const n = fixedBlocks.length;
    let placed = false;
    for(let parts=2; parts<=n && !placed; parts++){
      const sizes = balancedSplit(n, parts);
      const pages = [];
      let idx = 0, allFit = true, sliceI = 0;
      for(const size of sizes){
        const slice = fixedBlocks.slice(idx, idx+size);
        idx += size;
        const sliceHtml = (sliceI===0 ? preamble : '') + slice.map(b=>b.html).join('');
        sliceI++;
        const scale = bestScaleFor(sliceHtml);
        if(scale === null){ allFit = false; break; }
        pages.push({ html: sliceHtml, spaceScale: scale, tabId, tabLabel });
      }
      if(allFit){ result.push(...pages); placed = true; }
    }
    if(!placed){
      // Dernier recours extrême (même 1 plat par page ne rentrerait
      // pas) : une seule image, compressée au maximum, plutôt que de
      // ne rien produire.
      result.push({ html: wholeHtml, spaceScale: COMPRESS_STEPS[COMPRESS_STEPS.length-1], tabId, tabLabel });
    }
  });

  document.body.removeChild(holder);
  return result;
}


// CSS for a given config + format
function buildPdfCSS(cfg){
  const isGbiz = cfg.format === 'gbiz';
  const isA5 = !isGbiz && cfg.paperSize === 'a5';
  // True A4/A5 physical page size at 96dpi (210×297mm / 148×210mm).
  // @page margin is 0 below — the PDF itself must be genuinely
  // edge-to-edge (background/frame reach the true page border), no
  // browser-added margin; the only inset left is our own deliberate
  // `pad`, a design choice rather than a print-driver default. A5's
  // own true dimensions (559×794px) sit at ~0.70-0.72 of A4's, which is
  // why the existing 0.72 scale (already used for every font-size/
  // spacing below) stays a good approximation rather than needing a
  // second, separately-tuned set of numbers.
  const A5_SCALE = 0.72;
  const scale = isGbiz ? 1 : (isA5 ? A5_SCALE : 1);
  const px = v => Math.round(v*scale*100)/100;
  const pageW = isGbiz ? 612 : (isA5 ? Math.round(794*A5_SCALE) : 794);
  // Must match paginatePdfPages()'s fullPageHeightPx exactly — both need
  // the SAME physical page height, one to size the box, the other to
  // budget how much content fits in it.
  const pageH = isGbiz ? null : (isA5 ? 794 : 1123);
  const pad = isGbiz ? 45 : px(30);
  const maritime = cfg.template === 'maritime';
  return `
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Open+Sans:wght@300;400;600&family=Playfair+Display:wght@400;600&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{margin:0;padding:0;background:${cfg.bgColor||'#FFFDF8'}}
  /* BUG FIX: without this, browsers print backgrounds/colors differently
     from what's shown on screen by default (usually to save ink) — this
     is exactly what made the live preview and the actual printed/PDF
     output look different (background color, accent yellow, etc.). This
     forces the print output to reproduce colors exactly as configured,
     so the two always match — one standard recipe, no per-client tweaking. */
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important}
  .pdf-page{--space-scale:1;--top-pad-trim:0px;--solo-scale:.92;font-family:'Open Sans',sans-serif;color:#1a1a1a;background:${cfg.bgColor||'#FFFDF8'};width:${pageW}px;${pageH?`min-height:${pageH}px;`:''}padding-top:calc(${pad}px - var(--top-pad-trim));padding-right:${pad}px;padding-bottom:${pad}px;padding-left:${pad}px;margin:0 auto;position:relative}
  ${cfg.showFrame!==false?`.pdf-page::before{content:'';position:absolute;inset:${px(14)}px;border:1.5px solid ${cfg.accentColor};opacity:.4;pointer-events:none}`:''}
  .pdf-header{text-align:center;margin-bottom:calc(${isGbiz?18:px(33)}px * var(--space-scale));position:relative}
  .pdf-logo-text{font-family:'Cormorant Garamond',serif;font-size:${isGbiz?24.86:px(22)}px;font-weight:700;color:var(--navy,#10285E);margin:0 auto 12px;display:block;text-align:center}
.pdf-logo{max-width:${isGbiz?100:px(180)}px;max-height:${isGbiz?70:px(120)}px;object-fit:contain;margin:0 auto 8px;display:block}
  .pdf-title{font-family:'Cormorant Garamond',serif;font-size:${isGbiz?49.72:px(32)}px;font-weight:700;color:${cfg.titleColor};line-height:1.1}
  .pdf-sub{font-size:${isGbiz?14.69:px(11)}px;letter-spacing:.16em;text-transform:uppercase;color:#999;margin-top:6px}
  .pdf-section{margin-bottom:calc(${isGbiz?100:px(52)}px * var(--space-scale));break-inside:avoid;page-break-inside:avoid}
  .pdf-cat{font-family:'Playfair Display',serif;font-size:${isGbiz?29.38:px(20)}px;font-weight:600;color:${cfg.titleColor};margin:calc(${isGbiz?14:px(20)}px * var(--space-scale)) 0 calc(${isGbiz?16:px(12)}px * var(--space-scale));padding-bottom:6px;border-bottom:1.5px solid ${maritime?cfg.accentColor:'#e2e2e2'};display:flex;align-items:center;gap:10px}
  .pdf-subcat{font-size:${isGbiz?14.69:px(11)}px;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:${cfg.accentColor};margin:calc(${isGbiz?18:px(14)}px * var(--space-scale)) 0 calc(${isGbiz?10:px(8)}px * var(--space-scale))}
  .pdf-dish{margin-bottom:calc(${isGbiz?13:px(10)}px * var(--space-scale));break-inside:avoid;page-break-inside:avoid}
  .pdf-dish-line{display:flex;align-items:baseline;gap:6px}
  .pdf-dish-name{font-size:${isGbiz?18.08:px(13)}px;font-weight:600;white-space:nowrap;color:#1D1D1F}
  .pdf-dots{flex:1;border-bottom:1px dotted #ccc;transform:translateY(-3px);min-width:18px}
  .pdf-dots-off{flex:1;min-width:18px}
  .pdf-dish-price{font-size:${isGbiz?18.08:px(13)}px;font-weight:600;color:${cfg.accentColor};white-space:nowrap;flex:none}
  .pdf-dish-desc{font-size:${isGbiz?13.56:px(10.5)}px;font-weight:400;color:#6E6E73;margin-top:2px;line-height:1.4;max-width:88%;text-align:left}
  /* Catégorie solo (un seul plat) — resserre le plat, jamais .pdf-cat */
  .pdf-dish.pdf-dish-solo{margin-bottom:calc(${isGbiz?13:px(10)}px * var(--space-scale) * var(--solo-scale))}
  .pdf-dish.pdf-dish-solo .pdf-dish-name,.pdf-dish.pdf-dish-solo .pdf-dish-price{font-size:calc(${isGbiz?18.08:px(13)}px * var(--solo-scale))}
  .pdf-dish.pdf-dish-solo .pdf-dish-desc{font-size:calc(${isGbiz?13.56:px(10.5)}px * var(--solo-scale))}
  .pdf-footer{margin-top:${isGbiz?44:px(30)}px;padding-top:${isGbiz?20:px(14)}px;border-top:1px solid ${maritime?cfg.accentColor:'#e2e2e2'};text-align:center}
  .pdf-footer-text{font-size:${isGbiz?13.56:px(10)}px;color:#999;letter-spacing:.04em;line-height:1.6}
  @media print{
    html,body{margin:0!important;padding:0!important;background:${cfg.bgColor||'#FFFDF8'}!important}
    @page{size:${isA5?'A5':'A4'};margin:0}
  }`;
}

// Live preview into the admin iframe
function updatePdfPreview(){
  const frame = document.getElementById('pdfPreviewFrame');
  if(!frame) return;
  const cfg = pdfCfg();
  const isGbiz = cfg.format === 'gbiz';
  // The live preview always renders at A5 proportions regardless of the
  // real paperSize setting — A4 in this narrow admin panel ends up so
  // zoomed out it barely reads as a page. A4 and A5 share the exact
  // same width:height ratio (ISO 216), so this is purely cosmetic here;
  // the real export (exportA4Print) still uses the actual cfg.paperSize.
  const previewCfg = isGbiz ? cfg : { ...cfg, paperSize: 'a5' };
  const css = buildPdfCSS(previewCfg);
  const menu = buildPdfMenuHTML(previewCfg);
  const isA5 = !isGbiz; // preview is always A5-shaped unless it's the gbiz image format
  const previewMaxW = isGbiz ? 612 : Math.round(794*0.72);
  // For A4: overlay page-break guides every ~1040px (A4 ratio at 700px width)
  const doc = `<!DOCTYPE html><html><head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans+Condensed:wght@300;700&family=Lovelo:wght@400;700&family=Open+Sans:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet"><meta charset="UTF-8"><style>${css}
    html,body{overflow-x:hidden}
    body{background:#e8e8e8;padding:16px 0;margin:0}
    /* Preview-only: shrink the page to fit whatever width the iframe
       actually has instead of the fixed print width — real size shows
       up when they hit "Imprimer le menu". Font sizes stay in real px
       (not %), so at small widths text can look tiny; that's expected,
       it's a layout preview, not a legibility test. */
    .pdf-page{width:100%!important;max-width:${previewMaxW}px;box-shadow:0 2px 12px rgba(0,0,0,.15)}
    ${!isGbiz?`.pdf-page{position:relative}`:''}
  </style></head><body><div class="pdf-page" id="pdfPageEl">${menu}</div>
  <script>
    // Draw page-break guide lines for A4 so user sees where pages cut
    (function(){
      var isGbiz=${isGbiz};
      if(isGbiz) return;
      var page=document.getElementById('pdfPageEl');
      var w=page.offsetWidth;
      var pageH=Math.round(w*297/210); // A4 ratio
      var total=page.offsetHeight;
      var n=Math.floor(total/pageH);
      for(var i=1;i<=n;i++){
        var line=document.createElement('div');
        line.style.cssText='position:absolute;left:0;right:0;top:'+(i*pageH)+'px;border-top:2px dashed #d33;z-index:99;pointer-events:none';
        var lbl=document.createElement('div');
        lbl.textContent='— coupure page '+(i+1)+' —';
        lbl.style.cssText='position:absolute;right:6px;top:'+(i*pageH+2)+'px;font:10px sans-serif;color:#d33;background:#fff;padding:1px 5px;z-index:100';
        page.appendChild(line);page.appendChild(lbl);
      }
    })();
  <\/script>
  </body></html>`;
  frame.srcdoc = doc;
}

// Export: A4 → print dialog; Google Business → PNG via html2canvas at 3064x5447

function doPdfExport(){
  const cfg = pdfCfg();
  if(cfg.format === 'gbiz'){
    exportGbizImage(cfg);
  } else {
    exportA4Print(cfg);
  }
}

function exportA4Print(cfg){
  const css = buildPdfCSS(cfg);
  const pages = paginatePdfPages(cfg);
  const restName = getRestaurantName() || 'Menu';
  const pagesHtml = pages.map((page, i)=>{
    const breakStyle = i<pages.length-1 ? 'page-break-after:always;break-after:page;' : '';
    const scaleStyle = page.spaceScale && page.spaceScale!==1 ? `--space-scale:${page.spaceScale};` : '';
    // Continuation pages (no header) sat with the same top padding as
    // page 1, but without the header there to justify that much air —
    // the first category on those pages read as starting too low.
    const topTrimStyle = i>0 ? `--top-pad-trim:5px;` : '';
    return `<div class="pdf-page" style="${breakStyle}${scaleStyle}${topTrimStyle}">${page.html}</div>`;
  }).join('');
  const doc = `<!DOCTYPE html><html><head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans+Condensed:wght@300;700&family=Lovelo:wght@400;700&family=Open+Sans:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet"><meta charset="UTF-8"><title>${restName}</title><style>${css}</style></head><body>${pagesHtml}</body></html>`;
  // BUG FIX: this used to open a blank window and fill it via
  // document.write() — increasingly restricted by modern browsers
  // (Safari in particular), which can silently leave the new tab blank
  // or refuse the popup outright. A Blob URL opened directly gives the
  // new tab a real, complete document from the start — no write-after-
  // open step for the browser to interfere with.
  const blob = new Blob([doc], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const win = window.open(url, '_blank');
  if(!win){ showToast('⚠️ Le navigateur a bloqué la fenêtre — autorise les pop-ups pour ce site'); return; }
  // BUG FIX (iPhone) : la fenêtre pouvait s'ouvrir et afficher le menu
  // sans jamais déclencher win.print() — soit parce que win.document.
  // fonts.ready ne se résout pas de façon fiable dans cette fenêtre
  // séparée sur iOS, soit parce que l'évènement 'load' ne se déclenche
  // pas toujours sur une URL blob: là-bas. Deux filets de sécurité
  // ajoutés : un délai maximum sur l'attente des polices, et un appel
  // de secours si rien n'a encore imprimé après quelques secondes —
  // print() finit donc toujours par être appelé, même si l'un des
  // signaux attendus ne vient jamais.
  let printed = false;
  const doPrint = () => {
    if(printed) return;
    printed = true;
    try{ win.print(); }catch(e){ console.error(e); }
    URL.revokeObjectURL(url);
  };
  const waitThenPrint = () => {
    const ready = win.document && win.document.fonts && win.document.fonts.ready
      ? win.document.fonts.ready
      : Promise.resolve();
    Promise.race([ ready, new Promise(res=>setTimeout(res, 3000)) ]).then(()=>{
      setTimeout(doPrint, 100);
    });
  };
  if(win.document && win.document.readyState === 'complete') waitThenPrint();
  else win.addEventListener('load', waitThenPrint);
  setTimeout(()=>{ if(!printed) doPrint(); }, 4500);
}

// Découpe le contenu en plusieurs images de mêmes proportions que le
// format Google Business déjà validé par Will (ratio hauteur/largeur
// ≈1.886, mesuré sur son propre export testé). Même logique que la
// pagination PDF : on essaie de garder chaque catégorie entière sur une
// image, on la fait juste commencer sur la suivante si elle ne rentre
// pas dans ce qui reste — et seulement si une catégorie est trop
// grande pour tenir seule sur une image entière, on la découpe plat
// par plat en dernier recours (jamais un plat coupé en deux).
// Ratio mesuré sur le format Doma (référence de Will) — 1.663 au lieu
// de l'ancien 1.8863 : un cadre plus compact, moins susceptible d'être
// rogné à l'affichage sur des écrans plus petits.
const GBIZ_PAGE_RATIO = 1.663; // height / width
// Instagram Story — vraie proportion 9:16 (1080×1920 à l'export final).
const INSTA_RATIO = 16/9; // height / width
// Instagram Post — format 3:4 (1080×1440 à l'export final), demandé
// par Will à la place du 4:5 initial. Même largeur que la story, juste
// une page moins haute — aucune nouvelle règle : mêmes plafonds une
// seule ligne, même découpage équilibré multi-pages, juste plus
// susceptible de se déclencher puisqu'il y a moins de hauteur
// disponible.
const INSTA_POST_RATIO = 4/3; // height / width — 1080×1440
// "Menus et Formules" — format A4, mais avec l'habillage visuel
// d'Instagram (centré, épuré) plutôt que celui de l'impression
// classique du menu complet, jugé plus agréable pour un menu/formule
// autonome. Même moteur (compression + découpage équilibré multi-
// pages en dernier recours), juste une proportion A4 (210×297mm).
const INSTA_A4_RATIO = 1123/794; // height / width
// 20 polices Google Fonts parmi les plus populaires ET les plus
// lisibles pour un menu — mélange de serif élégantes (registre menu
// classique) et de sans-serif nettes (lisibilité). Demande explicite
// de Will : propre à Instagram uniquement, une seule police pour tout
// le visuel (titre, plat, prix, description).
const INSTA_FONT_OPTIONS = [
  'Playfair Display','Cormorant Garamond','Merriweather','Lora','EB Garamond',
  'Libre Baskerville','Crimson Text','Cardo','Cinzel','Marcellus',
  'Prata','DM Serif Display','Abril Fatface','Bodoni Moda','Josefin Sans',
  'Montserrat','Raleway','Poppins','Quicksand','Nunito'
];
const INSTA_RENDER_W = 608;
// BUG FIX: le site applique un zoom CSS de 1.1x sur desktop (à partir
// de 641px de large), mais PAS en dessous de cette largeur — annuler
// systématiquement un zoom de 1.1 (comme fait dans un premier temps)
// est donc faux dès que la fenêtre est plus étroite : ça introduit
// alors le décalage inverse. On mesure ici le zoom RÉELLEMENT actif au
// moment de l'appel, plutôt que de le supposer fixe, pour que la
// correction reste juste quelle que soit la largeur de la fenêtre.
function getActiveZoomRatio(){
  const probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;left:-99999px;top:0;width:1000px;height:10px;visibility:hidden';
  document.body.appendChild(probe);
  const ratio = probe.getBoundingClientRect().width / 1000;
  document.body.removeChild(probe);
  return ratio || 1;
}
function paginateGbizPages(cfg){
  // 612px = la largeur pour laquelle les tailles de police du format
  // Google Business sont déjà calibrées (buildPdfCSS's pageW pour
  // isGbiz) — mesurer à une autre largeur fausserait les proportions
  // texte/page.
  const RENDER_W = 612;
  // Petite marge de sécurité : la capture finale utilise maintenant une
  // hauteur stricte (overflow:hidden côté source), donc mieux vaut
  // viser légèrement en dessous du maximum théorique plutôt que de
  // risquer de rogner un plat au pixel près.
  const maxPageHeightPx = Math.floor(RENDER_W * GBIZ_PAGE_RATIO * 0.97);

  const { headerHtml, contentBlocks, footerHtml } = buildPdfBlocks(cfg);

  const holder = document.createElement('div');
  // BUG FIX: le zoom actif (1.1x ou 1x selon la largeur de fenêtre) est
  // maintenant mesuré dynamiquement plutôt que supposé fixe — voir
  // getActiveZoomRatio() ci-dessus.
  const zoomCancel = 1 / getActiveZoomRatio();
  holder.style.cssText = `position:fixed;left:-99999px;top:0;visibility:hidden;width:${RENDER_W}px;zoom:${zoomCancel}`;
  holder.innerHTML = `<style>${buildPdfCSS(cfg)}</style><div class="pdf-page" id="__gbizMeasure" style="height:auto;min-height:0;width:${RENDER_W}px"></div>`;
  document.body.appendChild(holder);
  const measureEl = holder.querySelector('#__gbizMeasure');
  const heightOf = html => { measureEl.innerHTML = html; return measureEl.offsetHeight; };

  // Regroupe les blocs plat-par-plat en paquets par catégorie (chaque
  // <h2 class="pdf-cat"> marque le début d'une nouvelle catégorie).
  const groups = [];
  contentBlocks.forEach(b=>{
    if(b.html.includes('class="pdf-cat"') || groups.length===0) groups.push([b]);
    else groups[groups.length-1].push(b);
  });

  // Pas de plafond de catégories par page — on remplit selon la place
  // réellement disponible (2 ou 3 catégories, selon ce qui tient),
  // pour éviter à la fois le débordement ET une page qui reste à
  // moitié vide alors qu'une catégorie de plus aurait tenu.
  const pages = []; // { html, spaceScale }
  const pullFailures = []; // tabIds où "rejoindre la précédente" a été demandé mais n'a pas pu aboutir
  let current = headerHtml;
  let currentScale = 1;
  // Tente les mêmes blocs à une échelle d'espacement réduite (jamais le
  // texte) pour voir s'ils rentrent quand même — utilisé uniquement
  // pour "rejoindre la page précédente", jamais imposé par défaut.
  const heightOfScaled = (html, scale) => {
    measureEl.style.setProperty('--space-scale', String(scale));
    measureEl.innerHTML = html;
    const h = measureEl.offsetHeight;
    measureEl.style.setProperty('--space-scale', '1');
    return h;
  };
  const COMPRESS_STEPS = [1, 0.97, 0.94, 0.91, 0.88, 0.85, 0.82]; // jusqu'à 18% maintenant
  groups.forEach(group=>{
    const groupHtml = group.map(b=>b.html).join('');
    const tb = group[0] && group[0].tabId ? DATA.tabs.find(x=>x.id===group[0].tabId) : null;
    const candidate = current + groupHtml;
    // "Saut de page par catégorie" — même mécanique que le PDF : on
    // force une page fraîche pour cette catégorie, sauf si on est déjà
    // en tout début de page (rien à gagner à forcer un saut inutile).
    const mustBreak = group[0] && group[0].forceBreak && current !== '';

    let combined = false;
    if(!mustBreak && heightOf(candidate) <= maxPageHeightPx){
      current = candidate; combined = true;
    } else if(!mustBreak && current !== ''){
      // Par défaut (plus besoin de cocher "Rejoindre la page
      // précédente") : avant de sauter à une page neuve, on tente de
      // compresser l'espacement de tout ce qui est déjà sur la page
      // (jusqu'à -18%, jamais le texte) pour voir si cette catégorie
      // peut quand même s'ajouter à la suite — remplir chaque page tant
      // que c'est possible plutôt que d'en laisser une à moitié vide
      // alors que la suivante aurait tenu (ex. "Huîtres" seule sur la
      // page 1 alors que "Terre & mer" aurait pu suivre directement).
      let fitScale = null;
      for(const s of COMPRESS_STEPS){
        if(heightOfScaled(candidate, s) <= maxPageHeightPx){ fitScale = s; break; }
      }
      if(fitScale !== null){
        current = candidate; currentScale = fitScale; combined = true;
      } else if(tb && tb.gbizPullPrevious){
        // Cette catégorie demandait explicitement à rejoindre la page
        // précédente et même la compression max n'y suffit pas — on le
        // signale (pullFailures) plutôt que d'imposer un rendu abîmé.
        pullFailures.push(tb.id);
      }
    }
    if(combined) return;

    if(heightOf(groupHtml) <= maxPageHeightPx){
      // La catégorie entière rentre sur une page fraîche.
      pages.push({ html: current, spaceScale: currentScale });
      current = groupHtml; currentScale = 1;
    } else {
      // La catégorie ne rentre pas seule à taille normale — avant de la
      // découper plat par plat (ce qui peut laisser un plat orphelin
      // tout seul sur sa page, ex. "Caviar de nori"), on tente le même
      // espacement compressé (jusqu'à -18%, jamais le texte) déjà
      // utilisé ci-dessus : souvent le dépassement ne représente que
      // quelques %, largement dans la marge de compression, alors
      // qu'une catégorie resserrée tient très bien en entier sur une
      // seule image.
      let fitScale = null;
      for(const s of COMPRESS_STEPS){
        if(heightOfScaled(groupHtml, s) <= maxPageHeightPx){ fitScale = s; break; }
      }
      if(fitScale !== null){
        pages.push({ html: current, spaceScale: currentScale });
        current = groupHtml; currentScale = fitScale;
      } else {
        // Même compressée à -18%, la catégorie est trop grande —
        // dernier recours : on la découpe plat par plat (jamais un plat
        // coupé en deux).
        if(current){ pages.push({ html: current, spaceScale: currentScale }); current=''; currentScale=1; }
        let sub='';
        group.forEach(b=>{
          const cand2 = sub + b.html;
          if(heightOf(cand2) <= maxPageHeightPx){ sub = cand2; }
          else { if(sub) pages.push({ html: sub, spaceScale: 1 }); sub = b.html; }
        });
        current = sub;
      }
    }
  });
  if(footerHtml){
    const withFooter = current + footerHtml;
    if(heightOf(withFooter) <= maxPageHeightPx){ current = withFooter; }
    else { pages.push({ html: current, spaceScale: currentScale }); current = footerHtml; currentScale = 1; }
  }
  if(current) pages.push({ html: current, spaceScale: currentScale });

  document.body.removeChild(holder);
  // Plus besoin d'espaceur artificiel : sans aucun en-tête nulle part
  // (voir buildPdfBlocks), chaque page démarre déjà au même niveau
  // naturellement — alignement "gratuit", pas de bricolage nécessaire.
  return { pages, pullFailures };
}

// Détection mobile simple (pour proposer un téléchargement page par page
// en plus du bouton "Générer toutes les images" — voir plus bas) : sur
// desktop, le bouton existant fonctionne déjà bien tel quel, donc pas
// besoin d'alourdir cette UI là où ce n'est pas nécessaire.
function isMobileDevice(){
  return /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent || '');
}

// Rendu d'UNE page Google Business en Blob PNG — logique extraite
// d'exportGbizImage pour être réutilisée aussi par le téléchargement
// page par page (mobile). Lève une erreur si ça échoue (à charge de
// l'appelant de l'attraper).
async function renderGbizPageToBlob(css, pages, i, restName, bg){
  const RENDER_W = 612; // doit rester identique à paginateGbizPages
  const TARGET_W = 1080;
  const scale = TARGET_W / RENDER_W;
  const holder = document.createElement('div');
  const pageHeightPx = Math.floor(RENDER_W*GBIZ_PAGE_RATIO);
  // BUG FIX: le vrai coupable de l'écart entre les mots était
  // html2canvas lui-même — son moteur de texte "maison" (par
  // opposition au vrai moteur du navigateur) accumule des écarts
  // d'arrondi entre les mots quel que soit le réglage tenté
  // (police bien chargée localement ou non, letterRendering activé
  // ou non, scale entier ou non — testé et confirmé un par un).
  // La vraie solution : foreignObjectRendering, qui délègue le texte
  // au moteur natif du navigateur plutôt qu'à l'approximation
  // d'html2canvas. Cette option avait déjà été essayée mais donnait
  // des pages blanches — uniquement parce que l'élément était placé
  // très loin hors écran (left:-99999px), ce que foreignObjectRendering
  // gère mal. En le gardant DANS l'écran (juste rendu invisible par
  // une opacité quasi nulle plutôt que par un déplacement), ça
  // fonctionne parfaitement : plus de pages blanches, plus d'écart.
  // BUG FIX: la correction de zoom fixe (1.1x) était fausse dès que
  // la fenêtre est plus étroite que 641px (le zoom du site ne
  // s'active qu'à partir de cette largeur) — mesurée dynamiquement
  // maintenant via getActiveZoomRatio(), plutôt que supposée.
  const zoomCancel = 1 / getActiveZoomRatio();
  holder.style.cssText = `position:fixed;left:0;top:0;width:${RENDER_W}px;height:${pageHeightPx}px;opacity:0.001;pointer-events:none;z-index:-1;zoom:${zoomCancel}`;
  const scaleStyle = pages[i].spaceScale && pages[i].spaceScale!==1 ? `--space-scale:${pages[i].spaceScale};` : '';
  holder.innerHTML = `<style>${css}</style><div class="pdf-page" id="gbizPage${i}" style="width:${RENDER_W}px;height:${pageHeightPx}px;overflow:hidden;${scaleStyle}">${pages[i].html}</div>`;
  document.body.appendChild(holder);
  const pageEl = holder.querySelector(`#gbizPage${i}`);
  try{
    await document.fonts.ready;
    await new Promise(r=>setTimeout(r,150));
    // BUG FIX (mobile bloqué) : foreignObjectRendering:true (choisi
    // pour corriger l'écart entre les mots — voir plus haut) a un
    // support très inégal sur Safari/WebKit mobile : il peut rester
    // bloqué indéfiniment sans jamais réussir ni lever d'erreur,
    // laissant "Génération en cours…" affiché pour rien — aucun
    // try/catch ne peut rattraper une promesse qui ne se résout
    // jamais. On l'entoure d'un délai de sécurité et, s'il n'a pas
    // répondu à temps ou s'il échoue, on retente la même page sans
    // foreignObjectRendering (léger écart entre mots possible en
    // secours, mais au moins une image est produite). Délai remonté
    // à 20s (au lieu de 8s) : un mobile est plus lent qu'un
    // ordinateur, et les pages sont maintenant plus denses (fusion +
    // compression) — un rendu simplement lent ne doit pas être pris
    // pour un vrai blocage et abandonné trop tôt.
    const withTimeout = (p, ms) => Promise.race([
      p,
      new Promise((_,rej)=>setTimeout(()=>rej(new Error('html2canvas timeout')), ms))
    ]);
    let canvas;
    try{
      canvas = await withTimeout(html2canvas(pageEl, { scale, useCORS:true, backgroundColor:bg, logging:false, foreignObjectRendering:true }), 20000);
    } catch(errFo){
      console.error('foreignObjectRendering a échoué ou expiré, repli sans lui :', errFo);
      canvas = await withTimeout(html2canvas(pageEl, { scale, useCORS:true, backgroundColor:bg, logging:false, foreignObjectRendering:false }), 20000);
    }
    const suffix = pages.length>1 ? `-${i+1}` : '';
    const blob = await new Promise(res=>canvas.toBlob(res,'image/png'));
    if(!blob) throw new Error('toBlob a renvoyé null');
    return { blob, name: `${restName}-google-business${suffix}.png`, pageIndex: i };
  } finally {
    document.body.removeChild(holder);
  }
}

// Instagram : même moteur robuste que Google Business (délai de
// sécurité + repli sans foreignObjectRendering), mais dimensions et
// police propres au format story (voir buildInstaCSS/buildInstaPages).
async function renderInstaPageToBlob(css, pages, i, restName, bg, ratio, variantLabel, targetW){
  ratio = ratio || INSTA_RATIO;
  const TARGET_W = targetW || 1080;
  const scale = TARGET_W / INSTA_RENDER_W;
  const holder = document.createElement('div');
  const pageHeightPx = Math.round(INSTA_RENDER_W*ratio);
  const zoomCancel = 1 / getActiveZoomRatio();
  holder.style.cssText = `position:fixed;left:0;top:0;width:${INSTA_RENDER_W}px;height:${pageHeightPx}px;opacity:0.001;pointer-events:none;z-index:-1;zoom:${zoomCancel}`;
  const scaleStyle = pages[i].spaceScale && pages[i].spaceScale!==1 ? `--space-scale:${pages[i].spaceScale};` : '';
  holder.innerHTML = `<style>${css}</style><div class="pdf-page" id="instaPage${i}" style="width:${INSTA_RENDER_W}px;height:${pageHeightPx}px;overflow:hidden;${scaleStyle}">${pages[i].html}</div>`;
  document.body.appendChild(holder);
  const pageEl = holder.querySelector(`#instaPage${i}`);
  try{
    await document.fonts.ready;
    await new Promise(r=>setTimeout(r,150));
    const withTimeout = (p, ms) => Promise.race([
      p,
      new Promise((_,rej)=>setTimeout(()=>rej(new Error('html2canvas timeout')), ms))
    ]);
    // BUG FIX (contenu décalé/manquant en haut) : la pagination
    // elle-même est vérifiée correcte (testé : chaque page démarre
    // bien sur une frontière de plat entière, jamais coupée) — le
    // problème vient de la capture foreignObjectRendering:true elle-
    // même sur ce format (page haute, mise à l'échelle ~1.78x) : elle
    // ne lève aucune erreur mais capture une zone décalée par rapport
    // au vrai contenu de la page, engendrant exactement ce
    // "contenu manquant en haut + grand vide en bas". On saute donc
    // directement au mode sans foreignObjectRendering pour Instagram,
    // qui capture la bonne zone (léger écart entre mots possible en
    // échange, largement préférable à du contenu manquant).
    let canvas = await withTimeout(html2canvas(pageEl, { scale, useCORS:true, backgroundColor:bg, logging:false, foreignObjectRendering:false }), 20000);
    const slug = (pages[i].tabLabel || `image-${i+1}`).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
    const blob = await new Promise(res=>canvas.toBlob(res,'image/png'));
    if(!blob) throw new Error('toBlob a renvoyé null');
    return { blob, name: `${restName}-instagram-${variantLabel||'story'}-${slug||i+1}.png`, pageIndex: i };
  } finally {
    document.body.removeChild(holder);
  }
}

// variant: 'story' (9:16, par défaut), 'post' (4:5), ou 'a4' (menus et
// formules — même moteur, juste une hauteur de page différente ;
// aucune nouvelle règle (rétrécissement une ligne, découpage équilibré
// multi-pages, compression d'espacement) n'est dupliquée, tout
// continue de s'appliquer tel quel avec ce nouveau ratio.
async function exportInstaImages(cfg, variant){
  variant = variant || 'story';
  const ratio = variant === 'post' ? INSTA_POST_RATIO : variant === 'a4' ? INSTA_A4_RATIO : INSTA_RATIO;
  const targetW = variant === 'a4' ? 1600 : 1080; // A4 : un peu plus de résolution pour l'impression
  if(typeof html2canvas === 'undefined'){ showToast('⚠ html2canvas non chargé'); return; }
  showToast('Génération des images en cours…');
  // Menus et Formules (cfg.tabsSource) : toujours une seule page,
  // jamais le découpage multi-pages du vrai menu — voir
  // buildFormulePage.
  let css, pages;
  if(cfg.tabsSource){
    const built = buildFormulePage(cfg, ratio);
    css = built.css; pages = built.pages;
  } else {
    css = buildInstaCSS(cfg, ratio);
    pages = buildInstaPages(cfg, ratio);
  }
  const restName = (getRestaurantName()||'menu').replace(/\s+/g,'-').toLowerCase();
  const bg = cfg.instaBgColor || cfg.bgColor || '#FDFBF6';

  const blobs = [];
  for(let i=0;i<pages.length;i++){
    try{
      const result = await renderInstaPageToBlob(css, pages, i, restName, bg, ratio, variant, targetW);
      blobs.push(result);
    } catch(err){
      console.error(err);
      showToast('⚠ Erreur génération image '+(i+1));
    }
  }

  if(!blobs.length) return;

  const urls = blobs.map(b=>({ url: URL.createObjectURL(b.blob), name: b.name, pageIndex: b.pageIndex, totalPages: pages.length }));

  try{
    urls.forEach(({url,name})=>{
      const link = document.createElement('a');
      link.download = name;
      link.href = url;
      link.click();
    });
  } catch(err){ console.error(err); }

  // La galerie de secours n'a de sens que sur mobile (où le
  // téléchargement JS est peu fiable) — sur desktop, le lien de
  // téléchargement ci-dessus suffit déjà, ce popup n'apportait rien
  // et gênait inutilement (demande explicite de Will).
  if(isMobileDevice()){
    try{ showGbizResultGallery(urls); } catch(err){ console.error(err); }
  }
}

async function exportGbizImage(cfg){
  if(typeof html2canvas === 'undefined'){ showToast('⚠ html2canvas non chargé'); return; }
  showToast('Génération des images en cours…');
  const css = buildPdfCSS(cfg);
  const { pages } = paginateGbizPages(cfg);
  const restName = (getRestaurantName()||'menu').replace(/\s+/g,'-').toLowerCase();
  const bg = cfg.bgColor || '#FDFBF6';

  // BUG FIX (mobile) : la méthode <a download> + toDataURL() ne
  // télécharge rien sur mobile (Safari iOS ignore l'attribut "download"
  // sur les URLs data:, et un lien cliqué après plusieurs "await" perd
  // son statut de geste utilisateur "de confiance" — le clic est alors
  // silencieusement ignoré, sans erreur visible). Sur desktop ça marche
  // car le navigateur est plus permissif. On génère donc chaque image en
  // Blob (voir plus bas pour le téléchargement + la galerie de secours
  // garantie sur mobile) — navigator.share() a été essayé puis retiré :
  // trop peu fiable, voir le second BUG FIX plus bas. Sur mobile, ce
  // bouton reste réservé au desktop dans l'UI (voir isMobileDevice
  // dans renderGbizPagePreview) : html2canvas n'y étant pas fiable, le
  // téléchargement par page et l'aperçu capture d'écran ont été
  // essayés et retirés à la demande de Will — à revoir plus tard.
  const blobs = [];
  for(let i=0;i<pages.length;i++){
    try{
      const result = await renderGbizPageToBlob(css, pages, i, restName, bg);
      blobs.push(result);
    } catch(err){
      console.error(err);
      showToast('⚠ Erreur génération image '+(i+1));
    }
  }

  if(!blobs.length) return;

  const urls = blobs.map(b=>({ url: URL.createObjectURL(b.blob), name: b.name, pageIndex: b.pageIndex, totalPages: pages.length }));

  // BUG FIX (desktop cassé) : navigator.share() a été retiré. Même
  // protégé par try/catch, il pouvait rester en attente indéfiniment
  // sans jamais réussir ni lever d'erreur sur certains navigateurs
  // desktop (aucun catch ne peut rattraper une promesse qui ne se
  // résout jamais) — ce qui bloquait toute la fonction en silence.
  // Retour à quelque chose de simple et fiable : téléchargement direct
  // (fonctionne sur desktop, comme à l'origine) + galerie visuelle
  // affichée systématiquement juste après (garantie sur mobile, appui
  // long pour enregistrer).
  try{
    urls.forEach(({url,name})=>{
      const link = document.createElement('a');
      link.download = name;
      link.href = url;
      link.click();
    });
  } catch(err){ console.error(err); }

  try{ showGbizResultGallery(urls); } catch(err){ console.error(err); }
}

// Galerie de secours garantie : affiche chaque image générée directement
// à l'écran (appui long pour enregistrer sur mobile, clic droit sur
// desktop) — voir le BUG FIX ci-dessus dans exportGbizImage. Les URLs
// blob restent valides tant que la modale est ouverte ; libérées à la
// fermeture.
function showGbizResultGallery(images){
  const old = document.getElementById('gbizResultModal');
  if(old){ old.querySelectorAll('img').forEach(img=>{ try{ URL.revokeObjectURL(img.src); }catch(e){} }); old.remove(); }
  // Toujours trier par position réelle dans le menu (pageIndex) — si une
  // page a échoué, les suivantes gardent leur vrai numéro (ex. "Page
  // 3/5") au lieu d'être renumérotées à la suite ("Page 2/4"), ce qui
  // donnait l'impression trompeuse d'un ordre mélangé.
  const sorted = [...images].sort((a,b)=>(a.pageIndex??0)-(b.pageIndex??0));
  const totalPages = sorted[0] && sorted[0].totalPages ? sorted[0].totalPages : sorted.length;
  const missingNote = sorted.length < totalPages
    ? `<div style="color:#ffb4b0;font-family:Jost,sans-serif;font-size:12px;text-align:center;margin-bottom:14px">⚠️ ${totalPages - sorted.length} page(s) sur ${totalPages} n'ont pas pu être générée(s) — regénère si besoin.</div>`
    : '';
  const modal = document.createElement('div');
  modal.id = 'gbizResultModal';
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9500;display:flex;flex-direction:column;align-items:center;padding:22px 14px;overflow-y:auto;-webkit-overflow-scrolling:touch';
  modal.innerHTML = `
    <div style="width:100%;max-width:480px;display:flex;flex-direction:column;align-items:center">
      <button id="gbizResultClose" style="align-self:flex-end;background:none;border:none;color:#fff;font-size:28px;line-height:1;cursor:pointer;margin-bottom:8px;opacity:.85;padding:4px 8px">✕</button>
      <div style="color:rgba(255,255,255,.8);font-family:Jost,sans-serif;font-size:12.5px;text-align:center;margin-bottom:18px;line-height:1.6">📱 Sur téléphone : appuie <b>longuement</b> sur une image ci-dessous, puis "Enregistrer l'image".<br>💻 Sur ordinateur : clic droit → "Enregistrer l'image sous…".</div>
      ${missingNote}
      ${sorted.map(im=>`
        <div style="width:100%;margin-bottom:24px;text-align:center">
          <img src="${im.url}" style="width:100%;border-radius:10px;display:block;box-shadow:0 4px 24px rgba(0,0,0,.45)">
          <div style="margin-top:9px;display:flex;align-items:center;justify-content:center;gap:12px">
            <span style="color:rgba(255,255,255,.55);font-family:Jost,sans-serif;font-size:11.5px">Page ${(im.pageIndex??0)+1}/${totalPages}</span>
            <a href="${im.url}" download="${im.name}" style="color:#fff;font-family:Jost,sans-serif;font-size:12px;font-weight:600;text-decoration:underline">Télécharger</a>
          </div>
        </div>`).join('')}
    </div>`;
  document.body.appendChild(modal);
  const cleanup = ()=>{ images.forEach(im=>{ try{ URL.revokeObjectURL(im.url); }catch(e){} }); modal.remove(); };
  document.getElementById('gbizResultClose').onclick = cleanup;
}

// Admin UI for the PDF style panel
// Section admin "Menu et Formule" — un brouillon pensé pour être
// ajusté ensuite : liste des formules (max 5), édition libre des
// catégories/plats (à la main ou importés du vrai menu), couleurs
// optionnelles (héritent de la marque par défaut, comme Instagram),
// et export Impression/Story/Post en réutilisant le moteur existant.
function renderFormulesSection(){
  formule_ensureInit();
  const realDishes = formule_getRealDishes();
  const importOptions = realDishes.map((d,i)=>`<option value="${i}">${d.name} — ${d.tabLabel}</option>`).join('');
  // Vraies couleurs de marque actuelles (Drevici etc.) comme défaut de
  // repli — pas un bleu générique — cohérent avec ce qu'affiche déjà
  // Instagram quand rien n'est explicitement changé.
  const brandCfg = pdfCfg();
  const brandNavy = brandCfg.titleColor || '#10285E';
  const brandBg = brandCfg.bgColor || '#FDFBF6';
  const defaultFor = key => key==='instaBgColor' ? brandBg
    : key==='instaDescColor' ? lightenHex(brandNavy, 0.28)
    : brandNavy;

  // Colonnes couleur + taille — Titre/Plat/Description ont chacun
  // leur propre curseur de taille (%) juste sous leur pastille de
  // couleur, pour ajuster tout en un coup d'œil juste au-dessus de
  // l'aperçu (demande explicite de Will). Fond n'a pas de taille
  // (c'est juste une couleur). La protection "jamais plus large que le
  // cadre" (rétrécissement automatique, jamais de retour à la ligne —
  // même mécanisme que Export du menu) continue de s'appliquer quoi
  // que ces curseurs demandent : un plat trop long au 150% choisi sera
  // ramené à une taille qui rentre, jamais au-delà du cadre.
  const colorRow = f => `<div style="display:flex;gap:6px;margin-top:10px;flex-wrap:nowrap;align-items:flex-start">
    ${[
      {key:'instaTitleColor', sizeKey:'titleSizePct', label:'Titre formule'},
      {key:'instaMenuColor', sizeKey:'menuSizePct', label:'Plat'},
      {key:'instaDescColor', sizeKey:'descSizePct', label:'Description'},
      {key:'instaBgColor', sizeKey:null, label:'Fond'}
    ].map(c=>`
      <div class="af" style="flex:1;min-width:0">

function renderPrintBody(){
  const cfg = pdfCfg();
  const ic = DATA.icones||{};
  const activeTab = cfg.exportTab || 'print'; // 'print' | 'gbiz' | 'insta'
  const logoSrc = cfg.logoData || getRestaurantLogo();

  const tabBtn = (id, label, disabled) => `<button ${disabled?'disabled title="Bientôt disponible"':`onclick="setPdfCfg('exportTab','${id}');renderAdminSection(adminCurrentTab)"`} style="flex:1;padding:9px 6px;font-family:Jost,sans-serif;font-size:12.5px;font-weight:600;border:1.5px solid var(--border);cursor:${disabled?'not-allowed':'pointer'};background:${activeTab===id?'var(--navy)':'#fff'};color:${activeTab===id?'#fff':disabled?'var(--text3)':'var(--text2)'};opacity:${disabled?0.55:1};border-radius:8px">${label}</button>`;
  const tabsHtml = `
    <div style="display:flex;gap:6px;margin-bottom:14px">
      ${tabBtn('print','Impression')}
      ${tabBtn('gbiz','Google Business')}
      ${tabBtn('insta','Instagram')}
    </div>`;

  const elementsAccordion = `<div class="admin-section collapsible collapsed" style="margin-bottom:10px;border:1px solid var(--border);border-radius:10px;overflow:hidden">
    <div class="admin-sect-title" onclick="toggleAdminSection(this)" style="cursor:pointer">Personnaliser votre menu</div>
    <div class="admin-sect-body">
      <div class="af">
        ${logoSrc ? `<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
          <img src="${logoSrc}" style="max-height:50px;max-width:120px;object-fit:contain;border:1px solid var(--border);border-radius:6px;padding:4px;background:#fff" onerror="this.style.display='none'">
        </div>` : ''}
        <label class="admin-toggle" style="margin-top:2px"><input type="checkbox" ${cfg.showLogo?'checked':''} onchange="setPdfCfg('showLogo',this.checked);renderAdminSection(adminCurrentTab)"><label>Afficher le logo</label></label>
      </div>

      ${(ic.main||ic.secondary)?`<label class="admin-toggle" style="margin-top:8px"><input type="checkbox" ${cfg.showIcons!==false?'checked':''} onchange="setPdfCfg('showIcons',this.checked)"><label>Afficher les icônes décoratives</label></label>
      <div style="font-size:10px;color:var(--text3);margin-top:3px">Si le logo est affiché, l'icône principale est masquée automatiquement.</div>`:''}

      <label class="admin-toggle" style="margin-top:8px"><input type="checkbox" ${cfg.showDots!==false?'checked':''} onchange="setPdfCfg('showDots',this.checked)"><label>Pointillés entre le plat et le prix</label></label>
      <label class="admin-toggle" style="margin-top:8px"><input type="checkbox" ${cfg.showCurrency!==false?'checked':''} onchange="setPdfCfg('showCurrency',this.checked)"><label>Afficher le symbole €</label></label>
      <label class="admin-toggle" style="margin-top:8px"><input type="checkbox" ${cfg.showFrame!==false?'checked':''} onchange="setPdfCfg('showFrame',this.checked)"><label>Cadre autour de la page</label></label>

      <div class="af" style="margin-top:10px"><label class="al">Texte personnalisé (pied de page)</label>
        <textarea class="ai" rows="2" placeholder="Ex : Fait maison, produits locaux…" oninput="setPdfCfg('footerCustomText',this.value)" style="width:100%;resize:vertical;font-family:Jost,sans-serif">${cfg.footerCustomText||''}</textarea>
      </div>

      <div class="af" style="margin-top:14px;text-align:center"><label class="al" style="font-size:15px;font-weight:800;color:var(--navy);letter-spacing:.03em">Saut de page par catégorie</label>
        ${DATA.tabs.filter(tb=>tb.id!=='__home').map(tb=>`<label class="admin-toggle" style="margin-top:4px"><input type="checkbox" ${tb.pdfPageBreakBefore?'checked':''} onchange="tb_setPageBreak('${tb.id}',this.checked)"><label>${t(tb.label)}</label></label>`).join('')}

  const previewHtml = activeTab==='print' ? `

          </div>`).join('')}
      </div>
      <div id="pdfCarouselDots" style="display:flex;justify-content:center;gap:6px;margin-top:10px">
        ${printPages.map((p,i)=>`<span class="pdf-carousel-dot" data-idx="${i}" style="width:${i===0?7:6}px;height:${i===0?7:6}px;border-radius:50%;background:${i===0?'var(--navy)':'var(--border)'}"></span>`).join('')}
      </div>
    </div>` : activeTab==='gbiz' ? renderGbizPagePreview() : activeTab==='insta' ? `
    <div class="af"><label class="al">Police du visuel</label>
      <select class="ai" style="font-size:13px" onchange="setPdfCfg('instaFont',this.value);renderAdminSection(adminCurrentTab)">
        ${INSTA_FONT_OPTIONS.map(f=>`<option value="${f}" ${cfg.instaFont===f?'selected':''}>${f}</option>`).join('')}
      </select>
    </div>
    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
      ${[
        {key:'instaTitleColor', sizeKey:'instaTitleSize', label:'Titre', color:cfg.instaTitleColor||cfg.titleColor||'#10285E', size:cfg.instaTitleSize||45, min:24, max:80},
