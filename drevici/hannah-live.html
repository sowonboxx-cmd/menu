<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hannah's table · live · Drevici Oyster</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#10285E">
<link rel="icon" href="seo/logo-pics-bar.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,700&family=Caveat:wght@700&family=Jost:wght@400;500;600;700&family=Baloo+2:wght@600;700;800&display=swap">
<link rel="stylesheet" href="media/fete/fete.css">
<style>
:root{--navy:#10285E;--gold:#C6A24A}
*{box-sizing:border-box;margin:0}
body{background:var(--navy);color:#fff;font-family:Jost,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 18px) 20px calc(env(safe-area-inset-bottom) + 22px);display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;font:600 11px Jost;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.65)}
.goal{text-align:center;font:600 12px Jost;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-top:28px;min-height:15px}
.big{text-align:center;font:800 84px/1 'Playfair Display',serif;margin-top:6px}
.big small{font-size:38px;color:rgba(255,255,255,.45)}
.sub{text-align:center;font:500 17px Jost;margin-top:6px}
.bar{height:8px;border-radius:9px;background:rgba(255,255,255,.14);margin-top:18px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--gold);border-radius:9px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.list{margin-top:18px;display:grid;gap:9px;flex:1;align-content:start}
.m{background:rgba(255,255,255,.08);border-radius:15px;padding:12px 14px;animation:in .5s ease}
.m b{display:block;font:700 22px/1 Caveat,cursive;color:var(--gold)}
.m p{font:italic 400 15px/1.45 'Playfair Display',serif;color:rgba(255,255,255,.88);margin-top:4px}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.draw{background:var(--gold);color:var(--navy);border-radius:18px;padding:14px 16px;margin-top:16px}
.draw b{display:block;font:700 17px Jost}.draw small{font:500 14px Jost}
.draw button{display:block;width:100%;margin-top:12px;background:var(--navy);color:#fff;border:0;border-radius:99px;font:600 16px Jost;padding:14px 0;cursor:pointer}
.win{font:800 26px/1.25 'Playfair Display',serif;margin-top:8px}
.win div{animation:in .6s ease both}
.win small{display:block;font:500 13px Jost;opacity:.75}

.story{display:block;margin:0 auto;border-radius:50%;padding:4px;background:conic-gradient(from 210deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5,#feda75)}
.story span{display:block;border-radius:50%;padding:4px;background:var(--bgc,#F6EEE2)}
.story img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover}
.story{width:96px;height:96px;margin-top:22px}.story span{width:88px;height:88px;--bgc:#10285E}
.goal{margin-top:14px}

:root{--pink:#E8336B;--yellow:#F6C945}
.big{font:800 96px/1 'Baloo 2',system-ui,sans-serif}
.big small{font-size:44px}
.goal{color:var(--yellow);font-family:'Baloo 2',system-ui;font-weight:800;font-size:14px}
.bar{height:12px}.bar i{background:var(--pink)}
.m{background:#fff;color:#10285E;border-radius:18px}
.m:nth-child(3n+2){background:#FFE9F0}.m:nth-child(3n){background:#FFF3C9}
.m b{color:var(--pink);font-size:24px}
.m p{color:#3d3a34}
.draw{background:var(--yellow);border-radius:22px}
.draw b{font:800 19px 'Baloo 2',system-ui}
.draw button{background:var(--pink);font:800 18px 'Baloo 2',system-ui}
.win{font-family:'Baloo 2',system-ui}
.hero{position:relative}
.glass{position:absolute;right:-4px;top:40px;width:70px;animation:wob 3s ease-in-out infinite;z-index:2}
.balloons{position:absolute;left:-4px;top:30px;width:78px;animation:floaty 5s ease-in-out infinite;z-index:2}
.spark{position:absolute;width:30px;animation:wob 2.4s ease-in-out infinite}

.adm{background:#fff;color:#10285E;border-radius:22px;padding:16px;margin-top:14px}
.adm>b{display:block;font:800 17px 'Baloo 2',system-ui}.adm>small{display:block;font:500 13px Jost;color:#6b6760;margin-top:2px}
.aw{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:12px 0 0;margin-top:12px;box-shadow:0 -1px 0 #eee}
.aw b{font:700 16px Jost}.aw small{font:500 13px Jost;color:#6b6760;grid-column:1}.aw code{font:800 15px 'Baloo 2',system-ui;color:#E8336B;letter-spacing:.06em}
.aw a{grid-row:1/span 3;grid-column:2;background:#E8336B;color:#fff;text-decoration:none;font:800 15px 'Baloo 2',system-ui;border-radius:99px;padding:10px 16px}
</style></head><body>
<div id="testbar" style="display:none;position:sticky;top:0;z-index:9;background:#b3261e;color:#fff;font:600 12px Jost,sans-serif;text-align:center;padding:6px">TEST · nothing is saved or counted · <a href="#" id="treset" style="color:#fff">reset</a> · <a href="hannah?test" style="color:#fff">guest page</a> · <a href="hannah-book?test" style="color:#fff">Hannah's book</a></div>
<div class="app">
  <div class="top"><span>Live · Hannah's table</span><span id="clock"></span></div>
  <div class="hero"><svg class="balloons" viewBox="0 0 96 150" aria-hidden="true"><path d="M30 70 Q34 100 26 148" stroke="#fff" stroke-width="1.3" fill="none" opacity=".6"/><path d="M66 62 Q60 100 70 148" stroke="#fff" stroke-width="1.3" fill="none" opacity=".6"/><ellipse cx="62" cy="34" rx="26" ry="31" fill="#3B82F6"/><path d="M62 65l-4 6h8z" fill="#3B82F6"/><ellipse cx="54" cy="24" rx="6" ry="10" fill="#fff" opacity=".35"/><ellipse cx="32" cy="42" rx="25" ry="30" fill="#E8336B"/><path d="M32 72l-4 6h8z" fill="#E8336B"/><ellipse cx="24" cy="32" rx="6" ry="10" fill="#fff" opacity=".35"/></svg><svg class="glass" viewBox="0 0 70 120" aria-hidden="true"><path d="M18 6h34l-3 40a14 14 0 0 1-28 0z" fill="#F6C945"/><path d="M20 6h30l-1 12H21z" fill="#fff" opacity=".55"/><circle cx="31" cy="30" r="2.4" fill="#fff"/><circle cx="40" cy="38" r="1.8" fill="#fff"/><circle cx="36" cy="24" r="1.6" fill="#fff"/><rect x="33" y="58" width="4" height="40" fill="#fff"/><rect x="20" y="96" width="30" height="6" rx="3" fill="#fff"/></svg><svg class="spark" style="left:110px;top:30px" viewBox="0 0 34 34" aria-hidden="true"><path d="M17 3v8M17 23v8M3 17h8M23 17h8" stroke="#F6C945" stroke-width="3.2" stroke-linecap="round"/></svg><svg class="spark" style="right:100px;top:110px;animation-delay:.9s" viewBox="0 0 34 34" aria-hidden="true"><path d="M17 3v8M17 23v8M3 17h8M23 17h8" stroke="#F6C945" stroke-width="3.2" stroke-linecap="round"/></svg><div class="story"><span><img src="media/hannah.jpg" alt="Hannah"></span></div></div>
  <div class="goal" id="goal"></div>
  <div class="big"><span id="n">0</span><small> / <span id="g">25</span></small></div>
  <div class="sub" id="sub">messages for Hannah</div>
  <div class="bar"><i id="bar"></i></div>
  <div class="list" id="list"></div>
  <div class="draw" id="draw"><b>The draw · after midnight</b><small>3 names will take Hannah to dinner · <span id="nn">0</span> in the hat</small></div>
  <div class="adm" id="adm" style="display:none"></div>
</div>
<script>
const SB='https://fdbzzkzfipzabryfanun.supabase.co', KEY='sb_publishable_9PaqDuXnWV3aOCBPk9ImmQ_4YgYTU9n';
// Mode test (?test) : rien n'est envoyé ni compté, tout reste sur ce téléphone.
const TEST=/[?&]test/.test(location.search);
const tst=()=>{try{return JSON.parse(localStorage.getItem('hannah-test'))||null}catch(e){return null}};
function mockRpc(fn,b){let st=tst()||{rows:[{first:'Sophie',msg:'To the woman who knows every good table in Paris. Love you!'},{first:'Marco',msg:'Tanti auguri Hannah!'},{first:'James',msg:'Another year of you being the best host in Paris.'}],n:18,drawn:[]};
  if(fn==='hannah_post'){const ex=st.rows.find(r=>r.email===b.p_email);if(ex){ex.msg=b.p_msg;ex.club=ex.club||b.p_club}else{st.rows.unshift({first:b.p_first,last:b.p_last,email:b.p_email,msg:b.p_msg,club:b.p_club});st.n++}
    const me=st.rows.find(r=>r.email===b.p_email);if(me.club&&!me.code)me.code='TEST-'+Math.random().toString(36).slice(2,5).toUpperCase();
    localStorage.setItem('hannah-test',JSON.stringify(st));return Promise.resolve({ok:true,count:st.n,code:me.code||null,first:me.first})}
  if(fn==='hannah_draw'){if(!st.drawn.length)st.drawn=[['Sophie','Martin','en'],['Marco','Rossi','en'],['Léa','Dubois','fr']].map(([f,l,g],i)=>({first:f,name:f+' '+l,email:f.toLowerCase()+'@example.com',lang:g,dinner:'DINER-'+['7KQ2','M4XA','R9TD'][i]}));localStorage.setItem('hannah-test',JSON.stringify(st));return Promise.resolve({ok:true,drawn:st.drawn})}
  return Promise.resolve({count:st.n,goal:25,latest:st.rows.slice(0,8).map(r=>({first:r.first,msg:r.msg})),drawn:st.drawn})}
const rpc=(fn,body)=>TEST?mockRpc(fn,body||{}):fetch(`${SB}/rest/v1/rpc/${fn}`,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(body||{})}).then(r=>r.json());
const key=new URLSearchParams(location.search).get('key');
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let shown='',winners=null;
function clock(){const d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}
function drawBox(n){const el=document.getElementById('draw');
  if(winners){el.innerHTML=`<b>They take Hannah to dinner</b><div class="win">${winners.map((w,i)=>`<div style="animation-delay:${i*.5}s">${esc(w.name)}</div>`).join('')}</div>`;return}
  el.innerHTML=`<b>The draw · after midnight</b><small>3 names will take Hannah to dinner · <span id="nn">${n}</span> in the hat</small>${(key||TEST)?'<button id="go">Draw 3 names</button>':''}`;
  const b=document.getElementById('go');if(b)b.onclick=async()=>{if(!confirm('Draw the 3 names now?'))return;b.disabled=true;const r=await rpc('hannah_draw',{p_key:key});if(r&&r.ok){winners=r.drawn;drawBox(n);admin(r.drawn);if(window.confettiBurst)confettiBurst()}else{alert('Wrong key');b.disabled=false}}}

// Admin (clé) : emails des 3 gagnants, à envoyer d'un geste
const RESA='https://drevici.beltab.app/resa';
function mail(w,all){const others=all.filter(x=>x!==w).map(x=>x.first).join(w.lang==='fr'?' et ':' and ');
  const fr=w.lang==='fr';
  const sub=fr?'Vous invitez Hannah à dîner chez Drevici':"You're taking Hannah to dinner at Drevici";
  const body=fr?`Bonjour ${w.first},

Votre nom est sorti du chapeau hier soir, à l'anniversaire de Hannah. Vous faites partie des 3 amis qui l'invitent à dîner chez Drevici Oyster : c'est votre cadeau pour elle.

Votre code : ${w.dinner}

Comment faire :
1. Choisissez une soirée avec ${others} et Hannah (du mardi au samedi).
2. Réservez votre table ici : ${RESA} et notez votre code dans le commentaire.
3. Montrez le code en arrivant. Les 3 huîtres de Hannah sont offertes par la maison.

Vous ne pouvez pas venir (vous repartez à l'étranger, par exemple) ? Passez votre code à un ami : c'est lui qui invitera Hannah à votre place. N'importe qui, sauf Will : c'est lui qui organise !

Valable jusqu'au 15 janvier 2027.

À très vite,
Will et toute l'équipe Drevici Oyster
8 rue Biot, Paris 17e`:`Hi ${w.first},

Your name came out of the hat last night at Hannah's birthday. You're one of the 3 friends taking Hannah to dinner at Drevici Oyster: your gift to her.

Your code: ${w.dinner}

How it works:
1. Pick an evening with ${others} and Hannah (Tuesday to Saturday).
2. Book your table here: ${RESA} and add your code in the comment.
3. Show the code when you arrive. Hannah's 3 oysters are on the house.

Can't make it (flying home soon, maybe)? Pass your code to a friend: they take Hannah to dinner in your place. Anyone except Will, he's the host!

Valid until 15 January 2027.

See you soon,
Will and everyone at Drevici Oyster
8 rue Biot, Paris 17e`;
  return 'mailto:'+encodeURIComponent(w.email)+'?subject='+encodeURIComponent(sub)+'&body='+encodeURIComponent(body)}
function admin(list){if(!list||!list.length||!list[0].email)return;const el=document.getElementById('adm');el.style.display='block';
  el.innerHTML='<b>Admin · emails to the 3 winners</b><small>Only you see this (key). One tap opens the email, ready to send.</small>'+list.map(w=>`<div class="aw"><b>${esc(w.name)}</b><small>${esc(w.email)}</small><code>${esc(w.dinner||'')}</code><a href="${mail(w,list)}">Email</a></div>`).join('')}
async function poll(){try{const r=await rpc('hannah_wall');if(!r||typeof r.count!=='number')return;
  const bott=r.count>=r.goal?1:0,next=r.goal;if(window._lb!==undefined&&bott>window._lb&&window.confettiBurst)confettiBurst();window._lb=bott;document.getElementById('n').textContent=r.count;document.getElementById('g').textContent=next;
  document.getElementById('bar').style.width=Math.min(100,r.count/r.goal*100)+'%';
  document.getElementById('goal').textContent=bott?'Bottle of Chardonnay unlocked':'';
  document.getElementById('sub').textContent=bott?'messages for Hannah · Chardonnay unlocked!':`messages for Hannah · ${next-r.count} more to pop the bottle`;
  const sig=JSON.stringify(r.latest);if(sig!==shown){shown=sig;document.getElementById('list').innerHTML=r.latest.slice(0,5).map(m=>`<div class="m"><b>${esc(m.first)}</b><p>${esc(m.msg)}</p></div>`).join('')}
  if(!winners&&r.drawn&&r.drawn.length){winners=r.drawn;if(key||TEST)rpc('hannah_draw',{p_key:key}).then(d=>d&&d.ok&&admin(d.drawn))}
  drawBox(r.count);
}catch(e){}}
clock();setInterval(clock,10000);poll();setInterval(poll,5000);
if(TEST){document.getElementById('testbar').style.display='block';document.getElementById('treset').onclick=e=>{e.preventDefault();localStorage.removeItem('hannah-test');localStorage.removeItem('hannah-me-test');location.reload()}}
</script>
<script src="media/fete/fete.js"></script>
</body></html>
