<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex,nofollow">
<title>Tarifs — Kuisto Club</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F5F5F7;--white:#fff;--text:#16202A;--text2:#5B6572;--text3:#98A1AB;
  --border:#E9EAEC;--blue:#2F6FE0;--rs:20px;
}
html{scroll-behavior:smooth;scroll-padding-top:130px}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5}

/* top bar — same black bar as the guide */
.bar{position:sticky;top:0;z-index:20;background:#000;color:#fff}
.bar-in{max-width:1100px;margin:0 auto;padding:0 20px;height:54px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:9px;font-size:15px;letter-spacing:-.01em;text-decoration:none;color:#fff}
.brand svg{width:20px;height:20px}
.brand b{font-weight:800}
.brand span{font-weight:400}
.brand i{font-style:normal;color:#8e8e93;font-weight:500;margin-left:4px}
.bar-sp{flex:1}
.btn{border:none;border-radius:999px;padding:8px 16px;font:600 13px 'Inter',sans-serif;cursor:pointer;white-space:nowrap}
.btn-ghost{background:#1f1f22;color:#fff}
.btn-ghost:hover{background:#2c2c30}
.btn-blue{background:var(--blue);color:#fff}
.btn-blue:hover{opacity:.9}
.btn-light{background:#EDEDF0;color:var(--text)}
.btn[disabled]{opacity:.5;cursor:default}

/* section chips */
.chips{position:sticky;top:54px;z-index:15;background:rgba(245,245,247,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.chips-in{max-width:1100px;margin:0 auto;padding:10px 20px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chips-in::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;background:#fff;border:1px solid var(--border);font-size:13px;font-weight:600;color:var(--text2);text-decoration:none;white-space:nowrap}
.chip:hover{color:var(--text);border-color:#d6d7db}

.wrap{max-width:1100px;margin:0 auto;padding:28px 20px 80px}
.intro{margin-bottom:22px}
.intro h1{font-size:clamp(28px,4vw,40px);font-weight:800;letter-spacing:-.03em;line-height:1.1}
.intro .meta{margin-top:6px;font-size:13px;color:var(--text3)}

/* rendered markdown */
.doc .lead{background:#fff;border-radius:var(--rs);padding:22px 26px;margin-bottom:16px;font-size:15px;color:var(--text2)}
.card{background:#fff;border-radius:var(--rs);padding:26px 28px;margin-bottom:16px}
.card h2{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:14px}
.card h3{font-size:16px;font-weight:700;margin:22px 0 10px}
.card h3:first-child{margin-top:0}
.doc p{font-size:15px;color:var(--text2);margin:10px 0}
.doc strong{color:var(--text);font-weight:700}
.doc ul{margin:10px 0 10px 18px;font-size:15px;color:var(--text2)}
.doc li{margin:4px 0}
.doc li ul{margin:4px 0 6px 16px}
.doc hr{display:none}
.doc code{font-size:13px;background:var(--bg);padding:1px 6px;border-radius:6px}
.tbl{margin:14px 0;border:1px solid var(--border);border-radius:14px;overflow:hidden}
.doc table{width:100%;border-collapse:collapse;font-size:14.5px}
.doc th{background:#F5F5F7;text-align:left;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);padding:11px 14px}
.doc td{padding:12px 14px;border-top:1px solid var(--border);color:var(--text2);vertical-align:top}
.doc td:first-child{color:var(--text);font-weight:600}
.doc td.num{white-space:nowrap;font-weight:700;color:var(--text)}

/* mobile: each table row becomes a small stacked card */
@media(max-width:640px){
  .bar-in,.chips-in,.wrap{padding-left:16px;padding-right:16px}
  .card{padding:20px 18px}
  .card h2{font-size:20px}
  .doc .lead{padding:18px}
  .tbl{border:none;border-radius:0}
  .doc table,.doc tbody,.doc tr,.doc td{display:block;width:100%}
  .doc thead{display:none}
  .doc tr{border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:10px}
  .doc td{border:none;padding:3px 0;display:flex;justify-content:space-between;gap:14px}
  .doc td::before{content:attr(data-label);flex:0 1 42%;min-width:0;font-size:12px;font-weight:600;color:var(--text3)}
  .doc td.num{white-space:normal}
  .doc td:first-child{font-size:15px;padding-bottom:6px}
  .doc td:first-child::before{display:none}
  .doc td > span{flex:1 1 auto;min-width:0;text-align:right}
  .doc td:first-child > span{text-align:left}
  .doc td.long{display:block}
  .doc td.long::before{display:block;max-width:none;margin-bottom:2px}
  .doc td.long > span{text-align:left;display:block}
}

/* editor */
.editor{display:none}
body.editing .editor{display:grid}
body.editing .doc,body.editing .chips,body.editing #simSection{display:none}

/* ---------- Simulateur de revenus (déplacé depuis le guide : partie perso) ---------- */
#simSection{--navy:#0F2A3D;--accent:#6FA8FF;--rs:16px;--apero:#C9932E;--base:#6b7280;--premium:#D2566B;--agence:#7C5CD6;--services:#0E8F7A;margin-top:28px}
#simSection .sim-eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:4px}
#simSection .sim-sub{font-size:15px;color:var(--text2);margin:0 0 20px}
#simSection .sim-note{font-size:13px;color:var(--text3);font-style:italic}
/* ── SIMULATOR ── */
/* ── SIMULATOR ── */
.sim-wrap{display:grid;grid-template-columns:200px 1fr;gap:20px;align-items:start}
@media(max-width:700px){.sim-wrap{grid-template-columns:1fr}}

/* Offer blocks stacked vertically */
.sim-offers-col{display:flex;flex-direction:column;gap:10px}
.sim-block{background:#fff;border-radius:var(--rs);border:1px solid var(--border);overflow:hidden}
.sim-block-hdr{padding:9px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.sim-block-name{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.sim-block-body{padding:10px 14px}
.sim-main-counter{display:flex;align-items:center;justify-content:space-between}
.sim-main-label{font-size:12px;color:var(--text2)}
.sim-counter{display:flex;align-items:center;gap:5px}
.sim-counter-btn{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:#fff;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text2);transition:all .12s;line-height:1;font-weight:300}
.sim-counter-btn:hover{border-color:var(--navy);color:var(--navy)}
.sim-counter-val{width:28px;text-align:center;font-size:15px;font-weight:700;color:var(--navy)}
.sim-price-line{font-size:10px;color:var(--text3);margin-top:6px;line-height:1.5}
/* Options block (full width below) */
.sim-opts-block{background:#fff;border-radius:var(--rs);border:1px solid var(--border);overflow:hidden;margin-top:12px}
.sim-opt-row{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid #f5f2ee;font-size:12px}
.sim-opt-row:last-child{border-bottom:none}
.sim-opt-name{flex:1;color:var(--text2)}
.sim-opt-price{font-weight:600;color:var(--navy);white-space:nowrap;font-size:11px;min-width:50px;text-align:right}
/* Prestation accordion (title + expandable option list, each with its own quantity) */
.sim-presta-item{}
.sim-presta-hdr{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 14px;cursor:pointer;user-select:none;font-size:12px;border-top:1px solid #ece6dd}
.sim-presta-title{font-weight:600;color:var(--navy)}
.sim-presta-arrow{font-size:10px;color:var(--text3);transition:transform .15s;flex:none}
.sim-presta-item.open .sim-presta-arrow{transform:rotate(180deg)}
.sim-presta-body{display:none;padding:0 14px 6px 14px}
.sim-presta-item.open .sim-presta-body{display:block}
.sim-presta-opt-row{display:flex;align-items:center;gap:8px;padding:6px 0 6px 14px;font-size:12px;border-top:1px dashed #efe9e2}
.sim-presta-opt-row:first-child{border-top:none}
/* Projection 4 boxes */
.sim-projection{background:var(--navy);border-radius:var(--rs);padding:20px;color:#fff;margin-bottom:16px}
.sim-proj-boxes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
@media(max-width:700px){.sim-proj-boxes{grid-template-columns:repeat(2,1fr)}}
.sim-proj-box{background:rgba(255,255,255,.08);border-radius:8px;padding:12px 14px}
.sim-proj-box.total{background:rgba(111,168,255,.2);border:1px solid rgba(111,168,255,.35)}
.sim-proj-label{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.45);margin-bottom:6px}
.sim-proj-val{font-size:22px;font-weight:700;color:#fff;line-height:1}
.sim-proj-box.total .sim-proj-val{color:var(--accent);font-size:24px}
/* Timeline */
.sim-timeline{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
@media(max-width:700px){.sim-timeline{grid-template-columns:repeat(4,1fr)}}
.sim-tl-cell{background:rgba(255,255,255,.06);border-radius:6px;padding:8px 6px;text-align:center}
.sim-tl-cell.yr{background:rgba(111,168,255,.18);border:1px solid rgba(111,168,255,.3)}
.sim-tl-label{font-size:9px;letter-spacing:.04em;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:4px}
.sim-tl-val{font-size:13px;font-weight:700;color:#fff}
.sim-tl-cell.yr .sim-tl-val{color:var(--accent)}
.sim-tl-sub{font-size:9px;color:rgba(255,255,255,.28);margin-top:2px}
.editor{grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.editor textarea{width:100%;min-height:72vh;border:1px solid var(--border);border-radius:var(--rs);padding:18px;font:13.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text);background:#fff;resize:vertical;outline:none}
.editor textarea:focus{border-color:var(--blue)}
.editor .preview{max-height:78vh;overflow:auto}
.ed-tabs{display:none}
@media(max-width:900px){
  .editor{grid-template-columns:1fr}
  .ed-tabs{display:flex;gap:6px;margin-bottom:10px}
  .editor.show-src .preview,.editor.show-prev textarea{display:none}
}
.state{font-size:12px;color:#8e8e93}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#16202A;color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
.err{background:#fff;border-radius:var(--rs);padding:24px;color:#b91c1c}
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <a class="brand" href="./">
      <svg viewBox="0 0 64 64" fill="#fff"><path d="M18 40c-7-1-11-6-11-12 0-7 6-12 13-11 2-6 7-10 12-10s10 4 12 10c7-1 13 4 13 11 0 6-4 11-11 12v6H18z"/><rect x="18" y="49" width="28" height="7" rx="2"/></svg>
      <b>KUISTO</b><span>CLUB</span><i>· Tarifs</i>
    </a>
    <div class="bar-sp"></div>
    <span class="state" id="state"></span>
    <button class="btn btn-ghost" id="editBtn" type="button">Modifier</button>
    <button class="btn btn-light" id="cancelBtn" type="button" style="display:none">Annuler</button>
    <button class="btn btn-blue" id="saveBtn" type="button" style="display:none">Enregistrer</button>
  </div>
</header>
<nav class="chips"><div class="chips-in" id="chips"></div></nav>

<main class="wrap">
  <div class="intro"><h1 id="title">Tarifs</h1><div class="meta" id="meta"></div></div>
  <div class="doc" id="doc"></div>
  <section class="card" id="simSection">
    <div class="sim-eyebrow">Projection financière · perso</div>
    <h2>Simulateur de revenus</h2>
    <p class="sim-sub">Ajustez le nombre de clients par formule et ajoutez les prestations pour projeter votre CA. Prix lus en direct depuis le guide (guide.json).</p>
    <div id="simContent"><p class="sim-note">Chargement…</p></div>
  </section>
  <div class="editor show-src" id="editor">
    <div class="ed-tabs"><button class="btn btn-light" type="button" data-v="src">Texte</button><button class="btn btn-light" type="button" data-v="prev">Aperçu</button></div>
    <textarea id="src" spellcheck="false"></textarea>
    <div class="preview doc" id="prev"></div>
  </div>
</main>
<div class="toast" id="toast"></div>

<script>
// Source of truth: guide/tarif.md in the GitHub repo. This page only reads and (optionally)
// writes that file — the same GitHub token as the guide's admin mode (stored under
// "menu_gh_token" on this domain) is reused for saving.
const GH = { user:'sowonboxx-cmd', repo:'menu', path:'guide/tarif.md', branch:'main' };
const API = `https://api.github.com/repos/${GH.user}/${GH.repo}/contents/${GH.path}`;
const $ = id => document.getElementById(id);
let current = '', sha = null;

function token(){ try{ return localStorage.getItem('menu_gh_token') || ''; }catch(e){ return ''; } }
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),2200); }
const b64dec = s => decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
const b64enc = s => btoa(unescape(encodeURIComponent(s)));
const slug = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');

async function load(){
  const tk = token();
  try{
    if(tk){
      // API read: always the latest commit (GitHub Pages can lag a minute behind a save).
      const r = await fetch(API + '?ref=' + GH.branch, { headers:{ Authorization:'token '+tk }, cache:'no-store' });
      if(!r.ok) throw new Error('HTTP '+r.status);
      const j = await r.json(); sha = j.sha; current = b64dec(j.content);
    } else {
      const r = await fetch('tarif.md?v=' + Date.now(), { cache:'no-store' });
      if(!r.ok) throw new Error('HTTP '+r.status);
      current = await r.text();
    }
    render(current, $('doc'), true);
  }catch(e){
    $('doc').innerHTML = `<div class="err">Impossible de charger tarif.md (${e.message}).</div>`;
  }
}

// Markdown → cards: the intro (before the first "## ") becomes a lead block, then one white
// card per "## " section; tables get mobile labels.
function render(md, target, withChips){
  const html = marked.parse(md, { gfm:true, breaks:false });
  const tmp = document.createElement('div'); tmp.innerHTML = html;
  const h1 = tmp.querySelector('h1');
  if(withChips){
    $('title').textContent = h1 ? h1.textContent : 'Tarifs';
    const m = md.match(/Dernière mise à jour\s*:\s*([^\n.]+)/i);
    $('meta').textContent = m ? 'Mise à jour : ' + m[1].trim() : '';
    document.title = ($('title').textContent || 'Tarifs') + ' — Kuisto Club';
  }
  if(h1) h1.remove();
  const out = document.createElement('div');
  let box = document.createElement('div'); box.className = 'lead';
  const chips = [];
  [...tmp.childNodes].forEach(n=>{
    if(n.nodeType === 1 && n.tagName === 'H2'){
      if(box.childNodes.length) out.appendChild(box);
      box = document.createElement('section'); box.className = 'card';
      box.id = 'sec-' + slug(n.textContent);
      chips.push({ id: box.id, label: n.textContent.replace(/^\d+\.\s*/,'') });
    }
    box.appendChild(n);
  });
  if(box.childNodes.length) out.appendChild(box);
  out.querySelectorAll('table').forEach(t=>{
    const heads = [...t.querySelectorAll('thead th')].map(th=>th.textContent.trim());
    t.querySelectorAll('tbody tr').forEach(tr=>{
      [...tr.children].forEach((td,i)=>{
        td.setAttribute('data-label', heads[i] || '');
        const txt = td.textContent.trim();
        if(i>0 && /^[\d\s ]+[,.]?\d*\s*€/.test(txt) && txt.length < 40) td.classList.add('num');
        if(txt.length > 60) td.classList.add('long');
        td.innerHTML = `<span>${td.innerHTML}</span>`;
      });
    });
    const w = document.createElement('div'); w.className = 'tbl';
    t.parentNode.insertBefore(w, t); w.appendChild(t);
  });
  target.innerHTML = ''; target.appendChild(out);
  if(withChips) $('chips').innerHTML = chips.map(c=>`<a class="chip" href="#${c.id}">${c.label}</a>`).join('') + `<a class="chip" href="#simSection">Simulateur</a>`;
}

// ---------- editing ----------
function setEditing(on){
  document.body.classList.toggle('editing', on);
  $('editBtn').style.display = on ? 'none' : '';
  $('cancelBtn').style.display = on ? '' : 'none';
  $('saveBtn').style.display = on ? '' : 'none';
  if(on){ $('src').value = current; render(current, $('prev'), false); window.scrollTo(0,0); }
}
$('editBtn').onclick = ()=>{
  if(!token()){
    const t = prompt('Token GitHub (le même que pour le mode admin du guide) :','');
    if(!t) return;
    try{ localStorage.setItem('menu_gh_token', t.trim()); }catch(e){}
    load().then(()=>setEditing(true));
    return;
  }
  setEditing(true);
};
$('cancelBtn').onclick = ()=>{
  if($('src').value !== current && !confirm('Abandonner les modifications ?')) return;
  setEditing(false);
};
let prevTimer = null;
$('src').addEventListener('input', ()=>{
  clearTimeout(prevTimer);
  prevTimer = setTimeout(()=>render($('src').value, $('prev'), false), 200);
});
document.querySelectorAll('.ed-tabs button').forEach(b=>b.onclick = ()=>{
  $('editor').classList.toggle('show-src', b.dataset.v === 'src');
  $('editor').classList.toggle('show-prev', b.dataset.v === 'prev');
});
$('saveBtn').onclick = async ()=>{
  const text = $('src').value;
  if(text === current){ setEditing(false); return; }
  $('saveBtn').disabled = true; $('state').textContent = 'Enregistrement…';
  try{
    const body = { message:'Tarifs — mise à jour ' + new Date().toLocaleString('fr-FR'), content:b64enc(text), branch:GH.branch };
    if(sha) body.sha = sha;
    const r = await fetch(API, { method:'PUT', headers:{ Authorization:'token '+token(), 'Content-Type':'application/json' }, body:JSON.stringify(body) });
    if(r.status === 409 || r.status === 422){
      throw new Error('le fichier a changé entre-temps — recharge la page, puis refais ta modification');
    }
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json(); sha = j.content.sha; current = text;
    render(current, $('doc'), true); setEditing(false);
    $('state').textContent = ''; toast('✓ Tarifs enregistrés sur GitHub');
  }catch(e){
    $('state').textContent = ''; alert('Enregistrement impossible : ' + e.message);
  }finally{
    $('saveBtn').disabled = false;
  }
};

// ---------- Simulateur de revenus ----------
// Code repris tel quel du guide (même calculs), alimenté par guide/guide.json : les prix des
// formules (offerMeta), des prestations (categories) et des modules (addonModules) restent
// ceux que tu modifies dans l'admin du guide.
let DATA = { offerMeta:{}, categories:[], addonModules:[] };
const SIM_BASE_OFFERS = [
  { id:'apero',     tagKey:'apero',   color:'var(--apero)' },
  { id:'entree',    tagKey:'base',    color:'var(--base)' },
  { id:'signature', tagKey:'premium', color:'var(--premium)' },
];

let simQ    = { apero:0, entree:0, signature:0 };
let simOpts = {}; // populated dynamically from DATA (features with price > 0)
let simAddons = {}; // populated dynamically from DATA.addonModules (monthly subscription add-ons)
let simPrestations = {}; // { name: { optionIndex: qty, ... } } — each option keeps its own quantity

function simGetMeta(tagKey){ return DATA.offerMeta[tagKey] || {}; }

// Build add-on modules list from DATA.addonModules: standalone, monthly subscription
function getSimAddons(){
  return (DATA.addonModules||[]).filter(function(m){ return (m.price||0) > 0 || (m.setup||0) > 0; });
}

// Build options list from DATA categories: all items with price > 0 (excludes Prestation items, which use options[])
// "Prestations" block: merges simple priced items AND multi-option (dropdown) items
// from all categories — includes the Prestation category items alongside the rest.
function getSimOptions(){
  const opts = [];
  (DATA.categories||[]).forEach(function(cat){
    (cat.items||[]).forEach(function(item){
      if(cat.prestation){
        const variants = (item.options||[]).filter(function(o){ return (o.price||0) > 0; });
        if(variants.length) opts.push({ type:'options', name: item.name, options: variants });
      } else if((item.price||0) > 0){
        opts.push({ type:'simple', id: item.name, name: item.name, price: item.price });
      }
    });
  });
  return opts;
}

function simAdjust(id, delta){
  simQ[id] = Math.max(0, (simQ[id]||0) + delta);
  const el = document.getElementById('sq_'+id);
  if(el) el.textContent = simQ[id];
  simRefresh();
}
function simAdjustOpt(name, delta){
  if(simOpts[name] === undefined) simOpts[name] = 0;
  simOpts[name] = Math.max(0, simOpts[name] + delta);
  const el = document.getElementById('so_'+btoa(name).replace(/=/g,''));
  if(el) el.textContent = simOpts[name];
  simRefresh();
}
function simAdjustAddon(name, delta){
  if(simAddons[name] === undefined) simAddons[name] = 0;
  simAddons[name] = Math.max(0, simAddons[name] + delta);
  const el = document.getElementById('sa_'+btoa(name).replace(/=/g,''));
  if(el) el.textContent = simAddons[name];
  simRefresh();
}
function simAdjustPrestation(name, optionIndex, delta){
  if(!simPrestations[name]) simPrestations[name] = {};
  const cur = simPrestations[name][optionIndex] || 0;
  simPrestations[name][optionIndex] = Math.max(0, cur + delta);
  const key = btoa(name).replace(/=/g,'');
  const el = document.getElementById('sp_'+key+'_'+optionIndex);
  if(el) el.textContent = simPrestations[name][optionIndex];
  simRefresh();
}

function simRefresh(){
  let monthly = 0, onboarding = 0, optionsTotal = 0, addonsMonthly = 0;

  SIM_BASE_OFFERS.forEach(function(o){
    const n = simQ[o.id] || 0;
    if(!n) return;
    const meta = simGetMeta(o.tagKey);
    monthly    += (meta.price || 0) * n;
    onboarding += (meta.setup || 0) * n;
  });

  getSimOptions().forEach(function(o){
    if(o.type === 'options'){
      const state = simPrestations[o.name] || {};
      o.options.forEach(function(opt, oi){
        const n = state[oi] || 0;
        if(!n) return;
        optionsTotal += (opt.price||0) * n;
      });
    } else {
      const n = simOpts[o.name] || 0;
      if(!n) return;
      optionsTotal += o.price * n;
    }
  });

  getSimAddons().forEach(function(m){
    const n = simAddons[m.name] || 0;
    if(!n) return;
    addonsMonthly += (m.price||0) * n;
    onboarding += (m.setup||0) * n;
  });

  monthly += addonsMonthly;
  const total = onboarding + monthly + optionsTotal;

  const setEl = function(id, txt){ const e=document.getElementById(id); if(e) e.textContent=txt; };
  setEl('simOnboarding', onboarding.toLocaleString('fr-FR') + ' €');
  setEl('simMonthly',    monthly.toLocaleString('fr-FR') + ' €/mois');
  setEl('simOptions',    optionsTotal.toLocaleString('fr-FR') + ' €');
  setEl('simTotal',      total.toLocaleString('fr-FR') + ' €');

  // Timeline
  const tl = document.getElementById('simTimeline');
  if(!tl) return;
  const periods = [
    {l:'M1', m:1, yr:false},{l:'M2', m:2, yr:false},{l:'M3', m:3, yr:false},
    {l:'M4', m:4, yr:false},{l:'M5', m:5, yr:false},{l:'M6', m:6, yr:false},
    {l:'1 an', m:12, yr:true},{l:'2 ans', m:24, yr:true},
  ];
  tl.innerHTML = '';
  periods.forEach(function(p){
    const recOnly = monthly * p.m;
    const withAll = onboarding + optionsTotal + recOnly;
    const cell = document.createElement('div');
    cell.className = 'sim-tl-cell' + (p.yr?' yr':'');
    const lbl = document.createElement('div'); lbl.className='sim-tl-label'; lbl.textContent=p.l;
    const val = document.createElement('div'); val.className='sim-tl-val'; val.textContent=recOnly.toLocaleString('fr-FR')+'€';
    cell.appendChild(lbl); cell.appendChild(val);
    if(onboarding + optionsTotal > 0){
      const sub = document.createElement('div'); sub.className='sim-tl-sub';
      sub.textContent = withAll.toLocaleString('fr-FR')+'€';
      cell.appendChild(sub);
    }
    tl.appendChild(cell);
  });
}

function renderSimulator(){
  const el = document.getElementById('simContent');
  if(!el) return;

  const opts = getSimOptions();
  // Sync simOpts / simPrestations with current options
  opts.forEach(function(o){
    if(o.type === 'options'){
      if(simPrestations[o.name]===undefined) simPrestations[o.name] = {};
    } else if(simOpts[o.name]===undefined) simOpts[o.name]=0;
  });

  const addons = getSimAddons();
  addons.forEach(function(m){ if(simAddons[m.name]===undefined) simAddons[m.name]=0; });

  // ── PROJECTION (top) ──
  const proj = document.createElement('div');
  proj.className = 'sim-projection';
  const projTitle = document.createElement('div');
  projTitle.style.cssText = 'font-size:18px;font-weight:700;color:#fff;margin-bottom:14px;font-family:Inter,sans-serif';
  projTitle.textContent = 'Projection CA';
  proj.appendChild(projTitle);

  const boxes = document.createElement('div');
  boxes.className = 'sim-proj-boxes';
  const boxData = [
    {id:'simOnboarding', label:'Onboarding', val:'0 €'},
    {id:'simMonthly',    label:'Récurrent mensuel', val:'0 €/mois'},
    {id:'simOptions',    label:'Prestations', val:'0 €'},
    {id:'simTotal',      label:'Total', val:'0 €', cls:'total'},
  ];
  boxData.forEach(function(b){
    const box = document.createElement('div');
    box.className = 'sim-proj-box' + (b.cls?' '+b.cls:'');
    const lbl = document.createElement('div'); lbl.className='sim-proj-label'; lbl.textContent=b.label;
    const val = document.createElement('div'); val.className='sim-proj-val'; val.id=b.id; val.textContent=b.val;
    box.appendChild(lbl); box.appendChild(val);
    boxes.appendChild(box);
  });
  proj.appendChild(boxes);

  const tlLbl = document.createElement('div');
  tlLbl.style.cssText='font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.35);margin-bottom:8px';
  tlLbl.textContent = 'Récurrent cumulé · ligne grise = avec onboarding + prestations';
  proj.appendChild(tlLbl);
  const tl = document.createElement('div'); tl.className='sim-timeline'; tl.id='simTimeline';
  proj.appendChild(tl);

  // ── MAIN GRID: offers stacked left, right panel ──
  const wrap = document.createElement('div');
  wrap.className = 'sim-wrap';

  // LEFT: 3 offer blocks stacked
  const offersCol = document.createElement('div');
  offersCol.className = 'sim-offers-col';
  

  SIM_BASE_OFFERS.forEach(function(o){
    const meta = simGetMeta(o.tagKey);
    const block = document.createElement('div'); block.className='sim-block';
    const hdr = document.createElement('div'); hdr.className='sim-block-hdr';
    const nameEl = document.createElement('span'); nameEl.className='sim-block-name';
    nameEl.style.color=o.color; nameEl.textContent=meta.name||o.id;
    hdr.appendChild(nameEl); block.appendChild(hdr);

    const body = document.createElement('div'); body.className='sim-block-body';
    const cr = document.createElement('div'); cr.className='sim-main-counter';
    const lbl = document.createElement('span'); lbl.className='sim-main-label'; lbl.textContent='Clients';
    const cnt = document.createElement('div'); cnt.className='sim-counter';
    const bm = document.createElement('button'); bm.className='sim-counter-btn'; bm.textContent='−';
    bm.addEventListener('click',(function(id){return function(){simAdjust(id,-1);};})(o.id));
    const vsp = document.createElement('span'); vsp.className='sim-counter-val'; vsp.id='sq_'+o.id; vsp.textContent='0';
    const bp = document.createElement('button'); bp.className='sim-counter-btn'; bp.textContent='+';
    bp.addEventListener('click',(function(id){return function(){simAdjust(id,1);};})(o.id));
    cnt.appendChild(bm); cnt.appendChild(vsp); cnt.appendChild(bp);
    cr.appendChild(lbl); cr.appendChild(cnt); body.appendChild(cr);

    const pl = document.createElement('div'); pl.className='sim-price-line';
    pl.textContent = (meta.price||0).toLocaleString('fr-FR')+'€/mois'
      +((meta.setup||0)>0?' · onb. '+(meta.setup||0).toLocaleString('fr-FR')+'€':'');
    body.appendChild(pl); block.appendChild(body);
    offersCol.appendChild(block);
  });
  // Mobile swipe indicator + dots
  const mobileNav = document.createElement('div');
  mobileNav.id = 'simMobileNav';
  mobileNav.style.cssText = 'display:none;align-items:center;justify-content:space-between;margin-top:8px;padding:0 2px';
  mobileNav.innerHTML = '<button id="simPrev" style="background:none;border:none;font-size:20px;color:var(--text3);cursor:pointer;padding:4px 8px">‹</button>'
    + '<div id="simDots" style="display:flex;gap:6px;align-items:center"></div>'
    + '<button id="simNext" style="background:none;border:none;font-size:20px;color:var(--text3);cursor:pointer;padding:4px 8px">›</button>';

  const outerCol = document.createElement('div');
  outerCol.appendChild(offersCol);
  outerCol.appendChild(mobileNav);
  // Reset button as last block in offers column
  const resetRow = document.createElement('div');
  resetRow.style.cssText = 'padding-top:4px';
  const resetBtn = document.createElement('button');
  resetBtn.style.cssText = 'width:100%;font-size:11px;padding:8px;border:1px solid var(--border);border-radius:var(--rs);background:#fff;color:var(--text3);cursor:pointer;font-family:Inter,sans-serif;font-weight:500;transition:all .12s';
  resetBtn.textContent = '↺ Réinitialiser';
  resetBtn.addEventListener('mouseover', function(){ this.style.borderColor='var(--navy)'; this.style.color='var(--navy)'; });
  resetBtn.addEventListener('mouseout',  function(){ this.style.borderColor='var(--border)'; this.style.color='var(--text3)'; });
  resetBtn.addEventListener('click', function(){
    simQ = { apero:0, entree:0, signature:0 };
    Object.keys(simOpts).forEach(k=>{ simOpts[k]=0; });
    Object.keys(simAddons).forEach(k=>{ simAddons[k]=0; });
    Object.keys(simPrestations).forEach(k=>{ simPrestations[k]={}; });
    renderSimulator();
  });
  resetRow.appendChild(resetBtn);
  offersCol.appendChild(resetRow);

  wrap.appendChild(outerCol);

  // RIGHT column: options block + add-on modules block stacked
  const rightCol = document.createElement('div');
  rightCol.style.cssText = 'display:flex;flex-direction:column;gap:16px';

  // RIGHT: options block
  const optsBlock = document.createElement('div'); optsBlock.className='sim-block';
  const optsHdr = document.createElement('div'); optsHdr.className='sim-block-hdr';
  const optsTitle = document.createElement('span'); optsTitle.className='sim-block-name';
  optsTitle.style.color='var(--agence)'; optsTitle.textContent='Prestations';
  optsHdr.appendChild(optsTitle); optsBlock.appendChild(optsHdr);

  if(opts.length === 0){
    const empty = document.createElement('div');
    empty.style.cssText='padding:16px;font-size:12px;color:var(--text3);font-style:italic;text-align:center';
    empty.textContent='Ajoutez un prix à vos prestations pour les voir ici';
    optsBlock.appendChild(empty);
  } else {
    opts.forEach(function(o){
      if(o.type === 'options'){
        const state = simPrestations[o.name] || {};
        const key = btoa(o.name).replace(/=/g,'');
        const item = document.createElement('div'); item.className='sim-presta-item';
        const hdr = document.createElement('div'); hdr.className='sim-presta-hdr';
        const nm = document.createElement('span'); nm.className='sim-opt-name sim-presta-title'; nm.textContent=o.name;
        const arrow = document.createElement('span'); arrow.className='sim-presta-arrow'; arrow.textContent='▾';
        hdr.appendChild(nm); hdr.appendChild(arrow);
        hdr.addEventListener('click', function(){ item.classList.toggle('open'); });
        item.appendChild(hdr);
        const body = document.createElement('div'); body.className='sim-presta-body';
        o.options.forEach(function(v, vi){
          const n = state[vi] || 0;
          const row = document.createElement('div'); row.className='sim-presta-opt-row';
          const lbl = document.createElement('span'); lbl.className='sim-opt-name'; lbl.textContent=v.label;
          const pr = document.createElement('span'); pr.className='sim-opt-price'; pr.textContent=(v.price||0).toLocaleString('fr-FR')+'€';
          const cnt = document.createElement('div'); cnt.className='sim-counter'; cnt.style.flexShrink='0';
          const bm = document.createElement('button'); bm.className='sim-counter-btn';
          bm.style.cssText='width:24px;height:24px;font-size:15px'; bm.textContent='−';
          bm.addEventListener('click',(function(nm2,vi2){return function(e){e.stopPropagation();simAdjustPrestation(nm2,vi2,-1);};})(o.name,vi));
          const vsp = document.createElement('span'); vsp.className='sim-counter-val';
          vsp.style.fontSize='13px'; vsp.id='sp_'+key+'_'+vi; vsp.textContent=String(n);
          const bp = document.createElement('button'); bp.className='sim-counter-btn';
          bp.style.cssText='width:24px;height:24px;font-size:15px'; bp.textContent='+';
          bp.addEventListener('click',(function(nm2,vi2){return function(e){e.stopPropagation();simAdjustPrestation(nm2,vi2,1);};})(o.name,vi));
          cnt.appendChild(bm); cnt.appendChild(vsp); cnt.appendChild(bp);
          row.appendChild(lbl); row.appendChild(pr); row.appendChild(cnt);
          body.appendChild(row);
        });
        item.appendChild(body);
        optsBlock.appendChild(item);
      } else {
        const row = document.createElement('div'); row.className='sim-opt-row';
        const nm = document.createElement('span'); nm.className='sim-opt-name'; nm.textContent=o.name;
        const pr = document.createElement('span'); pr.className='sim-opt-price'; pr.textContent=o.price.toLocaleString('fr-FR')+'€';
        const cnt = document.createElement('div'); cnt.className='sim-counter'; cnt.style.flexShrink='0';
        const key = btoa(o.name).replace(/=/g,'');
        const bm = document.createElement('button'); bm.className='sim-counter-btn';
        bm.style.cssText='width:24px;height:24px;font-size:15px';  bm.textContent='−';
        bm.addEventListener('click',(function(n){return function(){simAdjustOpt(n,-1);};})(o.name));
        const vsp = document.createElement('span'); vsp.className='sim-counter-val';
        vsp.style.fontSize='13px'; vsp.id='so_'+key; vsp.textContent='0';
        const bp = document.createElement('button'); bp.className='sim-counter-btn';
        bp.style.cssText='width:24px;height:24px;font-size:15px'; bp.textContent='+';
        bp.addEventListener('click',(function(n){return function(){simAdjustOpt(n,1);};})(o.name));
        cnt.appendChild(bm); cnt.appendChild(vsp); cnt.appendChild(bp);
        row.appendChild(nm); row.appendChild(pr); row.appendChild(cnt);
        optsBlock.appendChild(row);
      }
    });
  }
  rightCol.appendChild(optsBlock);

  // RIGHT (below options): add-on modules block — standalone, monthly subscription
  const addonsBlock = document.createElement('div'); addonsBlock.className='sim-block';
  const addonsHdr = document.createElement('div'); addonsHdr.className='sim-block-hdr';
  const addonsTitle = document.createElement('span'); addonsTitle.className='sim-block-name';
  addonsTitle.style.color='var(--services)'; addonsTitle.textContent='Modules complémentaires';
  addonsHdr.appendChild(addonsTitle); addonsBlock.appendChild(addonsHdr);

  if(addons.length === 0){
    const empty = document.createElement('div');
    empty.style.cssText='padding:16px;font-size:12px;color:var(--text3);font-style:italic;text-align:center';
    empty.textContent='Ajoutez un prix à vos modules complémentaires pour les voir ici';
    addonsBlock.appendChild(empty);
  } else {
    addons.forEach(function(m){
      const row = document.createElement('div'); row.className='sim-opt-row';
      const nm = document.createElement('span'); nm.className='sim-opt-name'; nm.textContent=m.name;
      const pr = document.createElement('span'); pr.className='sim-opt-price';
      pr.textContent = (m.price||0).toLocaleString('fr-FR')+'€/mois'
        + ((m.setup||0)>0 ? ' · onb. '+m.setup.toLocaleString('fr-FR')+'€' : '');
      const cnt = document.createElement('div'); cnt.className='sim-counter'; cnt.style.flexShrink='0';
      const key = btoa(m.name).replace(/=/g,'');
      const bm = document.createElement('button'); bm.className='sim-counter-btn';
      bm.style.cssText='width:24px;height:24px;font-size:15px'; bm.textContent='−';
      bm.addEventListener('click',(function(n){return function(){simAdjustAddon(n,-1);};})(m.name));
      const vsp = document.createElement('span'); vsp.className='sim-counter-val';
      vsp.style.fontSize='13px'; vsp.id='sa_'+key; vsp.textContent='0';
      const bp = document.createElement('button'); bp.className='sim-counter-btn';
      bp.style.cssText='width:24px;height:24px;font-size:15px'; bp.textContent='+';
      bp.addEventListener('click',(function(n){return function(){simAdjustAddon(n,1);};})(m.name));
      cnt.appendChild(bm); cnt.appendChild(vsp); cnt.appendChild(bp);
      row.appendChild(nm); row.appendChild(pr); row.appendChild(cnt);
      addonsBlock.appendChild(row);
    });
  }
  rightCol.appendChild(addonsBlock);
  wrap.appendChild(rightCol);

  el.innerHTML = '';
  el.appendChild(proj);
  el.appendChild(wrap);
  simRefresh();
}


async function loadSimData(){
  const tk = token();
  try{
    let txt;
    if(tk){
      const r = await fetch(`https://api.github.com/repos/${GH.user}/${GH.repo}/contents/guide/guide.json?ref=${GH.branch}`, { headers:{ Authorization:'token '+tk }, cache:'no-store' });
      if(!r.ok) throw new Error('HTTP '+r.status);
      txt = b64dec((await r.json()).content);
    } else {
      const r = await fetch('guide.json?v=' + Date.now(), { cache:'no-store' });
      if(!r.ok) throw new Error('HTTP '+r.status);
      txt = await r.text();
    }
    DATA = Object.assign({ offerMeta:{}, categories:[], addonModules:[] }, JSON.parse(txt));
    renderSimulator();
  }catch(e){
    $('simContent').innerHTML = `<p class="sim-note">Impossible de charger les prix du guide (${e.message}).</p>`;
  }
}

load();
loadSimData();
</script>
