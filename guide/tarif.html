<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex,nofollow">
<title>Tarifs — Kuisto Club</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F5F5F7;--white:#fff;--text:#16202A;--text2:#5B6572;--text3:#98A1AB;
  --border:#E9EAEC;--blue:#2F6FE0;--rs:20px;
}
html{scroll-behavior:smooth;scroll-padding-top:130px}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5}

/* top bar — same black bar as the guide */
.bar{position:sticky;top:0;z-index:20;background:#000;color:#fff}
.bar-in{max-width:1100px;margin:0 auto;padding:0 20px;height:54px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:9px;font-size:15px;letter-spacing:-.01em;text-decoration:none;color:#fff}
.brand svg{width:20px;height:20px}
.brand b{font-weight:800}
.brand span{font-weight:400}
.brand i{font-style:normal;color:#8e8e93;font-weight:500;margin-left:4px}
.bar-sp{flex:1}
.btn{border:none;border-radius:999px;padding:8px 16px;font:600 13px 'Inter',sans-serif;cursor:pointer;white-space:nowrap}
.btn-ghost{background:#1f1f22;color:#fff}
.btn-ghost:hover{background:#2c2c30}
.btn-blue{background:var(--blue);color:#fff}
.btn-blue:hover{opacity:.9}
.btn-light{background:#EDEDF0;color:var(--text)}
.btn[disabled]{opacity:.5;cursor:default}

/* section chips */
.chips{position:sticky;top:54px;z-index:15;background:rgba(245,245,247,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.chips-in{max-width:1100px;margin:0 auto;padding:10px 20px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chips-in::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;background:#fff;border:1px solid var(--border);font-size:13px;font-weight:600;color:var(--text2);text-decoration:none;white-space:nowrap}
.chip:hover{color:var(--text);border-color:#d6d7db}

.wrap{max-width:1100px;margin:0 auto;padding:28px 20px 80px}
.intro{margin-bottom:22px}
.intro h1{font-size:clamp(28px,4vw,40px);font-weight:800;letter-spacing:-.03em;line-height:1.1}
.intro .meta{margin-top:6px;font-size:13px;color:var(--text3)}

/* rendered markdown */
.doc .lead{background:#fff;border-radius:var(--rs);padding:22px 26px;margin-bottom:16px;font-size:15px;color:var(--text2)}
.card{background:#fff;border-radius:var(--rs);padding:26px 28px;margin-bottom:16px}
.card h2{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:14px}
.card h3{font-size:16px;font-weight:700;margin:22px 0 10px}
.card h3:first-child{margin-top:0}
.doc p{font-size:15px;color:var(--text2);margin:10px 0}
.doc strong{color:var(--text);font-weight:700}
.doc ul{margin:10px 0 10px 18px;font-size:15px;color:var(--text2)}
.doc li{margin:4px 0}
.doc li ul{margin:4px 0 6px 16px}
.doc hr{display:none}
.doc code{font-size:13px;background:var(--bg);padding:1px 6px;border-radius:6px}
.tbl{margin:14px 0;border:1px solid var(--border);border-radius:14px;overflow:hidden}
.doc table{width:100%;border-collapse:collapse;font-size:14.5px}
.doc th{background:#F5F5F7;text-align:left;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);padding:11px 14px}
.doc td{padding:12px 14px;border-top:1px solid var(--border);color:var(--text2);vertical-align:top}
.doc td:first-child{color:var(--text);font-weight:600}
.doc td.num{white-space:nowrap;font-weight:700;color:var(--text)}

/* mobile: each table row becomes a small stacked card */
@media(max-width:640px){
  .bar-in,.chips-in,.wrap{padding-left:16px;padding-right:16px}
  .card{padding:20px 18px}
  .card h2{font-size:20px}
  .doc .lead{padding:18px}
  .tbl{border:none;border-radius:0}
  .doc table,.doc tbody,.doc tr,.doc td{display:block;width:100%}
  .doc thead{display:none}
  .doc tr{border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:10px}
  .doc td{border:none;padding:3px 0;display:flex;justify-content:space-between;gap:14px}
  .doc td::before{content:attr(data-label);flex:0 1 42%;min-width:0;font-size:12px;font-weight:600;color:var(--text3)}
  .doc td.num{white-space:normal}
  .doc td:first-child{font-size:15px;padding-bottom:6px}
  .doc td:first-child::before{display:none}
  .doc td > span{flex:1 1 auto;min-width:0;text-align:right}
  .doc td:first-child > span{text-align:left}
  .doc td.long{display:block}
  .doc td.long::before{display:block;max-width:none;margin-bottom:2px}
  .doc td.long > span{text-align:left;display:block}
}

/* editor */
.editor{display:none}
body.editing .editor{display:grid}
body.editing .doc,body.editing .chips{display:none}
.editor{grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.editor textarea{width:100%;min-height:72vh;border:1px solid var(--border);border-radius:var(--rs);padding:18px;font:13.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text);background:#fff;resize:vertical;outline:none}
.editor textarea:focus{border-color:var(--blue)}
.editor .preview{max-height:78vh;overflow:auto}
.ed-tabs{display:none}
@media(max-width:900px){
  .editor{grid-template-columns:1fr}
  .ed-tabs{display:flex;gap:6px;margin-bottom:10px}
  .editor.show-src .preview,.editor.show-prev textarea{display:none}
}
.state{font-size:12px;color:#8e8e93}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#16202A;color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
.err{background:#fff;border-radius:var(--rs);padding:24px;color:#b91c1c}
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <a class="brand" href="./">
      <svg viewBox="0 0 64 64" fill="#fff"><path d="M18 40c-7-1-11-6-11-12 0-7 6-12 13-11 2-6 7-10 12-10s10 4 12 10c7-1 13 4 13 11 0 6-4 11-11 12v6H18z"/><rect x="18" y="49" width="28" height="7" rx="2"/></svg>
      <b>KUISTO</b><span>CLUB</span><i>· Tarifs</i>
    </a>
    <div class="bar-sp"></div>
    <span class="state" id="state"></span>
    <button class="btn btn-ghost" id="editBtn" type="button">Modifier</button>
    <button class="btn btn-light" id="cancelBtn" type="button" style="display:none">Annuler</button>
    <button class="btn btn-blue" id="saveBtn" type="button" style="display:none">Enregistrer</button>
  </div>
</header>
<nav class="chips"><div class="chips-in" id="chips"></div></nav>

<main class="wrap">
  <div class="intro"><h1 id="title">Tarifs</h1><div class="meta" id="meta"></div></div>
  <div class="doc" id="doc"></div>
  <div class="editor show-src" id="editor">
    <div class="ed-tabs"><button class="btn btn-light" type="button" data-v="src">Texte</button><button class="btn btn-light" type="button" data-v="prev">Aperçu</button></div>
    <textarea id="src" spellcheck="false"></textarea>
    <div class="preview doc" id="prev"></div>
  </div>
</main>
<div class="toast" id="toast"></div>

<script>
// Source of truth: guide/tarif.md in the GitHub repo. This page only reads and (optionally)
// writes that file — the same GitHub token as the guide's admin mode (stored under
// "menu_gh_token" on this domain) is reused for saving.
const GH = { user:'sowonboxx-cmd', repo:'menu', path:'guide/tarif.md', branch:'main' };
const API = `https://api.github.com/repos/${GH.user}/${GH.repo}/contents/${GH.path}`;
const $ = id => document.getElementById(id);
let current = '', sha = null;

function token(){ try{ return localStorage.getItem('menu_gh_token') || ''; }catch(e){ return ''; } }
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),2200); }
const b64dec = s => decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
const b64enc = s => btoa(unescape(encodeURIComponent(s)));
const slug = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');

async function load(){
  const tk = token();
  try{
    if(tk){
      // API read: always the latest commit (GitHub Pages can lag a minute behind a save).
      const r = await fetch(API + '?ref=' + GH.branch, { headers:{ Authorization:'token '+tk }, cache:'no-store' });
      if(!r.ok) throw new Error('HTTP '+r.status);
      const j = await r.json(); sha = j.sha; current = b64dec(j.content);
    } else {
      const r = await fetch('tarif.md?v=' + Date.now(), { cache:'no-store' });
      if(!r.ok) throw new Error('HTTP '+r.status);
      current = await r.text();
    }
    render(current, $('doc'), true);
  }catch(e){
    $('doc').innerHTML = `<div class="err">Impossible de charger tarif.md (${e.message}).</div>`;
  }
}

// Markdown → cards: the intro (before the first "## ") becomes a lead block, then one white
// card per "## " section; tables get mobile labels.
function render(md, target, withChips){
  const html = marked.parse(md, { gfm:true, breaks:false });
  const tmp = document.createElement('div'); tmp.innerHTML = html;
  const h1 = tmp.querySelector('h1');
  if(withChips){
    $('title').textContent = h1 ? h1.textContent : 'Tarifs';
    const m = md.match(/Dernière mise à jour\s*:\s*([^\n.]+)/i);
    $('meta').textContent = m ? 'Mise à jour : ' + m[1].trim() : '';
    document.title = ($('title').textContent || 'Tarifs') + ' — Kuisto Club';
  }
  if(h1) h1.remove();
  const out = document.createElement('div');
  let box = document.createElement('div'); box.className = 'lead';
  const chips = [];
  [...tmp.childNodes].forEach(n=>{
    if(n.nodeType === 1 && n.tagName === 'H2'){
      if(box.childNodes.length) out.appendChild(box);
      box = document.createElement('section'); box.className = 'card';
      box.id = 'sec-' + slug(n.textContent);
      chips.push({ id: box.id, label: n.textContent.replace(/^\d+\.\s*/,'') });
    }
    box.appendChild(n);
  });
  if(box.childNodes.length) out.appendChild(box);
  out.querySelectorAll('table').forEach(t=>{
    const heads = [...t.querySelectorAll('thead th')].map(th=>th.textContent.trim());
    t.querySelectorAll('tbody tr').forEach(tr=>{
      [...tr.children].forEach((td,i)=>{
        td.setAttribute('data-label', heads[i] || '');
        const txt = td.textContent.trim();
        if(i>0 && /^[\d\s ]+[,.]?\d*\s*€/.test(txt) && txt.length < 40) td.classList.add('num');
        if(txt.length > 60) td.classList.add('long');
        td.innerHTML = `<span>${td.innerHTML}</span>`;
      });
    });
    const w = document.createElement('div'); w.className = 'tbl';
    t.parentNode.insertBefore(w, t); w.appendChild(t);
  });
  target.innerHTML = ''; target.appendChild(out);
  if(withChips) $('chips').innerHTML = chips.map(c=>`<a class="chip" href="#${c.id}">${c.label}</a>`).join('');
}

// ---------- editing ----------
function setEditing(on){
  document.body.classList.toggle('editing', on);
  $('editBtn').style.display = on ? 'none' : '';
  $('cancelBtn').style.display = on ? '' : 'none';
  $('saveBtn').style.display = on ? '' : 'none';
  if(on){ $('src').value = current; render(current, $('prev'), false); window.scrollTo(0,0); }
}
$('editBtn').onclick = ()=>{
  if(!token()){
    const t = prompt('Token GitHub (le même que pour le mode admin du guide) :','');
    if(!t) return;
    try{ localStorage.setItem('menu_gh_token', t.trim()); }catch(e){}
    load().then(()=>setEditing(true));
    return;
  }
  setEditing(true);
};
$('cancelBtn').onclick = ()=>{
  if($('src').value !== current && !confirm('Abandonner les modifications ?')) return;
  setEditing(false);
};
let prevTimer = null;
$('src').addEventListener('input', ()=>{
  clearTimeout(prevTimer);
  prevTimer = setTimeout(()=>render($('src').value, $('prev'), false), 200);
});
document.querySelectorAll('.ed-tabs button').forEach(b=>b.onclick = ()=>{
  $('editor').classList.toggle('show-src', b.dataset.v === 'src');
  $('editor').classList.toggle('show-prev', b.dataset.v === 'prev');
});
$('saveBtn').onclick = async ()=>{
  const text = $('src').value;
  if(text === current){ setEditing(false); return; }
  $('saveBtn').disabled = true; $('state').textContent = 'Enregistrement…';
  try{
    const body = { message:'Tarifs — mise à jour ' + new Date().toLocaleString('fr-FR'), content:b64enc(text), branch:GH.branch };
    if(sha) body.sha = sha;
    const r = await fetch(API, { method:'PUT', headers:{ Authorization:'token '+token(), 'Content-Type':'application/json' }, body:JSON.stringify(body) });
    if(r.status === 409 || r.status === 422){
      throw new Error('le fichier a changé entre-temps — recharge la page, puis refais ta modification');
    }
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json(); sha = j.content.sha; current = text;
    render(current, $('doc'), true); setEditing(false);
    $('state').textContent = ''; toast('✓ Tarifs enregistrés sur GitHub');
  }catch(e){
    $('state').textContent = ''; alert('Enregistrement impossible : ' + e.message);
  }finally{
    $('saveBtn').disabled = false;
  }
};

load();
</script>
</body>
</html>
